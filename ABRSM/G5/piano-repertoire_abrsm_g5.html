function sheetUrl(composer, title) {
    const q = encodeURIComponent(composer.split(',')[0] + ' ' + title + ' sheet music');
    return 'https://www.google.com/search?q=' + q;
}

const YT_API_KEY = "AIzaSyAUydn17tJCoduix-iv7f7bKfXweIrR6Mg"; // ← paste your key here

function useVideoModal() {
    const [modal, setModal] = React.useState(null); // { videoId, title }
    const open = React.useCallback(async (composer, title) => {
        setModal({ videoId: null, title: title, loading: true });
        try {
            const q = encodeURIComponent(composer.split(',')[0].trim() + ' ' + title + ' piano');
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&maxResults=1&key=${YT_API_KEY}`;
            const res = await fetch(url);
            const data = await res.json();
            const item = data.items && data.items[0];
            if (item) {
                setModal({ videoId: item.id.videoId, title: item.snippet.title, loading: false });
            } else {
                setModal(null);
                window.open('https://www.youtube.com/results?search_query=' + q, '_blank');
            }
        } catch(e) {
            setModal(null);
            const q = encodeURIComponent(composer.split(',')[0].trim() + ' ' + title + ' piano');
            window.open('https://www.youtube.com/results?search_query=' + q, '_blank');
        }
    }, []);
    const close = React.useCallback(() => setModal(null), []);
    return { modal, open, close };
}

function VideoModal({ modal, onClose }) {
    if (!modal) return null;
    return (
        <div onClick={onClose}
             style={{position:'fixed',top:0,right:0,bottom:0,left:0,background:'rgba(0,0,0,0.75)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}}>
            <div onClick={e => e.stopPropagation()}
                 style={{background:'#0f0f0f',borderRadius:'16px',overflow:'hidden',width:'100%',maxWidth:'800px',boxShadow:'0 25px 60px rgba(0,0,0,0.5)'}}>
                {/* Header */}
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',background:'#1a1a1a'}}>
                    <span style={{color:'#e2e8f0',fontSize:'13px',fontWeight:700,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingRight:'12px'}}>
                        {modal.loading ? 'Loading...' : modal.title}
                    </span>
                    <button onClick={onClose}
                            style={{color:'#94a3b8',background:'none',border:'none',cursor:'pointer',fontSize:'20px',lineHeight:1,padding:'4px',flexShrink:0}}>✕</button>
                </div>
                {/* Video */}
                <div style={{position:'relative',paddingBottom:'56.25%',height:0}}>
                    {modal.loading ? (
                        <div style={{position:'absolute',top:0,right:0,bottom:0,left:0,display:'flex',alignItems:'center',justifyContent:'center',color:'#94a3b8',fontSize:'14px'}}>
                            🎹 Searching...
                        </div>
                    ) : (
                        <iframe
                            src={`https://www.youtube.com/embed/${modal.videoId}?autoplay=1&rel=0`}
                            style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',border:'none'}}
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowFullScreen
                        />
                    )}
                </div>
            </div>
        </div>
    );
}

// ── PIECE CARD ────────────────────────────────────────────────────────────────
const LIST_BADGE_COLORS = { A: { bg: '#fff1f2', text: '#991b1b' }, B: { bg: '#fffbeb', text: '#92400e' }, C: { bg: '#eff6ff', text: '#1e40af' } };
function PieceCard({ piece, onOpenVideo }) {
    const eraConf = ERA_CONFIG[piece.era] || { label: piece.era, cls: 'tag-modern' };
    const wikiUrl = COMPOSER_LINKS[piece.c];
    const listColor = LIST_BADGE_COLORS[piece.l] || { bg: '#f1f5f9', text: '#64748b' };
    return (
        <div className="list-row">
            <div className="flex flex-wrap items-start justify-between gap-2">
                <div className="flex-1 min-w-0">
                    <div className="flex flex-wrap items-center gap-2 mb-1">
                        <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-bold ${eraConf.cls}`}>
                            {piece.era}
                        </span>
                        <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold" style={{background: listColor.bg, color: listColor.text}}>
                            List {piece.l}
                        </span>
                        <span className="text-xs text-slate-400">{piece.nat}</span>
                    </div>
                    <div className="font-semibold text-slate-800 leading-snug">{piece.t}</div>
                    <div className="text-sm text-slate-500 mt-0.5">
                        {wikiUrl
                            ? <a href={wikiUrl} target="_blank" rel="noopener noreferrer" className="composer-link">{piece.c}</a>
                            : <span>{piece.c}</span>
                        }
                    </div>
                    <div className="flex flex-wrap gap-1 mt-2">
                        {piece.focus.map((f,i) => (
                            <span key={i} className="inline-flex items-center px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-600">
                                {f}
                            </span>
                        ))}
                    </div>
                </div>
                <div className="flex items-center gap-1 shrink-0">
                    <button onClick={() => onOpenVideo(piece.c, piece.t)}
                       className="p-1.5 rounded-lg text-red-500 hover:text-red-600 hover:bg-red-50 transition-colors"
                       title="Play on YouTube">

                        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-2.75 12.06 12.06 0 0 0-12 1.09 11.89 11.89 0 0 0-1.09 12C4.63 20.5 8.13 22 12 22a12 12 0 0 0 12-12c0-1.17-.31-2.66-.41-3.31zM9.75 15.02V8.98L15.5 12z"/>
                        </svg>
                    </button>
                    <a href={sheetUrl(piece.c, piece.t)} target="_blank" rel="noopener noreferrer"
                       className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition-colors"
                       title="Search sheet music">
                        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M9 19V6l12-3v13M9 19c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm12-3c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
    const { modal: videoModal, open: openVideo, close: closeVideo } = useVideoModal();
    const [activeList, setActiveList] = useState('ALL');
    const [activeEra,  setActiveEra]  = useState('ALL');
    const [activeNat,  setActiveNat]  = useState('ALL');
    const [search,     setSearch]     = useState('');

    const data = DATA_ABRSM_G5;

    const lists = ['ALL', 'A', 'B', 'C'];
    const eras  = ['ALL', 'Baroque', 'Classical', 'Romantic', 'Modern', 'Contemporary'];
    const nats  = useMemo(() => {
        const s = new Set(data.map(p => p.nat));
        return ['ALL', ...Array.from(s).sort()];
    }, []);

    const filtered = useMemo(() => {
        return data.filter(p => {
            if (activeList !== 'ALL' && p.l !== activeList) return false;
            if (activeEra  !== 'ALL' && p.era !== activeEra)  return false;
            if (activeNat  !== 'ALL' && p.nat !== activeNat)  return false;
            if (search) {
                const q = search.toLowerCase();
                return p.c.toLowerCase().includes(q) || p.t.toLowerCase().includes(q);
            }
            return true;
        });
    }, [activeList, activeEra, activeNat, search]);

    const countByList = useMemo(() => {
        const c = {};
        data.forEach(p => c[p.l] = (c[p.l]||0)+1);
        return c;
    }, []);

    return (
        <div className="min-h-screen bg-[#f8edd4]">
            {/* Header */}
            <div>
                <div className="max-w-4xl mx-auto px-4 py-6 md:py-10">
                    <div className="flex flex-wrap items-start justify-between gap-3 mb-8">
                        <div>
                            <div className="flex items-center gap-2">
                                <div className="w-2 h-8 bg-[#3b4a6b] rounded-full"></div>
                                <h1 className="text-2xl font-black text-slate-800 tracking-tight">Piano Grade 5</h1>
                            </div>
                            <p className="text-[12px] text-slate-400 font-semibold uppercase tracking-widest mt-1 ml-4">2025 & 2026 Syllabus</p>
                        </div>
                        <div className="flex flex-col items-end gap-2 shrink-0">
                            <a href="../../index.html"
                               className="text-sm text-[#3b4a6b] hover:text-[#2a3550] font-semibold flex items-center gap-1">
                                ← Piano Butler
                            </a>
                            <div className="bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-100 text-right">
                                <span className="text-2xl font-black text-[#3b4a6b]">{data.length}</span>
                                <span className="text-[10px] text-slate-400 block font-bold uppercase">Pieces</span>
                            </div>
                        </div>
                    </div>

                    <div className="mb-3">
                        <a href="../../G5/piano-repertoire_g5.html"
                           className="inline-flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-full bg-[#eceef3] text-[#3b4a6b] hover:bg-[#dfe3ea]">
                            🇦🇺 Also see AMEB Grade 5
                        </a>
                    </div>

                                        <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar mb-6">
                        <span className="text-[10px] font-bold uppercase tracking-widest text-slate-400 shrink-0 mr-1">ABRSM grades</span>
                        {[
            {k:"Initial",h:"../Initial/piano-repertoire_abrsm_initial.html"},
            {k:"G1",h:"../G1/piano-repertoire_abrsm_g1.html"},
            {k:"G2",h:"../G2/piano-repertoire_abrsm_g2.html"},
            {k:"G3",h:"../G3/piano-repertoire_abrsm_g3.html"},
            {k:"G4",h:"../G4/piano-repertoire_abrsm_g4.html"},
            {k:"G5",h:"../G5/piano-repertoire_abrsm_g5.html"},
            {k:"G6",h:"../G6/piano-repertoire_abrsm_g6.html"},
            {k:"G7",h:"../G7/piano-repertoire_abrsm_g7.html"},
            {k:"G8",h:"../G8/piano-repertoire_abrsm_g8.html"},
            {k:"LRSM",h:"../Diploma/piano-repertoire_abrsm_lrsm.html"},
            {k:"FRSM",h:"../Diploma/piano-repertoire_abrsm_frsm.html"},
                        ].map(g => g.k === "G5" ? (
                            <span key={g.k} className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-[#3b4a6b] text-white shrink-0">{g.k}</span>
                        ) : (
                            <a key={g.k} href={g.h} className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-white border border-slate-200 text-slate-500 hover:border-[#aab6cc] hover:text-[#3b4a6b] shrink-0">{g.k}</a>
                        ))}
                    </div>

                    <div className="sticky top-4 z-20 mb-8">
                        <div className="bg-white/80 backdrop-blur-md p-3 rounded-2xl shadow-xl shadow-slate-200/50 border border-white">
                            {/* List tabs */}
                            <div className="flex gap-1.5 mb-2 overflow-x-auto no-scrollbar">
                                {lists.map(l => {
                                    const cnt = l === 'ALL' ? data.length : (countByList[l]||0);
                                    const isActive = activeList === l;
                                    const tabColors = {
                                        ALL: { active: "#3b4a6b", text: "#ffffff", bg: "#eceef3" },
                                        A:   { active: "#fca5a5", text: "#991b1b", bg: "#fff1f2" },
                                        B:   { active: "#fde68a", text: "#92400e", bg: "#fffbeb" },
                                        C:   { active: "#93c5fd", text: "#1e40af", bg: "#eff6ff" },
                                    };
                                    const tc = tabColors[l] || { active: "#cbd5e1", text: "#475569", bg: "#f8fafc" };
                                    return (
                                        <button key={l} onClick={() => setActiveList(l)}
                                            style={isActive ? { background: tc.active, color: tc.text, border: `2px solid ${tc.active}` } : { background: tc.bg, color: "#94a3b8", border: "2px solid transparent" }}
                                            className="flex-1 min-w-[60px] py-2 px-1 rounded-xl text-[11px] font-black transition-all flex flex-col items-center gap-0.5 shadow-sm">
                                            <span>{l === 'ALL' ? 'All' : `List ${l}`}</span>
                                            <span style={{ fontSize: "0.65rem", fontWeight: 600, opacity: isActive ? 0.85 : 0.6 }}>{cnt}</span>
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Era chips */}
                            <div className="flex gap-1 mb-2 overflow-x-auto no-scrollbar">
                                {eras.map(e => (
                                    <button key={e} onClick={() => setActiveEra(e)}
                                        className={`era-chip ${activeEra===e?'active':''}`}>
                                        {e === 'ALL' ? 'All' : e}
                                    </button>
                                ))}
                            </div>

                            {/* Search */}
                            <input
                                type="text"
                                placeholder="Search composer or title..."
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                                className="w-full px-5 py-3 bg-slate-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-[#eceef3] outline-none placeholder:text-slate-300"
                            />
                        </div>
                    </div>

                    {/* Nationality filter */}
                    <select value={activeNat} onChange={e => setActiveNat(e.target.value)}
                        className="text-sm border border-slate-200 rounded-lg px-2 py-1.5 text-slate-600 focus:outline-none focus:ring-2 focus:ring-[#3b4a6b] mt-1">
                        {nats.map(n => <option key={n} value={n}>{n === 'ALL' ? 'All nationalities' : n}</option>)}
                    </select>
                </div>
            </div>

            {/* Results */}
            <div className="max-w-4xl mx-auto px-4 py-6 md:py-10">
                <div className="text-sm text-slate-400 mb-3">{filtered.length} piece{filtered.length !== 1 ? 's' : ''} shown</div>
                {filtered.length === 0
                    ? <div className="text-center text-slate-400 py-16">No pieces found.</div>
                    : filtered.map((p, i) => <PieceCard onOpenVideo={openVideo} key={i} piece={p} />)
                }
            </div>
            <VideoModal modal={videoModal} onClose={closeVideo} />
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
