# Supabase Keep-Alive
# Free-tier Supabase projects auto-pause after 7 days of inactivity.
# This workflow pings the REST API every day so the project always
# registers activity, well inside Supabase's 7-day window. The anon
# key is already public (shipped in client-side code) and protected
# by Row Level Security.
#
# Bumped from twice-weekly to daily on 2026-08-17 after a Supabase
# dormancy-warning email arrived despite the twice-weekly pings
# running successfully (18/18 recent runs green). Root cause unclear
# (possibly a routine/lagged scan email, not a real gap) but daily
# pings leave far more margin either way. If these warning emails
# keep recurring even with daily pings, the only fully guaranteed fix
# is upgrading to Supabase Pro, which removes auto-pause entirely.

name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 22 * * *" # every day 22:00 UTC (~08:00 AEST)
  workflow_dispatch: {} # allows manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://icefqxaccclwasnfzgnp.supabase.co/rest/v1/students?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljZWZxeGFjY2Nsd2FzbmZ6Z25wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNjgzMTgsImV4cCI6MjA5MjY0NDMxOH0.lZ8BO_L8iOtET8RtUuk9trkf9bQbLqR8K6rKEfPtmtQ" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljZWZxeGFjY2Nsd2FzbmZ6Z25wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNjgzMTgsImV4cCI6MjA5MjY0NDMxOH0.lZ8BO_L8iOtET8RtUuk9trkf9bQbLqR8K6rKEfPtmtQ")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" -ge 500 ]; then
            echo "Supabase may be paused or down — check the dashboard."
            exit 1
          fi
