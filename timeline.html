// Real AMEB technical-work data for the chosen grade, if available (Prelim-G8 only —
// not ABRSM/Trinity, not Diploma grades). Returns null otherwise so callers fall back
// to generic wording.
function getTechnicalWork(syllabus, gradeKey) {
  if (syllabus !== 'AMEB') return null;
  if (typeof DATA_TECHNICAL_AMEB === 'undefined') return null;
  return DATA_TECHNICAL_AMEB[gradeKey] || null;
}

/* ── Per-piece helpers — used to make every phase (not just Technical) reference the
   student's actual pieces, using the corpus's existing era/focus metadata. ── */
// Separate, shorter copy from viva-voce.html's era content — that page explains eras for
// General Knowledge exam answers; this is a practising cue, a different job entirely.
const ERA_MUSICAL_TIPS = {
  Baroque: 'even touch, light pedal — let the independent lines speak clearly',
  Classical: 'clear phrasing in 2s and 4s, terraced dynamics, poised not rushed',
  Romantic: 'singing tone, purposeful rubato, let the melody lead the pedal',
  Modern: 'exact rhythm and dynamics as written — trust the markings on the page',
  Contemporary: 'exact rhythm and dynamics as written — trust the markings on the page',
};
function pieceLabel(p) { return (p && p.t) ? p.t + (p.c ? ' — ' + p.c : '') : null; }
function namedPieces(pieceObjs) { return (pieceObjs || []).filter(p => p && p.t).map(pieceLabel); }

/* ── Checklist builders — one per phase. Each returns the 3-5 concrete things to do

// focus = { pieces, technical, sightread, theory } — which of these the user said they

// they picked; if that empties a month's list, a general fallback line is shown instead
// so the plan never renders with a blank checklist.
function foundationChecklist(monthIdx, pieceObjs, grade, tech, focus) {
  focus = focus || {pieces:true,technical:true,sightread:true,theory:true};
  const names = namedPieces(pieceObjs);
  const stages = [
    [focus.pieces ? (names.length ? `Hands-separate read-through: ${names.join(', ')}` : `Choose and confirm your ${grade} repertoire`) : null,
     focus.technical ? (tech ? `Skim the ${grade} Technical Work Checklist below so nothing's a surprise later` : `Get a sense of the technical demands ahead so nothing's a surprise later`) : null,
     `Set a weekly practice schedule you can actually keep — see Week by week below`],
    [focus.pieces ? (names.length ? `Hands-together, slow tempo: ${names.join(', ')}` : `Begin hands-together practice, slow tempo, on each piece`) : null,
     focus.technical ? `Start a daily scale/arpeggio warm-up for ${grade}` : null,
     focus.pieces ? `Flag tricky bars as you find them — don't fix them yet, just note them` : null],
    [focus.pieces ? `Bring tempo up gradually, metronome on, no rushing` : null,
     focus.sightread ? `Begin daily sight-reading practice at ${grade} level (5–10 min)` : null,

function technicalChecklist(monthIdx, tech, grade, focus) {

    return [`Not a focus area for you this time — use this month to consolidate repertoire and sight-reading instead.`];
  }
  if (!tech) {
    return [`${grade} technical preparation — work through scales, arpeggios and technical exercises with your teacher's guidance.`];
  }
  const codes = tech.exercises.map(e => e.code).join(', ');
  const hasExtras = tech.sections.length > 1;

    [`Learn Technical Exercises ${codes} hands-separately`,

  const habitParts = [];

    }
    return [`Dynamics, articulation and phrasing on every piece`, `Stop playing through — start listening back after every run`];
  }
  if (monthIdx === 1) {
    const lines = [];
    if (focus.pieces) {
      if (named.length) {
        const eraLines = named.slice(0,2)
          .map(p => (p.era && ERA_MUSICAL_TIPS[p.era]) ? `${pieceLabel(p)} (${p.era}) — ${ERA_MUSICAL_TIPS[p.era]}` : null)

        lines.push(...(eraLines.length ? eraLines : [`Voicing and tone across your pieces`]));

    }

    return lines.length ? lines : [`Keep building steady, focused practice habits this month.`];

    [focus.technical ? techLine : null],
    [focus.theory ? `Theory/general knowledge: composer context, form, key terms — drill the actual gaps, not everything` : null],
    [focus.pieces ? `Back-to-back repertoire run-through in performance order — note stamina and where focus slips` : null],
  ];
  const stage = stages[Math.min(monthIdx, stages.length-1)].filter(Boolean);
  return stage.length ? stage : [`Keep consolidating what you've covered so far.`];
}
function polishChecklist(monthIdx, pieceObjs, grade, focus) {
  focus = focus || {pieces:true,technical:true,sightread:true,theory:true};
  const first = (pieceObjs || []).find(p => p && p.t);
  const firstLabel = first ? pieceLabel(first) : 'your first piece';
  const stages = [
    [`Mock run-through #1 — full run in order for ${grade}`,
     focus.pieces ? `Honest self (or teacher) feedback, especially on ${firstLabel}` : `Honest self (or teacher) feedback on how it's coming together`],
    [`Address mock feedback directly, area by area`, `Performance detail — the last 5% between good and great`],
    [`Mock run-through #2 under real conditions — room, clothes, walking in cold`, `Final refinements only — no new material`],
  ];
  return stages[Math.min(monthIdx, stages.length-1)];
}
function examChecklist(grade, focus) {
  focus = focus || {pieces:true,technical:true,sightread:true,theory:true};
  const lines = [`Light maintenance only — no new learning, no new fingerings`];
  if (focus.pieces) lines.push(`Run each piece once a day at performance tempo`);
  lines.push(`Trust the preparation — rest well before ${grade}`);
  return lines;
}

// Dispatches to the right checklist builder and pairs it with this month's lead sentence
// and this phase's weekly rhythm.
function buildMonthContent(phase, monthIdx, pieceObjs, tech, grade, focus) {
  const leadArr = MONTH_FOCUS[phase] || ['Continue focused practice.'];
  const lead = leadArr[Math.min(monthIdx, leadArr.length-1)];
  let checklist;
  switch (phase) {
    case 'foundation':    checklist = foundationChecklist(monthIdx, pieceObjs, grade, tech, focus); break;
    case 'technical':     checklist = technicalChecklist(monthIdx, tech, grade, focus); break;
    case 'musical':       checklist = musicalChecklist(monthIdx, pieceObjs, grade, focus); break;
    case 'consolidation': checklist = consolidationChecklist(monthIdx, pieceObjs, grade, tech, focus); break;
    case 'polish':        checklist = polishChecklist(monthIdx, pieceObjs, grade, focus); break;
    case 'exam':          checklist = examChecklist(grade, focus); break;
    default:               checklist = [];
  }
  const weekly = WEEKLY_TEMPLATES[phase] || WEEKLY_TEMPLATES.foundation;
  return { lead, checklist, weekly };
}

function monthsBetween(startDate, endDate) {
  const allMonths = [];
  const cursor = new Date(startDate); cursor.setDate(1);
  const endD = new Date(endDate); endD.setDate(1);
  while (cursor <= endD) {
    allMonths.push({ monthStr: cursor.toISOString().slice(0,7),
      label: cursor.toLocaleDateString('en-AU',{month:'short',year:'numeric'}) });
    cursor.setMonth(cursor.getMonth()+1);
  }
  return allMonths;
}

// Builds an explicit phase-per-month assignment based on how many months are actually
// available, rather than fixed percentage cutoffs (which duplicate phase labels on
// short timelines). Lower readiness compresses the early phases since less is "done"
// already; the exam month is always the last month.
function allocatePhases(total, readinessScore) {
  const readinessRatio = (readinessScore - 4) / 12; // 0 (least ready) .. 1 (most ready)
  const lowReadiness = readinessRatio < 0.4;

  if (total <= 1) return ['exam'];
  if (total === 2) return ['polish','exam'];
  if (total === 3) return lowReadiness ? ['technical','consolidation','exam'] : ['consolidation','polish','exam'];
  if (total === 4) return lowReadiness ? ['technical','musical','consolidation','exam'] : ['foundation','consolidation','polish','exam'];
  if (total === 5) return lowReadiness
    ? ['foundation','technical','musical','consolidation','exam']
    : ['foundation','technical','consolidation','polish','exam'];
  if (total === 6) return ['foundation','technical','musical','consolidation','polish','exam'];

  // 7+ months: build proportionally, then guarantee every phase gets ≥1 month and exam is last.
  const nonExam = total - 1;
  const weights = lowReadiness
    ? { foundation:0.22, technical:0.22, musical:0.18, consolidation:0.20, polish:0.18 }
    : { foundation:0.16, technical:0.20, musical:0.18, consolidation:0.24, polish:0.22 };
  const order = ['foundation','technical','musical','consolidation','polish'];
  let counts = order.map(k => Math.max(1, Math.round(weights[k]*nonExam)));
  let diff = nonExam - counts.reduce((a,b)=>a+b,0);
  let idx = counts.length - 1;
  while (diff !== 0) {
    counts[idx] = Math.max(1, counts[idx] + (diff > 0 ? 1 : -1));
    diff += diff > 0 ? -1 : 1;
    idx = (idx - 1 + counts.length) % counts.length;
  }
  const seq = [];
  order.forEach((k,i) => { for (let n=0;n<counts[i];n++) seq.push(k); });
  seq.push('exam');
  return seq;
}

function fillTemplate(str, vars) {
  return str.replace(/\{(\w+)\}/g, (m,k) => (vars[k] !== undefined && vars[k] !== '') ? vars[k] : m);
}

function buildTimeline(examDate, readinessScore, gradeLabel, syllabus, userPieces, gradeKey, focus) {
  const today = new Date(); today.setHours(12,0,0,0);
  const end = new Date(examDate + 'T12:00:00');
  if (isNaN(end.getTime()) || end <= today) return [];

  const allMonths = monthsBetween(today, end);
  const total = allMonths.length;
  if (total === 0) return [];

  const phaseSeq = allocatePhases(total, readinessScore);
  const vars = { grade: gradeLabel || 'this grade', syllabus: syllabus || '' };
  const pieceObjs = (userPieces || []).filter(p => p && p.t).slice(0,4);

  const tech = getTechnicalWork(syllabus, gradeKey);

  // Cycle of distinct suffixes appended once a phase's MONTH_FOCUS strings run out, so
  // long timelines (beyond ~17 months) never show the exact same paragraph two months
  // running — each repeat lap gets a different suffix before the cycle itself repeats.
  const OVERFLOW_SUFFIXES = [
    ' Keep going at this pace — steady repetition is what builds reliability here.',
    ' Use this extra time to deepen accuracy rather than rushing ahead.',
    ' Revisit anything that still feels uneven before moving on.',
  ];

  const phaseCounter = {};
  return allMonths.map((m,i) => {
    const phase = phaseSeq[i] || 'exam';
    const count = phaseCounter[phase] = (phaseCounter[phase] || 0);
    const content = buildMonthContent(phase, count, pieceObjs, tech, gradeLabel || 'this grade', focus);
    const leadArr = MONTH_FOCUS[phase] || [''];
    let lead = content.lead;
    if (count >= leadArr.length) {
      const lap = count - leadArr.length;
      lead = lead + OVERFLOW_SUFFIXES[lap % OVERFLOW_SUFFIXES.length];
    }
    phaseCounter[phase]++;
    return { ...m, phase, focus: fillTemplate(lead, vars), checklist: content.checklist, weekly: content.weekly };
  });
}

function monthsUntil(dateStr) {
  if (!dateStr) return null;
  const now = new Date(); const end = new Date(dateStr + 'T12:00:00');
  return Math.max((end.getFullYear()-now.getFullYear())*12 + (end.getMonth()-now.getMonth()), 0);
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const diff = Math.ceil((new Date(dateStr+'T12:00:00') - new Date()) / (1000*60*60*24));
  return Math.max(diff, 0);
}

/* ── Repertoire picks for the chosen grade (light-weight, deterministic-ish) ── */
function pickRepertoire(syllabus, gradeKey) {
  const pool = CORPUS.filter(p => p._syllabus === syllabus && p._gradeKey === gradeKey && p._type !== 'Leisure');
  if (pool.length === 0) return [];
  const byList = {};
  pool.forEach(p => { const l = p.l || p.grp || 'Open'; (byList[l] = byList[l]||[]).push(p); });
  const picks = [];
  Object.keys(byList).sort().forEach(l => {
    const arr = byList[l];
    picks.push(arr[Math.floor(Math.random()*arr.length)]);
  });
  return picks.slice(0,4);
}

/* ── Piece search for the chosen syllabus + grade (used by PieceInput) ── */
function searchGradePieces(syllabus, gradeKey, query) {
  const pool = CORPUS.filter(p => p._syllabus === syllabus && p._gradeKey === gradeKey);
  if (!query || query.trim().length < 1) return [];
  const q = query.trim().toLowerCase();
  return pool.filter(p => (p.t||'').toLowerCase().includes(q) || (p.c||'').toLowerCase().includes(q)).slice(0,8);
}

// Grouped browse list for the chosen grade — lets a student pick a piece by tapping
// through the list instead of having to know/type the exact title. Excludes Leisure
// (this tool is for exam preparation) and groups by List A/B/C/D so it's scannable.
function browseGradePieces(syllabus, gradeKey) {
  const pool = CORPUS.filter(p => p._syllabus === syllabus && p._gradeKey === gradeKey && p._type !== 'Leisure');
  const byList = {};
  pool.forEach(p => { const l = p.l || p.grp || 'Open'; (byList[l] = byList[l] || []).push(p); });
  const order = ['A','B','C','D','Collab','Open'];
  return order
    .filter(k => byList[k] && byList[k].length)
    .map(k => ({ list: k, pieces: byList[k].slice().sort((a,b) => (a.c||'').localeCompare(b.c||'')) }));
}

      <div style={{marginTop:8,border:'1px solid #e8dcc0',borderRadius:12,overflow:'hidden',maxHeight:280,overflowY:'auto'}}>
        {isSearching ? (

              <div style={{fontSize:11,color:'#a49b8f'}}>{p.c}{(p.l||p.grp) ? ' · List '+(p.l||p.grp) : ''}</div>
            </button>

// AMEB only — no syllabus picker (see head comment / GRADE_OPTIONS above).
function App() {
  // Phase 86: this used to branch between an AMEB-specific flow and a generic
  // performance-countdown flow (mode: 'ameb' | 'generic'). Per Sohyun's decision, grade/
  // syllabus selection is gone entirely -- the exam/performance name is now free text, and
  // the plan is built purely from which of pieces/technical/sight-reading/theory the user
  // says they need (`focus`, below). There is only one flow now.
  const [screen, setScreen]     = useState(0);
  const [performanceLabel, setPerformanceLabel] = useState('');
  const [focus, setFocus] = useState({ pieces:false, technical:false, sightread:false, theory:false });
  const [examDate, setExamDate] = useState('');
  const [pieces, setPieces]     = useState(['','','','']);
  const [showLogin, setShowLogin] = useState(false);
  const [timeline, setTimeline] = useState(null);

  const today = new Date().toISOString().slice(0,10);
  const anyFocus = Object.values(focus).some(Boolean);
  const effectiveGradeLabel = performanceLabel.trim() || 'your performance';
  const userPieces = pieces.filter(Boolean).map(t => ({ t }));
  // READINESS_QUESTIONS_GENERIC ids (pieces/technical/sightread/theory) match the focus
  // keys exactly, so this filters the quiz down to only what the user said they need.
  const quizQuestions = READINESS_QUESTIONS_GENERIC.filter(q => focus[q.id]);

  function finishQuiz(rawScore, qCount) {
    // Re-scale the raw sum (qCount questions, each scored 1-4) onto the same 4..16 range
    // allocatePhases() expects, regardless of how many questions were actually asked.
    const scaledScore = qCount > 0 ? 4 + ((rawScore - qCount) / (qCount * 3)) * 12 : 10;
    const tl = buildTimeline(examDate, scaledScore, effectiveGradeLabel, 'GENERIC', userPieces, null, focus);
    setTimeline(tl);
    setScreen(4);
  }

  function reset() {
    setScreen(0); setPerformanceLabel('');
    setFocus({ pieces:false, technical:false, sightread:false, theory:false });
    setExamDate(''); setPieces(['','','','']); setTimeline(null);
  }

  const monthsLeft = examDate ? monthsUntil(examDate) : null;
  const daysLeft = examDate ? daysUntil(examDate) : null;

  return (
    <div style={{minHeight:'100vh',background:'#f8edd4'}}>
      {showLogin && <LoginPrompt onClose={()=>setShowLogin(false)} />}

      {/* Header */}
      <div style={{background:'#fff',borderBottom:'1px solid #e8dcc0',padding:'16px 20px 18px'}}>
        <a href="index.html" style={{color:'#a49b8f',fontSize:12,textDecoration:'none',display:'block',marginBottom:6}}>
          Back to Piano Butler
        </a>
        <h1 style={{color:'#241f1a',fontSize:19,fontWeight:900,margin:'0 0 2px',letterSpacing:'-0.02em'}}>
          Exam &amp; Performance Timeline
        </h1>
        <p style={{color:'#a49b8f',fontSize:12,margin:'0 0 12px'}}>
          {screen===0 ? 'Step 1 of 4 — what & when' :
           screen===1 ? 'Step 2 of 4 — date' :
           screen===2 ? 'Step 3 of 4 — your pieces' : screen===3 ? 'Step 4 of 4 — readiness' : 'Your timeline'}
        </p>
        {screen < 4 && (
          <div className="progress-bar">
            <div className="progress-fill" style={{width:(screen===0?'0%':screen===1?'25%':screen===2?'50%':'75%')}} />
          </div>
        )}
      </div>

      <div style={{maxWidth:600,margin:'0 auto',padding:'24px 16px 80px'}}>

        {/* STEP 0: What are you preparing for, and what do you need to work on (Phase 86 —
            replaces the old mode choice + AMEB grade dropdown + separate generic-name
            screens with a single free-text label plus a focus-area checklist). */}
        {screen===0 && (
          <div className="fade-up">
            <h2 style={{fontSize:16,fontWeight:800,color:'#241f1a',marginBottom:4}}>What are you preparing for?</h2>
            <p style={{fontSize:13,color:'#a49b8f',marginBottom:16}}>Optional — used to personalise your plan. e.g. "Grade 4 piano exam", "School Concert".</p>
            <input type="text" value={performanceLabel} onChange={e=>setPerformanceLabel(e.target.value)}
              placeholder="e.g. Grade 4 piano exam"
              style={{width:'100%',padding:'13px 14px',borderRadius:12,border:'1.5px solid #e8dcc0',fontSize:14,outline:'none'}} />

            <h2 style={{fontSize:16,fontWeight:800,color:'#241f1a',margin:'26px 0 4px'}}>What do you need to prepare?</h2>
            <p style={{fontSize:13,color:'#a49b8f',marginBottom:16}}>Pick everything that applies — your plan only covers these.</p>
            <div style={{display:'flex',flexDirection:'column',gap:9}}>
              {[
                ['pieces','Repertoire / pieces'],
                ['technical','Technical work (scales & arpeggios)'],
                ['sightread','Sight-reading'],
                ['theory','Theory / general knowledge'],
              ].map(([key,label]) => (
                <button key={key} onClick={()=>setFocus(prev => ({...prev, [key]: !prev[key]}))}
                  className={'opt-btn'+(focus[key]?' active':'')} style={{padding:'13px 14px',textAlign:'left'}}>
                  <span style={{fontSize:13.5,fontWeight:700,color:'#241f1a'}}>{label}</span>
                </button>
              ))}
            </div>

            <div style={{marginTop:22}}>
              <button onClick={()=>setScreen(1)} disabled={!anyFocus}
                style={{width:'100%',padding:'13px',borderRadius:12,
                  background:anyFocus?'#241f1a':'#e8dcc0', color:anyFocus?'#fff':'#a49b8f',
                  border:'none',cursor:anyFocus?'pointer':'default',fontSize:14,fontWeight:800}}>
                Next
              </button>
            </div>
          </div>
        )}

        {/* STEP 1: Exam / performance date */}
        {screen===1 && (
          <div className="fade-up">
            <h2 style={{fontSize:16,fontWeight:800,color:'#241f1a',marginBottom:4}}>When is it?</h2>
            <p style={{fontSize:13,color:'#a49b8f',marginBottom:16}}>An estimate is fine — you can adjust later.</p>
            <input type="date" value={examDate} min={today} onChange={e=>setExamDate(e.target.value)}
              style={{width:'100%',padding:'13px 14px',borderRadius:12,border:'1.5px solid #e8dcc0',fontSize:14,outline:'none'}} />
            {examDate && monthsUntil(examDate) !== null && (
              <p style={{fontSize:12.5,color:'#a49b8f',marginTop:10}}>
                That's about <b style={{color:'#241f1a'}}>{monthsUntil(examDate)} month{monthsUntil(examDate)===1?'':'s'}</b> away.
              </p>
            )}
            <div style={{display:'flex',gap:10,marginTop:22}}>
              <button onClick={()=>setScreen(0)}
                style={{padding:'12px 18px',borderRadius:12,background:'#efe7d8',color:'#6b6259',border:'1.5px solid #e8dcc0',cursor:'pointer',fontSize:13,fontWeight:700}}>
                Back
              </button>
              <button onClick={()=>setScreen(focus.pieces ? 2 : 3)} disabled={!examDate || new Date(examDate) <= new Date()}
                style={{flex:1,padding:'12px',borderRadius:12,
                  background:examDate?'#241f1a':'#e8dcc0', color:examDate?'#fff':'#a49b8f',
                  border:'none',cursor:examDate?'pointer':'default',fontSize:13,fontWeight:800}}>
                Next
              </button>
            </div>
          </div>
        )}

        {/* STEP 2: Your actual pieces (optional) */}
        {screen===2 && focus.pieces && (
          <GenericPieceInput pieces={pieces} setPieces={setPieces}
            onContinue={()=>setScreen(3)} onSkip={()=>setScreen(3)} onBack={()=>setScreen(1)} />
        )}

        {/* STEP 3: Readiness quiz — only the questions matching what they said they need */}
        {screen===3 && <ReadinessQuiz onComplete={(raw)=>finishQuiz(raw, quizQuestions.length)} questions={quizQuestions} />}

        {/* STEP 4: Results */}
        {screen===4 && timeline && (
          <div className="fade-up">
            <div style={{background:'#fff',border:'1px solid #e8dcc0',borderRadius:16,padding:'18px 20px',marginBottom:18}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:8}}>
                <div>
                  <div style={{fontSize:11,color:'#a49b8f',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.03em'}}>
                    PERFORMANCE · {effectiveGradeLabel}
                  </div>
                  <div style={{fontSize:18,fontWeight:900,color:'#241f1a',marginTop:2}}>
                    {daysLeft} day{daysLeft===1?'':'s'} to go
                  </div>
                </div>
                <div style={{fontSize:12,color:'#a49b8f'}}>{timeline.length} month plan</div>
              </div>
            </div>

            <h3 style={{fontSize:14,fontWeight:800,color:'#241f1a',marginBottom:10}}>Month by month</h3>
            {timeline.map((m,i) => <MonthCard key={m.monthStr} m={m} idx={i} isPast={false} />)}

            {userPieces.length > 0 && (
              <>
                <h3 style={{fontSize:14,fontWeight:800,color:'#241f1a',margin:'22px 0 10px'}}>Your pieces</h3>
                <p style={{fontSize:12,color:'#a49b8f',marginBottom:12}}>The monthly plan above is written around these.</p>
                {userPieces.map((p,i) => (
                  <div key={i} className="result-card" style={{padding:'14px 16px'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                      <div>
                        <div style={{fontSize:11,color:'#a49b8f',fontWeight:800,marginBottom:4}}>
                          PIECE {i+1}{(p.l||p.grp) ? ' · LIST '+(p.l||p.grp) : ''}
                        </div>
                        <div style={{fontSize:13.5,fontWeight:800,color:'#241f1a'}}>{p.t}</div>
                        {p.c && <div style={{fontSize:12,color:'#a49b8f',marginTop:2}}>{p.c}</div>}
                      </div>
                      {p.era && <span style={{background:'#efe7d8',color:'#6b6259',fontSize:9,fontWeight:800,padding:'3px 8px',borderRadius:6,whiteSpace:'nowrap'}}>{p.era}</span>}
                    </div>
                    {p.focus && p.focus.length > 0 && (
                      <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:8}}>
                        {p.focus.map((f,j) => (
                          <span key={j} style={{fontSize:10,fontWeight:600,color:'#6b6259',background:'#efe7d8',padding:'3px 8px',borderRadius:6,border:'1px solid #e8dcc0'}}>{f}</span>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </>
            )}

            <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:26}}>
              <button onClick={()=>setShowLogin(true)}
                style={{width:'100%',padding:'13px',borderRadius:12,background:'#241f1a',color:'#fff',border:'none',cursor:'pointer',fontSize:14,fontWeight:800}}>
                Save &amp; track progress
              </button>
              <button onClick={reset}
                style={{width:'100%',padding:'12px',borderRadius:12,background:'#efe7d8',color:'#6b6259',border:'1.5px solid #e8dcc0',cursor:'pointer',fontSize:13,fontWeight:700}}>
                Start over
              </button>
            </div>
          </div>
        )}

        {screen===4 && (!timeline || timeline.length===0) && (
          <div className="fade-up" style={{textAlign:'center',padding:'40px 0'}}>
            <p style={{fontSize:13,color:'#a49b8f'}}>That exam date doesn't leave enough room to build a timeline. Try a date further out.</p>
            <button onClick={()=>setScreen(1)} style={{marginTop:14,padding:'10px 20px',borderRadius:10,background:'#241f1a',color:'#fff',border:'none',cursor:'pointer',fontSize:13,fontWeight:700}}>
              Change exam date
            </button>
          </div>
        )}

      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error:null }; }
  static getDerivedStateFromError(err) { return { error:err }; }
  render() {
    if (this.state.error) return (
      <div style={{padding:40,color:'#ef4444',fontFamily:'monospace',fontSize:13}}>
        <b>Error:</b> {this.state.error.message}<br/>
        <small style={{color:'#a49b8f'}}>Please refresh the page.</small>
      </div>
    );
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  function tryCompile() {
    if (typeof Babel === 'undefined') { setTimeout(tryCompile, 50); return; }
    try {
      var src = document.getElementById('app-jsx').textContent;
      var compiled = Babel.transform(src, { presets: ['react'] }).code;
      var s = document.createElement('script');
      s.textContent = compiled;
      document.body.appendChild(s);
    } catch(e) {
      document.getElementById('root').innerHTML = '<div style="padding:40px;color:#ef4444;font-family:monospace;font-size:13px"><b>Compile error:</b> ' + e.message + '</div>';
    }
  }
  tryCompile();
});
</script>
</body>
</html>
