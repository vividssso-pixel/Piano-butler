<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mission Bank — Piano Butler</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/style.css" />
<style>
  .mission-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 14px; margin-top: 16px; }
  .mission-card { border:1px solid var(--border); border-radius:12px; padding:14px; background:#fff; }
  .mission-card h3 { margin: 0 0 4px; font-size: 15px; }
  .mission-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .mission-card .notes { font-size: 12.5px; color: var(--ink); background:#f8f6f0; padding:8px; border-radius:8px; margin-top:8px; }
  .filters { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .filters input, .filters select { padding:8px 10px; border-radius:8px; border:1px solid var(--border); font-size:13px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">Piano <span>Butler</span></div>
  <nav class="tabs">
    <a href="/sight-reading-generator">Sight-Reading Generator</a>
    <a href="/mission-bank" class="active">Mission Bank</a>
  </nav>
</header>

<main style="grid-template-columns: 1fr; max-width: 920px;">
  <section class="panel">
    <h2>Mission Bank</h2>
    <p style="color:var(--muted); font-size:14px; margin-top:-6px;">
      Every generated excerpt you've saved, in one place — assign one to a student,
      or just keep a piece you liked. Generate excerpts from the
      <a href="/sight-reading-generator">Sight-Reading Generator</a> and click "Save to Mission Bank".
    </p>

    <div class="filters">
      <input type="text" id="search" placeholder="Search student or notes…" />
      <select id="gradeFilter"><option value="">Any grade</option></select>
    </div>

    <div class="mission-grid" id="grid"></div>
  </section>
</main>

<script src="/mission-bank.js"></script>
</body>
</html>
