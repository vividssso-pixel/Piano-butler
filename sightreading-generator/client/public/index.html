<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 6 L16 16 L3 26 Z' fill='none' stroke='%23241f1a' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M29 6 L16 16 L29 26 Z' fill='none' stroke='%23241f1a' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23a8823f'/%3E%3C/svg%3E" />
<title>Sight-Reading Generator — Piano Butler</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<header class="topbar">
  <a class="brand" href="https://thepianobutler.com/index.html"><svg width="18" height="11" viewBox="0 0 40 24"><path d="M2 3 L18 12 L2 21 Z" fill="none" stroke="#241f1a" stroke-width="2.8" stroke-linejoin="round"/><path d="M38 3 L22 12 L38 21 Z" fill="none" stroke="#241f1a" stroke-width="2.8" stroke-linejoin="round"/><circle cx="20" cy="12" r="3" fill="#a8823f"/></svg>Piano <span>Butler</span></a>
  <nav class="tabs">
    <a href="/sight-reading-generator" class="active">Sight-Reading Generator</a>
  </nav>
</header>

<main>
  <section class="panel preview-area" id="previewArea">
    <div class="placeholder" id="placeholder">
      Choose a grade and click <strong>Generate</strong> to create an original,
      grade-matched sight-reading excerpt. Each click produces a fresh, unique
      excerpt — nothing is reused.
    </div>
  </section>

  <section class="panel controls-panel">
    <h2>Generate an excerpt</h2>
    <div class="controls-row">
      <div class="control-field">
        <label for="grade">Grade</label>
        <select id="grade"></select>
      </div>
      <button class="primary" id="generateBtn">Generate</button>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
