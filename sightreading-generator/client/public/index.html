<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sight-Reading Generator — Piano Butler</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">Piano <span>Butler</span></div>
  <nav class="tabs">
    <a href="/sight-reading-generator" class="active">Sight-Reading Generator</a>
  </nav>
</header>

<main>
  <section class="panel preview-area" id="previewArea">
    <div class="placeholder" id="placeholder">
      Choose a grade and click <strong>Generate</strong> to create an original,
      grade-matched sight-reading excerpt. Each click produces a fresh, unique
      excerpt — nothing is reused.
    </div>
  </section>

  <section class="panel controls-panel">
    <h2>Generate an excerpt</h2>
    <div class="controls-row">
      <div class="control-field">
        <label for="grade">Grade</label>
        <select id="grade"></select>
      </div>
      <button class="primary" id="generateBtn">Generate</button>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
