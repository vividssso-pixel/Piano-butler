<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Piano Butler — Today's Practice</title>
<style>
  :root {
    --bg:#16130F; --card:#211C17; --card-2:#2A241D; --line:#332C24;
    --ink:#EDE7DC; --muted:#9A9187; --dim:#6E675E;
    --accent:#D4956A; --accent-ink:#1A1410;
    --ok:#8DAE84; --warn:#D2A45E; --late:#DE7261;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#F5F2EC; --card:#FFFFFF; --card-2:#EFEBE3; --line:#DED8CD;
      --ink:#1F1A15; --muted:#6E675E; --dim:#928A7F;
      --accent:#B36B36; --accent-ink:#FFFFFF;
      --ok:#4F6B4A; --warn:#8C6829; --late:#A2372B; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap { max-width:660px; margin:0 auto; padding:18px 16px 80px; }

  header.top { display:flex; align-items:center; gap:12px; padding:4px 0 18px; }
  .logo { font-weight:700; font-size:17px; letter-spacing:-.02em; }
  .logo b { color:var(--accent); }
  .spacer { flex:1; }

  .tabs { display:flex; gap:6px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:4px; margin-bottom:20px; }
  .tabs button { flex:1; background:none; border:0; color:var(--muted); font:inherit;
    font-size:14px; font-weight:600; padding:9px 4px; border-radius:7px; cursor:pointer; }
  .tabs button[aria-selected="true"] { background:var(--accent); color:var(--accent-ink); }

  .who { display:flex; gap:8px; overflow-x:auto; padding-bottom:14px; }
  .who button { flex:none; background:var(--card); border:1px solid var(--line); color:var(--muted);
    font:inherit; font-size:14px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer; }
  .who button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  .who button.add { color:var(--dim); }

  .hero { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-bottom:16px; }
  .hero .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--dim); margin-bottom:6px; }
  .hero h1 { font-size:21px; font-weight:700; letter-spacing:-.02em; line-height:1.3; }
  .hero .sub { color:var(--muted); font-size:14px; margin-top:6px; }
  .examtag { display:inline-block; margin-top:11px; font-family:var(--mono); font-size:11px;
    letter-spacing:.04em; padding:4px 9px; border-radius:5px;
    background:var(--card-2); color:var(--warn); border:1px solid var(--line); }
  .examtag.hot { color:var(--late); border-color:var(--late); }

  .block { margin-bottom:22px; }
  .blabel { display:flex; align-items:baseline; gap:9px; margin-bottom:9px; padding:0 2px; flex-wrap:wrap; }
  .blabel h2 { font-size:13px; font-weight:700; letter-spacing:.02em; }
  .blabel .note { font-family:var(--mono); font-size:11px; color:var(--dim); }

  .item { display:flex; align-items:flex-start; gap:13px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 15px; margin-bottom:8px; cursor:pointer; font:inherit; color:inherit;
    transition:border-color .12s, background .12s; }
  .item:hover { border-color:var(--dim); }
  .item[data-done="1"] { background:var(--card-2); }
  .item[data-done="1"] .t { color:var(--muted); text-decoration:line-through; text-decoration-color:var(--dim); }
  .box { flex:none; width:22px; height:22px; border-radius:6px; border:1.5px solid var(--dim);
    display:grid; place-items:center; margin-top:1px; font-size:13px; color:transparent; }
  .item[data-done="1"] .box { background:var(--ok); border-color:var(--ok); color:var(--bg); }
  .item .body { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .item .t { font-size:15px; font-weight:600; line-height:1.45; }
  .item .d { font-size:12.5px; color:var(--muted); line-height:1.4; }
  .item .ago { font-family:var(--mono); font-size:11px; color:var(--dim); flex:none;
    padding-top:3px; white-space:nowrap; }
  .item .ago.late { color:var(--late); } .item .ago.warn { color:var(--warn); }

  .empty { color:var(--dim); font-size:14px; padding:14px 2px; }

  .gap { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:12px; }
  .gap > h3 { font-size:11px; font-family:var(--mono); letter-spacing:.11em; text-transform:uppercase;
    color:var(--dim); padding:12px 15px 9px; border-bottom:1px solid var(--line); font-weight:500; }
  .row { display:flex; align-items:stretch; gap:12px; padding:0 15px 0 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .bar { flex:none; width:4px; }
  .row .t { flex:1; font-size:14px; line-height:1.4; min-width:0; padding:10px 0; }
  .row .n { font-family:var(--mono); font-size:12px; flex:none; align-self:center; white-space:nowrap; }
  .s-ok .bar { background:var(--ok); }     .s-ok .n { color:var(--ok); }
  .s-warn .bar { background:var(--warn); } .s-warn .n { color:var(--warn); }
  .s-late .bar { background:var(--late); } .s-late .n { color:var(--late); }
  .s-never .bar { background:var(--late); } .s-never .n { color:var(--late); }
  .s-off .bar { background:var(--line); }
  .s-off .t { color:var(--dim); text-decoration:line-through; text-decoration-color:var(--line); }
  .s-off .n { color:var(--dim); }
  button.row { width:100%; text-align:left; font:inherit; color:inherit;
    background:none; border:0; border-bottom:1px solid var(--line); cursor:pointer; }
  button.row:hover { background:var(--card-2); }

  .banner { background:var(--card-2); border:1px solid var(--line); border-radius:12px;
    padding:13px 15px; margin-bottom:12px; font-size:13.5px; line-height:1.55; color:var(--muted); }
  .banner b { color:var(--accent); font-weight:700; }

  .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:10px; padding:0 2px; }
  .toolbar .hint { flex:1; font-family:var(--mono); font-size:11px; color:var(--dim); }
  button.small { padding:6px 12px; font-size:12px; }

  .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 14px; }
  .stat .k { font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); }
  .stat .v { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:3px; letter-spacing:-.02em; }
  .stat .v small { font-size:13px; color:var(--muted); font-weight:600; }

  .form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .form h2 { font-size:16px; font-weight:700; margin-bottom:6px; }
  .form p.help { color:var(--muted); font-size:13.5px; }
  label { display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin:14px 0 5px; }
  label span { font-weight:400; }
  input, select { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:9px;
    color:var(--ink); font:inherit; font-size:16px; padding:11px 12px; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .btnrow { display:flex; gap:8px; margin-top:18px; }
  button.primary { flex:1; background:var(--accent); color:var(--accent-ink); border:0; border-radius:9px;
    font:inherit; font-size:15px; font-weight:700; padding:12px; cursor:pointer; }
  button.ghost { background:none; border:1px solid var(--line); color:var(--muted); border-radius:9px;
    font:inherit; font-size:14px; font-weight:600; padding:12px 16px; cursor:pointer; }
  button.danger { color:var(--late); }

  footer.foot { color:var(--dim); font-size:11.5px; font-family:var(--mono); text-align:center;
    padding-top:26px; letter-spacing:.03em; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">Piano <b>Butler</b></div>
    <div class="spacer"></div>
    <button class="ghost" id="resetDay" style="padding:6px 11px;font-size:12px">Undo today</button>
  </header>

  <div class="who" id="who"></div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-today" aria-selected="true">Today</button>
    <button role="tab" id="tab-gap" aria-selected="false">Gaps</button>
    <button role="tab" id="tab-set" aria-selected="false">Setup</button>
  </div>

  <main id="view"></main>
  <footer class="foot" id="foot">Piano Butler &middot; saved on this device only</footer>
</div>

<script src="data_technical_ameb.js"></script>
<script src="data_aural_ameb.js"></script>
<script src="butler-engine.js"></script>
<script>
(function () {
  'use strict';

  var E = window.ButlerEngine;
  // data_technical_ameb.js declares its data with `const`, which lives in the global
  // lexical scope and is NOT reachable as window.DATA_TECHNICAL_AMEB. Same pattern the
  // rest of the site uses for its data files — always probe with typeof.
  var TECH = (typeof DATA_TECHNICAL_AMEB !== 'undefined') ? DATA_TECHNICAL_AMEB : null;
  var AURAL = (typeof DATA_AURAL_AMEB !== 'undefined') ? DATA_AURAL_AMEB : null;
  var view = document.getElementById('view');
  var STORE = 'pb_butler_v1';
  var tab = 'today';
  var adjusting = false; // Gaps tab: switching items on/off rather than reading them

  if (!E || !TECH) {
    view.innerHTML = '<div class="form"><h2>Can’t find the syllabus data</h2>' +
      '<p class="help">data_technical_ameb.js and butler-engine.js need to be in the same ' +
      'folder as this page.</p></div>';
    return;
  }

  // ---------- state ----------

  var state = (function () {
    try {
      var s = JSON.parse(localStorage.getItem(STORE));
      if (s && Array.isArray(s.students)) return s;
    } catch (e) { /* absent or corrupt — start clean */ }
    return { students: [], current: null };
  })();

  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
  function now() { return E.today(); }
  function current() {
    return state.students.filter(function (s) { return s.id === state.current; })[0] || null;
  }
  function gradeLabel(g) { return (TECH[g] && TECH[g].label) || g; }

  // ---------- dom helpers ----------

  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }

  // "not yet" rather than "never" — the same fact, without reproaching a child for it.
  function ago(st, key) {
    var la = E.lastAt(st, key);
    if (!la) return { text: 'not yet', cls: 'late' };
    var d = E.daysBetween(la, now());
    if (d <= 0) return { text: 'today', cls: '' };
    if (d === 1) return { text: 'yesterday', cls: '' };
    return { text: d + 'd ago', cls: d >= 21 ? 'late' : (d >= 7 ? 'warn' : '') };
  }

  function itemRow(st, k) {
    var done = E.lastAt(st, k.key) === now();
    var a = ago(st, k.key);
    var b = el(
      '<button class="item" data-done="' + (done ? 1 : 0) + '">' +
        '<span class="box">✓</span>' +
        '<span class="body"><span class="t">' + esc(k.label) + '</span>' +
        (k.desc ? '<span class="d">' + esc(k.desc) + '</span>' : '') + '</span>' +
        '<span class="ago ' + a.cls + '">' + a.text + '</span>' +
      '</button>');
    b.addEventListener('click', function () { E.markDone(st, k.key, now()); save(); render(); });
    return b;
  }

  // ---------- views ----------

  function renderToday() {
    var st = current();
    if (!st) return renderForm(true);

    var plan = E.planFor(st, now(), TECH, AURAL);
    // Persist the pinned selections so the card stays stable through the day/week.
    if (JSON.stringify(st.weekPlan) !== JSON.stringify(plan.weekPlan) ||
        JSON.stringify(st.dayPlan) !== JSON.stringify(plan.dayPlan)) {
      st.weekPlan = plan.weekPlan; st.dayPlan = plan.dayPlan; save();
    }
    var wks = E.weeksUntil(st.examDate, now());
    var examText = '';
    if (wks !== null) {
      var w = Math.max(0, Math.round(wks));
      examText = wks < 0 ? 'Exam done'
        : (w === 0 ? 'Exam this week'
          : w + (w === 1 ? ' week to your exam' : ' weeks to your exam'));
      if (plan.locked && wks >= 0) examText += ' · everything this week';
    }

    // Warm and plain. Labels and buttons stay neutral — a voice on every element
    // gets tiring fast in something opened daily.
    var left = plan.total - plan.done;
    var greeting, aside;
    if (plan.allDone) {
      greeting = 'All done today, ' + esc(st.name) + '!';
      aside = 'Something new tomorrow.';
    } else if (plan.done > 0) {
      greeting = 'Nice work, ' + esc(st.name) + '.';
      aside = left === 1 ? 'One to go.' : left + ' to go.';
    } else {
      greeting = 'Ready when you are, ' + esc(st.name) + '.';
      aside = 'Same list all day — just tick each one off as you go.';
    }

    var frag = document.createDocumentFragment();
    frag.appendChild(el(
      '<div class="hero">' +
        '<div class="eyebrow">' + esc(gradeLabel(st.grade)) +
          (st.syllabus === 'leisure' ? ' · Leisure' : '') + ' · ' +
          plan.done + ' of ' + plan.total + ' done</div>' +
        '<h1>' + greeting + '</h1>' +
        '<div class="sub">' + aside + '</div>' +
        (examText ? '<div class="examtag' + (plan.locked ? ' hot' : '') + '">' + examText + '</div>' : '') +
      '</div>'));

    var b1 = el('<section class="block"><div class="blabel"><h2>Every day · Technical</h2>' +
      '<span class="note">longest since last time</span></div></section>');
    if (!plan.daily.length) {
      b1.appendChild(el('<div class="empty">There is no fixed technical list at this level.</div>'));
    }
    plan.daily.forEach(function (k) { b1.appendChild(itemRow(st, k)); });
    frag.appendChild(b1);

    var b2 = el('<section class="block"><div class="blabel"><h2>' +
      (plan.locked ? 'Exam countdown · everything' : 'This week') + '</h2><span class="note">' +
      (plan.locked ? 'all areas, every week' : 'changes each week') + '</span></div></section>');
    plan.weekly.forEach(function (k) { b2.appendChild(itemRow(st, k)); });
    frag.appendChild(b2);

    view.innerHTML = ''; view.appendChild(frag);
  }

  function renderGap() {
    var st = current();
    if (!st) return renderForm(true);

    var keys = E.coverageKeys(st.grade, TECH, AURAL);
    var s = E.coverageStats(st, now(), TECH, AURAL);
    var frag = document.createDocumentFragment();

    frag.appendChild(el(
      '<div class="summary">' +
        '<div class="stat"><div class="k">Coverage</div><div class="v">' + s.pct + '<small>%</small></div></div>' +
        '<div class="stat"><div class="k">Touched</div><div class="v">' + s.touched +
          '<small> / ' + s.total + '</small></div></div>' +
        '<div class="stat"><div class="k">3+ weeks</div><div class="v">' + s.stale + '</div></div>' +
      '</div>'));

    // Piano for Leisure takes a smaller technical selection than Comprehensive at the
    // same grade, so point the teacher at the switches rather than leaving the count wrong.
    if (st.syllabus === 'leisure' && !adjusting) {
      frag.appendChild(el(
        '<div class="banner">Piano for Leisure needs fewer technical items than ' +
        'Comprehensive. Tap <b>Adjust</b> and switch off anything outside this grade — ' +
        'the coverage figure will then match what ' + esc(st.name) + ' actually needs.</div>'));
    }

    var toolbar = el(
      '<div class="toolbar">' +
        '<span class="hint">' + (adjusting
          ? 'Tap an item to switch it on or off.'
          : 'Worst first, by section.') + '</span>' +
        '<button class="ghost small" id="adjust">' +
          (adjusting ? 'Done' : 'Adjust') + '</button>' +
      '</div>');
    frag.appendChild(toolbar);

    var groups = [];
    keys.forEach(function (k) {
      var g = groups.filter(function (x) { return x.name === k.group; })[0];
      if (!g) { g = { name: k.group, items: [] }; groups.push(g); }
      g.items.push(k);
    });

    var cmp = E.stalestFirst(st, now());
    groups.forEach(function (g) {
      // Switched-off items sink to the bottom of their section so the live list reads clean.
      var items = g.items.slice().sort(cmp).sort(function (a, b) {
        return (E.isExcluded(st, a.key) ? 1 : 0) - (E.isExcluded(st, b.key) ? 1 : 0);
      });
      var live = items.filter(function (k) { return !E.isExcluded(st, k.key); });
      if (!adjusting && !live.length) return; // whole section switched off — hide it

      var box = el('<div class="gap"><h3>' + esc(g.name) +
        (live.length < items.length
          ? ' <span style="color:var(--dim)">· ' + (items.length - live.length) + ' off</span>'
          : '') + '</h3></div>');

      items.forEach(function (k) {
        var off = E.isExcluded(st, k.key);
        if (off && !adjusting) return;
        var a = ago(st, k.key);
        var row = el(
          '<' + (adjusting ? 'button' : 'div') + ' class="row s-' +
            (off ? 'off' : E.status(st, k.key, now())) + '"' +
            (adjusting ? ' type="button"' : '') + '>' +
            '<span class="bar"></span>' +
            '<span class="t">' + esc(k.label) +
              (k.kind === 'manual'
                ? ' <span style="color:var(--dim);font-size:12px">· with your teacher</span>' : '') +
            '</span><span class="n">' + (off ? 'not required' : a.text) + '</span>' +
          '</' + (adjusting ? 'button' : 'div') + '>');
        if (adjusting) {
          row.addEventListener('click', function () {
            E.toggleExcluded(st, k.key); save(); render();
          });
        }
        box.appendChild(row);
      });
      frag.appendChild(box);
    });

    view.innerHTML = ''; view.appendChild(frag);
    document.getElementById('adjust').addEventListener('click', function () {
      adjusting = !adjusting; render();
    });
  }

  function renderForm(isNew) {
    var st = isNew ? null : current();
    var grades = Object.keys(TECH);

    view.innerHTML = '';
    view.appendChild(el(
      '<div class="form">' +
        '<h2>' + (st ? 'Student details' : 'Add a student') + '</h2>' +
        '<p class="help">Just a name, a grade and an exam date to get started.</p>' +
        '<label for="f-name">Name</label>' +
        '<input id="f-name" type="text" autocomplete="off" value="' + esc(st ? st.name : '') + '">' +
        '<label for="f-grade">AMEB grade</label>' +
        '<select id="f-grade">' + grades.map(function (g) {
          return '<option value="' + g + '"' + (st && st.grade === g ? ' selected' : '') + '>' +
            esc(gradeLabel(g)) + '</option>';
        }).join('') + '</select>' +
        '<label for="f-syl">Syllabus</label>' +
        '<select id="f-syl">' +
          '<option value="comprehensive"' +
            (!st || st.syllabus !== 'leisure' ? ' selected' : '') + '>Comprehensive Piano</option>' +
          '<option value="leisure"' +
            (st && st.syllabus === 'leisure' ? ' selected' : '') + '>Piano for Leisure</option>' +
        '</select>' +
        '<label for="f-exam">Exam date <span>— leave blank if none</span></label>' +
        '<input id="f-exam" type="date" value="' + esc(st && st.examDate ? st.examDate : '') + '">' +
        '<div class="btnrow"><button class="primary" id="f-save">Save</button>' +
        (st ? '<button class="ghost danger" id="f-del">Delete</button>' : '') + '</div>' +
      '</div>'));

    document.getElementById('f-save').addEventListener('click', function () {
      var name = document.getElementById('f-name').value.trim();
      if (!name) { document.getElementById('f-name').focus(); return; }
      var grade = document.getElementById('f-grade').value;
      var syl = document.getElementById('f-syl').value;
      var exam = document.getElementById('f-exam').value || null;
      if (st) { st.name = name; st.grade = grade; st.syllabus = syl; st.examDate = exam; }
      else {
        var ns = { id: 's' + Date.now(), name: name, grade: grade, syllabus: syl, examDate: exam,
                   coverage: {}, weekPlan: null, dayPlan: null };
        state.students.push(ns); state.current = ns.id;
      }
      save(); tab = 'today'; render();
    });

    var del = document.getElementById('f-del');
    if (del) del.addEventListener('click', function () {
      if (!confirm('Remove ' + st.name + ' and all their practice records? ' +
                   'This can\'t be undone.')) return;
      state.students = state.students.filter(function (x) { return x.id !== st.id; });
      state.current = state.students.length ? state.students[0].id : null;
      save(); tab = 'today'; render();
    });
  }

  function renderWho() {
    var bar = document.getElementById('who');
    bar.innerHTML = '';
    state.students.forEach(function (s) {
      var b = el('<button aria-pressed="' + (s.id === state.current) + '">' + esc(s.name) + '</button>');
      b.addEventListener('click', function () {
        state.current = s.id; adjusting = false; save(); render();
      });
      bar.appendChild(b);
    });
    var add = el('<button class="add">+ Student</button>');
    add.addEventListener('click', function () { tab = 'set'; sync(); renderForm(true); });
    bar.appendChild(add);
  }

  function sync() {
    ['today', 'gap', 'set'].forEach(function (t) {
      document.getElementById('tab-' + t).setAttribute('aria-selected', String(t === tab));
    });
  }

  function render() {
    renderWho(); sync();
    if (tab === 'today') renderToday();
    else if (tab === 'gap') renderGap();
    else renderForm(false);
  }

  ['today', 'gap', 'set'].forEach(function (t) {
    document.getElementById('tab-' + t).addEventListener('click', function () {
      tab = t; adjusting = false; render();
    });
  });

  document.getElementById('resetDay').addEventListener('click', function () {
    var st = current(); if (!st || !st.coverage) return;
    var t = now();
    Object.keys(st.coverage).forEach(function (k) {
      if (st.coverage[k].last === t) {
        st.coverage[k].last = st.coverage[k].prev || null;
        st.coverage[k].times = Math.max(0, (st.coverage[k].times || 0) - 1);
      }
    });
    save(); render();
  });

  render();
})();
</script>
</body>
</html>
