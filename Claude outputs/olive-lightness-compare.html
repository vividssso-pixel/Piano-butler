<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Piano Butler — dark forest vs. light olive</title>
<style>
  body { background:#f5f0eb; font-family:'Inter',-apple-system,sans-serif; color:#1a1410; margin:0; padding:40px 24px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:19px; font-weight:800; margin:0 0 4px; }
  p.sub { color:#9a8e84; font-size:13px; margin:0 0 28px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .col-label { font-size:13px; font-weight:800; margin-bottom:12px; }
  .hex-label { font-size:11px; color:#9a8e84; font-family:monospace; font-weight:400; }

  .search-input { width:100%; padding:12px 16px; border-radius:12px; background:#fff; border:1.5px solid #e0d8d0; font-size:14px; color:#1a1410; margin-bottom:16px; box-sizing:border-box; }
  .chip-row { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .chip { padding:6px 12px; border-radius:18px; font-size:11px; font-weight:600; border:1.5px solid #e0d8d0; background:#fff; color:#7a6e64; }
  .chip.active { color:#fff; border-color:transparent; }

  .card { background:#fff; border:1px solid #ede7df; border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .row-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .title { font-size:14px; font-weight:800; margin:0 0 2px; }
  .composer { font-size:12px; color:#9a8e84; }
  .actions { margin-top:10px; display:flex; gap:6px; }
  .btn { padding:6px 12px; border-radius:8px; font-size:11px; font-weight:700; border:1.5px solid; background:#fff; }
  .btn.primary { color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dark forest vs. light olive</h1>
  <p class="sub">Same cream background, same layout — only the accent's lightness changes.</p>

  <div class="cols">
    <div>
      <div class="col-label">Dark forest &nbsp;<span class="hex-label">#4f6b52</span></div>
      <input class="search-input" value="Chopin">
      <div class="chip-row">
        <div class="chip active" style="background:#4f6b52">Baroque</div>
        <div class="chip">Classical</div>
        <div class="chip">Romantic</div>
      </div>
      <div class="card">
        <div class="row-top">
          <div>
            <div class="title">Waltz in A minor</div>
            <div class="composer">CHOPIN, F.</div>
          </div>
        </div>
        <div class="actions">
          <a class="btn primary" style="background:#4f6b52;border-color:#4f6b52">Listen</a>
          <a class="btn" style="border-color:#4f6b52;color:#4f6b52">Score</a>
        </div>
      </div>
    </div>

    <div>
      <div class="col-label">Light olive &nbsp;<span class="hex-label">#8f9463</span></div>
      <input class="search-input" value="Chopin">
      <div class="chip-row">
        <div class="chip active" style="background:#8f9463">Baroque</div>
        <div class="chip">Classical</div>
        <div class="chip">Romantic</div>
      </div>
      <div class="card">
        <div class="row-top">
          <div>
            <div class="title">Waltz in A minor</div>
            <div class="composer">CHOPIN, F.</div>
          </div>
        </div>
        <div class="actions">
          <a class="btn primary" style="background:#8f9463;border-color:#8f9463">Listen</a>
          <a class="btn" style="border-color:#8f9463;color:#8f9463">Score</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
