<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Button color options — ink vs brass</title>
<style>
  body { background:#e8e4dc; font-family:'Inter',-apple-system,sans-serif; margin:0; padding:32px; }
  .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:1000px; margin:0 auto; }
  .panel { background:#fff; border:1px solid #d8d2c6; border-radius:16px; overflow:hidden; }
  .label-bar { padding:12px 16px; font-size:13px; font-weight:700; background:#fff; border-bottom:1px solid #e4ded4; }
  .hex { font-size:10px; color:#a49b8f; font-weight:400; font-family:monospace; }
  .body-area { padding:24px 20px; background:#f8edd4; }
  .btn { display:inline-block; padding:13px 32px; border-radius:10px; font-size:15px; font-weight:700; color:#fff; border:none; cursor:pointer; margin-bottom:14px; }
  .pill-row { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .pill { padding:9px 18px; border-radius:20px; font-size:13px; font-weight:700; border:1.5px solid #e8dcc0; background:#fff; color:#241f1a; }
  .pill.selected { border-color:transparent; color:#fff; }
  .contrast-note { font-size:11px; color:#6b6259; margin-top:6px; }
  .fail { color:#a3271a; font-weight:700; }
  .pass { color:#1f7a3d; font-weight:700; }
</style>
</head>
<body>
<div class="cols">

  <div class="panel">
    <div class="label-bar">Current — Ink <span class="hex">#241f1a</span></div>
    <div class="body-area">
      <button class="btn" style="background:#241f1a">Generate</button>
      <div class="pill-row">
        <span class="pill selected" style="background:#241f1a">Any</span>
        <span class="pill">AMEB</span>
        <span class="pill">ABRSM</span>
      </div>
      <div class="contrast-note">White text contrast: <span class="pass">15.6 : 1 — passes everywhere</span></div>
    </div>
  </div>

  <div class="panel" style="border-color:#c9a24f">
    <div class="label-bar">Option A — Brass as-is <span class="hex">#a8823f</span></div>
    <div class="body-area">
      <button class="btn" style="background:#a8823f">Generate</button>
      <div class="pill-row">
        <span class="pill selected" style="background:#a8823f">Any</span>
        <span class="pill">AMEB</span>
        <span class="pill">ABRSM</span>
      </div>
      <div class="contrast-note">White text contrast: <span class="fail">3.5 : 1 — fails AA for this text size</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="label-bar">Option B — Deeper brass <span class="hex">#8a6a2f</span></div>
    <div class="body-area">
      <button class="btn" style="background:#8a6a2f">Generate</button>
      <div class="pill-row">
        <span class="pill selected" style="background:#8a6a2f">Any</span>
        <span class="pill">AMEB</span>
        <span class="pill">ABRSM</span>
      </div>
      <div class="contrast-note">White text contrast: <span class="pass">4.8 : 1 — passes AA</span></div>
    </div>
  </div>

</div>
</body>
</html>
