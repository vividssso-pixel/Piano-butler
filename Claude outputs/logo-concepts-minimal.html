<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Piano Butler — minimal logo concepts</title>
<style>
  :root { --bg:#f8edd4; --ink:#241f1a; --ink-soft:#6b6259; --brass:#a8823f; --border:#e8dcc0; }
  * { box-sizing:border-box; }
  body { background:var(--bg); font-family:'Inter',-apple-system,sans-serif; color:var(--ink); margin:0; padding:40px 24px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:19px; font-weight:800; margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
  .panel { background:#fff; border:1px solid var(--border); border-radius:16px; padding:28px; }
  .panel-label { font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:20px; letter-spacing:0.02em; }
  .big { display:flex; align-items:center; justify-content:center; height:90px; margin-bottom:18px; }
  .navbar { display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--bg); border-radius:10px; border:1px solid var(--border); }

  /* A: wordmark */
  .wm { font-size:30px; font-weight:800; letter-spacing:-0.01em; }
  .wm .b { color:var(--brass); position:relative; }
  .wm-rule { display:block; width:60px; height:2px; background:var(--brass); margin:6px auto 0; }
  .wm-small { font-size:15px; font-weight:800; }

  /* B: monogram */
  .mono-circle { width:64px; height:64px; border-radius:50%; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; position:relative; }
  .mono-circle .letters { font-size:22px; font-weight:800; letter-spacing:-0.03em; }
  .mono-circle .dot { position:absolute; bottom:9px; right:11px; width:6px; height:6px; border-radius:50%; background:var(--brass); }
  .mono-circle.small { width:30px; height:30px; }
  .mono-circle.small .letters { font-size:11px; }
  .mono-circle.small .dot { width:3px; height:3px; bottom:5px; right:6px; }

  /* C: bowtie */
  .bowtie { display:inline-block; }
  .bowtie svg { display:block; }

  /* D: key sliver */
  .key svg { display:block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>4 minimal logo directions</h1>
  <div class="grid">

    <div class="panel">
      <div class="panel-label">A — Pure wordmark</div>
      <div class="big">
        <div style="text-align:center">
          <div class="wm">Piano <span class="b">Butler</span></div>
          <span class="wm-rule"></span>
        </div>
      </div>
      <div class="navbar"><span class="wm-small">Piano <span class="b">Butler</span></span></div>
    </div>

    <div class="panel">
      <div class="panel-label">B — Monogram</div>
      <div class="big" style="gap:14px">
        <div class="mono-circle"><span class="letters">PB</span><span class="dot"></span></div>
        <div class="wm" style="font-size:22px">Piano <span class="b">Butler</span></div>
      </div>
      <div class="navbar">
        <div class="mono-circle small"><span class="letters">PB</span><span class="dot"></span></div>
        <span class="wm-small">Piano <span class="b">Butler</span></span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label">C — Bowtie mark</div>
      <div class="big" style="gap:14px">
        <span class="bowtie">
          <svg width="40" height="24" viewBox="0 0 40 24">
            <path d="M2 3 L18 12 L2 21 Z" fill="none" stroke="#241f1a" stroke-width="2" stroke-linejoin="round"/>
            <path d="M38 3 L22 12 L38 21 Z" fill="none" stroke="#241f1a" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="20" cy="12" r="2.4" fill="#a8823f"/>
          </svg>
        </span>
        <div class="wm" style="font-size:22px">Piano <span class="b">Butler</span></div>
      </div>
      <div class="navbar">
        <svg width="22" height="13" viewBox="0 0 40 24">
          <path d="M2 3 L18 12 L2 21 Z" fill="none" stroke="#241f1a" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M38 3 L22 12 L38 21 Z" fill="none" stroke="#241f1a" stroke-width="2.2" stroke-linejoin="round"/>
          <circle cx="20" cy="12" r="2.6" fill="#a8823f"/>
        </svg>
        <span class="wm-small">Piano <span class="b">Butler</span></span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label">D — Key sliver</div>
      <div class="big" style="gap:14px">
        <span class="key">
          <svg width="28" height="40" viewBox="0 0 28 40">
            <rect x="2" y="2" width="24" height="36" rx="6" fill="none" stroke="#241f1a" stroke-width="2"/>
            <rect x="2" y="2" width="24" height="12" rx="6" fill="#a8823f"/>
          </svg>
        </span>
        <div class="wm" style="font-size:22px">Piano <span class="b">Butler</span></div>
      </div>
      <div class="navbar">
        <svg width="16" height="23" viewBox="0 0 28 40">
          <rect x="2" y="2" width="24" height="36" rx="6" fill="none" stroke="#241f1a" stroke-width="2.4"/>
          <rect x="2" y="2" width="24" height="12" rx="6" fill="#a8823f"/>
        </svg>
        <span class="wm-small">Piano <span class="b">Butler</span></span>
      </div>
    </div>

  </div>
</div>
</body>
</html>
