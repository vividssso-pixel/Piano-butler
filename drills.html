// Phase 97b: Sohyun found the finger-4 table hard to read ("패턴으로 설명해주는게 낫지 않아?").
// Replaced with the five fingering PATTERNS. Each finger row is drawn straight from SCALES
// (one octave, going up), split at the thumb into the same 1-2-3 / 1-2-3-4 groups (and colours)
// the keyboard view uses, with the note names underneath -- so the cards can't disagree with the data.
function FingerGroups({ keyName, hand, mode }) {
  const e = scaleData(keyName, mode).octaves[1], names = spellFor(keyName, mode);
  const f = e[hand];
  const groups = [];
  let cur = [];
  f.forEach((d, i) => {
    const x = { d, n: names[i % 7] };
    // Finger 5 only bookends the scale (RH top, LH bottom) -- give it its own plain box.
    if (d === 5) { if (cur.length) groups.push(cur); groups.push([x]); cur = []; return; }
    if (hand === 'RH' && d === 1 && cur.length) { groups.push(cur); cur = []; }
    cur.push(x);
    if (hand === 'LH' && d === 1) { groups.push(cur); cur = []; }
  });
  if (cur.length) groups.push(cur);
  // A full group starts (RH) or ends (LH) on the thumb and has 3 or 4 notes; anything else is a
  // lead-in or the last notes before the top/bottom, shown plain.
  const kind = (g) => {
    const thumbEnd = hand === 'RH' ? g[0].d === 1 : g[g.length - 1].d === 1;
    return !thumbEnd ? null : g.length === 4 ? 'four' : g.length === 3 ? 'three' : null;
  };
  return (
    <div style={{display:'flex',alignItems:'flex-start',gap:6,flexWrap:'wrap'}}>
      <span style={{fontSize:11,fontWeight:800,color:'var(--muted)',width:22,paddingTop:5}}>{hand}</span>
      {groups.map((g, gi) => {
        const k = kind(g);
        const c = k ? SEGMENT_COLORS[k] : { fill: '#fff', stroke: '#d9cdb0' };
        return (
          <span key={gi} style={{display:'inline-flex',gap:2,padding:'3px 5px',borderRadius:7,background:c.fill,border:'1.5px solid ' + c.stroke}}>
            {g.map((x, xi) => (
              <span key={xi} style={{display:'inline-flex',flexDirection:'column',alignItems:'center',minWidth:18}}>
                <b style={{fontSize:15,lineHeight:1.1}}>{x.d}</b>
                <span style={{fontSize:9,fontWeight:700,color:'#5c544a'}}>{prettyAny(x.n)}</span>
              </span>
            ))}
          </span>
        );
      })}
    </div>
  );
}

// ─── Concept: Tones & Semitones (Phase 99, 2026-09-23) ───────────────────────────
// Curriculum agreed with Sohyun: tones/semitones come right after note names, because every later
// chapter is "count the semitones": scale shape (TTSTTTS) -> key signatures -> intervals -> chords.
function StepExplorer() {
  const [a, setA] = useState(0);
  const [b, setB] = useState(4);
  const [next, setNext] = useState('a');
  const n = Math.abs(b - a);
  const marks = { [a]: 'target', [b]: 'good' };
  const say = n === 0 ? 'the same key' : n === 1 ? '1 semitone' : n === 2 ? '2 semitones = 1 tone' : n + ' semitones';
  return (
    <div style={{background:'var(--brass-bg)',borderRadius:10,padding:'10px 10px 12px',margin:'12px 0'}}>
      <div style={{fontSize:12,fontWeight:800,marginBottom:6}}>Try it: tap any two keys</div>
      <TapKeyboard octaves={1} labels="white" marks={marks} onTap={(i) => { if (next === 'a') { setA(i); setNext('b'); } else { setB(i); setNext('a'); } }}/>
      <div style={{textAlign:'center',fontSize:15,fontWeight:900,marginTop:8}}>
        {pcLabel(a % 12)} → {pcLabel(b % 12)}: <span style={{color:'var(--brass)'}}>{say}</span>
      </div>
    </div>
  );
}

const ENHARMONIC = [['C#','Db'],['D#','Eb'],['F#','Gb'],['G#','Ab'],['A#','Bb'],['E#','F'],['B#','C'],['Cb','B'],['Fb','E']];
const TONES_LEVELS = [
  { n: 1, label: 'Tone or semitone?',             kind: 'which', time: 7 },
  { n: 2, label: 'Tap a tone or semitone away',    kind: 'find',  time: 9 },
  { n: 3, label: 'Two names, one key',             kind: 'enh',   time: 8 },
];
function genTonesQuestion(lv, prev) {
  const uid = Math.random();
  if (lv.kind === 'enh') {
    const pair = pick(ENHARMONIC), flip = Math.random() < 0.5;
    const shown = flip ? pair[1] : pair[0], answer = flip ? pair[0] : pair[1];
    const others = sampleN(ENHARMONIC.flat().filter(x => x !== answer && x !== shown), 3);
    return { kind: 'enh', key: shown, shown, answer, choices: shuffle([answer, ...others]), uid };
  }
  const size = Math.random() < 0.5 ? 1 : 2;
  if (lv.kind === 'which') {
    let a = Math.floor(Math.random() * 11), n = 0;
    while (a + size > 11 && n++ < 20) a = Math.floor(Math.random() * 11);
    return { kind: 'which', key: a + ':' + size, a, b: a + size, answer: size === 1 ? 'Semitone' : 'Tone', uid };
  }
  const whites = [0, 2, 4, 5, 7, 9, 11];
  const up = Math.random() < 0.5;
  let a = pick(whites) + 12, n = 0;
  while (prev && prev.a === a && n++ < 10) a = pick(whites) + 12;
  return { kind: 'find', key: a + ':' + size + up, a, size, up, target: a + (up ? size : -size), uid };
}
function TonesQuestion({ q, level, given, locked, onAnswer, pixel }) {
  const done = !!given;
  const btnCls = pixel ? 'pixel-choice' : 'choice-btn';
  const prompt = (t, px) => <p style={pixel ? {fontSize:10,textAlign:'center',margin:'0 0 10px'} : {fontSize:14,fontWeight:700,textAlign:'center',margin:'0 0 10px',color:'var(--muted)'}}>{pixel ? px : t}</p>;
  if (q.kind === 'enh') {
    return (<div>
      {prompt('The same key has another name -- which?', 'OTHER NAME?')}
      <div style={{textAlign:'center',fontSize:pixel ? 34 : 64,fontWeight:900,margin:'0 0 14px',color:pixel ? 'var(--brass)' : 'var(--text)'}}>{prettyNote(q.shown)}</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        {q.choices.map(c => <button key={c} disabled={locked} onClick={() => onAnswer(c)} className={btnCls + (!done ? '' : c === q.answer ? ' good' : given.ans === c ? ' bad' : '')} style={{padding:'14px 0',fontSize:pixel ? 12 : 20}}>{prettyNote(c)}</button>)}
      </div>
    </div>);
  }
  if (q.kind === 'which') {
    return (<div>
      {prompt('Is this a tone or a semitone?', 'TONE OR SEMITONE?')}
      <TapKeyboard octaves={1} marks={{ [q.a]: 'target', [q.b]: 'target' }} pixel={pixel}/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:14}}>
        {['Semitone', 'Tone'].map(c => <button key={c} disabled={locked} onClick={() => onAnswer(c)} className={btnCls + (!done ? '' : c === q.answer ? ' good' : given.ans === c ? ' bad' : '')} style={{padding:'16px 0',fontSize:pixel ? 10 : 16}}>{c}</button>)}
      </div>
    </div>);
  }
  const marks = { [q.a]: 'target' };
  if (done) { marks[q.target] = 'good'; if (!given.ok && given.ans !== null && given.ans !== undefined && given.ans !== q.target) marks[given.ans] = 'bad'; }
  const what = (q.size === 1 ? 'a semitone ' : 'a tone ') + (q.up ? 'up' : 'down');
  return (<div>
    {prompt('Tap the key ' + what + ' from ' + pcLabel(q.a % 12), ('TAP ' + what + ' FROM ' + PC_INFO[q.a % 12].names[0]).toUpperCase())}
    <TapKeyboard octaves={3} labels="white" marks={marks} pixel={pixel} onTap={locked ? null : (i) => onAnswer(i)}/>
  </div>);
}
const TONES_DRILL = {

// ─── Scale shape: the step pattern (Phase 99) ────────────────────────────────────
const STEP_PATTERNS = {

}
function MajorShapeCard() {
  const cNames = spellScale('C').concat(['C']);
  const gNames = spellScale('G').concat(['G']);
  const cMarks = {}; majorOffsets(1).forEach((o, i) => { cMarks[o] = [2, 3, 6, 7].includes(i) ? 'target' : 'good'; });
  return (

      <p style={{fontSize:13,color:'#6f665b',margin:'0 0 8px',lineHeight:1.55}}>

// Drill kind 'build': tap the scale up one note at a time from the tonic.

function ScalePatterns({ sel, onPick, mode = 'major' }) {
  const list = mode === 'minor' ? MINOR_PATTERNS : SCALE_PATTERNS;
  return (
    <div className="card" style={{marginBottom:16}}>
      <h2 style={{fontSize:18,fontWeight:900,margin:'0 0 4px',letterSpacing:'-0.02em'}}>{mode === 'minor' ? 'Five patterns for harmonic minor' : 'Five patterns cover every major scale'}</h2>
      <p style={{fontSize:13,color:'#6f665b',margin:'0 0 10px',lineHeight:1.55}}>

}

// Interactive one-octave keyboard for the drill. Marks/taps are keyed by semitone offset from the root.
function ScaleTapKeyboard({ keyName, hand, showFingers, marks = {}, onTap, pixel, mode, hideDots }) {
  const info = scaleData(keyName, mode), entry = info.octaves[1];
  const { keys, whiteCount } = buildKeyboard(info.rootPc, 12);
  const whiteW = 34, whiteH = 110, blackW = 20, blackH = 66;
  const fingerAt = {}; entry.offsets.forEach((off, i) => { fingerAt[off] = entry[hand][i]; });
  const inScale = new Set(hideDots ? [] : entry.offsets);
  const col = (m, white) => m === 'good' ? '#8fd18b' : m === 'bad' ? '#f08a80' : m === 'target' ? '#e9c77a' : m === 'picked' ? '#9fc3e8' : (white ? '#fff' : '#241f1a');
  const tap = (i) => (onTap ? () => onTap(i) : undefined);
  return (
    <svg viewBox={(-blackW / 2) + ' 0 ' + (whiteCount * whiteW + blackW) + ' ' + whiteH} shapeRendering={pixel ? 'crispEdges' : 'auto'}
      style={{width:'100%',display:'block',touchAction:'manipulation'}}>
      {keys.filter(k => k.isWhite).map(k => (
        <g key={'w' + k.i} onClick={tap(k.i)} style={{cursor:onTap ? 'pointer' : 'default'}} data-off={k.i}>
          <rect x={k.whiteIndex * whiteW} y="0" width={whiteW} height={whiteH} fill={col(marks[k.i], true)} stroke="#a49b8f" strokeWidth="1.5"/>
          {inScale.has(k.i) && !marks[k.i] && <circle cx={k.whiteIndex * whiteW + whiteW / 2} cy={whiteH - 34} r="3" fill="#a8823f" opacity="0.5"/>}
          {showFingers && fingerAt[k.i] && <text x={k.whiteIndex * whiteW + whiteW / 2} y={whiteH - 12} textAnchor="middle" fontSize="15" fontWeight="800" fill="#241f1a">{fingerAt[k.i]}</text>}
        </g>
      ))}
      {keys.filter(k => !k.isWhite).map(k => {
        const x = (k.precedingWhiteIndex + 1) * whiteW - blackW / 2;
        return (
          <g key={'b' + k.i} onClick={tap(k.i)} style={{cursor:onTap ? 'pointer' : 'default'}} data-off={k.i}>
            <rect x={x} y="0" width={blackW} height={blackH} fill={col(marks[k.i], false)} stroke="#241f1a" strokeWidth="1"/>
            {inScale.has(k.i) && !marks[k.i] && <circle cx={x + blackW / 2} cy={blackH - 26} r="3" fill="#e9c77a"/>}
            {showFingers && fingerAt[k.i] && <text x={x + blackW / 2} y={blackH - 8} textAnchor="middle" fontSize="12" fontWeight="800" fill={marks[k.i] ? '#241f1a' : '#fff'}>{fingerAt[k.i]}</text>}
          </g>
        );
      })}
    </svg>
  );
}

const SCALE_LEVELS = [
  { n: 1, label: 'Which finger? (C G D A E)',      kind: 'finger', pool: ['C', 'G', 'D', 'A', 'E'], time: 9 },
  { n: 2, label: 'Tap where finger 4 goes',         kind: 'four',   pool: SCALE_PATH, time: 9 },
  { n: 3, label: 'Tap every thumb note',            kind: 'thumbs', pool: SCALE_PATH, time: 14 },
  { n: 4, label: 'Which finger? (all 12 keys)',     kind: 'finger', pool: SCALE_PATH, time: 9 },
  { n: 5, label: 'Harmonic minor: which finger?',   kind: 'finger', pool: MINOR_PATH, mode: 'minor', time: 9 },
  { n: 6, label: 'Harmonic minor: tap the raised 7th', kind: 'seventh', pool: MINOR_PATH, mode: 'minor', time: 9 },
  { n: 7, label: 'Build a major scale: T T S T T T S', kind: 'build', pool: SCALE_PATH, time: 20 },
  { n: 8, label: 'Build a harmonic minor: T S T T S T+S S', kind: 'build', pool: MINOR_PATH, mode: 'minor', time: 20 },
];
function genScaleQuestion(lv, prev) {
  const uid = Math.random();
  let key = pick(lv.pool), n = 0;
  while (prev && prev.keyName === key && lv.pool.length > 1 && n++ < 10) key = pick(lv.pool);
  const hand = Math.random() < 0.5 ? 'RH' : 'LH';
  const mode = lv.mode || 'major';
  const e = scaleData(key, mode).octaves[1];
  if (lv.kind === 'build') return { kind: 'build', key: key, keyName: key, mode, hand: 'RH', answerSet: e.offsets.slice(1), uid };
  if (lv.kind === 'seventh') return { kind: 'seventh', key: key, keyName: key, mode, hand: 'RH', answerSet: [11], uid };
  if (lv.kind === 'finger') {
    const idx = Math.floor(Math.random() * e.offsets.length);
    return { kind: 'finger', key: key + hand + idx, keyName: key, mode, hand, off: e.offsets[idx], answer: e[hand][idx], uid };
  }
  const f = lv.kind === 'four' ? 4 : 1;
  const set = e.offsets.filter((o, i) => e[hand][i] === f);
  if (!set.length) return genScaleQuestion(lv, { keyName: key }); // e.g. A-flat RH has no 4 in one octave
  return { kind: lv.kind, key: key + hand, keyName: key, mode, hand, answerSet: set, uid };
}
function checkScale(q, ans) {
  if (ans === null || ans === undefined) return false;
  if (q.kind === 'finger') return ans === q.answer;
  if (q.kind === 'build') return Array.isArray(ans) && ans.length === q.answerSet.length && ans.every((x, i) => x === q.answerSet[i]);
  if (q.kind === 'four' || q.kind === 'seventh') return q.answerSet.includes(ans);
  return Array.isArray(ans) && ans.length === q.answerSet.length && q.answerSet.every(x => ans.includes(x));
}
function scaleAnswerLabel(q) {
  const names = spellFor(q.keyName, q.mode), e = scaleData(q.keyName, q.mode).octaves[1];
  const nameAt = (off) => prettyAny(names[e.offsets.indexOf(off) % 7]);
  if (q.kind === 'finger') return 'finger ' + q.answer + ' on ' + nameAt(q.off);
  if (q.kind === 'seventh') return 'the raised 7th is ' + nameAt(11);
  if (q.kind === 'build') return names.concat([names[0]]).map(prettyAny).join(' ');
  return (q.kind === 'four' ? 'finger 4 on ' : 'thumbs on ') + q.answerSet.map(nameAt).join(', ');
}

function ScaleQuestion({ q, level, given, locked, onAnswer, pixel }) {
  const [picked, setPicked] = useState([]);
  useEffect(() => { setPicked([]); }, [q.uid]);
  const done = !!given;
  const btnCls = pixel ? 'pixel-choice' : 'choice-btn';
  const handName = q.hand === 'RH' ? 'right hand' : 'left hand';
  const title = scaleTitle(q.keyName, q.mode) + (q.kind === 'seventh' || q.kind === 'build' ? '' : ' · ' + handName);
  const steps = q.mode === 'minor' ? STEP_PATTERNS.harmonic : STEP_PATTERNS.major;
  const marks = {};
  if (q.kind === 'build') {
    marks[0] = 'target';
    picked.forEach(o => { marks[o] = 'good'; });
    if (done && !given.ok) { q.answerSet.forEach(o => { if (!marks[o]) marks[o] = 'picked'; }); if (given.ans && given.ans.wrong !== undefined) marks[given.ans.wrong] = 'bad'; }
  } else if (q.kind === 'finger') marks[q.off] = done ? (given.ok ? 'good' : 'target') : 'target';
  else if (q.kind === 'four' || q.kind === 'seventh') {
    if (done) { q.answerSet.forEach(o => { marks[o] = 'good'; }); if (!given.ok && given.ans !== null && given.ans !== undefined) marks[given.ans] = 'bad'; }
  } else {
    picked.forEach(o => { marks[o] = 'picked'; });
    if (done) { q.answerSet.forEach(o => { marks[o] = 'good'; }); picked.filter(o => !q.answerSet.includes(o)).forEach(o => { marks[o] = 'bad'; }); }
  }
  const prompt = q.kind === 'finger' ? ['Which finger plays the highlighted note?', 'WHICH FINGER?']
    : q.kind === 'four' ? ['Tap the note finger 4 plays', 'WHERE DOES 4 GO?']
    : q.kind === 'seventh' ? ['Tap the 7th note -- raised a semitone', 'TAP THE RAISED 7TH']
    : q.kind === 'build' ? ['Tap the scale going up from the gold key, step by step', 'BUILD IT: ' + steps.join(' ')] : ['Tap every note the thumb plays, then Check', 'TAP ALL THE THUMBS'];
  return (
    <div>
      <div style={{textAlign:'center',fontSize:pixel ? 12 : 20,fontWeight:900,marginBottom:4,color:pixel ? 'var(--brass)' : 'var(--text)'}}>{pixel ? title.toUpperCase() : title}</div>
      <p style={pixel ? {fontSize:9,textAlign:'center',margin:'0 0 10px'} : {fontSize:13,fontWeight:700,textAlign:'center',margin:'0 0 10px',color:'var(--muted)'}}>{pixel ? prompt[1] : prompt[0]}</p>
      <div style={{background:pixel ? 'transparent' : '#fff',padding:pixel ? 0 : 2}}>
        <ScaleTapKeyboard keyName={q.keyName} hand={q.hand} showFingers={done && q.kind !== 'seventh'} marks={marks} pixel={pixel}
          mode={q.mode} hideDots={(q.kind === 'seventh' || q.kind === 'build') && !done}
          onTap={locked || q.kind === 'finger' ? null : (off) => {
            if (q.kind === 'build') {
              const want = q.answerSet[picked.length];
              if (off === want) { const nx = [...picked, off]; setPicked(nx); if (nx.length === q.answerSet.length) onAnswer(nx); }
              else if (off !== 0 && !picked.includes(off)) onAnswer({ wrong: off });
              return;
            }
            if (q.kind === 'four' || q.kind === 'seventh') onAnswer(off);
            else setPicked(p => (p.includes(off) ? p.filter(x => x !== off) : [...p, off]));
          }}/>
      </div>
      <div style={{fontSize:pixel ? 7 : 11,textAlign:'center',margin:'6px 0 12px',color:pixel ? '#f8edd4' : 'var(--muted)'}}>{q.kind === 'build' ? (pixel ? steps.slice(0, picked.length).join(' ') + (picked.length < 7 ? ' → ' + steps[picked.length] + '?' : '') : 'Steps so far: ' + (steps.slice(0, picked.length).join(' ') || '--') + (picked.length < 7 && !done ? '   next: ' + steps[picked.length] : ''))
      : q.kind === 'seventh' && !done ? (pixel ? 'START FROM THE LEFT: THAT KEY IS THE TONIC' : 'The keyboard starts on the tonic.') : (pixel ? 'DOTS = NOTES OF THE SCALE' : 'Dots mark the notes of the scale (one octave, going up).')}</div>
      {q.kind === 'finger' && (
        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8}}>
          {[1, 2, 3, 4, 5].map(f => (
            <button key={f} disabled={locked} onClick={() => onAnswer(f)}
              className={btnCls + (!done ? '' : f === q.answer ? ' good' : given.ans === f ? ' bad' : '')} style={{padding:'14px 0',fontSize:pixel ? 12 : 18}}>{f}</button>
          ))}
        </div>
      )}
      {q.kind === 'thumbs' && !done && (
        <button className={pixel ? 'pixel-btn' : 'primary-btn'} style={{width:'100%'}} disabled={!picked.length}
          onClick={() => onAnswer(picked.slice().sort((a, b) => a - b))}>{pixel ? 'CHECK' : 'Check (' + picked.length + ' picked)'}</button>
      )}
    </div>
  );
}

// ─── Concept: Time Signatures (Phase 100, 2026-09-23) ────────────────────────────
// Rhythm track, right after Notes & Rests. Beats are counted in crotchets, like the rest of the
// file (crotchet = 1). Simple times 2/4 3/4 4/4 (+ 2/2, 3/8); compound 6/8 9/8 12/8 = dotted-crotchet beats.
const TIME_SIGS = [
  { id: '2/4', top: 2, bottom: 4, feel: 2, kind: 'simple', beats: 2, unit: 'crotchet', use: 'marches -- ONE two, ONE two', pattern: [1, 0] },
  { id: '3/4', top: 3, bottom: 4, feel: 3, kind: 'simple', beats: 3, unit: 'crotchet', use: 'waltzes and minuets -- ONE two three', pattern: [1, 0, 0] },
  { id: '4/4', top: 4, bottom: 4, feel: 4, kind: 'simple', beats: 4, unit: 'crotchet', use: 'the most common of all -- also written C (common time)', pattern: [1, 0, 0.5, 0] },
  { id: '2/2', top: 2, bottom: 2, feel: 2, kind: 'simple', beats: 4, unit: 'minim', use: 'two minim beats -- also written ¢ (cut time)', pattern: [1, 0] },
  { id: '3/8', top: 3, bottom: 8, feel: 3, kind: 'simple', beats: 1.5, unit: 'quaver', use: 'three light quaver beats', pattern: [1, 0, 0] },
  { id: '6/8', top: 6, bottom: 8, feel: 2, kind: 'compound', beats: 3, unit: 'dotted crotchet', use: 'six quavers felt as TWO swinging beats -- ONE-and-a TWO-and-a', pattern: [1, 0, 0, 0.5, 0, 0] },
  { id: '9/8', top: 9, bottom: 8, feel: 3, kind: 'compound', beats: 4.5, unit: 'dotted crotchet', use: 'nine quavers felt as three beats', pattern: [1, 0, 0, 0.5, 0, 0, 0.5, 0, 0] },
  { id: '12/8', top: 12, bottom: 8, feel: 4, kind: 'compound', beats: 6, unit: 'dotted crotchet', use: 'twelve quavers felt as four beats', pattern: [1, 0, 0, 0.5, 0, 0, 0.5, 0, 0, 0.5, 0, 0] },
];
const TS = {}; TIME_SIGS.forEach(t => { TS[t.id] = t; });
const BEAT_GLYPH = {
  crotchet: NV_NOTES.find(n => n.id === 'crotchet'),
  minim: NV_NOTES.find(n => n.id === 'minim'),
  quaver: NV_NOTES.find(n => n.id === 'quaver'),
  'dotted crotchet': NV_DOTTED.find(n => n.id === 'crotchet'),
};

function TSig({ top, bottom, size = 40, ink = 'currentColor' }) {
  return (
    <span style={{display:'inline-flex',flexDirection:'column',alignItems:'center',lineHeight:0.82,fontFamily:"Georgia,'Times New Roman',serif",
      fontWeight:900,fontSize:size,color:ink}}>
      <span>{top}</span><span>{bottom}</span>
    </span>
  );
}

// Play two bars with the strong beat accented (compound: pulse on every quaver, beat on the dotted crotchet).
function playTimeSig(t, bpm) {
  const ctx = getAudio(); if (!ctx) return;
  stopClicks();
  const pulse = t.bottom === 8 ? 60 / (bpm * 2) : t.bottom === 2 ? 60 / (bpm / 1.4) : 60 / bpm;
  const start = ctx.currentTime + 0.1;
  for (let bar = 0; bar < 2; bar++) t.pattern.forEach((acc, i) => {
    const at = start + (bar * t.pattern.length + i) * pulse;
    blip(ctx, at, acc === 1 ? 1320 : acc === 0.5 ? 1040 : 880, 0.05, acc === 1 ? 0.4 : acc === 0.5 ? 0.22 : 0.12);
  });
}

function TimeSigLearn({ onStart }) {
  const [playing, setPlaying] = useState(null);
  useEffect(() => () => stopClicks(), []);
  function hear(t) { playTimeSig(t, 90); setPlaying(t.id); setTimeout(() => setPlaying(p => (p === t.id ? null : p)), 3200); }
  const row = (t) => (
    <button key={t.id} onClick={() => hear(t)} style={{display:'flex',alignItems:'center',gap:12,width:'100%',textAlign:'left',cursor:'pointer',
      background:'#fff',border:'1.5px solid ' + (playing === t.id ? 'var(--brass)' : 'var(--border)'),borderRadius:10,padding:'8px 10px',color:'var(--text)'}}>
      <TSig top={t.top} bottom={t.bottom} size={26}/>
      <span style={{flex:1}}>
        <span style={{display:'flex',alignItems:'center',gap:4,fontSize:14,fontWeight:900}}>
          {t.feel} × <Glyph item={BEAT_GLYPH[t.unit]} size={30}/> <span style={{fontWeight:700,color:'#6f665b',fontSize:12}}>{t.unit} beats</span>
        </span>
        <span style={{display:'block',fontSize:12,color:'#6f665b'}}>{t.use}</span>
      </span>
      <span style={{fontSize:11,fontWeight:700,color:'var(--muted)'}}>{playing === t.id ? '♪' : 'hear'}</span>
    </button>
  );
  return (
    <div className="card fade-up">
      <h2 style={{fontSize:18,fontWeight:900,margin:'0 0 4px',letterSpacing:'-0.02em'}}>Reading a time signature</h2>
      <p style={{fontSize:13,color:'var(--muted)',margin:'0 0 12px'}}>Two numbers at the start of the music tell you how the beats are grouped into bars.</p>
      <div style={{display:'flex',alignItems:'center',gap:14,background:'var(--brass-bg)',borderRadius:10,padding:'10px 14px',marginBottom:14}}>
        <TSig top={3} bottom={4} size={46}/>
        <div style={{fontSize:13,lineHeight:1.6}}>
          <b>Top number</b> = how many beats in each bar.<br/>
          <b>Bottom number</b> = which note is one beat: <b>4</b> crotchet, <b>2</b> minim, <b>8</b> quaver.
        </div>
      </div>
      <div style={{fontSize:11,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',margin:'0 0 6px'}}>Simple time -- each beat splits into 2 -- tap to hear</div>
      <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:14}}>{TIME_SIGS.filter(t => t.kind === 'simple').map(row)}</div>
      <div style={{fontSize:11,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',margin:'0 0 6px'}}>Compound time -- each beat splits into 3</div>
      <p style={{fontSize:12,color:'#6f665b',margin:'0 0 6px',lineHeight:1.5}}>When the top number is 6, 9 or 12 over 8, group the quavers in threes: each group is one dotted-crotchet beat. So 6/8 has <b>two</b> beats, not six.</p>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>{TIME_SIGS.filter(t => t.kind === 'compound').map(row)}</div>
      <button className="primary-btn" style={{marginTop:14}} onClick={onStart}>Start the drill →</button>
    </div>
  );
}

// Fill a bar of `total` crotchet beats with symbols that fit the time (quaver-based bars use small values).
function fillBar(total, small) {
  const pool = small
    ? [...NV_NOTES.filter(n => n.beats <= 1 && n.beats >= 0.5), NV_RESTS.find(r => r.id === 'quaver'), NV_DOTTED.find(d => d.id === 'crotchet')]
    : [...NV_NOTES.filter(n => n.beats >= 0.5 && n.beats <= 3), ...NV_RESTS.filter(r => r.beats === 1), ...NV_DOTTED.filter(d => d.beats >= 1.5 && d.beats <= 3)];
  for (let tries = 0; tries < 60; tries++) {
    let rem = total; const out = [];
    while (rem > 1e-9 && out.length < 6) {
      const x = pick(pool.filter(p => p.beats <= rem + 1e-9)); if (!x) break;
      out.push(x); rem -= x.beats;
    }
    if (rem < 1e-9 && out.length >= 2 && out.some(o => !o.rest)) return out;
  }
  return [NV_NOTES.find(n => n.id === 'crotchet')];
}

const TIMESIG_LEVELS = [
  { n: 1, label: 'What do the numbers mean?',        kind: 'meaning', time: 9 },
  { n: 2, label: 'Which time signature fits the bar?', kind: 'fits',  time: 12 },
  { n: 3, label: 'Listen: 2, 3 or 4 beats in a bar?', kind: 'listen', time: 12 },
  { n: 4, label: 'Simple or compound -- how many beats do you feel?', kind: 'feel', time: 9 },
];
function genTimeSigQuestion(lv, prev) {
  const uid = Math.random();
  if (lv.kind === 'meaning') {
    const t = pick(TIME_SIGS.filter(x => x.kind === 'simple' || x.id === '6/8'));
    const label = (x) => x.feel + ' ' + x.unit + ' beat' + (x.feel > 1 ? 's' : '');
    const answer = label(t);
    const wrong = [...new Set([
      t.top + ' ' + (t.unit === 'crotchet' ? 'quaver' : 'crotchet') + ' beats',
      (t.top + 1) + ' ' + t.unit + ' beats',
      t.bottom + ' ' + t.unit + ' beats',
      ...TIME_SIGS.map(label),
    ])].filter(x => x !== answer);
    return { kind: 'meaning', key: t.id, t, answer, choices: shuffle([answer, ...sampleN(wrong, 3)]), uid };
  }

  const first = t.top !== t.feel ? [t.top + ' beats'] : [];
  const rest = sampleN(others.filter(n => n !== t.top).map(n => n + ' beats'), 3 - first.length);
  return { kind: 'feel', key: t.id, t, answer, choices: shuffle([answer, ...first, ...rest]), uid };
}
function TimeSigQuestion({ q, level, given, locked, onAnswer, pixel }) {

const TIMESIG_DRILL = {
  id: 'time-signatures', label: 'Time Signatures', levels: TIMESIG_LEVELS, generate: genTimeSigQuestion,
  check: (q, ans) => ans !== null && ans !== undefined && ans === q.answer,
  answerLabel: (q) => q.kind === 'meaning' ? q.t.id + ' = ' + q.answer + ' in each bar'
    : q.kind === 'feel' ? q.t.id + ' is ' + q.t.kind + ' time: ' + q.answer + ' -- ' + q.t.use : q.t.id + ' (' + q.t.use.split(' --')[0] + ')',

// ─── Concept: Reading the Staff (Phase 101, 2026-09-23) ──────────────────────────
// Pitch track, right after Note Names: keyboard first, then the staff tied straight back to it.
// Positions use a "diatonic number" d = octave*7 + letter index (C=0 ... B=6), so C4 (middle C) = 28.
// One coordinate system for both staves: y = 100 - (d - 30) * 5 (E4, the treble's bottom line, at y=100).
const STAFF_LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const CLEFS = {
  treble: { lines: [30, 32, 34, 36, 38], low: 30, high: 38 },   // E4 G4 B4 D5 F5
  bass:   { lines: [18, 20, 22, 24, 26], low: 18, high: 26 },   // G2 B2 D3 F3 A3
};
function dName(d) { return STAFF_LETTERS[((d % 7) + 7) % 7]; }
function dOct(d) { return Math.floor(d / 7); }
function dLabel(d) { return dName(d) + dOct(d); }
function dY(d) { return 100 - (d - 30) * 5; }
function ledgersFor(d, low, high) {
  const out = [];
  if (d < low) for (let p = low - 2; p >= d; p -= 2) out.push(p);
  if (d > high) for (let p = high + 2; p <= d; p += 2) out.push(p);
  return out;
}
const MUSIC_FONT = "'Noto Music','Apple Symbols','Segoe UI Symbol',serif";

// clef: 'treble' | 'bass' | 'grand'. notes: [{ d, color, staff }]. labels: text under each note.
// On the grand staff the bass staff is pushed down by GRAND_GAP so the two staves read as two.
const GRAND_GAP = 20;
// Clef glyphs come from whatever music font the device has, and fonts disagree on size and baseline,
// so each clef's ink is measured (drawn on a canvas, pixels scanned) and scaled
// (font set via style, not the fontFamily attribute: the page's * { font-family } rule beats SVG attributes) to a fixed box on the staff:
// treble from 1.3 spaces above the top line to 1.6 below the bottom line, bass from the top line
// down 3.1 spaces. That keeps the treble curl on G and the bass dots around F on any font.
const CLEF_GLYPH = { treble: { ch: '𝄞', top: 38, topPad: 16, bottom: 30, bottomPad: 13 }, bass: { ch: '𝄢', top: 26, topPad: 1, bottom: 26, bottomPad: 31 } };
function ClefGlyph({ clef, yOf, st, ink }) {
  const g = CLEF_GLYPH[clef];
  const ref = useRef(null);
  const [tf, setTf] = useState(null);
  const yTop = yOf(g.top, st) - g.topPad, yBot = yOf(g.bottom, st) + g.bottomPad;
  useEffect(() => {
    let live = true;
    const measure = () => {
      try {
                // Draw the glyph on a scratch canvas and scan its pixels: text metrics alone disagree
        // between fonts, the pixels don't.
        const cv = document.createElement('canvas'); cv.width = 160; cv.height = 160;
        const c = cv.getContext('2d');
        c.font = '40px ' + MUSIC_FONT; c.fillStyle = '#000'; c.fillText(g.ch, 40, 100);
        const px = c.getImageData(0, 0, 160, 160).data;
        let minX = 999, minY = 999, maxY = -1;
        for (let yy = 0; yy < 160; yy++) for (let xx = 0; xx < 160; xx++) if (px[(yy * 160 + xx) * 4 + 3] > 60) {
          if (yy < minY) minY = yy; if (yy > maxY) maxY = yy; if (xx < minX) minX = xx;
        }
        if (!live || maxY < 0) return;
        const asc = 100 - minY, desc = maxY - 100, left = 40 - minX;
        const k = (yBot - yTop) / (asc + desc);
        setTf(`translate(${8 + left * k} ${yTop + asc * k}) scale(${k})`);
      } catch (e) {}
    };
    measure();
    // Re-measure once the music font has actually loaded (it may arrive after first paint).
    try { document.fonts && document.fonts.load('40px "Noto Music"', g.ch).then(measure, () => {}); } catch (e) {}
    try { document.fonts && document.fonts.ready.then(measure); } catch (e) {}
    const t = setTimeout(measure, 1200), t2 = setTimeout(measure, 3500);
    return () => { live = false; clearTimeout(t); clearTimeout(t2); };
  }, [yTop, yBot]);
  return (
    <g transform={tf || ''} style={{visibility: tf ? 'visible' : 'hidden'}}>
      <text ref={ref} x="0" y="0" fontSize="40" fill={ink} style={{fontFamily: MUSIC_FONT}}>{g.ch}</text>
    </g>
  );
}
function StaffView({ clef = 'grand', notes = [], ink = '#241f1a', width = 300, labels, spread }) {
  const staves = clef === 'grand' ? ['treble', 'bass'] : [clef];
  const staffOf = (n) => n.staff || (clef === 'grand' ? (n.d >= 28 ? 'treble' : 'bass') : clef);
  const yOf = (d, st) => dY(d) + (clef === 'grand' && st === 'bass' ? GRAND_GAP : 0);
  const ys = [];
  staves.forEach(st => { ys.push(yOf(CLEFS[st].high, st) - 14, yOf(CLEFS[st].low, st) + 14); });
  notes.forEach(n => { const st = staffOf(n); ys.push(yOf(n.d, st) - 10, yOf(n.d, st) + 10); });
  const y0 = Math.min(...ys) - 4, y1 = Math.max(...ys) + (labels ? 22 : 4);
  const noteX = (i) => spread ? 72 + i * ((width - 92) / Math.max(1, notes.length - 1)) : width * 0.62;
  return (
    <svg viewBox={`0 ${y0} ${width} ${y1 - y0}`} style={{width:'100%',maxWidth:width * 1.5,display:'block',margin:'0 auto'}}>
      {staves.map(st => CLEFS[st].lines.map(l => <line key={st + l} x1="4" x2={width - 4} y1={yOf(l, st)} y2={yOf(l, st)} stroke={ink} strokeOpacity="0.55" strokeWidth="1.2"/>))}
      {clef === 'grand' && <line x1="4" x2="4" y1={yOf(38, 'treble')} y2={yOf(18, 'bass')} stroke={ink} strokeWidth="1.6"/>}
      {staves.map(st => <ClefGlyph key={'c' + st} clef={st} st={st} yOf={yOf} ink={ink}/>)}
      {notes.map((n, i) => {
        const x = noteX(i), st = staffOf(n), y = yOf(n.d, st);
        const lw = ledgersFor(n.d, CLEFS[st].low, CLEFS[st].high);
        return (
          <g key={i}>
            {lw.map(p => <line key={p} x1={x - 12} x2={x + 12} y1={yOf(p, st)} y2={yOf(p, st)} stroke={ink} strokeWidth="1.4"/>)}
            <ellipse cx={x} cy={y} rx="7" ry="5" transform={`rotate(-20 ${x} ${y})`} fill={n.color || ink} data-d={n.d}/>
            {labels && labels[i] && <text x={x} y={y1 - 6} textAnchor="middle" fontSize="11" fontWeight="800" fill={n.color || ink}>{labels[i]}</text>}
          </g>
        );
      })}
    </svg>
  );
}

// Keyboard helpers: a 3-octave keyboard from C3 (index 0) to B5 (index 35).
const KB_START_OCT = 3;
function dToKey(d) { return (dOct(d) - KB_START_OCT) * 12 + [0, 2, 4, 5, 7, 9, 11][((d % 7) + 7) % 7]; }
function keyToD(i) { const pc = i % 12, w = [0, 2, 4, 5, 7, 9, 11].indexOf(pc); return w < 0 ? null : (Math.floor(i / 12) + KB_START_OCT) * 7 + w; }

const LANDMARKS = [
  { d: 28, name: 'Middle C', tip: 'On its own little ledger line between the two staves -- the middle of the piano.' },
  { d: 32, name: 'Treble G', tip: 'The treble clef curls around this line -- it’s also called the G clef.' },
  { d: 24, name: 'Bass F', tip: 'The two dots of the bass clef sit either side of this line -- the F clef.' },
  { d: 35, name: 'Treble C', tip: 'Third space of the treble staff, one octave above middle C.' },
  { d: 21, name: 'Bass C', tip: 'Second space of the bass staff, one octave below middle C.' },
  { d: 42, name: 'High C', tip: 'Two ledger lines above the treble staff.' },
  { d: 14, name: 'Low C', tip: 'Two ledger lines below the bass staff.' },
];

function StaffExplorer() {
  const [d, setD] = useState(28);
  const lm = LANDMARKS.find(l => l.d === d);
  const key = dToKey(d);
  return (
    <div style={{background:'var(--brass-bg)',borderRadius:10,padding:'10px',margin:'12px 0'}}>
      <div style={{fontSize:12,fontWeight:800,marginBottom:6}}>Tap a landmark, or a white key</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:6}}>
        {LANDMARKS.map(l => <button key={l.d} className={'chip' + (l.d === d ? ' active' : '')} style={{padding:'4px 9px',fontSize:12}} onClick={() => setD(l.d)}>{l.name}</button>)}
      </div>
      <StaffView clef="grand" notes={[{ d, color: '#a8823f' }]}/>
      <div style={{textAlign:'center',fontSize:15,fontWeight:900,margin:'2px 0 6px'}}>
        {dName(d)}{lm ? ' -- ' + lm.name : ''} <span style={{fontSize:11,color:'var(--muted)',fontWeight:700}}>({dLabel(d)})</span>
      </div>
      {lm && <div style={{textAlign:'center',fontSize:12,color:'#6f665b',marginBottom:6}}>{lm.tip}</div>}
      {key >= 0 && key < 36
        ? <TapKeyboard octaves={3} labels="white" marks={{ [key]: 'target' }} onTap={(i) => { const nd = keyToD(i); if (nd !== null) setD(nd); }}/>
        : <div style={{textAlign:'center',fontSize:11,color:'var(--muted)'}}>(off this keyboard -- {d > 41 ? 'higher' : 'lower'} than shown)</div>}
    </div>
  );
}

function StaffLetters({ clef }) {
  const c = CLEFS[clef];
  const ds = []; for (let d = c.low; d <= c.high; d++) ds.push(d);
  return (
    <StaffView clef={clef} spread width={300}
      notes={ds.map(d => ({ d, color: (d - c.low) % 2 === 0 ? '#241f1a' : '#a8823f' }))}
      labels={ds.map(dName)}/>
  );
}

// Phase 101b (Sohyun's idea): fold the grand staff at middle C like a decalcomania print.
// Mirror of any position d is 56 - d (middle C = 28 is the fold): treble C (35) <-> bass C (21),
// high C (42) <-> low C (14), the G line (32) <-> the F line (24) -- so the G clef and F clef
// sit on mirror-image lines. The staves are drawn with no gap here so the reflection is exact.
const FOLD_PAIRS = [
  { d: 35, color: '#a8823f', label: 'Treble C ↔ Bass C' },
  { d: 42, color: '#4f7a45', label: 'High C ↔ Low C' },
];
const FOLD_LINE_COLOR = '#3f8fc9';

// Phase 101c: Sohyun's clef story -- the Queen of G and the King of F. Grounded in the real
// history (both clefs began as the letters G and F), told as a story.
function ClefStory() {
  const card = (title, clef, d, body) => (
    <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:10,padding:'10px 12px'}}>
      <div style={{fontSize:14,fontWeight:900,marginBottom:2}}>{title}</div>
      <StaffView clef={clef} notes={[{ d, color: '#3f8fc9' }]} width={220}/>
      <div style={{fontSize:13,color:'#6f665b',lineHeight:1.55,marginTop:4}}>{body}</div>
    </div>
  );
  return (
    <div style={{margin:'12px 0',display:'flex',flexDirection:'column',gap:10}}>
      <div style={{fontSize:14,fontWeight:800}}>Why they’re called the G clef and the F clef</div>
      {card('The Queen lives on G', 'treble', 32,
        <>Long ago the treble clef was simply a written letter <b>G</b>. Over the centuries it grew more and more elegant, until it became a spiral -- a winding path that closes in on one line and one line only: the second line up. That line is the Queen’s home. Follow the swirl inward and you arrive at her door, so any note sitting on that line is <b>G</b>. That’s why musicians call it the <b>G clef</b>.</>)}
      {card('The King lives on F', 'bass', 24,
        <>The bass clef began as a letter <b>F</b>. The King’s house is the fourth line up, and he never goes unguarded: the clef’s two dots are his guards, one standing just above his line, one just below. Find the two guards and the line between them is <b>F</b> -- the <b>F clef</b>.</>)}
      <div style={{fontSize:13,color:'#6f665b',lineHeight:1.55}}>
        The two palaces mirror each other: the Queen’s G is five notes above middle C, the King’s F is five notes below. Fold the staff at middle C (below) and her line lands exactly on his.
      </div>
    </div>
  );
}

function FoldStaff() {
  const [phase, setPhase] = useState('open'); // open | folding | printed
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const reduce = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
  function fold() {
    timers.current.forEach(clearTimeout); timers.current = [];
    if (reduce) { setPhase('printed'); return; }
    setPhase('folding');
    timers.current.push(setTimeout(() => setPhase('printed'), 1300));
  }
  const W = 300, foldY = dY(28);
  const printed = phase === 'printed';
  const line = (d, extra) => <line key={d} x1="4" x2={W - 4} y1={dY(d)} y2={dY(d)} stroke={extra || '#241f1a'} strokeOpacity={extra ? 1 : 0.55} strokeWidth={extra ? 2.4 : 1.2}/>;
  const ink = (d, color, x) => {
    const st = d >= 28 ? 'treble' : 'bass';
    return (
      <g key={'i' + d}>
        {ledgersFor(d, CLEFS[st].low, CLEFS[st].high).map(p => <line key={p} x1={x - 12} x2={x + 12} y1={dY(p)} y2={dY(p)} stroke="#241f1a" strokeWidth="1.4"/>)}
        <ellipse cx={x} cy={dY(d)} rx="7.5" ry="5.5" transform={`rotate(-20 ${x} ${dY(d)})`} fill={color}/>
      </g>
    );
  };
  const topY = dY(44), botY = dY(12);
  const bottomStyle = {
    transformOrigin: `0px ${foldY}px`, transformBox: 'view-box',
    transform: phase === 'folding' ? 'scaleY(-1)' : 'scaleY(1)',
    transition: reduce ? 'none' : 'transform 0.6s ease-in-out',
  };
  // fold up (0.6s), hold, then open again (the 'printed' state transitions back to scaleY(1))
  return (
    <div style={{background:'var(--brass-bg)',borderRadius:10,padding:'10px',margin:'12px 0'}}>
      <div style={{fontSize:14,fontWeight:800,marginBottom:2}}>Fold the staff at middle C</div>
      <div style={{fontSize:12,color:'#6f665b',marginBottom:6,lineHeight:1.5}}>
        Like a paint print: put ink on the treble side, fold the paper along middle C, and open it.
      </div>
      <svg viewBox={`0 ${topY} ${W} ${botY - topY}`} style={{width:'100%',maxWidth:450,display:'block',margin:'0 auto',overflow:'visible'}}>
        <g>
          {[30, 32, 34, 36, 38].map(d => line(d, d === 32 ? FOLD_LINE_COLOR : null))}
          <ClefGlyph clef="treble" st="treble" yOf={(d) => dY(d)} ink="#241f1a"/>
          {FOLD_PAIRS.map((p, i) => ink(p.d, p.color, 150 + i * 60))}
        </g>
        <line x1="4" x2={W - 4} y1={foldY} y2={foldY} stroke="#a8823f" strokeWidth="1.6" strokeDasharray="6 5"/>
        <text x={W - 6} y={foldY - 4} textAnchor="end" fontSize="9" fontWeight="800" fill="#a8823f">fold</text>
        <g style={bottomStyle}>
          <rect x="0" y={foldY + 1} width={W} height={botY - foldY} fill="var(--brass-bg)"/>
          {[18, 20, 22, 24, 26].map(d => line(d, printed && d === 24 ? FOLD_LINE_COLOR : null))}
          <ClefGlyph clef="bass" st="bass" yOf={(d) => dY(d)} ink="#241f1a"/>
          {printed && FOLD_PAIRS.map((p, i) => ink(56 - p.d, p.color, 150 + i * 60))}
        </g>
        <line x1={90 - 12} x2={90 + 12} y1={foldY} y2={foldY} stroke="#241f1a" strokeWidth="1.6"/>
        <ellipse cx={90} cy={foldY} rx="7.5" ry="5.5" transform={`rotate(-20 90 ${foldY})`} fill="#241f1a"/>
        <text x={90} y={foldY - 9} textAnchor="middle" fontSize="8.5" fontWeight="800" fill="#241f1a">middle C</text>
      </svg>
      <div style={{display:'flex',gap:8,justifyContent:'center',margin:'8px 0 6px'}}>
        <button className="ghost-btn" onClick={fold} disabled={phase === 'folding'}>{printed ? 'Fold again' : 'Fold it'}</button>
        {phase !== 'open' && <button className="ghost-btn" onClick={() => setPhase('open')}>Wipe</button>}
      </div>
      <div style={{fontSize:12,lineHeight:1.7,opacity:printed ? 1 : 0.45,transition:'opacity 0.4s'}}>
        <div><span style={{display:'inline-block',width:10,height:10,borderRadius:5,background:'#241f1a',marginRight:6}}/>Middle C sits right on the fold -- it is its own mirror.</div>
        {FOLD_PAIRS.map(p => <div key={p.d}><span style={{display:'inline-block',width:10,height:10,borderRadius:5,background:p.color,marginRight:6}}/>{p.label}</div>)}
        <div><span style={{display:'inline-block',width:10,height:3,background:FOLD_LINE_COLOR,margin:'0 6px 3px 0'}}/>Treble G line ↔ Bass F line -- the G clef curls round one, the F clef’s dots hug the other.</div>
      </div>
    </div>
  );
}

// Why the gap between the staves is really one line: a treble A with two ledger lines sits
// exactly on the bass staff's top line.
function LedgerMirror() {
  const W = 300, topY = dY(41), botY = dY(15);
  const guide = (d, text, below) => (
    <g key={'g' + d}>
      <line x1="4" x2={W - 4} y1={dY(d)} y2={dY(d)} stroke="#a8823f" strokeWidth="1" strokeDasharray="3 4"/>
      <text x={below ? 6 : W - 4} y={below ? dY(d) + 11 : dY(d) - 3} textAnchor={below ? 'start' : 'end'} fontSize="8.5" fontWeight="800" fill="#a8823f">{text}</text>
    </g>
  );
  const head = (x, d, color) => <ellipse cx={x} cy={dY(d)} rx="7" ry="5" transform={`rotate(-20 ${x} ${dY(d)})`} fill={color}/>;
  return (
    <div style={{margin:'10px 0'}}>
      <div style={{fontSize:14,fontWeight:800,marginBottom:2}}>The gap is really one missing line</div>
      <div style={{fontSize:12,color:'#6f665b',marginBottom:6,lineHeight:1.5}}>

      </div>

const STAFF_LEVELS = [
  { n: 1, label: 'Treble clef notes',               kind: 'name', range: [29, 39], clef: 'treble', time: 7 },
  { n: 2, label: 'Bass clef notes',                 kind: 'name', range: [17, 27], clef: 'bass', time: 7 },
  { n: 3, label: 'Both clefs + ledger lines',        kind: 'name', range: null, clef: 'mixed', time: 8 },
  { n: 4, label: 'Find it on the keyboard (exact octave)', kind: 'key', range: [21, 41], clef: 'grand', time: 10 },
];
function genStaffQuestion(lv, prev) {
  const uid = Math.random();
  let d, clef;
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  for (let n = 0; n < 12; n++) {
    if (lv.clef === 'mixed') { clef = Math.random() < 0.5 ? 'treble' : 'bass'; d = clef === 'treble' ? rnd(26, 42) : rnd(14, 30); }
    else { clef = lv.clef; d = rnd(lv.range[0], lv.range[1]); }
    if (!prev || prev.d !== d) break;
  }
  const staff = lv.clef === 'grand' ? (d > 28 ? 'treble' : d < 28 ? 'bass' : (Math.random() < 0.5 ? 'treble' : 'bass')) : clef;
  return { kind: lv.kind, key: clef + d, d, clef, staff, answer: lv.kind === 'key' ? dToKey(d) : dName(d), uid };
}
function StaffQuestion({ q, level, given, locked, onAnswer, pixel }) {
  const done = !!given;
  const ink = pixel ? '#f8edd4' : '#241f1a';
  const btnCls = pixel ? 'pixel-choice' : 'choice-btn';
  useEffect(() => {
    if (q.kind !== 'name' || locked) return;
    function onKey(e) { const L = (e.key || '').toUpperCase(); if (STAFF_LETTERS.includes(L)) onAnswer(L); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [q, locked, onAnswer]);
  const prompt = q.kind === 'key' ? ['Tap this exact note on the keyboard', 'FIND IT ON THE KEYS'] : ['Name this note', 'NAME THIS NOTE'];
  const marks = {};
  if (q.kind === 'key' && done) { marks[q.answer] = 'good'; if (!given.ok && given.ans !== null && given.ans !== undefined) marks[given.ans] = 'bad'; }
  return (
    <div>
      <p style={pixel ? {fontSize:10,textAlign:'center',margin:'0 0 8px'} : {fontSize:14,fontWeight:700,textAlign:'center',margin:'0 0 8px',color:'var(--muted)'}}>{pixel ? prompt[1] : prompt[0]}</p>

        <StaffView clef={q.clef === 'mixed' ? 'grand' : q.clef} ink={ink} notes={[{ d: q.d, staff: q.staff, color: done ? (given.ok ? '#4f7a45' : '#b5483b') : ink }]}/>
      </div>
      {q.kind === 'name' ? (
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:6}}>
          {STAFF_LETTERS.map(l => <button key={l} disabled={locked} onClick={() => onAnswer(l)} className={btnCls + (!done ? '' : l === q.answer ? ' good' : given.ans === l ? ' bad' : '')}>{l}</button>)}
        </div>
      ) : (
        <TapKeyboard octaves={3} labels={done ? 'white' : null} marks={marks} pixel={pixel} onTap={locked ? null : (i) => onAnswer(i)}/>
      )}
      {done && q.kind === 'name' && <div style={{marginTop:10}}><TapKeyboard octaves={3} labels="white" pixel={pixel} marks={dToKey(q.d) >= 0 && dToKey(q.d) < 36 ? { [dToKey(q.d)]: 'good' } : {}}/></div>}
    </div>
  );
}

const DYNAMICS = [
  { id: 'pp', it: 'pianissimo',  meaning: 'very soft',        vol: 0.05 },
  { id: 'p',  it: 'piano',       meaning: 'soft',             vol: 0.09 },

const CHANGES = [
  { id: 'cresc', sign: '<', it: 'crescendo (cresc.)', meaning: 'gradually louder' },

const DYN_FONT = "Georgia,'Times New Roman',serif";

function DynMark({ id, size = 30, color = 'currentColor' }) {
  return <span style={{fontFamily:DYN_FONT,fontStyle:'italic',fontWeight:900,fontSize:size,color,letterSpacing:'-0.02em'}}>{id}</span>;
}
function Hairpin({ dir, w = 90, h = 22, color = 'currentColor' }) {
  const open = dir === 'cresc';
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width={w} height={h} style={{display:'inline-block',verticalAlign:'middle'}}>

}
function ChangeMark({ c, color, size = 26 }) {

// Four crotchets with an articulation drawn on them (stems up, marks below the heads... kept above for clarity).
function ArticBar({ mark, ink = '#241f1a', width = 220 }) {
  const xs = [40, 90, 140, 190], y = 62;
  const marks = xs.map((x, i) => {
    const my = y + 16;
    if (mark === 'dot') return <circle key={i} cx={x} cy={my} r="2.6" fill={ink}/>;
    if (mark === 'wedge') return <path key={i} d={`M${x - 3},${my - 4} L${x + 3},${my - 4} L${x},${my + 5} Z`} fill={ink}/>;
    if (mark === 'tenuto') return <line key={i} x1={x - 7} x2={x + 7} y1={my} y2={my} stroke={ink} strokeWidth="2.4"/>;
    if (mark === 'accent') return i === 0 || i === 2 ? <polyline key={i} points={`${x - 8},${my - 4} ${x + 8},${my} ${x - 8},${my + 4}`} fill="none" stroke={ink} strokeWidth="2"/> : null;
    return null;
  });
  return (
    <svg viewBox={`0 6 ${width} 86`} style={{width:'100%',maxWidth:width * 1.4,display:'block',margin:'0 auto'}}>
      {[46, 54, 62, 70, 78].map(ly => <line key={ly} x1="8" x2={width - 8} y1={ly - 8} y2={ly - 8} stroke={ink} strokeOpacity="0.35"/>)}
      {xs.map((x, i) => <NoteShape key={i} base={mark === 'fermata' && i === 3 ? 2 : 1} cx={x} ink={ink}/>)}
      {marks}
      {mark === 'slur' && <path d={`M${xs[0] - 4},${y + 14} Q${(xs[0] + xs[3]) / 2},${y + 34} ${xs[3] + 4},${y + 14}`} fill="none" stroke={ink} strokeWidth="2"/>}
      {mark === 'fermata' && <g><path d={`M${xs[3] - 11},${16} Q${xs[3]},${2} ${xs[3] + 11},${16}`} fill="none" stroke={ink} strokeWidth="2.4"/><circle cx={xs[3]} cy={13} r="2.4" fill={ink}/></g>}
    </svg>
  );
}

// ── sound ──
function playDyn(vol, n = 4) {
  const ctx = getAudio(); if (!ctx) return; stopClicks();
  const t0 = ctx.currentTime + 0.08, notes = [523, 587, 659, 698, 784];
  for (let i = 0; i < n; i++) blip(ctx, t0 + i * 0.42, notes[i % 5], 0.36, vol, 'triangle');
}
function playChange(id) {
  const ctx = getAudio(); if (!ctx) return; stopClicks();
  const t0 = ctx.currentTime + 0.08, notes = [523, 587, 659, 698, 784, 698, 659, 587];
  notes.forEach((f, i) => {
    let v = id === 'cresc' ? 0.04 + i * 0.07 : id === 'dim' ? 0.53 - i * 0.07 : 0.12;
    if (id === 'sfz' && i === 3) v = 0.6;
    if (id === 'fp') v = i === 0 ? 0.55 : 0.07;
    blip(ctx, t0 + i * 0.32, f, 0.28, v, 'triangle');
  });
}
function playArtic(mark) {
  const ctx = getAudio(); if (!ctx) return; stopClicks();
  const t0 = ctx.currentTime + 0.08, beat = 0.5, notes = [523, 587, 659, 523];
  notes.forEach((f, i) => {
    let len = beat * 0.55, v = 0.22;
    if (mark === 'dot') len = beat * 0.22;
    if (mark === 'wedge') { len = beat * 0.1; v = 0.3; }
    if (mark === 'slur' || mark === 'tenuto') len = beat * 1.02;
    if (mark === 'tenuto') v = 0.28;
    if (mark === 'accent' && (i === 0 || i === 2)) v = 0.55;
    if (mark === 'accent' && (i === 1 || i === 3)) v = 0.14;
    if (mark === 'fermata' && i === 3) len = beat * 3.2;
    blip(ctx, t0 + i * beat, f, len, v, 'triangle');
  });
}

const DYN_LEVELS = [
  { n: 1, label: 'Dynamics: what does it mean?',       kind: 'dynMeaning', time: 8 },
  { n: 2, label: 'Which is louder?',                    kind: 'louder', time: 6 },
  { n: 3, label: 'Signs for changing volume',            kind: 'change', time: 8 },
  { n: 4, label: 'Articulation: name the marking',       kind: 'artic', time: 9 },
  { n: 5, label: 'Listen: louder, softer, short or smooth?', kind: 'listen', time: 12 },
];
function genDynQuestion(lv, prev) {
  const uid = Math.random();
  const notPrev = (list, key) => { let x = pick(list), n = 0; while (prev && prev.key === key(x) && n++ < 10) x = pick(list); return x; };
  if (lv.kind === 'dynMeaning') {
    const d = notPrev(DYNAMICS, x => x.id);
    const answer = d.it + ' -- ' + d.meaning;
    return { kind: lv.kind, key: d.id, d, answer, choices: shuffle([answer, ...sampleN(DYNAMICS.filter(x => x !== d).map(x => x.it + ' -- ' + x.meaning), 3)]), uid };
  }
  if (lv.kind === 'louder') {
    const pair = sampleN(DYNAMICS, 2);
    const answer = DYNAMICS.indexOf(pair[0]) > DYNAMICS.indexOf(pair[1]) ? pair[0].id : pair[1].id;
    return { kind: lv.kind, key: pair.map(p => p.id).join(), pair, answer, choices: pair.map(p => p.id), uid };
  }
  if (lv.kind === 'change') {
    const c = notPrev(CHANGES, x => x.id);
    return { kind: lv.kind, key: c.id, c, answer: c.meaning, choices: shuffle(CHANGES.map(x => x.meaning)), uid };
  }
  if (lv.kind === 'artic') {
    const a = notPrev(ARTICS, x => x.id);
    return { kind: lv.kind, key: a.id, a, answer: a.name, choices: shuffle([a.name, ...sampleN(ARTICS.filter(x => x !== a).map(x => x.name), 3)]), uid };
  }
  const opts = [
    { id: 'cresc', label: 'Getting louder', play: () => playChange('cresc') },
    { id: 'dim', label: 'Getting softer', play: () => playChange('dim') },
    { id: 'staccato', label: 'Short (staccato)', play: () => playArtic('dot') },
    { id: 'legato', label: 'Smooth (legato)', play: () => playArtic('slur') },
  ];
  const o = notPrev(opts, x => x.id);
  return { kind: 'listen', key: o.id, o, answer: o.label, choices: opts.map(x => x.label), uid };
}
function DynQuestion({ q, level, given, locked, onAnswer, pixel }) {
  const done = !!given;
  const ink = pixel ? '#f8edd4' : '#241f1a';
  const btnCls = pixel ? 'pixel-choice' : 'choice-btn';

  const prompt = (t, px) => <p style={pixel ? {fontSize:10,textAlign:'center',margin:'0 0 10px'} : {fontSize:14,fontWeight:700,textAlign:'center',margin:'0 0 10px',color:'var(--muted)'}}>{pixel ? px : t}</p>;
  useEffect(() => {
    if (q.kind !== 'listen') return;
    const t = setTimeout(() => q.o.play(), 250);

  }, [q.uid]);
  const grid = (render, cols = 2) => (
    <div style={{display:'grid',gridTemplateColumns:'repeat(' + cols + ',1fr)',gap:8}}>
      {q.choices.map(c => <button key={c} disabled={locked} onClick={() => { stopClicks(); onAnswer(c); }} className={btnCls + st(c)} style={{padding:'12px 6px'}}>{render(c)}</button>)}

  const big = (node) => <div style={{textAlign:'center',margin:'4px 0 16px',color:ink,minHeight:50,display:'flex',justifyContent:'center',alignItems:'center'}}>{node}</div>;
  if (q.kind === 'dynMeaning') return <div>{prompt('What does this mean?', 'WHAT DOES IT MEAN?')}{big(<DynMark id={q.d.id} size={56} color={ink}/>)}{grid(c => c)}</div>;
  if (q.kind === 'louder') return <div>{prompt('Which one is louder?', 'WHICH IS LOUDER?')}{grid(c => <DynMark id={c} size={pixel ? 22 : 34}/>)}</div>;
  if (q.kind === 'change') return <div>{prompt('What does this sign mean?', 'WHAT DOES IT MEAN?')}{big(<span style={{transform:'scale(1.6)',display:'inline-block'}}><ChangeMark c={q.c} color={ink} size={40}/></span>)}{grid(c => c)}</div>;
  if (q.kind === 'artic') return <div>{prompt('What is this marking called?', 'NAME THE MARKING')}<div style={{background:pixel ? 'transparent' : '#fff',borderRadius:8,margin:'0 0 12px'}}><ArticBar mark={q.a.mark} ink={ink}/></div>{grid(c => c)}</div>;
  return (<div>
    {prompt('Listen -- what do you hear?', 'LISTEN! WHAT DO YOU HEAR?')}

      <button className={pixel ? 'pixel-btn' : 'ghost-btn'} onClick={() => q.o.play()} style={pixel ? {fontSize:9} : {fontSize:14,padding:'10px 18px'}}>{pixel ? '♪ PLAY AGAIN' : '♪ Play again'}</button>
    </div>
    {grid(c => c)}
  </div>);
}
const DYN_DRILL = {
  id: 'dynamics', label: 'Dynamics & Articulation', levels: DYN_LEVELS, generate: genDynQuestion,
  check: (q, ans) => ans !== null && ans !== undefined && ans === q.answer,
  answerLabel: (q) => q.kind === 'artic' ? q.a.name + ' -- ' + q.a.meaning : q.kind === 'change' ? q.c.it + ' -- ' + q.c.meaning
    : q.kind === 'louder' ? q.answer : q.answer,
  Question: DynQuestion, Learn: DynLearn,
};

// Registry of drills. Two shapes:
//   { id, label, render }            -- original single-screen drills (Phase 89/90)
//   { id, label, concept }           -- Phase 94 concept sets (Learn + Drill on the shared engine)
// Curriculum (agreed 2026-09-23): main path counts semitones all the way through --
// note names -> tones & semitones -> scales (shape, then fingering) -> key signatures ->
// intervals -> chords (intervals and chords still to build). Side track: rhythm and terms.
const DRILLS = [
  { id: 'note-names', label: 'Note Names', concept: NOTE_NAMES_DRILL, track: 'pitch' },
  { id: 'staff', label: 'Reading the Staff', concept: STAFF_DRILL, track: 'pitch' },
  { id: 'tones', label: 'Tones & Semitones', concept: TONES_DRILL, track: 'pitch' },
  { id: 'scales', label: 'Scales', concept: SCALES_DRILL, track: 'pitch' },
  { id: 'key-signatures', label: 'Key Signatures', concept: KEYSIG_DRILL, track: 'pitch' },
  { id: 'note-values', label: 'Notes & Rests', concept: NOTEVAL_DRILL, track: 'rhythm' },
  { id: 'time-signatures', label: 'Time Signatures', concept: TIMESIG_DRILL, track: 'rhythm' },
  { id: 'rhythm', label: 'Rhythm Cards', concept: RHYTHM_DRILL, track: 'rhythm' },
  { id: 'tempo', label: 'Tempo Race', concept: TEMPO_DRILL, track: 'reading' },
  { id: 'dynamics', label: 'Dynamics & Articulation', concept: DYN_DRILL, track: 'reading' },
];

// URL state: ?drill=<id>&tab=learn|drill&level=<n>&mode=lesson|game&lock=1
// lock=1 (used by the student share link) hides the drill picker and level/mode controls.
function readUrlState() {
  let p;
  try { p = new URLSearchParams(location.search); } catch (e) { p = new URLSearchParams(''); }
  // Old links: Letter Chain now lives in Note Names, Scale Fingering in Scales (Phase 97).
  const alias = { 'letter-chain': 'note-names', 'scale-fingering': 'scales' };
  const asked = alias[p.get('drill')] || p.get('drill');
  const drill = DRILLS.find(d => d.id === asked) ? asked : DRILLS[0].id;
  const level = parseInt(p.get('level'), 10);
  return {
    drill,
    tab: p.get('tab') === 'drill' ? 'drill' : (p.get('level') || p.get('mode') ? 'drill' : 'learn'),
    level: isNaN(level) ? 1 : level,
    mode: p.get('mode') === 'game' ? 'game' : 'lesson',
    lock: p.get('lock') === '1',
  };
}

function App() {
  const [st, setSt] = useState(readUrlState);
  const active = DRILLS.find(d => d.id === st.drill) || DRILLS[0];
  const concept = active.concept || null;
  const level = concept ? ((concept.levels.find(l => l.n === st.level) || concept.levels[0]).n) : st.level;

  useEffect(() => {
    try {
      const p = new URLSearchParams();
      p.set('drill', active.id);
      if (concept) { p.set('tab', st.tab); if (st.tab === 'drill') { p.set('level', level); p.set('mode', st.mode); } }
      if (st.lock) p.set('lock', '1');
      history.replaceState(null, '', location.pathname + '?' + p.toString());
    } catch (e) { /* URL sync is a convenience only */ }
  }, [active.id, st.tab, level, st.mode, st.lock]);

  function update(patch) { setSt(prev => ({ ...prev, ...patch })); }

  return (
    <div style={{minHeight:'100vh',background:'var(--bg)'}}>
      <div style={{background:'#fff',borderBottom:'1px solid var(--border)',padding:'16px 20px 18px'}}>
        <a href="index.html" style={{color:'var(--muted)',fontSize:12,textDecoration:'none',display:'block',marginBottom:6}}>
          Back to Piano Butler
        </a>
        <h1 style={{color:'var(--text)',fontSize:19,fontWeight:900,margin:'0 0 2px',letterSpacing:'-0.02em'}}>
          {st.lock ? active.label : 'Practice Drills'}
        </h1>
        <p style={{color:'var(--muted)',fontSize:12,margin:0}}>
          Quick exercises to pull back out whenever a student needs to revisit something.
        </p>
      </div>

      <div style={{maxWidth:480,margin:'0 auto',padding:'24px 16px 60px'}}>
        {!st.lock && (
          <div style={{marginBottom:20}}>
            {[['pitch', 'Pitch -- keyboard, staff, scales'], ['rhythm', 'Rhythm -- beats and bars'], ['reading', 'Reading the music -- terms and signs']].map(([tr, title]) => (
              <div key={tr} style={{marginBottom:10}}>
                <div style={{fontSize:10,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6}}>{title}</div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  {DRILLS.filter(d => d.track === tr).map((d, i) => (
                    <button key={d.id} className={'chip'+(active.id===d.id?' active':'')}
                      onClick={()=>update({ drill: d.id, tab: 'learn', level: 1 })}>
                      {(i + 1) + '. '}{d.label}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}

        {concept ? (
          <>
            <ConceptView concept={concept} tab={st.tab} level={level} mode={st.mode} locked={st.lock} onChange={update} />
            {!st.lock && st.tab === 'drill' && <ShareLink drillId={active.id} level={level} mode={st.mode} />}
          </>
        ) : active.render()}
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  render() {
    if (this.state.hasError) return (
      <div style={{padding:40,textAlign:'center',fontFamily:'Inter,sans-serif'}}>
        <p style={{color:'#241f1a',fontWeight:700}}>Something went wrong loading this page.</p>
        <small style={{color:'#a49b8f'}}>Please refresh the page.</small>
      </div>
    );
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  function tryCompile() {
    if (typeof Babel === 'undefined') { setTimeout(tryCompile, 50); return; }
    try {
      var src = document.getElementById('app-jsx').textContent;
      var compiled = Babel.transform(src, { presets: ['react'] }).code;
      var s = document.createElement('script');
      s.textContent = compiled;
      document.body.appendChild(s);
    } catch(e) {
      document.getElementById('root').innerHTML = '<div style="padding:40px;color:#ef4444;font-family:monospace;font-size:13px"><b>Compile error:</b> ' + e.message + '</div>';
    }
  }
  tryCompile();
});
</script>
</body>
