    const nw = w + d; if (nw < 0 || nw >= whites.length) return;
    playKey(whites[nw], 0.3);
    setLast({ from: w, dir: d, nonce: (last ? last.nonce : 0) + 1 });
    setW(nw); setTrail(t => [...t, name(nw)].slice(-7));
  }
  function start(k) { playKey(whites[k], 0.3); setW(k); setTrail([name(k)]); setLast(null); }
  const W = OCT * 7 * 36;
  const names = {};
  whites.forEach((i, k) => { if (!hide || k === w) names[i] = PC_INFO[i % 12].names[0]; });
  const marks = { [whites[w]]: 'target' };
  const x1 = last ? keyCenterX(whites[last.from]) : 0, x2 = keyCenterX(whites[w]);
  const cur = name(w), prev = last ? name(last.from) : null;
  let note = 'Tap a key to start from, then step up or down.';
  if (last && last.dir > 0) note = prev === 'G' ? 'G → A: after G the alphabet starts again.' : 'Up: one key to the right -- the sound gets higher, the letter goes forwards.';
  if (last && last.dir < 0) note = prev === 'A' ? 'A → G: below A the alphabet wraps round to G.' : 'Down: one key to the left -- the sound gets lower, the letter goes backwards.';
  return (
    <div className="try-box" style={actBox}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={actTitle}>Step up, step down</div>
        <button className={'chip' + (hide ? ' active' : '')} style={{padding:'3px 10px',fontSize:11}} onClick={() => setHide(h => !h)}>{hide ? 'Names hidden' : 'Hide names'}</button>
      </div>
      <div style={actNote}>On the piano, <b>up</b> means to the <b>right</b> and <b>down</b> means to the <b>left</b>. Say the next letter out loud before you press{hide ? ' -- the key shows its name once you land on it' : ''}.</div>
      <svg viewBox={`-1 0 ${W + 2} 30`} style={{width:'100%',display:'block'}}>
        {last && (
          <g key={last.nonce}>
            <path d={`M${x1},28 Q${(x1 + x2) / 2},${-4} ${x2},28`} fill="none" stroke={last.dir > 0 ? '#a8823f' : '#6d8fb3'} strokeWidth="2.5" strokeLinecap="round"
              strokeDasharray="80" strokeDashoffset="80" style={{animation:'drawArc 0.35s ease-out forwards'}}/>
            <text x={x2 + (last.dir > 0 ? 10 : -10)} y="14" textAnchor="middle" fontSize="16" fontWeight="900" fill={last.dir > 0 ? '#a8823f' : '#6d8fb3'} style={{animation:'fadeUp 0.3s both 0.2s'}}>{last.dir > 0 ? '↗' : '↖'}</text>
          </g>
        )}
      </svg>
      <TapKeyboard octaves={OCT} marks={marks} names={names} onTap={(i) => { const k = whites.indexOf(i); if (k >= 0) start(k); else playKey(i); }}/>
      <div style={{display:'flex',gap:6,justifyContent:'center',margin:'8px 0 4px'}}>
        <button className="ghost-btn" disabled={w === 0} onClick={() => move(-1)} style={{color:'#6d8fb3'}}>← Step down</button>
        <button className="ghost-btn" disabled={w === whites.length - 1} onClick={() => move(1)} style={{color:'#a8823f'}}>Step up →</button>
      </div>
      <div style={{textAlign:'center',fontSize:16,fontWeight:900,letterSpacing:'0.06em',minHeight:24}}>
        {trail.map((l, j) => <span key={j} style={{opacity:0.35 + 0.65 * (j + 1) / trail.length}}>{j ? ' → ' : ''}{l}</span>)}
      </div>
      <div style={{textAlign:'center',fontSize:12,color:(prev === 'G' && last.dir > 0) || (prev === 'A' && last && last.dir < 0) ? '#b5483b' : '#6f665b',fontWeight:600,minHeight:18,marginTop:2}}>{note}</div>
    </div>
  );
}

function NoteNamesLearn({ onStart }) {
  const tip = (n, title, body) => <Rule title={title}>{body}</Rule>;
  return (
    <Lesson id="note-names" title="Finding notes on the keyboard" intro={<>The black keys are the map -- they come in groups of 2 and 3.</>} onStart={onStart}>
      <Step title="The black-key map">
      <TapKeyboard octaves={1} labels="all" tint />
      <div style={{display:'flex',fontSize:11,fontWeight:800,margin:'8px 0 18px'}}>
        <div style={{flex:3,textAlign:'center',background:GROUP_TINT.two,padding:'6px 4px',borderRadius:6,marginRight:4}}>2 black keys → C D E</div>
        <div style={{flex:4,textAlign:'center',background:GROUP_TINT.three,padding:'6px 4px',borderRadius:6}}>3 black keys → F G A B</div>
      </div>
      {tip(1, 'C sits just left of the 2 black keys', 'Find any pair of black keys -- the white key right before them is always C. D is between them, E just after.')}
      {tip(2, 'F sits just left of the 3 black keys', 'Before a group of three black keys is always F, then G, A, B.')}
      <FindAll/>

      </Step>
      <Step title="Seven letters, A to G">
      {tip(3, 'Only seven letters, A to G', 'After G the letters start again at A. Every C on the piano looks the same -- only the octave changes.')}
      <NameReveal/>

      </Step>
      <Step title="Up and down">
      {tip(4, 'Up is right, down is left', 'Going up the keyboard (to the right) the sound gets higher and the letters go forwards: C D E F G A B C. Going down (to the left) they go backwards: C B A G F E D C. Practise backwards until it comes as quickly as forwards.')}
      <UpDownWalk/>

      </Step>
      <Step title="Letter chain, out loud">
      <div>
        <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>Say it out loud together</div>
        <LetterChainDrill/>
      </div>
      </Step>
    </Lesson>
  );
}

// ─── Letter steps inside Note Names (Phase 97) ───────────────────────────────────
// Sohyun's Letter Chain folded into Note Names: A-B-C-D-E-F-G comes easily forwards, but going
// backwards or skipping (3rds, 4ths...) inside the 7-letter loop doesn't -- these levels drill
// exactly that, and the spoken call-and-response version lives in the Learn tab.
function letterPc(l) { return PC_INFO.find(p => p.white && p.names[0] === l).pc; }

function LetterCircle({ from, to }) {
  const R = 62, cx = 90, cy = 80;
  const pos = (i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 7; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; };
  return (
    <svg viewBox="0 0 180 160" style={{width:'100%',maxWidth:220,display:'block',margin:'0 auto'}}>
      <circle cx={cx} cy={cy} r={R} fill="none" stroke="#e0d4b8" strokeWidth="2" strokeDasharray="3 5"/>
      <text x={cx} y={cy - 4} textAnchor="middle" fontSize="10" fontWeight="700" fill="#a49b8f">up ↻</text>
      <text x={cx} y={cy + 12} textAnchor="middle" fontSize="10" fontWeight="700" fill="#a49b8f">down ↺</text>
      {LETTERS.map((l, i) => {
        const [x, y] = pos(i);

function shuffle(arr) {

// ─── Sound engine (Phase 121) ────────────────────────────────────────────────────
// Sohyun: use a real piano sound (articulation and dynamics can't be heard with a plain tone),
// and let the count be spoken "1, 2, 3, 4" instead of clicks, as an option.
// Piano: sampled grand piano (tonejs-instruments piano samples, MIT) served from audio/piano/,
// every minor third C2-C7, pitch-shifted to the nearest sample; the louder the note, the brighter
// the filter, so dynamics sound like a piano. Until the samples load (or if they can't), a
// synthesised piano tone is used. All musical notes go through blip(type 'triangle').
// Count: 'click' (as before) or 'voice' -- recorded counts in audio/count/ if present

const SOUND_KEY = 'pb_sound_v1';
function loadSoundPrefs() { try { return Object.assign({ piano: true, count: 'click' }, JSON.parse(localStorage.getItem(SOUND_KEY)) || {}); } catch (e) { return { piano: true, count: 'click' }; } }
let SOUND = loadSoundPrefs();
function saveSoundPrefs(p) { SOUND = p; try { localStorage.setItem(SOUND_KEY, JSON.stringify(p)); } catch (e) {} }
const PIANO_FILES = [];
[2, 3, 4, 5, 6].forEach(o => [['C', 0], ['Ds', 3], ['Fs', 6], ['A', 9]].forEach(([n, pc]) => PIANO_FILES.push({ name: n + o, midi: (o + 1) * 12 + pc })));
PIANO_FILES.push({ name: 'C7', midi: 96 }); PIANO_FILES.push({ name: 'A1', midi: 33 });
const _piano = { buf: {}, on: {}, started: false };
// Where the sound really starts in a decoded file (mp3 encoders add ~25-50 ms of silence at the front).
// frac 0.05 = the attack (piano); 0.5 = the loud part of a spoken word (its "beat point" -- the vowel).
function onsetOf(buf, frac) {
  // Loudness (RMS) in 20 ms windows every 2 ms; the onset is the first window above frac x the loudest.
  const d = buf.getChannelData(0), sr = buf.sampleRate, win = Math.round(sr * 0.02), hop = Math.round(sr * 0.002);
  const lim = Math.min(d.length, Math.round(sr * 1.2)), env = [];

  const mx = Math.max(0, ...env); if (!mx) return 0;
  const k = env.findIndex(e => e >= mx * frac);

}
// How long after it is scheduled a sound actually comes out of the speaker.
function outLatency(ctx) { return Math.min(0.3, (ctx && (ctx.outputLatency || ctx.baseLatency)) || 0); }
function loadPiano(ctx) {
  if (_piano.started || !ctx || typeof fetch === 'undefined') return;
  _piano.started = true;
  PIANO_FILES.forEach(f => {
    fetch('audio/piano/' + f.name + '.mp3').then(r => r.ok ? r.arrayBuffer() : Promise.reject())
      .then(ab => new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej)))
      .then(b => { _piano.on[f.midi] = onsetOf(b, 0.05); _piano.buf[f.midi] = b; }).catch(() => {});

}

  out.gain.setValueAtTime(0.9 * vel, t);
  out.gain.setValueAtTime(0.9 * vel, end);
  out.gain.exponentialRampToValueAtTime(0.0008, end + 0.28); // damper
  if (loaded.length) {
    const near = loaded.reduce((b, m) => Math.abs(m - midi) < Math.abs(b - midi) ? m : b, loaded[0]);
    const src = ctx.createBufferSource();
    src.buffer = _piano.buf[near]; src.playbackRate.value = Math.pow(2, (midi - near) / 12);
    src.connect(filt); src.start(t, _piano.on[near] || 0); src.stop(end + 0.3);
    _clickNodes.push(src);
    return;
  }

  [[1, 1, 1.6], [2, 0.45, 1.1], [3, 0.2, 0.8], [4, 0.1, 0.6]].forEach(([h, a, dec]) => {

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35 * a, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0005, t + Math.min(dec * (freq < 300 ? 2 : 1.2), len + 1.2));
    o.connect(g); g.connect(filt); o.start(t); o.stop(end + 0.3); _clickNodes.push(o);
  });

// Count voice.
const _count = { buf: {}, on: {}, started: false, last: null };
const COUNT_WORDS = ['1', '2', '3', '4', '5', '6', '7', '8', 'and'];
function loadCount(ctx) {
  if (_count.started || !ctx || typeof fetch === 'undefined') return;
  _count.started = true;
  const get = (w, ext) => fetch('audio/count/' + w + ext).then(r => r.ok ? r.arrayBuffer() : Promise.reject());
  COUNT_WORDS.forEach(w => get(w, '.wav').catch(() => get(w, '.mp3'))
    .then(ab => new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej))).then(b => { _count.on[w] = onsetOf(b, 0.4); _count.buf[w] = b; }).catch(() => {}));
}
let _speechTimers = [];
function pickVoice() {
  try {
    const vs = window.speechSynthesis.getVoices();
    return vs.find(v => /en-AU/.test(v.lang)) || vs.find(v => /Samantha|Karen|Serena|Daniel/.test(v.name)) || vs.find(v => /^en/.test(v.lang)) || null;
  } catch (e) { return null; }
}

  if (_count.buf[word]) {
    // Line up the word's vowel (where the ear hears the beat) with the beat, not the start of the file.
    const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = _count.buf[word];
    const lead = _count.on[word] || 0, at = when - lead, now = ctx.currentTime;
    g.gain.setValueAtTime(vol, Math.max(now, at));
    s.connect(g); g.connect(ctx.destination);

    if (_count.last && _count.last.at < at) { try { _count.last.g.gain.setTargetAtTime(0, Math.max(now, at - 0.02), 0.012); } catch (e) {} }
    _count.last = { g, at };
    _clickNodes.push(s); return true;
  }
  try {
    if (!window.speechSynthesis) return false;
    const ms = Math.max(0, (when - ctx.currentTime) * 1000 - 70);
    _speechTimers.push(setTimeout(() => {
      const u = new SpeechSynthesisUtterance(word === 'and' ? 'and' : word);
      const v = pickVoice(); if (v) u.voice = v;
      u.rate = 1.5; u.volume = Math.min(1, vol); u.pitch = 1;
      window.speechSynthesis.speak(u);
    }, ms));

  } catch (e) { return false; }
}
// One counted beat: a click, or the spoken number. beat = 0-based beat in the bar.
function beatTick(ctx, t, beat, freq, len, vol, type, word) {
  if (SOUND.count === 'voice' && sayCount(ctx, t, word || String(beat + 1), 1)) { blip(ctx, t, freq, len, vol * 0.25, type); return; }
  blip(ctx, t, freq, len, vol, type);
}
function SoundSettings() {
  const [p, setP] = useState(SOUND);

  const chip = (on, label, onClick) => <button className={'chip' + (on ? ' active' : '')} style={{padding:'2px 9px',fontSize:11}} onClick={onClick}>{label}</button>;
  return (
    <div style={{display:'flex',flexWrap:'wrap',gap:6,alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'var(--muted)',margin:'-6px 0 14px'}}>
      <span>Sound</span>{chip(p.piano, 'Piano', () => set({ piano: true }))}{chip(!p.piano, 'Simple', () => set({ piano: false }))}
      <span style={{marginLeft:8}}>Count</span>{chip(p.count === 'click', 'Click', () => set({ count: 'click' }))}{chip(p.count === 'voice', 'Voice 1 2 3 4', () => set({ count: 'voice' }))}
    </div>

let _audioCtx = null;
let _clickNodes = [];
function stopClicks() {
  _clickNodes.forEach(o => { try { o.stop(); } catch (e) {} });
  _clickNodes = []; _count.last = null;
  try { _speechTimers.forEach(clearTimeout); _speechTimers = []; if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
}
function playClicks(bpm, count) {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    stopClicks();
    const gap = 60 / bpm;
    const t0 = _audioCtx.currentTime + 0.08;
    if (SOUND.count === 'voice') { for (let i = 0; i < (count || 8); i++) beatTick(_audioCtx, t0 + i * gap, i % 4, i % 4 === 0 ? 1320 : 880, 0.05, 0.35); return true; }

      const osc = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.frequency.value = i % 4 === 0 ? 1320 : 880;
      const t = t0 + i * gap;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.35, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      osc.connect(gain); gain.connect(_audioCtx.destination);
      osc.start(t); osc.stop(t + 0.08);
      _clickNodes.push(osc);
    }

  } catch (e) { return false; }

const TEMPO_LEVELS = [
  { n: 1, label: 'Term → meaning',            kind: 'meaning', time: 8 },
  { n: 2, label: 'Which one is faster?',       kind: 'faster',  time: 6 },
  { n: 3, label: 'Put 4 in order, slow → fast', kind: 'order',  time: 15 },
  { n: 4, label: 'Listen: which tempo is it?', kind: 'listen',  time: 14 },
];

function genTempoQuestion(lv, prev) {
  const uid = Math.random();
  const names = TEMPO_TERMS.map(t => t.term);
  const pickNew = () => { let x = pick(names), n = 0; while (prev && prev.key === x && n++ < 10) x = pick(names); return x; };
  if (lv.kind === 'meaning') {
    const term = pickNew();
    const wrong = sampleN(TEMPO_TERMS.map(t => t.meaning), 3, [TEMPO_TERMS[TEMPO_RANK[term]].meaning]);
    return { kind: 'meaning', key: term, term, choices: shuffle([TEMPO_TERMS[TEMPO_RANK[term]].meaning, ...wrong]), uid };
  }
  if (lv.kind === 'faster') {
    const pair = sampleN(names, 2);
    return { kind: 'faster', key: pair.join('|'), pair, uid };
  }
  if (lv.kind === 'order') {
    const four = sampleN(names, 4);
    return { kind: 'order', key: four.join('|'), items: four, uid };
  }
  // listen: answer + 2 distractors that are clearly different in speed (>= 30 bpm apart)
  const term = pickNew();
  const bpm = TEMPO_TERMS[TEMPO_RANK[term]].demo;
  const far = TEMPO_TERMS.filter(t => Math.abs(t.demo - bpm) >= 30).map(t => t.term);
  const distract = sampleN(far, 2);
  return { kind: 'listen', key: term, term, bpm, choices: shuffle([term, ...distract]), uid };
}

function checkTempo(q, ans) {
  if (ans === null || ans === undefined) return false;
  if (q.kind === 'meaning') return ans === TEMPO_TERMS[TEMPO_RANK[q.term]].meaning;
  if (q.kind === 'faster') return ans === q.pair.slice().sort((a, b) => TEMPO_RANK[b] - TEMPO_RANK[a])[0];
  if (q.kind === 'order') {
    const right = q.items.slice().sort((a, b) => TEMPO_RANK[a] - TEMPO_RANK[b]);
    return Array.isArray(ans) && ans.length === right.length && ans.every((x, i) => x === right[i]);
  }
  return ans === q.term;
}

function tempoAnswerLabel(q) {
  if (q.kind === 'meaning') return q.term + ' = ' + TEMPO_TERMS[TEMPO_RANK[q.term]].meaning;
  if (q.kind === 'faster') return q.pair.slice().sort((a, b) => TEMPO_RANK[b] - TEMPO_RANK[a])[0];
  if (q.kind === 'order') return q.items.slice().sort((a, b) => TEMPO_RANK[a] - TEMPO_RANK[b]).join(' → ');
  return q.term + ' (about ' + q.bpm + ' bpm)';
}

// Race track: the car moves one step per correct answer (both modes). Original simple shapes.
function RaceTrack({ steps, pos, pixel }) {
  const W = 300, H = 34, pad = 14;

    <svg viewBox={'0 0 ' + W + ' ' + H} shapeRendering={pixel ? 'crispEdges' : 'auto'} style={{width:'100%',display:'block',marginBottom:12}}>
      <rect x="0" y="12" width={W} height="14" fill={pixel ? 'rgba(248,237,212,0.12)' : '#efe6d2'} rx={pixel ? 0 : 7}/>

      ))}

      )))}

}

function TempoQuestion({ q, level, given, locked, onAnswer, pixel, stats }) {
  const [seq, setSeq] = useState([]);
  useEffect(() => { setSeq([]); }, [q.uid]);
  useEffect(() => {
    if (q.kind === 'listen') playClicks(q.bpm, 8);
    return () => { if (q.kind === 'listen') stopClicks(); };
  }, [q.uid]);

  const done = !!given;
  const btnCls = pixel ? 'pixel-choice' : 'choice-btn';
  const prompt = (txt, px) => (
    <p style={pixel ? {fontSize:10,textAlign:'center',margin:'0 0 12px',lineHeight:1.7}
                    : {fontSize:14,fontWeight:700,textAlign:'center',margin:'0 0 12px',color:'var(--muted)'}}>
      {pixel ? px : txt}
    </p>
  );
  const bigTerm = (t) => (
    <div style={{textAlign:'center',fontSize:pixel?22:44,fontWeight:900,margin:'4px 0 16px',
      color:pixel?'var(--brass)':'var(--text)',fontStyle:pixel?'normal':'italic',letterSpacing:'-0.01em'}}>{t}</div>
  );
  const stateFor = (val, correctVal) => {
    if (!done) return '';
    if (val === correctVal) return ' good';
    if (given.ans === val) return ' bad';
    return '';
  };

  const track = <RaceTrack steps={pixel ? 15 : LESSON_TOTAL} pos={stats ? stats.correct : 0} pixel={pixel} />;

  if (q.kind === 'meaning') {
    const right = TEMPO_TERMS[TEMPO_RANK[q.term]].meaning;
    return (
      <div>
        {track}
        {prompt('What does this term mean?', 'WHAT DOES IT MEAN?')}
        {bigTerm(q.term)}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          {q.choices.map(c => (
            <button key={c} disabled={locked} onClick={() => onAnswer(c)} className={btnCls + stateFor(c, right)}
              style={{padding:'12px 8px'}}>{c}</button>
          ))}
        </div>
      </div>
    );
  }

  if (q.kind === 'faster') {
    const right = checkTempo(q, q.pair[0]) ? q.pair[0] : q.pair[1];
    return (
      <div>
        {track}
        {prompt('Which one is faster?', 'WHICH IS FASTER?')}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {q.pair.map(t => (
            <button key={t} disabled={locked} onClick={() => onAnswer(t)} className={btnCls + stateFor(t, right)}
              style={{padding:'22px 6px',fontSize:pixel?10:18,fontStyle:pixel?'normal':'italic'}}>{t}</button>
          ))}
        </div>
      </div>
    );
  }

  if (q.kind === 'order') {
    const right = q.items.slice().sort((a, b) => TEMPO_RANK[a] - TEMPO_RANK[b]);
    function tap(t) {
      if (locked || seq.includes(t)) return;
      const next = [...seq, t];
      setSeq(next);
      if (next.length === q.items.length) onAnswer(next);
    }
    return (
      <div>
        {track}
        {prompt('Tap them from slowest to fastest', 'SLOWEST → FASTEST')}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          {q.items.map(t => {
            const idx = seq.indexOf(t);
            let st = '';
            if (done) st = right.indexOf(t) === idx ? ' good' : ' bad';
            return (
              <button key={t} disabled={locked || idx >= 0} onClick={() => tap(t)} className={btnCls + st}
                style={{padding:'14px 6px',opacity:!done && idx >= 0 ? 0.55 : 1,fontStyle:pixel?'normal':'italic'}}>
                {idx >= 0 ? (idx + 1) + '. ' : ''}{t}
              </button>
            );
          })}
        </div>
        {!done && seq.length > 0 && (
          <div style={{textAlign:'center',marginTop:10}}>
            <button className={pixel ? 'pixel-btn' : 'ghost-btn'} style={pixel ? {fontSize:8,padding:'8px 10px'} : {}}
              onClick={() => setSeq(seq.slice(0, -1))}>{pixel ? 'UNDO' : 'Undo'}</button>
          </div>
        )}
      </div>
    );
  }

  // listen
  return (
    <div>
      {track}
      {prompt('Listen to the beat -- which tempo is it?', 'LISTEN! WHICH TEMPO?')}
      <div style={{textAlign:'center',margin:'0 0 16px'}}>
        <button className={pixel ? 'pixel-btn' : 'ghost-btn'} onClick={() => playClicks(q.bpm, 8)}
          style={pixel ? {fontSize:9} : {fontSize:14,padding:'12px 20px'}}>{pixel ? '♪ PLAY AGAIN' : '♪ Play again'}</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
        {q.choices.map(t => (
          <button key={t} disabled={locked} onClick={() => { stopClicks(); onAnswer(t); }} className={btnCls + stateFor(t, q.term)}
            style={{padding:'16px 4px',fontStyle:pixel?'normal':'italic'}}>{t}</button>
        ))}
      </div>
    </div>
  );
}

// ─── Tempo Race: hands-on round (Phase 111) ──────────────────────────────────────
function termForBpm(bpm) { return TEMPO_TERMS.reduce((b, t) => Math.abs(t.demo - bpm) < Math.abs(b.demo - bpm) ? t : b, TEMPO_TERMS[0]); }
// 1. A metronome with a swinging arm: drag the speed, see which tempo word it is -- or tap your own tempo.
function MetronomeDial() {
  const [bpm, setBpm] = useState(88);
  const [run, setRun] = useState(false);
  const [side, setSide] = useState(0);
  const taps = useRef([]);
  const t = termForBpm(bpm), idx = TEMPO_TERMS.indexOf(t);
  useEffect(() => {
    if (!run) return;
    let n = 0;
    const tick = () => { const ctx = getAudio(); if (ctx) beatTick(ctx, ctx.currentTime + 0.01, n % 4, n % 4 === 0 ? 1320 : 900, 0.04, n % 4 === 0 ? 0.3 : 0.16); setSide(s => 1 - s); n++; };
    tick(); const iv = setInterval(tick, 60000 / bpm);
    return () => clearInterval(iv);
  }, [run, bpm]);
  function tap() {
    const now = performance.now();
    taps.current = taps.current.filter(x => now - x < 3000).concat(now);
    const tt = taps.current;
    if (tt.length >= 3) { const gaps = tt.slice(1).map((x, i) => x - tt[i]); const avg = gaps.reduce((a, b) => a + b, 0) / gaps.length; setBpm(Math.max(40, Math.min(208, Math.round(60000 / avg)))); }
    const ctx = getAudio(); if (ctx) blip(ctx, ctx.currentTime + 0.01, 700, 0.03, 0.2);
  }
  const dur = 60 / bpm;
  return (
    <div className="try-box" style={actBox}>
      <div style={actTitle}>The metronome</div>
      <div style={actNote}>Slide the speed and watch the arm swing. The tempo word changes as you go faster or slower. Or tap a steady beat on “Tap” to measure your own tempo.</div>
      <div style={{display:'flex',alignItems:'center',gap:14}}>
        <svg viewBox="0 0 100 120" style={{width:100,flex:'0 0 100px'}}>
          <polygon points="20,112 80,112 64,20 36,20" fill="#241f1a"/>
          <polygon points="26,106 74,106 62,26 38,26" fill="#3b332b"/>
          <g style={{transformOrigin:'50px 100px',transform:'rotate(' + (run ? (side ? 24 : -24) : 0) + 'deg)',transition:'transform ' + dur + 's ease-in-out'}}>
            <line x1="50" y1="100" x2="50" y2="14" stroke="#e8dcc0" strokeWidth="2.5"/>
            <rect x="44" y={30 + (bpm - 40) / 168 * 50} width="12" height="10" rx="2" fill={LANE_COLORS[idx]}/>
          </g>
          <circle cx="50" cy="100" r="4" fill="#a8823f"/>
        </svg>
        <div style={{flex:1}}>
          <div style={{fontSize:30,fontWeight:900,lineHeight:1}}>{bpm}<span style={{fontSize:13,color:'var(--muted)',fontWeight:700}}> beats a minute</span></div>
          <div style={{fontSize:22,fontWeight:900,fontStyle:'italic',color:LANE_COLORS[idx],margin:'4px 0 0',transition:'color 0.2s'}}>{t.term}</div>
          <div style={{fontSize:12,color:'#6f665b'}}>{t.meaning}</div>
        </div>
      </div>
      <input type="range" min="40" max="208" value={bpm} onChange={e => setBpm(+e.target.value)} style={{width:'100%',margin:'10px 0 2px',accentColor:'#a8823f'}}/>
      <div style={{display:'flex',height:6,borderRadius:3,overflow:'hidden',marginBottom:8}}>
        {TEMPO_TERMS.map((x, i) => <div key={x.term} style={{flex:1,background:LANE_COLORS[i],opacity:i === idx ? 1 : 0.3}}/>)}
      </div>
      <div style={{display:'flex',gap:6,justifyContent:'center'}}>
        <button className="ghost-btn" onClick={() => setRun(r => !r)}>{run ? '■ Stop' : '▶ Start'}</button>
        <button className="ghost-btn" onClick={tap} style={{minWidth:90}}>Tap</button>
      </div>
    </div>
  );
}
// 2. Speed changes: rit./rall. slow down, accel. speeds up, a tempo goes back. A ball bounces the beat.
const SPEED_CHANGES = [
  { id: 'rit', label: 'rit.', full: 'ritardando', meaning: 'gradually slowing down', from: 120, to: 60 },
  { id: 'rall', label: 'rall.', full: 'rallentando', meaning: 'gradually slowing down (same as rit.)', from: 120, to: 60 },
  { id: 'accel', label: 'accel.', full: 'accelerando', meaning: 'gradually getting faster', from: 72, to: 160 },
  { id: 'atempo', label: 'a tempo', full: 'a tempo', meaning: 'back to the original speed', from: 60, to: 120, jump: true },
];
function SpeedChange() {
  const [sel, setSel] = useState(null);
  const [beat, setBeat] = useState(-1);
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  function play(c) {
    timers.current.forEach(clearTimeout); timers.current = [];
    setSel(c.id); const ctx = getAudio(); if (!ctx) return;
    const N = 12; let at = 0; const t0 = ctx.currentTime + 0.1;
    for (let i = 0; i < N; i++) {
      const bpm = c.jump ? (i < 6 ? c.from : c.to) : c.from + (c.to - c.from) * (i / (N - 1));
      blip(ctx, t0 + at, 523.25, 0.08, i % 4 === 0 ? 0.25 : 0.15, 'triangle');
      timers.current.push(setTimeout(() => setBeat(i), (0.1 + at) * 1000));
      at += 60 / bpm;
    }
    timers.current.push(setTimeout(() => setBeat(-1), (0.1 + at) * 1000));
  }
  const c = SPEED_CHANGES.find(x => x.id === sel);
  return (
    <div className="try-box" style={actBox}>
      <div style={actTitle}>Speeding up, slowing down</div>
      <div style={actNote}>Some words change the speed gradually. Tap one to hear twelve beats -- watch the gaps between the dots grow or shrink.</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:5,marginBottom:8}}>
        {SPEED_CHANGES.map(x => <button key={x.id} className={'chip' + (sel === x.id ? ' active' : '')} style={{padding:'8px 0',fontSize:14,fontWeight:900,fontStyle:'italic'}} onClick={() => play(x)}>{x.label}</button>)}
      </div>
      <svg viewBox="0 0 300 40" style={{width:'100%',display:'block'}}>
        {c && (() => {
          const N = 12, xs = []; let at = 0;
          for (let i = 0; i < N; i++) { xs.push(at); at += 60 / (c.jump ? (i < 6 ? c.from : c.to) : c.from + (c.to - c.from) * (i / (N - 1))); }
          const k = 280 / xs[N - 1];
          return xs.map((x, i) => <circle key={c.id + i} cx={10 + x * k} cy={20} r={beat === i ? 9 : 5} fill={beat >= i ? '#a8823f' : '#d9cdb0'} style={{transition:'r 0.1s'}}/>);
        })()}
      </svg>
      <div style={{textAlign:'center',fontSize:13,minHeight:36}}>{c ? <><b style={{fontStyle:'italic'}}>{c.full}</b> -- {c.meaning}{c.jump ? <div style={{fontSize:12,color:'#6f665b'}}>(slow first, then straight back to speed)</div> : null}</> : <span style={{color:'var(--muted)'}}>Tap a word above.</span>}</div>
    </div>
  );
}

// ─── Shared notation drawing (Phase 96) ──────────────────────────────────────────
// Font-free SVG notes and rests (no music font needed, so nothing can render as a blank box).
// Coordinates: note heads sit at y=62, stems go up to y=20.
const HEAD_Y = 62, STEM_TOP = 20;

function RestShape({ d, cx, ink }) {
  const s = { stroke: ink, fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round' };
  if (d >= 4) return <g><line x1={cx - 12} y1="44" x2={cx + 12} y2="44" stroke={ink} strokeWidth="1.2"/><rect x={cx - 8} y="44" width="16" height="7" fill={ink}/></g>;
  if (d >= 2) return <g><line x1={cx - 12} y1="52" x2={cx + 12} y2="52" stroke={ink} strokeWidth="1.2"/><rect x={cx - 8} y="45" width="16" height="7" fill={ink}/></g>;
  if (d >= 1) return <path d={`M${cx - 3},30 L${cx + 5},40 L${cx - 2},49 L${cx + 6},59 Q${cx - 7},55 ${cx - 1},68`} {...s} strokeWidth="3.4"/>;
  if (d >= 0.5) return <g><circle cx={cx - 3} cy="44" r="3.6" fill={ink}/><path d={`M${cx - 3},45 Q${cx + 2},48 ${cx + 7},41 L${cx + 1},66`} {...s} strokeWidth="2.4"/></g>;
  return <g>
    <circle cx={cx - 2} cy="40" r="3.4" fill={ink}/><circle cx={cx - 5} cy="50" r="3.4" fill={ink}/>
    <path d={`M${cx - 2},41 Q${cx + 3},44 ${cx + 8},37 L${cx},68`} {...s} strokeWidth="2.4"/>
    <path d={`M${cx - 5},51 Q${cx},54 ${cx + 5},47`} {...s} strokeWidth="2.4"/>
  </g>;
}

// One note: head (+ stem, + flags if not beamed, + dot). base = undotted value in beats.
function NoteShape({ base, dot, cx, ink, beamed }) {
  const hollow = base >= 2;
  const sx = cx + 6.4;
  return (
    <g>
      <ellipse cx={cx} cy={HEAD_Y} rx={base >= 4 ? 8.5 : 7.2} ry="5.3" transform={`rotate(-20 ${cx} ${HEAD_Y})`}
        fill={hollow ? 'none' : ink} stroke={ink} strokeWidth={hollow ? 2.2 : 1}/>
      {base < 4 && <line x1={sx} y1={HEAD_Y - 2} x2={sx} y2={STEM_TOP} stroke={ink} strokeWidth="1.8"/>}
      {!beamed && base <= 0.5 && <path d={`M${sx},${STEM_TOP} c 2,9 13,12 8,27`} fill="none" stroke={ink} strokeWidth="2.6" strokeLinecap="round"/>}
      {!beamed && base <= 0.25 && <path d={`M${sx},${STEM_TOP + 9} c 2,8 13,11 8,24`} fill="none" stroke={ink} strokeWidth="2.6" strokeLinecap="round"/>}
      {dot && <circle cx={cx + 14} cy={HEAD_Y - 2} r="2.6" fill={ink}/>}
    </g>
  );
}

// A single symbol in its own little box (used for note-value questions and answer buttons).
function Glyph({ item, ink = '#241f1a', size = 56 }) {
  const w = 44;
  return (
    <svg viewBox={'0 10 ' + w + ' 66'} style={{width: size * w / 66, height: size, display:'inline-block', verticalAlign:'middle'}}>
      {item.rest ? <RestShape d={item.base} cx={w / 2} ink={ink}/> : <NoteShape base={item.base} dot={item.dot} cx={w / 2 - (item.dot ? 5 : 2)} ink={ink}/>}
    </svg>
  );
}

// ─── Concept 4: Note & Rest Values (Phase 96) ────────────────────────────────────
// British names first (what AMEB uses), American names alongside -- Sohyun's call via recommendation.
// Beats are counted in crotchet beats (crotchet = 1).
const NOTE_VALUES = [
  { id: 'semibreve',  us: 'whole',     base: 4 },
  { id: 'minim',      us: 'half',      base: 2 },
  { id: 'crotchet',   us: 'quarter',   base: 1 },
  { id: 'quaver',     us: 'eighth',    base: 0.5 },
  { id: 'semiquaver', us: 'sixteenth', base: 0.25 },
];
function nvItem(v, opts) {
  const o = opts || {};
  const beats = v.base * (o.dot ? 1.5 : 1);
  const uk = (o.dot ? 'dotted ' : '') + v.id + (o.rest ? ' rest' : '');
  const us = (o.dot ? 'dotted ' : '') + v.us + (o.rest ? ' rest' : ' note');
  return { key: (o.rest ? 'r:' : 'n:') + (o.dot ? '.' : '') + v.id, id: v.id, base: v.base, dot: !!o.dot, rest: !!o.rest, beats, uk, us };
}
const NV_NOTES = NOTE_VALUES.map(v => nvItem(v));
const NV_RESTS = NOTE_VALUES.map(v => nvItem(v, { rest: true }));
const NV_DOTTED = NOTE_VALUES.filter(v => ['minim', 'crotchet', 'quaver'].includes(v.id)).map(v => nvItem(v, { dot: true }));
const NV_ALL = [...NV_NOTES, ...NV_RESTS, ...NV_DOTTED];
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function fmtBeats(v) {
  const whole = Math.floor(v + 1e-9), frac = Math.round((v - whole) * 100) / 100;
  const f = frac === 0.25 ? '¼' : frac === 0.5 ? '½' : frac === 0.75 ? '¾' : '';
  const s = (whole ? String(whole) : (f ? '' : '0')) + f;
  return s + (v <= 1 ? ' beat' : ' beats');
}

const NOTEVAL_LEVELS = [
  { n: 1, label: 'Name the note',                kind: 'name',  time: 8 },
  { n: 2, label: 'How many beats? (rests & dots too)', kind: 'beats', time: 8 },
  { n: 3, label: 'Find the matching rest',       kind: 'rest',  time: 8 },
  { n: 4, label: 'Add them up',                  kind: 'sum',   time: 10 },
  { n: 5, label: 'Finish the 4/4 bar',           kind: 'fill',  time: 12 },
];

function genNoteValQuestion(lv, prev) {
  const uid = Math.random();
  const notPrev = (list) => { let x = pick(list), n = 0; while (prev && prev.key === x.key && n++ < 10) x = pick(list); return x; };
  if (lv.kind === 'name') {
    const it = notPrev(NV_NOTES);
    return { kind: 'name', key: it.key, item: it, answer: it.key, choices: shuffle([it, ...sampleN(NV_NOTES, 3, [it])]), uid };
  }
  if (lv.kind === 'beats') {
    const it = notPrev(NV_ALL);
    const vals = [...new Set(NV_ALL.map(x => x.beats))].filter(v => v !== it.beats);
    return { kind: 'beats', key: it.key, item: it, answer: it.beats, choices: shuffle([it.beats, ...sampleN(vals, 3)]), uid };
  }
  if (lv.kind === 'rest') {
    const it = notPrev(NV_NOTES);
    const right = NV_RESTS.find(r => r.id === it.id);
    return { kind: 'rest', key: it.key, item: it, answer: right.key, choices: shuffle([right, ...sampleN(NV_RESTS, 3, [right])]), uid };
  }
  if (lv.kind === 'sum') {
    const src = NV_ALL.filter(x => x.beats >= 0.5 && x.beats <= 3);
    const a = pick(src), b = pick(src);
    const total = a.beats + b.beats;
    const cands = [...new Set([total - 1, total - 0.5, total + 0.5, total + 1, total + 1.5, total * 2, total - 1.5].filter(v => v > 0 && v !== total))];
    return { kind: 'sum', key: a.key + b.key, a, b, answer: total, choices: shuffle([total, ...sampleN(cands, 3)]), uid };
  }
  // fill: some symbols already in a 4/4 bar, pick the ONE symbol that completes it exactly
  const fillers = [...NV_NOTES.filter(x => x.beats <= 2), ...NV_RESTS.filter(x => x.beats >= 0.5 && x.beats <= 2), ...NV_DOTTED];
  let missing, given = [];
  for (let tries = 0; tries < 50; tries++) {
    missing = pick(NV_ALL.filter(x => x.beats >= 0.5 && x.beats <= 3 && !(x.rest && x.beats > 2)));
    let rem = 4 - missing.beats; given = [];
    while (rem > 1e-9 && given.length < 4) {
      const opts = fillers.filter(x => x.beats <= rem + 1e-9);
      const x = pick(opts); given.push(x); rem -= x.beats;
    }
    if (rem < 1e-9 && given.length >= 1 && given.length <= 4) break;
  }
  const pos = Math.floor(Math.random() * (given.length + 1));
  const others = sampleN(NV_ALL.filter(x => Math.abs(x.beats - missing.beats) > 1e-9), 3);
  return { kind: 'fill', key: missing.key + given.map(g => g.key).join(), given, pos, missing, answer: missing.beats,
           choices: shuffle([missing, ...others]), uid };
}

function checkNoteVal(q, ans) {
  if (ans === null || ans === undefined) return false;
  if (q.kind === 'name' || q.kind === 'rest') return ans === q.answer;
  if (q.kind === 'fill') return Math.abs(ans.beats - q.missing.beats) < 1e-9;
  return Math.abs(ans - q.answer) < 1e-9;
}
function noteValAnswerLabel(q) {
  if (q.kind === 'name') return cap(q.item.uk) + ' (' + q.item.us + ')';
  if (q.kind === 'rest') { const r = NV_RESTS.find(x => x.key === q.answer); return 'a ' + r.uk; }
  if (q.kind === 'beats') return fmtBeats(q.answer);
  if (q.kind === 'sum') return fmtBeats(q.answer);
  return 'something worth ' + fmtBeats(q.missing.beats) + ' (e.g. a ' + q.missing.uk + ')';
}

// Board game for this chapter: a correct answer rolls a die (1-3) and moves you on.
// Real repeat signs are the board's rules: D.C. sends you back to the start, D.S. back to the
// segno, each only the first time per lap -- just like in music -- and Fine ends the lap.
const BOARD_LEN = 24, SEGNO_AT = 7, DC_AT = 12, DS_AT = 18;
function useBoard(q, given) {
  const [b, setB] = useState({ pos: 0, laps: 0, dcUsed: false, dsUsed: false, roll: null, msg: '' });
  const seen = useRef(null);
  useEffect(() => {
    if (!given || !given.ok || seen.current === q.uid) return;
    seen.current = q.uid;
    setB(prev => {
      const roll = 1 + Math.floor(Math.random() * 3);
      let pos = prev.pos + roll, msg = '', dcUsed = prev.dcUsed, dsUsed = prev.dsUsed, laps = prev.laps;
      if (pos >= BOARD_LEN) return { pos: 0, laps: laps + 1, dcUsed: false, dsUsed: false, roll, msg: 'Fine! Lap ' + (laps + 1) + ' done' };
      if (pos === DC_AT && !dcUsed) { pos = 0; dcUsed = true; msg = 'D.C. -- back to the start!'; }
      else if (pos === DS_AT && !dsUsed) { pos = SEGNO_AT; dsUsed = true; msg = 'D.S. -- back to the segno!'; }
      return { pos, laps, dcUsed, dsUsed, roll, msg };
    });
  }, [given, q.uid]);
  return b;
}
function BoardTrack({ b, pixel }) {
  const cols = 8, cell = 38, gap = 3;
  const ink = pixel ? '#f8edd4' : '#241f1a';
  const cellsXY = [];
  for (let i = 0; i < BOARD_LEN; i++) {
    const r = Math.floor(i / cols), c = r % 2 === 0 ? i % cols : cols - 1 - (i % cols);
    cellsXY.push({ x: c * (cell + gap), y: r * (cell + gap) });
  }
  const W = cols * (cell + gap) - gap, H = 3 * (cell + gap) - gap;
  const special = { [SEGNO_AT]: '𝄋', [DC_AT]: 'D.C.', [DS_AT]: 'D.S.', [BOARD_LEN]: 'Fine' };
  const here = b.pos === 0 ? null : cellsXY[b.pos - 1];
  return (
    <div style={{marginBottom:12}}>
      <svg viewBox={`-2 -2 ${W + 4} ${H + 4}`} shapeRendering={pixel ? 'crispEdges' : 'auto'} style={{width:'100%',display:'block'}}>
        {cellsXY.map((p, i) => {
          const n = i + 1, sp = special[n];
          return (
            <g key={n}>
              <rect x={p.x} y={p.y} width={cell} height={cell} rx={pixel ? 0 : 6}
                fill={sp ? (pixel ? 'rgba(168,130,63,0.35)' : '#f3ead8') : (pixel ? 'rgba(248,237,212,0.08)' : '#fff')}
                stroke={pixel ? 'rgba(248,237,212,0.3)' : '#e0d4b8'}/>
              <text x={p.x + 4} y={p.y + 10} fontSize="7" fill={ink} opacity="0.5">{n}</text>
              {sp && <text x={p.x + cell / 2} y={p.y + cell / 2 + 5} textAnchor="middle" fontSize={sp.length > 2 ? 10 : 16} fontWeight="800"
                fontStyle={sp.length > 2 ? 'italic' : 'normal'} fill={ink} fontFamily={sp.length > 2 ? 'serif' : "'Noto Music','Apple Symbols',serif"}>{sp}</text>}
            </g>
          );
        })}
        {here && <circle cx={here.x + cell / 2} cy={here.y + cell / 2 + (special[b.pos] ? 11 : 3)} r="7" fill="var(--brass)" stroke={ink} strokeWidth="1.5"
          style={{transition:'cx 0.3s, cy 0.3s'}}/>}
      </svg>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:pixel?8:12,fontWeight:700,marginTop:6,color:pixel?'#f8edd4':'var(--muted)'}}>
        <span>{b.pos === 0 ? (pixel ? 'START' : 'At the start') : (pixel ? 'SQUARE ' + b.pos : 'Square ' + b.pos)}{b.roll ? (pixel ? ' · ROLLED ' + b.roll : ' · rolled ' + b.roll) : ''}</span>
        <span>{b.laps ? (pixel ? 'LAPS ' + b.laps : 'Laps: ' + b.laps) : ''}</span>
      </div>
      {b.msg && <div style={{textAlign:'center',fontSize:pixel?9:13,fontWeight:800,color:'var(--brass)',marginTop:4}}>{pixel ? b.msg.toUpperCase() : b.msg}</div>}
    </div>
  );
}

  const ink = pixel ? '#f8edd4' : '#241f1a';

  );
  const stKey = (k) => !done ? '' : (k === q.answer ? ' good' : (given.ans === k ? ' bad' : ''));

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>

        {q.choices.map(c => (

            aria-label={c.uk}><Glyph item={c} size={52}/></button>
        ))}
      </div></>;
  } else {
    const slots = [...q.given];
    slots.splice(q.pos, 0, null);

    body = <>
      {prompt('Which one finishes this 4/4 bar exactly?', 'FINISH THE BAR!')}
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:4,margin:'0 0 12px',padding:'6px 10px',
        borderLeft:'2px solid ' + ink,borderRight:'2px solid ' + ink,color:ink}}>
        <span style={{fontFamily:'serif',fontWeight:900,fontSize:18,lineHeight:0.9,textAlign:'center',marginRight:4}}>4<br/>4</span>

            border:'2px dashed ' + (done ? 'var(--brass)' : ink),borderRadius:pixel?0:8}}>

          </span>

        {q.choices.map(c => {
          const st = !done ? '' : (Math.abs(c.beats - q.missing.beats) < 1e-9 ? ' good' : (given.ans && given.ans.key === c.key ? ' bad' : ''));
          return <button key={c.key} disabled={locked} onClick={() => onAnswer(c)} className={btnCls + st} style={{padding:'8px 2px'}}
            aria-label={c.uk}><Glyph item={c} size={52}/></button>;
        })}

  }
  return <div><BoardTrack b={board} pixel={pixel}/>{body}</div>;
}

// ─── Notes & Rests: hands-on round (Phase 108) ───────────────────────────────────
// Play a row of note/rest items: a tone for each note (rests silent), soft clicks on the beats,
// and onStep(i) so the row can light up the item that is sounding.
function playItems(items, bpm, onStep) {
  const ctx = getAudio(); if (!ctx) return [];
  stopClicks();
  const spb = 60 / bpm, t0 = ctx.currentTime + 0.12;
  const total = items.reduce((a, it) => a + it.beats, 0);
  for (let b = 0; b < Math.ceil(total - 1e-9); b++) beatTick(ctx, t0 + b * spb, b % 4, b === 0 ? 1500 : 1100, 0.03, 0.06, 'square');
  const timers = [];
  let at = 0;
  items.forEach((it, i) => {
    if (!it.rest) blip(ctx, t0 + at * spb, 523.25, Math.max(0.08, it.beats * spb * 0.9), 0.16, 'triangle');
    timers.push(setTimeout(() => onStep && onStep(i), (0.12 + at * spb) * 1000));
    at += it.beats;
  });
  timers.push(setTimeout(() => onStep && onStep(-1), (0.12 + at * spb) * 1000 + 150));
  return timers;
}
function usePlayer() {
  const [on, setOn] = useState(-1);
  const timers = useRef([]);
  useEffect(() => () => { timers.current.forEach(clearTimeout); stopClicks(); }, []);
  const play = (items, bpm = 80) => { timers.current.forEach(clearTimeout); timers.current = playItems(items, bpm, setOn); };
  return [on, play];
}
// A row where each item's width is proportional to its length -- you can see how long a note lasts.
function BeatRow({ items, total, on = -1, onTap, bad = -1, size = 40 }) {
  const beatsUsed = items.reduce((a, it) => a + it.beats, 0);
  return (
    <div style={{position:'relative',display:'flex',height:size + 26,border:'1.5px solid #d9cdb0',borderRadius:8,background:'#fff',overflow:'hidden'}}>
      {Array.from({ length: Math.max(0, Math.ceil(total) - 1) }, (_, b) => (
        <div key={'b' + b} style={{position:'absolute',left:((b + 1) / total * 100) + '%',top:0,bottom:0,borderLeft:'1px dashed #e8dcc0'}}/>
      ))}
      {items.map((it, i) => (
        <div key={i + ':' + it.key} onClick={onTap ? () => onTap(i) : undefined}
          style={{flex:'0 0 ' + (it.beats / total * 100) + '%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
            cursor:onTap ? 'pointer' : 'default',position:'relative',animation:'fadeUp 0.25s both',
            background:i === bad ? '#f6d6cf' : i === on ? '#f3ead8' : 'transparent',transition:'background 0.15s'}}>
          <Glyph item={it} size={size} ink={i === bad ? '#b5483b' : '#241f1a'}/>
          <div style={{position:'absolute',left:3,right:3,bottom:4,height:6,borderRadius:3,
            background:i === bad ? '#b5483b' : it.rest ? '#d9cdb0' : i === on ? '#a8823f' : '#c9b58a'}}/>
        </div>
      ))}
      {beatsUsed < total && <div style={{flex:1}}/>}
    </div>
  );
}

// 1. Split it: tap a note to break it into two of the next value down. The bar never changes length.
function SplitTree() {
  const NEXT = { semibreve: 'minim', minim: 'crotchet', crotchet: 'quaver', quaver: 'semiquaver' };
  const byId = (id, rest) => (rest ? NV_RESTS : NV_NOTES).find(x => x.id === id);
  const [items, setItems] = useState([NV_NOTES[0]]);
  const [mode, setMode] = useState('split');
  const [on, play] = usePlayer();
  function tap(i) {
    const it = items[i];
    if (mode === 'rest') { const c = items.slice(); c[i] = byId(it.id, !it.rest); setItems(c); return; }
    const nx = NEXT[it.id]; if (!nx) return;
    const c = items.slice(); c.splice(i, 1, byId(nx, it.rest), byId(nx, it.rest)); setItems(c);
  }
  const count = {}; items.forEach(it => { const k = it.uk; count[k] = (count[k] || 0) + 1; });
  return (
    <div className="try-box" style={actBox}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={actTitle}>Split it</div>
        <div style={{display:'flex',gap:4}}>
          <button className={'chip' + (mode === 'split' ? ' active' : '')} style={{padding:'3px 9px',fontSize:11}} onClick={() => setMode('split')}>✂ split</button>
          <button className={'chip' + (mode === 'rest' ? ' active' : '')} style={{padding:'3px 9px',fontSize:11}} onClick={() => setMode('rest')}>note ↔ rest</button>
        </div>
      </div>
      <div style={actNote}>One semibreve fills a 4-beat bar. Tap any note to split it into two of the next value -- the bar stays exactly the same length. Switch to “note ↔ rest” to turn a note into silence of the same length.</div>
      <BeatRow items={items} total={4} on={on} onTap={tap} size={items.length > 8 ? 30 : 40}/>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--muted)',fontWeight:800,padding:'2px 4px'}}>{[1, 2, 3, 4].map(b => <span key={b}>beat {b}</span>)}</div>
      <div style={{textAlign:'center',fontSize:12,color:'#6f665b',minHeight:18,margin:'4px 0'}}>{Object.entries(count).map(([k, v]) => v + ' ' + k + (v > 1 ? 's' : '')).join(' + ')} = 4 beats</div>
      <div style={{display:'flex',gap:6,justifyContent:'center'}}>
        <button className="ghost-btn" onClick={() => play(items)}>♪ Play the bar</button>
        <button className="ghost-btn" disabled={items.length === 1} onClick={() => setItems([NV_NOTES[0]])}>Start again</button>
      </div>
    </div>
  );
}

// 2. Fill the bar: build an exact bar of 2/4, 3/4 or 4/4 from a palette of notes and rests.
function FillTheBar() {
  const PALETTE = [NV_NOTES[0], NV_DOTTED[0], NV_NOTES[1], NV_DOTTED[1], NV_NOTES[2], NV_NOTES[3], NV_RESTS[0], NV_RESTS[1], NV_RESTS[2], NV_RESTS[3]];
  const [top, setTop] = useState(4);
  const [items, setItems] = useState([]);
  const [over, setOver] = useState(null);
  const [on, play] = usePlayer();
  const used = items.reduce((a, it) => a + it.beats, 0);
  const full = Math.abs(used - top) < 1e-9;
  useEffect(() => { setItems([]); setOver(null); }, [top]);
  useEffect(() => { if (full && items.length) { const t = setTimeout(() => play(items), 300); return () => clearTimeout(t); } }, [full, items.length]);
  function add(it) {
    if (full || over) return;
    if (used + it.beats > top + 1e-9) { setOver({ it, total: used + it.beats }); setTimeout(() => setOver(null), 1100); return; }
    setItems([...items, it]);
  }
  const shown = over ? [...items, over.it] : items;
  return (
    <div className="try-box" style={actBox}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={actTitle}>Fill the bar</div>
        <div style={{display:'flex',gap:4}}>
          {[2, 3, 4].map(t => <button key={t} className={'chip' + (top === t ? ' active' : '')} style={{padding:'3px 9px',fontSize:12,fontWeight:900}} onClick={() => setTop(t)}>{t}/4</button>)}
        </div>
      </div>
      <div style={actNote}>A {top}/4 bar holds exactly {top} crotchet beats. Tap notes and rests to fill it -- not a beat more, not a beat less.</div>
      <BeatRow items={shown} total={over ? Math.max(top, over.total) : top} on={on} bad={over ? shown.length - 1 : -1} size={36}/>
      <div style={{textAlign:'center',fontSize:13,fontWeight:800,minHeight:22,margin:'6px 0',color:over ? '#b5483b' : full ? '#4f7a45' : 'var(--text)'}}>
        {over ? 'Too long -- that makes ' + fmtBeats(over.total) + ' in a ' + top + '-beat bar.' : full ? 'Full bar! Listen.' : fmtBeats(used) + ' of ' + top + ' -- ' + fmtBeats(top - used) + ' to go'}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:4}}>
        {PALETTE.map(it => (
          <button key={it.key} className="chip" disabled={full} onClick={() => add(it)} style={{padding:'2px 0',display:'flex',flexDirection:'column',alignItems:'center'}}>
            <Glyph item={it} size={34}/><span style={{fontSize:9,fontWeight:800,color:'var(--muted)'}}>{fmtBeats(it.beats).replace(' beats', '').replace(' beat', '')}</span>
          </button>
        ))}
      </div>
      <div style={{display:'flex',gap:6,justifyContent:'center',marginTop:8}}>
        <button className="ghost-btn" disabled={!items.length} onClick={() => setItems(items.slice(0, -1))}>↶ Undo</button>
        <button className="ghost-btn" disabled={!items.length} onClick={() => play(items)}>♪ Play</button>
        <button className="ghost-btn" disabled={!items.length} onClick={() => setItems([])}>Clear</button>
      </div>
    </div>
  );
}

        Game board rule: D.C. sends you back to the start and D.S. back to the {'𝄋'} sign -- each only once per lap, just like in real music. Reach Fine to finish a lap.
      </p>
      </Step>
    </Lesson>
  );
}
