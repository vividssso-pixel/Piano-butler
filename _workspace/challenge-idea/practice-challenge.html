<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>One-Month Practice Habit Challenge | Piano Butler</title>
  <meta name="description" content="A one-month WhatsApp practice challenge from Piano Butler — daily missions, a quick check-in, and a weekly group call. Structure and accountability, not lessons.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://thepianobutler.com/practice-challenge.html">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #f5f0eb; color: #1a1008; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* Nav */
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 52px; background: #f5f0eb; border-bottom: 1px solid #e8e0d8; position: sticky; top: 0; z-index: 10; }
    .nav-logo { font-weight: 700; font-size: 15px; color: #1a1008; display: flex; align-items: center; gap: 8px; }
    .nav-logo-bar { width: 3px; height: 18px; background: #d4956a; border-radius: 2px; }
    .nav-back { font-size: 13px; color: #8a7a6a; }
    .nav-back:hover { color: #d4956a; }

    /* Hero */
    .hero { text-align: center; padding: 64px 24px 40px; max-width: 560px; margin: 0 auto; }
    .hero-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #d4956a; text-transform: uppercase; margin-bottom: 16px; }
    .hero-title { font-size: 34px; font-weight: 800; line-height: 1.18; color: #1a1008; margin-bottom: 16px; }
    .hero-sub { font-size: 15px; color: #6a5a4a; line-height: 1.6; }
    .hero-price { display: inline-block; margin-top: 16px; padding: 7px 16px; border-radius: 20px; background: #fdf0e8; color: #b8703a; font-size: 13px; font-weight: 700; }
    .hero-cta { display: inline-block; margin-top: 24px; padding: 13px 30px; background: #d4956a; color: #fff; font-size: 15px; font-weight: 700; border-radius: 12px; }
    .hero-cta:hover { background: #b8703a; }

    /* Benefits */
    .benefits { max-width: 560px; margin: 0 auto 8px; padding: 0 24px; }
    .benefits-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8a7a6a; margin-bottom: 14px; text-align: center; }
    .benefits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 480px) { .benefits-grid { grid-template-columns: 1fr; } }
    .benefit-item { background: #fff; border: 1px solid #e8e0d8; border-radius: 12px; padding: 18px 16px; }
    .benefit-icon { width: 34px; height: 34px; border-radius: 9px; background: #fdf0e8; display: flex; align-items: center; justify-content: center; font-size: 17px; margin-bottom: 12px; }
    .benefit-title { font-size: 14px; font-weight: 700; color: #1a1008; margin-bottom: 5px; line-height: 1.35; }
    .benefit-desc { font-size: 12.5px; color: #6a5a4a; line-height: 1.55; }

    /* Example day */
    .example { max-width: 560px; margin: 0 auto 40px; padding: 0 24px; }
    .example-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8a7a6a; margin-bottom: 12px; }
    .bubble { background: #fff; border: 1px solid #e8e0d8; border-radius: 14px; padding: 18px 20px; position: relative; }
    .bubble-from { font-size: 12px; font-weight: 700; color: #4a9a6a; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .bubble-body { font-size: 14px; color: #2a2015; line-height: 1.7; }
    .bubble-reply { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #e8e0d8; font-size: 13px; color: #6a5a4a; }

    /* Diagnose bridge */
    .bridge { max-width: 560px; margin: 0 auto 40px; padding: 0 24px; }
    .bridge-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #fdf3eb; border: 1px solid #f0d8c0; border-radius: 12px; padding: 16px 20px; flex-wrap: wrap; }
    .bridge-text { font-size: 13px; color: #6a5a4a; }
    .bridge-text strong { color: #1a1008; display: block; font-size: 14px; margin-bottom: 2px; }
    .bridge-btn { flex-shrink: 0; padding: 9px 18px; border-radius: 10px; border: 1.5px solid #d4956a; color: #a05a38; font-size: 13px; font-weight: 700; background: #fff; }
    .bridge-btn:hover { background: #d4956a; color: #fff; }

    /* How it works */
    .how { max-width: 560px; margin: 0 auto 40px; padding: 0 24px; display: flex; flex-direction: column; gap: 14px; }
    .how-item { display: flex; gap: 14px; align-items: flex-start; background: #fff; border: 1px solid #e8e0d8; border-radius: 12px; padding: 16px 18px; }
    .how-icon { font-size: 22px; line-height: 1; flex-shrink: 0; }
    .how-title { font-size: 14px; font-weight: 700; color: #1a1008; margin-bottom: 3px; }
    .how-desc { font-size: 13px; color: #6a5a4a; line-height: 1.5; }

    /* Card */
    .card { background: #fff; border-radius: 16px; border: 1px solid #e8e0d8; max-width: 560px; margin: 0 auto 40px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8a7a6a; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #f0e8e0; }

    /* Level badge / chips */
    .level-badge { display: inline-flex; align-items: center; gap: 8px; background: #fdf3eb; border: 1px solid #f0d8c0; border-radius: 10px; padding: 10px 16px; font-size: 13px; color: #a05a38; font-weight: 600; margin-bottom: 24px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 7px 14px; border-radius: 20px; border: 1.5px solid #e0d8d0; font-size: 13px; cursor: pointer; background: #faf8f5; color: #3a2a1a; transition: all 0.15s; }
    .chip:hover { border-color: #d4956a; }
    .chip.selected { border-color: #d4956a; background: #fdf0e8; color: #b8703a; font-weight: 600; }

    /* Form */
    .field { margin-bottom: 22px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #3a2a1a; margin-bottom: 8px; }
    .field label span { font-weight: 400; color: #8a7a6a; margin-left: 4px; }
    .field input {
      width: 100%; padding: 11px 14px; border: 1.5px solid #e0d8d0; border-radius: 10px;
      font-size: 14px; font-family: inherit; color: #1a1008; background: #faf8f5;
      transition: border-color 0.15s;
    }
    .field input:focus { outline: none; border-color: #d4956a; background: #fff; }
    .field-hint { font-size: 12px; color: #8a7a6a; margin-top: 6px; }

    /* Submit */
    .btn-submit { width: 100%; padding: 14px; background: #d4956a; color: #fff; font-size: 15px; font-weight: 700; border-radius: 12px; transition: background 0.15s; margin-top: 8px; }
    .btn-submit:hover:not(:disabled) { background: #b8703a; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Success */
    .success-card { text-align: center; padding: 48px 32px; }
    .success-icon { font-size: 48px; margin-bottom: 20px; }
    .success-title { font-size: 24px; font-weight: 800; color: #1a1008; margin-bottom: 12px; }
    .success-msg { font-size: 15px; color: #6a5a4a; line-height: 1.6; margin-bottom: 28px; }
    .btn-back { display: inline-block; padding: 11px 24px; border: 1.5px solid #e0d8d0; border-radius: 10px; font-size: 14px; color: #3a2a1a; }
    .btn-back:hover { border-color: #d4956a; color: #d4956a; }
    .payment-note { background: #fdf8f4; border: 1px solid #f0e0d0; border-radius: 12px; padding: 18px 20px; margin-bottom: 24px; text-align: left; }
    .payment-note-title { font-size: 14px; font-weight: 700; color: #3a2a1a; margin-bottom: 4px; }
    .payment-note-desc { font-size: 13px; color: #6a5a4a; line-height: 1.5; }

    /* Error */
    .error-msg { font-size: 13px; color: #c0392b; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo"><div class="nav-logo-bar"></div>Piano Butler</div>
    <a href="index.html" class="nav-back">← Back to search</a>
  </nav>
  <div id="root"></div>

  <script id="app-jsx" type="text/jsx-raw">
  const { useState } = React;

  // --- Pilot switches ---
  // While PILOT_MODE is true, the first cohort is free and signups skip straight to
  // "we'll WhatsApp you the invite." Once the pilot validates retention, flip this to
  // false, set CHALLENGE_PRICE, and paste a real Stripe Payment Link below —
  // dashboard.stripe.com > Products > Add Product > Create payment link.
  const PILOT_MODE = true;
  const CHALLENGE_PRICE = "Free — pilot cohort";
  const CHALLENGE_LENGTH = "4 weeks"; // whether weekends are included is settled 1:1 during WhatsApp onboarding, not stated publicly here
  const STRIPE_PAYMENT_LINK = ""; // TODO (Sohyun): paste Stripe Payment Link here once PILOT_MODE is false

  const FALLBACK_LEVELS = ["Just starting out", "Coming back after a break", "Pretty comfortable already"];

  const BENEFITS = [
    { icon: "🧭", title: "You never have to guess what to practise", desc: "No more staring at the piano wondering where to start. Each day's mission is already picked for you — just open WhatsApp and go." },
    { icon: "⏱️", title: "Built for a real, busy schedule", desc: "15-20 minutes most days — not another hour you'll skip the moment the week gets hectic." },
    { icon: "🤝", title: "Just enough accountability, none of the pressure", desc: "A daily check-in means you can't quietly skip it in your own head — but nobody's grading you, and a voice note is enough if you'd rather not be seen." },
    { icon: "📈", title: "A month adds up more than you'd think", desc: "Most people are surprised how different a piece feels by the end — not from practising harder, just from practising consistently." }
  ];

  const HOW_IT_WORKS = [
    { icon: "📅", title: "A daily mission on WhatsApp", desc: "A short message with what to practise, picked for your level — pace and days are worked out with you when you join." },
    { icon: "✅", title: "Check in your way", desc: "A voice note, a quick video, or just a few lines on what you practised and for how long — whatever's easiest that day." },
    { icon: "👥", title: "One live group session a month", desc: "A short Zoom call with the group to work through what's been tricky. Exact date shared once your cohort starts." }
  ];

  function ChipGroup({ options, value, onChange }) {
    return (
      <div className="chips">
        {options.map(opt => (
          <button key={opt} type="button" className={"chip" + (value === opt ? " selected" : "")} onClick={() => onChange(opt)}>{opt}</button>
        ))}
      </div>
    );
  }

  function App() {
    const params = new URLSearchParams(window.location.search);
    const levelParam = params.get('level');

    const [submitted, setSubmitted] = useState(false);
    const [submitting, setSubmitting] = useState(false);
    const [error, setError] = useState('');
    const [form, setForm] = useState({ name: '', email: '', whatsapp: '', level: levelParam || '' });

    const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
    const canSubmit = form.name.trim() && form.email.trim() && form.whatsapp.trim() && form.level;

    const handleSubmit = async () => {
      setSubmitting(true);
      setError('');
      try {
        const body = {
          access_key: '1905cf40-5bcd-463a-87dd-c9d5ee673f56',
          subject: 'New 30-Day Practice Challenge Signup — Piano Butler',
          name: form.name,
          email: form.email,
          message: `
Name: ${form.name}
Email: ${form.email}
WhatsApp number: ${form.whatsapp}
Starting level: ${form.level}
Pilot mode: ${PILOT_MODE ? 'Yes — free cohort' : 'No — paid enrollment'}
          `.trim()
        };
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          setSubmitted(true);
        } else {
          setError('Something went wrong. Please try again or email us directly.');
        }
      } catch (e) {
        setError('Network error. Please check your connection and try again.');
      }
      setSubmitting(false);
    };

    if (submitted) {
      return (
        <div style={{ maxWidth: 560, margin: '0 auto', padding: '0 24px' }}>
          <div className="card success-card">
            <div className="success-icon">🎉</div>
            <div className="success-title">You're in, {form.name.split(' ')[0]}!</div>
            <div className="success-msg">
              {PILOT_MODE
                ? "We'll text your WhatsApp group invite within 24 hours, along with a quick note on how Day 1 works."
                : "One more step to lock in your spot — then we'll text your WhatsApp group invite."}
            </div>
            {!PILOT_MODE && (
              <div className="payment-note">
                <div className="payment-note-title">Next step: {CHALLENGE_PRICE} to confirm your spot</div>
                {STRIPE_PAYMENT_LINK ? (
                  <a href={STRIPE_PAYMENT_LINK} target="_blank" rel="noopener noreferrer" className="btn-submit" style={{ display: 'inline-block', textDecoration: 'none', marginTop: 10 }}>
                    🎹 Pay {CHALLENGE_PRICE} to confirm
                  </a>
                ) : (
                  <div className="payment-note-desc">We'll email you a secure payment link shortly.</div>
                )}
              </div>
            )}
            <a href="index.html" className="btn-back">← Back to Piano Butler</a>
          </div>
        </div>
      );
    }

    return (
      <div style={{ padding: '0 24px' }}>
        <div className="hero">
          <div className="hero-eyebrow">Practice Habit Challenge</div>
          <div className="hero-title">Build a practice habit that actually sticks</div>
          <div className="hero-sub">One month, run over WhatsApp. Not lessons — just the structure and accountability that's usually the hardest part to manage alone.</div>
          <div className="hero-price">{CHALLENGE_PRICE} · {CHALLENGE_LENGTH} · online</div>
          <div>
            <a href="#signup" className="hero-cta">Join the challenge →</a>
          </div>
        </div>

        <div className="benefits">
          <div className="benefits-label">Why this actually works</div>
          <div className="benefits-grid">
            {BENEFITS.map((item, i) => (
              <div className="benefit-item" key={i}>
                <div className="benefit-icon">{item.icon}</div>
                <div className="benefit-title">{item.title}</div>
                <div className="benefit-desc">{item.desc}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="how">
          <div className="example-label" style={{ textAlign: 'center' }}>How it works</div>
          {HOW_IT_WORKS.map((item, i) => (
            <div className="how-item" key={i}>
              <div className="how-icon">{item.icon}</div>
              <div>
                <div className="how-title">{item.title}</div>
                <div className="how-desc">{item.desc}</div>
              </div>
            </div>
          ))}
        </div>

        <div className="example">
          <div className="example-label">What a day looks like</div>
          <div className="bubble">
            <div className="bubble-from">🎹 Piano Butler</div>
            <div className="bubble-body">
              Good morning! Today's mission:<br/>
              🎵 <strong>Aria</strong> — Mozart (arr. Bastien)<br/>
              ⏱ 15 minutes, hands separate is fine today<br/>
              🎯 Focus: keeping the melody smooth
            </div>
            <div className="bubble-reply">↳ You practise, then reply with a voice note, a short video, or a couple of lines — whatever's easiest. That's the whole day.</div>
          </div>
        </div>

        <div className="bridge">
          <div className="bridge-card">
            <div className="bridge-text">
              <strong>Not sure where you're starting from?</strong>
              Take the free 2-minute check for a more personal starting point.
            </div>
            <a href="diagnose.html" className="bridge-btn">Take the 2-min check</a>
          </div>
        </div>

        <div className="card" id="signup">
          <div className="section-label">Join the challenge</div>

          {levelParam ? (
            <div className="level-badge">📍 Starting point from your diagnosis: {levelParam}</div>
          ) : (
            <div className="field">
              <label>Where are you starting from?</label>
              <ChipGroup options={FALLBACK_LEVELS} value={form.level} onChange={v => set('level', v)} />
              <div className="field-hint">Just a rough guide — not a placement test.</div>
            </div>
          )}

          <div className="field">
            <label>Name</label>
            <input type="text" placeholder="Your full name" value={form.name} onChange={e => set('name', e.target.value)} />
          </div>
          <div className="field">
            <label>Email</label>
            <input type="email" placeholder="your@email.com" value={form.email} onChange={e => set('email', e.target.value)} />
          </div>
          <div className="field">
            <label>WhatsApp number</label>
            <input type="tel" placeholder="+61 4xx xxx xxx" value={form.whatsapp} onChange={e => set('whatsapp', e.target.value)} />
            <div className="field-hint">This is where your daily missions and group invite will go.</div>
          </div>

          {error && <div className="error-msg">{error}</div>}
          <button className="btn-submit" onClick={handleSubmit} disabled={!canSubmit || submitting}>
            {submitting ? 'Sending...' : '🎹 Join the challenge'}
          </button>
        </div>

        <div style={{ textAlign: 'center', fontSize: 12, color: '#a09080', paddingBottom: 40 }}>
          Your details are only used to run the challenge. We never share your information.
        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(App));
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      function tryCompile() {
        if (typeof Babel === 'undefined') { setTimeout(tryCompile, 50); return; }
        try {
          const src = document.getElementById('app-jsx').textContent;
          const compiled = Babel.transform(src, { presets: ['react'] }).code;
          const s = document.createElement('script');
          s.textContent = compiled;
          document.body.appendChild(s);
        } catch(e) {
          document.getElementById('root').innerHTML = '<div style="padding:40px;color:red;font-family:monospace">Error: ' + e.message + '</div>';
        }
      }
      tryCompile();
    });
  </script>
</body>
</html>
