<title>Mary Play-Along</title>
<style>
:root{--bg:#faf6ec;--surface:#fffefa;--ink:#26296b;--muted:#6d6f9c;--line:rgba(38,41,107,.16);--coral:#e4572e;--coral-soft:#fbe3da;--on-coral:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15162e;--surface:#1d1f3d;--ink:#e9e8f6;--muted:#a3a5cf;--line:rgba(233,232,246,.16);--coral:#f07a55;--coral-soft:#3a2430;--on-coral:#15162e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15162e;--surface:#1d1f3d;--ink:#e9e8f6;--muted:#a3a5cf;--line:rgba(233,232,246,.16);--coral:#f07a55;--coral-soft:#3a2430;--on-coral:#15162e;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:18px}
.kick{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--coral)}
h1{font-family:"Playfair Display",Georgia,serif;font-size:30px;margin:2px 0 0;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.lab{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:20px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.go{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:12px;padding:14px;background:var(--coral);color:var(--on-coral);cursor:pointer}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bar{border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.bar b{font-family:"Playfair Display",Georgia,serif;font-size:18px}
.beats{display:flex;gap:4px;margin-top:6px}.beats i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.beats i.on{background:var(--coral)}
.bar.now{border-color:var(--coral);background:var(--coral-soft)}
.count{font-size:15px;color:var(--muted);min-height:1.4em;text-align:center;font-weight:700}
.note{font-size:14px;color:var(--muted);line-height:1.5;margin:0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Playfair+Display:wght@700&display=swap">
<div class="wrap">
  <div><div class="kick">Level 0 · Lesson 5 · Play along</div><h1>Mary had a little lamb</h1></div>
  <div class="card"><div class="lab">Speed</div><div class="seg" id="speed"></div></div>
  <div class="card"><div class="lab">What plays with you</div><div class="seg" id="parts"></div>
    <p class="note">Play your Way at the piano; the page plays the rest. Turn the tune off once you know it.</p></div>
  <button class="go" id="go">▶ Play (count-in 1 2 3 4)</button>
  <div class="count" id="count"></div>
  <div class="bars" id="bars"></div>
</div>
<script>
const S = {"title": "Mary had a little lamb", "bars": [[["e4", "c", "Ma", "i"], ["d4", "c", "ry", "t"], ["c4", "c", "had", ""], ["d4", "c", "a", ""]], [["e4", "c", "lit", "i"], ["e4", "c", "tle", "t"], ["e4", "m", "lamb,", ""]], [["d4", "c", "lit", "i"], ["d4", "c", "tle", "t"], ["d4", "m", "lamb,", ""]], [["e4", "c", "lit", "i"], ["g4", "c", "tle", "t"], ["g4", "m", "lamb,", ""]], [["e4", "c", "Ma", "i"], ["d4", "c", "ry", "t"], ["c4", "c", "had", ""], ["d4", "c", "a", ""]], [["e4", "c", "lit", "i"], ["e4", "c", "tle", "t"], ["e4", "c", "lamb,", ""], ["e4", "c", "its", ""]], [["d4", "c", "fleece", ""], ["d4", "c", "was", ""], ["e4", "c", "white", ""], ["d4", "c", "as", ""]], [["c4", "s", "snow.", ""]]], "chords": ["C", "C", "G", "C", "C", "C", "G", "C"], "lh": {"way2": {"C": [[["c3"], "s", "5"]], "G": [[["g3"], "s", "1"]]}, "way3": {"C": [[["c3"], "m", "5"], [["c3"], "m", "5"]], "G": [[["g3"], "m", "1"], [["g3"], "m", "1"]], "end": [[["c3"], "s", "5"]]}, "way4": {"C": [[["c3"], "c", "5"], [["c3"], "c", "5"], [["c3"], "c", "5"], [["c3"], "c", "5"]], "G": [[["g3"], "c", "1"], [["g3"], "c", "1"], [["g3"], "c", "1"], [["g3"], "c", "1"]], "end": [[["c3"], "s", "5"]]}}, "duet": {"note": "Teacher, both hands an octave higher than written: a music box over the child's hands.", "rh": {"C": ["c5", "e5", "g5", "e5"], "G": ["b4", "d5", "g5", "d5"]}, "lh": {"C": ["c4", "e4"], "G": ["b3", "d4"]}, "end": {"rh": ["c5", "e5", "g5"], "lh": ["c4", "e4"]}}}
;
const LEN = { c: 1, m: 2, s: 4, q: 0.5 };
const SPEEDS = [['Slow', 60], ['Medium', 80], ['Fast', 100]];
const PARTS = [['tune', 'The tune'], ['teacher', 'Teacher duet'], ['way2', 'Way 2'], ['way3', 'Way 3'], ['way4', 'Way 4']];
let bpm = 60, on = { tune: true, teacher: true, way2: false, way3: false, way4: false };
const $ = (id) => document.getElementById(id);
function seg(el, items, isOn, set) {
  el.innerHTML = ''; items.forEach(([k, label]) => { const b = document.createElement('button'); b.textContent = label;
    b.setAttribute('aria-pressed', isOn(k)); b.onclick = () => { set(k); seg(el, items, isOn, set); }; el.appendChild(b); });
}
seg($('speed'), SPEEDS.map(([l, v]) => [v, l + ' ' + v]), (v) => v === bpm, (v) => { bpm = v; });
// the left-hand ways are one at a time: picking one switches the others off
seg($('parts'), PARTS, (k) => on[k], (k) => { const nv = !on[k]; if (k.startsWith('way') && nv) ['way2', 'way3', 'way4'].forEach(w => on[w] = false); on[k] = nv; });
$('bars').innerHTML = S.bars.map((b, i) => `<div class="bar" id="b${i}"><b>${S.chords[i]}</b><div class="beats">${'<i></i>'.repeat(4)}</div></div>`).join('');

const midi = (p) => { const n = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 }[p[0]]; return 12 * (+p.slice(1) + 1) + n; };
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
let ctx, master, timers = [], playing = false;
function tone(t, m, dur, vol) {   // a soft piano-like note: two partials, quick attack, long decay
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
  o1.type = 'triangle'; o2.type = 'sine'; o1.frequency.value = hz(m); o2.frequency.value = hz(m) * 2;
  lp.type = 'lowpass'; lp.frequency.value = 2400; const g2 = ctx.createGain(); g2.gain.value = 0.25;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(master);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0008, t + Math.max(0.3, dur) + 0.35);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.5); o2.stop(t + dur + 0.5);
}
function click(t, hi) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = hi ? 1500 : 1000; o.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06); o.start(t); o.stop(t + 0.08); }
function events() {   // [beat, midi, beats, volume] for every part switched on
  const ev = []; const last = S.bars.length - 1;
  S.bars.forEach((bar, b) => { const b0 = b * 4; let beat = b0;
    if (on.tune) bar.forEach(([p, d]) => { ev.push([beat, midi(p), LEN[d], 0.30]); beat += LEN[d]; });
    ['way2', 'way3', 'way4'].forEach(w => { if (!on[w]) return; const pat = (b === last && S.lh[w].end) || S.lh[w][S.chords[b]]; let x = b0;
      pat.forEach(([ps, d]) => { ps.forEach(p => ev.push([x, midi(p), LEN[d], 0.26])); x += LEN[d]; }); });
    if (on.teacher) { const D = S.duet, ch = S.chords[b];   // the teacher an octave higher than written
      if (b === last) { D.end.rh.concat(D.end.lh).forEach(p => ev.push([b0, midi(p) + 12, 4, 0.13])); }
      else { D.rh[ch].forEach((p, k) => ev.push([b0 + k, midi(p) + 12, 1, 0.14])); [0, 2].forEach(k => D.lh[ch].forEach(p => ev.push([b0 + k, midi(p) + 12, 2, 0.11]))); } }
  });
  return ev;
}
function stop() { playing = false; timers.forEach(clearTimeout); timers = []; if (master) { master.gain.setTargetAtTime(0, ctx.currentTime, 0.05); }
  document.querySelectorAll('.bar').forEach(e => e.classList.remove('now')); document.querySelectorAll('.beats i').forEach(e => e.classList.remove('on'));
  $('go').textContent = '▶ Play (count-in 1 2 3 4)'; $('count').textContent = ''; }
$('go').onclick = () => {
  if (playing) return stop();
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume();
  master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
  playing = true; $('go').textContent = '■ Stop';
  const spb = 60 / bpm, t0 = ctx.currentTime + 0.15, start = t0 + 4 * spb;
  for (let k = 0; k < 4; k++) { click(t0 + k * spb, k === 0); timers.push(setTimeout(() => { $('count').textContent = 'Count in: ' + (k + 1); }, (0.15 + k * spb) * 1000)); }
  events().forEach(([beat, m, len, vol]) => tone(start + beat * spb, m, len * spb * 0.95, vol));
  const total = S.bars.length * 4;
  for (let k = 0; k < total; k++) timers.push(setTimeout(() => {
    $('count').textContent = 'Bar ' + (Math.floor(k / 4) + 1) + ' · beat ' + (k % 4 + 1);
    document.querySelectorAll('.bar').forEach((e, i) => e.classList.toggle('now', i === Math.floor(k / 4)));
    const bi = document.querySelectorAll('#b' + Math.floor(k / 4) + ' .beats i'); bi.forEach((e, j) => e.classList.toggle('on', j <= k % 4));
  }, (0.15 + (4 + k) * spb) * 1000));
  timers.push(setTimeout(stop, (0.15 + (4 + total) * spb + 0.6) * 1000));
};
</script>
