Until next time.", "cue": {"p": 122, "r": "pop8"}, "lens": {"k": "pop", "src": "pops/F6-8.webp"}}, {"t0": 12.46, "t1": 16.48, "who": "piano", "notes": [12.46, 12.77, 13.08, 13.39, 13.7, 14.01, 14.32, 14.63, 14.94], "cue": {"p": 122, "r": "pop8"}, "lens": {"k": "pop", "src": "pops/F6-8.webp"}}]}]}, {"k": "F7", "part": "Part VIII · Shape and style", "t": "7 · Musical periods: Baroque to Modern", "pages": [124, 125], "clips": [{"t": "Musical periods", "f": "audio/F7/01-musical-periods.mp3", "s": 41, "p": 124, "l": [{"t0": 3.4, "t1": 11.46, "who": "B", "text": "Music changes with its time, Clara, like clothes and buildings. Four big periods cover most piano music.", "cue": {"p": 124, "r": "lead"}}, {"t0": 11.46, "t1": 16.38, "who": "Q", "text": "Playing Chopin like Bach is like wearing a ball gown to a picnic.", "cue": {"p": 124, "r": "lead"}}, {"t0": 16.38, "t1": 22.29, "who": "B", "text": "Remember: listen for the texture, the ornaments and the pedal. They tell you the century.", "cue": {"p": 124, "r": "remember"}}, {"t0": 22.29, "t1": 40.64, "who": "B", "text": "Baroque, sixteen hundred to seventeen fifty: harpsichord, tunes woven together, many ornaments. Classical, to about eighteen twenty: tidy phrases and the Alberti bass. Romantic: big feelings, rich pedal and rubato. Modern: anything goes.", "cue": {"p": 124, "r": "table"}}]}, {"t": "Playing in style", "f": "audio/F7/02-playing-in-style.mp3", "s": 16, "p": 125, "l": [{"t0": 0.2, "t1": 16.29, "who": "B", "text": "Baroque: little or no pedal, steady time, a clear touch. Classical: light pedal, steady time, a neat, singing tune. Romantic: rich pedal, rubato, deep legato. Modern: whatever the music asks.", "cue": {"p": 125, "r": "h:Playing in style"}}]}, {"t": "Example: which period?", "f": "audio/F7/03-example-which-period.mp3", "s": 12, "p": 124, "l": [{"t0": 0.2, "t1": 6.4, "who": "B", "text": "A tune over an Alberti bass, with tidy four-bar phrases. Which period? Pause.", "cue": {"p": 124, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F7-1-q.webp"}}, {"t0": 6.4, "t1": 9.4, "who": "pause", "text": "Pause and try.", "cue": {"p": 124, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F7-1-q.webp"}}, {"t0": 9.4, "t1": 11.72, "who": "P", "text": "Classical. Think Mozart.", "cue": {"p": 124, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F7-1.webp"}}]}, {"t": "Example: and this one?", "f": "audio/F7/04-example-and-this-one.mp3", "s": 12, "p": 124, "l": [{"t0": 0.2, "t1": 6.36, "who": "B", "text": "Rubato, rich pedalled chords, huge leaps across the keyboard. Pause.", "cue": {"p": 124, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F7-3-q.webp"}}, {"t0": 6.36, "t1": 9.36, "who": "pause", "text": "Pause and try.", "cue": {"p": 124, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F7-3-q.webp"}}, {"t0": 9.36, "t1": 11.62, "who": "P", "text": "Romantic. Think Chopin.", "cue": {"p": 124, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F7-3.webp"}}]}, {"t": "Try it", "f": "audio/F7/05-try-it.mp3", "s": 12, "p": 124, "l": [{"t0": 0.2, "t1": 11.61, "who": "B", "text": "Match each composer to a period: Bach, Mozart, Chopin, Debussy. Baroque, Classical, Romantic, Modern. And that is the end of Part Eight. Until next time.", "cue": {"p": 124, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/F7-4.webp"}}]}]}, {"k": "O9", "part": "Part IX · Playing and listening", "t": "Part opener", "pages": [126], "clips": [{"t": "Part Nine: Playing and listening", "f": "audio/O9/01-part-nine-playing-and-listening.mp3", "s": 46, "p": 126, "l": [{"t0": 3.4, "t1": 8.39, "who": "B", "text": "Welcome to Part Nine, Clara: Playing and listening. At the piano.", "cue": {"p": 126, "r": "opener"}}, {"t0": 8.39, "t1": 21.69, "who": "B", "text": "Everything before this part is knowledge. This part turns it into playing: the right fingers, practice that works, reading at sight, a trained ear, calm on stage, and what to do when something goes wrong.", "cue": {"p": 126, "r": "opener"}}, {"t0": 21.69, "t1": 28.19, "who": "piano", "notes": [21.69, 22.31, 22.93, 23.55, 24.17, 24.79, 25.41, 26.03, 26.65], "cue": {"p": 126, "r": "opener"}}, {"t0": 28.19, "t1": 31.16, "who": "P", "text": "Five fingers, five notes, up and back!", "cue": {"p": 126, "r": "opener"}}, {"t0": 31.16, "t1": 44.19, "who": "B", "text": "Seven chapters: fingering, how to practise, sight-reading, listening for major or minor, intervals by song, performing, and common mistakes and how to fix them. Shall we start with your fingers?", "cue": {"p": 126, "r": "chapters"}}, {"t0": 44.19, "t1": 46.34, "who": "P", "text": "Ready when you are, Butler!", "cue": {"p": 126, "r": "chapters"}}]}]}, {"k": "L1", "part": "Part IX · Playing and listening", "t": "1 · Piano finger numbers and fingering", "pages": [127, 128], "clips": [{"t": "Finger numbers and fingering", "f": "audio/L1/01-finger-numbers-and-fingering.mp3", "s": 32, "p": 127, "l": [{"t0": 3.4, "t1": 14.25, "who": "B", "text": "Good fingering makes hard passages easy, Clara, and keeps your hand relaxed. It is planned, not guessed, and the plan starts with a number for every finger.", "cue": {"p": 127, "r": "lead"}}, {"t0": 14.25, "t1": 20.61, "who": "B", "text": "Remember: thumbs are one in both hands. Choose a fingering once, write it in, and keep it.", "cue": {"p": 127, "r": "remember"}}, {"t0": 20.61, "t1": 25.87, "who": "B", "text": "Five-finger position: thumb on C, one finger on each key up to G.", "cue": {"p": 127, "r": "h:Five-finger position"}}, {"t0": 25.87, "t1": 32.37, "who": "piano", "notes": [25.87, 26.49, 27.11, 27.73, 28.35, 28.97, 29.59, 30.21, 30.83], "cue": {"p": 127, "r": "h:Five-finger position"}}]}, {"t": "Thumb under, finger over", "f": "audio/L1/02-thumb-under-finger-over.mp3", "s": 29, "p": 128, "l": [{"t0": 0.2, "t1": 10.24, "who": "B", "text": "For a scale you need more than five fingers. Going up, play one, two, three, then tuck the thumb under to F, and go on: one, two, three, four, five.", "cue": {"p": 128, "r": "h:Thumb under, finger over"}}, {"t0": 10.24, "t1": 13.23, "who": "P", "text": "The thumb is like a little tunnel under a bridge!", "cue": {"p": 128, "r": "h:Thumb under, finger over"}}, {"t0": 13.23, "t1": 18.49, "who": "piano", "notes": [13.23, 13.85, 14.47, 15.09, 15.71, 16.33, 16.95, 17.57], "cue": {"p": 128, "r": "h:Thumb under, finger over"}}, {"t0": 18.49, "t1": 28.98, "who": "B", "text": "Coming down, finger three crosses over the thumb. Two traps: do not change fingering every time, and let the thumb glide under, never land heavily.", "cue": {"p": 128, "r": "trap"}}]}, {"t": "Example: which finger plays the F?", "f": "audio/L1/03-example-which-finger-plays-the-f.mp3", "s": 14, "p": 127, "l": [{"t0": 0.2, "t1": 6.4, "who": "B", "text": "C D E are one, two, three. The F: finger four, or the thumb tucked under? Pause.", "cue": {"p": 127, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L1-2-q.webp"}}, {"t0": 6.4, "t1": 9.4, "who": "pause", "text": "Pause and try.", "cue": {"p": 127, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L1-2-q.webp"}}, {"t0": 9.4, "t1": 14.26, "who": "P", "text": "The thumb passes under to F; then two, three, four, five reach the top C.", "cue": {"p": 127, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L1-2.webp"}}]}, {"t": "Try it", "f": "audio/L1/04-try-it.mp3", "s": 12, "p": 127, "l": [{"t0": 0.2, "t1": 11.74, "who": "B", "text": "Right hand on C D E F G. Play up and down, saying the finger numbers aloud. Then the left hand: five, four, three, two, one from C up. Until next time.", "cue": {"p": 127, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/L1-4.webp"}}]}]}, {"k": "L2", "part": "Part IX · Playing and listening", "t": "2 · How to practise piano", "pages": [129, 130], "clips": [{"t": "How to practise", "f": "audio/L2/01-how-to-practise.mp3", "s": 29, "p": 129, "l": [{"t0": 3.4, "t1": 13.32, "who": "B", "text": "Practice is not playing a piece again and again from the top, Clara. It is fixing the hard bits, slowly and correctly, then joining them back together.", "cue": {"p": 129, "r": "lead"}}, {"t0": 13.32, "t1": 19.05, "who": "B", "text": "Remember: slow, small and correct; then a little faster; then join the pieces.", "cue": {"p": 129, "r": "remember"}}, {"t0": 19.05, "t1": 28.96, "who": "B", "text": "A fifteen-minute plan: two minutes of warm-up, five on the hardest bars, slowly, five joining them up, and three playing the whole piece, for joy.", "cue": {"p": 129, "r": "table"}}]}, {"t": "Four tools", "f": "audio/L2/02-four-tools.mp3", "s": 19, "p": 130, "l": [{"t0": 0.2, "t1": 13.02, "who": "B", "text": "Small chunks: one bar, plus the first note of the next. Hands separately until each is easy. Slow, then faster: three correct times, then one notch up the metronome. And count aloud.", "cue": {"p": 130, "r": "h:Four tools"}}, {"t0": 13.02, "t1": 16.08, "who": "P", "text": "I played it right twice. That’s nearly three.", "cue": {"p": 130, "r": "h:Four tools"}}, {"t0": 16.08, "t1": 19.13, "who": "B", "text": "Nearly isn’t three, I’m afraid.", "cue": {"p": 130, "r": "h:Four tools"}}]}, {"t": "Example: which bar first?", "f": "audio/L2/03-example-which-bar-first.mp3", "s": 15, "p": 129, "l": [{"t0": 0.2, "t1": 6.83, "who": "B", "text": "You play the piece through, and it slips at the semiquavers in bar three. Where do you start? Pause.", "cue": {"p": 129, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L2-1-q.webp"}}, {"t0": 6.83, "t1": 9.83, "who": "pause", "text": "Pause and try.", "cue": {"p": 129, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L2-1-q.webp"}}, {"t0": 9.83, "t1": 14.52, "who": "P", "text": "Bar three, slowly. The hardest bar first, then join bars two to four.", "cue": {"p": 129, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L2-1.webp"}}]}, {"t": "Example: when do you speed up?", "f": "audio/L2/04-example-when-do-you-speed-up.mp3", "s": 11, "p": 129, "l": [{"t0": 0.2, "t1": 4.18, "who": "B", "text": "At sixty: right, right, wrong. Do you speed up? Pause.", "cue": {"p": 129, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L2-2-q.webp"}}, {"t0": 4.18, "t1": 7.18, "who": "pause", "text": "Pause and try.", "cue": {"p": 129, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L2-2-q.webp"}}, {"t0": 7.18, "t1": 11.47, "who": "P", "text": "Not yet. Three correct in a row at sixty, then try sixty-six.", "cue": {"p": 129, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L2-2.webp"}}]}, {"t": "Try it", "f": "audio/L2/05-try-it.mp3", "s": 9, "p": 129, "l": [{"t0": 0.2, "t1": 9.2, "who": "B", "text": "Pick one hard bar. Play it three times correctly, slowly, then one notch faster. Stop when it slips twice. Until next time.", "cue": {"p": 129, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/L2-3.webp"}}]}]}, {"k": "L3", "part": "Part IX · Playing and listening", "t": "3 · Sight-reading", "pages": [131], "clips": [{"t": "Sight-reading", "f": "audio/L3/01-sight-reading.mp3", "s": 37, "p": 131, "l": [{"t0": 3.4, "t1": 12.76, "who": "B", "text": "Sight-reading is playing music you have never seen, Clara. The secret is a short look first, then keeping the beat going whatever happens.", "cue": {"p": 131, "r": "lead"}}, {"t0": 12.76, "t1": 15.98, "who": "P", "text": "Like a pilot checking the plane before take-off!", "cue": {"p": 131, "r": "lead"}}, {"t0": 15.98, "t1": 21.73, "who": "B", "text": "Remember: look before you play, then never stop. The beat matters more than any note.", "cue": {"p": 131, "r": "remember"}}, {"t0": 21.73, "t1": 31.78, "who": "B", "text": "The thirty-second scan: the key, the time signature, the first notes, the trickiest rhythm, the patterns, and the marks. Then count a bar, and go.", "cue": {"p": 131, "r": "table"}}, {"t0": 31.78, "t1": 36.81, "who": "B", "text": "And read ahead: while you play one bar, let your eyes move to the next.", "cue": {"p": 131, "r": "more"}}]}, {"t": "Example: what do you check first?", "f": "audio/L3/02-example-what-do-you-check-first.mp3", "s": 13, "p": 131, "l": [{"t0": 0.2, "t1": 5.44, "who": "B", "text": "One sharp, three-four, and an F in bar two. What do you play? Pause.", "cue": {"p": 131, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L3-1-q.webp"}}, {"t0": 5.44, "t1": 8.44, "who": "pause", "text": "Pause and try.", "cue": {"p": 131, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L3-1-q.webp"}}, {"t0": 8.44, "t1": 13.2, "who": "P", "text": "G major, three beats, and the F is F sharp. Count one, two, three, and go.", "cue": {"p": 131, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L3-1.webp"}}]}, {"t": "Example: a wrong note", "f": "audio/L3/03-example-a-wrong-note.mp3", "s": 13, "p": 131, "l": [{"t0": 0.2, "t1": 5.25, "who": "B", "text": "A wrong note in bar two. Stop and fix it, or keep going? Pause.", "cue": {"p": 131, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L3-2-q.webp"}}, {"t0": 5.25, "t1": 8.25, "who": "pause", "text": "Pause and try.", "cue": {"p": 131, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L3-2-q.webp"}}, {"t0": 8.25, "t1": 12.94, "who": "P", "text": "Keep going, and catch the next beat. A stop is heard far more than a wrong note.", "cue": {"p": 131, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L3-2.webp"}}]}, {"t": "Try it", "f": "audio/L3/04-try-it.mp3", "s": 9, "p": 131, "l": [{"t0": 0.2, "t1": 8.77, "who": "B", "text": "Pick something easy each day: scan it for thirty seconds, then play it once, slowly, without stopping. Until next time.", "cue": {"p": 131, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/L3-4.webp"}}]}]}, {"k": "L4", "part": "Part IX · Playing and listening", "t": "4 · Listening: major or minor, finished or not", "pages": [132], "clips": [{"t": "Listening", "f": "audio/L4/01-listening.mp3", "s": 39, "p": 132, "l": [{"t0": 3.4, "t1": 7.15, "who": "B", "text": "Your ear is a musical instrument too, Clara.", "cue": {"p": 132, "r": "lead"}}, {"t0": 7.15, "t1": 10.32, "who": "P", "text": "I can’t play my ear. I’ve tried wiggling it.", "cue": {"p": 132, "r": "lead"}}, {"t0": 10.32, "t1": 23.35, "who": "B", "text": "Train it in small steps: clap a rhythm back, sing a tune back, then hear whether music goes up or down, is major or minor, and whether it has finished. Remember: if you can sing it, you can play it.", "cue": {"p": 132, "r": "remember"}}, {"t0": 23.35, "t1": 26.78, "who": "B", "text": "Major or minor? Bright, then dark.", "cue": {"p": 132, "r": "more"}}, {"t0": 26.78, "t1": 30.23, "who": "piano", "notes": [26.78, 28.48], "cue": {"p": 132, "r": "more"}}, {"t0": 30.23, "t1": 32.3, "who": "B", "text": "Finished or not?", "cue": {"p": 132, "r": "more"}}, {"t0": 32.3, "t1": 38.65, "who": "piano", "notes": [32.3, 33.75, 35.45, 36.9], "cue": {"p": 132, "r": "more"}}]}, {"t": "Example: major or minor?", "f": "audio/L4/02-example-major-or-minor.mp3", "s": 16, "p": 132, "l": [{"t0": 0.2, "t1": 5.4, "who": "B", "text": "Listen to two chords. Bright or dark, and which note changed? Pause.", "cue": {"p": 132, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L4-2-q.webp"}}, {"t0": 5.4, "t1": 8.4, "who": "pause", "text": "Pause and try.", "cue": {"p": 132, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L4-2-q.webp"}}, {"t0": 8.4, "t1": 13.05, "who": "P", "text": "First minor, then major. Only the middle note moved, B flat up to B.", "cue": {"p": 132, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L4-2.webp"}}, {"t0": 13.05, "t1": 16.25, "who": "piano", "notes": [13.05, 14.5], "cue": {"p": 132, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L4-2.webp"}}]}, {"t": "Try it", "f": "audio/L4/03-try-it.mp3", "s": 10, "p": 132, "l": [{"t0": 0.2, "t1": 9.86, "who": "B", "text": "Ask someone to clap two bars; clap them straight back, keeping the beat. Then sing back a short tune and find it on the keys. Until next time.", "cue": {"p": 132, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/L4-3.webp"}}]}]}, {"k": "L5", "part": "Part IX · Playing and listening", "t": "5 · Ear training: intervals by song", "pages": [133], "clips": [{"t": "Intervals by song", "f": "audio/L5/01-intervals-by-song.mp3", "s": 46, "p": 133, "l": [{"t0": 3.4, "t1": 12.1, "who": "B", "text": "Every interval has a song that starts with it, Clara. Learn the first leap of a few tunes and you can name an interval by ear.", "cue": {"p": 133, "r": "lead"}}, {"t0": 12.1, "t1": 17.73, "who": "B", "text": "Remember: hear an interval, find the song that starts with it, and you have its name.", "cue": {"p": 133, "r": "remember"}}, {"t0": 17.73, "t1": 20.6, "who": "B", "text": "A major second: Frère Jacques.", "cue": {"p": 133, "r": "table"}}, {"t0": 20.6, "t1": 22.14, "who": "piano", "notes": [20.6, 21.22], "cue": {"p": 133, "r": "table"}}, {"t0": 22.14, "t1": 25.25, "who": "B", "text": "A major third: Oh When the Saints.", "cue": {"p": 133, "r": "table"}}, {"t0": 25.25, "t1": 26.79, "who": "piano", "notes": [25.25, 25.87], "cue": {"p": 133, "r": "table"}}, {"t0": 26.79, "t1": 29.99, "who": "B", "text": "A perfect fourth: Amazing Grace.", "cue": {"p": 133, "r": "table"}}, {"t0": 29.99, "t1": 31.53, "who": "piano", "notes": [29.99, 30.61], "cue": {"p": 133, "r": "table"}}, {"t0": 31.53, "t1": 34.59, "who": "B", "text": "A perfect fifth: Twinkle, Twinkle.", "cue": {"p": 133, "r": "table"}}, {"t0": 34.59, "t1": 36.13, "who": "piano", "notes": [34.59, 35.21], "cue": {"p": 133, "r": "table"}}, {"t0": 36.13, "t1": 39.5, "who": "B", "text": "And an octave: Somewhere over the Rainbow.", "cue": {"p": 133, "r": "table"}}, {"t0": 39.5, "t1": 41.04, "who": "piano", "notes": [39.5, 40.12], "cue": {"p": 133, "r": "table"}}, {"t0": 41.04, "t1": 45.62, "who": "B", "text": "One trap: only the first leap counts, not the whole tune.", "cue": {"p": 133, "r": "trap"}}]}, {"t": "Try it", "f": "audio/L5/02-try-it.mp3", "s": 7, "p": 133, "l": [{"t0": 0.2, "t1": 7.3, "who": "B", "text": "Ask someone to play an interval. Sing it, find the song, and name it. Ten in a row? Until next time.", "cue": {"p": 133, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L5-1.webp"}}]}]}, {"k": "L6", "part": "Part IX · Playing and listening", "t": "6 · Performing and stage nerves", "pages": [134, 135], "clips": [{"t": "Performing", "f": "audio/L6/01-performing.mp3", "s": 29, "p": 134, "l": [{"t0": 3.4, "t1": 10.67, "who": "B", "text": "Playing for others is a skill you can practise, Clara, like scales. Nerves are normal: they mean you care.", "cue": {"p": 134, "r": "lead"}}, {"t0": 10.67, "t1": 14.16, "who": "Q", "text": "When I forget a word, I simply carry on.", "cue": {"p": 134, "r": "lead"}}, {"t0": 14.16, "t1": 20.45, "who": "B", "text": "Remember: breathe, feel a bar of the beat, then begin. After a slip, catch the next beat.", "cue": {"p": 134, "r": "remember"}}, {"t0": 20.45, "t1": 28.9, "who": "B", "text": "Before: warm up, and practise starting. At the piano: adjust the bench, breathe out slowly, and hear the speed in your head.", "cue": {"p": 134, "r": "table"}}]}, {"t": "Playing from memory", "f": "audio/L6/02-playing-from-memory.mp3", "s": 15, "p": 135, "l": [{"t0": 0.2, "t1": 14.62, "who": "B", "text": "Memory works best four ways at once: the sound, the feel in your fingers, the look of the page, and knowing the chords and the form. Practise starting from three different places, and play it through once a day without stopping.", "cue": {"p": 135, "r": "more"}}]}, {"t": "Example: you slip in bar five", "f": "audio/L6/03-example-you-slip-in-bar-five.mp3", "s": 14, "p": 134, "l": [{"t0": 0.2, "t1": 5.57, "who": "B", "text": "A wrong note in bar five, and your hand freezes. What now? Pause.", "cue": {"p": 134, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/L6-3-q.webp"}}, {"t0": 5.57, "t1": 8.57, "who": "pause", "text": "Pause and try.", "cue": {"p": 134, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/L6-3-q.webp"}}, {"t0": 8.57, "t1": 13.58, "who": "P", "text": "Keep counting and come back in on the next beat, or at the next phrase. Never go back.", "cue": {"p": 134, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/L6-3.webp"}}]}, {"t": "Try it: a one-minute concert", "f": "audio/L6/04-try-it-a-one-minute-concert.mp3", "s": 12, "p": 134, "l": [{"t0": 0.2, "t1": 12.14, "who": "B", "text": "Choose eight bars. Walk to the piano, sit, breathe, feel a bar, play, and bow. Do it for someone today. The audience is on your side from the first note. Until next time.", "cue": {"p": 134, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/L6-4.webp"}}]}]}, {"k": "L7", "part": "Part IX · Playing and listening", "t": "7 · Common piano mistakes and how to fix them", "pages": [136, 137], "clips": [{"t": "Common mistakes", "f": "audio/L7/01-common-mistakes.mp3", "s": 45, "p": 136, "l": [{"t0": 3.4, "t1": 12.7, "who": "B", "text": "Most wrong notes come from a few common slips, Clara. Find what you notice, check that one thing, and turn to the chapter that explains it.", "cue": {"p": 136, "r": "lead"}}, {"t0": 12.7, "t1": 19.28, "who": "B", "text": "Remember: name the slip, then fix only that spot. Playing from the top again rarely finds it.", "cue": {"p": 136, "r": "remember"}}, {"t0": 19.28, "t1": 34.94, "who": "B", "text": "If the left hand reads like the right, check the clef. If a rest gets skipped, count it like a note. If the sound is muddy, change the pedal on each new chord. If the end does not feel finished, look at the last two chords: five, then one.", "cue": {"p": 136, "r": "table"}}, {"t0": 34.94, "t1": 37.98, "who": "P", "text": "And if it is fine slowly but wrong at speed?", "cue": {"p": 137, "r": "table"}}, {"t0": 37.98, "t1": 45.0, "who": "B", "text": "Three right in a row, then one notch faster. And that is the end of Part Nine. Until next time.", "cue": {"p": 137, "r": "table"}}]}]}, {"k": "O10", "part": "Part X · Going further", "t": "Part opener", "pages": [138], "clips": [{"t": "Part Ten: Going further", "f": "audio/O10/01-part-ten-going-further.mp3", "s": 35, "p": 138, "l": [{"t0": 3.4, "t1": 8.11, "who": "B", "text": "Welcome to Part Ten, Clara: Going further. Beyond the levels.", "cue": {"p": 138, "r": "opener"}}, {"t0": 8.11, "t1": 16.66, "who": "B", "text": "This part is for later, when your pieces ask for it: the notes that step outside the chord to decorate a tune, and then come home.", "cue": {"p": 138, "r": "opener"}}, {"t0": 16.66, "t1": 20.68, "who": "piano", "notes": [16.66, 17.28, 17.9, 18.52, 19.14], "cue": {"p": 138, "r": "opener"}}, {"t0": 20.68, "t1": 23.02, "who": "P", "text": "A little step out, and back!", "cue": {"p": 138, "r": "opener"}}, {"t0": 23.02, "t1": 33.52, "who": "B", "text": "One chapter: non-chord notes, the passing note, the auxiliary note, the appoggiatura and the suspension. Read it whenever you are ready.", "cue": {"p": 138, "r": "chapters"}}, {"t0": 33.52, "t1": 34.97, "who": "P", "text": "I will!", "cue": {"p": 138, "r": "chapters"}}]}]}, {"k": "G1", "part": "Part X · Going further", "t": "1 · Non-chord notes: passing, auxiliary, appoggiatura, suspension", "pages": [139, 140], "clips": [{"t": "Non-chord notes", "f": "audio/G1/01-non-chord-notes.mp3", "s": 42, "p": 139, "l": [{"t0": 3.4, "t1": 13.42, "who": "B", "text": "Under a tune, Clara, the chord holds the main notes. The other notes are non-chord notes: they lean on the chord for a moment, then step back into it.", "cue": {"p": 139, "r": "lead"}}, {"t0": 13.42, "t1": 19.77, "who": "B", "text": "Remember: a note outside the chord moves by step: into the chord, out of it, or both.", "cue": {"p": 139, "r": "remember"}}, {"t0": 19.77, "t1": 23.52, "who": "B", "text": "A passing note steps between two chord notes.", "cue": {"p": 139, "r": "picture"}}, {"t0": 23.52, "t1": 26.3, "who": "piano", "notes": [23.52, 24.14, 24.76], "cue": {"p": 139, "r": "picture"}}, {"t0": 26.3, "t1": 30.48, "who": "B", "text": "An auxiliary note steps out and back to the same note.", "cue": {"p": 139, "r": "picture"}}, {"t0": 30.48, "t1": 33.26, "who": "piano", "notes": [30.48, 31.1, 31.72], "cue": {"p": 139, "r": "picture"}}, {"t0": 33.26, "t1": 39.43, "who": "B", "text": "An appoggiatura leans on the beat, then falls into the chord.", "cue": {"p": 139, "r": "picture"}}, {"t0": 39.43, "t1": 42.21, "who": "piano", "notes": [39.43, 40.67], "cue": {"p": 139, "r": "picture"}}]}, {"t": "Suspension and anticipation", "f": "audio/G1/02-suspension-and-anticipation.mp3", "s": 18, "p": 140, "l": [{"t0": 0.2, "t1": 8.3, "who": "B", "text": "A suspension is held over from the last chord, then falls. An anticipation arrives early, before its chord.", "cue": {"p": 140, "r": "more"}}, {"t0": 8.3, "t1": 11.75, "who": "piano", "notes": [8.3, 9.54, 10.16], "cue": {"p": 140, "r": "more"}}, {"t0": 11.75, "t1": 18.23, "who": "B", "text": "To find them: name the chord, mark every tune note that is not in it, and look how it moves.", "cue": {"p": 140, "r": "more"}}]}, {"t": "Example: which notes are outside?", "f": "audio/G1/03-example-which-notes-are-outside.mp3", "s": 18, "p": 139, "l": [{"t0": 0.2, "t1": 8.0, "who": "B", "text": "The chord is C: C, E and G. Mark every tune note that is not one of them, and see how it moves. Pause.", "cue": {"p": 139, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/G1-1-q.webp"}}, {"t0": 8.0, "t1": 13.0, "who": "pause", "text": "Pause and try.", "cue": {"p": 139, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/G1-1-q.webp"}}, {"t0": 13.0, "t1": 18.2, "who": "P", "text": "A and B pass from G up to C. And in bar two, D passes from E down to C.", "cue": {"p": 139, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/G1-1.webp"}}]}, {"t": "Try it: Ode to Joy", "f": "audio/G1/04-try-it-ode-to-joy.mp3", "s": 19, "p": 139, "l": [{"t0": 0.2, "t1": 14.4, "who": "B", "text": "Bar one of Ode to Joy sits on C. The F steps from E up to G: a passing note. Play it with a C chord in the left hand, and hear the F slip between. That is the end of the Handbook, Clara. Well done.", "cue": {"p": 139, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/G1-4.webp"}}, {"t0": 14.4, "t1": 17.18, "who": "piano", "notes": [14.4, 15.02, 15.64, 16.26], "cue": {"p": 139, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/G1-4.webp"}}, {" function tick() {

  if (!ln) { requestAnimationFrame(tick); return; }

        const covers = exm ? reg.l.filter(L => !L[2] && !vis.has(L[0])).map(L => `<div class="cov" style="left:${L[1][0] * 100 - .3}%;top:${L[1][1] * 100 - .2}%;width:${L[1][2] * 100 + .6}%;height:${L[1][3] * 100 + .4}%"></div>`).join('') + (reg.r ? `<div class="cov res" style="left:${reg.r[0] * 100}%;top:${reg.r[1] * 100}%;width:${reg.r[2] * 100}%;height:${reg.r[3] * 100}%">Answer coming…</div>` : '') : '';

audio.onplay = () => { requestAnimationFrame(tick); drawSide(); }; audio.onpause = () => { if (playing >= 0) drawSide(); };

function go(i, p = 0) { audio.pause(); playing = -1; if (typeof clearFollow === 'function') clearFollow(); ci = i; pi = p; sel.value = i; showPage(); drawSide(); history.replaceState(null, '', '#' + CH[i].k); window.scrollTo(0, 0); }

// her 11 Nov: a house room plays a slice of its chapter (?clips=1,2,5): only those clips, on their pages, with a link to the whole chapter
const SLICE = (new URLSearchParams(location.search).get('clips') || '').split(',').map(Number).filter(n => n > 0);
