 and a crotchet. One seat is left. Which rest fills it? Pause.", "cue": {"p": 40, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T2-3-q.webp"}}, {"t0": 7.04, "t1": 10.04, "who": "pause", "text": "Pause and try.", "cue": {"p": 40, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T2-3-q.webp"}}, {"t0": 10.04, "t1": 14.07, "who": "P", "text": "A crotchet rest. Two plus one plus one: the bar is full.", "cue": {"p": 40, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T2-3.webp"}}]}, {"t": "Try it: Twinkle", "f": "audio/T2/04-try-it-twinkle.mp3", "s": 15, "p": 40, "l": [{"t0": 0.2, "t1": 9.24, "who": "B", "text": "Six crotchets, then a minim to end the line: one beat, one beat, and two to breathe. Count it aloud as you play. Until next time.", "cue": {"p": 40, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/T2-4.webp"}}, {"t0": 9.24, "t1": 15.2, "who": "piano", "notes": [9.24, 9.86, 10.48, 11.1, 11.72, 12.34, 12.96, 13.58], "cue": {"p": 40, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/T2-4.webp"}}]}]}, {"k": "T3", "part": "Part II · Time", "t": "3 · Dotted notes", "pages": [41], "clips": [{"t": "Dotted notes", "f": "audio/T3/01-dotted-notes.mp3", "s": 42, "p": 41, "l": [{"t0": 3.4, "t1": 12.4, "who": "B", "text": "Sometimes a note needs a length no single shape gives, Clara, like three beats. A small dot after the note makes it longer.", "cue": {"p": 41, "r": "lead"}}, {"t0": 12.4, "t1": 16.06, "who": "B", "text": "Remember: a dot adds half of its own note.", "cue": {"p": 41, "r": "remember"}}, {"t0": 16.06, "t1": 20.45, "who": "B", "text": "A dotted minim: two, plus half of two, makes three beats.", "cue": {"p": 41, "r": "picture"}}, {"t0": 20.45, "t1": 23.31, "who": "piano", "notes": [20.45, 21.07, 21.69], "cue": {"p": 41, "r": "picture"}}, {"t0": 23.31, "t1": 32.67, "who": "B", "text": "A dotted crotchet: one, plus a half, makes one and a half. A dotted quaver: a half, plus a quarter, makes three quarters of a beat.", "cue": {"p": 41, "r": "picture"}}, {"t0": 32.67, "t1": 41.54, "who": "B", "text": "One trap. A dot after the head adds length. A dot above or below the head means staccato: short.", "cue": {"p": 41, "r": "trap"}}]}, {"t": "Example: a dotted crotchet and a quaver", "f": "audio/T3/02-example-a-dotted-crotchet-and-a-quaver.mp3", "s": 16, "p": 41, "l": [{"t0": 0.2, "t1": 6.77, "who": "B", "text": "A dotted crotchet, then a quaver. How many beats together, and where does the quaver fall? Pause.", "cue": {"p": 41, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T3-1-q.webp"}}, {"t0": 6.77, "t1": 10.77, "who": "pause", "text": "Pause and try.", "cue": {"p": 41, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T3-1-q.webp"}}, {"t0": 10.77, "t1": 15.52, "who": "P", "text": "One and a half, plus a half: two beats. The quaver lands on the and of beat two.", "cue": {"p": 41, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T3-1.webp"}}]}, {"t": "Example: Ode to Joy", "f": "audio/T3/03-example-ode-to-joy.mp3", "s": 26, "p": 41, "l": [{"t0": 0.2, "t1": 9.11, "who": "B", "text": "You already know a dotted crotchet. Bars three and four of Beethoven’s Ode to Joy go C, C, D, E, then E, D, D. Listen.", "cue": {"p": 41, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T3-2-q.webp"}}, {"t0": 9.11, "t1": 14.62, "who": "piano", "notes": [9.11, 9.73, 10.35, 10.97, 11.84, 12.77, 13.08], "cue": {"p": 41, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T3-2-q.webp"}}, {"t0": 14.62, "t1": 25.9, "who": "B", "text": "The E is a dotted crotchet, held through one and two. The quaver D falls on the and. Long, short, then long: the dot is why the tune leans before it lands.", "cue": {"p": 41, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T3-2-q.webp"}}]}, {"t": "Try it", "f": "audio/T3/04-try-it.mp3", "s": 14, "p": 41, "l": [{"t0": 0.2, "t1": 9.09, "who": "B", "text": "Clap once, and hold for three, saying one, two, three: a dotted minim. Then a dotted crotchet and a quaver. Until next time.", "cue": {"p": 41, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/T3-4.webp"}}, {"t0": 9.09, "t1": 13.81, "who": "piano", "notes": [9.09, 9.71, 10.33, 10.95, 11.57, 12.19], "cue": {"p": 41, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/T3-4.webp"}}]}]}, {"k": "T4", "part": "Part II · Time", "t": "4 · Ties", "pages": [42], "clips": [{"t": "Ties", "f": "audio/T4/01-ties.mp3", "s": 45, "p": 42, "l": [{"t0": 3.4, "t1": 12.25, "who": "B", "text": "A tie is a curve joining two notes of the same pitch, Clara. Play the first, then hold it through the second: one longer sound.", "cue": {"p": 42, "r": "lead"}}, {"t0": 12.25, "t1": 17.58, "who": "B", "text": "Two notes, but one sound. Two half-sandwiches are still one sandwich.", "cue": {"p": 42, "r": "lead"}}, {"t0": 17.58, "t1": 26.79, "who": "B", "text": "Remember: a tie glues two notes of the same pitch into one sound. And it can carry a note across the bar line, where a dot cannot.", "cue": {"p": 42, "r": "remember"}}, {"t0": 26.79, "t1": 32.3, "who": "piano", "notes": [26.79, 28.03, 29.52], "cue": {"p": 42, "r": "picture"}}, {"t0": 32.3, "t1": 41.98, "who": "B", "text": "Tie or slur? A tie joins the same pitch: play once and hold. A slur joins different pitches: play every note, smoothly joined.", "cue": {"p": 42, "r": "more"}}, {"t0": 41.98, "t1": 44.76, "who": "piano", "notes": [41.98, 42.6, 43.22, 43.84], "cue": {"p": 42, "r": "more"}}]}, {"t": "Example: dot or tie?", "f": "audio/T4/02-example-dot-or-tie.mp3", "s": 15, "p": 42, "l": [{"t0": 0.2, "t1": 6.7, "who": "B", "text": "A dotted minim, and a minim tied to a crotchet. Which is longer? Pause and add them up.", "cue": {"p": 42, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T4-1-q.webp"}}, {"t0": 6.7, "t1": 10.7, "who": "pause", "text": "Pause and try.", "cue": {"p": 42, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T4-1-q.webp"}}, {"t0": 10.7, "t1": 15.22, "who": "P", "text": "Both last three beats: the same. But only the tie can cross a bar line.", "cue": {"p": 42, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T4-1.webp"}}]}, {"t": "Example: which is longer?", "f": "audio/T4/03-example-which-is-longer.mp3", "s": 14, "p": 42, "l": [{"t0": 0.2, "t1": 5.25, "who": "B", "text": "Now a dotted minim against a minim tied to a quaver. Pause.", "cue": {"p": 42, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T4-2-q.webp"}}, {"t0": 5.25, "t1": 9.25, "who": "pause", "text": "Pause and try.", "cue": {"p": 42, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T4-2-q.webp"}}, {"t0": 9.25, "t1": 13.79, "who": "P", "text": "Three against two and a half: the dotted minim is longer, by half a beat.", "cue": {"p": 42, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T4-2.webp"}}]}, {"t": "Try it", "f": "audio/T4/04-try-it.mp3", "s": 9, "p": 42, "l": [{"t0": 0.2, "t1": 9.28, "who": "B", "text": "Find two tied notes in a piece you are playing. Play the first, then count through the second without playing it again. Until next time.", "cue": {"p": 42, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T4-3.webp"}}]}]}, {"k": "T5", "part": "Part II · Time", "t": "5 · Pulse and tempo", "pages": [43], "clips": [{"t": "Pulse and tempo", "f": "audio/T5/01-pulse-and-tempo.mp3", "s": 42, "p": 43, "l": [{"t0": 3.4, "t1": 6.25, "who": "B", "text": "Put your hand on your heart, Clara.", "cue": {"p": 43, "r": "lead"}}, {"t0": 6.25, "t1": 9.71, "who": "P", "text": "It’s beating. Steady, steady. Oh good, I’m alive.", "cue": {"p": 43, "r": "lead"}}, {"t0": 9.71, "t1": 20.35, "who": "B", "text": "That steady beat is a pulse, and almost every piece has one. Its speed is the tempo. Some beats are stronger than others, and beat one is the strongest.", "cue": {"p": 43, "r": "lead"}}, {"t0": 20.35, "t1": 26.31, "who": "piano", "notes": [20.35, 20.97, 21.59, 22.21, 22.83, 23.45, 24.07, 24.69], "cue": {"p": 43, "r": "picture"}}, {"t0": 26.31, "t1": 31.95, "who": "B", "text": "Remember: the beat never stops, not even in a rest. Feel it before you play.", "cue": {"p": 43, "r": "remember"}}, {"t0": 31.95, "t1": 42.25, "who": "B", "text": "Tempo is measured in beats per minute. Crotchet equals sixty means sixty beats a minute, one a second. A hundred and twenty is twice as fast.", "cue": {"p": 43, "r": "h:Tempo"}}]}, {"t": "Example: step in on the beat", "f": "audio/T5/02-example-step-in-on-the-beat.mp3", "s": 22, "p": 43, "l": [{"t0": 0.2, "t1": 13.7, "who": "B", "text": "The mark says crotchet equals ninety-six. Set the metronome, let one bar go by counting in your head, and step in on the next beat one, like stepping onto an escalator. Ready? Pause and feel it.", "cue": {"p": 43, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T5-1-q.webp"}}, {"t0": 13.7, "t1": 17.7, "who": "pause", "text": "Pause and try.", "cue": {"p": 43, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T5-1-q.webp"}}, {"t0": 17.7, "t1": 22.09, "who": "P", "text": "One, two, three, and in! The first note lands on the beat, not on a guess.", "cue": {"p": 43, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T5-1.webp"}}]}, {"t": "Example: march or waltz?", "f": "audio/T5/03-example-march-or-waltz.mp3", "s": 25, "p": 43, "l": [{"t0": 0.2, "t1": 6.83, "who": "B", "text": "Tap a steady beat as you listen. Which beats feel heavier? Count from one heavy beat to the next.", "cue": {"p": 43, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T5-3-q.webp"}}, {"t0": 6.83, "t1": 15.32, "who": "piano", "notes": [6.83, 7.45, 8.07, 8.94, 9.56, 10.18, 11.05, 11.67, 12.29, 13.16, 13.78, 14.4], "cue": {"p": 43, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T5-3-q.webp"}}, {"t0": 15.32, "t1": 18.32, "who": "pause", "text": "Pause and try.", "cue": {"p": 43, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T5-3-q.webp"}}, {"t0": 18.32, "t1": 21.56, "who": "P", "text": "Heavy every three: one two three. A waltz!", "cue": {"p": 43, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T5-3.webp"}}, {"t0": 21.56, "t1": 24.97, "who": "B", "text": "Quite right. Heavy every two would be a march.", "cue": {"p": 43, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T5-3.webp"}}]}, {"t": "Try it", "f": "audio/T5/04-try-it.mp3", "s": 19, "p": 43, "l": [{"t0": 0.2, "t1": 10.67, "who": "B", "text": "Hand on your heart. Tap the beat and say one, two, three, four, with one a little louder. Keep going for ten seconds without slowing down. Until next time.", "cue": {"p": 43, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/T5-6.webp"}}, {"t0": 10.67, "t1": 19.11, "who": "piano", "notes": [10.67, 11.29, 11.91, 12.53, 13.15, 13.77, 14.39, 15.01, 15.63, 16.25, 16.87, 17.49], "cue": {"p": 43, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/T5-6.webp"}}]}]}, {"k": "T6", "part": "Part II · Time", "t": "6 · Time signatures", "pages": [44, 45], "clips": [{"t": "Time signatures", "f": "audio/T6/01-time-signatures.mp3", "s": 56, "p": 44, "l": [{"t0": 3.4, "t1": 9.65, "who": "S", "text": "Tickets, please! I am the Stationmaster. I check the time signature at the start of the line.", "cue": {"p": 44, "r": "lead"}}, {"t0": 9.65, "t1": 20.67, "who": "B", "text": "A time signature is two numbers, Clara, like a train ticket. The top number says how many seats each bar has. The bottom number says which note fills one seat.", "cue": {"p": 44, "r": "lead"}}, {"t0": 20.67, "t1": 30.14, "who": "B", "text": "Remember: top number, how many beats. Bottom number, which note gets one beat. A four means a crotchet, a two a minim, an eight a quaver.", "cue": {"p": 44, "r": "remember"}}, {"t0": 30.14, "t1": 33.82, "who": "P", "text": "So three-four is three crotchet seats in every carriage.", "cue": {"p": 44, "r": "picture"}}, {"t0": 33.82, "t1": 38.54, "who": "piano", "notes": [33.82, 34.44, 35.06, 35.68, 36.3, 36.92], "cue": {"p": 44, "r": "picture"}}, {"t0": 38.54, "t1": 49.76, "who": "B", "text": "In simple time each beat divides in two. Four-four is also called common time, written as a C. With a line through it, cut common time: two minim beats.", "cue": {"p": 45, "r": "h:Simple time: each beat divides in two"}}, {"t0": 49.76, "t1": 56.11, "who": "B", "text": "And a new time signature can appear after any bar line. It holds until the next one.", "cue": {"p": 45, "r": "h:Simple time: each beat divides in two"}}]}, {"t": "Example: what does three-four mean?", "f": "audio/T6/02-example-what-does-three-four-mean.mp3", "s": 14, "p": 44, "l": [{"t0": 0.2, "t1": 5.78, "who": "B", "text": "Three-four. How many counts in each bar, and which note gets one count? Pause.", "cue": {"p": 44, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T6-2-q.webp"}}, {"t0": 5.78, "t1": 8.78, "who": "pause", "text": "Pause and try.", "cue": {"p": 44, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T6-2-q.webp"}}, {"t0": 8.78, "t1": 14.07, "who": "P", "text": "Three counts, and a crotchet gets one. Two quavers, a crotchet and a crotchet make three.", "cue": {"p": 44, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T6-2.webp"}}]}, {"t": "Example: which ticket?", "f": "audio/T6/03-example-which-ticket.mp3", "s": 10, "p": 44, "l": [{"t0": 0.2, "t1": 5.72, "who": "B", "text": "A carriage with three seats, and a quaver in each. Write the ticket. Pause.", "cue": {"p": 44, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T6-3-q.webp"}}, {"t0": 5.72, "t1": 8.72, "who": "pause", "text": "Pause and try.", "cue": {"p": 44, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T6-3-q.webp"}}, {"t0": 8.72, "t1": 10.21, "who": "P", "text": "Three-eight!", "cue": {"p": 44, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T6-3.webp"}}]}, {"t": "Example: where does the rest go?", "f": "audio/T6/04-example-where-does-the-rest-go.mp3", "s": 13, "p": 44, "l": [{"t0": 0.2, "t1": 5.76, "who": "B", "text": "Four-four, with three crotchets. Which seat is empty, and what goes there? Pause.", "cue": {"p": 44, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/T6-4-q.webp"}}, {"t0": 5.76, "t1": 8.76, "who": "pause", "text": "Pause and try.", "cue": {"p": 44, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/T6-4-q.webp"}}, {"t0": 8.76, "t1": 13.03, "who": "P", "text": "Seat four: a crotchet rest. One, two, three, and four in silence.", "cue": {"p": 44, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/T6-4.webp"}}]}, {"t": "Try it: a Minuet", "f": "audio/T6/05-try-it-a-minuet.mp3", "s": 21, "p": 44, "l": [{"t0": 0.2, "t1": 12.29, "who": "B", "text": "This minuet from the Notebook for Anna Magdalena Bach has three crotchet beats in every bar: the step of the dance. Count one, two, three aloud as it plays. Until next time.", "cue": {"p": 44, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/T6-5.webp"}}, {"t0": 12.29, "t1": 20.78, "who": "piano", "notes": [12.29, 12.91, 13.22, 13.53, 13.84, 14.4, 15.02, 15.64, 16.51, 17.13, 17.44, 17.75, 18.06, 18.62, 19.24, 19.86], "cue": {"p": 44, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/T6-5.webp"}}]}]}, {"k": "T7", "part": "Part II · Time", "t": "7 · Compound time", "pages": [46, 47], "clips": [{"t": "Compound time", "f": "audio/T7/01-compound-time.mp3", "s": 45, "p": 46, "l": [{"t0": 3.4, "t1": 10.18, "who": "B", "text": "Compound time is a skipping rope, Clara. Each beat is a dotted note that splits into three.", "cue": {"p": 46, "r": "lead"}}, {"t0": 10.18, "t1": 13.89, "who": "P", "text": "Pine-ap-ple, pine-ap-ple. Now I want a fruit salad.", "cue": {"p": 46, "r": "lead"}}, {"t0": 13.89, "t1": 18.92, "who": "B", "text": "Remember: dotted beats split in three. Six-eight is two big beats.", "cue": {"p": 46, "r": "remember"}}, {"t0": 18.92, "t1": 23.64, "who": "piano", "notes": [18.92, 19.54, 20.16, 20.78, 21.4, 22.02], "cue": {"p": 46, "r": "picture"}}, {"t0": 23.64, "t1": 34.28, "who": "B", "text": "Quick test: a top number of six, nine or twelve means compound. Divide by three to find the beats: six-eight has two, nine-eight three, twelve-eight four.", "cue": {"p": 47, "r": "h:Compound time signatures"}}, {"t0": 34.28, "t1": 44.85, "who": "B", "text": "Slowly, count all six quavers. At speed, feel two beats, on one and four. One trap: six-eight is not six crotchet beats. The eight means quavers.", "cue": {"p": 47, "r": "trap"}}]}, {"t": "Example: nine-eight", "f": "audio/T7/02-example-nine-eight.mp3", "s": 13, "p": 46, "l": [{"t0": 0.2, "t1": 4.55, "who": "B", "text": "How many beats in nine-eight? Divide by three. Pause.", "cue": {"p": 46, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T7-1-q.webp"}}, {"t0": 4.55, "t1": 7.55, "who": "pause", "text": "Pause and try.", "cue": {"p": 46, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T7-1-q.webp"}}, {"t0": 7.55, "t1": 12.66, "who": "P", "text": "Three beats, each a dotted crotchet: one two three, four five six, seven eight nine.", "cue": {"p": 46, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T7-1.webp"}}]}, {"t": "Try it: Row, Row, Row Your Boat", "f": "audio/T7/03-try-it-row-row-row-your-boat.mp3", "s": 16, "p": 46, "l": [{"t0": 0.2, "t1": 7.41, "who": "B", "text": "Two big beats in every bar: row, row. Sway twice in each bar while you sing it. Until next time.", "cue": {"p": 46, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T7-2.webp"}}, {"t0": 7.41, "t1": 15.9, "who": "piano", "notes": [7.41, 8.34, 9.52, 10.14, 10.45, 11.63, 12.25, 12.56, 13.18, 13.74], "cue": {"p": 46, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T7-2.webp"}}]}]}, {"k": "T8", "part": "Part II · Time", "t": "8 · Irregular time", "pages": [48], "clips": [{"t": "Irregular time", "f": "audio/T8/01-irregular-time.mp3", "s": 34, "p": 48, "l": [{"t0": 3.4, "t1": 13.78, "who": "B", "text": "Most music counts in twos and threes, Clara. Irregular time puts both in one bar: five or seven counts, felt as a long group and a short one.", "cue": {"p": 48, "r": "lead"}}, {"t0": 13.78, "t1": 20.07, "who": "B", "text": "Remember: five or seven counts, felt in uneven groups. Three and two, or four and three.", "cue": {"p": 48, "r": "remember"}}, {"t0": 20.07, "t1": 27.27, "who": "piano", "notes": [20.07, 20.69, 21.31, 21.93, 22.55, 23.17, 23.79, 24.41, 25.03, 25.65], "cue": {"p": 48, "r": "picture"}}, {"t0": 27.27, "t1": 30.66, "who": "P", "text": "One two three, one two. It limps, but nicely.", "cue": {"p": 48, "r": "picture"}}, {"t0": 30.66, "t1": 33.62, "who": "B", "text": "You will meet it from Grade 5.", "cue": {"p": 48, "r": "more"}}]}, {"t": "Example: uneven groups in four-four", "f": "audio/T8/02-example-uneven-groups-in-four-four.mp3", "s": 19, "p": 48, "l": [{"t0": 0.2, "t1": 7.88, "who": "B", "text": "Eight quavers in a bar of four-four, grouped three, three, two. Keep your foot on the beat. How many foot taps? Pause.", "cue": {"p": 48, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T8-1-q.webp"}}, {"t0": 7.88, "t1": 11.88, "who": "pause", "text": "Pause and try.", "cue": {"p": 48, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T8-1-q.webp"}}, {"t0": 11.88, "t1": 16.61, "who": "P", "text": "Accents on one, four and seven, but still four taps. It is still four-four.", "cue": {"p": 48, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T8-1.webp"}}, {"t0": 16.61, "t1": 19.39, "who": "piano", "notes": [16.61, 16.92, 17.23, 17.54, 17.85, 18.16, 18.47, 18.78], "cue": {"p": 48, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T8-1.webp"}}]}, {"t": "Try it", "f": "audio/T8/03-try-it.mp3", "s": 7, "p": 48, "l": [{"t0": 0.2, "t1": 6.79, "who": "B", "text": "Count five, clapping on one and four. Then swap: clap on one and three. Until next time.", "cue": {"p": 48, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T8-1-q.webp"}}]}]}, {"k": "T9", "part": "Part II · Time", "t": "9 · Groups and beams", "pages": [49], "clips": [{"t": "Groups and beams", "f": "audio/T9/01-groups-and-beams.mp3", "s": 23, "p": 49, "l": [{"t0": 3.4, "t1": 9.67, "who": "B", "text": "Beams join the notes of one beat, Clara, so you can see where each beat begins at a glance.", "cue": {"p": 49, "r": "lead"}}, {"t0": 9.67, "t1": 12.69, "who": "B", "text": "Remember: one beam, one beat.", "cue": {"p": 49, "r": "remember"}}, {"t0": 12.69, "t1": 23.27, "who": "B", "text": "In four-four a beam may cover beats one and two, or three and four, but never cross the middle of the bar. In compound time, quavers are beamed in threes.", "cue": {"p": 49, "r": "h:Grouping with beams"}}]}, {"t": "Example: six quavers in three-four", "f": "audio/T9/02-example-six-quavers-in-three-four.mp3", "s": 16, "p": 49, "l": [{"t0": 0.2, "t1": 6.51, "who": "B", "text": "Six quavers in three-four are beamed in twos. Why? Pause and think about the beats.", "cue": {"p": 49, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T9-1-q.webp"}}, {"t0": 6.51, "t1": 10.51, "who": "pause", "text": "Pause and try.", "cue": {"p": 49, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T9-1-q.webp"}}, {"t0": 10.51, "t1": 15.56, "who": "P", "text": "Three crotchet beats, two quavers each. Beamed in threes, they would look like six-eight.", "cue": {"p": 49, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T9-1.webp"}}]}, {"t": "Try it", "f": "audio/T9/03-try-it.mp3", "s": 7, "p": 49, "l": [{"t0": 0.2, "t1": 7.04, "who": "B", "text": "Open a piece you are playing and touch the start of every beam: each one is a beat. Until next time.", "cue": {"p": 49, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T9-1-q.webp"}}]}]}, {"k": "T10", "part": "Part II · Time", "t": "10 · Upbeats (anacrusis)", "pages": [50], "clips": [{"t": "Upbeats", "f": "audio/T10/01-upbeats.mp3", "s": 33, "p": 50, "l": [{"t0": 3.4, "t1": 12.59, "who": "B", "text": "Some tunes start before the first strong beat, Clara, like a breath before you speak. Those first notes are the upbeat, or anacrusis.", "cue": {"p": 50, "r": "lead"}}, {"t0": 12.59, "t1": 16.68, "who": "B", "text": "A very small, polite dinosaur that arrives early.", "cue": {"p": 50, "r": "lead"}}, {"t0": 16.68, "t1": 22.42, "who": "B", "text": "Remember: an upbeat borrows from the last bar. Together they make one full bar.", "cue": {"p": 50, "r": "remember"}}, {"t0": 22.42, "t1": 26.21, "who": "B", "text": "Count one, two silently, then play on three.", "cue": {"p": 50, "r": "picture"}}, {"t0": 26.21, "t1": 32.79, "who": "piano", "notes": [26.21, 26.83, 27.45, 28.07, 28.69, 29.31, 29.93, 30.55, 31.17], "cue": {"p": 50, "r": "picture"}}]}, {"t": "Try it: Happy Birthday", "f": "audio/T10/02-try-it-happy-birthday.mp3", "s": 15, "p": 50, "l": [{"t0": 0.2, "t1": 10.88, "who": "B", "text": "Hap-py comes before the first strong beat: an upbeat. The strong beat lands on birth. Sing it and clap only on birth, day and you. Until next time.", "cue": {"p": 50, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T10-1.webp"}}, {"t0": 10.88, "t1": 15.4, "who": "piano", "notes": [10.88, 11.35, 11.75, 12.37, 12.99, 13.86], "cue": {"p": 50, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T10-1.webp"}}]}]}, {"k": "T11", "part": "Part II · Time", "t": "11 · Triplets", "pages": [51], "clips": [{"t": "Triplets", "f": "audio/T11/01-triplets.mp3", "s": 25, "p": 51, "l": [{"t0": 3.4, "t1": 12.38, "who": "B", "text": "Usually a beat splits in two, Clara. A triplet splits it in three: three equal notes in the time of two, marked with a little three.", "cue": {"p": 51, "r": "lead"}}, {"t0": 12.38, "t1": 15.98, "who": "B", "text": "Remember: three equal notes in the time of two.", "cue": {"p": 51, "r": "remember"}}, {"t0": 15.98, "t1": 24.55, "who": "B", "text": "Two quavers cut a beat in two. A triplet cuts it in three. Four semiquavers cut it in four. And the beat never moves.", "cue": {"p": 51, "r": "picture"}}]}, {"t": "Example: count the triplet", "f": "audio/T11/02-example-count-the-triplet.mp3", "s": 10, "p": 51, "l": [{"t0": 0.2, "t1": 4.76, "who": "B", "text": "A bar of four, with a triplet on beat two. Say it. Pause.", "cue": {"p": 51, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T11-1-q.webp"}}, {"t0": 4.76, "t1": 7.76, "who": "pause", "text": "Pause and try.", "cue": {"p": 51, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T11-1-q.webp"}}, {"t0": 7.76, "t1": 10.06, "who": "P", "text": "One, two and a, three, four!", "cue": {"p": 51, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T11-1.webp"}}]}, {"t": "Example: a bar of mixed values", "f": "audio/T11/03-example-a-bar-of-mixed-values.mp3", "s": 14, "p": 51, "l": [{"t0": 0.2, "t1": 6.77, "who": "B", "text": "A crotchet, two quavers, four semiquavers and a triplet: one beat each. Say it. Pause.", "cue": {"p": 51, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T11-2-q.webp"}}, {"t0": 6.77, "t1": 10.77, "who": "pause", "text": "Pause and try.", "cue": {"p": 51, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T11-2-q.webp"}}, {"t0": 10.77, "t1": 13.75, "who": "P", "text": "One, two and, three e and a, four and a.", "cue": {"p": 51, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T11-2.webp"}}]}, {"t": "Try it", "f": "audio/T11/04-try-it.mp3", "s": 7, "p": 51, "l": [{"t0": 0.2, "t1": 7.02, "who": "B", "text": "Say trip-o-let, trip-o-let to a steady tap, one word on every tap. Until next time.", "cue": {"p": 51, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T11-2-q.webp"}}]}]}, {"k": "T12", "part": "Part II · Time", "t": "12 · Rhythm: off the beat", "pages": [52, 53], "clips": [{"t": "Rhythm: off the beat", "f": "audio/T12/01-rhythm-off-the-beat.mp3", "s": 36, "p": 52, "l": [{"t0": 3.4, "t1": 11.16, "who": "B", "text": "Now the fun part, Clara: rhythm that teases the beat. It only works if the beat underneath stays rock-steady.", "cue": {"p": 52, "r": "lead"}}, {"t0": 11.16, "t1": 14.1, "who": "P", "text": "My foot is very easily distracted.", "cue": {"p": 52, "r": "lead"}}, {"t0": 14.1, "t1": 18.6, "who": "B", "text": "Remember: keep the beat rock-steady and let the rhythm tease it.", "cue": {"p": 52, "r": "remember"}}, {"t0": 18.6, "t1": 28.19, "who": "B", "text": "Syncopation: a note starts on the and, between the beats, and is held through the next beat. Feel that beat, even though nothing is played on it.", "cue": {"p": 52, "r": "more"}}, {"t0": 28.19, "t1": 36.38, "who": "B", "text": "A hemiola: two bars of three-four felt as three bars of two. Common at the ends of phrases in Baroque dances.", "cue": {"p": 52, "r": "more"}}]}, {"t": "Swing, polyrhythm and rubato", "f": "audio/T12/02-swing-polyrhythm-and-rubato.mp3", "s": 22, "p": 52, "l": [{"t0": 0.2, "t1": 7.9, "who": "B", "text": "Swing: pairs of quavers are written evenly but played long, short, like the first and last notes of a triplet.", "cue": {"p": 52, "r": "h:Swing Prelim"}}, {"t0": 7.9, "t1": 10.68, "who": "piano", "notes": [7.9, 8.31, 8.52, 8.93, 9.14], "cue": {"p": 52, "r": "h:Swing Prelim"}}, {"t0": 10.68, "t1": 22.36, "who": "B", "text": "Polyrhythm: two rhythms at once, like three against two. And rubato: time stretched and then given back, for expression. The pulse always returns.", "cue": {"p": 52, "r": "h:Swing Prelim"}}]}, {"t": "Example: where does the long note start?", "f": "audio/T12/03-example-where-does-the-long-note-start.mp3", "s": 13, "p": 52, "l": [{"t0": 0.2, "t1": 6.68, "who": "B", "text": "Tap the beats, one, two. The red crotchet: does it start on a beat, or on the and? Pause.", "cue": {"p": 52, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T12-2-q.webp"}}, {"t0": 6.68, "t1": 9.68, "who": "pause", "text": "Pause and try.", "cue": {"p": 52, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T12-2-q.webp"}}, {"t0": 9.68, "t1": 13.35, "who": "P", "text": "On the and, held through beat two. That is syncopation.", "cue": {"p": 52, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T12-2.webp"}}]}, {"t": "Try it: The Entertainer", "f": "audio/T12/04-try-it-the-entertainer.mp3", "s": 16, "p": 52, "l": [{"t0": 0.2, "t1": 11.69, "who": "B", "text": "In Scott Joplin’s The Entertainer the high C keeps landing just after the beat: the bounce of ragtime. Tap the beat with your foot and hum the tune. Until next time.", "cue": {"p": 52, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T12-3.webp"}}, {"t0": 11.69, "t1": 16.02, "who": "piano", "notes": [11.69, 12.0, 12.31, 12.62, 13.24, 13.55, 14.17, 14.48], "cue": {"p": 52, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T12-3.webp"}}]}]}, {"k": "O3", "part": "Part III · Bars and repeats", "t": "Part opener", "pages": [54], "clips": [{"t": "Part Three: Bars and repeats", "f": "audio/O3/01-part-three-bars-and-repeats.mp3", "s": 32, "p": 54, "l": [{"t0": 3.4, "t1": 8.84, "who": "B", "text": "Welcome to Part Three, Clara: Bars and repeats. The map of the music.", "cue": {"p": 54, "r": "opener"}}, {"t0": 8.84, "t1": 18.71, "who": "B", "text": "Bar lines cut the music into bars. Repeat signs and road signs tell you which bar comes next, so a short page can make a long piece.", "cue": {"p": 54, "r": "opener"}}, {"t0": 18.71, "t1": 21.6, "who": "P", "text": "Like a board game: go back two squares!", "cue": {"p": 54, "r": "opener"}}, {"t0": 21.6, "t1": 30.43, "who": "B", "text": "Three chapters: bar lines, repeats, and the road signs D.C., D.S., Fine and Coda. Shall we start with the bar lines?", "cue": {"p": 54, "r": "chapters"}}, {"t0": 30.43, "t1": 32.03, "who": "P", "text": "Let’s go!", "cue": {"p": 54, "r": "chapters"}}]}]}, {"k": "B1", "part": "Part III · Bars and repeats", "t": "1 · Bar lines", "pages": [55], "clips": [{"t": "Bar lines", "f": "audio/B1/01-bar-lines.mp3", "s": 41, "p": 55, "l": [{"t0": 3.4, "t1": 12.7, "who": "B", "text": "Beats travel in groups called bars, Clara. A bar line closes each bar, and the next bar starts on beat one, the strongest beat.", "cue": {"p": 55, "r": "lead"}}, {"t0": 12.7, "t1": 19.13, "who": "B", "text": "Remember: bar lines divide the music into bars; beat one comes right after each one.", "cue": {"p": 55, "r": "remember"}}, {"t0": 19.13, "t1": 25.71, "who": "piano", "notes": [19.13, 19.75, 20.37, 20.99, 21.61, 22.23, 22.85, 23.47, 24.09], "cue": {"p": 55, "r": "picture"}}, {"t0": 25.71, "t1": 35.84, "who": "B", "text": "A double bar line marks the end of a section, or a change of time signature or tempo. A thick final bar line marks the end of the piece.", "cue": {"p": 55, "r": "table"}}, {"t0": 35.84, "t1": 38.57, "who": "P", "text": "Like a full stop at the end of a book.", "cue": {"p": 55, "r": "table"}}, {"t0": 38.57, "t1": 41.42, "who": "B", "text": "Precisely. Until next time.", "cue": {"p": 55, "r": "table"}}]}]}, {"k": "B2", "part": "Part III · Bars and repeats", "t": "2 · Repeats", "pages": [56], "clips": [{"t": "Repeats", "f": "audio/B2/01-repeats.mp3", "s": 28, "p": 56, "l": [{"t0": 3.4, "t1": 10.84, "who": "B", "text": "When music says play that again, Clara, it uses repeat signs instead of writing the same bars twice.", "cue": {"p": 56, "r": "lead"}}, {"t0": 10.84, "t1": 18.77, "who": "B", "text": "Remember: two dots facing back mean go back and play it again. With no start sign, go back to the very beginning.", "cue": {"p": 56, "r": "remember"}}, {"t0": 18.77, "t1": 27.6, "who": "B", "text": "First and second time bars: the first time, play the bar marked one. After the repeat, skip it and play the bar marked two.", "cue": {"p": 56, "r": "table"}}]}, {"t": "Example: in what order?", "f": "audio/B2/02-example-in-what-order.mp3", "s": 16, "p": 56, "l": [{"t0": 0.2, "t1": 9.45, "who": "B", "text": "Bars A and B, and B ends with a repeat sign facing back. No start sign. Then C. In what order do you play them? Pause.", "cue": {"p": 56, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/B2-1-q.webp"}}, {"t0": 9.45, "t1": 13.45, "who": "pause", "text": "Pause and try.", "cue": {"p": 56, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/B2-1-q.webp"}}, {"t0": 13.45, "t1": 15.56, "who": "P", "text": "A, B, A, B, C!", "cue": {"p": 56, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/B2-1.webp"}}]}, {"t": "Example: first and second time", "f": "audio/B2/03-example-first-and-second-time.mp3", "s": 15, "p": 56, "l": [{"t0": 0.2, "t1": 6.7, "who": "B", "text": "A, then a first-time bar B, a repeat, and a second-time bar C. Pause and follow it.", "cue": {"p": 56, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/B2-2-q.webp"}}, {"t0": 6.7, "t1": 10.7, "who": "pause", "text": "Pause and try.", "cue": {"p": 56, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/B2-2-q.webp"}}, {"t0": 10.7, "t1": 14.96, "who": "P", "text": "A, B, then A, C. The first-time bar is skipped the second time.", "cue": {"p": 56, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/B2-2.webp"}}]}, {"t": "Try it", "f": "audio/B2/04-try-it.mp3", "s": 7, "p": 56, "l": [{"t0": 0.2, "t1": 6.66, "who": "B", "text": "Play a piece you know with its repeats, pointing to each sign as you reach it. Until next time.", "cue": {"p": 56, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/B2-2-q.webp"}}]}]}, {"k": "B3", "part": "Part III · Bars and repeats", "t": "3 · Road signs", "pages": [57], "clips": [{"t": "Road signs", "f": "audio/B3/01-road-signs.mp3", "s": 43, "p": 57, "l": [{"t0": 3.4, "t1": 10.95, "who": "B", "text": "Road signs send you back to the start or to a sign, Clara, and tell you where to stop. Read them like a map.", "cue": {"p": 57, "r": "lead"}}, {"t0": 10.95, "t1": 14.85, "who": "P", "text": "Dad drives round the roundabout twice when he misses the turning.", "cue": {"p": 57, "r": "lead"}}, {"t0": 14.85, "t1": 20.79, "who": "B", "text": "Remember: follow the map. Jump back at the sign, stop at Fine, or jump to the Coda.", "cue": {"p": 57, "r": "remember"}}, {"t0": 20.79, "t1": 36.3, "who": "B", "text": "D.C., da capo, means from the head: back to the very beginning. D.S., dal segno, means from the sign. Fine means the end. And at To Coda, jump to the coda sign and play the ending.", "cue": {"p": 57, "r": "table"}}, {"t0": 36.3, "t1": 43.23, "who": "B", "text": "One trap: on the way back after a D.C., skip the repeats, unless the music says otherwise.", "cue": {"p": 57, "r": "trap"}}]}, {"t": "Example: D.C. al Fine", "f": "audio/B3/02-example-d-c-al-fine.mp3", "s": 15, "p": 57, "l": [{"t0": 0.2, "t1": 6.77, "who": "B", "text": "Bars A, B with Fine, C, and D with D.C. al Fine. Pause and follow the map.", "cue": {"p": 57, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/B3-1-q.webp"}}, {"t0": 6.77, "t1": 10.77, "who": "pause", "text": "Pause and try.", "cue": {"p": 57, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/B3-1-q.webp"}}, {"t0": 10.77, "t1": 14.99, "who": "P", "text": "A B C D, then back to the start: A B, and stop at Fine.", "cue": {"p": 57, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/B3-1.webp"}}]}, {"t": "Example: D.S. al Coda", "f": "audio/B3/03-example-d-s-al-coda.mp3", "s": 17, "p": 57, "l": [{"t0": 0.2, "t1": 7.32, "who": "B", "text": "A, then B with the sign, C with To Coda, D with D.S. al Coda, and the coda E. Pause and follow.", "cue": {"p": 57, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/B3-2-q.webp"}}, {"t0": 7.32, "t1": 12.32, "who": "pause", "text": "Pause and try.", "cue": {"p": 57, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/B3-2-q.webp"}}, {"t0": 12.32, "t1": 16.95, "who": "P", "text": "A B C D, back to the sign: B C, then jump to the coda: E.", "cue": {"p": 57, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/B3-2.webp"}}]}, {"t": "Game: how many bars?", "f": "audio/B3/04-game-how-many-bars.mp3", "s": 25, "p": 57, "l": [{"t0": 0.2, "t1": 12.1, "who": "B", "text": "Each letter is one bar. Count every bar you play. First: repeat A B. Second: A, repeat B C, then D. Third: A, B with Fine, C, D.C. Pause and count.", "cue": {"p": 57, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/B3-3.webp"}}, {"t0": 12.1, "t1": 18.1, "who": "pause", "text": "Pause and try.", "cue": {"p": 57, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/B3-3.webp"}}, {"t0": 18.1, "t1": 20.19, "who": "P", "text": "Four, six and five!", "cue": {"p": 57, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/B3-3.webp"}}, {"t0": 20.19, "t1": 24.68, "who": "B", "text": "Splendid. That is the end of Part Three. Until next time.", "cue": {"p": 57, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/B3-3.webp"}}]}]}, {"k": "O4", "part": "Part IV · Expression", "t": "Part opener", "pages": [58], "clips": [{"t": "Part Four: Expression", "f": "audio/O4/01-part-four-expression.mp3", "s": 51, "p": 58, "l": [{"t0": 3.4, "t1": 8.11, "who": "B", "text": "Welcome to Part Four, Clara: Expression. How it should sound.", "cue": {"p": 58, "r": "opener"}}, {"t0": 8.11, "t1": 20.05, "who": "B", "text": "The notes say what to play. Expression says how: loud or soft, smooth or short, faster or slower, ringing or dry. Listen to one little phrase told like a story.", "cue": {"p": 58, "r": "opener"}}, {"t0": 20.05, "t1": 30.46, "who": "piano", "notes": [20.05, 20.67, 21.29, 21.91, 22.78, 23.4, 24.02, 24.64, 25.51, 25.67, 25.82, 25.98, 26.13, 27.06, 27.68], "cue": {"p": 58, "r": "opener"}}, {"t0": 30.46, "t1": 33.25, "who": "P", "text": "It sounded like a whole little story!", "cue": {"p": 58, "r": "opener"}}, {"t0": 33.25, "t1": 48.92, "who": "B", "text": "Ten chapters: loud and soft, crescendo and accents, touch, slurs and phrases, speed words, slowing down and speeding up, mood words, the pedals, ornaments, and grace notes. Shall we start with loud and soft?", "cue": {"p": 58, "r": "chapters"}}, {"t0": 48.92, "t1": 50.64, "who": "P", "text": "Yes, please!", "cue": {"p": 58, "r": "chapters"}}]}]}, {"k": "E1", "part": "Part IV · Expression", "t": "1 · Loud and soft", "pages": [59], "clips": [{"t": "Loud and soft", "f": "audio/E1/01-loud-and-soft.mp3", "s": 57, "p": 59, "l": [{"t0": 3.4, "t1": 12.1, "who": "B", "text": "A voice can whisper, chat or shout, Clara. Music does the same, and small Italian words tell you which: the dynamics.", "cue": {"p": 59, "r": "lead"}}, {"t0": 12.1, "t1": 18.3, "who": "B", "text": "This is pianissimo. Very soft, like a mouse in slippers.", "cue": {"p": 59, "r": "lead"}}, {"t0": 18.3, "t1": 20.46, "who": "piano", "notes": [18.3, 18.92, 19.54], "cue": {"p": 59, "r": "lead"}}, {"t0": 20.46, "t1": 35.0, "who": "B", "text": "Remember: six steps, from a whisper to a shout. Pianissimo, piano, mezzo-piano, mezzo-forte, forte, fortissimo. Mezzo means half.", "cue": {"p": 59, "r": "remember"}}, {"t0": 35.0, "t1": 42.74, "who": "piano", "notes": [35.0, 36.24, 37.48, 38.72, 39.96, 41.2], "cue": {"p": 59, "r": "picture"}}, {"t0": 42.74, "t1": 49.79, "who": "B", "text": "The rule: a sign lasts until the next one. Piano stays soft until a new sign arrives.", "cue": {"p": 59, "r": "rule"}}, {"t0": 49.79, "t1": 56.73, "who": "B", "text": "One trap: playing everything mezzo-forte. Each sign is a different step.", "cue": {"p": 59, "r": "trap"}}]}, {"t": "Example: mp or mf?", "f": "audio/E1/02-example-mp-or-mf.mp3", "s": 22, "p": 59, "l": [{"t0": 0.2, "t1": 9.29, "who": "B", "text": "Which is louder: mezzo-piano or mezzo-forte? Mezzo means half. Pause.", "cue": {"p": 59, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E1-1-q.webp"}}, {"t0": 9.29, "t1": 12.29, "who": "pause", "text": "Pause and try.", "cue": {"p": 59, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E1-1-q.webp"}}, {"t0": 12.29, "t1": 19.33, "who": "P", "text": "Mezzo-forte, half loud, is louder than mezzo-piano, half soft.", "cue": {"p": 59, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E1-1.webp"}}, {"t0": 19.33, "t1": 22.11, "who": "piano", "notes": [19.33, 20.57], "cue": {"p": 59, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E1-1.webp"}}]}, {"t": "Try it: the Surprise", "f": "audio/E1/03-try-it-the-surprise.mp3", "s": 40, "p": 59, "l": [{"t0": 0.2, "t1": 10.42, "who": "B", "text": "Play Middle C six ways, from pianissimo to fortissimo, using the weight of your arm, then come back down.", "cue": {"p": 59, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E1-2.webp"}}, {"t0": 10.42, "t1": 24.27, "who": "B", "text": "Haydn knew all about this. In his Surprise Symphony the tune tiptoes along softly, comes again even softer, and then the whole orchestra crashes in with one fortissimo chord.", "cue": {"p": 59, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E1-3.webp"}}, {"t0": 24.27, "t1": 35.57, "who": "piano", "notes": [24.27, 24.89, 25.51, 26.13, 26.75, 27.37, 27.99, 29.48, 30.1, 30.72, 31.34, 31.96, 32.58, 33.2, 33.82], "cue": {"p": 59, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E1-3.webp"}}, {"t0": 35.57, "t1": 37.12, "who": "P", "text": "I jumped!", "cue": {"p": 59, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E1-3.webp"}}, {"t0": 37.12, "t1": 40.47, "who": "B", "text": "So did the audience. Until next time.", "cue": {"p": 59, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E1-3.webp"}}]}]}, {"k": "E2", "part": "Part IV · Expression", "t": "2 · Crescendo and accents", "pages": [60], "clips": [{"t": "Crescendo and accents", "f": "audio/E2/01-crescendo-and-accents.mp3", "s": 51, "p": 60, "l": [{"t0": 3.4, "t1": 12.29, "who": "B", "text": "Music rarely stays at one level, Clara. It can grow louder or fade little by little, or make a single note suddenly strong.", "cue": {"p": 60, "r": "lead"}}, {"t0": 12.29, "t1": 17.81, "who": "B", "text": "Remember: a hairpin that opens grows louder; one that closes fades.", "cue": {"p": 60, "r": "remember"}}, {"t0": 17.81, "t1": 24.31, "who": "piano", "notes": [17.81, 18.43, 19.05, 19.67, 20.29, 20.91, 21.53, 22.15, 22.77], "cue": {"p": 60, "r": "picture"}}, {"t0": 24.31, "t1": 44.41, "who": "B", "text": "In words: crescendo, getting louder, and diminuendo, getting softer. Sforzando: one note made suddenly strong. Forte-piano: loud, then soft at once. And subito piano: suddenly soft.", "cue": {"p": 60, "r": "table"}}, {"t0": 44.41, "t1": 51.0, "who": "B", "text": "One trap: do not speed up in a crescendo. Louder is not faster.", "cue": {"p": 60, "r": "trap"}}]}, {"t": "Example: sfz or fp?", "f": "audio/E2/02-example-sfz-or-fp.mp3", "s": 24, "p": 60, "l": [{"t0": 0.2, "t1": 10.33, "who": "B", "text": "Tune A has sforzando under one note; tune B has forte-piano. What is the difference? Pause.", "cue": {"p": 60, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E2-1-q.webp"}}, {"t0": 10.33, "t1": 14.33, "who": "pause", "text": "Pause and try.", "cue": {"p": 60, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E2-1-q.webp"}}, {"t0": 14.33, "t1": 24.06, "who": "P", "text": "Sforzando is one strong note, then back to the music around it. Forte-piano is loud for an instant, then soft at once.", "cue": {"p": 60, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E2-1.webp"}}]}, {"t": "Example: across the hairpins", "f": "audio/E2/03-example-across-the-hairpins.mp3", "s": 21, "p": 60, "l": [{"t0": 0.2, "t1": 7.56, "who": "B", "text": "The music starts piano. One hairpin opens to forte, then another closes. What happens? Pause.", "cue": {"p": 60, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E2-2-q.webp"}}, {"t0": 7.56, "t1": 11.56, "who": "pause", "text": "Pause and try.", "cue": {"p": 60, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E2-2-q.webp"}}, {"t0": 11.56, "t1": 15.92, "who": "P", "text": "Start soft, grow through bar one to forte, then fade through bar two.", "cue": {"p": 60, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E2-2.webp"}}, {"t0": 15.92, "t1": 21.43, "who": "piano", "notes": [15.92, 16.54, 17.16, 17.78, 18.65, 19.27, 19.89], "cue": {"p": 60, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E2-2.webp"}}]}, {"t": "Example: the loudest note", "f": "audio/E2/04-example-the-loudest-note.mp3", "s": 17, "p": 60, "l": [{"t0": 0.2, "t1": 8.01, "who": "B", "text": "Start mezzo-piano and follow the hairpin to its sign. Where is the loudest note? Pause.", "cue": {"p": 60, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E2-3-q.webp"}}, {"t0": 8.01, "t1": 12.01, "who": "pause", "text": "Pause and try.", "cue": {"p": 60, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E2-3-q.webp"}}, {"t0": 12.01, "t1": 16.55, "who": "P", "text": "The first A in bar two, at forte. From there the tune fades to piano.", "cue": {"p": 60, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E2-3.webp"}}]}, {"t": "Try it", "f": "audio/E2/05-try-it.mp3", "s": 16, "p": 60, "l": [{"t0": 0.2, "t1": 9.3, "who": "B", "text": "Play five notes up, C to G, growing one step on each. Then come back down, fading, without slowing down. Until next time.", "cue": {"p": 60, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/E2-4.webp"}}, {"t0": 9.3, "t1": 15.8, "who": "piano", "notes": [9.3, 9.92, 10.54, 11.16, 11.78, 12.4, 13.02, 13.64, 14.26], "cue": {"p": 60, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/E2-4.webp"}}]}]}, {"k": "E3", "part": "Part IV · Expression", "t": "3 · Touch: smooth, short, strong", "pages": [61], "clips": [{"t": "Touch: smooth, short, strong", "f": "audio/E3/01-touch-smooth-short-strong.mp3", "s": 46, "p": 61, "l": [{"t0": 3.4, "t1": 13.72, "who": "B", "text": "The same four notes can sound smooth or bouncy, gentle or strong, Clara. Small marks tell your fingers how to touch the keys: articulation.", "cue": {"p": 61, "r": "lead"}}, {"t0": 13.72, "t1": 18.67, "who": "B", "text": "Remember: curve, join. Dot, short. Line, hold. Arrow, strong.", "cue": {"p": 61, "r": "remember"}}, {"t0": 18.67, "t1": 29.64, "who": "piano", "notes": [18.67, 19.29, 19.91, 20.53, 21.4, 22.02, 22.64, 23.26, 24.13, 24.75, 25.37, 25.99, 26.86, 27.48, 28.1, 28.72], "cue": {"p": 61, "r": "picture"}}, {"t0": 29.64, "t1": 40.78, "who": "B", "text": "Dots: short and detached, like popcorn popping. A line, tenuto: hold the full length, leaning a little. An accent: a stronger start to the note.", "cue": {"p": 61, "r": "table"}}, {"t0": 40.78, "t1": 45.75, "who": "B", "text": "One trap: staccato is short, not loud.", "cue": {"p": 61, "r": "trap"}}]}, {"t": "Example: line, dot or arrow?", "f": "audio/E3/02-example-line-dot-or-arrow.mp3", "s": 16, "p": 61, "l": [{"t0": 0.2, "t1": 8.07, "who": "B", "text": "The first two Cs have lines, the Gs have dots, and the E in bar two has an arrow. How do you play each? Pause.", "cue": {"p": 61, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E3-1-q.webp"}}, {"t0": 8.07, "t1": 12.07, "who": "pause", "text": "Pause and try.", "cue": {"p": 61, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E3-1-q.webp"}}, {"t0": 12.07, "t1": 15.99, "who": "P", "text": "The Cs held their full length, the Gs short, and the E strong.", "cue": {"p": 61, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E3-1.webp"}}]}, {"t": "Try it", "f": "audio/E3/03-try-it.mp3", "s": 12, "p": 61, "l": [{"t0": 0.2, "t1": 12.01, "who": "B", "text": "Play one bar of a piece three ways: all legato, all staccato, then as written. Can someone else hear which was which? Until next time.", "cue": {"p": 61, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E3-2.webp"}}]}]}, {"k": "E4", "part": "Part IV · Expression", "t": "4 · Slurs and phrases", "pages": [62, 63], "clips": [{"t": "Slurs and phrases", "f": "audio/E4/01-slurs-and-phrases.mp3", "s": 32, "p": 62, "l": [{"t0": 3.4, "t1": 15.64, "who": "B", "text": "A curve over different notes is a slur, Clara: join them, then lift at its end, like a breath. A long slur over a whole line of tune is a phrase: one musical sentence.", "cue": {"p": 62, "r": "lead"}}, {"t0": 15.64, "t1": 20.31, "who": "B", "text": "Remember: join everything under the curve; lift where it ends.", "cue": {"p": 62, "r": "remember"}}, {"t0": 20.31, "t1": 25.82, "who": "piano", "notes": [20.31, 20.93, 21.55, 22.17, 23.04, 23.66, 24.28], "cue": {"p": 62, "r": "picture"}}, {"t0": 25.82, "t1": 32.38, "who": "B", "text": "A curve joining the same note twice is a tie, not a slur: hold it, do not play it again.", "cue": {"p": 63, "r": "h:Two-note slurs"}}]}, {"t": "Two-note slurs", "f": "audio/E4/02-two-note-slurs.mp3", "s": 21, "p": 63, "l": [{"t0": 0.2, "t1": 9.99, "who": "B", "text": "A slur over just two notes is a little sigh: drop into the first note, then lift off the second, lighter and a little shorter. Drop, lift.", "cue": {"p": 63, "r": "h:Two-note slurs"}}, {"t0": 9.99, "t1": 14.01, "who": "piano", "notes": [9.99, 10.61, 11.23, 11.85, 12.47, 13.09], "cue": {"p": 63, "r": "h:Two-note slurs"}}, {"t0": 14.01, "t1": 20.85, "who": "B", "text": "One trap: never lift in the middle of a slur. Keep every note joined until the curve ends.", "cue": {"p": 63, "r": "trap"}}]}, {"t": "Example: which notes are short?", "f": "audio/E4/03-example-which-notes-are-short.mp3", "s": 17, "p": 62, "l": [{"t0": 0.2, "t1": 6.72, "who": "B", "text": "Bar one is under a curve. Bar two has dots, and the last G has a different mark. Pause.", "cue": {"p": 62, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E4-1-q.webp"}}, {"t0": 6.72, "t1": 10.72, "who": "pause", "text": "Pause and try.", "cue": {"p": 62, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E4-1-q.webp"}}, {"t0": 10.72, "t1": 16.93, "who": "P", "text": "Bar one is joined; the two dotted Gs are short; and the last G is accented: stronger, but full length.", "cue": {"p": 62, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E4-1.webp"}}]}, {"t": "Try it: Ode to Joy", "f": "audio/E4/04-try-it-ode-to-joy.mp3", "s": 20, "p": 62, "l": [{"t0": 0.2, "t1": 9.41, "who": "B", "text": "Ode to Joy has two long slurs: two musical sentences. Sing it, and breathe only where the slurs end. Until next time.", "cue": {"p": 62, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E4-2.webp"}}, {"t0": 9.41, "t1": 19.63, "who": "piano", "notes": [9.41, 10.03, 10.65, 11.27, 11.89, 12.51, 13.13, 13.75, 14.37, 14.99, 15.61, 16.23, 16.85, 17.78, 18.09], "cue": {"p": 62, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E4-2.webp"}}]}]}, {"k": "E5", "part": "Part IV · Expression", "t": "5 · Speed words", "pages": [64], "clips": [{"t": "Speed words", "f": "audio/E5/01-speed-words.mp3", "s": 47, "p": 64, "l": [{"t0": 3.4, "t1": 11.65, "who": "B", "text": "How fast is the beat, Clara? A word at the top of the music tells you, usually in Italian, and often a number too.", "cue": {"p": 64, "r": "lead"}}, {"t0": 11.65, "t1": 17.04, "who": "B", "text": "Presto: very fast, like a squirrel who has had too much coffee.", "cue": {"p": 64, "r": "lead"}}, {"t0": 17.04, "t1": 21.99, "who": "B", "text": "Remember: the word sets the character; the number pins down the speed.", "cue": {"p": 64, "r": "remember"}}, {"t0": 21.99, "t1": 38.05, "who": "B", "text": "From slow to fast: Largo, Lento, Adagio, Andante at a walking pace, Moderato, Allegretto, Allegro, Vivace, and Presto.", "cue": {"p": 64, "r": "table"}}, {"t0": 38.05, "t1": 42.17, "who": "P", "text": "Andante is my favourite. I can walk to it.", "cue": {"p": 64, "r": "picture"}}, {"t0": 42.17, "t1": 47.24, "who": "B", "text": "The numbers are a rough guide. The music and the room decide the rest.", "cue": {"p": 64, "r": "table"}}]}, {"t": "Example: crotchet equals sixty", "f": "audio/E5/02-example-crotchet-equals-sixty.mp3", "s": 12, "p": 64, "l": [{"t0": 0.2, "t1": 6.3, "who": "B", "text": "Crotchet equals sixty. Sixty beats in a minute. How long is one beat? Pause.", "cue": {"p": 64, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E5-2-q.webp"}}, {"t0": 6.3, "t1": 9.3, "who": "pause", "text": "Pause and try.", "cue": {"p": 64, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E5-2-q.webp"}}, {"t0": 9.3, "t1": 12.11, "who": "P", "text": "One second. Tick, tick, like a clock.", "cue": {"p": 64, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E5-2.webp"}}]}, {"t": "Try it", "f": "audio/E5/03-try-it.mp3", "s": 13, "p": 64, "l": [{"t0": 0.2, "t1": 12.59, "who": "B", "text": "Set a metronome to seventy-six, Andante, and walk round the room on the clicks. Then try one hundred and twenty, Allegro. Until next time.", "cue": {"p": 64, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E5-1.webp"}}]}]}, {"k": "E6", "part": "Part IV · Expression", "t": "6 · Slowing down and speeding up", "pages": [65, 66], "clips": [{"t": "Slowing down and speeding up", "f": "audio/E6/01-slowing-down-and-speeding-up.mp3", "s": 49, "p": 65, "l": [{"t0": 3.4, "t1": 11.22, "who": "B", "text": "Words inside the music ask you to slow down, speed up, or wait, Clara, and then to come back to the first speed.", "cue": {"p": 65, "r": "lead"}}, {"t0": 11.22, "t1": 18.32, "who": "B", "text": "Remember: rit. brakes gently; a tempo drives off again at the first speed.", "cue": {"p": 65, "r": "remember"}}, {"t0": 18.32, "t1": 36.48, "who": "B", "text": "Ritardando and rallentando: gradually slower. Accelerando: gradually faster. A tempo: back to the speed before. And a fermata: hold longer than written, then go on.", "cue": {"p": 65, "r": "table"}}, {"t0": 36.48, "t1": 49.24, "who": "B", "text": "Little words help: poco a poco, little by little; molto, very; più mosso, faster; meno mosso, slower.", "cue": {"p": 66, "r": "more"}}]}, {"t": "Example: where does it slow down?", "f": "audio/E6/02-example-where-does-it-slow-down.mp3", "s": 20, "p": 65, "l": [{"t0": 0.2, "t1": 8.32, "who": "B", "text": "Find rall., and then a tempo. Which notes slow down, and when does the speed come back? Pause.", "cue": {"p": 65, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E6-1-q.webp"}}, {"t0": 8.32, "t1": 12.32, "who": "pause", "text": "Pause and try.", "cue": {"p": 65, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E6-1-q.webp"}}, {"t0": 12.32, "t1": 20.04, "who": "P", "text": "Bar one slows into the two Gs; at a tempo, in bar three, the first speed comes straight back.", "cue": {"p": 65, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E6-1.webp"}}]}, {"t": "Example: the fermata", "f": "audio/E6/03-example-the-fermata.mp3", "s": 14, "p": 65, "l": [{"t0": 0.2, "t1": 6.34, "who": "B", "text": "A minim with a fermata. How long do you hold it? Pause.", "cue": {"p": 65, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E6-2-q.webp"}}, {"t0": 6.34, "t1": 9.34, "who": "pause", "text": "Pause and try.", "cue": {"p": 65, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E6-2-q.webp"}}, {"t0": 9.34, "t1": 14.46, "who": "P", "text": "Longer than two beats: until it feels finished, often half as long again, then go on.", "cue": {"p": 65, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E6-2.webp"}}]}, {"t": "Try it: Twinkle", "f": "audio/E6/04-try-it-twinkle.mp3", "s": 24, "p": 65, "l": [{"t0": 0.2, "t1": 11.36, "who": "B", "text": "Sing the last line of Twinkle twice: once in time, once slowing into the last note, with a fermata on the final C. Until next time.", "cue": {"p": 65, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E6-3.webp"}}, {"t0": 11.36, "t1": 24.19, "who": "piano", "notes": [11.36, 11.98, 12.6, 13.22, 13.84, 14.46, 15.08, 16.57, 17.19, 17.81, 18.56, 19.36, 20.29, 21.41], "cue": {"p": 65, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E6-3.webp"}}]}]}, {"k": "E7", "part": "Part IV · Expression", "t": "7 · Mood words", "pages": [67], "clips": [{"t": "Mood words", "f": "audio/E7/01-mood-words.mp3", "s": 43, "p": 67, "l": [{"t0": 3.4, "t1": 8.9, "who": "B", "text": "Some words describe the mood, Clara, not the speed: how the music should feel.", "cue": {"p": 67, "r": "lead"}}, {"t0": 8.9, "t1": 13.89, "who": "B", "text": "Remember: speed words say how fast; mood words say how it feels.", "cue": {"p": 67, "r": "remember"}}, {"t0": 13.89, "t1": 36.32, "who": "B", "text": "Dolce, sweetly. Cantabile, in a singing style. Legato, smoothly. Maestoso, majestically. Leggiero, lightly. Espressivo, with feeling. Grazioso, gracefully. Con moto, with movement.", "cue": {"p": 67, "r": "table"}}, {"t0": 36.32, "t1": 42.98, "who": "B", "text": "One trap: legato is not a speed. It means smoothly, at any speed.", "cue": {"p": 67, "r": "trap"}}]}, {"t": "Try it: three moods", "f": "audio/E7/02-try-it-three-moods.mp3", "s": 28, "p": 67, "l": [{"t0": 0.2, "t1": 4.7, "who": "B", "text": "Here is one little tune, played dolce.", "cue": {"p": 67, "r": "table"}}, {"t0": 4.7, "t1": 8.72, "who": "piano", "notes": [4.7, 5.32, 5.94, 6.56, 7.18], "cue": {"p": 67, "r": "table"}}, {"t0": 8.72, "t1": 11.86, "who": "B", "text": "And now maestoso.", "cue": {"p": 67, "r": "table"}}, {"t0": 11.86, "t1": 15.88, "who": "piano", "notes": [11.86, 12.48, 13.1, 13.72, 14.34], "cue": {"p": 67, "r": "table"}}, {"t0": 15.88, "t1": 27.75, "who": "B", "text": "Play a tune of your own three ways: dolce, maestoso and cantabile. Can someone guess which is which? Until next time.", "cue": {"p": 67, "r": "table"}}]}]}, {"k": "E8", "part": "Part IV · Expression", "t": "8 · The pedals", "pages": [68, 69], "clips": [{"t": "The pedals", "f": "audio/E8/01-the-pedals.mp3", "s": 41, "p": 68, "l": [{"t0": 3.4, "t1": 14.47, "who": "B", "text": "Most pianos have three pedals, Clara. The right one, the sustain pedal, lifts every damper off the strings, so the notes keep ringing after your fingers let go.", "cue": {"p": 68, "r": "lead"}}, {"t0": 14.47, "t1": 19.45, "who": "piano", "notes": [14.47, 15.09, 15.71, 16.33, 16.95, 17.57], "cue": {"p": 68, "r": "lead"}}, {"t0": 19.45, "t1": 23.97, "who": "P", "text": "The sound keeps going after my hands stop. Like a ghost clapping back.", "cue": {"p": 68, "r": "lead"}}, {"t0": 23.97, "t1": 29.32, "who": "B", "text": "Remember: play first, then change the pedal. Up, and straight down again.", "cue": {"p": 68, "r": "remember"}}, {"t0": 29.32, "t1": 41.13, "who": "B", "text": "The left pedal, una corda, makes the sound softer and gentler; lift it at tre corde. The middle pedal, on grand pianos, comes later.", "cue": {"p": 68, "r": "table"}}]}, {"t": "Writing and changing the pedal", "f": "audio/E8/02-writing-and-changing-the-pedal.mp3", "s": 23, "p": 68, "l": [{"t0": 0.2, "t1": 8.64, "who": "B", "text": "The sustain pedal is written Ped. for down and a star for up, or as a line with hooks. Six ways are shown on the page.", "cue": {"p": 68, "r": "h:Writing the sustain pedal"}}, {"t0": 8.64, "t1": 16.75, "who": "B", "text": "Heel on the floor, press with the ball of your foot. Play each new chord first, then change straight away: up and down.", "cue": {"p": 68, "r": "rule"}}, {"t0": 16.75, "t1": 23.21, "who": "piano", "notes": [16.75, 17.37, 18.82, 19.44, 20.89, 21.51, 22.96, 23.58, 25.03], "cue": {"p": 68, "r": "rule"}}]}, {"t": "Example: which pedal?", "f": "audio/E8/03-example-which-pedal.mp3", "s": 15, "p": 68, "l": [{"t0": 0.2, "t1": 5.32, "who": "B", "text": "Ped., u.c. and t.c. Which foot pedal does each one mean? Pause.", "cue": {"p": 68, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E8-1-q.webp"}}, {"t0": 5.32, "t1": 9.32, "who": "pause", "text": "Pause and try.", "cue": {"p": 68, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E8-1-q.webp"}}, {"t0": 9.32, "t1": 14.75, "who": "P", "text": "Ped. is the right pedal. U.c. is the left one. And t.c. means let the left pedal up.", "cue": {"p": 68, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E8-1.webp"}}]}, {"t": "Example: down and up", "f": "audio/E8/04-example-down-and-up.mp3", "s": 17, "p": 68, "l": [{"t0": 0.2, "t1": 6.1, "who": "B", "text": "Find Ped. under the first C, then a star with Ped., then the last star. Pause.", "cue": {"p": 68, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E8-2-q.webp"}}, {"t0": 6.1, "t1": 10.1, "who": "pause", "text": "Pause and try.", "cue": {"p": 68, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E8-2-q.webp"}}, {"t0": 10.1, "t1": 16.54, "who": "P", "text": "Down on the first C, changed at the F, up and straight down, and up at the end. Each bar rings as one sound.", "cue": {"p": 68, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E8-2.webp"}}]}, {"t": "Try it: hear the ringing", "f": "audio/E8/05-try-it-hear-the-ringing.mp3", "s": 18, "p": 68, "l": [{"t0": 0.2, "t1": 12.61, "who": "B", "text": "Play C, E and G together, press the right pedal, and take your hands off. The chord keeps sounding. Lift the pedal: silence. That is the dampers coming back down. Until next time.", "cue": {"p": 68, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/E8-4.webp"}}, {"t0": 12.61, "t1": 17.96, "who": "piano", "notes": [12.61, 13.23, 14.68, 15.3, 15.92, 16.54], "cue": {"p": 68, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/E8-4.webp"}}]}]}, {"k": "E9", "part": "Part IV · Expression", "t": "9 · Ornaments", "pages": [70, 71, 72], "clips": [{"t": "Ornaments", "f": "audio/E9/01-ornaments.mp3", "s": 27, "p": 70, "l": [{"t0": 3.4, "t1": 11.03, "who": "B", "text": "Ornaments are decorations, Clara: a small sign that stands for a quick burst of notes around the main note.", "cue": {"p": 70, "r": "lead"}}, {"t0": 11.03, "t1": 18.99, "who": "B", "text": "They borrow the notes next door, one letter up or down. On D, the note above is E and the note below is C.", "cue": {"p": 70, "r": "lead"}}, {"t0": 18.99, "t1": 27.32, "who": "B", "text": "Remember: an ornament is a necklace on the note. It borrows the next-door notes, and the main note still lands on time.", "cue": {"p": 70, "r": "remember"}}]}, {"t": "Written and played", "f": "audio/E9/02-written-and-played.mp3", "s": 27, "p": 71, "l": [{"t0": 0.2, "t1": 4.14, "who": "B", "text": "A trill: the note and the one above, back and forth.", "cue": {"p": 71, "r": "h:Written and played"}}, {"t0": 4.14, "t1": 6.3, "who": "piano", "notes": [4.14, 4.3, 4.45, 4.61, 4.76, 4.92, 5.07, 5.23, 5.38], "cue": {"p": 71, "r": "h:Written and played"}}, {"t0": 6.3, "t1": 10.29, "who": "B", "text": "An upper mordent: note, above, note. One flick.", "cue": {"p": 71, "r": "h:Written and played"}}, {"t0": 10.29, "t1": 11.83, "who": "piano", "notes": [10.29, 10.44, 10.6], "cue": {"p": 71, "r": "h:Written and played"}}, {"t0": 11.83, "t1": 14.94, "who": "B", "text": "A lower mordent: note, below, note.", "cue": {"p": 71, "r": "h:Written and played"}}, {"t0": 14.94, "t1": 16.48, "who": "piano", "notes": [14.94, 15.09, 15.25], "cue": {"p": 71, "r": "h:Written and played"}}, {"t0": 16.48, "t1": 19.48, "who": "B", "text": "A turn: above, note, below, note.", "cue": {"p": 71, "r": "h:Written and played"}}, {"t0": 19.48, "t1": 21.02, "who": "piano", "notes": [19.48, 19.64, 19.79, 19.95], "cue": {"p": 71, "r": "h:Written and played"}}, {"t0": 21.02, "t1": 26.69, "who": "B", "text": "One trap: a trill, mordent or turn begins on the beat, never before it.", "cue": {"p": 72, "r": "trap"}}]}, {"t": "Example: a lower mordent on G", "f": "audio/E9/03-example-a-lower-mordent-on-g.mp3", "s": 13, "p": 70, "l": [{"t0": 0.2, "t1": 5.46, "who": "B", "text": "A lower mordent on G. Which next-door note does it borrow? Pause.", "cue": {"p": 70, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E9-1-q.webp"}}, {"t0": 5.46, "t1": 8.46, "who": "pause", "text": "Pause and try.", "cue": {"p": 70, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E9-1-q.webp"}}, {"t0": 8.46, "t1": 11.94, "who": "P", "text": "F, the note below: G, F, G, one quick flick.", "cue": {"p": 70, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E9-1.webp"}}, {"t0": 11.94, "t1": 13.48, "who": "piano", "notes": [11.94, 12.09, 12.25], "cue": {"p": 70, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E9-1.webp"}}]}, {"t": "Example: a trill on E", "f": "audio/E9/04-example-a-trill-on-e.mp3", "s": 17, "p": 70, "l": [{"t0": 0.2, "t1": 6.64, "who": "B", "text": "A trill on an E lasting two beats. Which note does it borrow, and for how long? Pause.", "cue": {"p": 70, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E9-2-q.webp"}}, {"t0": 6.64, "t1": 10.64, "who": "pause", "text": "Pause and try.", "cue": {"p": 70, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E9-2-q.webp"}}, {"t0": 10.64, "t1": 14.45, "who": "P", "text": "F, the note above: E, F, E, F, quickly for two beats.", "cue": {"p": 70, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E9-2.webp"}}, {"t0": 14.45, "t1": 16.61, "who": "piano", "notes": [14.45, 14.61, 14.76, 14.92, 15.07, 15.23, 15.38, 15.54, 15.69], "cue": {"p": 70, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E9-2.webp"}}]}, {"t": "Try it: Minuet in G", "f": "audio/E9/05-try-it-minuet-in-g.mp3", "s": 17, "p": 70, "l": [{"t0": 0.2, "t1": 12.53, "who": "B", "text": "In the Minuet in G the first D has a mordent: D, E, D, one quick flick, then the music walks on. Play the first bar with it, then without. Hear the sparkle? Until next time.", "cue": {"p": 70, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/E9-4.webp"}}, {"t0": 12.53, "t1": 16.8, "who": "piano", "notes": [12.53, 12.68, 12.84, 13.15, 13.46, 13.77, 14.08, 14.64, 15.26, 15.57, 15.88, 16.19], "cue": {"p": 70, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/E9-4.webp"}}]}]}, {"k": "E10", "part": "Part IV · Expression", "t": "10 · Grace notes", "pages": [73], "clips": [{"t": "Grace notes", "f": "audio/E10/01-grace-notes.mp3", "s": 47, "p": 73, "l": [{"t0": 3.4, "t1": 12.18, "who": "B", "text": "Some notes come with a tiny note just before them, Clara. It borrows a moment from the main note, and a slash tells you how much.", "cue": {"p": 73, "r": "lead"}}, {"t0": 12.18, "t1": 19.43, "who": "B", "text": "Remember: slash, crushed in, as fast as you can. No slash, it leans, taking about half the time.", "cue": {"p": 73, "r": "remember"}}, {"t0": 19.43, "t1": 26.11, "who": "B", "text": "With a slash it is an acciaccatura: crushed in, just before the beat.", "cue": {"p": 73, "r": "picture"}}, {"t0": 26.11, "t1": 27.73, "who": "piano", "notes": [26.11, 26.19], "cue": {"p": 73, "r": "picture"}}, {"t0": 27.73, "t1": 34.89, "who": "B", "text": "Without a slash it is an appoggiatura: it falls on the beat and leans.", "cue": {"p": 73, "r": "picture"}}, {"t0": 34.89, "t1": 36.43, "who": "piano", "notes": [34.89, 35.51], "cue": {"p": 73, "r": "picture"}}, {"t0": 36.43, "t1": 47.34, "who": "B", "text": "One trap: an acciaccatura is never slow. It is crushed in, almost at once. And that is the end of Part Four. Until next time.", "cue": {"p": 73, "r": "trap"}}]}]}, {"k": "O5", "part": "Part V · Scales and keys", "t": "Part opener", "pages": [74], "clips": [{"t": "Part Five: Scales and keys", "f": "audio/O5/01-part-five-scales-and-keys.mp3", "s": 48, "p": 74, "l": [{"t0": 3.4, "t1": 8.86, "who": "B", "text": "Welcome to Part Five, Clara: Scales and keys. Notes in families.", "cue": {"p": 74, "r": "opener"}}, {"t0": 8.86, "t1": 21.78, "who": "B", "text": "Notes travel in families, like ducklings behind their mother. We build the scales that pieces are made from, then learn to read the key a piece lives in. Here is G major, with its one sharp.", "cue": {"p": 74, "r": "opener"}}, {"t0": 21.78, "t1": 32.25, "who": "piano", "notes": [21.78, 22.4, 23.02, 23.64, 24.26, 24.88, 25.5, 26.12, 26.99, 27.61, 28.23, 28.85, 29.47, 30.09, 30.71], "cue": {"p": 74, "r": "opener"}}, {"t0": 32.25, "t1": 34.68, "who": "P", "text": "Up the stairs and down again!", "cue": {"p": 74, "r": "opener"}}, {"t0": 34.68, "t1": 46.09, "who": "B", "text": "Six chapters: major scales, minor scales, key signatures, the relative minor, finding the key, and the circle of fifths. Shall we begin with the major scale?", "cue": {"p": 74, "r": "chapters"}}, {"t0": 46.09, "t1": 47.68, "who": "P", "text": "Let’s go!", "cue": {"p": 74, "r": "chapters"}}]}]}, {"k": "S1", "part": "Part V · Scales and keys", "t": "1 · Major scales", "pages": [75], "clips": [{"t": "Major scales", "f": "audio/S1/01-major-scales.mp3", "s": 53, "p": 75, "l": [{"t0": 3.4, "t1": 11.31, "who": "B", "text": "A scale climbs from a home note, the key note, to the next note with the same name, using every letter once, Clara.", "cue": {"p": 75, "r": "lead"}}, {"t0": 11.31, "t1": 16.57, "who": "piano", "notes": [11.31, 11.93, 12.55, 13.17, 13.79, 14.41, 15.03, 15.65], "cue": {"p": 75, "r": "lead"}}, {"t0": 16.57, "t1": 19.34, "who": "P", "text": "It sounds like a secret knock on a door.", "cue": {"p": 75, "r": "lead"}}, {"t0": 19.34, "t1": 27.74, "who": "B", "text": "And every major scale takes the same steps. Remember: tone, tone, semitone, tone, tone, tone, semitone.", "cue": {"p": 75, "r": "remember"}}, {"t0": 27.74, "t1": 37.16, "who": "B", "text": "The two short steps come between notes three and four, and seven and eight. A tone has one key between; a semitone has nothing between.", "cue": {"p": 75, "r": "picture"}}, {"t0": 37.16, "t1": 47.61, "who": "B", "text": "Start on G and you need one sharp, F sharp, to keep the steps right. D major needs two, A major three. F major needs one flat, B flat.", "cue": {"p": 75, "r": "table"}}, {"t0": 47.61, "t1": 52.87, "who": "piano", "notes": [47.61, 48.23, 48.85, 49.47, 50.09, 50.71, 51.33, 51.95], "cue": {"p": 75, "r": "table"}}]}, {"t": "Example: where are the short steps?", "f": "audio/S1/02-example-where-are-the-short-steps.mp3", "s": 16, "p": 75, "l": [{"t0": 0.2, "t1": 7.26, "who": "B", "text": "Play C up to C, numbering the notes one to eight. Which pairs have no black key between them? Pause.", "cue": {"p": 75, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S1-1-q.webp"}}, {"t0": 7.26, "t1": 11.26, "who": "pause", "text": "Pause and try.", "cue": {"p": 75, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S1-1-q.webp"}}, {"t0": 11.26, "t1": 16.2, "who": "P", "text": "Only three and four, E and F, and seven and eight, B and C. The two short steps.", "cue": {"p": 75, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S1-1.webp"}}]}, {"t": "Example: build G major", "f": "audio/S1/03-example-build-g-major.mp3", "s": 24, "p": 75, "l": [{"t0": 0.2, "t1": 10.67, "who": "B", "text": "Write G to G. Seven to eight must be a semitone, and E to F has nothing between, so six to seven is too short. Which note moves? Pause.", "cue": {"p": 75, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S1-2-q.webp"}}, {"t0": 10.67, "t1": 14.67, "who": "pause", "text": "Pause and try.", "cue": {"p": 75, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S1-2-q.webp"}}, {"t0": 14.67, "t1": 18.89, "who": "P", "text": "F moves one key right: F sharp. G major has one sharp.", "cue": {"p": 75, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S1-2.webp"}}, {"t0": 18.89, "t1": 24.15, "who": "piano", "notes": [18.89, 19.51, 20.13, 20.75, 21.37, 21.99, 22.61, 23.23], "cue": {"p": 75, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S1-2.webp"}}]}, {"t": "Example: build F major", "f": "audio/S1/04-example-build-f-major.mp3", "s": 22, "p": 75, "l": [{"t0": 0.2, "t1": 8.98, "who": "B", "text": "Now F to F. Three to four must be a semitone, but A to B has a key between. Which note moves, and which way? Pause.", "cue": {"p": 75, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/S1-4-q.webp"}}, {"t0": 8.98, "t1": 12.98, "who": "pause", "text": "Pause and try.", "cue": {"p": 75, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/S1-4-q.webp"}}, {"t0": 12.98, "t1": 17.2, "who": "P", "text": "B moves one key left: B flat. F major has one flat.", "cue": {"p": 75, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/S1-4.webp"}}, {"t0": 17.2, "t1": 22.46, "who": "piano", "notes": [17.2, 17.82, 18.44, 19.06, 19.68, 20.3, 20.92, 21.54], "cue": {"p": 75, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/S1-4.webp"}}]}, {"t": "Try it: Joy to the World", "f": "audio/S1/05-try-it-joy-to-the-world.mp3", "s": 15, "p": 75, "l": [{"t0": 0.2, "t1": 8.81, "who": "B", "text": "The first line of Joy to the World is the C major scale, from the top down. Play it and sing along. Until next time.", "cue": {"p": 75, "r": "pop8"}, "lens": {"k": "pop", "src": "pops/S1-8.webp"}}, {"t0": 8.81, "t1": 14.69, "who": "piano", "notes": [8.81, 9.74, 10.05, 10.98, 11.29, 12.22, 12.53, 13.15], "cue": {"p": 75, "r": "pop8"}, "lens": {"k": "pop", "src": "pops/S1-8.webp"}}]}]}, {"k": "S2", "part": "Part V · Scales and keys", "t": "2 · Minor scales", "pages": [76, 77], "clips": [{"t": "Minor scales", "f": "audio/S2/01-minor-scales.mp3", "s": 37, "p": 76, "l": [{"t0": 3.4, "t1": 7.04, "who": "B", "text": "Listen, Clara: C major, then C minor.", "cue": {"p": 76, "r": "lead"}}, {"t0": 7.04, "t1": 17.51, "who": "piano", "notes": [7.04, 7.66, 8.28, 8.9, 9.52, 10.14, 10.76, 11.38, 12.25, 12.87, 13.49, 14.11, 14.73, 15.35, 15.97, 16.59], "cue": {"p": 76, "r": "lead"}}, {"t0": 17.51, "t1": 20.26, "who": "P", "text": "Ooh. Same home, but it’s raining now.", "cue": {"p": 76, "r": "lead"}}, {"t0": 20.26, "t1": 28.02, "who": "B", "text": "Remember: the natural minor is the major on the same note, with three, six and seven a semitone lower.", "cue": {"p": 76, "r": "remember"}}, {"t0": 28.02, "t1": 37.34, "who": "B", "text": "The harmonic minor raises seven again. The melodic minor raises six and seven going up, and comes down as the natural minor.", "cue": {"p": 76, "r": "rule"}}]}, {"t": "A minor in three forms", "f": "audio/S2/02-a-minor-in-three-forms.mp3", "s": 46, "p": 77, "l": [{"t0": 0.2, "t1": 9.05, "who": "B", "text": "A minor is the first minor scale with no sharps or flats. Natural: all white keys, the same notes as C major.", "cue": {"p": 77, "r": "h:A minor in three forms"}}, {"t0": 9.05, "t1": 14.31, "who": "piano", "notes": [9.05, 9.67, 10.29, 10.91, 11.53, 12.15, 12.77, 13.39], "cue": {"p": 77, "r": "h:A minor in three forms"}}, {"t0": 14.31, "t1": 17.74, "who": "B", "text": "Harmonic: the seventh raised, G sharp.", "cue": {"p": 77, "r": "h:A minor in three forms"}}, {"t0": 17.74, "t1": 23.0, "who": "piano", "notes": [17.74, 18.36, 18.98, 19.6, 20.22, 20.84, 21.46, 22.08], "cue": {"p": 77, "r": "h:A minor in three forms"}}, {"t0": 23.0, "t1": 28.43, "who": "B", "text": "Melodic: F sharp and G sharp going up, then G and F coming down.", "cue": {"p": 77, "r": "h:A minor in three forms"}}, {"t0": 28.43, "t1": 38.65, "who": "piano", "notes": [28.43, 29.05, 29.67, 30.29, 30.91, 31.53, 32.15, 32.77, 33.39, 34.01, 34.63, 35.25, 35.87, 36.49, 37.11], "cue": {"p": 77, "r": "h:A minor in three forms"}}, {"t0": 38.65, "t1": 46.37, "who": "B", "text": "Two traps: only three, six and seven move. And the melodic minor’s raised notes are for the way up only.", "cue": {"p": 77, "r": "trap"}}]}, {"t": "Example: build C natural minor", "f": "audio/S2/03-example-build-c-natural-minor.mp3", "s": 21, "p": 76, "l": [{"t0": 0.2, "t1": 8.07, "who": "B", "text": "Start from C major and move notes three, six and seven one key left. Name the keys you land on. Pause.", "cue": {"p": 76, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S2-1-q.webp"}}, {"t0": 8.07, "t1": 12.07, "who": "pause", "text": "Pause and try.", "cue": {"p": 76, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S2-1-q.webp"}}, {"t0": 12.07, "t1": 15.69, "who": "P", "text": "E flat, A flat and B flat: C natural minor.", "cue": {"p": 76, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S2-1.webp"}}, {"t0": 15.69, "t1": 20.95, "who": "piano", "notes": [15.69, 16.31, 16.93, 17.55, 18.17, 18.79, 19.41, 20.03], "cue": {"p": 76, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S2-1.webp"}}]}, {"t": "Example: build D natural minor", "f": "audio/S2/04-example-build-d-natural-minor.mp3", "s": 21, "p": 76, "l": [{"t0": 0.2, "t1": 5.44, "who": "B", "text": "Now D major. Move three, six and seven one key left. Pause.", "cue": {"p": 76, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/S2-4-q.webp"}}, {"t0": 5.44, "t1": 9.44, "who": "pause", "text": "Pause and try.", "cue": {"p": 76, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/S2-4-q.webp"}}, {"t0": 9.44, "t1": 15.5, "who": "P", "text": "F sharp becomes F, B becomes B flat, C sharp becomes C: D E F G A B flat C D.", "cue": {"p": 76, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/S2-4.webp"}}, {"t0": 15.5, "t1": 20.76, "who": "piano", "notes": [15.5, 16.12, 16.74, 17.36, 17.98, 18.6, 19.22, 19.84], "cue": {"p": 76, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/S2-4.webp"}}]}, {"t": "Try it: Greensleeves", "f": "audio/S2/05-try-it-greensleeves.mp3", "s": 24, "p": 76, "l": [{"t0": 0.2, "t1": 8.69, "who": "B", "text": "Greensleeves is in A minor, with a G sharp: the raised seventh, leaning hard up to A. Listen for it. Until next time.", "cue": {"p": 76, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/S2-6.webp"}}, {"t0": 8.69, "t1": 23.87, "who": "piano", "notes": [8.69, 9.31, 10.55, 11.17, 12.1, 12.41, 13.03, 14.27, 14.89, 15.82, 16.13, 16.75, 17.99, 18.61, 19.54, 19.85, 20.47, 21.71, 22.33], "cue": {"p": 76, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/S2-6.webp"}}]}]}, {"k": "S3", "part": "Part V · Scales and keys", "t": "3 · Key signatures", "pages": [78], "clips": [{"t": "Key signatures", "f": "audio/S3/01-key-signatures.mp3", "s": 48, "p": 78, "l": [{"t0": 3.4, "t1": 11.44, "who": "B", "text": "Why write F sharp fifty times, Clara? The key signature at the start of each line says it once, for the whole piece.", "cue": {"p": 78, "r": "lead"}}, {"t0": 11.44, "t1": 17.71, "who": "D", "text": "Good day. I am the Doorkeeper. I stand at the start of every line and tell each note how to dress.", "cue": {"p": 78, "r": "lead"}}, {"t0": 17.71, "t1": 23.27, "who": "B", "text": "Remember: the key signature says once which notes are always sharp or flat.", "cue": {"p": 78, "r": "remember"}}, {"t0": 23.27, "t1": 32.82, "who": "B", "text": "Its sharps always come in the same order: F, C, G, D, A, E, B. The flats are the sharps backwards: B, E, A, D, G, C, F.", "cue": {"p": 78, "r": "picture"}}, {"t0": 32.82, "t1": 40.19, "who": "K", "text": "Father Charles Goes Down And Ends Battle. He ended many battles, mostly by falling asleep in them.", "cue": {"p": 78, "r": "picture"}}, {"t0": 40.19, "t1": 47.55, "who": "B", "text": "Two traps: place each sharp or flat on exactly the right line, and remember it covers every octave.", "cue": {"p": 78, "r": "trap"}}]}, {"t": "Example: which notes are sharp?", "f": "audio/S3/02-example-which-notes-are-sharp.mp3", "s": 13, "p": 78, "l": [{"t0": 0.2, "t1": 4.91, "who": "B", "text": "Two sharps in the key signature. Name them in order. Pause.", "cue": {"p": 78, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S3-1-q.webp"}}, {"t0": 4.91, "t1": 7.91, "who": "pause", "text": "Pause and try.", "cue": {"p": 78, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S3-1-q.webp"}}, {"t0": 7.91, "t1": 12.53, "who": "P", "text": "F sharp and C sharp: every F and every C in the piece, high or low.", "cue": {"p": 78, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S3-1.webp"}}]}, {"t": "Example: which notes are flat?", "f": "audio/S3/03-example-which-notes-are-flat.mp3", "s": 10, "p": 78, "l": [{"t0": 0.2, "t1": 3.86, "who": "B", "text": "Three flats. Name them in order. Pause.", "cue": {"p": 78, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S3-2-q.webp"}}, {"t0": 3.86, "t1": 6.86, "who": "pause", "text": "Pause and try.", "cue": {"p": 78, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S3-2-q.webp"}}, {"t0": 6.86, "t1": 9.59, "who": "P", "text": "B flat, E flat and A flat.", "cue": {"p": 78, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S3-2.webp"}}]}, {"t": "Try it: Minuet in G", "f": "audio/S3/04-try-it-minuet-in-g.mp3", "s": 14, "p": 78, "l": [{"t0": 0.2, "t1": 9.5, "who": "B", "text": "The Minuet in G has one sharp: every F is F sharp. Find every F in the piece and play it as F sharp. Until next time.", "cue": {"p": 78, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/S3-4.webp"}}, {"t0": 9.5, "t1": 13.77, "who": "piano", "notes": [9.5, 10.12, 10.43, 10.74, 11.05, 11.61, 12.23, 12.85], "cue": {"p": 78, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/S3-4.webp"}}]}]}, {"k": "S4", "part": "Part V · Scales and keys", "t": "4 · Relative minor", "pages": [79], "clips": [{"t": "Relative minor", "f": "audio/S4/01-relative-minor.mp3", "s": 40, "p": 79, "l": [{"t0": 3.4, "t1": 13.02, "who": "B", "text": "Every key signature belongs to two keys, Clara: a major and a minor that share all its notes. The minor is the relative minor.", "cue": {"p": 79, "r": "lead"}}, {"t0": 13.02, "t1": 16.79, "who": "P", "text": "Same notes, different home. Like cousins sharing a house.", "cue": {"p": 79, "r": "lead"}}, {"t0": 16.79, "t1": 23.31, "who": "B", "text": "Remember: from the major key note, go down a minor third. Two keys between, then land.", "cue": {"p": 79, "r": "remember"}}, {"t0": 23.31, "t1": 30.13, "who": "B", "text": "From A: G sharp, G, and land on F sharp. Three sharps: A major, or F sharp minor.", "cue": {"p": 79, "r": "picture"}}, {"t0": 30.13, "t1": 31.67, "who": "piano", "notes": [30.13, 30.75], "cue": {"p": 79, "r": "picture"}}, {"t0": 31.67, "t1": 40.24, "who": "B", "text": "C major and A minor. G major and E minor. F major and D minor. Every key signature has its pair.", "cue": {"p": 79, "r": "table"}}]}, {"t": "Example: C major", "f": "audio/S4/02-example-c-major.mp3", "s": 14, "p":
