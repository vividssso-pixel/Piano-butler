 79, "l": [{"t0": 0.2, "t1": 6.13, "who": "B", "text": "Start on C and count two keys between, going down. Where do you land? Pause.", "cue": {"p": 79, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S4-1-q.webp"}}, {"t0": 6.13, "t1": 9.13, "who": "pause", "text": "Pause and try.", "cue": {"p": 79, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S4-1-q.webp"}}, {"t0": 9.13, "t1": 12.17, "who": "P", "text": "B, B flat, and land on A: A minor.", "cue": {"p": 79, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S4-1.webp"}}, {"t0": 12.17, "t1": 13.71, "who": "piano", "notes": [12.17, 12.79], "cue": {"p": 79, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S4-1.webp"}}]}, {"t": "Example: F major", "f": "audio/S4/03-example-f-major.mp3", "s": 13, "p": 79, "l": [{"t0": 0.2, "t1": 3.16, "who": "B", "text": "Now from F. Pause and count.", "cue": {"p": 79, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S4-2-q.webp"}}, {"t0": 3.16, "t1": 6.16, "who": "pause", "text": "Pause and try.", "cue": {"p": 79, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S4-2-q.webp"}}, {"t0": 6.16, "t1": 11.04, "who": "P", "text": "E, E flat, and land on D: D minor, which shares F major’s one flat.", "cue": {"p": 79, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S4-2.webp"}}, {"t0": 11.04, "t1": 12.58, "who": "piano", "notes": [11.04, 11.66], "cue": {"p": 79, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S4-2.webp"}}]}, {"t": "Try it", "f": "audio/S4/04-try-it.mp3", "s": 19, "p": 79, "l": [{"t0": 0.2, "t1": 8.17, "who": "B", "text": "Play C major, then A natural minor, both on the white keys. Same notes, different home. Until next time.", "cue": {"p": 79, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/S4-3-q.webp"}}, {"t0": 8.17, "t1": 18.64, "who": "piano", "notes": [8.17, 8.79, 9.41, 10.03, 10.65, 11.27, 11.89, 12.51, 13.38, 14.0, 14.62, 15.24, 15.86, 16.48, 17.1, 17.72], "cue": {"p": 79, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/S4-3-q.webp"}}]}]}, {"k": "S5", "part": "Part V · Scales and keys", "t": "5 · Finding the key", "pages": [80, 81], "clips": [{"t": "Finding the key", "f": "audio/S5/01-finding-the-key.mp3", "s": 36, "p": 80, "l": [{"t0": 3.4, "t1": 13.81, "who": "B", "text": "A key signature names two keys, Clara, a major and its relative minor. Two quick rules find the major; then the music tells you if it is the minor.", "cue": {"p": 80, "r": "lead"}}, {"t0": 13.81, "t1": 18.34, "who": "D", "text": "The last one in always holds the door for the key. Good manners.", "cue": {"p": 80, "r": "lead"}}, {"t0": 18.34, "t1": 24.22, "who": "B", "text": "Remember: last sharp, then the next key up. Second-last flat: that is the key.", "cue": {"p": 80, "r": "remember"}}, {"t0": 24.22, "t1": 36.03, "who": "B", "text": "Three sharps: the last is G sharp, the next key up is A. A major. Three flats: the second-last is E flat. E flat major. One flat alone is F major.", "cue": {"p": 80, "r": "picture"}}]}, {"t": "Major or minor? The clue note", "f": "audio/S5/02-major-or-minor-the-clue-note.mp3", "s": 24, "p": 81, "l": [{"t0": 0.2, "t1": 12.53, "who": "B", "text": "A minor key raises its seventh, so a sharp or natural that is not in the key signature is a clue. In A minor, G sharp. In E minor, D sharp. In D minor, C sharp.", "cue": {"p": 81, "r": "h:Major or minor? The clue note"}}, {"t0": 12.53, "t1": 23.89, "who": "B", "text": "So: name the major from the signature, find its relative minor, look for the clue notes, and check the last bass note. Pieces nearly always end on the key note.", "cue": {"p": 81, "r": "h:Major or minor? The clue note"}}]}, {"t": "Example: sharps", "f": "audio/S5/03-example-sharps.mp3", "s": 10, "p": 80, "l": [{"t0": 0.2, "t1": 4.48, "who": "B", "text": "The last sharp is C sharp. Which major key? Pause.", "cue": {"p": 80, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S5-1-q.webp"}}, {"t0": 4.48, "t1": 7.48, "who": "pause", "text": "Pause and try.", "cue": {"p": 80, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S5-1-q.webp"}}, {"t0": 7.48, "t1": 10.23, "who": "P", "text": "The next key up is D: D major.", "cue": {"p": 80, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S5-1.webp"}}]}, {"t": "Example: flats", "f": "audio/S5/04-example-flats.mp3", "s": 10, "p": 80, "l": [{"t0": 0.2, "t1": 5.46, "who": "B", "text": "B flat and E flat. The second-last flat names the key. Pause.", "cue": {"p": 80, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S5-2-q.webp"}}, {"t0": 5.46, "t1": 8.46, "who": "pause", "text": "Pause and try.", "cue": {"p": 80, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S5-2-q.webp"}}, {"t0": 8.46, "t1": 10.4, "who": "P", "text": "B flat major.", "cue": {"p": 80, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S5-2.webp"}}]}, {"t": "Example: major or minor?", "f": "audio/S5/05-example-major-or-minor.mp3", "s": 14, "p": 80, "l": [{"t0": 0.2, "t1": 6.49, "who": "B", "text": "One sharp, D sharps all through, and it ends on E. G major, or E minor? Pause.", "cue": {"p": 80, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/S5-3-q.webp"}}, {"t0": 6.49, "t1": 10.49, "who": "pause", "text": "Pause and try.", "cue": {"p": 80, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/S5-3-q.webp"}}, {"t0": 10.49, "t1": 13.62, "who": "P", "text": "E minor. D sharp is its raised seventh.", "cue": {"p": 80, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/S5-3.webp"}}]}, {"t": "Try it: Für Elise", "f": "audio/S5/06-try-it-f-r-elise.mp3", "s": 15, "p": 80, "l": [{"t0": 0.2, "t1": 12.42, "who": "B", "text": "Für Elise has no key signature, a G sharp as the clue, and keeps coming home to A: A minor. Play A, then G sharp, A, and hear it lean into home. Until next time.", "cue": {"p": 80, "r": "pop7"}, "lens": {"k": "pop", "src": "pops/S5-7.webp"}}, {"t0": 12.42, "t1": 15.2, "who": "piano", "notes": [12.42, 13.04, 13.66], "cue": {"p": 80, "r": "pop7"}, "lens": {"k": "pop", "src": "pops/S5-7.webp"}}]}]}, {"k": "S6", "part": "Part V · Scales and keys", "t": "6 · The circle of fifths", "pages": [82, 83], "clips": [{"t": "The circle of fifths", "f": "audio/S6/01-the-circle-of-fifths.mp3", "s": 23, "p": 82, "l": [{"t0": 3.4, "t1": 7.34, "who": "P", "text": "What is that giant clock on the page? Is it time for lunch?", "cue": {"p": 82, "r": "lead"}}, {"t0": 7.34, "t1": 17.96, "who": "B", "text": "Not quite, Clara. Twelve major keys sit around one clock face, with C at twelve o’clock. Read this clock and you can name any key signature in seconds.", "cue": {"p": 82, "r": "lead"}}, {"t0": 17.96, "t1": 22.5, "who": "B", "text": "Remember: go right, one more sharp. Go left, one more flat.", "cue": {"p": 82, "r": "remember"}}]}, {"t": "How to read the clock", "f": "audio/S6/02-how-to-read-the-clock.mp3", "s": 31, "p": 83, "l": [{"t0": 0.2, "t1": 8.88, "who": "B", "text": "The outer ring holds the major keys, the inner ring their relative minors, and outside the circle, how many sharps or flats.", "cue": {"p": 83, "r": "h:How to read the clock"}}, {"t0": 8.88, "t1": 20.82, "who": "B", "text": "Each step right is a fifth up: C, D, E, F, G, and G is the next key round. Each step left is a fifth down, to F. That is why it is called the circle of fifths.", "cue": {"p": 83, "r": "rule"}}, {"t0": 20.82, "t1": 26.33, "who": "piano", "notes": [20.82, 21.44, 22.06, 22.68, 23.55, 24.17, 24.79, 25.41], "cue": {"p": 83, "r": "rule"}}, {"t0": 26.33, "t1": 31.45, "who": "B", "text": "Neighbours share all but one note, so music moves between them easily.", "cue": {"p": 83, "r": "h:How to read the clock"}}]}, {"t": "Example: sharps in A major", "f": "audio/S6/03-example-sharps-in-a-major.mp3", "s": 12, "p": 82, "l": [{"t0": 0.2, "t1": 5.68, "who": "B", "text": "Start at C and go right, one step at a time, to A. How many steps? Pause.", "cue": {"p": 82, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S6-1-q.webp"}}, {"t0": 5.68, "t1": 8.68, "who": "pause", "text": "Pause and try.", "cue": {"p": 82, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S6-1-q.webp"}}, {"t0": 8.68, "t1": 11.57, "who": "P", "text": "G, D, A: three steps, three sharps.", "cue": {"p": 82, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S6-1.webp"}}]}, {"t": "Example: flats in E flat major", "f": "audio/S6/04-example-flats-in-e-flat-major.mp3", "s": 10, "p": 82, "l": [{"t0": 0.2, "t1": 3.84, "who": "B", "text": "Now go left from C to E flat. Pause.", "cue": {"p": 82, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S6-2-q.webp"}}, {"t0": 3.84, "t1": 6.84, "who": "pause", "text": "Pause and try.", "cue": {"p": 82, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S6-2-q.webp"}}, {"t0": 6.84, "t1": 9.72, "who": "P", "text": "F, B flat, E flat: three flats.", "cue": {"p": 82, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S6-2.webp"}}]}, {"t": "Try it: walk the circle", "f": "audio/S6/05-try-it-walk-the-circle.mp3", "s": 15, "p": 82, "l": [{"t0": 0.2, "t1": 12.27, "who": "B", "text": "Play each key note with one finger, a fifth up each time: C, G, D, A. You just walked three steps round the circle. And that is the end of Part Five. Until next time.", "cue": {"p": 82, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/S6-5.webp"}}, {"t0": 12.27, "t1": 15.05, "who": "piano", "notes": [12.27, 12.89, 13.51, 14.13], "cue": {"p": 82, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/S6-5.webp"}}]}]}, {"k": "O6", "part": "Part VI · Chords", "t": "Part opener", "pages": [84], "clips": [{"t": "Part Six: Chords", "f": "audio/O6/01-part-six-chords.mp3", "s": 55, "p": 84, "l": [{"t0": 3.4, "t1": 7.7, "who": "B", "text": "Welcome to Part Six, Clara: Chords. Notes together.", "cue": {"p": 84, "r": "opener"}}, {"t0": 7.7, "t1": 18.92, "who": "B", "text": "Press three notes at once and you have a chord. We will build them, name them, turn them upside down and add notes on top. Listen to Twinkle, Twinkle wearing its chords.", "cue": {"p": 84, "r": "opener"}}, {"t0": 18.92, "t1": 35.29, "who": "piano", "notes": [18.92, 20.37, 20.99, 21.61, 22.48, 23.93, 24.55, 26.25, 27.7, 28.32, 29.77, 30.64, 32.09, 33.54], "cue": {"p": 84, "r": "opener"}}, {"t0": 35.29, "t1": 38.1, "who": "P", "text": "Twinkle, Twinkle in its best clothes!", "cue": {"p": 84, "r": "opener"}}, {"t0": 38.1, "t1": 53.71, "who": "B", "text": "Ten chapters: triads, the four kinds of triad, chords in a key, the primary chords, inversions, seventh chords, sus chords, added-note chords, ninths, elevenths and thirteenths, and slash chords. Shall we build our first chord?", "cue": {"p": 84, "r": "chapters"}}, {"t0": 53.71, "t1": 55.2, "who": "P", "text": "Yes!", "cue": {"p": 84, "r": "chapters"}}]}]}, {"k": "H1", "part": "Part VI · Chords", "t": "1 · Chords and triads", "pages": [85, 86], "clips": [{"t": "Chords and triads", "f": "audio/H1/01-chords-and-triads.mp3", "s": 39, "p": 85, "l": [{"t0": 3.4, "t1": 7.9, "who": "B", "text": "Press three or more notes at once, Clara, and you have a chord.", "cue": {"p": 85, "r": "lead"}}, {"t0": 7.9, "t1": 10.92, "who": "P", "text": "Like pressing lots of keys with my elbow?", "cue": {"p": 85, "r": "lead"}}, {"t0": 10.92, "t1": 20.37, "who": "B", "text": "A little more carefully than that. The favourite chord of all is the triad: three notes stacked one above the other, like the layers of a cake.", "cue": {"p": 85, "r": "lead"}}, {"t0": 20.37, "t1": 29.71, "who": "B", "text": "Remember: play one, skip one, play one. Pick a note, the root: C. Skip a letter and take E, the third. Skip again and take G, the fifth.", "cue": {"p": 85, "r": "remember"}}, {"t0": 29.71, "t1": 33.32, "who": "piano", "notes": [29.71, 30.33, 30.95, 31.57], "cue": {"p": 85, "r": "picture"}}, {"t0": 33.32, "t1": 39.29, "who": "B", "text": "On the staff a triad sits on three lines in a row, or three spaces in a row.", "cue": {"p": 85, "r": "picture"}}]}, {"t": "Solid and broken", "f": "audio/H1/02-solid-and-broken.mp3", "s": 26, "p": 86, "l": [{"t0": 0.2, "t1": 10.12, "who": "B", "text": "Played together, a chord is solid. One note at a time, it is broken. Spread up and down the keyboard, a broken chord becomes an arpeggio.", "cue": {"p": 86, "r": "h:Solid and broken"}}, {"t0": 10.12, "t1": 18.57, "who": "piano", "notes": [10.12, 11.82, 12.44, 13.06, 13.93, 14.55, 15.17, 15.79, 16.41, 17.03, 17.65], "cue": {"p": 86, "r": "h:Solid and broken"}}, {"t0": 18.57, "t1": 26.45, "who": "B", "text": "Left-hand accompaniments, the arpeggios in your technical work, and the chord names over a song: all triads.", "cue": {"p": 86, "r": "h:Solid and broken"}}]}, {"t": "Example: a triad on G", "f": "audio/H1/03-example-a-triad-on-g.mp3", "s": 17, "p": 85, "l": [{"t0": 0.2, "t1": 6.68, "who": "B", "text": "Start on G. Skip one white key and take the next; then skip again. Pause and build it.", "cue": {"p": 85, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H1-1-q.webp"}}, {"t0": 6.68, "t1": 9.68, "who": "pause", "text": "Pause and try.", "cue": {"p": 85, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H1-1-q.webp"}}, {"t0": 9.68, "t1": 14.84, "who": "P", "text": "G, B, D: the triad of G. The same shape as C E G, just moved up.", "cue": {"p": 85, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H1-1.webp"}}, {"t0": 14.84, "t1": 16.59, "who": "piano", "notes": [14.84], "cue": {"p": 85, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H1-1.webp"}}]}, {"t": "Example: which one is a triad?", "f": "audio/H1/04-example-which-one-is-a-triad.mp3", "s": 18, "p": 85, "l": [{"t0": 0.2, "t1": 7.36, "who": "B", "text": "Three chords. Which one has its notes all on lines, or all in spaces, a third apart? Pause.", "cue": {"p": 85, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H1-2-q.webp"}}, {"t0": 7.36, "t1": 11.36, "who": "pause", "text": "Pause and try.", "cue": {"p": 85, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H1-2-q.webp"}}, {"t0": 11.36, "t1": 17.82, "who": "P", "text": "Chord one, D F A: three spaces in a row. Chord two has a second; chord three is stacked in fourths.", "cue": {"p": 85, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H1-2.webp"}}]}, {"t": "Try it: The Blue Danube", "f": "audio/H1/05-try-it-the-blue-danube.mp3", "s": 26, "p": 85, "l": [{"t0": 0.2, "t1": 8.47, "who": "B", "text": "Thumb on C, fingers one, three and five down together: the C chord. Slide your hand to any white key and do it again.", "cue": {"p": 85, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H1-3.webp"}}, {"t0": 8.47, "t1": 15.44, "who": "B", "text": "The most famous waltz of all simply climbs the C triad: C, E, G, then holds the top.", "cue": {"p": 85, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/H1-5.webp"}}, {"t0": 15.44, "t1": 23.93, "who": "piano", "notes": [15.44, 17.55, 18.17, 18.79, 19.66, 21.77], "cue": {"p": 85, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/H1-5.webp"}}, {"t0": 23.93, "t1": 26.45, "who": "B", "text": "Until next time, Clara.", "cue": {"p": 85, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/H1-5.webp"}}]}]}, {"k": "H2", "part": "Part VI · Chords", "t": "2 · Four kinds of triad", "pages": [87, 88], "clips": [{"t": "Four kinds of triad", "f": "audio/H2/01-four-kinds-of-triad.mp3", "s": 41, "p": 87, "l": [{"t0": 3.4, "t1": 13.85, "who": "B", "text": "Every triad is two thirds stacked, Clara. To tell the kinds apart, count the keys in between that you do not play: root to third, then third to fifth.", "cue": {"p": 87, "r": "lead"}}, {"t0": 13.85, "t1": 18.13, "who": "B", "text": "Remember: three and two is major. Two and three is minor.", "cue": {"p": 87, "r": "remember"}}, {"t0": 18.13, "t1": 20.64, "who": "B", "text": "Major, C E G.", "cue": {"p": 87, "r": "picture"}}, {"t0": 20.64, "t1": 22.39, "who": "piano", "notes": [20.64], "cue": {"p": 87, "r": "picture"}}, {"t0": 22.39, "t1": 25.06, "who": "B", "text": "Minor, C E flat G.", "cue": {"p": 87, "r": "picture"}}, {"t0": 25.06, "t1": 26.81, "who": "piano", "notes": [25.06], "cue": {"p": 87, "r": "picture"}}, {"t0": 26.81, "t1": 30.62, "who": "B", "text": "Diminished, two and two: C E flat G flat.", "cue": {"p": 87, "r": "picture"}}, {"t0": 30.62, "t1": 32.37, "who": "piano", "notes": [30.62], "cue": {"p": 87, "r": "picture"}}, {"t0": 32.37, "t1": 36.27, "who": "B", "text": "And augmented, three and three: C E G sharp.", "cue": {"p": 87, "r": "picture"}}, {"t0": 36.27, "t1": 38.02, "who": "piano", "notes": [36.27], "cue": {"p": 87, "r": "picture"}}, {"t0": 38.02, "t1": 40.68, "who": "P", "text": "Sunny, rainy, spooky and dreamy!", "cue": {"p": 87, "r": "picture"}}]}, {"t": "Counting the keys between", "f": "audio/H2/02-counting-the-keys-between.mp3", "s": 29, "p": 87, "l": [{"t0": 0.2, "t1": 8.64, "who": "B", "text": "From C to E you skip C sharp, D and D sharp: three. From E to G, F and F sharp: two. Three and two: major.", "cue": {"p": 87, "r": "h:Count the keys in between"}}, {"t0": 8.64, "t1": 18.09, "who": "B", "text": "On the white keys it always comes out the same: three major triads, C, F and G; three minor, D, E and A; one diminished, B.", "cue": {"p": 87, "r": "h:Count the keys in between"}}, {"t0": 18.09, "t1": 28.54, "who": "piano", "notes": [18.09, 19.54, 20.99, 22.44, 23.89, 25.34, 26.79], "cue": {"p": 87, "r": "h:Count the keys in between"}}]}, {"t": "Example: D F A", "f": "audio/H2/03-example-d-f-a.mp3", "s": 15, "p": 87, "l": [{"t0": 0.2, "t1": 6.89, "who": "B", "text": "D F A. Count the keys between D and F, then F and A. Major or minor? Pause.", "cue": {"p": 87, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H2-1-q.webp"}}, {"t0": 6.89, "t1": 10.89, "who": "pause", "text": "Pause and try.", "cue": {"p": 87, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H2-1-q.webp"}}, {"t0": 10.89, "t1": 13.17, "who": "P", "text": "Two, then three: D minor.", "cue": {"p": 87, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H2-1.webp"}}, {"t0": 13.17, "t1": 14.92, "who": "piano", "notes": [13.17], "cue": {"p": 87, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H2-1.webp"}}]}, {"t": "Example: the triad on B", "f": "audio/H2/04-example-the-triad-on-b.mp3", "s": 14, "p": 87, "l": [{"t0": 0.2, "t1": 4.06, "who": "B", "text": "B, D, F. Count the keys between. Pause.", "cue": {"p": 87, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H2-4-q.webp"}}, {"t0": 4.06, "t1": 8.06, "who": "pause", "text": "Pause and try.", "cue": {"p": 87, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H2-4-q.webp"}}, {"t0": 8.06, "t1": 12.47, "who": "P", "text": "Two and two: B diminished, the only diminished triad on the white keys.", "cue": {"p": 87, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H2-4.webp"}}, {"t0": 12.47, "t1": 14.22, "who": "piano", "notes": [12.47], "cue": {"p": 87, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H2-4.webp"}}]}, {"t": "Try it: the Moonlight Sonata", "f": "audio/H2/05-try-it-the-moonlight-sonata.mp3", "s": 14, "p": 87, "l": [{"t0": 0.2, "t1": 10.39, "who": "B", "text": "Beethoven’s Moonlight Sonata rocks gently through the notes of a C sharp minor triad. Minor is why it sounds so dark. Until next time.", "cue": {"p": 87, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/H2-5.webp"}}, {"t0": 10.39, "t1": 14.43, "who": "piano", "notes": [10.39, 10.81, 11.22, 11.64, 12.05, 12.47, 12.89, 13.3, 13.72], "cue": {"p": 87, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/H2-5.webp"}}]}]}, {"k": "H3", "part": "Part VI · Chords", "t": "3 · Chords in a key", "pages": [89], "clips": [{"t": "Chords in a key", "f": "audio/H3/01-chords-in-a-key.mp3", "s": 45, "p": 89, "l": [{"t0": 3.4, "t1": 9.41, "who": "B", "text": "Build a triad on every note of a scale, Clara, and you have the chords of that key.", "cue": {"p": 89, "r": "lead"}}, {"t0": 9.41, "t1": 21.31, "who": "piano", "notes": [9.41, 10.86, 12.31, 13.76, 15.21, 16.66, 18.11, 19.56], "cue": {"p": 89, "r": "lead"}}, {"t0": 21.31, "t1": 31.93, "who": "B", "text": "Remember: number each one by the note it stands on. Roman numerals: capitals for major, small for minor, small with a little circle for diminished.", "cue": {"p": 89, "r": "remember"}}, {"t0": 31.93, "t1": 41.14, "who": "B", "text": "In C major: one, the tonic, C. Two, D minor. Three, E minor. Four, F. Five, G. Six, A minor. And seven, B diminished.", "cue": {"p": 89, "r": "table"}}, {"t0": 41.14, "t1": 44.51, "who": "B", "text": "One, four and five do most of the work.", "cue": {"p": 89, "r": "table"}}]}, {"t": "Example: the chord on note six", "f": "audio/H3/02-example-the-chord-on-note-six.mp3", "s": 17, "p": 89, "l": [{"t0": 0.2, "t1": 6.98, "who": "B", "text": "Build the triad on A, note six of C major. Major or minor, and which numeral? Pause.", "cue": {"p": 89, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H3-3-q.webp"}}, {"t0": 6.98, "t1": 10.98, "who": "pause", "text": "Pause and try.", "cue": {"p": 89, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H3-3-q.webp"}}, {"t0": 10.98, "t1": 15.31, "who": "P", "text": "A C E, two and three: A minor. Small six, because it is minor.", "cue": {"p": 89, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H3-3.webp"}}, {"t0": 15.31, "t1": 17.06, "who": "piano", "notes": [15.31], "cue": {"p": 89, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H3-3.webp"}}]}, {"t": "Try it", "f": "audio/H3/03-try-it.mp3", "s": 8, "p": 89, "l": [{"t0": 0.2, "t1": 7.53, "who": "B", "text": "Play the seven triads of C major from C up to B, saying each numeral aloud. Until next time.", "cue": {"p": 89, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H3-2.webp"}}]}]}, {"k": "H4", "part": "Part VI · Chords", "t": "4 · Primary chords: I, IV and V", "pages": [90], "clips": [{"t": "Primary chords", "f": "audio/H4/01-primary-chords.mp3", "s": 39, "p": 90, "l": [{"t0": 3.4, "t1": 8.58, "who": "B", "text": "Three chords do most of the work in a key, Clara: one, four and five.", "cue": {"p": 90, "r": "lead"}}, {"t0": 8.58, "t1": 12.07, "who": "P", "text": "So that’s why so many songs only need three chords!", "cue": {"p": 90, "r": "lead"}}, {"t0": 12.07, "t1": 23.01, "who": "B", "text": "Exactly. Remember: one, four and five are major in a major key, and between them they hold every note of the scale. C E G, F A C, G B D.", "cue": {"p": 90, "r": "remember"}}, {"t0": 23.01, "t1": 29.11, "who": "piano", "notes": [23.01, 24.46, 25.91, 27.36], "cue": {"p": 90, "r": "h:The three primary chords"}}, {"t0": 29.11, "t1": 38.56, "who": "B", "text": "In A minor the three main chords are one, A minor; four, D minor; and five, E G sharp B: major, thanks to the raised seventh.", "cue": {"p": 90, "r": "h:The three primary chords"}}]}, {"t": "Example: I, IV and V in G major", "f": "audio/H4/02-example-i-iv-and-v-in-g-major.mp3", "s": 24, "p": 90, "l": [{"t0": 0.2, "t1": 7.96, "who": "B", "text": "Count up the scale from G. Which notes are first, fourth and fifth? Build a chord on each, with F sharp. Pause.", "cue": {"p": 90, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H4-1-q.webp"}}, {"t0": 7.96, "t1": 12.96, "who": "pause", "text": "Pause and try.", "cue": {"p": 90, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H4-1-q.webp"}}, {"t0": 12.96, "t1": 17.95, "who": "P", "text": "G, C and D: G B D, C E G and D F sharp A. All major.", "cue": {"p": 90, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H4-1.webp"}}, {"t0": 17.95, "t1": 24.05, "who": "piano", "notes": [17.95, 19.4, 20.85, 22.3], "cue": {"p": 90, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H4-1.webp"}}]}, {"t": "Example: V in D minor", "f": "audio/H4/03-example-v-in-d-minor.mp3", "s": 20, "p": 90, "l": [{"t0": 0.2, "t1": 8.79, "who": "B", "text": "The fifth note of D minor is A: A C E. But the harmonic minor raises the seventh note, C. What happens? Pause.", "cue": {"p": 90, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H4-4-q.webp"}}, {"t0": 8.79, "t1": 12.79, "who": "pause", "text": "Pause and try.", "cue": {"p": 90, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H4-4-q.webp"}}, {"t0": 12.79, "t1": 16.33, "who": "P", "text": "C becomes C sharp: A C sharp E, A major.", "cue": {"p": 90, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H4-4.webp"}}, {"t0": 16.33, "t1": 19.53, "who": "piano", "notes": [16.33, 17.78], "cue": {"p": 90, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H4-4.webp"}}]}, {"t": "Try it", "f": "audio/H4/04-try-it.mp3", "s": 16, "p": 90, "l": [{"t0": 0.2, "t1": 9.86, "who": "B", "text": "Left hand: the chords of C, F and G. Then sing any nursery tune over them: these three fit almost every note. Until next time.", "cue": {"p": 90, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H4-2.webp"}}, {"t0": 9.86, "t1": 15.96, "who": "piano", "notes": [9.86, 11.31, 12.76, 14.21], "cue": {"p": 90, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H4-2.webp"}}]}]}, {"k": "H5", "part": "Part VI · Chords", "t": "5 · Inversions", "pages": [91], "clips": [{"t": "Inversions", "f": "audio/H5/01-inversions.mp3", "s": 41, "p": 91, "l": [{"t0": 3.4, "t1": 10.97, "who": "B", "text": "Same three notes, Clara, but a different one at the bottom. The chord keeps its name; only the bass changes.", "cue": {"p": 91, "r": "lead"}}, {"t0": 10.97, "t1": 15.08, "who": "P", "text": "It’s like a family taking turns to sit at the bottom of the bunk bed.", "cue": {"p": 91, "r": "lead"}}, {"t0": 15.08, "t1": 20.03, "who": "B", "text": "Remember: move the bottom note to the top. Same chord, new bass.", "cue": {"p": 91, "r": "remember"}}, {"t0": 20.03, "t1": 26.76, "who": "B", "text": "Root position, C E G. First inversion, E G C. Second inversion, G C E.", "cue": {"p": 91, "r": "picture"}}, {"t0": 26.76, "t1": 31.41, "who": "piano", "notes": [26.76, 28.21, 29.66], "cue": {"p": 91, "r": "picture"}}, {"t0": 31.41, "t1": 41.2, "who": "B", "text": "To find the root, restack the notes every other letter. The bottom of the stack is the root. Inversions let your hand move as little as possible.", "cue": {"p": 91, "r": "h:Why inversions?"}}]}, {"t": "Example: move as little as possible", "f": "audio/H5/02-example-move-as-little-as-possible.mp3", "s": 24, "p": 91, "l": [{"t0": 0.2, "t1": 6.51, "who": "B", "text": "C, F, G, C. Keep shared notes still, and move the others by step. Pause and try.", "cue": {"p": 91, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H5-2-q.webp"}}, {"t0": 6.51, "t1": 11.51, "who": "pause", "text": "Pause and try.", "cue": {"p": 91, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H5-2-q.webp"}}, {"t0": 11.51, "t1": 17.99, "who": "P", "text": "C E G, then C F A, then B D G, and back to C E G. F stands on C, G stands on B.", "cue": {"p": 91, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H5-2.webp"}}, {"t0": 17.99, "t1": 24.09, "who": "piano", "notes": [17.99, 19.44, 20.89, 22.34], "cue": {"p": 91, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H5-2.webp"}}]}, {"t": "Example: F major in first inversion", "f": "audio/H5/03-example-f-major-in-first-inversion.mp3", "s": 11, "p": 91, "l": [{"t0": 0.2, "t1": 4.82, "who": "B", "text": "Build F major, then put the third at the bottom. Pause.", "cue": {"p": 91, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H5-4-q.webp"}}, {"t0": 4.82, "t1": 7.82, "who": "pause", "text": "Pause and try.", "cue": {"p": 91, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H5-4-q.webp"}}, {"t0": 7.82, "t1": 9.51, "who": "P", "text": "A C F.", "cue": {"p": 91, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H5-4.webp"}}, {"t0": 9.51, "t1": 11.26, "who": "piano", "notes": [9.51], "cue": {"p": 91, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/H5-4.webp"}}]}, {"t": "Example: which position? A D F", "f": "audio/H5/04-example-which-position-a-d-f.mp3", "s": 18, "p": 91, "l": [{"t0": 0.2, "t1": 6.4, "who": "B", "text": "A D F. Restack it, find the root, then see which note is at the bottom. Pause.", "cue": {"p": 91, "r": "pop7"}, "lens": {"k": "pop", "src": "pops/H5-7-q.webp"}}, {"t0": 6.4, "t1": 11.4, "who": "pause", "text": "Pause and try.", "cue": {"p": 91, "r": "pop7"}, "lens": {"k": "pop", "src": "pops/H5-7-q.webp"}}, {"t0": 11.4, "t1": 16.63, "who": "P", "text": "Restacked: D F A, D minor. A, the fifth, is at the bottom: second inversion.", "cue": {"p": 91, "r": "pop7"}, "lens": {"k": "pop", "src": "pops/H5-7.webp"}}, {"t0": 16.63, "t1": 18.38, "who": "piano", "notes": [16.63], "cue": {"p": 91, "r": "pop7"}, "lens": {"k": "pop", "src": "pops/H5-7.webp"}}]}, {"t": "Try it: Pachelbel’s Canon", "f": "audio/H5/05-try-it-pachelbel-s-canon.mp3", "s": 22, "p": 91, "l": [{"t0": 0.2, "t1": 11.63, "who": "B", "text": "In Pachelbel’s Canon the bass walks straight down the scale, because some chords are inversions. Play it slowly and hum the famous tune over it. Until next time.", "cue": {"p": 91, "r": "pop8"}, "lens": {"k": "pop", "src": "pops/H5-8.webp"}}, {"t0": 11.63, "t1": 21.85, "who": "piano", "notes": [11.63, 12.87, 14.11, 15.35, 16.59, 17.83, 19.07, 20.31], "cue": {"p": 91, "r": "pop8"}, "lens": {"k": "pop", "src": "pops/H5-8.webp"}}]}]}, {"k": "H6", "part": "Part VI · Chords", "t": "6 · Seventh chords", "pages": [92, 93], "clips": [{"t": "Seventh chords", "f": "audio/H6/01-seventh-chords.mp3", "s": 46, "p": 92, "l": [{"t0": 3.4, "t1": 12.68, "who": "B", "text": "Three notes make a plain chord, Clara. Add one more on top and it can sound dreamy, bluesy or spooky. The new note is the seventh.", "cue": {"p": 92, "r": "lead"}}, {"t0": 12.68, "t1": 14.65, "who": "P", "text": "Mwa-ha-ha!", "cue": {"p": 92, "r": "lead"}}, {"t0": 14.65, "t1": 23.59, "who": "B", "text": "Remember: one more note on top and the chord changes colour. Build C E G, skip one, and add B: C major seven.", "cue": {"p": 92, "r": "remember"}}, {"t0": 23.59, "t1": 27.74, "who": "B", "text": "Five flavours, all on C. Major seven, dreamy.", "cue": {"p": 92, "r": "picture"}}, {"t0": 27.74, "t1": 29.49, "who": "piano", "notes": [27.74], "cue": {"p": 92, "r": "picture"}}, {"t0": 29.49, "t1": 31.41, "who": "B", "text": "Seven, bluesy.", "cue": {"p": 92, "r": "picture"}}, {"t0": 31.41, "t1": 33.16, "who": "piano", "notes": [31.41], "cue": {"p": 92, "r": "picture"}}, {"t0": 33.16, "t1": 35.5, "who": "B", "text": "Minor seven, mellow.", "cue": {"p": 92, "r": "picture"}}, {"t0": 35.5, "t1": 37.25, "who": "piano", "notes": [35.5], "cue": {"p": 92, "r": "picture"}}, {"t0": 37.25, "t1": 39.76, "who": "B", "text": "Half-diminished, searching.", "cue": {"p": 92, "r": "picture"}}, {"t0": 39.76, "t1": 41.51, "who": "piano", "notes": [39.76], "cue": {"p": 92, "r": "picture"}}, {"t0": 41.51, "t1": 44.2, "who": "B", "text": "And diminished seven, spooky.", "cue": {"p": 92, "r": "picture"}}, {"t0": 44.2, "t1": 45.95, "who": "piano", "notes": [44.2], "cue": {"p": 92, "r": "picture"}}]}, {"t": "How the names work", "f": "audio/H6/02-how-the-names-work.mp3", "s": 20, "p": 93, "l": [{"t0": 0.2, "t1": 13.25, "who": "B", "text": "A major triad with a major seventh is major seven. A major triad with a minor seventh is plain seven, the dominant seventh: in a key it sits on the fifth note, as five seven.", "cue": {"p": 93, "r": "more"}}, {"t0": 13.25, "t1": 20.41, "who": "B", "text": "One trap: seven alone means the bluesy one. C seven has B flat; C major seven has B.", "cue": {"p": 93, "r": "trap"}}]}, {"t": "Example: G B D F", "f": "audio/H6/03-example-g-b-d-f.mp3", "s": 15, "p": 92, "l": [{"t0": 0.2, "t1": 5.78, "who": "B", "text": "G B D F. Count the keys between each layer. Which flavour? Pause.", "cue": {"p": 92, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H6-1-q.webp"}}, {"t0": 5.78, "t1": 9.78, "who": "pause", "text": "Pause and try.", "cue": {"p": 92, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H6-1-q.webp"}}, {"t0": 9.78, "t1": 13.07, "who": "P", "text": "Three, two, two: the bluesy one. G seven.", "cue": {"p": 92, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H6-1.webp"}}, {"t0": 13.07, "t1": 14.82, "who": "piano", "notes": [13.07], "cue": {"p": 92, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H6-1.webp"}}]}, {"t": "Example: build A minor seven", "f": "audio/H6/04-example-build-a-minor-seven.mp3", "s": 14, "p": 92, "l": [{"t0": 0.2, "t1": 5.19, "who": "B", "text": "Build A minor, then add the letter after next above E. Pause.", "cue": {"p": 92, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/H6-6-q.webp"}}, {"t0": 5.19, "t1": 9.19, "who": "pause", "text": "Pause and try.", "cue": {"p": 92, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/H6-6-q.webp"}}, {"t0": 9.19, "t1": 12.06, "who": "P", "text": "A C E G: A minor seven.", "cue": {"p": 92, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/H6-6.webp"}}, {"t0": 12.06, "t1": 13.81, "who": "piano", "notes": [12.06], "cue": {"p": 92, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/H6-6.webp"}}]}, {"t": "Try it", "f": "audio/H6/05-try-it.mp3", "s": 11, "p": 92, "l": [{"t0": 0.2, "t1": 7.85, "who": "B", "text": "Play C seven, then C major seven. One key changes: bluesy, then dreamy. Until next time.", "cue": {"p": 92, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H6-3.webp"}}, {"t0": 7.85, "t1": 11.05, "who": "piano", "notes": [7.85, 9.3], "cue": {"p": 92, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H6-3.webp"}}]}]}, {"k": "H7", "part": "Part VI · Chords", "t": "7 · Sus chords", "pages": [94, 95], "clips": [{"t": "Sus chords", "f": "audio/H7/01-sus-chords.mp3", "s": 37, "p": 94, "l": [{"t0": 3.4, "t1": 14.45, "who": "B", "text": "The third is the chord’s mood switch, Clara: major or minor. Slide it up or down a letter and the chord hangs in the air, neither happy nor sad: a sus chord.", "cue": {"p": 94, "r": "lead"}}, {"t0": 14.45, "t1": 19.63, "who": "B", "text": "Remember: move the third up a letter for sus four, down a letter for sus two.", "cue": {"p": 94, "r": "remember"}}, {"t0": 19.63, "t1": 24.28, "who": "piano", "notes": [19.63, 21.08, 22.53], "cue": {"p": 94, "r": "picture"}}, {"t0": 24.28, "t1": 31.08, "who": "B", "text": "A sus chord often leans, then slides back: F steps down to E, or D steps up to E.", "cue": {"p": 95, "r": "more"}}, {"t0": 31.08, "t1": 37.43, "who": "piano", "notes": [31.08, 32.53, 34.23, 35.68], "cue": {"p": 95, "r": "more"}}]}, {"t": "Example: build D sus four", "f": "audio/H7/02-example-build-d-sus-four.mp3", "s": 16, "p": 94, "l": [{"t0": 0.2, "t1": 6.3, "who": "B", "text": "Start with D major, D F sharp A, and move the middle note up a letter. Pause.", "cue": {"p": 94, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H7-3-q.webp"}}, {"t0": 6.3, "t1": 9.3, "who": "pause", "text": "Pause and try.", "cue": {"p": 94, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H7-3-q.webp"}}, {"t0": 9.3, "t1": 12.39, "who": "P", "text": "F sharp moves up to G: D G A.", "cue": {"p": 94, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H7-3.webp"}}, {"t0": 12.39, "t1": 15.59, "who": "piano", "notes": [12.39, 13.84], "cue": {"p": 94, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H7-3.webp"}}]}, {"t": "Try it", "f": "audio/H7/03-try-it.mp3", "s": 10, "p": 94, "l": [{"t0": 0.2, "t1": 7.26, "who": "B", "text": "Play C sus four, then C. No third, then a third: floating, then bright. Until next time.", "cue": {"p": 94, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H7-2.webp"}}, {"t0": 7.26, "t1": 10.46, "who": "piano", "notes": [7.26, 8.71], "cue": {"p": 94, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H7-2.webp"}}]}]}, {"k": "H8", "part": "Part VI · Chords", "t": "8 · Added-note chords", "pages": [96, 97], "clips": [{"t": "Added-note chords", "f": "audio/H8/01-added-note-chords.mp3", "s": 33, "p": 96, "l": [{"t0": 3.4, "t1": 13.34, "who": "B", "text": "Keep the chord, Clara, and add one note on top for a new colour: the sixth or the ninth. Or take the third away for a bare, strong power chord.", "cue": {"p": 96, "r": "lead"}}, {"t0": 13.34, "t1": 18.58, "who": "B", "text": "Remember: six and add nine add one note; five takes the third away.", "cue": {"p": 96, "r": "remember"}}, {"t0": 18.58, "t1": 20.6, "who": "B", "text": "C five, strong.", "cue": {"p": 97, "r": "table"}}, {"t0": 20.6, "t1": 22.35, "who": "piano", "notes": [20.6], "cue": {"p": 97, "r": "table"}}, {"t0": 22.35, "t1": 24.44, "who": "B", "text": "C six, warm.", "cue": {"p": 97, "r": "table"}}, {"t0": 24.44, "t1": 26.19, "who": "piano", "notes": [24.44], "cue": {"p": 97, "r": "table"}}, {"t0": 26.19, "t1": 28.74, "who": "B", "text": "C add nine, sparkly.", "cue": {"p": 97, "r": "table"}}, {"t0": 28.74, "t1": 30.49, "who": "piano", "notes": [28.74], "cue": {"p": 97, "r": "table"}}, {"t0": 30.49, "t1": 32.62, "who": "P", "text": "It’s like a paint box!", "cue": {"p": 97, "r": "table"}}]}, {"t": "C6 or A minor seven?", "f": "audio/H8/02-c6-or-a-minor-seven.mp3", "s": 14, "p": 97, "l": [{"t0": 0.2, "t1": 10.76, "who": "B", "text": "C E G A: the same four notes as A minor seven. The bottom note decides. C at the bottom is C six; A at the bottom is A minor seven.", "cue": {"p": 97, "r": "more"}}, {"t0": 10.76, "t1": 14.21, "who": "piano", "notes": [10.76, 12.46], "cue": {"p": 97, "r": "more"}}]}, {"t": "Example: G C D", "f": "audio/H8/03-example-g-c-d.mp3", "s": 14, "p": 96, "l": [{"t0": 0.2, "t1": 5.64, "who": "B", "text": "G C D. Count the keys between, and look for the third, B. Pause.", "cue": {"p": 96, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H8-1-q.webp"}}, {"t0": 5.64, "t1": 9.64, "who": "pause", "text": "Pause and try.", "cue": {"p": 96, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H8-1-q.webp"}}, {"t0": 9.64, "t1": 12.68, "who": "P", "text": "Four and one, and no B: G sus four.", "cue": {"p": 96, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H8-1.webp"}}, {"t0": 12.68, "t1": 14.43, "who": "piano", "notes": [12.68], "cue": {"p": 96, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H8-1.webp"}}]}, {"t": "Example: build F add nine", "f": "audio/H8/04-example-build-f-add-nine.mp3", "s": 13, "p": 96, "l": [{"t0": 0.2, "t1": 6.17, "who": "B", "text": "F major, and keep every note. The ninth is the second, an octave up. Pause.", "cue": {"p": 96, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H8-2-q.webp"}}, {"t0": 6.17, "t1": 9.17, "who": "pause", "text": "Pause and try.", "cue": {"p": 96, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H8-2-q.webp"}}, {"t0": 9.17, "t1": 11.6, "who": "P", "text": "F A C, and G on top.", "cue": {"p": 96, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H8-2.webp"}}, {"t0": 11.6, "t1": 13.35, "who": "piano", "notes": [11.6], "cue": {"p": 96, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/H8-2.webp"}}]}, {"t": "Try it", "f": "audio/H8/05-try-it.mp3", "s": 12, "p": 96, "l": [{"t0": 0.2, "t1": 7.36, "who": "B", "text": "Play C, then C six, then C add nine: the same chord in three colours. Until next time.", "cue": {"p": 96, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H8-3.webp"}}, {"t0": 7.36, "t1": 12.01, "who": "piano", "notes": [7.36, 8.81, 10.26], "cue": {"p": 96, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H8-3.webp"}}]}]}, {"k": "H9", "part": "Part VI · Chords", "t": "9 · 9th, 11th and 13th chords", "pages": [98, 99], "clips": [{"t": "9th, 11th and 13th chords", "f": "audio/H9/01-9th-11th-and-13th-chords.mp3", "s": 30, "p": 98, "l": [{"t0": 3.4, "t1": 15.06, "who": "B", "text": "Why stop at the seventh, Clara? Keep stacking thirds and the chord grows three more layers: the ninth, the eleventh and the thirteenth. At the top you have used all seven letters.", "cue": {"p": 98, "r": "lead"}}, {"t0": 15.06, "t1": 18.05, "who": "B", "text": "Like a wedding chord for a giant.", "cue": {"p": 98, "r": "lead"}}, {"t0": 18.05, "t1": 23.5, "who": "B", "text": "Remember: nine, eleven and thirteen are two, four and six, an octave up.", "cue": {"p": 98, "r": "remember"}}, {"t0": 23.5, "t1": 29.59, "who": "piano", "notes": [23.5, 24.12, 24.74, 25.36, 25.98, 26.6, 27.22, 27.84], "cue": {"p": 98, "r": "picture"}}]}, {"t": "Leave some notes out", "f": "audio/H9/02-leave-some-notes-out.mp3", "s": 17, "p": 99, "l": [{"t0": 0.2, "t1": 15.09, "who": "B", "text": "All seven notes sound muddy. So players leave some out: the fifth first, and in a thirteenth chord, the eleventh too. Keep the third and the seventh, which say what kind of chord it is, and the top layer, which gives it its colour.", "cue": {"p": 99, "r": "h:Too many notes? Leave some out"}}, {"t0": 15.09, "t1": 16.84, "who": "piano", "notes": [15.09], "cue": {"p": 99, "r": "h:Too many notes? Leave some out"}}]}, {"t": "Example: G B D F A", "f": "audio/H9/03-example-g-b-d-f-a.mp3", "s": 16, "p": 98, "l": [{"t0": 0.2, "t1": 7.06, "who": "B", "text": "G B D F A. The first four notes make which seventh, and which layer is on top? Pause.", "cue": {"p": 98, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H9-1-q.webp"}}, {"t0": 7.06, "t1": 11.06, "who": "pause", "text": "Pause and try.", "cue": {"p": 98, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H9-1-q.webp"}}, {"t0": 11.06, "t1": 14.54, "who": "P", "text": "G seven, with A, the ninth, on top: G nine.", "cue": {"p": 98, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H9-1.webp"}}, {"t0": 14.54, "t1": 16.29, "who": "piano", "notes": [14.54], "cue": {"p": 98, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H9-1.webp"}}]}, {"t": "Try it", "f": "audio/H9/04-try-it.mp3", "s": 12, "p": 98, "l": [{"t0": 0.2, "t1": 8.34, "who": "B", "text": "Left hand C E G, right hand B flat, then add D above it. You just built C nine. Until next time.", "cue": {"p": 98, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H9-3.webp"}}, {"t0": 8.34, "t1": 11.54, "who": "piano", "notes": [8.34, 9.79], "cue": {"p": 98, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H9-3.webp"}}]}]}, {"k": "H10", "part": "Part VI · Chords", "t": "10 · Slash chords", "pages": [100, 101, 102], "clips": [{"t": "Slash chords", "f": "audio/H10/01-slash-chords.mp3", "s": 32, "p": 100, "l": [{"t0": 3.4, "t1": 14.04, "who": "B", "text": "C slash E means one chord with a chosen bass note, Clara: play a C chord, with E as the lowest note. It is not a fraction, and not two chords.", "cue": {"p": 100, "r": "lead"}}, {"t0": 14.04, "t1": 18.15, "who": "B", "text": "Remember: chord before the slash, bass note after it.", "cue": {"p": 100, "r": "remember"}}, {"t0": 18.15, "t1": 19.9, "who": "piano", "notes": [18.15], "cue": {"p": 100, "r": "picture"}}, {"t0": 19.9, "t1": 32.25, "who": "B", "text": "Slash chords have four jobs: an inversion, for smoother changes; a bass that walks down; a pedal, one bass under changing chords; and a bass from outside the chord, for colour.", "cue": {"p": 100, "r": "table"}}]}, {"t": "Walking basses and pedals", "f": "audio/H10/02-walking-basses-and-pedals.mp3", "s": 32, "p": 101, "l": [{"t0": 0.2, "t1": 6.02, "who": "B", "text": "Here the bass walks straight down, C, B, A, G, while the right hand hardly moves.", "cue": {"p": 101, "r": "more"}}, {"t0": 6.02, "t1": 12.12, "who": "piano", "notes": [6.02, 7.47, 8.92, 10.37], "cue": {"p": 101, "r": "more"}}, {"t0": 12.12, "t1": 16.68, "who": "B", "text": "And a pedal: the bass holds C while the chords change above it.", "cue": {"p": 101, "r": "more"}}, {"t0": 16.68, "t1": 22.78, "who": "piano", "notes": [16.68, 18.13, 19.58, 21.03], "cue": {"p": 101, "r": "more"}}, {"t0": 22.78, "t1": 30.24, "who": "B", "text": "F over G: F A C over a G. The G is not in the chord, so it floats, open and unfinished.", "cue": {"p": 101, "r": "more"}}, {"t0": 30.24, "t1": 31.99, "who": "piano", "notes": [30.24], "cue": {"p": 101, "r": "more"}}]}, {"t": "Example: name the slash chord", "f": "audio/H10/03-example-name-the-slash-chord.mp3", "s": 15, "p": 100, "l": [{"t0": 0.2, "t1": 5.93, "who": "B", "text": "The right hand plays G B D; the lowest note is B. Pause and name it.", "cue": {"p": 100, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H10-1-q.webp"}}, {"t0": 5.93, "t1": 8.93, "who": "pause", "text": "Pause and try.", "cue": {"p": 100, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H10-1-q.webp"}}, {"t0": 8.93, "t1": 13.35, "who": "P", "text": "G over B. B is in the G chord, so it is the first inversion.", "cue": {"p": 100, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H10-1.webp"}}, {"t0": 13.35, "t1": 15.1, "who": "piano", "notes": [13.35], "cue": {"p": 100, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/H10-1.webp"}}]}, {"t": "Try it", "f": "audio/H10/04-try-it.mp3", "s": 16, "p": 100, "l": [{"t0": 0.2, "t1": 12.36, "who": "B", "text": "Play C E G in the right hand and a low E in the left: C over E. Now try a low A under it. What would you call that? And that is the end of Part Six. Until next time.", "cue": {"p": 100, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H10-3.webp"}}, {"t0": 12.36, "t1": 15.56, "who": "piano", "notes": [12.36, 13.81], "cue": {"p": 100, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/H10-3.webp"}}]}]}, {"k": "O7", "part": "Part VII · Harmony in music", "t": "Part opener", "pages": [103], "clips": [{"t": "Part Seven: Harmony in music", "f": "audio/O7/01-part-seven-harmony-in-music.mp3", "s": 59, "p": 103, "l": [{"t0": 3.4, "t1": 8.66, "who": "B", "text": "Welcome to Part Seven, Clara: Harmony in music. Chords at work.", "cue": {"p": 103, "r": "opener"}}, {"t0": 8.66, "t1": 23.34, "who": "B", "text": "A melody is the singer; harmony is the band behind it. Here the chords start moving: guests from outside the key, endings, chords under a tune, and the patterns songs love. Listen for a sad chord hiding in the middle.", "cue": {"p": 103, "r": "opener"}}, {"t0": 23.34, "t1": 40.54, "who": "piano", "notes": [23.34, 24.79, 25.41, 26.86, 27.73, 29.18, 29.8, 31.5, 32.95, 33.57, 35.02, 35.89, 37.34, 38.79], "cue": {"p": 103, "r": "opener"}}, {"t0": 40.54, "t1": 42.88, "who": "P", "text": "There it was, a minor chord!", "cue": {"p": 103, "r": "opener"}}, {"t0": 42.88, "t1": 57.0, "who": "B", "text": "Seven chapters: secondary dominants, borrowed chords, cadences, choosing chords for a melody, left-hand accompaniment patterns, common chord progressions, and the twelve-bar blues. Shall we meet our first guest?", "cue": {"p": 103, "r": "chapters"}}, {"t0": 57.0, "t1": 58.72, "who": "P", "text": "Yes, please!", "cue": {"p": 103, "r": "chapters"}}]}]}, {"k": "M1", "part": "Part VII · Harmony in music", "t": "1 · Secondary dominants", "pages": [104, 105], "clips": [{"t": "Secondary dominants", "f": "audio/M1/01-secondary-dominants.mp3", "s": 38, "p": 104, "l": [{"t0": 3.4, "t1": 9.69, "who": "B", "text": "In C major, Clara, home is the white keys. So a black key in a chord is a guest.", "cue": {"p": 104, "r": "lead"}}, {"t0": 9.69, "t1": 15.38, "who": "G", "text": "Darling, I never stay. I always move to the very next key, and show you where the music goes next.", "cue": {"p": 104, "r": "lead"}}, {"t0": 15.38, "t1": 23.18, "who": "B", "text": "Remember: a sharp guest pushes up one key, into the next chord. It is that chord’s own five, borrowed for a moment.", "cue": {"p": 104, "r": "remember"}}, {"t0": 23.18, "t1": 31.54, "who": "B", "text": "Try it in a song: C, D, G, C. The F sharp in the D chord pushes up into G, then G leads home to C.", "cue": {"p": 104, "r": "picture"}}, {"t0": 31.54, "t1": 37.64, "who": "piano", "notes": [31.54, 32.99, 34.44, 35.89], "cue": {"p": 104, "r": "picture"}}]}, {"t": "Up one key names the next chord", "f": "audio/M1/02-up-one-key-names-the-next-chord.mp3", "s": 26, "p": 105, "l": [{"t0": 0.2, "t1": 9.35, "who": "B", "text": "C sharp goes up to D, so the next chord is D minor. F sharp goes up to G: G. G sharp goes up to A: A minor.", "cue": {"p": 105, "r": "h:Up one key names the next chord"}}, {"t0": 9.35, "t1": 17.79, "who": "B", "text": "Their names: D F sharp A is five of five. A C sharp E is five of two. E G sharp B is five of six.", "cue": {"p": 105, "r": "table"}}, {"t0": 17.79, "t1": 25.81, "who": "B", "text": "Two traps. Sharps push up, never down. And not every black key is a guest: in G major, F sharp is at home.", "cue": {"p": 105, "r": "trap"}}]}, {"t": "Example: where do the guests go?", "f": "audio/M1/03-example-where-do-the-guests-go.mp3", "s": 21, "p": 104, "l": [{"t0": 0.2, "t1": 8.94, "who": "B", "text": "B, D sharp, F sharp in C major. Two guests. Move each up one key. Which chord holds both landing notes? Pause.", "cue": {"p": 104, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M1-1-q.webp"}}, {"t0": 8.94, "t1": 13.94, "who": "pause", "text": "Pause and try.", "cue": {"p": 104, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M1-1-q.webp"}}, {"t0": 13.94, "t1": 17.61, "who": "P", "text": "D sharp goes up to E, F sharp up to G: E minor.", "cue": {"p": 104, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M1-1.webp"}}, {"t0": 17.61, "t1": 20.81, "who": "piano", "notes": [17.61, 19.06], "cue": {"p": 104, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M1-1.webp"}}]}, {"t": "Try it", "f": "audio/M1/04-try-it.mp3", "s": 14, "p": 104, "l": [{"t0": 0.2, "t1": 7.56, "who": "B", "text": "Play C, D, G, C slowly, and listen for the F sharp pushing up into G. Until next time.", "cue": {"p": 104, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/M1-3.webp"}}, {"t0": 7.56, "t1": 13.66, "who": "piano", "notes": [7.56, 9.01, 10.46, 11.91], "cue": {"p": 104, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/M1-3.webp"}}]}]}, {"k": "M2", "part": "Part VII · Harmony in music", "t": "2 · Borrowed chords", "pages": [106, 107], "clips": [{"t": "Borrowed chords", "f": "audio/M2/01-borrowed-chords.mp3", "s": 34, "p": 106, "l": [{"t0": 3.4, "t1": 12.44, "who": "B", "text": "A flat guest in a major key, Clara, is borrowed from its minor twin: the minor on the same home note. It sighs down one key.", "cue": {"p": 106, "r": "lead"}}, {"t0": 12.44, "t1": 19.03, "who": "B", "text": "Remember: borrow a chord from the minor on the same home note; its flat sighs down one key.", "cue": {"p": 106, "r": "remember"}}, {"t0": 19.03, "t1": 24.08, "who": "B", "text": "In C: C, F, F minor, C. The A flat sighs down to G.", "cue": {"p": 106, "r": "picture"}}, {"t0": 24.08, "t1": 30.18, "who": "piano", "notes": [24.08, 25.53, 26.98, 28.43], "cue": {"p": 106, "r": "picture"}}, {"t0": 30.18, "t1": 33.74, "who": "P", "text": "Sigh, then push. Like getting out of bed on a Monday.", "cue": {"p": 106, "r": "picture"}}]}, {"t": "Their names", "f": "audio/M2/02-their-names.mp3", "s": 25, "p": 107, "l": [{"t0": 0.2, "t1": 12.65, "who": "B", "text": "F A flat C is the borrowed four. A flat C E flat is the borrowed flat six. And B flat D F, flat seven, walks up instead, on to C: the rock and film ending.", "cue": {"p": 107, "r": "table"}}, {"t0": 12.65, "t1": 15.85, "who": "piano", "notes": [12.65, 14.1], "cue": {"p": 107, "r": "table"}}, {"t0": 15.85, "t1": 25.15, "who": "B", "text": "One trap: do not mix up the twins. C major and C minor share a home note; C major and A minor share a key signature.", "cue": {"p": 107, "r": "trap"}}]}, {"t": "Try it", "f": "audio/M2/03-try-it.mp3", "s": 11, "p": 106, "l": [{"t0": 0.2, "t1": 11.31, "who": "B", "text": "Play C, F, F minor, C, and hear the A flat sigh. Then C, D, G, C: the F sharp pushes instead. One sighs, one pushes. Until next time.", "cue": {"p": 106, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/M2-2.webp"}}]}]}, {"k": "M3", "part": "Part VII · Harmony in music", "t": "3 · Cadences", "pages": [108, 109], "clips": [{"t": "Cadences", "f": "audio/M3/01-cadences.mp3", "s": 48, "p": 108, "l": [{"t0": 3.4, "t1": 10.99, "who": "B", "text": "A phrase is a musical sentence, Clara, and it needs punctuation. Its last two chords are its cadence.", "cue": {"p": 108, "r": "lead"}}, {"t0": 10.99, "t1": 17.56, "who": "B", "text": "Remember: music has full stops and commas too. Listen to the last two chords of a phrase.", "cue": {"p": 108, "r": "remember"}}, {"t0": 17.56, "t1": 20.9, "who": "B", "text": "Perfect, five to one: home, the end.", "cue": {"p": 108, "r": "picture"}}, {"t0": 20.9, "t1": 24.1, "who": "piano", "notes": [20.9, 22.35], "cue": {"p": 108, "r": "picture"}}, {"t0": 24.1, "t1": 27.47, "who": "B", "text": "Plagal, four to one: a soft Amen.", "cue": {"p": 108, "r": "picture"}}, {"t0": 27.47, "t1": 30.67, "who": "piano", "notes": [27.47, 28.92], "cue": {"p": 108, "r": "picture"}}, {"t0": 30.67, "t1": 34.52, "who": "B", "text": "Imperfect, ending on five: to be continued.", "cue": {"p": 108, "r": "picture"}}, {"t0": 34.52, "t1": 37.72, "who": "piano", "notes": [34.52, 35.97], "cue": {"p": 108, "r": "picture"}}, {"t0": 37.72, "t1": 41.3, "who": "B", "text": "And interrupted, five to six: surprise!", "cue": {"p": 108, "r": "picture"}}, {"t0": 41.3, "t1": 44.5, "who": "piano", "notes": [41.3, 42.75], "cue": {"p": 108, "r": "picture"}}, {"t0": 44.5, "t1": 48.17, "who": "P", "text": "Huh?! That one tricked me. I was already putting my coat on.", "cue": {"p": 108, "r": "picture"}}]}, {"t": "Why G7 pulls home", "f": "audio/M3/02-why-g7-pulls-home.mp3", "s": 20, "p": 109, "l": [{"t0": 0.2, "t1": 10.61, "who": "B", "text": "Add the seventh to five and the full stop gets stronger. In G seven, B rises to C and F falls to E: two tiny steps, and you are home.", "cue": {"p": 109, "r": "h:Why G7 pulls home"}}, {"t0": 10.61, "t1": 13.81, "who": "piano", "notes": [10.61, 12.06], "cue": {"p": 109, "r": "h:Why G7 pulls home"}}, {"t0": 13.81, "t1": 19.97, "who": "B", "text": "One trap: not every ending on one is perfect. A perfect cadence comes from five.", "cue": {"p": 109, "r": "trap"}}]}, {"t": "Example: how does this phrase end?", "f": "audio/M3/03-example-how-does-this-phrase-end.mp3", "s": 20, "p": 108, "l": [{"t0": 0.2, "t1": 6.06, "who": "B", "text": "C, A minor, F, G. Turn the last two into numerals. Which cadence? Pause.", "cue": {"p": 108, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M3-1-q.webp"}}, {"t0": 6.06, "t1": 10.06, "who": "pause", "text": "Pause and try.", "cue": {"p": 108, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M3-1-q.webp"}}, {"t0": 10.06, "t1": 14.35, "who": "P", "text": "Four to five: it lands on five, the comma. An imperfect cadence.", "cue": {"p": 108, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M3-1.webp"}}, {"t0": 14.35, "t1": 20.45, "who": "piano", "notes": [14.35, 15.8, 17.25, 18.7], "cue": {"p": 108, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M3-1.webp"}}]}, {"t": "Example: surprise!", "f": "audio/M3/04-example-surprise.mp3", "s": 15, "p": 108, "l": [{"t0": 0.2, "t1": 5.34, "who": "B", "text": "G seven, then A minor. Which numeral, and which cadence? Pause.", "cue": {"p": 108, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/M3-4-q.webp"}}, {"t0": 5.34, "t1": 9.34, "who": "pause", "text": "Pause and try.", "cue": {"p": 108, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/M3-4-q.webp"}}, {"t0": 9.34, "t1": 12.28, "who": "P", "text": "Five to six: an interrupted cadence.", "cue": {"p": 108, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/M3-4.webp"}}, {"t0": 12.28, "t1": 15.48, "who": "piano", "notes": [12.28, 13.73], "cue": {"p": 108, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/M3-4.webp"}}]}, {"t": "Try it", "f": "audio/M3/05-try-it.mp3", "s": 9, "p": 108, "l": [{"t0": 0.2, "t1": 8.84, "who": "B", "text": "Play G seven, then C: the end. G seven, then A minor: huh? Then F, then C, and sing Amen. Until next time.", "cue": {"p": 108, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/M3-3.webp"}}]}]}, {"k": "M4", "part": "Part VII · Harmony in music", "t": "4 · Choosing chords for a melody", "pages": [110], "clips": [{"t": "Choosing chords for a melody", "f": "audio/M4/01-choosing-chords-for-a-melody.mp3", "s": 43, "p": 110, "l": [{"t0": 3.4, "t1": 11.52, "who": "B", "text": "The melody is the singer, Clara; the chords are the band. A good band plays chords that hold the singer’s main notes.", "cue": {"p": 110, "r": "lead"}}, {"t0": 11.52, "t1": 13.5, "who": "P", "text": "Can I have drums?", "cue": {"p": 110, "r": "lead"}}, {"t0": 13.5, "t1": 19.43, "who": "B", "text": "Later. Remember: look at the melody’s main notes, then pick the chord that holds them.", "cue": {"p": 110, "r": "remember"}}, {"t0": 19.43, "t1": 27.0, "who": "B", "text": "Every note of C major lives in one, four or five. C and G live in two of them: let your ear choose.", "cue": {"p": 110, "r": "picture"}}, {"t0": 27.0, "t1": 29.32, "who": "B", "text": "Twinkle, with its chords.", "cue": {"p": 110, "r": "more"}}, {"t0": 29.32, "t1": 43.2, "who": "piano", "notes": [29.32, 29.94, 30.56, 31.18, 31.8, 32.42, 33.04, 34.28, 34.9, 35.52, 36.14, 36.76, 37.38, 38.0], "cue": {"p": 110, "r": "more"}}]}, {"t": "Example: Mary Had a Little Lamb", "f": "audio/M4/02-example-mary-had-a-little-lamb.mp3", "s": 15, "p": 110, "l": [{"t0": 0.2, "t1": 6.83, "who": "B", "text": "E D C D, then E E E. Which chord holds the notes on beats one and three? Pause.", "cue": {"p": 110, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M4-1-q.webp"}}, {"t0": 6.83, "t1": 10.83, "who": "pause", "text": "Pause and try.", "cue": {"p": 110, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M4-1-q.webp"}}, {"t0": 10.83, "t1": 14.62, "who": "P", "text": "E and C live in one, and so does E: both bars take C.", "cue": {"p": 110, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M4-1.webp"}}]}, {"t": "Try it", "f": "audio/M4/03-try-it.mp3", "s": 9, "p": 110, "l": [{"t0": 0.2, "t1": 9.11, "who": "B", "text": "Bars of F A F A, D B G B and G E C E. Which chord holds each? Four, five and one. Until next time.", "cue": {"p": 110, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/M4-2.webp"}}]}]}, {"k": "M5", "part": "Part VII · Harmony in music", "t": "5 · Left-hand accompaniment patterns", "pages": [111], "clips": [{"t": "Left-hand accompaniment patterns", "f": "audio/M5/01-left-hand-accompaniment-patterns.mp3", "s": 41, "p": 111, "l": [{"t0": 3.4, "t1": 8.24, "who": "B", "text": "Once you know the chord, Clara, the left hand can play it three ways.", "cue": {"p": 111, "r": "lead"}}, {"t0": 8.24, "t1": 12.41, "who": "B", "text": "Remember: same chord, three shapes. Block, all at once.", "cue": {"p": 111, "r": "remember"}}, {"t0": 12.41, "t1": 15.61, "who": "piano", "notes": [12.41, 13.86], "cue": {"p": 111, "r": "remember"}}, {"t0": 15.61, "t1": 18.26, "who": "B", "text": "Broken, one at a time.", "cue": {"p": 111, "r": "remember"}}, {"t0": 18.26, "t1": 21.04, "who": "piano", "notes": [18.26, 18.57, 18.88, 19.19, 19.5, 19.81, 20.12, 20.43], "cue": {"p": 111, "r": "remember"}}, {"t0": 21.04, "t1": 27.22, "who": "B", "text": "And Alberti: low, high, middle, high, named after Domenico Alberti, who loved it.", "cue": {"p": 111, "r": "remember"}}, {"t0": 27.22, "t1": 30.0, "who": "piano", "notes": [27.22, 27.53, 27.84, 28.15, 28.46, 28.77, 29.08, 29.39], "cue": {"p": 111, "r": "remember"}}, {"t0": 30.0, "t1": 35.6, "who": "B", "text": "You know this one. Mozart’s Sonata in C opens with an Alberti bass.", "cue": {"p": 111, "r": "more"}}, {"t0": 35.6, "t1": 40.86, "who": "piano", "notes": [35.6, 36.84, 37.46, 38.08, 39.01, 39.17, 39.32], "cue": {"p": 111, "r": "more"}}]}, {"t": "Try it", "f": "audio/M5/02-try-it.mp3", "s": 11, "p": 111, "l": [{"t0": 0.2, "t1": 10.88, "who": "B", "text": "Left hand: C G E G, over and over, while you hum Twinkle. Then try it on F, F C A C, and on G, G D B D. Until next time.", "cue": {"p": 111, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M5-1.webp"}}]}]}, {"k": "M6", "part": "Part VII · Harmony in music", "t": "6 · Common chord progressions", "pages": [112], "clips": [{"t": "Common chord progressions", "f": "audio/M6/01-common-chord-progressions.mp3", "s": 47, "p": 112, "l": [{"t0": 3.4, "t1": 10.39, "who": "B", "text": "A progression is a trip from chord to chord, Clara. A handful of trips turn up in song after song.", "cue": {"p": 112, "r": "lead"}}, {"t0": 10.39, "t1": 13.69, "who": "P", "text": "Like everyone in town taking the same bus route?", "cue": {"p": 112, "r": "lead"}}, {"t0": 13.69, "t1": 20.75, "who": "B", "text": "Exactly. Remember: most songs take the same few trips. Home, away, a pull, and home again.", "cue": {"p": 112, "r": "remember"}}, {"t0": 20.75, "t1": 25.5, "who": "B", "text": "The pop four: one, five, six, four. C, G, A minor, F.", "cue": {"p": 112, "r": "body"}}, {"t0": 25.5, "t1": 31.6, "who": "piano", "notes": [25.5, 26.95, 28.4, 29.85], "cue": {"p": 112, "r": "body"}}, {"t0": 31.6, "t1": 34.76, "who": "B", "text": "The fifties: one, six, four, five.", "cue": {"p": 112, "r": "body"}}, {"t0": 34.76, "t1": 40.86, "who": "piano", "notes": [34.76, 36.21, 37.66, 39.11], "cue": {"p": 112, "r": "body"}}, {"t0": 40.86, "t1": 46.65, "who": "B", "text": "Learn them by numbers, and you can play them in any key. The numbers stay the same.", "cue": {"p": 112, "r": "body"}}]}, {"t": "Example: the pop four in A", "f": "audio/M6/02-example-the-pop-four-in-a.mp3", "s": 21, "p": 112, "l": [{"t0": 0.2, "t1": 7.0, "who": "B", "text": "Play the pop four in A major. Find notes one, five, six and four of the scale. Pause.", "cue": {"p": 112, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M6-1-q.webp"}}, {"t0": 7.0, "t1": 12.0, "who": "pause", "text": "Pause and try.", "cue": {"p": 112, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M6-1-q.webp"}}, {"t0": 12.0, "t1": 14.56, "who": "P", "text": "A, E, F sharp minor and D.", "cue": {"p": 112, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M6-1.webp"}}, {"t0": 14.56, "t1": 20.66, "who": "piano", "notes": [14.56, 16.01, 17.46, 18.91], "cue": {"p": 112, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/M6-1.webp"}}]}, {"t": "Try it", "f": "audio/M6/03-try-it.mp3", "s": 10, "p": 112, "l": [{"t0": 0.2, "t1": 9.65, "who": "B", "text": "Play C, G, A minor, F, four beats each, round four times without stopping, and hum any tune you like over it. Until next time.", "cue": {"p": 112, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/M6-3.webp"}}]}]}, {"k": "M7", "part": "Part VII · Harmony in music", "t": "7 · The twelve-bar blues", "pages": [113], "clips": [{"t": "The twelve-bar blues", "f": "audio/M7/01-the-twelve-bar-blues.mp3", "s": 50, "p": 113, "l": [{"t0": 3.4, "t1": 10.76, "who": "B", "text": "Blues, boogie-woogie and early rock ’n’ roll all ride on one pattern of chords, Clara, twelve bars long.", "cue": {"p": 113, "r": "lead"}}, {"t0": 10.76, "t1": 18.11, "who": "B", "text": "Remember: twelve bars, three chords. Four of one, two of four, two of one, then five, four, one, five.", "cue": {"p": 113, "r": "remember"}}, {"t0": 18.11, "t1": 35.81, "who": "piano", "notes": [18.11, 19.56, 21.01, 22.46, 23.91, 25.36, 26.81, 28.26, 29.71, 31.16, 32.61, 34.06], "cue": {"p": 113, "r": "picture"}}, {"t0": 35.81, "t1": 39.56, "who": "B", "text": "Make it bluesy: turn every chord into a seventh.", "cue": {"p": 113, "r": "picture"}}, {"t0": 39.56, "t1": 45.66, "who": "piano", "notes": [39.56, 41.01, 42.46, 43.91], "cue": {"p": 113, "r": "picture"}}, {"t0": 45.66, "t1": 50.26, "who": "B", "text": "And that is the end of Part Seven, Clara. Until next time.", "cue": {"p": 113, "r": "picture"}}]}]}, {"k": "O8", "part": "Part VIII · Shape and style", "t": "Part opener", "pages": [114], "clips": [{"t": "Part Eight: Shape and style", "f": "audio/O8/01-part-eight-shape-and-style.mp3", "s": 62, "p": 114, "l": [{"t0": 3.4, "t1": 8.52, "who": "B", "text": "Welcome to Part Eight, Clara: Shape and style. How music is built.", "cue": {"p": 114, "r": "opener"}}, {"t0": 8.52, "t1": 22.55, "who": "B", "text": "Step back from the notes and see the building: small ideas, repeated and moved, in sections that come and go. Listen: an idea, the same idea again, something new, and the first idea once more.", "cue": {"p": 114, "r": "opener"}}, {"t0": 22.55, "t1": 44.06, "who": "piano", "notes": [22.55, 23.17, 23.79, 24.41, 25.03, 25.65, 26.27, 27.76, 28.38, 29.0, 29.62, 30.24, 30.86, 31.48, 32.97, 33.59, 34.21, 34.83, 35.45, 36.07, 36.69, 37.31, 38.8, 39.42, 40.04, 40.66, 41.28, 41.9, 42.52], "cue": {"p": 114, "r": "opener"}}, {"t0": 44.06, "t1": 46.14, "who": "P", "text": "It came home at the end!", "cue": {"p": 114, "r": "opener"}}, {"t0": 46.14, "t1": 60.54, "who": "B", "text": "Seven chapters: motifs, phrases, repetition, sequence and imitation, texture, changing key, musical form, and the musical periods from Baroque to Modern. Shall we begin with the smallest idea of all?", "cue": {"p": 114, "r": "chapters"}}, {"t0": 60.54, "t1": 62.13, "who": "P", "text": "Let’s go!", "cue": {"p": 114, "r": "chapters"}}]}]}, {"k": "F1", "part": "Part VIII · Shape and style", "t": "1 · Motifs", "pages": [115], "clips": [{"t": "Motifs", "f": "audio/F1/01-motifs.mp3", "s": 36, "p": 115, "l": [{"t0": 3.4, "t1": 14.62, "who": "B", "text": "A tune is built like a story, Clara. Its smallest idea, the motif, is like a word: a few notes with a shape and rhythm you can recognise when they come back.", "cue": {"p": 115, "r": "lead"}}, {"t0": 14.62, "t1": 20.67, "who": "B", "text": "Remember: a motif is a short idea, a few notes long, that keeps coming back.", "cue": {"p": 115, "r": "remember"}}, {"t0": 20.67, "t1": 30.12, "who": "B", "text": "The most famous of all: four notes, short, short, short, long. Beethoven builds the whole first movement of his Fifth Symphony from them.", "cue": {"p": 115, "r": "picture"}}, {"t0": 30.12, "t1": 36.25, "who": "piano", "notes": [30.12, 30.43, 30.74, 31.05, 33.16, 33.47, 33.78, 34.09], "cue": {"p": 115, "r": "picture"}}]}, {"t": "Example: find the motif", "f": "audio/F1/02-example-find-the-motif.mp3", "s": 18, "p": 115, "l": [{"t0": 0.2, "t1": 5.27, "who": "B", "text": "Look at bar one: what shape and rhythm? Then bars two and three. Pause.", "cue": {"p": 115, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F1-1-q.webp"}}, {"t0": 5.27, "t1": 9.27, "who": "pause", "text": "Pause and try.", "cue": {"p": 115, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F1-1-q.webp"}}, {"t0": 9.27, "t1": 13.71, "who": "P", "text": "Step, step, long: three notes. It comes three times, each a step higher.", "cue": {"p": 115, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F1-1.webp"}}, {"t0": 13.71, "t1": 18.23, "who": "piano", "notes": [13.71, 14.02, 14.33, 15.2, 15.51, 15.82, 16.69, 17.0, 17.31], "cue": {"p": 115, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F1-1.webp"}}]}, {"t": "Try it", "f": "audio/F1/03-try-it.mp3", "s": 10, "p": 115, "l": [{"t0": 0.2, "t1": 10.44, "who": "B", "text": "Tap Beethoven’s rhythm on the lid, then make up a three-note motif of your own and play it starting on C, then D, then E. Until next time.", "cue": {"p": 115, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/F1-2.webp"}}]}]}, {"k": "F2", "part": "Part VIII · Shape and style", "t": "2 · Phrases: question and answer", "pages": [116], "clips": [{"t": "Phrases: question and answer", "f": "audio/F2/01-phrases-question-and-answer.mp3", "s": 50, "p": 116, "l": [{"t0": 3.4, "t1": 11.99, "who": "B", "text": "A phrase is a musical sentence, Clara, usually four bars long. Two phrases often make a question and its answer.", "cue": {"p": 116, "r": "lead"}}, {"t0": 11.99, "t1": 14.51, "who": "P", "text": "Bye, Butler? That was a question.", "cue": {"p": 116, "r": "lead"}}, {"t0": 14.51, "t1": 21.86, "who": "B", "text": "Very good. Remember: a question phrase ends away from home; the answer comes home to the key note.", "cue": {"p": 116, "r": "remember"}}, {"t0": 21.86, "t1": 26.31, "who": "B", "text": "Ode to Joy: the first phrase ends on D, a question.", "cue": {"p": 116, "r": "picture"}}, {"t0": 26.31, "t1": 36.53, "who": "piano", "notes": [26.31, 26.93, 27.55, 28.17, 28.79, 29.41, 30.03, 30.65, 31.27, 31.89, 32.51, 33.13, 33.75, 34.68, 34.99], "cue": {"p": 116, "r": "picture"}}, {"t0": 36.53, "t1": 39.9, "who": "B", "text": "The second comes home to C: the answer.", "cue": {"p": 116, "r": "picture"}}, {"t0": 39.9, "t1": 50.12, "who": "piano", "notes": [39.9, 40.52, 41.14, 41.76, 42.38, 43.0, 43.62, 44.24, 44.86, 45.48, 46.1, 46.72, 47.34, 48.27, 48.58], "cue": {"p": 116, "r": "picture"}}]}, {"t": "Example: question or answer?", "f": "audio/F2/02-example-question-or-answer.mp3", "s": 12, "p": 116, "l": [{"t0": 0.2, "t1": 6.19, "who": "B", "text": "The key is C major. This phrase ends on D. Question or answer? Pause.", "cue": {"p": 116, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F2-1-q.webp"}}, {"t0": 6.19, "t1": 9.19, "who": "pause", "text": "Pause and try.", "cue": {"p": 116, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F2-1-q.webp"}}, {"t0": 9.19, "t1": 11.77, "who": "P", "text": "D is not home: a question.", "cue": {"p": 116, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F2-1.webp"}}]}, {"t": "Try it", "f": "audio/F2/03-try-it.mp3", "s": 8, "p": 116, "l": [{"t0": 0.2, "t1": 8.22, "who": "B", "text": "Sing a question and stop on D: it hangs in the air. Then sing the answer and land on C. Until next time.", "cue": {"p": 116, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/F2-2.webp"}}]}]}, {"k": "F3", "part": "Part VIII · Shape and style", "t": "3 · Repetition, sequence and imitation", "pages": [117, 118], "clips": [{"t": "Repetition, sequence and imitation", "f": "audio/F3/01-repetition-sequence-and-imitation.mp3", "s": 49, "p": 117, "l": [{"t0": 3.4, "t1": 7.81, "who": "B", "text": "Composers make one idea go a long way, Clara.", "cue": {"p": 117, "r": "lead"}}, {"t0": 7.81, "t1": 10.88, "who": "P", "text": "Like my mum making soup out of leftovers?", "cue": {"p": 117, "r": "lead"}}, {"t0": 10.88, "t1": 17.62, "who": "B", "text": "Exactly like that. Remember: again, again higher, again in the other hand, or something new.", "cue": {"p": 117, "r": "remember"}}, {"t0": 17.62, "t1": 20.77, "who": "B", "text": "Repetition: the same notes again.", "cue": {"p": 117, "r": "table"}}, {"t0": 20.77, "t1": 26.28, "who": "piano", "notes": [20.77, 21.39, 22.01, 22.63, 23.5, 24.12, 24.74, 25.36], "cue": {"p": 117, "r": "table"}}, {"t0": 26.28, "t1": 30.31, "who": "B", "text": "Sequence: the same shape, starting higher or lower.", "cue": {"p": 117, "r": "table"}}, {"t0": 30.31, "t1": 38.55, "who": "piano", "notes": [30.31, 30.93, 31.55, 32.17, 33.04, 33.66, 34.28, 34.9, 35.77, 36.39, 37.01, 37.63], "cue": {"p": 117, "r": "table"}}, {"t0": 38.55, "t1": 43.81, "who": "B", "text": "Imitation: another hand copies it. And contrast: something new.", "cue": {"p": 117, "r": "table"}}, {"t0": 43.81, "t1": 49.07, "who": "piano", "notes": [43.81, 44.43, 45.05, 45.67], "cue": {"p": 117, "r": "table"}}]}, {"t": "Example: repetition or sequence?", "f": "audio/F3/02-example-repetition-or-sequence.mp3", "s": 14, "p": 117, "l": [{"t0": 0.2, "t1": 6.38, "who": "B", "text": "Bar one, bar two, bar three: the same notes, or the same shape on new notes? Pause.", "cue": {"p": 117, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/F3-2-q.webp"}}, {"t0": 6.38, "t1": 10.38, "who": "pause", "text": "Pause and try.", "cue": {"p": 117, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/F3-2-q.webp"}}, {"t0": 10.38, "t1": 13.96, "who": "P", "text": "The same shape, a step higher each bar: a sequence.", "cue": {"p": 117, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/F3-2.webp"}}]}, {"t": "Example: which hand copies?", "f": "audio/F3/03-example-which-hand-copies.mp3", "s": 14, "p": 117, "l": [{"t0": 0.2, "t1": 5.23, "who": "B", "text": "The right hand starts; the left hand waits a bar. Then what? Pause.", "cue": {"p": 117, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F3-3-q.webp"}}, {"t0": 5.23, "t1": 9.23, "who": "pause", "text": "Pause and try.", "cue": {"p": 117, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F3-3-q.webp"}}, {"t0": 9.23, "t1": 13.6, "who": "P", "text": "The left hand imitates the right, one bar later, two octaves down.", "cue": {"p": 117, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F3-3.webp"}}]}, {"t": "Try it: Frère Jacques", "f": "audio/F3/04-try-it-fr-re-jacques.mp3", "s": 23, "p": 117, "l": [{"t0": 0.2, "t1": 13.27, "who": "B", "text": "In Frère Jacques every bar is sung twice: repetition. Sung as a round, each voice enters two bars after the last: imitation. Sing it as a round with a friend. Until next time.", "cue": {"p": 117, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/F3-6.webp"}}, {"t0": 13.27, "t1": 23.49, "who": "piano", "notes": [13.27, 13.89, 14.51, 15.13, 15.75, 16.37, 16.99, 17.61, 18.23, 18.85, 19.47, 20.71, 21.33, 21.95], "cue": {"p": 117, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/F3-6.webp"}}]}]}, {"k": "F4", "part": "Part VIII · Shape and style", "t": "4 · Texture: monophonic, homophonic, polyphonic", "pages": [119, 120], "clips": [{"t": "Texture", "f": "audio/F4/01-texture.mp3", "s": 45, "p": 119, "l": [{"t0": 3.4, "t1": 8.0, "who": "B", "text": "Run your fingers over your jumper, Clara. Feel the threads?", "cue": {"p": 119, "r": "lead"}}, {"t0": 8.0, "t1": 15.49, "who": "B", "text": "Music has threads too. How many lines are sounding at once, and how do they fit together? That is its texture.", "cue": {"p": 119, "r": "lead"}}, {"t0": 15.49, "t1": 21.78, "who": "B", "text": "Remember: count the lines. One alone, a tune with chords, or tunes woven together.", "cue": {"p": 119, "r": "remember"}}, {"t0": 21.78, "t1": 24.76, "who": "B", "text": "Monophonic: one line alone.", "cue": {"p": 119, "r": "table"}}, {"t0": 24.76, "t1": 28.78, "who": "piano", "notes": [24.76, 25.38, 26.0, 26.62, 27.24], "cue": {"p": 119, "r": "table"}}, {"t0": 28.78, "t1": 32.31, "who": "B", "text": "Homophonic: a tune with chords underneath.", "cue": {"p": 119, "r": "table"}}, {"t0": 32.31, "t1": 36.96, "who": "piano", "notes": [32.31, 32.93, 33.55], "cue": {"p": 119, "r": "table"}}, {"t0": 36.96, "t1": 40.76, "who": "B", "text": "Polyphonic: two or more tunes woven together.", "cue": {"p": 119, "r": "table"}}, {"t0": 40.76, "t1": 44.78, "who": "piano", "notes": [40.76, 41.38, 42.0, 42.62, 43.24], "cue": {"p": 119, "r": "table"}}]}, {"t": "Example: which hand has the tune?", "f": "audio/F4/02-example-which-hand-has-the-tune.mp3", "s": 16, "p": 119, "l": [{"t0": 0.2, "t1": 7.45, "who": "B", "text": "The right hand repeats two-note chords; the left hand moves step by step. Which should sing out? Pause.", "cue": {"p": 119, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F4-3-q.webp"}}, {"t0": 7.45, "t1": 11.45, "who": "pause", "text": "Pause and try.", "cue": {"p": 119, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F4-3-q.webp"}}, {"t0": 11.45, "t1": 15.77, "who": "P", "text": "The left hand has the tune. Play it louder, and keep the right hand soft.", "cue": {"p": 119, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F4-3.webp"}}]}, {"t": "Try it", "f": "audio/F4/03-try-it.mp3", "s": 11, "p": 119, "l": [{"t0": 0.2, "t1": 11.42, "who": "B", "text": "In Mozart’s Sonata in C the right hand sings and the left hand rocks: an Alberti bass. Play only the left hand, softly and evenly. Until next time.", "cue": {"p": 119, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/F4-4.webp"}}]}]}, {"k": "F5", "part": "Part VIII · Shape and style", "t": "5 · Changing key (modulation)", "pages": [121], "clips": [{"t": "Changing key", "f": "audio/F5/01-changing-key.mp3", "s": 38, "p": 121, "l": [{"t0": 3.4, "t1": 11.59, "who": "B", "text": "Music can travel to a new key, Clara, and it usually comes home before the end. The move is called a modulation.", "cue": {"p": 121, "r": "lead"}}, {"t0": 11.59, "t1": 13.84, "who": "P", "text": "Does it send a postcard?", "cue": {"p": 121, "r": "lead"}}, {"t0": 13.84, "t1": 21.33, "who": "B", "text": "In a way. Remember: a new sharp or flat that keeps coming back, then a cadence, and you are in a new key.", "cue": {"p": 121, "r": "remember"}}, {"t0": 21.33, "t1": 31.73, "who": "B", "text": "A piece in C major usually visits its neighbours on the circle of fifths. F sharp takes it to G major; B flat takes it to F major.", "cue": {"p": 121, "r": "table"}}, {"t0": 31.73, "t1": 38.23, "who": "piano", "notes": [31.73, 32.35, 32.97, 33.59, 34.21, 34.83, 35.45, 36.07, 36.69], "cue": {"p": 121, "r": "table"}}]}, {"t": "Example: where does the key change?", "f": "audio/F5/02-example-where-does-the-key-change.mp3", "s": 12, "p": 121, "l": [{"t0": 0.2, "t1": 6.79, "who": "B", "text": "B flat in bar two, again in bar three, and the phrase lands on F. Which key? Pause.", "cue": {"p": 121, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F5-1-q.webp"}}, {"t0": 6.79, "t1": 9.79, "who": "pause", "text": "Pause and try.", "cue": {"p": 121, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F5-1-q.webp"}}, {"t0": 9.79, "t1": 12.45, "who": "P", "text": "F major: one flat, B flat.", "cue": {"p": 121, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F5-1.webp"}}]}, {"t": "Example: just passing?", "f": "audio/F5/03-example-just-passing.mp3", "s": 17, "p": 121, "l": [{"t0": 0.2, "t1": 6.89, "who": "B", "text": "One F sharp in a bar of C major, then plain F everywhere after. A new key? Pause.", "cue": {"p": 121, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F5-3-q.webp"}}, {"t0": 6.89, "t1": 10.89, "who": "pause", "text": "Pause and try.", "cue": {"p": 121, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F5-3-q.webp"}}, {"t0": 10.89, "t1": 17.2, "who": "P", "text": "No. One passing F sharp is a decoration. A modulation keeps its new note and lands with a cadence.", "cue": {"p": 121, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F5-3.webp"}}]}, {"t": "Try it", "f": "audio/F5/04-try-it.mp3", "s": 11, "p": 121, "l": [{"t0": 0.2, "t1": 10.99, "who": "B", "text": "Play the same four bars twice: once with F natural, once with F sharp. With the F sharp, the G at the end sounds like a new home. Until next time.", "cue": {"p": 121, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/F5-4.webp"}}]}]}, {"k": "F6", "part": "Part VIII · Shape and style", "t": "6 · Musical form: binary, ternary, rondo", "pages": [122, 123], "clips": [{"t": "Musical form", "f": "audio/F6/01-musical-form.mp3", "s": 31, "p": 122, "l": [{"t0": 3.4, "t1": 11.29, "who": "B", "text": "Form is the map of a whole piece, Clara: which sections come, in what order, and which come back. Letters name them.", "cue": {"p": 122, "r": "lead"}}, {"t0": 11.29, "t1": 15.74, "who": "B", "text": "Remember: same music, same letter. New music, next letter.", "cue": {"p": 122, "r": "remember"}}, {"t0": 15.74, "t1": 30.52, "who": "B", "text": "Binary, A B: two halves, often each repeated, like a Baroque minuet. Ternary, A B A: out, away, and back. Rondo, A B A C A: A keeps coming home. And theme and variations: one tune in new clothes.", "cue": {"p": 122, "r": "table"}}]}, {"t": "Listen for it", "f": "audio/F6/02-listen-for-it.mp3", "s": 20, "p": 123, "l": [{"t0": 0.2, "t1": 9.69, "who": "B", "text": "The Minuet in G is binary. Für Elise is a rondo. And Mozart wrote twelve variations on the tune we know as Twinkle.", "cue": {"p": 123, "r": "more"}}, {"t0": 9.69, "t1": 19.84, "who": "B", "text": "Going further: sonata form, in the big first movements of sonatas and symphonies, has an exposition, a development and a recapitulation.", "cue": {"p": 123, "r": "more"}}]}, {"t": "Example: which letter makes it ternary?", "f": "audio/F6/03-example-which-letter-makes-it-ternary.mp3", "s": 10, "p": 122, "l": [{"t0": 0.2, "t1": 4.8, "who": "B", "text": "A, B, and a box. Ternary goes out, away and…? Pause.", "cue": {"p": 122, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F6-1-q.webp"}}, {"t0": 4.8, "t1": 7.8, "who": "pause", "text": "Pause and try.", "cue": {"p": 122, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F6-1-q.webp"}}, {"t0": 7.8, "t1": 9.65, "who": "P", "text": "A! A B A.", "cue": {"p": 122, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F6-1.webp"}}]}, {"t": "Example: map Twinkle", "f": "audio/F6/04-example-map-twinkle.mp3", "s": 14, "p": 122, "l": [{"t0": 0.2, "t1": 8.13, "who": "B", "text": "Twinkle: bars one to four are A. Bars five to eight are new. The last four repeat the first. Pause and name it.", "cue": {"p": 122, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F6-3-q.webp"}}, {"t0": 8.13, "t1": 12.13, "who": "pause", "text": "Pause and try.", "cue": {"p": 122, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F6-3-q.webp"}}, {"t0": 12.13, "t1": 14.22, "who": "P", "text": "A B A: ternary.", "cue": {"p": 122, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F6-3.webp"}}]}, {"t": "Try it: Für Elise", "f": "audio/F6/05-try-it-f-r-elise.mp3", "s": 16, "p": 122, "l": [{"t0": 0.2, "t1": 12.46, "who": "B", "text": "Für Elise’s famous opening tune is A. It comes three times, with two new sections between. Listen, and raise your hand every time A returns.
