<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Read and Listen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Playfair+Display:wght@700;800&display=swap">
<style>
/* Layout: a reading desk. The page fills the left; the Butler's clips sit beside it (below it on a phone). */
:root{--bg:#ffffff;--panel:#ffffff;--ink:#26296b;--soft:#5a5d8f;--line:#e3e1ee;--accent:#e4572e;--accentbg:#fdece5;--paper:#ffffff;
 --display:'Playfair Display',Georgia,serif;--body:'Atkinson Hyperlegible',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14153a;--panel:#1e2050;--ink:#eceefe;--soft:#b3b5dc;--line:#33366e;--accent:#ff7a52;--accentbg:#3a2620;--paper:#f7f6f1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14153a;--panel:#1e2050;--ink:#eceefe;--soft:#b3b5dc;--line:#33366e;--accent:#ff7a52;--accentbg:#3a2620;--paper:#f7f6f1;color-scheme:dark}
html,body{margin:0} #veil{position:absolute;inset:0;pointer-events:none} #veil .vl{position:absolute;background:rgba(251,250,246,.93);border-radius:3px;display:flex;align-items:center;justify-content:center;font:italic 700 12px Georgia,serif;color:#a3a5c6;letter-spacing:.04em} .embed .top,.embed .prac{display:none!important} .embed .desk{padding-top:4px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;margin-right:auto}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
select{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;max-width:1180px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:880px){.desk{grid-template-columns:minmax(0,1fr)}}
.reader{min-width:0;width:100%;max-width:calc((100vh - 190px) / 1.414);justify-self:center} @media (max-width:880px){.reader{max-width:100%}}
.sheet{background:var(--paper);border-radius:4px;box-shadow:0 2px 10px rgba(20,22,60,.12);overflow:hidden;aspect-ratio:210/297;max-width:100%;display:flex;align-items:center;justify-content:center}
.sheet{position:relative} .stage{position:relative;width:100%;transform-origin:0 0;transition:transform .6s ease}
.sheet img{width:100%;height:auto;display:block}
.hl{position:absolute;border:3px solid var(--accent);border-radius:8px;box-shadow:0 0 0 9999px rgba(20,22,60,.18);} .hl.fog{box-shadow:0 0 0 9999px rgba(255,255,255,.94)} .cov{position:absolute;background:#fff;border-radius:3px;pointer-events:none} .cov.res{background:#fff7f3;border:1.5px dashed #e4572e;display:flex;align-items:center;justify-content:center;font:700 clamp(9px,1.4vw,14px) var(--body);color:#e4572e} .hl{transition:all .5s ease;pointer-events:none}
.sub mark,#sub mark{background:#fde3d8;color:#26296b;border-radius:3px;padding:0 2px} .mk{position:absolute;width:3.2%;aspect-ratio:1;border-radius:50%;border:3px solid var(--accent);background:rgba(228,87,46,.25);transform:translate(-50%,-50%);pointer-events:none;animation:pop .35s ease}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.sub{min-height:3.2em;margin-top:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15.5px}
.sub b{color:var(--accent);margin-right:6px} .sub:empty{display:none}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px} .ctl .btn{padding:6px 12px;font-size:14px} .ctl .sp{font-size:12.5px;padding:4px 7px;border-radius:999px} .ctl .sp.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.prac{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px} .prac .ph{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)} .prac a{display:block;font-weight:700;font-size:14.5px;color:var(--ink);text-decoration:none;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--bg)} .prac a b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)} .prac a span{display:block} .prac a.ndr{border-color:var(--accent)} .prac a.ndr b{color:var(--accent)} .prac a:hover{border-color:var(--accent)} .prac .nhint{margin:2px 0 0;font-size:12.5px;color:var(--soft)}
#lens:not(:empty){position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.82);z-index:3;pointer-events:none}   /* her 9 Nov: one place to look - the lens in the middle, the page faded behind */
.lens{position:relative;width:90%;background:#fff;border:4px solid var(--accent);border-radius:22px;box-shadow:0 10px 30px rgba(20,22,60,.28);padding:6px 10px 2px;animation:lz .35s ease;z-index:3;pointer-events:none} .seek{margin:8px 0 10px} .seek .sr{display:flex;align-items:center;gap:8px} .seek input{flex:1;accent-color:#e4572e} .seek #tm{font:600 12px var(--body);color:#5a5d8f;min-width:76px;text-align:right} .seek .sb{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px} .seek .sb .btn{font-size:12px;padding:4px 8px} .lens .lh{display:flex;align-items:center;gap:6px;font:700 clamp(10px,1.6vw,14px) var(--body);letter-spacing:.12em;text-transform:uppercase;color:#e4572e} .lens svg{display:block;width:100%;height:auto}
#lens .popl{width:94%;max-width:720px;padding:6px} #lens .penl{pointer-events:auto;max-width:620px;max-height:96%;overflow:auto} .penw{padding:4px 2px 8px} .penw .pdraw{max-width:470px;margin:0 auto;background:#f6f6fb;border-radius:12px;padding:4px} .penw .pfront{max-width:300px} .penw .pfing{max-width:240px} .penw .pdraw svg{width:100%;height:auto;display:block} .pchips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px} .pch{font:600 12.5px var(--body);border:1.5px solid #d9d7e8;background:#fff;color:#26296b;border-radius:14px;padding:3px 9px;cursor:pointer} .pch.on{background:#26296b;color:#fff;border-color:#26296b} .pch .px{color:#e4572e} .psl{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:6px 0} .psl label{display:flex;flex-direction:column;font:700 12px var(--body);color:#26296b} .psl input{accent-color:#e4572e;width:100%} .pck{display:flex;flex-direction:column;gap:3px;font:13px/1.35 var(--body);color:#26296b} .pck>div{background:#f6f6fb;border-radius:7px;padding:4px 8px} .pck .ok b{color:#2e8a6e} .pck .no b{color:#c8361b} .pck span{color:#6d6f9c}
#lens .fold{opacity:.55;animation:fold 1.8s ease-in-out .5s forwards} #lens .meet{animation:meet .5s ease 2.3s forwards}
@keyframes fold{from{transform:scaleY(1)}to{transform:scaleY(-1)}} @keyframes meet{to{opacity:1}}
@keyframes lz{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.follow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);margin-top:8px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.pgno{font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.side{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px;align-self:start;position:sticky;top:12px}
.side h2{font-family:var(--display);font-size:22px;margin:0 0 2px;text-wrap:balance}
.kick{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.play{display:flex;align-items:center;gap:10px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:700;margin:12px 0 8px}
.play svg{flex:none}
.clips{display:grid;gap:6px}
.clip{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.clip .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.clip .s{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.clip.on{border-color:var(--accent);background:var(--accentbg)} .clip.on .n{background:var(--accent);border-color:var(--accent);color:#fff}
audio{width:100%;margin-top:10px}
.none{color:var(--soft);font-size:14.5px;margin:10px 0 0}
.who{font-size:13px;color:var(--soft);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto} .stage,.hl{transition:none}}
</style></head><body>
<header class="top"><div class="brand"><small>The Piano Butler Handbook</small>Read and listen</div><label class="sr" for="ch" style="position:absolute;left:-9999px">Chapter</label><select id="ch"></select></header>
<main class="desk">
 <section class="reader"><a class="sheet" id="zoom" target="_blank" rel="noopener" title="Open the page full size"><div class="stage" id="stage"><img id="img" alt=""><div id="veil"></div><div id="ov"></div></div><div id="lens"></div></a><div class="sub" id="sub"></div>
  <div class="nav"><button class="btn" id="prev">‹ Page</button><span class="pgno" id="pgno"></span><button class="btn" id="next">Page ›</button></div></section>
 <aside class="side" id="side"></aside>
</main>
<script>
const CH = [{"k": "W", "part": "Welcome", "t": "Welcome", "pages": [1], "clips": [{"t": "Welcome", "f": "audio/W/01-welcome.mp3", "s": 51, "p": 1, "l": [{"t0": 3.4, "t1": 14.79, "who": "B", "text": "Good day, and welcome. I am the Piano Butler. I look after everything a pianist needs to read and understand music, and I explain it one chapter at a time.", "cue": {"p": 1, "r": "cover"}}, {"t0": 14.79, "t1": 20.59, "who": "P", "text": "Hello! I am Clara. I can play a few tunes, but I want to know what all the signs on the page mean.", "cue": {"p": 1, "r": "cover"}}, {"t0": 20.59, "t1": 36.77, "who": "B", "text": "Then you shall be my pupil, Miss Clara. Every chapter starts with one page that holds everything you need. The box marked Remember is the one line to keep. And the worked examples are here, in Read and listen, where we go through them together.", "cue": {"p": 1, "r": "cover"}}, {"t0": 36.77, "t1": 47.75, "who": "B", "text": "You will also meet Their Majesties. The Queen of the Treble rules the high notes and the King of the Bass rules the low ones. They are rather particular about their lines.", "cue": {"p": 1, "r": "cover"}}, {"t0": 47.75, "t1": 51.4, "who": "P", "text": "A real Queen and King? I had better practise my bow.", "cue": {"p": 1, "r": "cover"}}]}]}, {"k": "GD", "part": "Before you play", "t": "How to read this book", "pages": [17]}, {"k": "BP", "part": "Before you play", "t": "Posture and hand shape", "pages": [18, 19, 20], "clips": [{"t": "Before you play", "f": "audio/BP/01-before-you-play.mp3", "s": 37, "p": 18, "l": [{"t0": 3.4, "t1": 7.19, "who": "P", "text": "Butler! I want to play something right now. Can I just start?", "cue": {"p": 18, "r": "h:Posture and hand shape"}}, {"t0": 7.19, "t1": 13.16, "who": "B", "text": "In one minute, Clara. First we set up the most important instrument in the room.", "cue": {"p": 18, "r": "h:Posture and hand shape"}}, {"t0": 13.16, "t1": 14.74, "who": "P", "text": "The piano?", "cue": {"p": 18, "r": "lead"}}, {"t0": 14.74, "t1": 27.42, "who": "B", "text": "You. How you sit and how you hold your hands decide how easy everything else will be. Set them up before the first note, check them every time you sit down, and soon they look after themselves.", "cue": {"p": 18, "r": "lead"}}, {"t0": 27.42, "t1": 37.13, "who": "B", "text": "Here is the secret: sit tall, forearms level with the keys, a round hand on the fingertips. Then let the weight of your arm do the work.", "cue": {"p": 18, "r": "secret"}}]}, {"t": "How to sit", "f": "audio/BP/02-how-to-sit.mp3", "s": 37, "p": 19, "l": [{"t0": 0.2, "t1": 7.85, "who": "B", "text": "Look at the picture. One: forearms level with the keys, like a table top. The wrist neither drops nor lifts.", "cue": {"p": 18, "r": "hero", "lab": ["1"], "anim": "pen-sit:good"}, "lens": {"k": "pen-sit:good", "at": [], "full": true}}, {"t0": 7.85, "t1": 13.18, "who": "B", "text": "Two: elbows a little in front of you, not pinned to your sides like a penguin.", "cue": {"p": 18, "r": "hero", "lab": ["2"], "anim": "pen-front:good"}, "lens": {"k": "pen-front:good", "at": [], "full": true}}, {"t0": 13.18, "t1": 16.08, "who": "P", "text": "Penguins can’t play the piano anyway.", "cue": {"p": 18, "r": "hero", "lab": ["2"], "anim": "pen-front:tight"}, "lens": {"k": "pen-front:tight", "at": [], "full": true}}, {"t0": 16.08, "t1": 28.96, "who": "B", "text": "Quite right. Three: sit on the front half of the stool, opposite Middle C. Four: feet flat on the floor, the right foot near the pedal. Five: back tall, shoulders loose, leaning a little towards the keys.", "cue": {"p": 18, "r": "hero", "lab": ["3"], "anim": "pen-sit:good"}, "lens": {"k": "pen-sit:good", "at": [], "full": true}}, {"t0": 28.96, "t1": 37.02, "who": "B", "text": "If the stool is too low, raise it, or sit on a cushion. A telephone book works too, if anyone still has one.", "cue": {"p": 18, "r": "hero", "lab": ["5"], "anim": "pen-sit:low"}, "lens": {"k": "pen-sit:low", "at": [], "full": true}}]}, {"t": "A round hand", "f": "audio/BP/03-a-round-hand.mp3", "s": 30, "p": 19, "l": [{"t0": 0.2, "t1": 13.32, "who": "B", "text": "Now the hands. Imagine a soft ball resting under your palm. That shape is your playing hand: knuckles up like a bridge, fingers curved, and the sound comes from the fingertip, just behind the nail.", "cue": {"p": 18, "r": "two", "anim": "pen-hand:good"}, "lens": {"k": "pen-hand:good", "at": [], "full": true}}, {"t0": 13.32, "t1": 22.51, "who": "B", "text": "The thumb plays on the side of its tip, relaxed. And the wrist stays level and loose. It never rests on the wood, however tired it is.", "cue": {"p": 18, "r": "ht", "anim": "pen-hand:low"}, "lens": {"k": "pen-hand:low", "at": [], "full": true}}, {"t0": 22.51, "t1": 25.08, "who": "P", "text": "So I keep my nails short too?", "cue": {"p": 18, "r": "ht"}}, {"t0": 25.08, "t1": 30.45, "who": "B", "text": "Short nails, happy keys. A long nail clicks like a tap-dancing mouse.", "cue": {"p": 18, "r": "ht"}}]}, {"t": "Finger numbers", "f": "audio/BP/04-finger-numbers.mp3", "s": 79, "p": 19, "l": [{"t0": 0.2, "t1": 12.63, "who": "B", "text": "Every finger has a number, the same in both hands. The thumb is one, then two, three, four, and the little finger is five. Music often prints these numbers above or below the notes.", "cue": {"p": 19, "r": "two", "anim": "pen-fing:cycle"}, "lens": {"k": "pen-fing:cycle", "at": [], "full": true}}, {"t0": 12.63, "t1": 16.57, "who": "P", "text": "So my left thumb is one too, even though it’s on the other side?", "cue": {"p": 19, "r": "two", "anim": "pen-fing:cycle"}, "lens": {"k": "pen-fing:cycle", "at": [], "full": true}}, {"t0": 16.57, "t1": 22.84, "who": "B", "text": "Exactly. Thumbs are always one. Now six warm-ups before you play. Watch them move.", "cue": {"p": 19, "r": "h:Six warm-ups"}}, {"t0": 22.84, "t1": 30.3, "who": "B", "text": "One, rag doll: flop forward, arms hanging heavy. Shake them loose, then float the hands up onto the keys.", "cue": {"p": 19, "r": "wu6", "anim": "warm-ragdoll"}, "lens": {"k": "warm-ragdoll", "at": [], "full": true}}, {"t0": 30.3, "t1": 32.94, "who": "P", "text": "I’m a rag doll! Floppy, floppy.", "cue": {"p": 19, "r": "wu6", "anim": "warm-ragdoll"}, "lens": {"k": "warm-ragdoll", "at": [], "full": true}}, {"t0": 32.94, "t1": 39.72, "who": "B", "text": "Two, elbow wings: elbows free, not stuck to your body. Float them out like wings, then back.", "cue": {"p": 19, "r": "wu6", "anim": "warm-wings"}, "lens": {"k": "warm-wings", "at": [], "full": true}}, {"t0": 39.72, "t1": 49.43, "who": "B", "text": "Three, arm glide: skate the whole arm along the keys. The round hand rides to the next group of keys. The fingers ride; they don’t walk.", "cue": {"p": 19, "r": "wu6", "anim": "warm-glide"}, "lens": {"k": "warm-glide", "at": [], "full": true}}, {"t0": 49.43, "t1": 58.19, "who": "B", "text": "Four, arm drop: lift the whole arm and let it drop into a key on finger three. Firm tip, soft wrist, a round sound.", "cue": {"p": 19, "r": "wu6", "anim": "warm-dive"}, "lens": {"k": "warm-dive", "at": [], "full": true}}, {"t0": 58.19, "t1": 68.15, "who": "B", "text": "Five, knuckle bridge: your knuckles are a bridge a little car can drive over. Press one key slowly and hold for three. The bridge stays up.", "cue": {"p": 19, "r": "wu6", "anim": "warm-bridge"}, "lens": {"k": "warm-bridge", "at": [], "full": true}}, {"t0": 68.15, "t1": 70.72, "who": "P", "text": "Beep beep, the car made it across!", "cue": {"p": 19, "r": "wu6", "anim": "warm-bridge"}, "lens": {"k": "warm-bridge", "at": [], "full": true}}, {"t0": 70.72, "t1": 79.19, "who": "B", "text": "And six, wrist balloon: as the key goes down, a balloon lifts the wrist back up to level. The fingertip stays on the key.", "cue": {"p": 19, "r": "wu6", "anim": "warm-balloon"}, "lens": {"k": "warm-balloon", "at": [], "full": true}}]}, {"t": "Examples", "f": "audio/BP/05-examples.mp3", "s": 133, "p": 20, "l": [{"t0": 0.2, "t1": 8.98, "who": "B", "text": "Example one. Which hand is round? Look at the knuckles: up, or sunk in? Look at the tips: does the finger stand on its tip?", "cue": {"p": 19, "r": "ex1"}}, {"t0": 8.98, "t1": 12.98, "who": "pause", "text": "Pause and try.", "cue": {"p": 19, "r": "ex1"}}, {"t0": 12.98, "t1": 15.26, "who": "P", "text": "A! It looks so relaxed.", "cue": {"p": 19, "r": "ex1", "oops": true}}, {"t0": 15.26, "t1": 23.68, "who": "B", "text": "Relaxed, yes, but A is lying down on the job. A flat hand can’t play fast or loud. Which one could play all day?", "cue": {"p": 19, "r": "ex1", "anim": "pen-hand:flat"}, "lens": {"k": "pen-hand:flat", "at": [], "full": true}}, {"t0": 23.68, "t1": 28.74, "who": "P", "text": "C: knuckles up, curved fingers, standing on the tips. And B’s knuckle has caved in.", "cue": {"p": 19, "r": "ex1", "reveal": true, "anim": "pen-hand:cycle-ex"}, "lens": {"k": "pen-hand:cycle-ex", "at": [], "full": true}}, {"t0": 28.74, "t1": 36.11, "who": "B", "text": "Example two. Is the stool right? Follow the forearm from the elbow to the keys. Uphill or downhill?", "cue": {"p": 20, "r": "ex2"}}, {"t0": 36.11, "t1": 40.11, "who": "pause", "text": "Pause and try.", "cue": {"p": 20, "r": "ex2"}}, {"t0": 40.11, "t1": 45.87, "who": "P", "text": "B is level. In A the arm goes uphill, so the stool is too low. In C it goes downhill: too high.", "cue": {"p": 20, "r": "ex2", "reveal": true, "anim": "pen-sit:cycle"}, "lens": {"k": "pen-sit:cycle", "at": [], "full": true}}, {"t0": 45.87, "t1": 53.52, "who": "B", "text": "Now the thirty-second check, from the stool to your fingertips. Do it every time you sit down. Do it with me now.", "cue": {"p": 20, "r": "howto"}}, {"t0": 53.52, "t1": 60.43, "who": "B", "text": "One, the stool. Sit opposite Middle C. Are your forearms level with the keys, like a table top?", "cue": {"p": 18, "r": "hero", "lab": ["1", "3"], "anim": "pen-sit:good"}, "lens": {"k": "pen-sit:good", "at": [], "full": true}}, {"t0": 60.43, "t1": 63.43, "who": "pause", "text": "Pause and try.", "cue": {"p": 18, "r": "hero", "lab": ["1", "3"]}}, {"t0": 63.43, "t1": 68.31, "who": "B", "text": "Two, the body. Front half of the stool, both feet flat, back tall.", "cue": {"p": 18, "r": "hero", "lab": ["3", "4", "5"], "anim": "pen-sit:good"}, "lens": {"k": "pen-sit:good", "at": [], "full": true}}, {"t0": 68.31, "t1": 71.31, "who": "pause", "text": "Pause and try.", "cue": {"p": 18, "r": "hero", "lab": ["3", "4", "5"]}}, {"t0": 71.31, "t1": 76.13, "who": "B", "text": "Three, the shoulders. Lift them up to your ears. And let them drop.", "cue": {"p": 18, "r": "hero", "lab": ["5"]}}, {"t0": 76.13, "t1": 79.13, "who": "pause", "text": "Pause and try.", "cue": {"p": 18, "r": "hero", "lab": ["5"]}}, {"t0": 79.13, "t1": 87.89, "who": "B", "text": "Four, the hands. A soft ball under each palm, knuckles up, standing on the fingertips. Wrists level, not resting on the wood.", "cue": {"p": 18, "r": "two", "anim": "pen-hand:good"}, "lens": {"k": "pen-hand:good", "at": [], "full": true}}, {"t0": 87.89, "t1": 90.89, "who": "pause", "text": "Pause and try.", "cue": {"p": 18, "r": "two"}}, {"t0": 90.89, "t1": 94.64, "who": "B", "text": "And five: breathe out. Now you are ready to play.", "cue": {"p": 20, "r": "howto"}}, {"t0": 94.64, "t1": 98.71, "who": "P", "text": "Stool, body, shoulders, hands, breathe. Done in thirty seconds!", "cue": {"p": 20, "r": "howto"}}, {"t0": 98.71, "t1": 105.62, "who": "B", "text": "Try it: hold a small ball or an orange, then put your hand on the keys without changing its shape.", "cue": {"p": 20, "r": "try10"}}, {"t0": 105.62, "t1": 108.22, "who": "P", "text": "Can I eat the orange afterwards?", "cue": {"p": 20, "r": "try10"}}, {"t0": 108.22, "t1": 122.21, "who": "B", "text": "After the scales. Four traps: wrists sinking below the keys, shoulders creeping up to your ears, flat fingers or a caved-in knuckle, and sitting so close your elbows are squashed. Now, Clara, you may start.", "cue": {"p": 20, "r": "watch", "anim": "pen-hand:cycle"}, "lens": {"k": "pen-hand:cycle", "at": [], "full": true}}, {"t0": 122.21, "t1": 124.29, "who": "P", "text": "Finally! Bye, Butler!", "cue": {"p": 20, "r": "watch"}}, {"t0": 124.29, "t1": 131.65, "who": "B", "text": "Your little task for next time: do the thirty-second check every time you sit down, and tick it in your Workbook.", "cue": {"p": 20, "r": "watch"}}, {"t0": 131.65, "t1": 133.09, "who": "P", "text": "I will!", "cue": {"p": 20, "r": "watch"}}]}], "nx": {"wb": ["Claude outputs/Books - latest/2 Workbook/Before%20you%20play/workbook-0-1-before-you-play.pdf", "pp. 1–2", "Before you play"], "dr": [["posture-hands", "Posture & Hand Shape", 0]]}}, {"k": "O1", "part": "Part I · Pitch", "t": "Part opener", "pages": [21], "clips": [{"t": "Part One: Pitch", "f": "audio/O1/01-part-one-pitch.mp3", "s": 45, "p": 21, "l": [{"t0": 3.4, "t1": 7.49, "who": "B", "text": "Welcome to Part One, Clara: Pitch. High or low.", "cue": {"p": 21, "r": "opener"}}, {"t0": 7.49, "t1": 18.45, "who": "B", "text": "We start with the keys under your fingers, find where each one lives on the staff, see how sharps and flats move it, and finish by measuring how far apart two notes are.", "cue": {"p": 21, "r": "opener"}}, {"t0": 18.45, "t1": 23.71, "who": "piano", "notes": [18.45, 19.07, 19.69, 20.31, 20.93, 21.55, 22.17, 22.79], "cue": {"p": 21, "r": "opener"}}, {"t0": 23.71, "t1": 26.46, "who": "P", "text": "Up the white keys, one after another!", "cue": {"p": 21, "r": "opener"}}, {"t0": 26.46, "t1": 43.73, "who": "B", "text": "Ten chapters: the keyboard, Middle C and the octave, the staff and the clefs, the staff and the keyboard, reading the notes, ledger lines, sharps, flats and naturals, tones and semitones, intervals, and major, minor and perfect. Shall we begin with the keyboard?", "cue": {"p": 21, "r": "chapters"}}, {"t0": 43.73, "t1": 45.46, "who": "P", "text": "Yes, please!", "cue": {"p": 21, "r": "chapters"}}]}]}, {"k": "P1", "part": "Part I · Pitch", "t": "1 · The keyboard", "pages": [22, 23], "clips": [{"t": "The keyboard", "f": "audio/P1/01-the-keyboard.mp3", "s": 49, "p": 22, "l": [{"t0": 3.4, "t1": 7.09, "who": "P", "text": "Butler, there are so many keys. What comes after G? H?", "cue": {"p": 22, "r": "lead"}}, {"t0": 7.09, "t1": 19.33, "who": "B", "text": "No H, Miss Clara. Eighty-eight keys look like a lot, but they repeat one small pattern. Learn it once and you can find any key without counting. Left is low, right is high.", "cue": {"p": 22, "r": "lead"}}, {"t0": 19.33, "t1": 20.87, "who": "piano", "notes": [19.33, 19.95], "cue": {"p": 22, "r": "lead"}}, {"t0": 20.87, "t1": 30.38, "who": "B", "text": "Look at the black keys: they come in twos and threes. Round the two black keys sit C, D and E. Round the three sit F, G, A and B.", "cue": {"p": 22, "r": "picture"}}, {"t0": 30.38, "t1": 37.39, "who": "B", "text": "So remember this: two black keys, start on C. Three black keys, start on F. Then walk on.", "cue": {"p": 22, "r": "remember"}}, {"t0": 37.39, "t1": 41.67, "who": "P", "text": "Looking for D? Find two black keys, start on C, and walk one key.", "cue": {"p": 22, "r": "rule"}}, {"t0": 41.67, "t1": 48.71, "who": "B", "text": "Exactly. And the pattern repeats all the way along: every two starts on C, every three on F.", "cue": {"p": 22, "r": "rule"}}]}, {"t": "Seven letters, round and round", "f": "audio/P1/02-seven-letters-round-and-round.mp3", "s": 36, "p": 22, "l": [{"t0": 0.2, "t1": 9.13, "who": "B", "text": "The white keys use only seven letters, A to G. After G comes A again, round and round, like the days of the week.", "cue": {"p": 22, "r": "h:Seven letters, round and round"}}, {"t0": 9.13, "t1": 15.63, "who": "piano", "notes": [9.13, 9.75, 10.37, 10.99, 11.61, 12.23, 12.85, 13.47, 14.09, 14.71], "cue": {"p": 22, "r": "h:Seven letters, round and round"}}, {"t0": 15.63, "t1": 27.68, "who": "B", "text": "Going left, the letters run backwards: G, F, E, D, C, B, A. Practise saying them backwards until it is as quick as forwards. Reading music that goes down depends on it.", "cue": {"p": 22, "r": "h:Seven letters, round and round"}}, {"t0": 27.68, "t1": 35.89, "who": "B", "text": "Two traps. Do not count every key from far away: find the nearest group. And do not let the backwards letters stay slow.", "cue": {"p": 23, "r": "trap"}}]}, {"t": "Example: higher or lower?", "f": "audio/P1/03-example-higher-or-lower.mp3", "s": 14, "p": 22, "l": [{"t0": 0.2, "t1": 6.3, "who": "B", "text": "Two keys are marked in red. Which one is higher? Pause, and look for the one further right.", "cue": {"p": 22, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P1-1-q.webp"}}, {"t0": 6.3, "t1": 9.3, "who": "pause", "text": "Pause and try.", "cue": {"p": 22, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P1-1-q.webp"}}, {"t0": 9.3, "t1": 12.64, "who": "P", "text": "The second one! It is further right, so it is higher.", "cue": {"p": 22, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P1-1.webp"}}, {"t0": 12.64, "t1": 14.18, "who": "piano", "notes": [12.64, 13.26], "cue": {"p": 22, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P1-1.webp"}}]}, {"t": "Example: walk down from E", "f": "audio/P1/04-example-walk-down-from-e.mp3", "s": 18, "p": 22, "l": [{"t0": 0.2, "t1": 8.15, "who": "B", "text": "Start on E, between the two black keys, and step left one white key at a time, naming each. Pause and try.", "cue": {"p": 22, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P1-3-q.webp"}}, {"t0": 8.15, "t1": 12.15, "who": "pause", "text": "Pause and try.", "cue": {"p": 22, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P1-3-q.webp"}}, {"t0": 12.15, "t1": 14.77, "who": "P", "text": "E, D, C, B, A. Backwards!", "cue": {"p": 22, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P1-3.webp"}}, {"t0": 14.77, "t1": 18.17, "who": "piano", "notes": [14.77, 15.39, 16.01, 16.63, 17.25], "cue": {"p": 22, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P1-3.webp"}}]}, {"t": "Example: find B, E and G", "f": "audio/P1/05-example-find-b-e-and-g.mp3", "s": 20, "p": 22, "l": [{"t0": 0.2, "t1": 7.7, "who": "B", "text": "Now find three keys: B, E and G. First ask which family each belongs to. Pause and find them.", "cue": {"p": 22, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P1-4-q.webp"}}, {"t0": 7.7, "t1": 11.7, "who": "pause", "text": "Pause and try.", "cue": {"p": 22, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P1-4-q.webp"}}, {"t0": 11.7, "t1": 18.1, "who": "P", "text": "B is the last of F G A B. E is the last of C D E. And G is one key after F.", "cue": {"p": 22, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P1-4.webp"}}, {"t0": 18.1, "t1": 20.26, "who": "piano", "notes": [18.1, 18.72, 19.34], "cue": {"p": 22, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P1-4.webp"}}]}, {"t": "Try it: Hot Cross Buns", "f": "audio/P1/06-try-it-hot-cross-buns.mp3", "s": 33, "p": 22, "l": [{"t0": 0.2, "t1": 14.6, "who": "B", "text": "A whole tune on three black keys. Right hand, fingers two, three and four on the three black keys. Play four, three, two; four, three, two; then quickly, two two two two, three three three three, and four, three, two to finish.", "cue": {"p": 22, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P1-5.webp"}}, {"t0": 14.6, "t1": 25.57, "who": "piano", "notes": [14.6, 15.22, 15.84, 17.33, 17.95, 18.57, 20.06, 20.37, 20.68, 20.99, 21.3, 21.61, 21.92, 22.23, 22.79, 23.41, 24.03], "cue": {"p": 22, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P1-5.webp"}}, {"t0": 25.57, "t1": 31.9, "who": "B", "text": "Then find another group of three, higher up, and play it there. Until next time, Clara.", "cue": {"p": 22, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P1-5.webp"}}, {"t0": 31.9, "t1": 33.36, "who": "P", "text": "Goodbye!", "cue": {"p": 22, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P1-5.webp"}}]}]}, {"k": "P2", "part": "Part I · Pitch", "t": "2 · Middle C and the octave", "pages": [24], "clips": [{"t": "Middle C and the octave", "f": "audio/P2/01-middle-c-and-the-octave.mp3", "s": 53, "p": 24, "l": [{"t0": 3.4, "t1": 10.86, "who": "B", "text": "Eighty-eight keys, Clara, and eight of them are Cs. The one nearest the middle is Middle C: your home base.", "cue": {"p": 24, "r": "lead"}}, {"t0": 10.86, "t1": 11.78, "who": "piano", "notes": [10.86], "cue": {"p": 24, "r": "lead"}}, {"t0": 11.78, "t1": 17.39, "who": "B", "text": "Remember: find Middle C first. Every other C is an octave or more away.", "cue": {"p": 24, "r": "remember"}}, {"t0": 17.39, "t1": 28.5, "who": "B", "text": "Either side of Middle C are Bass C and Treble C. Further out, Low C and High C. Those five, from Low C to High C, are the ones you will use most.", "cue": {"p": 24, "r": "picture"}}, {"t0": 28.5, "t1": 31.9, "who": "piano", "notes": [28.5, 29.12, 29.74, 30.36, 30.98], "cue": {"p": 24, "r": "picture"}}, {"t0": 31.9, "t1": 34.86, "who": "P", "text": "And from one C to the next is an octave?", "cue": {"p": 24, "r": "picture"}}, {"t0": 34.86, "t1": 40.23, "who": "B", "text": "Yes: C, D, E, F, G, A, B, C. Eight notes, counting both Cs.", "cue": {"p": 24, "r": "picture"}}, {"t0": 40.23, "t1": 45.49, "who": "piano", "notes": [40.23, 40.85, 41.47, 42.09, 42.71, 43.33, 43.95, 44.57], "cue": {"p": 24, "r": "picture"}}, {"t0": 45.49, "t1": 53.23, "who": "B", "text": "One trap: not every C is Middle C. It is the C nearest the middle, usually right in front of the maker’s name.", "cue": {"p": 24, "r": "trap"}}]}, {"t": "The two ends", "f": "audio/P2/02-the-two-ends.mp3", "s": 25, "p": 24, "l": [{"t0": 0.2, "t1": 13.38, "who": "B", "text": "The very first key, at the bottom, is an A. Only one black key sits there: a group of three, cut off, with just its end left. So the piano starts on A, and the first full C is Lowest C.", "cue": {"p": 24, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P2-1.webp"}}, {"t0": 13.38, "t1": 22.44, "who": "B", "text": "And at the top, the last group is three black keys, F G A B. After B comes one more key: Highest C, the very last.", "cue": {"p": 24, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P2-1.webp"}}, {"t0": 22.44, "t1": 24.85, "who": "piano", "notes": [22.44, 23.06, 23.93], "cue": {"p": 24, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P2-1.webp"}}]}, {"t": "Example: find Bass C and Treble C", "f": "audio/P2/03-example-find-bass-c-and-treble-c.mp3", "s": 21, "p": 24, "l": [{"t0": 0.2, "t1": 10.56, "who": "B", "text": "Start on Middle C. Walk left to the next pair of black keys, and take the C just left of it. Then walk right the same way. Pause and find both.", "cue": {"p": 24, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P2-2-q.webp"}}, {"t0": 10.56, "t1": 14.56, "who": "pause", "text": "Pause and try.", "cue": {"p": 24, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P2-2-q.webp"}}, {"t0": 14.56, "t1": 19.32, "who": "P", "text": "Left is Bass C, right is Treble C. Each one an octave from Middle C.", "cue": {"p": 24, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P2-2.webp"}}, {"t0": 19.32, "t1": 21.48, "who": "piano", "notes": [19.32, 19.94, 20.56], "cue": {"p": 24, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P2-2.webp"}}]}, {"t": "Try it", "f": "audio/P2/04-try-it.mp3", "s": 19, "p": 24, "l": [{"t0": 0.2, "t1": 11.89, "who": "B", "text": "Play every C you can find, from the bottom up, saying its name. Then close your eyes and find Middle C by touch: the two black keys nearest the middle. Until next time.", "cue": {"p": 24, "r": "trap"}}, {"t0": 11.89, "t1": 17.15, "who": "piano", "notes": [11.89, 12.51, 13.13, 13.75, 14.37, 14.99, 15.61, 16.23], "cue": {"p": 24, "r": "trap"}}, {"t0": 17.15, "t1": 18.61, "who": "P", "text": "Goodbye!", "cue": {"p": 24, "r": "trap"}}]}]}, {"k": "P3", "part": "Part I · Pitch", "t": "3 · The staff and the clefs", "pages": [25, 26], "clips": [{"t": "The staff and the clefs", "f": "audio/P3/01-the-staff-and-the-clefs.mp3", "s": 52, "p": 25, "l": [{"t0": 3.4, "t1": 13.14, "who": "B", "text": "Music is written on a staff, Clara: five lines and four spaces, counted from the bottom. Higher on the staff means higher on the keyboard.", "cue": {"p": 25, "r": "lead"}}, {"t0": 13.14, "t1": 22.63, "who": "B", "text": "The clef at the start is the key to the code. It names one line, and every other note follows from it. Allow me to present Their Majesties.", "cue": {"p": 25, "r": "lead"}}, {"t0": 22.63, "t1": 31.18, "who": "Q", "text": "Good day, Clara. I am the Queen of the treble staff. My clef curls round line two, my G, so it is also called the G clef.", "cue": {"p": 25, "r": "picture"}}, {"t0": 31.18, "t1": 32.1, "who": "piano", "notes": [31.18], "cue": {"p": 25, "r": "picture"}}, {"t0": 32.1, "t1": 41.72, "who": "K", "text": "And I am the King of the bass staff. My clef’s two dots hug line four, like a pair of eyes. That line is my F: the F clef.", "cue": {"p": 25, "r": "picture"}}, {"t0": 41.72, "t1": 42.64, "who": "piano", "notes": [41.72], "cue": {"p": 25, "r": "picture"}}, {"t0": 42.64, "t1": 48.57, "who": "B", "text": "So remember: the treble clef curls round G; the bass clef’s two dots hug F.", "cue": {"p": 25, "r": "remember"}}, {"t0": 48.57, "t1": 51.98, "who": "P", "text": "A Queen for the high notes and a King for the low ones.", "cue": {"p": 25, "r": "remember"}}]}, {"t": "Five lines and the grand staff", "f": "audio/P3/02-five-lines-and-the-grand-staff.mp3", "s": 35, "p": 25, "l": [{"t0": 0.2, "t1": 6.72, "who": "B", "text": "Always count from the bottom: line one is the lowest line, space one the lowest space.", "cue": {"p": 25, "r": "h:Five lines, four spaces"}}, {"t0": 6.72, "t1": 22.76, "who": "B", "text": "Piano music joins two staves with a brace: the treble staff on top, usually for the right hand, and the bass staff below, usually for the left. Middle C sits between them, on a short line of its own, and can be written in either staff.", "cue": {"p": 25, "r": "h:Five lines, four spaces"}}, {"t0": 22.76, "t1": 26.51, "who": "Q", "text": "Middle C is the border between our kingdoms.", "cue": {"p": 25, "r": "h:Five lines, four spaces"}}, {"t0": 26.51, "t1": 28.32, "who": "K", "text": "And we share it.", "cue": {"p": 25, "r": "h:Five lines, four spaces"}}, {"t0": 28.32, "t1": 34.8, "who": "B", "text": "One trap: never read bass notes as if they were treble. Check the clef on every line.", "cue": {"p": 26, "r": "trap"}}]}, {"t": "Example: which staff?", "f": "audio/P3/03-example-which-staff.mp3", "s": 19, "p": 25, "l": [{"t0": 0.2, "t1": 11.16, "who": "B", "text": "Here is a key on the piano, marked with a question mark. Find Middle C first. Is the key to its left or right, and which staff would it go on? Pause and think.", "cue": {"p": 25, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P3-1-q.webp"}}, {"t0": 11.16, "t1": 15.16, "who": "pause", "text": "Pause and try.", "cue": {"p": 25, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P3-1-q.webp"}}, {"t0": 15.16, "t1": 19.4, "who": "P", "text": "To the left, so it is lower: the bass staff, usually for the left hand.", "cue": {"p": 25, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P3-1.webp"}}]}, {"t": "Try it: Twinkle", "f": "audio/P3/04-try-it-twinkle.mp3", "s": 21, "p": 25, "l": [{"t0": 0.2, "t1": 7.15, "who": "B", "text": "Twinkle, Twinkle leaps up to G, the Queen’s very own line. Point to the G line, then play it.", "cue": {"p": 25, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P3-2.webp"}}, {"t0": 7.15, "t1": 12.41, "who": "piano", "notes": [7.15, 7.77, 8.39, 9.01, 9.63, 10.25, 10.87], "cue": {"p": 25, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P3-2.webp"}}, {"t0": 12.41, "t1": 19.23, "who": "B", "text": "Read the round head, not the stem: the stem never changes the note. Until next time, Clara.", "cue": {"p": 25, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P3-2.webp"}}, {"t0": 19.23, "t1": 20.7, "who": "P", "text": "Goodbye!", "cue": {"p": 25, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P3-2.webp"}}]}]}, {"k": "P4", "part": "Part I · Pitch", "t": "4 · The staff and the keyboard", "pages": [27], "clips": [{"t": "The staff and the keyboard", "f": "audio/P4/01-the-staff-and-the-keyboard.mp3", "s": 47, "p": 27, "l": [{"t0": 3.4, "t1": 14.15, "who": "B", "text": "Here is the secret of this chapter, Clara: every line and every space of the grand staff is one white key, in order. Climb the staff, climb the keyboard.", "cue": {"p": 27, "r": "lead"}}, {"t0": 14.15, "t1": 19.28, "who": "B", "text": "Remember it like that: every line and every space is one white key.", "cue": {"p": 27, "r": "remember"}}, {"t0": 19.28, "t1": 25.42, "who": "B", "text": "Two octaves, from Bass C up to Treble C, with Middle C where the two staves meet.", "cue": {"p": 27, "r": "picture"}}, {"t0": 25.42, "t1": 35.02, "who": "piano", "notes": [25.42, 26.04, 26.66, 27.28, 27.9, 28.52, 29.14, 29.76, 30.38, 31.0, 31.62, 32.24, 32.86, 33.48, 34.1], "cue": {"p": 27, "r": "picture"}}, {"t0": 35.02, "t1": 38.77, "who": "P", "text": "So one step, line to space, is the very next white key?", "cue": {"p": 27, "r": "picture"}}, {"t0": 38.77, "t1": 43.16, "who": "B", "text": "Exactly. And only Middle C sits between the two staves.", "cue": {"p": 27, "r": "picture"}}, {"t0": 43.16, "t1": 47.45, "who": "K", "text": "Two guards at the castle gate, with Middle C between us.", "cue": {"p": 27, "r": "picture"}}]}, {"t": "Example: from the page to the key", "f": "audio/P4/02-example-from-the-page-to-the-key.mp3", "s": 19, "p": 27, "l": [{"t0": 0.2, "t1": 8.45, "who": "B", "text": "A note on line four of the bass staff, between the clef’s dots. Name it, then find it on the piano. Pause and try.", "cue": {"p": 27, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P4-1-q.webp"}}, {"t0": 8.45, "t1": 12.45, "who": "pause", "text": "Pause and try.", "cue": {"p": 27, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P4-1-q.webp"}}, {"t0": 12.45, "t1": 17.78, "who": "P", "text": "F! The three black keys just below Middle C, and F is the first key of that family.", "cue": {"p": 27, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P4-1.webp"}}, {"t0": 17.78, "t1": 18.7, "who": "piano", "notes": [17.78], "cue": {"p": 27, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P4-1.webp"}}]}, {"t": "Example: mirror notes", "f": "audio/P4/03-example-mirror-notes.mp3", "s": 23, "p": 27, "l": [{"t0": 0.2, "t1": 7.92, "who": "B", "text": "Find treble G and bass F. Now count each from Middle C: up to G, down to F. Pause and count.", "cue": {"p": 27, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P4-2-q.webp"}}, {"t0": 7.92, "t1": 11.92, "who": "pause", "text": "Pause and try.", "cue": {"p": 27, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P4-2-q.webp"}}, {"t0": 11.92, "t1": 16.09, "who": "P", "text": "C D E F G: five. C B A G F: five as well!", "cue": {"p": 27, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P4-2.webp"}}, {"t0": 16.09, "t1": 22.84, "who": "piano", "notes": [16.09, 16.71, 17.33, 17.95, 18.57, 19.44, 20.06, 20.68, 21.3, 21.92], "cue": {"p": 27, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P4-2.webp"}}]}, {"t": "Example: from the key to the page", "f": "audio/P4/04-example-from-the-key-to-the-page.mp3", "s": 19, "p": 27, "l": [{"t0": 0.2, "t1": 8.26, "who": "B", "text": "I play the third white key up from Middle C. Which note is it, and where does it sit on the staff? Pause and climb.", "cue": {"p": 27, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P4-4-q.webp"}}, {"t0": 8.26, "t1": 12.26, "who": "pause", "text": "Pause and try.", "cue": {"p": 27, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P4-4-q.webp"}}, {"t0": 12.26, "t1": 16.39, "who": "P", "text": "C, D, E: it is E, on the bottom line of the treble staff.", "cue": {"p": 27, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P4-4.webp"}}, {"t0": 16.39, "t1": 18.55, "who": "piano", "notes": [16.39, 17.01, 17.63], "cue": {"p": 27, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P4-4.webp"}}]}, {"t": "Try it: Frère Jacques", "f": "audio/P4/05-try-it-fr-re-jacques.mp3", "s": 34, "p": 27, "l": [{"t0": 0.2, "t1": 7.62, "who": "B", "text": "Play Middle C and walk up, saying each key and picturing it on the staff: line, space, line, space.", "cue": {"p": 27, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P4-3.webp"}}, {"t0": 7.62, "t1": 12.88, "who": "piano", "notes": [7.62, 8.24, 8.86, 9.48, 10.1, 10.72, 11.34, 11.96], "cue": {"p": 27, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P4-3.webp"}}, {"t0": 12.88, "t1": 21.26, "who": "B", "text": "Then Frère Jacques: the right hand plays C D E C; the left hand the same letters, an octave lower, in the bass clef.", "cue": {"p": 27, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P4-5.webp"}}, {"t0": 21.26, "t1": 26.77, "who": "piano", "notes": [21.26, 21.88, 22.5, 23.12, 23.99, 24.61, 25.23, 25.85], "cue": {"p": 27, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P4-5.webp"}}, {"t0": 26.77, "t1": 33.55, "who": "B", "text": "The staff is a ladder beside the keyboard: every rung is the next white key. Until next time.", "cue": {"p": 27, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P4-5.webp"}}]}]}, {"k": "P5", "part": "Part I · Pitch", "t": "5 · Reading the notes", "pages": [28, 29], "clips": [{"t": "Reading the notes", "f": "audio/P5/01-reading-the-notes.mp3", "s": 30, "p": 28, "l": [{"t0": 3.4, "t1": 6.72, "who": "P", "text": "Do I have to learn every line and space by heart?", "cue": {"p": 28, "r": "lead"}}, {"t0": 6.72, "t1": 14.68, "who": "B", "text": "Not at once. Start from a note you always know, bass F, Middle C or treble G, and walk to the one you want.", "cue": {"p": 28, "r": "lead"}}, {"t0": 14.68, "t1": 16.84, "who": "piano", "notes": [14.68, 15.3, 15.92], "cue": {"p": 28, "r": "picture"}}, {"t0": 16.84, "t1": 22.68, "who": "B", "text": "Remember: start from a note you know. Every line and space after it is the next letter.", "cue": {"p": 28, "r": "remember"}}, {"t0": 22.68, "t1": 30.39, "who": "B", "text": "And count lines and spaces from the bottom: line one is the bottom line, space one the bottom space.", "cue": {"p": 28, "r": "picture"}}]}, {"t": "Words to remember", "f": "audio/P5/02-words-to-remember.mp3", "s": 27, "p": 29, "l": [{"t0": 0.2, "t1": 7.92, "who": "B", "text": "Little sentences help too. Treble lines: Every Good Boy Deserves Fun. Treble spaces spell FACE.", "cue": {"p": 29, "r": "h:Words to remember the lines and spaces"}}, {"t0": 7.92, "t1": 14.42, "who": "B", "text": "Bass lines: Great Big Dragons Fly Away. Bass spaces: All Cows Eat Grass.", "cue": {"p": 29, "r": "h:Words to remember the lines and spaces"}}, {"t0": 14.42, "t1": 19.15, "who": "K", "text": "You have no idea. The dragons keep eating the cows’ grass.", "cue": {"p": 29, "r": "h:Words to remember the lines and spaces"}}, {"t0": 19.15, "t1": 27.23, "who": "B", "text": "Two traps. In the bass, the bottom line is G, not E. And line one is always the bottom line, never the top.", "cue": {"p": 29, "r": "trap"}}]}, {"t": "Example: a line note with its sentence", "f": "audio/P5/03-example-a-line-note-with-its-sentence.mp3", "s": 21, "p": 28, "l": [{"t0": 0.2, "t1": 9.2, "who": "B", "text": "A red note on line four of the treble staff, and one on line three of the bass. Use each clef’s sentence. Pause and name them.", "cue": {"p": 28, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P5-2-q.webp"}}, {"t0": 9.2, "t1": 13.2, "who": "pause", "text": "Pause and try.", "cue": {"p": 28, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P5-2-q.webp"}}, {"t0": 13.2, "t1": 19.0, "who": "P", "text": "Treble line four: D, Deserves. Bass line three: D, Dragons. The same letter, on different keys.", "cue": {"p": 28, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P5-2.webp"}}, {"t0": 19.0, "t1": 20.54, "who": "piano", "notes": [19.0, 19.62], "cue": {"p": 28, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P5-2.webp"}}]}, {"t": "Example: one line, two notes", "f": "audio/P5/04-example-one-line-two-notes.mp3", "s": 19, "p": 28, "l": [{"t0": 0.2, "t1": 7.04, "who": "B", "text": "Both red notes sit on the bottom line, one in the treble, one in the bass. Pause and name each.", "cue": {"p": 28, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P5-3-q.webp"}}, {"t0": 7.04, "t1": 11.04, "who": "pause", "text": "Pause and try.", "cue": {"p": 28, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P5-3-q.webp"}}, {"t0": 11.04, "t1": 17.1, "who": "P", "text": "Treble: E, for Every. Bass: G, for Great. Same line, different note. Always read the clef first.", "cue": {"p": 28, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P5-3.webp"}}, {"t0": 17.1, "t1": 18.64, "who": "piano", "notes": [17.1, 17.72], "cue": {"p": 28, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P5-3.webp"}}]}, {"t": "Example: read it downwards", "f": "audio/P5/05-example-read-it-downwards.mp3", "s": 18, "p": 28, "l": [{"t0": 0.2, "t1": 8.13, "who": "B", "text": "Start on G, line two of the treble, and step down to Middle C, saying the letters backwards. Pause and try.", "cue": {"p": 28, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P5-4-q.webp"}}, {"t0": 8.13, "t1": 12.13, "who": "pause", "text": "Pause and try.", "cue": {"p": 28, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P5-4-q.webp"}}, {"t0": 12.13, "t1": 14.3, "who": "P", "text": "G, F, E, D, C!", "cue": {"p": 28, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P5-4.webp"}}, {"t0": 14.3, "t1": 17.7, "who": "piano", "notes": [14.3, 14.92, 15.54, 16.16, 16.78], "cue": {"p": 28, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P5-4.webp"}}]}, {"t": "Example: Treble C and Bass C", "f": "audio/P5/06-example-treble-c-and-bass-c.mp3", "s": 18, "p": 28, "l": [{"t0": 0.2, "t1": 7.3, "who": "B", "text": "Treble space three, and bass space two. Use FACE and All Cows Eat Grass. Pause and find them.", "cue": {"p": 28, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P5-5-q.webp"}}, {"t0": 7.3, "t1": 11.3, "who": "pause", "text": "Pause and try.", "cue": {"p": 28, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P5-5-q.webp"}}, {"t0": 11.3, "t1": 15.99, "who": "P", "text": "Both are C: Treble C and Bass C, an octave either side of Middle C.", "cue": {"p": 28, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P5-5.webp"}}, {"t0": 15.99, "t1": 17.53, "who": "piano", "notes": [15.99, 16.61], "cue": {"p": 28, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P5-5.webp"}}]}, {"t": "Try it: Mary Had a Little Lamb", "f": "audio/P5/07-try-it-mary-had-a-little-lamb.mp3", "s": 21, "p": 28, "l": [{"t0": 0.2, "t1": 8.9, "who": "B", "text": "E, D, C: line, space, and Middle C’s own little line, one step down each time. Read the notes aloud, then play.", "cue": {"p": 28, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/P5-6.webp"}}, {"t0": 8.9, "t1": 14.16, "who": "piano", "notes": [8.9, 9.52, 10.14, 10.76, 11.38, 12.0, 12.62], "cue": {"p": 28, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/P5-6.webp"}}, {"t0": 14.16, "t1": 19.36, "who": "B", "text": "Read the shape and the tune walks with it. Until next time, Clara.", "cue": {"p": 28, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/P5-6.webp"}}, {"t0": 19.36, "t1": 20.83, "who": "P", "text": "Goodbye!", "cue": {"p": 28, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/P5-6.webp"}}]}]}, {"k": "P6", "part": "Part I · Pitch", "t": "6 · Ledger lines", "pages": [30, 31], "clips": [{"t": "Ledger lines", "f": "audio/P6/01-ledger-lines.mp3", "s": 44, "p": 30, "l": [{"t0": 3.4, "t1": 13.36, "who": "B", "text": "Some notes are too high or too low for the five lines, Clara. So the staff borrows a few short lines, spaced just like its own: ledger lines.", "cue": {"p": 30, "r": "lead"}}, {"t0": 13.36, "t1": 21.82, "who": "B", "text": "Remember: step out from the nearest staff line. Line, space, line. The first ledger line is the one nearest the staff.", "cue": {"p": 30, "r": "remember"}}, {"t0": 21.82, "t1": 29.03, "who": "B", "text": "Above the treble: G sits on top, then A on the first ledger line, B above it, C on the second.", "cue": {"p": 30, "r": "picture"}}, {"t0": 29.03, "t1": 32.43, "who": "piano", "notes": [29.03, 29.65, 30.27, 30.89, 31.51], "cue": {"p": 30, "r": "picture"}}, {"t0": 32.43, "t1": 40.87, "who": "B", "text": "Middle C has a ledger line of its own: below the treble staff, or above the bass staff. One key, two ways to write it.", "cue": {"p": 30, "r": "picture"}}, {"t0": 40.87, "t1": 44.26, "who": "Q", "text": "We take turns. Like sharing a bicycle.", "cue": {"p": 30, "r": "picture"}}]}, {"t": "Below and above the bass", "f": "audio/P6/02-below-and-above-the-bass.mp3", "s": 28, "p": 31, "l": [{"t0": 0.2, "t1": 12.33, "who": "B", "text": "The bass works the same way, Clara. Below it, step down from G: F in the space, E on the first ledger line, then D, then C. Above it: C, D, E, up towards the treble.", "cue": {"p": 31, "r": "more"}}, {"t0": 12.33, "t1": 18.46, "who": "piano", "notes": [12.33, 12.95, 13.57, 14.19, 14.81, 15.68, 16.3, 16.92, 17.54], "cue": {"p": 31, "r": "more"}}, {"t0": 18.46, "t1": 28.27, "who": "B", "text": "Two traps. Read ledger lines from the staff outwards, never from the far end. And the first ledger line is always the one nearest the staff.", "cue": {"p": 31, "r": "trap"}}]}, {"t": "Example: a high note", "f": "audio/P6/03-example-a-high-note.mp3", "s": 20, "p": 30, "l": [{"t0": 0.2, "t1": 8.39, "who": "B", "text": "A red note, two ledger lines above the treble staff. Start on F, the top line, and step up. Pause and climb.", "cue": {"p": 30, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P6-1-q.webp"}}, {"t0": 8.39, "t1": 12.39, "who": "pause", "text": "Pause and try.", "cue": {"p": 30, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P6-1-q.webp"}}, {"t0": 12.39, "t1": 16.27, "who": "P", "text": "G, A, B, C: High C, two octaves above Middle C.", "cue": {"p": 30, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P6-1.webp"}}, {"t0": 16.27, "t1": 19.67, "who": "piano", "notes": [16.27, 16.89, 17.51, 18.13, 18.75], "cue": {"p": 30, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P6-1.webp"}}]}, {"t": "Example: a low note", "f": "audio/P6/04-example-a-low-note.mp3", "s": 20, "p": 30, "l": [{"t0": 0.2, "t1": 7.9, "who": "B", "text": "Now two ledger lines below the bass staff. Start on G, the bottom line, and step down. Pause and try.", "cue": {"p": 30, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P6-2-q.webp"}}, {"t0": 7.9, "t1": 11.9, "who": "pause", "text": "Pause and try.", "cue": {"p": 30, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P6-2-q.webp"}}, {"t0": 11.9, "t1": 16.76, "who": "P", "text": "F, E, D, C: Low C, two octaves below Middle C. The mirror of High C.", "cue": {"p": 30, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P6-2.webp"}}, {"t0": 16.76, "t1": 20.16, "who": "piano", "notes": [16.76, 17.38, 18.0, 18.62, 19.24], "cue": {"p": 30, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P6-2.webp"}}]}, {"t": "Going further: 8va", "f": "audio/P6/05-going-further-8va.mp3", "s": 24, "p": 30, "l": [{"t0": 0.2, "t1": 15.73, "who": "B", "text": "Very high notes would need lots of ledger lines. So a high passage is often written lower, with 8va and a dotted line: play it one octave higher until the line stops. 8vb below the notes means an octave lower.", "cue": {"p": 30, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P6-3.webp"}}, {"t0": 15.73, "t1": 20.0, "who": "piano", "notes": [15.73, 16.35, 16.97, 17.84, 18.46, 19.08], "cue": {"p": 30, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P6-3.webp"}}, {"t0": 20.0, "t1": 22.51, "who": "B", "text": "Until next time, Clara.", "cue": {"p": 30, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P6-3.webp"}}, {"t0": 22.51, "t1": 23.98, "who": "P", "text": "Goodbye!", "cue": {"p": 30, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P6-3.webp"}}]}]}, {"k": "P7", "part": "Part I · Pitch", "t": "7 · Sharps, flats and naturals", "pages": [32, 33], "clips": [{"t": "Sharps, flats and naturals", "f": "audio/P7/01-sharps-flats-and-naturals.mp3", "s": 34, "p": 32, "l": [{"t0": 3.4, "t1": 10.78, "who": "B", "text": "The black keys have no letters of their own, Clara. They borrow their neighbours’ names, with a sharp or a flat.", "cue": {"p": 32, "r": "lead"}}, {"t0": 10.78, "t1": 17.79, "who": "G", "text": "Good day, darling. I am the Guest. I visit a note and change it, but only until the bar line. That is the front door.", "cue": {"p": 32, "r": "lead"}}, {"t0": 17.79, "t1": 24.12, "who": "B", "text": "Remember: sharp, the very next key to the right. Flat, the very next key to the left.", "cue": {"p": 32, "r": "remember"}}, {"t0": 24.12, "t1": 27.15, "who": "piano", "notes": [24.12, 24.74, 25.61, 26.23], "cue": {"p": 32, "r": "picture"}}, {"t0": 27.15, "t1": 34.14, "who": "B", "text": "And the natural cancels them both: back to the white key. Together these signs are called accidentals.", "cue": {"p": 32, "r": "table"}}]}, {"t": "One line, one bar", "f": "audio/P7/02-one-line-one-bar.mp3", "s": 33, "p": 33, "l": [{"t0": 0.2, "t1": 15.32, "who": "B", "text": "A semitone is the smallest step: the very next key, black or white. Where there is no black key between, the next key is white: E sharp is F, and C flat is B. And every black key has two names: C sharp is D flat.", "cue": {"p": 33, "r": "more"}}, {"t0": 15.32, "t1": 22.95, "who": "B", "text": "The rule: a sign changes only that line or space, in that octave, and only until the bar line.", "cue": {"p": 33, "r": "rule"}}, {"t0": 22.95, "t1": 26.11, "who": "P", "text": "And after the bar line, the note is plain again.", "cue": {"p": 33, "r": "trap"}}, {"t0": 26.11, "t1": 32.91, "who": "B", "text": "Quite right. A key signature is different: it lasts the whole piece. That comes in Key signatures.", "cue": {"p": 33, "r": "trap"}}]}, {"t": "Example: find F sharp and B flat", "f": "audio/P7/03-example-find-f-sharp-and-b-flat.mp3", "s": 18, "p": 32, "l": [{"t0": 0.2, "t1": 7.98, "who": "B", "text": "Find F and B, then go one key right for F sharp and one key left for B flat. Pause and find them.", "cue": {"p": 32, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P7-1-q.webp"}}, {"t0": 7.98, "t1": 11.98, "who": "pause", "text": "Pause and try.", "cue": {"p": 32, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P7-1-q.webp"}}, {"t0": 11.98, "t1": 16.52, "who": "P", "text": "F sharp is the first black key of the three. B flat is the highest one.", "cue": {"p": 32, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P7-1.webp"}}, {"t0": 16.52, "t1": 18.06, "who": "piano", "notes": [16.52, 17.14], "cue": {"p": 32, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P7-1.webp"}}]}, {"t": "Example: how long does a sharp last?", "f": "audio/P7/04-example-how-long-does-a-sharp-last.mp3", "s": 20, "p": 32, "l": [{"t0": 0.2, "t1": 9.82, "who": "B", "text": "The first note is F sharp. Later in the bar, an F with no sign. Then another after the bar line. Sharp or not? Pause and think.", "cue": {"p": 32, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P7-2-q.webp"}}, {"t0": 9.82, "t1": 13.82, "who": "pause", "text": "Pause and try.", "cue": {"p": 32, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P7-2-q.webp"}}, {"t0": 13.82, "t1": 17.89, "who": "P", "text": "Still F sharp until the bar line. After it, plain F again.", "cue": {"p": 32, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P7-2.webp"}}, {"t0": 17.89, "t1": 20.3, "who": "piano", "notes": [17.89, 18.51, 19.38], "cue": {"p": 32, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P7-2.webp"}}]}, {"t": "Example: a natural cancels", "f": "audio/P7/05-example-a-natural-cancels.mp3", "s": 15, "p": 32, "l": [{"t0": 0.2, "t1": 6.45, "who": "B", "text": "B, then B flat, then a B with a natural sign. What does the natural do? Pause.", "cue": {"p": 32, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P7-3-q.webp"}}, {"t0": 6.45, "t1": 9.45, "who": "pause", "text": "Pause and try.", "cue": {"p": 32, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P7-3-q.webp"}}, {"t0": 9.45, "t1": 12.68, "who": "P", "text": "It cancels the flat: back to the white key B.", "cue": {"p": 32, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P7-3.webp"}}, {"t0": 12.68, "t1": 14.84, "who": "piano", "notes": [12.68, 13.3, 13.92], "cue": {"p": 32, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P7-3.webp"}}]}, {"t": "Example: one key, two names", "f": "audio/P7/06-example-one-key-two-names.mp3", "s": 20, "p": 32, "l": [{"t0": 0.2, "t1": 6.72, "who": "B", "text": "F sharp, then G flat. Are they different keys? And which key is E sharp? Pause and look.", "cue": {"p": 32, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P7-4-q.webp"}}, {"t0": 6.72, "t1": 10.72, "who": "pause", "text": "Pause and try.", "cue": {"p": 32, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P7-4-q.webp"}}, {"t0": 10.72, "t1": 17.74, "who": "P", "text": "F sharp and G flat are the same black key. E sharp is the white key F. Same sound, different names: enharmonic.", "cue": {"p": 32, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P7-4.webp"}}, {"t0": 17.74, "t1": 20.15, "who": "piano", "notes": [17.74, 18.36, 19.23], "cue": {"p": 32, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P7-4.webp"}}]}, {"t": "Try it: Für Elise", "f": "audio/P7/07-try-it-f-r-elise.mp3", "s": 19, "p": 32, "l": [{"t0": 0.2, "t1": 7.36, "who": "B", "text": "Beethoven’s Für Elise starts with E and D sharp, back and forth: the black key just left of E.", "cue": {"p": 32, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P7-5.webp"}}, {"t0": 7.36, "t1": 11.38, "who": "piano", "notes": [7.36, 7.67, 7.98, 8.29, 8.6, 8.91, 9.22, 9.53, 9.84], "cue": {"p": 32, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P7-5.webp"}}, {"t0": 11.38, "t1": 17.25, "who": "B", "text": "The bar line wipes out the sharp, so it is written again. Until next time, Clara.", "cue": {"p": 32, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P7-5.webp"}}, {"t0": 17.25, "t1": 18.71, "who": "P", "text": "Goodbye!", "cue": {"p": 32, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P7-5.webp"}}]}]}, {"k": "P8", "part": "Part I · Pitch", "t": "8 · Tones and semitones", "pages": [34], "clips": [{"t": "Tones and semitones", "f": "audio/P8/01-tones-and-semitones.mp3", "s": 48, "p": 34, "l": [{"t0": 3.4, "t1": 12.89, "who": "B", "text": "The smallest step on the piano, Clara, is a semitone: from one key to the very next, black or white. Two semitones make a tone.", "cue": {"p": 34, "r": "lead"}}, {"t0": 12.89, "t1": 15.05, "who": "piano", "notes": [12.89, 13.51, 14.13], "cue": {"p": 34, "r": "lead"}}, {"t0": 15.05, "t1": 19.55, "who": "B", "text": "Remember: the very next key is a semitone; two make a tone.", "cue": {"p": 34, "r": "remember"}}, {"t0": 19.55, "t1": 30.91, "who": "B", "text": "Think of your best friend, sitting right next to you with nobody in between: a semitone. On the white keys, two pairs are already best friends: E and F, and B and C.", "cue": {"p": 34, "r": "picture"}}, {"t0": 30.91, "t1": 33.94, "who": "piano", "notes": [30.91, 31.53, 32.4, 33.02], "cue": {"p": 34, "r": "picture"}}, {"t0": 33.94, "t1": 40.76, "who": "B", "text": "Everywhere else a black key sits between: C to D has C sharp between, so it is a tone.", "cue": {"p": 34, "r": "rule"}}, {"t0": 40.76, "t1": 42.3, "who": "piano", "notes": [40.76, 41.38], "cue": {"p": 34, "r": "rule"}}, {"t0": 42.3, "t1": 48.34, "who": "B", "text": "One trap: E to F and B to C are white keys, but only a semitone apart.", "cue": {"p": 34, "r": "trap"}}]}, {"t": "Example: tone or semitone?", "f": "audio/P8/02-example-tone-or-semitone.mp3", "s": 20, "p": 34, "l": [{"t0": 0.2, "t1": 7.28, "who": "B", "text": "Look between the red keys, E and F. Is there a black key? Then try C and D. Pause and look.", "cue": {"p": 34, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P8-1-q.webp"}}, {"t0": 7.28, "t1": 11.28, "who": "pause", "text": "Pause and try.", "cue": {"p": 34, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P8-1-q.webp"}}, {"t0": 11.28, "t1": 16.56, "who": "P", "text": "E to F has nothing between: a semitone. C to D has C sharp between: a tone.", "cue": {"p": 34, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P8-1.webp"}}, {"t0": 16.56, "t1": 19.59, "who": "piano", "notes": [16.56, 17.18, 18.05, 18.67], "cue": {"p": 34, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P8-1.webp"}}]}, {"t": "Try it", "f": "audio/P8/03-try-it.mp3", "s": 16, "p": 34, "l": [{"t0": 0.2, "t1": 9.45, "who": "B", "text": "Play C and every next key up to the next C, saying semitone each time. Twelve semitones make an octave. Until next time.", "cue": {"p": 34, "r": "trap"}}, {"t0": 9.45, "t1": 14.09, "who": "piano", "notes": [9.45, 9.76, 10.07, 10.38, 10.69, 11.0, 11.31, 11.62, 11.93, 12.24, 12.55, 12.86, 13.17], "cue": {"p": 34, "r": "trap"}}, {"t0": 14.09, "t1": 15.56, "who": "P", "text": "Goodbye!", "cue": {"p": 34, "r": "trap"}}]}]}, {"k": "P9", "part": "Part I · Pitch", "t": "9 · Intervals", "pages": [35, 36], "clips": [{"t": "Intervals", "f": "audio/P9/01-intervals.mp3", "s": 35, "p": 35, "l": [{"t0": 3.4, "t1": 8.09, "who": "B", "text": "Here is a riddle, Clara. Monday to Wednesday: how many days?", "cue": {"p": 35, "r": "lead"}}, {"t0": 8.09, "t1": 10.86, "who": "P", "text": "Monday, Tuesday, Wednesday: three!", "cue": {"p": 35, "r": "lead"}}, {"t0": 10.86, "t1": 19.43, "who": "B", "text": "That is how we count intervals: the distance between two notes. Remember: for the number, count the notes, both ends included.", "cue": {"p": 35, "r": "remember"}}, {"t0": 19.43, "t1": 23.39, "who": "B", "text": "C to E is C, D, E: three notes, a third.", "cue": {"p": 35, "r": "picture"}}, {"t0": 23.39, "t1": 27.25, "who": "piano", "notes": [23.39, 24.01, 24.63, 25.5], "cue": {"p": 35, "r": "picture"}}, {"t0": 27.25, "t1": 35.42, "who": "B", "text": "Count the letters, white keys or lines and spaces, never the black keys. Sharps and flats never change the number.", "cue": {"p": 35, "r": "rule"}}]}, {"t": "Steps, skips, melodic and harmonic", "f": "audio/P9/02-steps-skips-melodic-and-harmonic.mp3", "s": 34, "p": 36, "l": [{"t0": 0.2, "t1": 11.5, "who": "B", "text": "The two smallest intervals have everyday names. A step is a second: the very next line or space. A skip is a third: line to line, or space to space.", "cue": {"p": 36, "r": "h:Steps and skips"}}, {"t0": 11.5, "t1": 14.53, "who": "piano", "notes": [11.5, 12.12, 12.99, 13.61], "cue": {"p": 36, "r": "h:Steps and skips"}}, {"t0": 14.53, "t1": 21.55, "who": "B", "text": "One after the other, an interval is melodic. Together, it is harmonic. The number stays the same.", "cue": {"p": 36, "r": "h:Steps and skips"}}, {"t0": 21.55, "t1": 24.79, "who": "piano", "notes": [21.55, 22.17, 23.04], "cue": {"p": 36, "r": "h:Steps and skips"}}, {"t0": 24.79, "t1": 33.83, "who": "B", "text": "Two traps: count the notes, not the gaps. And a step changes from line to space; a skip stays on lines, or on spaces.", "cue": {"p": 36, "r": "trap"}}]}, {"t": "Example: on the keyboard", "f": "audio/P9/03-example-on-the-keyboard.mp3", "s": 15, "p": 35, "l": [{"t0": 0.2, "t1": 6.19, "who": "B", "text": "Two red keys: E, and the C above it. Count the notes from E. Pause and count.", "cue": {"p": 35, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P9-1-q.webp"}}, {"t0": 6.19, "t1": 10.19, "who": "pause", "text": "Pause and try.", "cue": {"p": 35, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P9-1-q.webp"}}, {"t0": 10.19, "t1": 13.56, "who": "P", "text": "E, F, G, A, B, C: six notes. A sixth.", "cue": {"p": 35, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P9-1.webp"}}, {"t0": 13.56, "t1": 15.1, "who": "piano", "notes": [13.56, 14.18], "cue": {"p": 35, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/P9-1.webp"}}]}, {"t": "Example: up and down", "f": "audio/P9/04-example-up-and-down.mp3", "s": 17, "p": 35, "l": [{"t0": 0.2, "t1": 6.15, "who": "B", "text": "F up to A. Then C down to G. Call the first note one and count. Pause.", "cue": {"p": 35, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P9-2-q.webp"}}, {"t0": 6.15, "t1": 10.15, "who": "pause", "text": "Pause and try.", "cue": {"p": 35, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P9-2-q.webp"}}, {"t0": 10.15, "t1": 13.62, "who": "P", "text": "F, G, A: a third. C, B, A, G: a fourth.", "cue": {"p": 35, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P9-2.webp"}}, {"t0": 13.62, "t1": 16.65, "who": "piano", "notes": [13.62, 14.24, 15.11, 15.73], "cue": {"p": 35, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P9-2.webp"}}]}, {"t": "Example: melodic or harmonic?", "f": "audio/P9/05-example-melodic-or-harmonic.mp3", "s": 15, "p": 35, "l": [{"t0": 0.2, "t1": 6.04, "who": "B", "text": "In the first bar, C then E. In the second, C and E together. What are they? Pause.", "cue": {"p": 35, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P9-3-q.webp"}}, {"t0": 6.04, "t1": 9.04, "who": "pause", "text": "Pause and try.", "cue": {"p": 35, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P9-3-q.webp"}}, {"t0": 9.04, "t1": 12.13, "who": "P", "text": "Both are thirds: melodic, then harmonic.", "cue": {"p": 35, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P9-3.webp"}}, {"t0": 12.13, "t1": 15.37, "who": "piano", "notes": [12.13, 12.75, 13.62], "cue": {"p": 35, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P9-3.webp"}}]}, {"t": "Try it: your hand is a ruler", "f": "audio/P9/06-try-it-your-hand-is-a-ruler.mp3", "s": 15, "p": 35, "l": [{"t0": 0.2, "t1": 9.88, "who": "B", "text": "Thumb on C, little finger on G: a fifth. Thumb to finger three: a third. Your hand is a ruler you carry everywhere. Until next time.", "cue": {"p": 35, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P9-4.webp"}}, {"t0": 9.88, "t1": 13.33, "who": "piano", "notes": [9.88, 11.58], "cue": {"p": 35, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P9-4.webp"}}, {"t0": 13.33, "t1": 14.8, "who": "P", "text": "Goodbye!", "cue": {"p": 35, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P9-4.webp"}}]}]}, {"k": "P10", "part": "Part I · Pitch", "t": "10 · Major, minor and perfect", "pages": [37], "clips": [{"t": "Major, minor and perfect", "f": "audio/P10/01-major-minor-and-perfect.mp3", "s": 48, "p": 37, "l": [{"t0": 3.4, "t1": 8.3, "who": "B", "text": "Listen, Clara. C to E, and C to E flat. Both are thirds.", "cue": {"p": 37, "r": "lead"}}, {"t0": 8.3, "t1": 11.75, "who": "piano", "notes": [8.3, 10.0], "cue": {"p": 37, "r": "lead"}}, {"t0": 11.75, "t1": 14.82, "who": "P", "text": "But one sounds bright, and one sounds dark.", "cue": {"p": 37, "r": "lead"}}, {"t0": 14.82, "t1": 24.97, "who": "B", "text": "To tell them apart, count the keys in between, black and white. Remember: three keys between, a major third. Two keys between, a minor third.", "cue": {"p": 37, "r": "remember"}}, {"t0": 24.97, "t1": 29.74, "who": "B", "text": "Count the notes for the number. Count the keys between for the size.", "cue": {"p": 37, "r": "rule"}}, {"t0": 29.74, "t1": 40.38, "who": "B", "text": "Seconds, thirds, sixths and sevenths come in two sizes, major and minor. Unisons, fourths, fifths and octaves have one main size, called perfect.", "cue": {"p": 37, "r": "table"}}, {"t0": 40.38, "t1": 42.73, "who": "Q", "text": "Perfect, like me.", "cue": {"p": 37, "r": "table"}}, {"t0": 42.73, "t1": 48.48, "who": "B", "text": "One trap: count every key between, black and white, not the white keys only.", "cue": {"p": 37, "r": "trap"}}]}, {"t": "Example: A up to C", "f": "audio/P10/02-example-a-up-to-c.mp3", "s": 17, "p": 37, "l": [{"t0": 0.2, "t1": 5.96, "who": "B", "text": "A up to C. First the number, then count the keys between. Pause and count.", "cue": {"p": 37, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P10-2-q.webp"}}, {"t0": 5.96, "t1": 9.96, "who": "pause", "text": "Pause and try.", "cue": {"p": 37, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P10-2-q.webp"}}, {"t0": 9.96, "t1": 14.96, "who": "P", "text": "A, B, C: a third. Two keys between, B flat and B: a minor third. Dark.", "cue": {"p": 37, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P10-2.webp"}}, {"t0": 14.96, "t1": 16.71, "who": "piano", "notes": [14.96], "cue": {"p": 37, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/P10-2.webp"}}]}, {"t": "Example: F up to A", "f": "audio/P10/03-example-f-up-to-a.mp3", "s": 15, "p": 37, "l": [{"t0": 0.2, "t1": 4.7, "who": "B", "text": "Now F up to A. Three keys between, or two? Pause.", "cue": {"p": 37, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P10-3-q.webp"}}, {"t0": 4.7, "t1": 8.7, "who": "pause", "text": "Pause and try.", "cue": {"p": 37, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P10-3-q.webp"}}, {"t0": 8.7, "t1": 12.96, "who": "P", "text": "Three keys between: a major third, the same size as C to E.", "cue": {"p": 37, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P10-3.webp"}}, {"t0": 12.96, "t1": 14.71, "who": "piano", "notes": [12.96], "cue": {"p": 37, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/P10-3.webp"}}]}, {"t": "Example: D up to A", "f": "audio/P10/04-example-d-up-to-a.mp3", "s": 15, "p": 37, "l": [{"t0": 0.2, "t1": 4.55, "who": "B", "text": "D up to A. The number first, then the size. Pause.", "cue": {"p": 37, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P10-4-q.webp"}}, {"t0": 4.55, "t1": 8.55, "who": "pause", "text": "Pause and try.", "cue": {"p": 37, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P10-4-q.webp"}}, {"t0": 8.55, "t1": 13.41, "who": "P", "text": "D to A is five notes, a fifth, with six keys between: a perfect fifth.", "cue": {"p": 37, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P10-4.webp"}}, {"t0": 13.41, "t1": 15.16, "who": "piano", "notes": [13.41], "cue": {"p": 37, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/P10-4.webp"}}]}, {"t": "Try it: Beethoven’s Fifth", "f": "audio/P10/05-try-it-beethoven-s-fifth.mp3", "s": 20, "p": 37, "l": [{"t0": 0.2, "t1": 10.65, "who": "B", "text": "Da da da DUM. G down to E flat: three notes, a third, with three keys between: a major third. Counting down works the same way.", "cue": {"p": 37, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P10-5.webp"}}, {"t0": 10.65, "t1": 13.74, "who": "piano", "notes": [10.65, 10.96, 11.27, 11.58], "cue": {"p": 37, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P10-5.webp"}}, {"t0": 13.74, "t1": 18.24, "who": "B", "text": "And that is the end of Part One, Clara. Until next time.", "cue": {"p": 37, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P10-5.webp"}}, {"t0": 18.24, "t1": 19.98, "who": "P", "text": "Goodbye, Butler!", "cue": {"p": 37, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/P10-5.webp"}}]}]}, {"k": "O2", "part": "Part II · Time", "t": "Part opener", "pages": [38], "clips": [{"t": "Part Two: Time", "f": "audio/O2/01-part-two-time.mp3", "s": 43, "p": 38, "l": [{"t0": 3.4, "t1": 7.98, "who": "B", "text": "Welcome to Part Two, Clara: Time. When, and for how long.", "cue": {"p": 38, "r": "opener"}}, {"t0": 7.98, "t1": 19.82, "who": "B", "text": "Underneath every piece runs a steady pulse, like a heartbeat. Each note and each rest gets its fair share of it. Listen: long notes, short notes, a silence and a dot.", "cue": {"p": 38, "r": "opener"}}, {"t0": 19.82, "t1": 25.78, "who": "piano", "notes": [19.82, 20.44, 21.06, 21.68, 22.3, 22.92, 23.54, 24.16], "cue": {"p": 38, "r": "opener"}}, {"t0": 25.78, "t1": 40.6, "who": "B", "text": "Twelve chapters: notes, rests, dotted notes, ties, pulse and tempo, time signatures, compound time, irregular time, groups and beams, upbeats, triplets, and rhythms off the beat. Shall we start with the notes themselves?", "cue": {"p": 38, "r": "chapters"}}, {"t0": 40.6, "t1": 43.05, "who": "P", "text": "One, two, three, four. Yes!", "cue": {"p": 38, "r": "chapters"}}]}]}, {"k": "T1", "part": "Part II · Time", "t": "1 · Notes", "pages": [39], "clips": [{"t": "Notes", "f": "audio/T1/01-notes.mp3", "s": 54, "p": 39, "l": [{"t0": 3.4, "t1": 10.48, "who": "B", "text": "A note shows how long a sound lasts, Clara. The emptier and plainer its shape, the longer it lasts.", "cue": {"p": 39, "r": "lead"}}, {"t0": 10.48, "t1": 22.29, "who": "B", "text": "Remember: each note lasts half as long as the one above it. A semibreve, four beats. A minim, two. A crotchet, one. A quaver, half a beat. A semiquaver, a quarter.", "cue": {"p": 39, "r": "remember"}}, {"t0": 22.29, "t1": 30.73, "who": "piano", "notes": [22.29, 22.91, 23.53, 24.15, 24.77, 25.39, 26.01, 26.63, 27.25, 27.87, 28.49, 29.11], "cue": {"p": 39, "r": "picture"}}, {"t0": 30.73, "t1": 33.93, "who": "P", "text": "Each one twice as fast as the one before!", "cue": {"p": 39, "r": "picture"}}, {"t0": 33.93, "t1": 44.63, "who": "B", "text": "Every note has a head. Every note but the semibreve has a stem. Notes shorter than one beat also have a flag: one for a quaver, two for a semiquaver.", "cue": {"p": 39, "r": "more"}}, {"t0": 44.63, "t1": 53.84, "who": "B", "text": "Side by side, the flags join into beams. One beam for quavers, two for semiquavers. A beam never changes the length.", "cue": {"p": 39, "r": "more"}}]}, {"t": "Whole, half and quarter", "f": "audio/T1/02-whole-half-and-quarter.mp3", "s": 24, "p": 39, "l": [{"t0": 0.2, "t1": 14.49, "who": "B", "text": "American books call them whole, half and quarter notes. Think of each beat as a pizza: a bar of four-four is four pizzas. The whole note fills all four; the others are a half, a quarter, an eighth and a sixteenth of it.", "cue": {"p": 39, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T1-1.webp"}}, {"t0": 14.49, "t1": 17.19, "who": "P", "text": "And two quavers share one pizza.", "cue": {"p": 39, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T1-1.webp"}}, {"t0": 17.19, "t1": 24.25, "who": "B", "text": "Precisely. Draw the notes yourself, too: it is the quickest way to remember them. Until next time.", "cue": {"p": 39, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T1-2.webp"}}]}]}, {"k": "T2", "part": "Part II · Time", "t": "2 · Rests", "pages": [40], "clips": [{"t": "Rests", "f": "audio/T2/01-rests.mp3", "s": 51, "p": 40, "l": [{"t0": 3.4, "t1": 8.37, "who": "B", "text": "A rest is a silence you count, Clara, just as carefully as a note.", "cue": {"p": 40, "r": "lead"}}, {"t0": 8.37, "t1": 10.84, "who": "P", "text": "Who leaves pizza on the plate?", "cue": {"p": 40, "r": "lead"}}, {"t0": 10.84, "t1": 19.0, "who": "B", "text": "A rest does: the same share, left empty. Remember: same name, same length. A rest is its note’s silent twin.", "cue": {"p": 40, "r": "remember"}}, {"t0": 19.0, "t1": 29.26, "who": "B", "text": "The two big rests look alike. The semibreve rest hangs from line four, heavy as a coat on a hook. The minim rest sits on line three, like a hat.", "cue": {"p": 40, "r": "picture"}}, {"t0": 29.26, "t1": 42.48, "who": "B", "text": "And the semibreve rest has a special power: it can mean a whole bar of silence in any time signature. Four beats in four-four, three in three-four, two in two-four. No other rest can do that.", "cue": {"p": 40, "r": "more"}}, {"t0": 42.48, "t1": 50.99, "who": "B", "text": "One trap: do not mix up those two. Hanging below line four, the semibreve rest. Sitting on line three, the minim rest.", "cue": {"p": 40, "r": "trap"}}]}, {"t": "Example: count the silences", "f": "audio/T2/02-example-count-the-silences.mp3", "s": 18, "p": 40, "l": [{"t0": 0.2, "t1": 7.0, "who": "B", "text": "A minim, a crotchet and a crotchet rest. How many beats does the bar hold? Pause and add them.", "cue": {"p": 40, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T2-2-q.webp"}}, {"t0": 7.0, "t1": 11.0, "who": "pause", "text": "Pause and try.", "cue": {"p": 40, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T2-2-q.webp"}}, {"t0": 11.0, "t1": 14.07, "who": "P", "text": "Two, one, and one for the rest: four beats!", "cue": {"p": 40, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T2-2.webp"}}, {"t0": 14.07, "t1": 17.55, "who": "piano", "notes": [14.07, 14.69, 15.31, 15.93], "cue": {"p": 40, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T2-2.webp"}}]}, {"t": "Example: the last seat", "f": "audio/T2/03-example-the-last-seat.mp3", "s": 14, "p": 40, "l": [{"t0": 0.2, "t1": 7.04, "who": "B", "text": "A bar of four-four with a minim
