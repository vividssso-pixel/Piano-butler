": 22.66, "who": "B", "text": "And the second inversion of G?", "cue": {"p": 120, "r": "ex3"}}, {"t0": 22.66, "t1": 25.66, "who": "pause", "text": "Pause and try.", "cue": {"p": 120, "r": "ex3"}}, {"t0": 25.66, "t1": 29.24, "who": "P", "text": "G B D, with the fifth at the bottom: D G B.", "cue": {"p": 120, "r": "ex3", "reveal": true}}, {"t0": 29.24, "t1": 30.99, "who": "piano", "notes": [29.24], "cue": {"p": 120, "r": "ex3", "reveal": true}}]}, {"t": "Example: find the root", "f": "audio/H4/05-example-find-the-root.mp3", "s": 34, "p": 120, "l": [{"t0": 0.2, "t1": 7.9, "who": "B", "text": "Find the root of E G C. Restack the notes so that each skips one letter. Try starting on each note.", "cue": {"p": 121, "r": "ex4"}}, {"t0": 7.9, "t1": 11.9, "who": "pause", "text": "Pause and try.", "cue": {"p": 121, "r": "ex4"}}, {"t0": 11.9, "t1": 16.97, "who": "P", "text": "E G C doesn’t work, G C E doesn’t, but C E G does! The root is C.", "cue": {"p": 121, "r": "ex4", "reveal": true}}, {"t0": 16.97, "t1": 21.94, "who": "B", "text": "C major, first inversion. Now A, D, F: which position?", "cue": {"p": 121, "r": "ex5"}}, {"t0": 21.94, "t1": 25.94, "who": "pause", "text": "Pause and try.", "cue": {"p": 121, "r": "ex5"}}, {"t0": 25.94, "t1": 31.2, "who": "P", "text": "Restacked: D F A, D minor. A is the fifth, at the bottom: second inversion!", "cue": {"p": 121, "r": "ex5", "reveal": true}}, {"t0": 31.2, "t1": 34.4, "who": "piano", "notes": [31.2, 32.65], "cue": {"p": 121, "r": "ex5", "reveal": true}}]}, {"t": "You know this", "f": "audio/H4/06-you-know-this.mp3", "s": 65, "p": 121, "l": [{"t0": 0.2, "t1": 15.51, "who": "B", "text": "Pachelbel’s Canon, the bass, here in C. In the popular version the bass walks straight down the scale: C, B, A, G, F, E, F, G. It can, because some chords are inversions: G stands on B, E minor on G, C on E.", "cue": {"p": 121, "r": "yk"}, "hits": [[2.75, "#0", 37, 38, "yk"], [7.52, "#0", 103, 104, "yk"], [8.17, "#7", 112, 113, "yk"], [8.39, "#6", 115, 116, "yk"], [8.82, "#6", 121, 122, "yk"], [9.04, "#7", 124, 125, "yk"], [12.44, "#7", 171, 172, "yk"], [14.32, "#7", 197, 198, "yk"], [14.53, "#0", 200, 201, "yk"]]}, {"t0": 15.51, "t1": 37.58, "who": "piano", "notes": [15.51, 16.75, 17.99, 19.23, 20.47, 21.71, 22.95, 24.19, 25.68, 27.13, 28.58, 30.03, 31.48, 32.93, 34.38, 35.83], "cue": {"p": 121, "r": "yk"}}, {"t0": 37.58, "t1": 41.55, "who": "P", "text": "That’s the wedding music! It sounds like a staircase in a palace.", "cue": {"p": 121, "r": "yk"}}, {"t0": 41.55, "t1": 48.56, "who": "B", "text": "Your little task for next time: play C, F and G chords moving your hand as little as possible.", "cue": {"p": 121, "r": "watch"}}, {"t0": 48.56, "t1": 50.01, "who": "P", "text": "I will!", "cue": {"p": 121, "r": "watch"}}, {"t0": 50.01, "t1": 63.21, "who": "B", "text": "Two traps: never name a chord from its bass note in an inversion; restack it in thirds first. And an inversion is not a new chord: E G C is still C major. Until next time, Clara.", "cue": {"p": 121, "r": "watch"}}, {"t0": 63.21, "t1": 64.8, "who": "P", "text": "Bye, Butler!", "cue": {"p": 121, "r": "watch"}}]}]}, {"k": "H5", "part": "Part V · Chords", "t": "5 · Seventh chords", "pages": [122, 123, 124], "clips": [{"t": "Seventh chords", "f": "audio/H5/01-seventh-chords.mp3", "s": 38, "p": 122, "l": [{"t0": 3.4, "t1": 6.74, "who": "B", "text": "Clara, what if our cake had one more layer?", "cue": {"p": 122, "r": "h:Seventh chords"}}, {"t0": 6.74, "t1": 9.07, "who": "P", "text": "Then it would be a better cake.", "cue": {"p": 122, "r": "lead"}}, {"t0": 9.07, "t1": 21.43, "who": "B", "text": "A different cake, anyway. Add one more layer, and the chord changes colour: dreamy, bluesy, spooky. Same rule as before: skip one note, stack the next. The new note is the seventh.", "cue": {"p": 122, "r": "lead"}, "hits": [[20.43, "#7", 172, 179, "two"]]}, {"t0": 21.43, "t1": 30.2, "who": "B", "text": "Build the triad, C E G. Skip one, add the next: B. Count the keys between: three, two, three. That is C major seven.", "cue": {"p": 122, "r": "two"}, "hits": [[22.54, "#0", 17, 18, "two"], [22.69, "#2", 19, 20, "two"], [22.83, "#4", 21, 22, "two"], [24.79, "#6", 48, 49, "two"], [28.71, "#0", 102, 103, "two"]]}, {"t0": 30.2, "t1": 34.68, "who": "piano", "notes": [30.2, 30.82, 31.44, 32.06, 32.93], "cue": {"p": 122, "r": "two"}}, {"t0": 34.68, "t1": 38.02, "who": "P", "text": "Ooh, that sounds like a film about a summer holiday.", "cue": {"p": 122, "r": "two"}}]}, {"t": "Five flavours", "f": "audio/H5/02-five-flavours.mp3", "s": 59, "p": 123, "l": [{"t0": 0.2, "t1": 6.15, "who": "B", "text": "There are five flavours, all on C. Major seven: dreamy, like bossa nova.", "cue": {"p": 122, "r": "k7"}}, {"t0": 6.15, "t1": 7.9, "who": "piano", "notes": [6.15], "cue": {"p": 122, "r": "k7"}}, {"t0": 7.9, "t1": 12.56, "who": "B", "text": "Seven: bluesy. The top goes down just one key, to B flat.", "cue": {"p": 122, "r": "k7"}}, {"t0": 12.56, "t1": 14.31, "who": "piano", "notes": [12.56], "cue": {"p": 122, "r": "k7"}}, {"t0": 14.31, "t1": 17.77, "who": "B", "text": "Minor seven: mellow, like a soul ballad.", "cue": {"p": 122, "r": "k7"}}, {"t0": 17.77, "t1": 19.52, "who": "piano", "notes": [17.77], "cue": {"p": 122, "r": "k7"}}, {"t0": 19.52, "t1": 23.95, "who": "B", "text": "Half-diminished: searching, like a detective in the rain.", "cue": {"p": 122, "r": "k7"}}, {"t0": 23.95, "t1": 25.7, "who": "piano", "notes": [23.95], "cue": {"p": 122, "r": "k7"}}, {"t0": 25.7, "t1": 30.62, "who": "B", "text": "And diminished seven: spooky, the chord of every old film villain.", "cue": {"p": 122, "r": "k7"}}, {"t0": 30.62, "t1": 32.37, "who": "piano", "notes": [30.62], "cue": {"p": 122, "r": "k7"}}, {"t0": 32.37, "t1": 34.35, "who": "P", "text": "Mwa-ha-ha!", "cue": {"p": 122, "r": "k7"}}, {"t0": 34.35, "t1": 48.47, "who": "B", "text": "Exactly the right reaction. And on every note of C major there is a seventh too: C major seven, D minor seven, E minor seven, F major seven, G seven, A minor seven and B half-diminished.", "cue": {"p": 122, "r": "vx"}, "hits": [[39.26, "#7", 68, 75, "two"]]}, {"t0": 48.47, "t1": 58.92, "who": "piano", "notes": [48.47, 49.92, 51.37, 52.82, 54.27, 55.72, 57.17], "cue": {"p": 122, "r": "vx"}}]}, {"t": "Spot the difference", "f": "audio/H5/03-spot-the-difference.mp3", "s": 56, "p": 123, "l": [{"t0": 0.2, "t1": 8.15, "who": "B", "text": "One note decides it. B makes C major seven, B flat makes C seven. Everything below stays the same.", "cue": {"p": 123, "r": "vx"}, "hits": [[2.33, "#0", 29, 30, "vx"], [3.49, "#6", 44, 50, "try10"], [4.5, "#0", 57, 58, "vx"]]}, {"t0": 8.15, "t1": 11.35, "who": "piano", "notes": [8.15, 9.6], "cue": {"p": 123, "r": "vx"}}, {"t0": 11.35, "t1": 16.34, "who": "B", "text": "Which seventh is G B D F? Count the keys between each layer.", "cue": {"p": 123, "r": "ex1"}}, {"t0": 16.34, "t1": 21.34, "who": "pause", "text": "Pause and try.", "cue": {"p": 123, "r": "ex1"}}, {"t0": 21.34, "t1": 24.49, "who": "P", "text": "Three, two, two. The bluesy one! G seven.", "cue": {"p": 123, "r": "ex1", "reveal": true}}, {"t0": 24.49, "t1": 27.69, "who": "piano", "notes": [24.49, 25.94], "cue": {"p": 123, "r": "ex1", "reveal": true}}, {"t0": 27.69, "t1": 36.75, "who": "B", "text": "Hear how G seven wants to fall home to C? Game: name each chord. F A C E, C E G B flat, D F A C.", "cue": {"p": 123, "r": "game"}, "hits": [[34.83, "#6", 80, 86, "try10"]]}, {"t0": 36.75, "t1": 41.75, "who": "pause", "text": "Pause and try.", "cue": {"p": 123, "r": "game"}}, {"t0": 41.75, "t1": 45.21, "who": "P", "text": "F major seven, C seven, D minor seven.", "cue": {"p": 123, "r": "game", "reveal": true}}, {"t0": 45.21, "t1": 52.6, "who": "B", "text": "Try it: C seven, then C major seven. One key changes the top layer: bluesy, then dreamy.", "cue": {"p": 123, "r": "try10"}, "hits": [[45.73, "#0", 8, 9, "try10"], [46.85, "#0", 22, 23, "try10"]]}, {"t0": 52.6, "t1": 55.8, "who": "piano", "notes": [52.6, 54.05], "cue": {"p": 123, "r": "try10"}}]}, {"t": "Examples: build sevenths", "f": "audio/H5/04-examples-build-sevenths.mp3", "s": 68, "p": 124, "l": [{"t0": 0.2, "t1": 6.23, "who": "B", "text": "C major seven or C seven: which note changes? Compare the top layers.", "cue": {"p": 124, "r": "ex2"}}, {"t0": 6.23, "t1": 9.23, "who": "pause", "text": "Pause and try.", "cue": {"p": 124, "r": "ex2"}}, {"t0": 9.23, "t1": 14.71, "who": "P", "text": "Only the top: B, three keys between, is major seven. B flat, two between, is seven.", "cue": {"p": 124, "r": "ex2", "reveal": true}}, {"t0": 14.71, "t1": 23.03, "who": "B", "text": "Build G seven. G major is G B D. Skip one more letter above D: which, and how many keys between?", "cue": {"p": 124, "r": "ex3"}}, {"t0": 23.03, "t1": 27.03, "who": "pause", "text": "Pause and try.", "cue": {"p": 124, "r": "ex3"}}, {"t0": 27.03, "t1": 32.06, "who": "P", "text": "F. D to F has two between, so the bluesy one: G B D F, G seven.", "cue": {"p": 124, "r": "ex3", "reveal": true}}, {"t0": 32.06, "t1": 37.13, "who": "B", "text": "And A minor seven: A, C, E, then the next letter but one above E.", "cue": {"p": 124, "r": "ex4"}}, {"t0": 37.13, "t1": 40.13, "who": "pause", "text": "Pause and try.", "cue": {"p": 124, "r": "ex4"}}, {"t0": 40.13, "t1": 43.71, "who": "P", "text": "G! A C E G: two, three, two. A minor seven.", "cue": {"p": 124, "r": "ex4", "reveal": true}}, {"t0": 43.71, "t1": 45.46, "who": "piano", "notes": [43.71], "cue": {"p": 124, "r": "ex4", "reveal": true}}, {"t0": 45.46, "t1": 53.43, "who": "B", "text": "Your little task for next time: play C seven, then C major seven, and say which is bluesy and which is dreamy.", "cue": {"p": 124, "r": "watch"}}, {"t0": 53.43, "t1": 54.88, "who": "P", "text": "I will!", "cue": {"p": 124, "r": "watch"}}, {"t0": 54.88, "t1": 65.71, "who": "B", "text": "Two traps: seven alone always means the bluesy one, with the lower top. And count the seventh up from the root, not from the fifth. Until next time, Clara.", "cue": {"p": 124, "r": "watch"}}, {"t0": 65.71, "t1": 68.29, "who": "P", "text": "Bye, Butler! Mwa-ha-ha!", "cue": {"p": 124, "r": "watch"}}]}]}, {"k": "H6", "part": "Part V · Chords", "t": "6 · Colour chords", "pages": [125, 126, 127], "clips": [{"t": "Colour chords", "f": "audio/H6/01-colour-chords.mp3", "s": 50, "p": 125, "l": [{"t0": 3.4, "t1": 11.67, "who": "B", "text": "Clara, the third of a chord is its mood: major or minor, happy or sad. Now watch what happens when we play with it.", "cue": {"p": 125, "r": "h:Colour chords"}}, {"t0": 11.67, "t1": 20.54, "who": "B", "text": "Slide it aside, take it away, or add one note, and a plain chord takes on a new colour. Five colours, all from C E G.", "cue": {"p": 125, "r": "lead"}}, {"t0": 20.54, "t1": 26.66, "who": "B", "text": "Start from C E G. Slide the E up to the next letter, F: C sus four.", "cue": {"p": 125, "r": "two"}, "hits": [[21.37, "#0", 11, 12, "two"], [21.54, "#1", 13, 14, "two"], [21.71, "#2", 15, 16, "two"], [22.83, "#1", 28, 29, "two"], [24.98, "#4", 53, 54, "two"], [25.24, "#0", 56, 57, "two"]]}, {"t0": 26.66, "t1": 29.86, "who": "piano", "notes": [26.66, 28.11], "cue": {"p": 125, "r": "two"}}, {"t0": 29.86, "t1": 33.46, "who": "B", "text": "Or down to the letter below, D: C sus two.", "cue": {"p": 125, "r": "two"}, "hits": [[31.98, "#3", 29, 30, "two"], [32.22, "#0", 32, 33, "two"]]}, {"t0": 33.46, "t1": 36.66, "who": "piano", "notes": [33.46, 34.91], "cue": {"p": 125, "r": "two"}}, {"t0": 36.66, "t1": 40.6, "who": "P", "text": "It sounds like it’s waiting for something. Like holding your breath.", "cue": {"p": 125, "r": "two"}}, {"t0": 40.6, "t1": 49.56, "who": "B", "text": "Exactly. With no third, the chord is neither major nor minor: it hangs in the air, like a question nobody has answered yet.", "cue": {"p": 125, "r": "secret"}}]}, {"t": "Five colours on C", "f": "audio/H6/02-five-colours-on-c.mp3", "s": 45, "p": 126, "l": [{"t0": 0.2, "t1": 3.61, "who": "B", "text": "Here are all five. Sus two, open.", "cue": {"p": 125, "r": "k7"}}, {"t0": 3.61, "t1": 5.36, "who": "piano", "notes": [3.61], "cue": {"p": 125, "r": "k7"}}, {"t0": 5.36, "t1": 7.62, "who": "B", "text": "Sus four, floating.", "cue": {"p": 125, "r": "k7"}}, {"t0": 7.62, "t1": 9.37, "who": "piano", "notes": [7.62], "cue": {"p": 125, "r": "k7"}}, {"t0": 9.37, "t1": 12.56, "who": "B", "text": "C five, no third at all: strong.", "cue": {"p": 125, "r": "k7"}}, {"t0": 12.56, "t1": 14.31, "who": "piano", "notes": [12.56], "cue": {"p": 125, "r": "k7"}}, {"t0": 14.31, "t1": 17.44, "who": "B", "text": "C six, with A on top: warm.", "cue": {"p": 125, "r": "k7"}}, {"t0": 17.44, "t1": 19.19, "who": "piano", "notes": [17.44], "cue": {"p": 125, "r": "k7"}}, {"t0": 19.19, "t1": 23.11, "who": "B", "text": "And C add nine, with D on top: sparkly.", "cue": {"p": 125, "r": "k7"}}, {"t0": 23.11, "t1": 24.86, "who": "piano", "notes": [23.11], "cue": {"p": 125, "r": "k7"}}, {"t0": 24.86, "t1": 29.17, "who": "P", "text": "Open, floating, strong, warm, sparkly. It’s like a paint box!", "cue": {"p": 125, "r": "k7"}}, {"t0": 29.17, "t1": 37.01, "who": "B", "text": "And now the famous shimmer. Lean, then slide back: C, sus four, C, sus two, C. Guitarists love this one.", "cue": {"p": 125, "r": "vx"}, "hits": [[32.72, "#0", 51, 52, "vx"], [33.66, "#0", 64, 65, "vx"], [34.52, "#0", 76, 77, "vx"]]}, {"t0": 37.01, "t1": 44.56, "who": "piano", "notes": [37.01, 38.46, 39.91, 41.36, 42.81], "cue": {"p": 125, "r": "vx"}}]}, {"t": "Spot the difference", "f": "audio/H6/03-spot-the-difference.mp3", "s": 53, "p": 126, "l": [{"t0": 0.2, "t1": 8.96, "who": "B", "text": "The same red D can do two jobs. C sus two throws the E out. C add nine keeps the E and puts the D on top.", "cue": {"p": 126, "r": "vx"}}, {"t0": 8.96, "t1": 12.16, "who": "piano", "notes": [8.96, 10.41], "cue": {"p": 126, "r": "vx"}}, {"t0": 12.16, "t1": 24.6, "who": "B", "text": "And the power chord: just the root and the fifth, low in the left hand. Neither happy nor sad, only strong: the sound of rock guitar. C five, F five, G five, C five.", "cue": {"p": 126, "r": "two"}}, {"t0": 24.6, "t1": 35.05, "who": "piano", "notes": [24.6, 26.05, 27.5, 28.95, 30.4, 31.85, 33.3], "cue": {"p": 126, "r": "two"}}, {"t0": 35.05, "t1": 38.56, "who": "P", "text": "I need sunglasses and a leather jacket for that one.", "cue": {"p": 126, "r": "two"}}, {"t0": 38.56, "t1": 49.61, "who": "B", "text": "C six or A minor seven? The same four notes, C E G A. The bottom note decides. C at the bottom is C six; A at the bottom is A minor seven.", "cue": {"p": 126, "r": "two2"}}, {"t0": 49.61, "t1": 52.81, "who": "piano", "notes": [49.61, 51.06], "cue": {"p": 126, "r": "two2"}}]}, {"t": "Examples: which colour?", "f": "audio/H6/04-examples-which-colour.mp3", "s": 45, "p": 126, "l": [{"t0": 0.2, "t1": 7.13, "who": "B", "text": "Which colour is G C D? Count the keys between, G to C, then C to D. Is there a third?", "cue": {"p": 126, "r": "ex1"}}, {"t0": 7.13, "t1": 12.13, "who": "pause", "text": "Pause and try.", "cue": {"p": 126, "r": "ex1"}}, {"t0": 12.13, "t1": 15.26, "who": "P", "text": "Four, then one, and no B. G sus four!", "cue": {"p": 126, "r": "ex1", "reveal": true}}, {"t0": 15.26, "t1": 18.46, "who": "piano", "notes": [15.26, 16.71], "cue": {"p": 126, "r": "ex1", "reveal": true}}, {"t0": 18.46, "t1": 28.01, "who": "B", "text": "Swap the C for B, and you have plain G major. Game: sus two, sus four or add nine? C D G, C F G, C E G D.", "cue": {"p": 126, "r": "game"}}, {"t0": 28.01, "t1": 33.01, "who": "pause", "text": "Pause and try.", "cue": {"p": 126, "r": "game"}}, {"t0": 33.01, "t1": 35.57, "who": "P", "text": "Sus two, sus four, add nine.", "cue": {"p": 126, "r": "game", "reveal": true}}, {"t0": 35.57, "t1": 41.41, "who": "B", "text": "Try it: C sus four, then C. No third, then a third: floating, then bright.", "cue": {"p": 127, "r": "try10"}, "hits": [[36.04, "#0", 8, 9, "try10"], [37.3, "#0", 25, 26, "try10"]]}, {"t0": 41.41, "t1": 44.61, "who": "piano", "notes": [41.41, 42.86], "cue": {"p": 127, "r": "try10"}}]}, {"t": "Examples: build them", "f": "audio/H6/05-examples-build-them.mp3", "s": 59, "p": 127, "l": [{"t0": 0.2, "t1": 8.2, "who": "B", "text": "Build D sus four. Start with D major, D, F sharp, A. Sus four: move the middle layer up to the next letter.", "cue": {"p": 127, "r": "ex2"}}, {"t0": 8.2, "t1": 12.2, "who": "pause", "text": "Pause and try.", "cue": {"p": 127, "r": "ex2"}}, {"t0": 12.2, "t1": 15.28, "who": "P", "text": "F sharp moves up to G: D, G, A.", "cue": {"p": 127, "r": "ex2", "reveal": true}}, {"t0": 15.28, "t1": 19.93, "who": "piano", "notes": [15.28, 16.73, 18.18], "cue": {"p": 127, "r": "ex2", "reveal": true}}, {"t0": 19.93, "t1": 28.31, "who": "B", "text": "And F add nine. Keep F A C, and add the ninth: the second, an octave up. Which letter comes just after F?", "cue": {"p": 127, "r": "ex3"}}, {"t0": 28.31, "t1": 32.31, "who": "pause", "text": "Pause and try.", "cue": {"p": 127, "r": "ex3"}}, {"t0": 32.31, "t1": 34.55, "who": "P", "text": "G! F, A, C, G.", "cue": {"p": 127, "r": "ex3", "reveal": true}}, {"t0": 34.55, "t1": 36.3, "who": "piano", "notes": [34.55], "cue": {"p": 127, "r": "ex3", "reveal": true}}, {"t0": 36.3, "t1": 42.29, "who": "B", "text": "Your little task for next time: play the shimmer, C, sus four, C, sus two, C, slowly.", "cue": {"p": 127, "r": "think"}}, {"t0": 42.29, "t1": 43.73, "who": "P", "text": "I will!", "cue": {"p": 127, "r": "think"}}, {"t0": 43.73, "t1": 57.28, "who": "B", "text": "Think of decorating the cake: a ribbon, the sixth, or a candle, the ninth, and it’s still the same cake. A sus moves its middle layer; a power chord takes the middle layer out. Until next time, Clara.", "cue": {"p": 127, "r": "think"}}, {"t0": 57.28, "t1": 58.87, "who": "P", "text": "Bye, Butler!", "cue": {"p": 127, "r": "think"}}]}]}, {"k": "H7", "part": "Part V · Chords", "t": "7 · The tower: 9, 11, 13", "pages": [128, 129, 130], "clips": [{"t": "The tower: 9, 11, 13", "f": "audio/H7/01-the-tower-9-11-13.mp3", "s": 48, "p": 128, "l": [{"t0": 3.4, "t1": 7.04, "who": "P", "text": "Butler, after the seventh layer, can the cake keep growing?", "cue": {"p": 128, "r": "h:The tower: 9, 11, 13"}, "hits": [[4.28, "#7", 18, 25, "two"]]}, {"t0": 7.04, "t1": 19.92, "who": "B", "text": "All the way up, like a wedding cake for a giant. Keep stacking thirds and the cake grows three more layers: the ninth, the eleventh and the thirteenth. At the top you have used all seven letters.", "cue": {"p": 128, "r": "lead"}}, {"t0": 19.92, "t1": 28.62, "who": "B", "text": "Build C seven: C E G B flat. Keep skipping one letter: D, F, A. Those are the ninth, eleventh and thirteenth.", "cue": {"p": 128, "r": "two"}, "hits": [[20.26, "#0", 6, 7, "two"], [20.95, "#0", 15, 16, "two"], [21.1, "#2", 17, 18, "two"], [21.26, "#4", 19, 20, "two"], [21.41, "#6", 21, 27, "two"], [24.01, "#8", 55, 56, "two"], [24.24, "#10", 58, 59, "two"], [24.47, "#12", 61, 62, "two"]]}, {"t0": 28.62, "t1": 34.96, "who": "piano", "notes": [28.62, 29.24, 29.86, 30.48, 31.1, 31.72, 32.34, 33.21], "cue": {"p": 128, "r": "two"}}, {"t0": 34.96, "t1": 36.94, "who": "P", "text": "That’s a lot of cake.", "cue": {"p": 128, "r": "two"}}, {"t0": 36.94, "t1": 48.48, "who": "B", "text": "And here is the secret: take seven away to find the letter. Nine is the second, D. Eleven is the fourth, F. Thirteen is the sixth, A. Same letters, an octave up.", "cue": {"p": 128, "r": "secret"}}]}, {"t": "Five tall chords on C", "f": "audio/H7/02-five-tall-chords-on-c.mp3", "s": 32, "p": 129, "l": [{"t0": 0.2, "t1": 5.25, "who": "B", "text": "Five tall chords on C. C nine: soulful, funk and soul.", "cue": {"p": 128, "r": "vx2"}}, {"t0": 5.25, "t1": 7.0, "who": "piano", "notes": [5.25], "cue": {"p": 128, "r": "vx2"}}, {"t0": 7.0, "t1": 10.43, "who": "B", "text": "C major nine: dreamy, film music.", "cue": {"p": 128, "r": "vx2"}}, {"t0": 10.43, "t1": 12.18, "who": "piano", "notes": [10.43], "cue": {"p": 128, "r": "vx2"}}, {"t0": 12.18, "t1": 16.32, "who": "B", "text": "C minor nine: smooth, like a slow soul song.", "cue": {"p": 128, "r": "vx2"}}, {"t0": 16.32, "t1": 18.07, "who": "piano", "notes": [16.32], "cue": {"p": 128, "r": "vx2"}}, {"t0": 18.07, "t1": 20.92, "who": "B", "text": "C eleven, airy, gospel.", "cue": {"p": 128, "r": "vx2"}}, {"t0": 20.92, "t1": 22.67, "who": "piano", "notes": [20.92], "cue": {"p": 128, "r": "vx2"}}, {"t0": 22.67, "t1": 26.74, "who": "B", "text": "And C thirteen, rich: the end of a jazz song.", "cue": {"p": 128, "r": "vx2"}}, {"t0": 26.74, "t1": 28.49, "who": "piano", "notes": [26.74], "cue": {"p": 128, "r": "vx2"}}, {"t0": 28.49, "t1": 31.75, "who": "P", "text": "They all sound like grown-up music in a café.", "cue": {"p": 128, "r": "vx2"}}]}, {"t": "Leave some out", "f": "audio/H7/03-leave-some-out.mp3", "s": 42, "p": 129, "l": [{"t0": 0.2, "t1": 16.64, "who": "B", "text": "Ten fingers, seven layers: you choose. Keep the third and the seventh, they say what kind of chord it is, and the top note, its colour. Leave out the fifth first. Two hands play C thirteen with four notes: C in the left hand, B flat, E, A in the right.", "cue": {"p": 129, "r": "two"}, "hits": [[10.49, "#1", 163, 172, "two"]]}, {"t0": 16.64, "t1": 20.09, "who": "piano", "notes": [16.64, 18.34], "cue": {"p": 129, "r": "two"}}, {"t0": 20.09, "t1": 23.33, "who": "P", "text": "The second one is clearer! Like tidying my room.", "cue": {"p": 129, "r": "two"}}, {"t0": 23.33, "t1": 33.99, "who": "B", "text": "And with a major third, the eleventh, F, rubs against E. So C thirteen leaves out the F. C eleven does the opposite: keeps the F, leaves out the E.", "cue": {"p": 129, "r": "two"}}, {"t0": 33.99, "t1": 42.14, "who": "B", "text": "Six or thirteen? Add nine or nine? Look for the seventh. No seventh: a colour chord. A seventh: a tower chord.", "cue": {"p": 129, "r": "ht"}}]}, {"t": "Example: name a tall chord", "f": "audio/H7/04-example-name-a-tall-chord.mp3", "s": 41, "p": 129, "l": [{"t0": 0.2, "t1": 7.26, "who": "B", "text": "Name this tall chord: G B D F A. Find the root, count the first four layers, then the top.", "cue": {"p": 129, "r": "ex1"}}, {"t0": 7.26, "t1": 12.26, "who": "pause", "text": "Pause and try.", "cue": {"p": 129, "r": "ex1"}}, {"t0": 12.26, "t1": 16.33, "who": "P", "text": "G seven, three two two, with A on top: the ninth. G nine!", "cue": {"p": 129, "r": "ex1", "reveal": true}}, {"t0": 16.33, "t1": 18.08, "who": "piano", "notes": [16.33], "cue": {"p": 129, "r": "ex1", "reveal": true}}, {"t0": 18.08, "t1": 23.53, "who": "B", "text": "Game: which floor? The ninth of C, the eleventh of C, the thirteenth of C.", "cue": {"p": 129, "r": "game"}}, {"t0": 23.53, "t1": 27.53, "who": "pause", "text": "Pause and try.", "cue": {"p": 129, "r": "game"}}, {"t0": 27.53, "t1": 29.28, "who": "P", "text": "D, F, A.", "cue": {"p": 129, "r": "game", "reveal": true}}, {"t0": 29.28, "t1": 37.87, "who": "B", "text": "Try it: left hand C E G, right hand B flat, then add the next letter but one above it. You just built a tall chord.", "cue": {"p": 130, "r": "try10"}, "hits": [[30.45, "#0", 18, 19, "try10"], [30.59, "#2", 20, 21, "try10"], [30.74, "#4", 22, 23, "try10"], [31.74, "#6", 36, 42, "try10"]]}, {"t0": 37.87, "t1": 41.07, "who": "piano", "notes": [37.87, 39.32], "cue": {"p": 130, "r": "try10"}}]}, {"t": "Example: build C9", "f": "audio/H7/05-example-build-c9.mp3", "s": 45, "p": 130, "l": [{"t0": 0.2, "t1": 5.91, "who": "B", "text": "Build C nine. Build C seven, then skip one more letter above B flat.", "cue": {"p": 130, "r": "ex2"}}, {"t0": 5.91, "t1": 8.91, "who": "pause", "text": "Pause and try.", "cue": {"p": 130, "r": "ex2"}}, {"t0": 8.91, "t1": 11.49, "who": "P", "text": "D! C, E, G, B flat, D.", "cue": {"p": 130, "r": "ex2", "reveal": true}}, {"t0": 11.49, "t1": 13.24, "who": "piano", "notes": [11.49], "cue": {"p": 130, "r": "ex2", "reveal": true}}, {"t0": 13.24, "t1": 24.61, "who": "B", "text": "The method: start on the root and skip one letter each time, one, three, five, seven, nine, eleven, thirteen. Stop at the number in the name. Leave out the fifth first.", "cue": {"p": 130, "r": "howto"}, "hits": [[23.35, "#5", 156, 161, "try10"]]}, {"t0": 24.61, "t1": 30.57, "who": "B", "text": "Your little task for next time: build C nine with both hands, leaving out the fifth.", "cue": {"p": 130, "r": "watch"}, "hits": [[29.7, "#5", 78, 83, "try10"]]}, {"t0": 30.57, "t1": 32.02, "who": "P", "text": "I will!", "cue": {"p": 130, "r": "watch"}}, {"t0": 32.02, "t1": 43.71, "who": "B", "text": "And the traps: the ninth is just the second, an octave higher, no hunting far up. C thirteen is not C six: it has the seventh too. Until next time, Clara.", "cue": {"p": 130, "r": "watch"}, "hits": [[40.59, "#7", 118, 125, "try10"]]}, {"t0": 43.71, "t1": 45.3, "who": "P", "text": "Bye, Butler!", "cue": {"p": 130, "r": "watch"}}]}]}, {"k": "H8", "part": "Part V · Chords", "t": "8 · Slash chords", "pages": [131, 132, 133], "clips": [{"t": "Slash chords", "f": "audio/H8/01-slash-chords.mp3", "s": 40, "p": 131, "l": [{"t0": 3.4, "t1": 6.96, "who": "P", "text": "Butler, my songbook says C slash E. Is that maths?", "cue": {"p": 131, "r": "h:Slash chords"}}, {"t0": 6.96, "t1": 16.72, "who": "B", "text": "Not a fraction, and not two chords. C slash E means one chord with a chosen bass note: play a C chord, with E as the lowest note.", "cue": {"p": 131, "r": "lead"}}, {"t0": 16.72, "t1": 29.14, "who": "B", "text": "Here is the secret: chord before the slash, bass note after it. C means C E G, in the right hand. E goes in the left hand, below everything. Together: C over E.", "cue": {"p": 131, "r": "two"}, "hits": [[21.43, "#0", 64, 65, "two"], [22.03, "#0", 72, 73, "two"], [22.18, "#1", 74, 75, "two"], [23.99, "#1", 98, 99, "two"], [27.99, "#0", 151, 152, "two"], [28.52, "#1", 158, 159, "two"]]}, {"t0": 29.14, "t1": 30.89, "who": "piano", "notes": [29.14], "cue": {"p": 131, "r": "two"}}, {"t0": 30.89, "t1": 35.15, "who": "P", "text": "So it’s a cake on a plate. The chord is the cake, the bass is the plate.", "cue": {"p": 131, "r": "secret"}}, {"t0": 35.15, "t1": 39.75, "who": "B", "text": "A beautiful way to put it. Same cake, new plate, new view.", "cue": {"p": 131, "r": "secret"}}]}, {"t": "Four jobs", "f": "audio/H8/02-four-jobs.mp3", "s": 63, "p": 132, "l": [{"t0": 0.2, "t1": 15.7, "who": "B", "text": "Slash chords have four jobs. One: an inversion, for smoother changes. Two: a walk-down, a bass that steps down. Three: a pedal, the same bass held while the chords change. And four: colour, a bass from outside the chord.", "cue": {"p": 131, "r": "ht"}}, {"t0": 15.7, "t1": 22.78, "who": "B", "text": "Job two: listen to the bass walk straight down, C, B, A, G, F, while the right hand hardly moves.", "cue": {"p": 131, "r": "vx"}, "hits": [[18.91, "#0", 48, 49, "vx"], [19.74, "#4", 60, 61, "vx"]]}, {"t0": 22.78, "t1": 30.33, "who": "piano", "notes": [22.78, 24.23, 25.68, 27.13, 28.58], "cue": {"p": 131, "r": "vx"}}, {"t0": 30.33, "t1": 34.04, "who": "P", "text": "Like walking down the stairs carrying a tray very carefully.", "cue": {"p": 131, "r": "vx"}}, {"t0": 34.04, "t1": 45.19, "who": "B", "text": "Job three: a pedal. The bass holds C while the chords change above it: C, F over C, G over C, C. It’s called a pedal after the organ’s foot pedals.", "cue": {"p": 132, "r": "vx"}, "hits": [[36.49, "#0", 35, 36, "vx"], [39.14, "#0", 71, 72, "vx"], [39.87, "#0", 81, 82, "vx"], [40.61, "#0", 91, 92, "vx"], [40.83, "#0", 94, 95, "vx"]]}, {"t0": 45.19, "t1": 51.29, "who": "piano", "notes": [45.19, 46.64, 48.09, 49.54], "cue": {"p": 132, "r": "vx"}}, {"t0": 51.29, "t1": 60.06, "who": "B", "text": "And job four: F over G. G isn’t in the F chord, so it floats, open and unfinished. Pop and gospel players love it.", "cue": {"p": 132, "r": "two"}}, {"t0": 60.06, "t1": 63.26, "who": "piano", "notes": [60.06, 61.51], "cue": {"p": 132, "r": "two"}}]}, {"t": "Example: name the slash chord", "f": "audio/H8/03-example-name-the-slash-chord.mp3", "s": 35, "p": 132, "l": [{"t0": 0.2, "t1": 7.02, "who": "B", "text": "Name the slash chord. The right hand plays G B D. The lowest note in the left hand is B.", "cue": {"p": 132, "r": "ex1"}}, {"t0": 7.02, "t1": 11.02, "who": "pause", "text": "Pause and try.", "cue": {"p": 132, "r": "ex1"}}, {"t0": 11.02, "t1": 13.6, "who": "P", "text": "G slash B! G over B.", "cue": {"p": 132, "r": "ex1", "reveal": true}}, {"t0": 13.6, "t1": 15.35, "who": "piano", "notes": [13.6], "cue": {"p": 132, "r": "ex1", "reveal": true}}, {"t0": 15.35, "t1": 27.65, "who": "B", "text": "And B is in the G chord, so it’s the first inversion. Game: read the slash. G slash B, C slash G, F slash A, A minor slash C. Which note goes in the left hand?", "cue": {"p": 132, "r": "game"}}, {"t0": 27.65, "t1": 32.65, "who": "pause", "text": "Pause and try.", "cue": {"p": 132, "r": "game"}}, {"t0": 32.65, "t1": 34.82, "who": "P", "text": "B, G, A, and C.", "cue": {"p": 132, "r": "game", "reveal": true}}]}, {"t": "Examples: play them", "f": "audio/H8/04-examples-play-them.mp3", "s": 63, "p": 133, "l": [{"t0": 0.2, "t1": 10.01, "who": "B", "text": "Try it: right hand C E G, left hand a low E. Now try a low A under it: C over A, the very same notes as A minor seven.", "cue": {"p": 133, "r": "try10"}, "hits": [[1.6, "#0", 19, 20, "try10"], [1.76, "#1", 21, 22, "try10"], [1.92, "#2", 23, 24, "try10"], [3.45, "#1", 42, 43, "try10"], [5.77, "#0", 71, 72, "try10"]]}, {"t0": 10.01, "t1": 13.21, "who": "piano", "notes": [10.01, 11.46], "cue": {"p": 133, "r": "try10"}}, {"t0": 13.21, "t1": 17.09, "who": "B", "text": "C slash G: which note goes in the left hand?", "cue": {"p": 133, "r": "ex2"}}, {"t0": 17.09, "t1": 20.09, "who": "pause", "text": "Pause and try.", "cue": {"p": 133, "r": "ex2"}}, {"t0": 20.09, "t1": 23.26, "who": "P", "text": "G! Low in the left hand, under C E G.", "cue": {"p": 133, "r": "ex2", "reveal": true}}, {"t0": 23.26, "t1": 25.01, "who": "piano", "notes": [23.26], "cue": {"p": 133, "r": "ex2", "reveal": true}}, {"t0": 25.01, "t1": 34.5, "who": "B", "text": "And walk the bass down: C, C over B, A minor. The right hand holds C E G for two chords, while the left hand walks C, B, A.", "cue": {"p": 133, "r": "ex3"}}, {"t0": 34.5, "t1": 39.15, "who": "piano", "notes": [34.5, 35.95, 37.4], "cue": {"p": 133, "r": "ex3"}}, {"t0": 39.15, "t1": 46.04, "who": "B", "text": "Your little task for next time: play C, C slash B, A minor, and let the bass walk down.", "cue": {"p": 133, "r": "watch"}}, {"t0": 46.04, "t1": 47.48, "who": "P", "text": "I will!", "cue": {"p": 133, "r": "watch"}}, {"t0": 47.48, "t1": 61.56, "who": "B", "text": "Three traps: chord first, bass second. E slash C would be an E chord over C. Keep the right hand above the bass. And in C slash E the right hand still plays the whole C chord. Until next time, Clara.", "cue": {"p": 133, "r": "watch"}}, {"t0": 61.56, "t1": 63.15, "who": "P", "text": "Bye, Butler!", "cue": {"p": 133, "r": "watch"}}]}]}, {"k": "HT", "part": "Part V · Chords", "t": "Tips: when a chord sounds wrong", "pages": [134]}, {"k": "MO", "part": "Part VI · Harmony in music", "t": "Opening map", "pages": [135], "clips": [{"t": "Part Six: Harmony in music", "f": "audio/MO/01-part-six-harmony-in-music.mp3", "s": 53, "p": 135, "l": [{"t0": 3.4, "t1": 8.79, "who": "B", "text": "Welcome to Part Six, Clara: harmony in music. Put the chords to work.", "cue": {"p": 135, "r": "map"}}, {"t0": 8.79, "t1": 24.15, "who": "B", "text": "A melody is the singer; harmony is the band behind it. Here the chords start moving: guests from outside the key, endings, chords under a tune, and the trips every song takes. All of it is in these same four bars of Twinkle.", "cue": {"p": 135, "r": "map"}}, {"t0": 24.15, "t1": 41.35, "who": "piano", "notes": [24.15, 25.6, 26.22, 27.67, 28.54, 29.99, 30.61, 32.31, 33.76, 34.38, 35.83, 36.7, 38.15, 39.6], "cue": {"p": 135, "r": "map"}}, {"t0": 41.35, "t1": 44.01, "who": "P", "text": "There’s a sad chord hiding in the middle!", "cue": {"p": 135, "r": "map"}}, {"t0": 44.01, "t1": 51.17, "who": "B", "text": "F minor, a guest note from the twin. Four chapters, and a page of tips. Shall we meet our first guest?", "cue": {"p": 135, "r": "map"}}, {"t0": 51.17, "t1": 52.9, "who": "P", "text": "Yes, please!", "cue": {"p": 135, "r": "map"}}]}]}, {"k": "M1", "part": "Part VI · Harmony in music", "t": "1 · Chords from outside the key", "pages": [136, 137, 138], "clips": [{"t": "Chords from outside the key", "f": "audio/M1/01-chords-from-outside-the-key.mp3", "s": 56, "p": 136, "l": [{"t0": 3.4, "t1": 6.68, "who": "B", "text": "Clara, today some visitors arrive.", "cue": {"p": 136, "r": "h:Chords from outside the key"}}, {"t0": 6.68, "t1": 8.92, "who": "P", "text": "Visitors? In the music?", "cue": {"p": 136, "r": "lead"}}, {"t0": 8.92, "t1": 21.26, "who": "B", "text": "In C major, home is the white keys. So a black key in a chord is a guest. And guests never stay long: each one moves to the very next key, and shows you where the music goes next.", "cue": {"p": 136, "r": "lead"}}, {"t0": 21.26, "t1": 29.19, "who": "B", "text": "Here is the secret: sharp guests push up, flat guests sigh down. Follow them one key, and you find the next chord.", "cue": {"p": 136, "r": "secret"}}, {"t0": 29.19, "t1": 36.06, "who": "B", "text": "Listen. C sharp pushes up to D. F sharp pushes up to G. G sharp pushes up to A.", "cue": {"p": 136, "r": "two"}, "hits": [[29.73, "#0", 8, 15, "two"], [31.46, "#1", 29, 30, "two"], [31.71, "#2", 32, 39, "two"], [33.44, "#3", 53, 54, "two"], [33.69, "#4", 56, 63, "two"], [35.42, "#5", 77, 78, "two"]]}, {"t0": 36.06, "t1": 42.44, "who": "piano", "notes": [36.06, 36.68, 38.17, 38.79, 40.28, 40.9], "cue": {"p": 136, "r": "two"}}, {"t0": 42.44, "t1": 47.23, "who": "B", "text": "And A flat sighs down to G. E flat sighs down to D.", "cue": {"p": 136, "r": "two"}, "hits": [[42.67, "#6", 4, 10, "two"], [44.5, "#7", 25, 26, "two"], [44.76, "#8", 28, 34, "two"], [46.59, "#9", 49, 50, "two"]]}, {"t0": 47.23, "t1": 51.5, "who": "piano", "notes": [47.23, 47.85, 49.34, 49.96], "cue": {"p": 136, "r": "two"}}, {"t0": 51.5, "t1": 55.96, "who": "P", "text": "Like a guest who stands up when they arrive, and one who flops onto the sofa.", "cue": {"p": 136, "r": "two"}}]}, {"t": "Sharp guests", "f": "audio/M1/02-sharp-guests.mp3", "s": 35, "p": 137, "l": [{"t0": 0.2, "t1": 12.38, "who": "B", "text": "Exactly. A chord with C sharp, A C sharp E, leads to D minor. With F sharp, D F sharp A, leads to G. With G sharp, E G sharp B, leads to A minor.", "cue": {"p": 136, "r": "gp3"}, "hits": [[1.87, "#1", 22, 29, "gp3"], [2.61, "#3", 31, 32, "gp3"], [2.77, "#1", 33, 40, "gp3"], [3.43, "#2", 41, 42, "gp3"], [4.4, "#4", 53, 54, "gp3"], [5.55, "#9", 67, 74, "gp3"], [6.28, "#11", 76, 77, "gp3"], [6.44, "#9", 78, 85, "gp3"], [7.1, "#10", 86, 87, "gp3"], [8.08, "#15", 98, 99, "gp3"], [8.73, "#17", 106, 113, "gp3"], [9.46, "#19", 115, 116, "gp3"], [9.63, "#17", 117, 124, "gp3"], [10.28, "#18", 125, 126, "gp3"], [11.26, "#20", 137, 138, "gp3"]]}, {"t0": 12.38, "t1": 21.88, "who": "piano", "notes": [12.38, 13.83, 15.53, 16.98, 18.68, 20.13], "cue": {"p": 136, "r": "gp3"}}, {"t0": 21.88, "t1": 29.23, "who": "B", "text": "Try it in a song: C, D, G, C. The F sharp pushes up into G, then G leads home to C.", "cue": {"p": 136, "r": "two2"}, "hits": [[23.28, "#0", 18, 19, "two2"], [23.53, "#1", 21, 22, "two2"], [23.78, "#2", 24, 25, "two2"], [24.04, "#3", 27, 28, "two2"], [24.63, "#2", 34, 41, "two"], [26.57, "#2", 57, 58, "two2"], [27.24, "#2", 65, 66, "two2"], [28.59, "#3", 81, 82, "two2"]]}, {"t0": 29.23, "t1": 35.33, "who": "piano", "notes": [29.23, 30.68, 32.13, 33.58], "cue": {"p": 136, "r": "two2"}}]}, {"t": "Flat guests and the twin", "f": "audio/M1/03-flat-guests-and-the-twin.mp3", "s": 39, "p": 137, "l": [{"t0": 0.2, "t1": 12.76, "who": "B", "text": "Flat guests come from a twin. C major and C minor are twins: the same home note, C, in different clothes. A flat guest is one piece of the twin’s outfit, borrowed for a moment.", "cue": {"p": 136, "r": "two3"}, "hits": [[2.16, "#0", 30, 31, "two3"], [2.99, "#0", 42, 43, "two3"], [5.7, "#0", 81, 82, "two3"], [7.43, "#6", 106, 112, "two"]]}, {"t0": 12.76, "t1": 17.88, "who": "B", "text": "Listen to C, F, F minor, C. The A flat sighs down to G.", "cue": {"p": 136, "r": "two3"}, "hits": [[13.51, "#0", 10, 11, "two3"], [13.77, "#1", 13, 14, "two3"], [14.03, "#1", 16, 17, "two3"], [14.81, "#0", 25, 26, "two3"], [15.42, "#6", 32, 38, "two"]]}, {"t0": 17.88, "t1": 23.98, "who": "piano", "notes": [17.88, 19.33, 20.78, 22.23], "cue": {"p": 136, "r": "two3"}}, {"t0": 23.98, "t1": 29.09, "who": "P", "text": "Ooh, that F minor sounds like the end of a sad film where everything turns out fine.", "cue": {"p": 136, "r": "two3"}, "hits": [[24.43, "#1", 10, 11, "two3"]]}, {"t0": 29.09, "t1": 39.18, "who": "B", "text": "That is precisely what film composers use it for. Here are the twins side by side: C major at home, and C minor in darker clothes.", "cue": {"p": 137, "r": "twins"}, "hits": [[35.19, "#0", 83, 84, "twins"], [36.76, "#0", 104, 105, "twins"]]}]}, {"t": "Example: where do the guests go?", "f": "audio/M1/04-example-where-do-the-guests-go.mp3", "s": 44, "p": 137, "l": [{"t0": 0.2, "t1": 12.46, "who": "B", "text": "B, D sharp, F sharp, in C major. Find the black keys: there are two guests. Both are sharps, so where do they land? And which chord in C major holds both landing notes?", "cue": {"p": 137, "r": "ex1"}}, {"t0": 12.46, "t1": 17.46, "who": "pause", "text": "Pause and try.", "cue": {"p": 137, "r": "ex1"}}, {"t0": 17.46, "t1": 21.75, "who": "P", "text": "D sharp goes up to E, F sharp up to G. Both live in E minor!", "cue": {"p": 137, "r": "ex1", "reveal": true}}, {"t0": 21.75, "t1": 24.95, "who": "piano", "notes": [21.75, 23.2], "cue": {"p": 137, "r": "ex1", "reveal": true}}, {"t0": 24.95, "t1": 31.02, "who": "B", "text": "Game: where does each guest go? Find the guest, follow it one key, and name the next chord.", "cue": {"p": 138, "r": "game"}}, {"t0": 31.02, "t1": 37.02, "who": "pause", "text": "Pause and try.", "cue": {"p": 138, "r": "game"}}, {"t0": 37.02, "t1": 44.33, "who": "P", "text": "C sharp up to D: D minor. The A flat goes down to G, and the E flat down to D: G. F sharp up to G: G.", "cue": {"p": 138, "r": "game", "reveal": true}, "hits": [[36.9, "#1", 0, 7, "game"], [37.86, "#8", 14, 15, "game"], [38.07, "#8", 17, 18, "game"], [38.97, "#7", 30, 36, "game"], [41.1, "#6", 61, 67, "game"], [42.14, "#8", 76, 77, "game"], [42.55, "#9", 82, 89, "game"]]}]}, {"t": "Try it", "f": "audio/M1/05-try-it.mp3", "s": 52, "p": 138, "l": [{"t0": 0.2, "t1": 10.52, "who": "B", "text": "Play C, F, F minor, C slowly, and hear the A flat sigh. Then C, D, G, C, and hear the F sharp push. One sighs, one pushes.", "cue": {"p": 138, "r": "try10"}, "hits": [[0.49, "#0", 5, 6, "try10"], [0.73, "#1", 8, 9, "try10"], [0.98, "#1", 11, 12, "try10"], [1.71, "#0", 20, 21, "try10"], [3.59, "#7", 43, 49, "game"], [5.07, "#0", 61, 62, "try10"], [5.8, "#0", 70, 71, "try10"], [7.11, "#1", 86, 87, "try10"]]}, {"t0": 10.52, "t1": 22.67, "who": "piano", "notes": [10.52, 11.97, 13.42, 14.87, 16.57, 18.02, 19.47, 20.92], "cue": {"p": 138, "r": "try10"}}, {"t0": 22.67, "t1": 26.23, "who": "P", "text": "Sigh, then push. Like getting out of bed on a Monday.", "cue": {"p": 138, "r": "try10"}}, {"t0": 26.23, "t1": 32.37, "who": "B", "text": "Your little task for next time: play C, F, F minor, C, and listen for the sigh.", "cue": {"p": 138, "r": "think"}}, {"t0": 32.37, "t1": 33.81, "who": "P", "text": "I will!", "cue": {"p": 138, "r": "think"}}, {"t0": 33.81, "t1": 50.17, "who": "B", "text": "A surprise guest at dinner: one new face changes the whole conversation, and then everyone goes home. And one trap: in G major, F sharp is at home, not a guest. A guest is a note from outside the key you are in. Until next time, Clara.", "cue": {"p": 138, "r": "think"}, "hits": [[42.41, "#9", 128, 135, "game"]]}, {"t0": 50.17, "t1": 51.77, "who": "P", "text": "Bye, Butler!", "cue": {"p": 138, "r": "think"}}]}]}, {"k": "M2", "part": "Part VI · Harmony in music", "t": "2 · Cadences", "pages": [139, 140, 141], "clips": [{"t": "Cadences", "f": "audio/M2/01-cadences.mp3", "s": 72, "p": 139, "l": [{"t0": 3.4, "t1": 10.76, "who": "B", "text": "Clara, can you read this sentence without stopping: I went to the park then I fed the ducks then I went home.", "cue": {"p": 139, "r": "h:Cadences"}}, {"t0": 10.76, "t1": 13.5, "who": "P", "text": "I need to breathe! Where are the full stops?", "cue": {"p": 139, "r": "lead"}}, {"t0": 13.5, "t1": 25.87, "who": "B", "text": "Exactly. A phrase is a musical sentence, and it needs punctuation too. The last two chords of a phrase are its cadence. They tell you: finished, taking a breath, or surprise!", "cue": {"p": 139, "r": "lead"}}, {"t0": 25.87, "t1": 31.14, "who": "B", "text": "There are four. Perfect: five to one. A full stop. Home, the end.", "cue": {"p": 139, "r": "pc4"}}, {"t0": 31.14, "t1": 34.34, "who": "piano", "notes": [31.14, 32.59], "cue": {"p": 139, "r": "pc4"}}, {"t0": 34.34, "t1": 40.26, "who": "B", "text": "Plagal: four to one. A soft, gentle end, like the Amen at the end of a hymn.", "cue": {"p": 139, "r": "pc4"}}, {"t0": 40.26, "t1": 43.46, "who": "piano", "notes": [40.26, 41.71], "cue": {"p": 139, "r": "pc4"}}, {"t0": 43.46, "t1": 44.97, "who": "P", "text": "A-a-men!", "cue": {"p": 139, "r": "pc4"}, "hits": [[43.34, "#9", 0, 1, "pc4"]]}, {"t0": 44.97, "t1": 49.7, "who": "B", "text": "Imperfect: anything to five. A comma: to be continued...", "cue": {"p": 139, "r": "pc4"}}, {"t0": 49.7, "t1": 52.9, "who": "piano", "notes": [49.7, 51.15], "cue": {"p": 139, "r": "pc4"}}, {"t0": 52.9, "t1": 57.1, "who": "B", "text": "And interrupted: five to six. Surprise! Not home.", "cue": {"p": 139, "r": "pc4"}}, {"t0": 57.1, "t1": 60.3, "who": "piano", "notes": [57.1, 58.55], "cue": {"p": 139, "r": "pc4"}}, {"t0": 60.3, "t1": 63.97, "who": "P", "text": "Huh?! That one tricked me. I was already putting my coat on.", "cue": {"p": 139, "r": "pc4"}, "hits": [[61.67, "#7", 27, 28, "pc4"]]}, {"t0": 63.97, "t1": 71.51, "who": "B", "text": "That is the secret: music has full stops and commas too. Just listen to the last two chords of a phrase.", "cue": {"p": 139, "r": "secret"}}]}, {"t": "Why G7 pulls home", "f": "audio/M2/02-why-g7-pulls-home.mp3", "s": 20, "p": 140, "l": [{"t0": 0.2, "t1": 13.4, "who": "B", "text": "Add the seventh to five, and the full stop gets even stronger. In G seven, two notes lean towards C. The B rises to C, and the F falls to E. Two tiny steps, and you are home.", "cue": {"p": 140, "r": "two"}, "hits": [[0.67, "#7", 8, 15, "two"], [4.95, "#0", 66, 67, "two"], [7.32, "#9", 98, 99, "two"], [7.83, "#2", 105, 106, "two"], [8.65, "#9", 116, 117, "two"], [9.46, "#6", 127, 128, "two"]]}, {"t0": 13.4, "t1": 16.6, "who": "piano", "notes": [13.4, 14.85], "cue": {"p": 140, "r": "two"}}, {"t0": 16.6, "t1": 20.33, "who": "P", "text": "It works like the guests! B pushes up, F sighs down.", "cue": {"p": 140, "r": "two"}, "hits": [[18.17, "#2", 26, 27, "two"], [19.01, "#6", 39, 40, "two"]]}]}, {"t": "Examples: how does it end?", "f": "audio/M2/03-examples-how-does-it-end.mp3", "s": 43, "p": 140, "l": [{"t0": 0.2, "t1": 7.36, "who": "B", "text": "How does this phrase end? C, A minor, F, G. Find the last two chords and turn them into numerals.", "cue": {"p": 140, "r": "ex1"}}, {"t0": 7.36, "t1": 13.46, "who": "piano", "notes": [7.36, 8.81, 10.26, 11.71], "cue": {"p": 140, "r": "ex1"}}, {"t0": 13.46, "t1": 17.46, "who": "pause", "text": "Pause and try.", "cue": {"p": 140, "r": "ex1"}}, {"t0": 17.46, "t1": 22.05, "who": "P", "text": "F then G: four to five. It lands on five: a comma. Imperfect!", "cue": {"p": 140, "r": "ex1", "reveal": true}}, {"t0": 22.05, "t1": 27.22, "who": "B", "text": "And how does Twinkle end? Its last two chords in C are G, then C.", "cue": {"p": 140, "r": "ex2"}}, {"t0": 27.22, "t1": 36.09, "who": "piano", "notes": [27.22, 27.84, 28.46, 29.08, 29.95, 31.4, 32.02, 33.47, 34.34], "cue": {"p": 140, "r": "ex2"}}, {"t0": 36.09, "t1": 39.09, "who": "pause", "text": "Pause and try.", "cue": {"p": 140, "r": "ex2"}}, {"t0": 39.09, "t1": 43.14, "who": "P", "text": "Five to one: perfect! The full stop. That’s why it sounds finished.", "cue": {"p": 140, "r": "ex2", "reveal": true}}]}, {"t": "Surprise!", "f": "audio/M2/04-surprise.mp3", "s": 59, "p": 141, "l": [{"t0": 0.2, "t1": 9.94, "who": "B", "text": "G seven, then A minor. G seven leans towards home: you expect C. But the next chord is A minor. Which numeral, and which card?", "cue": {"p": 141, "r": "ex3"}}, {"t0": 9.94, "t1": 13.94, "who": "pause", "text": "Pause and try.", "cue": {"p": 141, "r": "ex3"}}, {"t0": 13.94, "t1": 18.42, "who": "P", "text": "Five to six: interrupted! The music turned the corner just before home.", "cue": {"p": 141, "r": "ex3", "reveal": true}}, {"t0": 18.42, "t1": 21.62, "who": "piano", "notes": [18.42, 19.87], "cue": {"p": 141, "r": "ex3", "reveal": true}}, {"t0": 21.62, "t1": 28.53, "who": "B", "text": "Game: punctuate the phrases. Four pairs of chords. Full stop, comma, Amen, or surprise?", "cue": {"p": 141, "r": "game"}}, {"t0": 28.53, "t1": 34.53, "who": "pause", "text": "Pause and try.", "cue": {"p": 141, "r": "game"}}, {"t0": 34.53, "t1": 37.47, "who": "P", "text": "Amen, surprise, comma, and full stop.", "cue": {"p": 141, "r": "game", "reveal": true}}, {"t0": 37.47, "t1": 44.35, "who": "B", "text": "Your little task for next time: find the last two chords of a piece, and say which punctuation they are.", "cue": {"p": 141, "r": "watch"}}, {"t0": 44.35, "t1": 45.8, "who": "P", "text": "I will!", "cue": {"p": 141, "r": "watch"}}, {"t0": 45.8, "t1": 57.12, "who": "B", "text": "Two traps: not every ending on one is perfect; F to C is plagal. And imperfect ends on five, while perfect starts on five. Until next time, Clara.", "cue": {"p": 141, "r": "watch"}}, {"t0": 57.12, "t1": 59.36, "who": "P", "text": "Bye, Butler. Full stop.", "cue": {"p": 141, "r": "watch"}}]}]}, {"k": "M3", "part": "Part VI · Harmony in music", "t": "3 · Chords under a melody", "pages": [142, 143], "clips": [{"t": "Chords under a melody", "f": "audio/M3/01-chords-under-a-melody.mp3", "s": 33, "p": 142, "l": [{"t0": 3.4, "t1": 9.52, "who": "B", "text": "Clara, the melody is the singer, and the chords are the band. Today you choose the band.", "cue": {"p": 142, "r": "h:Chords under a melody"}}, {"t0": 9.52, "t1": 11.5, "who": "P", "text": "Can I have drums?", "cue": {"p": 142, "r": "lead"}}, {"t0": 11.5, "t1": 23.16, "who": "B", "text": "Not today. But here is how to choose a chord for each bar: look at the melody’s main notes, the long ones and the ones on beats one and three, then pick the cake that holds them.", "cue": {"p": 142, "r": "lead"}}, {"t0": 23.16, "t1": 32.67, "who": "B", "text": "That is the secret. And every note of C major lives in one, four or five. C and G live in two of them, so there, let your ear choose.", "cue": {"p": 142, "r": "secret"}}]}, {"t": "Twinkle with its chords", "f": "audio/M3/02-twinkle-with-its-chords.mp3", "s": 64, "p": 143, "l": [{"t0": 0.2, "t1": 13.49, "who": "B", "text": "Twinkle, Twinkle, with its band. C C G G sit in one, C. A A in four, F, then G back in one. F F in four, E E in one. D D in five, G, and the last C in one.", "cue": {"p": 142, "r": "vx"}, "hits": [[2.83, "#6", 33, 34, "vx"], [3.0, "#6", 35, 36, "vx"], [3.17, "#5", 37, 38, "vx"], [3.34, "#5", 39, 40, "vx"], [4.5, "#6", 53, 54, "vx"], [5.84, "#3", 69, 70, "vx"], [6.51, "#5", 77, 78, "vx"], [7.76, "#3", 92, 93, "vx"], [7.93, "#3", 94, 95, "vx"], [10.93, "#5", 130, 131, "vx"], [12.27, "#6", 146, 147, "vx"]]}, {"t0": 13.49, "t1": 29.86, "who": "piano", "notes": [13.49, 14.94, 15.56, 17.01, 17.88, 19.33, 19.95, 21.65, 23.1, 23.72, 25.17, 26.04, 27.49, 28.11], "cue": {"p": 142, "r": "vx"}}, {"t0": 29.86, "t1": 33.26, "who": "P", "text": "Now it sounds like a proper song, not just a tune!", "cue": {"p": 142, "r": "vx"}}, {"t0": 33.26, "t1": 38.59, "who": "B", "text": "And the left hand can play the chord three ways. Block: all three at once.", "cue": {"p": 142, "r": "vx2"}, "hits": [[36.44, "#0", 49, 54, "vx2"]]}, {"t0": 38.59, "t1": 44.69, "who": "piano", "notes": [38.59, 40.04, 41.49, 42.94], "cue": {"p": 142, "r": "vx2"}}, {"t0": 44.69, "t1": 48.0, "who": "B", "text": "Broken: one at a time, up and down.", "cue": {"p": 142, "r": "vx2"}, "hits": [[44.57, "#1", 0, 6, "vx2"]]}, {"t0": 48.0, "t1": 50.78, "who": "piano", "notes": [48.0, 48.31, 48.62, 48.93, 49.24, 49.55, 49.86, 50.17], "cue": {"p": 142, "r": "vx2"}}, {"t0": 50.78, "t1": 57.81, "who": "B", "text": "And Alberti: low, high, middle, high. Named after Domenico Alberti, who loved it very much.", "cue": {"p": 142, "r": "vx2"}, "hits": [[50.95, "#2", 4, 11, "vx2"], [54.99, "#2", 59, 66, "vx2"]]}, {"t0": 57.81, "t1": 60.59, "who": "piano", "notes": [57.81, 58.12, 58.43, 58.74, 59.05, 59.36, 59.67, 59.98], "cue": {"p": 142, "r": "vx2"}}, {"t0": 60.59, "t1": 63.66, "who": "P", "text": "Alberti sounds like a little machine humming.", "cue": {"p": 142, "r": "vx2"}, "hits": [[60.47, "#2", 0, 7, "vx2"]]}]}, {"t": "Example: choose the chord", "f": "audio/M3/03-example-choose-the-chord.mp3", "s": 44, "p": 143, "l": [{"t0": 0.2, "t1": 10.18, "who": "B", "text": "Choose the chord for E D C D, then E E E. In bar one, which notes fall on beats one and three? Which cake holds them? And bar two?", "cue": {"p": 143, "r": "ex1"}}, {"t0": 10.18, "t1": 15.18, "who": "pause", "text": "Pause and try.", "cue": {"p": 143, "r": "ex1"}}, {"t0": 15.18, "t1": 19.51, "who": "P", "text": "E and C: they both live in one, C. And E E E is in C too!", "cue": {"p": 143, "r": "ex1", "reveal": true}}, {"t0": 19.51, "t1": 27.72, "who": "piano", "notes": [19.51, 20.96, 21.58, 23.03, 23.9, 25.35, 25.97], "cue": {"p": 143, "r": "ex1", "reveal": true}}, {"t0": 27.72, "t1": 36.52, "who": "B", "text": "That’s the start of Mary Had a Little Lamb. Game: pick the cake for three bars. F A F A, D B G B, G E C E.", "cue": {"p": 143, "r": "gt2"}, "hits": [[35.73, "#0", 102, 103, "gt2"]]}, {"t0": 36.52, "t1": 41.52, "who": "pause", "text": "Pause and try.", "cue": {"p": 143, "r": "gt2"}}, {"t0": 41.52, "t1": 43.59, "who": "P", "text": "Four, five, and one.", "cue": {"p": 143, "r": "gt2", "reveal": true}}]}, {"t": "You know this", "f": "audio/M3/04-you-know-this.mp3", "s": 60, "p": 143, "l": [{"t0": 0.2, "t1": 14.3, "who": "B", "text": "Mozart’s Sonata in C, the famous easy one. The left hand is an Alberti bass: C G E G is just the C chord broken into low, high, middle, high. Listen to the left hand alone first.", "cue": {"p": 143, "r": "yk"}, "hits": [[1.55, "#0", 19, 20, "yk"], [6.03, "#0", 77, 78, "yk"], [7.57, "#0", 97, 98, "yk"]]}, {"t0": 14.3, "t1": 19.81, "who": "piano", "notes": [14.3, 14.61, 14.92, 15.23, 15.54, 15.85, 16.16, 16.47, 17.03, 17.34, 17.65, 17.96, 18.27, 18.58, 18.89, 19.2], "cue": {"p": 143, "r": "yk"}}, {"t0": 19.81, "t1": 22.49, "who": "B", "text": "And now the tune on top.", "cue": {"p": 143, "r": "yk"}}, {"t0": 22.49, "t1": 33.46, "who": "piano", "notes": [22.49, 23.73, 24.35, 25.22, 26.15, 26.3, 26.46, 27.95, 29.19, 29.81, 30.68, 31.3, 31.61, 31.77, 31.92], "cue": {"p": 143, "r": "yk"}}, {"t0": 33.46, "t1": 36.78, "who": "P", "text": "That’s the tune from the music box at my grandma’s!", "cue": {"p": 143, "r": "yk"}}, {"t0": 36.78, "t1": 43.05, "who": "B", "text": "Your little task for next time: play Twinkle with one, four and five chords in the left hand.", "cue": {"p": 143, "r": "think"}}, {"t0": 43.05, "t1": 44.5, "who": "P", "text": "I will!", "cue": {"p": 143, "r": "think"}}, {"t0": 44.5, "t1": 58.87, "who": "B", "text": "Very possibly. Picking a chord is like picking a coat for the weather: when the tune changes, change the chord. And keep the left hand softer: the melody is the star, the chords are the stage. Until next time, Clara.", "cue": {"p": 143, "r": "think"}}, {"t0": 58.87, "t1": 60.47, "who": "P", "text": "Bye, Butler!", "cue": {"p": 143, "r": "think"}}]}]}, {"k": "M4", "part": "Part VI · Harmony in music", "t": "4 · Progressions everywhere", "pages": [144, 145], "clips": [{"t": "Progressions everywhere", "f": "audio/M4/01-progressions-everywhere.mp3", "s": 96, "p": 144, "l": [{"t0": 3.4, "t1": 12.76, "who": "B", "text": "Clara, a progression is a trip from chord to chord. And here’s a funny thing: a handful of trips turn up in song after song after song.", "cue": {"p": 144, "r": "h:Progressions everywhere"}}, {"t0": 12.76, "t1": 16.06, "who": "P", "text": "Like everyone in town taking the same bus route?", "cue": {"p": 144, "r": "lead"}}, {"t0": 16.06, "t1": 26.7, "who": "B", "text": "Exactly. Learn them by their numbers, and you can play them in any key. The secret: most songs take the same few trips: home, away, a pull, and home again.", "cue": {"p": 144, "r": "secret"}}, {"t0": 26.7, "t1": 34.31, "who": "B", "text": "The pop four: one, five, six, four. In C: C, G, A minor, F. Countless pop songs and ballads.", "cue": {"p": 144, "r": "tripc"}}, {"t0": 34.31, "t1": 46.46, "who": "piano", "notes": [34.31, 35.76, 37.21, 38.66, 40.36, 41.81, 43.26, 44.71], "cue": {"p": 144, "r": "tripc"}}, {"t0": 46.46, "t1": 49.62, "who": "P", "text": "I know that! It’s in every song on the radio!", "cue": {"p": 144, "r": "tripc"}}, {"t0": 49.62, "t1": 55.82, "who": "B", "text": "Very nearly. The fifties: one, six, four, five. Old rock and roll and doo-wop.", "cue": {"p": 144, "r": "tripc2"}}, {"t0": 55.82, "t1": 67.97, "who": "piano", "notes": [55.82, 57.27, 58.72, 60.17, 61.87, 63.32, 64.77, 66.22], "cue": {"p": 144, "r": "tripc2"}}, {"t0": 67.97, "t1": 74.45, "who": "B", "text": "The jazz three-step: two, five, one. D minor seven, G seven, C major seven.", "cue": {"p": 144, "r": "tripc3"}}, {"t0": 74.45, "t1": 79.1, "who": "piano", "notes": [74.45, 75.9, 77.35], "cue": {"p": 144, "r": "tripc3"}}, {"t0": 79.1, "t1": 84.09, "who": "B", "text": "And the canon: Pachelbel’s famous trip, and all its many children.", "cue": {"p": 144, "r": "tripc4"}}, {"t0": 84.09, "t1": 95.99, "who": "piano", "notes": [84.09, 85.54, 86.99, 88.44, 89.89, 91.34, 92.79, 94.24], "cue": {"p": 144, "r": "tripc4"}}]}, {"t": "Same trip, any key", "f": "audio/M4/02-same-trip-any-key.mp3", "s": 52, "p": 145, "l": [{"t0": 0.2, "t1": 9.18, "who": "B", "text": "Change key, and the numbers stay the same. The pop four in G is G, D, E minor, C. In F: F, C, D minor, B flat.", "cue": {"p": 144, "r": "ht"}}, {"t0": 9.18, "t1": 15.28, "who": "piano", "notes": [9.18, 10.63, 12.08, 13.53], "cue": {"p": 144, "r": "ht"}}, {"t0": 15.28, "t1": 26.17, "who": "B", "text": "And the most famous trip of all: the twelve-bar blues. Twelve bars, one chord each, and only one, four and five. Make every chord a seventh, and it gets bluesy.", "cue": {"p": 144, "r": "two"}}, {"t0": 26.17, "t1": 44.37, "who": "piano", "notes": [26.17, 27.62, 29.07, 30.52, 32.22, 33.67, 35.12, 36.57, 38.27, 39.72, 41.17, 42.62], "cue": {"p": 144, "r": "two"}}, {"t0": 44.37, "t1": 48.1, "who": "P", "text": "I feel like I should be wearing sunglasses and a cool hat.", "cue": {"p": 144, "r": "two"}}, {"t0": 48.1, "t1": 52.26, "who": "K", "text": "I played the blues once. The Queen asked me to stop.", "cue": {"p": 144, "r": "two"}}]}, {"t": "Example: the pop four in A", "f": "audio/M4/03-example-the-pop-four-in-a.mp3", "s": 72, "p": 145, "l": [{"t0": 0.2, "t1": 11.89, "who": "B", "text": "Play the pop four in A major. Write the A major scale, three sharps, and number the notes. Find notes one, five, six and four, and build each cake. Which one is minor?", "cue": {"p": 145, "r": "ex1"}}, {"t0": 11.89, "t1": 17.89, "who": "pause", "text": "Pause and try.", "cue": {"p": 145, "r": "ex1"}}, {"t0": 17.89, "t1": 21.49, "who": "P", "text": "In A: A, E, F sharp minor, D. The six is minor!", "cue": {"p": 145, "r": "ex1", "reveal": true}}, {"t0": 21.49, "t1": 27.59, "who": "piano", "notes": [21.49, 22.94, 24.39, 25.84], "cue": {"p": 145, "r": "ex1", "reveal": true}}, {"t0": 27.59, "t1": 35.41, "who": "B", "text": "Same trip, new key. Game: name the trip. C, A minor, F, G. D minor, G, C. And C, G, A minor, F.", "cue": {"p": 145, "r": "game"}}, {"t0": 35.41, "t1": 41.41, "who": "pause", "text": "Pause and try.", "cue": {"p": 145, "r": "game"}}, {"t0": 41.41, "t1": 44.67, "who": "P", "text": "The fifties, the jazz three-step, and the pop four!", "cue": {"p": 145, "r": "game", "reveal": true}}, {"t0": 44.67, "t1": 50.96, "who": "B", "text": "Your little task for next time: play the pop four in C, and hum a tune of your own over it.", "cue": {"p": 145, "r": "watch"}}, {"t0": 50.96, "t1": 52.41, "who": "P", "text": "I will!", "cue": {"p": 145, "r": "watch"}}, {"t0": 52.41, "t1": 68.7, "who": "B", "text": "Try it: C, G, A minor, F, four beats each, round four times, and hum any tune you like over it. Watch out: the pop four and the fifties use the same four chords, in a different order. Listen to which comes second. Until next time, Clara.", "cue": {"p": 145, "r": "watch"}}, {"t0": 68.7, "t1": 71.57, "who": "P", "text": "Bye, Butler! I’m going to write a hit song.", "cue": {"p": 145, "r": "watch"}}]}]}, {"k": "MT", "part": "Part VI · Harmony in music", "t": "Tips: when harmony goes wrong", "pages": [146]}, {"k": "FO", "part": "Part VII · Shape and style", "t": "Opening map", "pages": [147], "clips": [{"t": "Part Seven: Shape and style", "f": "audio/FO/01-part-seven-shape-and-style.mp3", "s": 72, "p": 147, "l": [{"t0": 3.4, "t1": 8.69, "who": "B", "text": "Welcome to Part Seven, Clara: shape and style. How music is built.", "cue": {"p": 147, "r": "map"}}, {"t0": 8.69, "t1": 23.04, "who": "B", "text": "Step back from the notes and see the building: small ideas, repeated and moved, in sections that come and go, in the style of their time. Like looking at a house from across the street instead of staring at one brick.", "cue": {"p": 147, "r": "map"}}, {"t0": 23.04, "t1": 26.36, "who": "P", "text": "So the letters on the map are like the rooms of a house?", "cue": {"p": 147, "r": "map"}}, {"t0": 26.36, "t1": 37.0, "who": "B", "text": "Exactly. Listen to a little tune built that way: the first idea, the same idea again, something new, and then the first idea once more to come home.", "cue": {"p": 147, "r": "map"}}, {"t0": 37.0, "t1": 58.51, "who": "piano", "notes": [37.0, 37.62, 38.24, 38.86, 39.48, 40.1, 40.72, 42.21, 42.83, 43.45, 44.07, 44.69, 45.31, 45.93, 47.42, 48.04, 48.66, 49.28, 49.9, 50.52, 51.14, 51.76, 53.25, 53.87, 54.49, 55.11, 55.73, 56.35, 56.97], "cue": {"p": 147, "r": "map"}}, {"t0": 58.51, "t1": 70.18, "who": "B", "text": "Six chapters: motifs and phrases, repetition and sequence, texture, changing key, form, and styles through time. Shall we begin with the smallest idea of all?", "cue": {"p": 147, "r": "map"}}, {"t0": 70.18, "t1": 71.77, "who": "P", "text": "Let’s go!", "cue": {"p": 147, "r": "map"}}]}]}, {"k": "F1", "part": "Part VII · Shape and style", "t": "1 · Motifs and phrases", "pages": [148, 149], "clips": [{"t": "Motifs and phrases", "f": "audio/F1/01-motifs-and-phrases.mp3", "s": 28, "p": 148, "l": [{"t0": 3.4, "t1": 6.72, "who": "B", "text": "Clara, a tune is built like a story.", "cue": {"p": 148, "r": "h:Motifs and phrases"}}, {"t0": 6.72, "t1": 8.7, "who": "P", "text": "With a dragon in it?", "cue": {"p": 148, "r": "lead"}}, {"t0": 8.7, "t1": 19.73, "who": "B", "text": "Sometimes. A tiny idea, the motif, is like a word. It grows into a phrase, a musical sentence. And two phrases make a question and its answer.", "cue": {"p": 148, "r": "lead"}}, {"t0": 19.73, "t1": 28.28, "who": "B", "text": "That is the secret: a motif is a word, a phrase a sentence. A question ends away from home; an answer comes home.", "cue": {"p": 148, "r": "secret"}}]}, {"t": "A motif", "f": "audio/F1/02-a-motif.mp3", "s": 36, "p": 149, "l": [{"t0": 0.2, "t1": 6.6, "who": "B", "text": "Here is the most famous motif ever written. Four notes: short, short, short, long.", "cue": {"p": 148, "r": "two"}}, {"t0": 6.6, "t1": 18.87, "who": "piano", "notes": [6.6, 6.91, 7.22, 7.53, 9.64, 9.95, 10.26, 10.57, 13.3, 13.61, 13.92, 14.23, 14.54, 14.85, 15.16, 15.47, 15.78, 16.09, 16.4, 16.71], "cue": {"p": 148, "r": "two"}}, {"t0": 18.87, "t1": 22.04, "who": "P", "text": "Beethoven! Da-da-da-dum. Again and again!", "cue": {"p": 148, "r": "two"}}, {"t0": 22.04, "t1": 35.6, "who": "B", "text": "He builds a whole movement out of those four notes, like building a castle out of one kind of brick. A motif is short, two to six notes, and easy to recognise: its rhythm and shape keep coming back.", "cue": {"p": 148, "r": "two"}}]}, {"t": "Question and answer", "f": "audio/F1/03-question-and-answer.mp3", "s": 45, "p": 149, "l": [{"t0": 0.2, "t1": 9.75, "who": "B", "text": "Now phrases. Ode to Joy begins with two four-bar phrases. Listen to the first. It ends on D, away from home. A question.", "cue": {"p": 148, "r": "vx"}}, {"t0": 9.75, "t1": 19.97, "who": "piano", "notes": [9.75, 10.37, 10.99, 11.61, 12.23, 12.85, 13.47, 14.09, 14.71, 15.33, 15.95, 16.57, 17.19, 18.12, 18.43], "cue": {"p": 148, "r": "vx"}}, {"t0": 19.97, "t1": 22.72, "who": "P", "text": "It sounds like it’s asking: and then?", "cue": {"p": 148, "r": "vx"}}, {"t0": 22.72, "t1": 26.73, "who": "B", "text": "And the second phrase comes home to C. The answer.", "cue": {"p": 148, "r": "vx"}}, {"t0": 26.73, "t1": 36.95, "who": "piano", "notes": [26.73, 27.35, 27.97, 28.59, 29.21, 29.83, 30.45, 31.07, 31.69, 32.31, 32.93, 33.55, 34.17, 35.1, 35.41], "cue": {"p": 148, "r": "vx"}}, {"t0": 36.95, "t1": 44.9, "who": "B", "text": "The rule: most phrases are four bars long. A question ends away from the key note; the answer comes home to it.", "cue": {"p": 148, "r": "rule"}}]}, {"t": "Examples", "f": "audio/F1/04-examples.mp3", "s": 80, "p": 149, "l": [{"t0": 0.2, "t1": 7.11, "who": "B", "text": "Question or answer? The key is C major. What is the last note of this phrase, and is it home?", "cue": {"p": 149, "r": "ex1"}}, {"t0": 7.11, "t1": 11.11, "who": "pause", "text": "Pause and try.", "cue": {"p": 149, "r": "ex1"}}, {"t0": 11.11, "t1": 13.85, "who": "P", "text": "It ends on D, not C. A question!", "cue": {"p": 149, "r": "ex1", "reveal": true}}, {"t0": 13.85, "t1": 19.97, "who": "B", "text": "Now find the motif. Look at bar one: what shape and rhythm? Then bars two and three.", "cue": {"p": 149, "r": "ex2"}}, {"t0": 19.97, "t1": 23.97, "who": "pause", "text": "Pause and try.", "cue": {"p": 149, "r": "ex2"}}, {"t0": 23.97, "t1": 28.38, "who": "P", "text": "Step, step, long: three notes. It comes three times, each a step higher!", "cue": {"p": 149, "r": "ex2", "reveal": true}}, {"t0": 28.38, "t1": 36.62, "who": "piano", "notes": [28.38, 29.0, 29.62, 31.11, 31.73, 32.35, 33.84, 34.46, 35.08], "cue": {"p": 149, "r": "ex2", "reveal": true}}, {"t0": 36.62, "t1": 43.79, "who": "B", "text": "Game: each phrase is four bars long. How many phrases in a tune of eight bars? Twelve? Sixteen?", "cue": {"p": 149, "r": "gt2"}}, {"t0": 43.79, "t1": 47.79, "who": "pause", "text": "Pause and try.", "cue": {"p": 149, "r": "gt2"}}, {"t0": 47.79, "t1": 50.45, "who": "P", "text": "Two, three, four. Easy peasy.", "cue": {"p": 149, "r": "gt2", "reveal": true}}, {"t0": 50.45, "t1": 56.67, "who": "B", "text": "Your little task for next time: sing a question phrase and an answer phrase of your own.", "cue": {"p": 149, "r": "watch"}}, {"t0": 56.67, "t1": 58.12, "who": "P", "text": "I will!", "cue": {"p": 149, "r": "watch"}}, {"t0": 58.12, "t1": 74.44, "who": "B", "text": "Try singing a question, and stop on the D: it hangs in the air like a ball thrown up. Then sing the answer and land on C. One trap: don’t play every note the same; each phrase has one high point to grow towards. Until next time, Clara.", "cue": {"p": 149, "r": "watch"}}, {"t0": 74.44, "t1": 76.95, "who": "P", "text": "Bye, Butler? That was a question.", "cue": {"p": 149, "r": "watch"}}, {"t0": 76.95, "t1": 80.06, "who": "B", "text": "And here is the answer: bye, Clara.", "cue": {"p": 149, "r": "watch"}}]}]}, {"k": "F2", "part": "Part VII · Shape and style", "t": "2 · Repetition and sequence", "pages": [150, 151], "clips": [{"t": "Repetition and sequence", "f": "audio/F2/01-repetition-and-sequence.mp3", "s": 67, "p": 150, "l": [{"t0": 3.4, "t1": 8.86, "who": "B", "text": "Clara, composers are very thrifty. They make one idea go a long way.", "cue": {"p": 150, "r": "h:Repetition and sequence"}}, {"t0": 8.86, "t1": 11.92, "who": "P", "text": "Like my mum making soup out of leftovers?", "cue": {"p": 150, "r": "lead"}}, {"t0": 11.92, "t1": 22.8, "who": "B", "text": "Exactly like that. They say the idea again, say it again higher or lower, let another hand copy it, or say something completely new. That is the secret.", "cue": {"p": 150, "r": "secret"}}, {"t0": 22.8, "t1": 34.7, "who": "B", "text": "Four ways. Repetition: the same notes again. Sequence: the same shape, starting higher or lower. Imitation: another hand copies it. And contrast: something new.", "cue": {"p": 150, "r": "ht"}}, {"t0": 34.7, "t1": 42.74, "who": "B", "text": "A rising sequence: C D E, D E F, E F G. Like climbing stairs with the same three steps each time.", "cue": {"p": 150, "r": "two"}}, {"t0": 42.74, "t1": 52.96, "who": "piano", "notes": [42.74, 43.36, 43.98, 45.22, 45.84, 46.46, 47.7, 48.32, 48.94, 50.18, 50.8, 51.42], "cue": {"p": 150, "r": "two"}}, {"t0": 52.96, "t1": 56.56, "who": "B", "text": "And a falling one: each time one note lower.", "cue": {"p": 150, "r": "two"}}, {"t0": 56.56, "t1": 66.78, "who": "piano", "notes": [56.56, 57.18, 57.8, 59.04, 59.66, 60.28, 61.52, 62.14, 62.76, 64.0, 64.62, 65.24], "cue": {"p": 150, "r": "two"}}]}, {"t": "Examples", "f": "audio/F2/02-examples.mp3", "s": 68, "p": 151, "l": [{"t0": 0.2, "t1": 7.7, "who": "B", "text": "Repetition or sequence? Bar one: which notes? Bar two: the same notes, or the same shape on new notes?", "cue": {"p": 150, "r": "ex1"}}, {"t0": 7.7, "t1": 11.7, "who": "pause", "text": "Pause and try.", "cue": {"p": 150, "r": "ex1"}}, {"t0": 11.7, "t1": 15.16, "who": "P", "text": "Same shape, a step higher each bar: a sequence!", "cue": {"p": 150, "r": "ex1", "reveal": true}}, {"t0": 15.16, "t1": 21.64, "who": "B", "text": "Which hand copies? The right hand plays C D E F G E C. The left hand waits, then?", "cue": {"p": 151, "r": "ex2"}}, {"t0": 21.64, "t1": 32.11, "who": "piano", "notes": [21.64, 22.26, 22.88, 23.5, 24.12, 24.74, 25.36, 26.85, 27.47, 28.09, 28.71, 29.33, 29.95, 30.57], "cue": {"p": 151, "r": "ex2"}}, {"t0": 32.11, "t1": 35.11, "who": "pause", "text": "Pause and try.", "cue": {"p": 151, "r": "ex2"}}, {"t0": 35.11, "t1": 39.54, "who": "P", "text": "The left hand copies it, two octaves down. Like an echo in a cave!", "cue": {"p": 151, "r": "ex2", "reveal": true}}, {"t0": 39.54, "t1": 45.15, "who": "B", "text": "Imitation. And where is the contrast here? Bars one and two, then bar three?", "cue": {"p": 151, "r": "ex3"}}, {"t0": 45.15, "t1": 49.15, "who": "pause", "text": "Pause and try.", "cue": {"p": 151, "r": "ex3"}}, {"t0": 49.15, "t1": 54.0, "who": "P", "text": "Bars one and two repeat, and bar three brings something new: long notes on G.", "cue": {"p": 151, "r": "ex3", "reveal": true}}, {"t0": 54.0, "t1": 60.02, "who": "B", "text": "Game: name each one. Same notes. One step up. Left hand copies. New rhythm.", "cue": {"p": 151, "r": "gt2"}}, {"t0": 60.02, "t1": 65.02, "who": "pause", "text": "Pause and try.", "cue": {"p": 151, "r": "gt2"}}, {"t0": 65.02, "t1": 68.47, "who": "P", "text": "Repetition, sequence, imitation, contrast.", "cue": {"p": 151, "r": "gt2", "reveal": true}}]}, {"t": "You know this", "f": "audio/F2/03-you-know-this.mp3", "s": 58, "p": 151, "l": [{"t0": 0.2, "t1": 11.33, "who": "B", "text": "Frère Jacques does nearly everything. Every bar is said twice: repetition. And sung as a round, each voice comes in two bars after the last: imitation.", "cue": {"p": 151, "r": "yk"}}, {"t0": 11.33, "t1": 31.72, "who": "piano", "notes": [11.33, 11.95, 12.57, 13.19, 13.81, 14.43, 15.05, 15.67, 16.29, 16.91, 17.53, 18.77, 19.39, 20.01, 21.5, 21.81, 22.12, 22.43, 22.74, 23.36, 23.98, 24.29, 24.6, 24.91, 25.22, 25.84, 26.46, 27.08, 27.7, 28.94, 29.56, 30.18], "cue": {"p": 151, "r": "yk"}}, {"t0": 31.72, "t1": 34.87, "who": "P", "text": "Are you sleeping, Brother John? Ding dang dong!", "cue": {"p": 151, "r": "yk"}}, {"t0": 34.87, "t1": 40.84, "who": "B", "text": "Your little task for next time: take a three-note idea, and walk it up as a sequence.", "cue": {"p": 151, "r": "watch"}}, {"t0": 40.84, "t1": 42.29, "who": "P", "text": "I will!", "cue": {"p": 151, "r": "watch"}}, {"t0": 42.29, "t1": 53.48, "who": "B", "text": "Try it as a round with a friend. And one trap: a sequence always moves to new notes; the same notes again is just repetition. Until next time, Clara.", "cue": {"p": 151, "r": "watch"}}, {"t0": 53.48, "t1": 55.63, "who": "P", "text": "Bye, Butler! Bye, Butler!", "cue": {"p": 151, "r": "watch"}}, {"t0": 55.63, "t1": 57.72, "who": "B", "text": "Ha. Repetition.", "cue": {"p": 151, "r": "watch"}}]}]}, {"k": "F3", "part": "Part VII · Shape and style", "t": "3 · Texture", "pages": [152, 153], "clips": [{"t": "Texture", "f": "audio/F3/01-texture.mp3", "s": 67, "p": 152, "l": [{"t0": 3.4, "t1": 7.81, "who": "B", "text": "Clara, run your fingers over your jumper. Feel the threads?", "cue": {"p": 152, "r": "h:Texture"}}, {"t0": 7.81, "t1": 10.17, "who": "P", "text": "It’s woolly and a bit scratchy.", "cue": {"p": 152, "r": "lead"}}, {"t0": 10.17, "t1": 22.99, "who": "B", "text": "Music has threads too. Texture is how many lines sound at once, and how they fit together: one line alone, a tune with chords, or several tunes woven together like threads in cloth.", "cue": {"p": 152, "r": "lead"}}, {"t0": 22.99, "t1": 28.3, "who": "B", "text": "That is the secret: count the lines. One line alone is monophony.", "cue": {"p": 152, "r": "hero"}}, {"t0": 28.3, "t1": 34.18, "who": "piano", "notes": [28.3, 28.92, 29.54, 30.16, 30.78, 32.02, 32.64], "cue": {"p": 152, "r": "hero"}}, {"t0": 34.18, "t1": 38.12, "who": "B", "text": "A tune with chords is melody and accompaniment.", "cue": {"p": 152, "r": "hero"}}, {"t0": 38.12, "t1": 46.91, "who": "piano", "notes": [38.12, 39.57, 40.19, 41.64, 42.26, 43.71, 45.16], "cue": {"p": 152, "r": "hero"}}, {"t0": 46.91, "t1": 51.66, "who": "B", "text": "And two tunes at once, each going its own way, is polyphony.", "cue": {"p": 152, "r": "hero"}}, {"t0": 51.66, "t1": 62.11, "who": "piano", "notes": [51.66, 53.11, 54.56, 56.01, 57.46, 58.91, 60.36], "cue": {"p": 152, "r": "hero"}}, {"t0": 62.11, "t1": 66.97, "who": "P", "text": "Polyphony sounds like two people chatting at the same time, and somehow it works.", "cue": {"p": 152, "r": "hero"}}]}, {"t": "The words", "f": "audio/F3/02-the-words.mp3", "s": 30, "p": 153, "l": [{"t0": 0.2, "t1": 16.28, "who": "B", "text": "The grand words: monophonic, one line alone. Homophonic, a tune with chords underneath. Polyphonic, two or more tunes at once. And for the accompaniment: block chords struck together, or an Alberti bass rocking low, high, middle, high.", "cue": {"p": 152, "r": "ht"}}, {"t0": 16.28, "t1": 22.48, "who": "B", "text": "Game: name the texture. A tune alone. A tune and chords. Two tunes at once.", "cue": {"p": 152, "r": "game"}}, {"t0": 22.48, "t1": 26.48, "who": "pause", "text": "Pause and try.", "cue": {"p": 152, "r": "game"}}, {"t0": 26.48, "t1": 30.17, "who": "P", "text": "Monophonic, homophonic, polyphonic. They all rhyme!", "cue": {"p": 152, "r": "game", "reveal": true}}]}, {"t": "Examples", "f": "audio/F3/03-examples.mp3", "s": 35, "p": 153, "l": [{"t0": 0.2, "t1": 6.87, "who": "B", "text": "Name the texture. The right hand plays a tune, and the left hand plays chords. So which word?", "cue": {"p": 153, "r": "ex1"}}, {"t0": 6.87, "t1": 9.87, "who": "pause", "text": "Pause and try.", "cue": {"p": 153, "r": "ex1"}}, {"t0": 9.87, "t1": 12.79, "who": "P", "text": "Homophonic: melody and accompaniment.", "cue": {"p": 153, "r": "ex1", "reveal": true}}, {"t0": 12.79, "t1": 20.02, "who": "B", "text": "And which hand has the tune here? The right hand repeats two-note chords. The left hand moves step by step.", "cue": {"p": 153, "r": "ex2"}}, {"t0": 20.02, "t1": 24.02, "who": "pause", "text": "Pause and try.", "cue": {"p": 153, "r": "ex2"}}, {"t0": 24.02, "t1": 27.77, "who": "P", "text": "The left hand! So it sings out, and the right hand stays soft.", "cue": {"p": 153, "r": "ex2", "reveal": true}}, {"t0": 27.77, "t1": 34.93, "who": "B", "text": "Exactly. The tune isn’t always on top, like the hero isn’t always the tallest person in the film.", "cue": {"p": 153, "r": "ex2", "reveal": true}}]}, {"t": "You know this", "f": "audio/F3/04-you-know-this.mp3", "s": 42, "p": 153, "l": [{"t0": 0.2, "t1": 10.48, "who": "B", "text": "Mozart’s Sonata in C again: the right hand sings, the left hand rocks C G E G, an Alberti bass. The sound of the Classical style.", "cue": {"p": 153, "r": "yk"}}, {"t0": 10.48, "t1": 21.2, "who": "piano", "notes": [10.48, 11.72, 12.34, 13.21, 14.14, 14.29, 14.45, 15.94, 16.25, 16.56, 16.87, 17.18, 17.49, 17.8, 18.11, 18.42, 18.73, 19.04, 19.35, 19.66, 19.97, 20.28, 20.59], "cue": {"p": 153, "r": "yk"}}, {"t0": 21.2, "t1": 26.93, "who": "B", "text": "Your little task for next time: play a piece with the tune loud and the chords soft.", "cue": {"p": 153, "r": "watch"}}, {"t0": 26.93, "t1": 28.38, "who": "P", "text": "I will!", "cue": {"p": 153, "r": "watch"}}, {"t0": 28.38, "t1": 40.0, "who": "B", "text": "Two traps: never let the accompaniment cover the tune. And when there are two tunes, practise each hand alone and sing it, so neither gets lost. Until next time, Clara.", "cue": {"p": 153, "r": "watch"}}, {"t0": 40.0, "t1": 41.6, "who": "P", "text": "Bye, Butler!", "cue": {"p": 153, "r": "watch"}}]}]}, {"k": "F4", "part": "Part VII · Shape and style", "t": "4 · Changing key", "pages": [154, 155], "clips": [{"t": "Changing key", "f": "audio/F4/01-changing-key.mp3", "s": 45, "p": 154, "l": [{"t0": 3.4, "t1": 11.54, "who": "B", "text": "Clara, music can go on holiday. It travels to a new key, and then it comes home again. That is a modulation.", "cue": {"p": 154, "r": "h:Changing key"}}, {"t0": 11.54, "t1": 13.8, "who": "P", "text": "Does it send a postcard?", "cue": {"p": 154, "r": "lead"}}, {"t0": 13.8, "t1": 22.35, "who": "B", "text": "In a way. The signpost is a new sharp, flat or natural that keeps coming back, and a cadence that lands in the new key.", "cue": {"p": 154, "r": "lead"}}, {"t0": 22.35, "t1": 31.26, "who": "B", "text": "That is the secret. Here, C major is home. Then F sharp appears: a visit to G major. Then F natural again: home.", "cue": {"p": 154, "r": "hero"}, "hits": [[24.22, "#0", 26, 33, "hero"], [28.04, "#2", 76, 83, "hero"]]}, {"t0": 31.26, "t1": 41.98, "who": "piano", "notes": [31.26, 31.88, 32.5, 33.12, 33.99, 34.61, 35.23, 35.85, 36.47, 37.96, 38.58, 39.2, 39.82, 40.44], "cue": {"p": 154, "r": "hero"}}, {"t0": 41.98, "t1": 44.77, "who": "P", "text": "Off on holiday, and back home for tea.", "cue": {"p": 154, "r": "hero"}}]}, {"t": "The nearest keys", "f": "audio/F4/02-the-nearest-keys.mp3", "s": 47, "p": 155, "l": [{"t0": 0.2, "t1": 16.52, "who": "B", "text": "A piece in C major usually visits the keys next door on the circle of fifths, where only one note changes. To G major, F sharp appears. To F major, B flat appears. And to the relative minor, A minor, G sharp appears.", "cue": {"p": 154, "r": "ht"}, "hits": [[0.89, "#0", 11, 18, "hero"], [8.21, "#2", 110, 117, "hero"]]}, {"t0": 16.52, "t1": 24.83, "who": "B", "text": "Listen: bar one in C major; F sharp twice in bar two, then the phrase lands on G. Now we’re in G major.", "cue": {"p": 154, "r": "vx"}, "hits": [[17.87, "#0", 19, 26, "vx"], [23.74, "#1", 95, 102, "vx"]]}, {"t0": 24.83, "t1": 33.07, "who": "piano", "notes": [24.83, 25.45, 26.07, 26.69, 27.56, 28.18, 28.8, 29.42, 30.29, 30.91, 31.53], "cue": {"p": 154, "r": "vx"}}, {"t0": 33.07, "t1": 38.42, "who": "B", "text": "Where does the key change here? Find the accidental, and where the phrase lands.", "cue": {"p": 154, "r": "ex1"}}, {"t0": 38.42, "t1": 42.42, "who": "pause", "text": "Pause and try.", "cue": {"p": 154, "r": "ex1"}}, {"t0": 42.42, "t1": 46.9, "who": "P", "text": "B flat in bar two and again in bar three, landing on F. F major!", "cue": {"p": 154, "r": "ex1", "reveal": true}}]}, {"t": "Examples", "f": "audio/F4/03-examples.mp3", "s": 84, "p": 155, "l": [{"t0": 0.2, "t1": 9.01, "who": "B", "text": "In G major, a C sharp keeps appearing. G major has one sharp, F sharp. C sharp is one more. Which key has both?", "cue": {"p": 155, "r": "ex2"}}, {"t0": 9.01, "t1": 13.01, "who": "pause", "text": "Pause and try.", "cue": {"p": 155, "r": "ex2"}}, {"t0": 13.01, "t1": 15.58, "who": "P", "text": "D major, the key a fifth up!", "cue": {"p": 155, "r": "ex2", "reveal": true}}, {"t0": 15.58, "t1": 23.49, "who": "B", "text": "And here: one F sharp in a bar of C major, then F natural everywhere after. A new key, or just passing?", "cue": {"p": 155, "r": "ex3"}}, {"t0": 23.49, "t1": 27.49, "who": "pause", "text": "Pause and try.", "cue": {"p": 155, "r": "ex3"}}, {"t0": 27.49, "t1": 29.17, "who": "P", "text": "A new key!", "cue": {"p": 155, "r": "ex3", "oops": true}}, {"t0": 29.17, "t1": 39.15, "who": "B", "text": "Not this time. One visitor doesn’t make a move. The F sharp never comes back, and there’s no cadence in G. Just a decoration, passing through.", "cue": {"p": 155, "r": "ex3"}}, {"t0": 39.15, "t1": 42.77, "who": "P", "text": "Oh. Like a cat walking through the garden, not moving in.", "cue": {"p": 155, "r": "ex3", "reveal": true}}, {"t0": 42.77, "t1": 52.11, "who": "B", "text": "Game: where to next? C major plus F sharp. C major plus B flat. G major plus C sharp. F major plus E flat.", "cue": {"p": 155, "r": "gt2"}, "hits": [[44.43, "#0", 21, 28, "gt2"], [46.3, "#0", 43, 50, "gt2"], [48.08, "#1", 64, 71, "gt2"]]}, {"t0": 52.11, "t1": 58.11, "who": "pause", "text": "Pause and try.", "cue": {"p": 155, "r": "gt2"}}, {"t0": 58.11, "t1": 62.12, "who": "P", "text": "G major, F major, D major, and B flat major.", "cue": {"p": 155, "r": "gt2", "reveal": true}, "hits": [[57.99, "#1", 0, 7, "gt2"]]}, {"t0": 62.12, "t1": 68.45, "who": "B", "text": "Your little task for next time: find a new sharp or flat that keeps coming back in a piece.", "cue": {"p": 155, "r": "think"}}, {"t0": 68.45, "t1": 69.9, "who": "P", "text": "I will!", "cue": {"p": 155, "r": "think"}}, {"t0": 69.9, "t1": 81.26, "who": "B", "text": "A modulation is a holiday: new scenery for a while, but the piece usually comes home at the end. So watch for the old note returning. Until next time, Clara.", "cue": {"p": 155, "r": "think"}}, {"t0": 81.26, "t1": 83.9, "who": "P", "text": "Bye, Butler! Send me a postcard.", "cue": {"p": 155, "r": "think"}}]}]}, {"k": "F5", "part": "Part VII · Shape and style", "t": "5 · Form", "pages": [156, 157, 158], "clips": [{"t": "Form", "f": "audio/F5/01-form.mp3", "s": 40, "p": 156, "l": [{"t0": 3.4, "t1": 12.04, "who": "B", "text": "Clara, form is the map of a whole piece: which sections come, in what order, and which come back. Like a floor plan of a house.", "cue": {"p": 156, "r": "h:Form"}}, {"t0": 12.04, "t1": 14.61, "who": "P", "text": "So I don’t get lost in the music!", "cue": {"p": 156, "r": "lead"}}, {"t0": 14.61, "t1": 26.02, "who": "B", "text": "Exactly. We name the sections with letters: A for the first idea, B for the next new one, and so on. The secret: same music, same letter. New music, next letter.", "cue": {"p": 156, "r": "secret"}}, {"t0": 26.02, "t1": 39.54, "who": "B", "text": "Binary: A B, two halves. Ternary: A B A, out, away an
