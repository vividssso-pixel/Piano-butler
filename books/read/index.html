7, "x", "4", 7.0], [32.49, "X", "1", 8.0], [33.11, "x", "2", 9.0], [33.73, "M", "3", 10.0], [34.35, "x", "4", 11.0]], "ands": [], "notes": [[27.53, 0.0, 4.0, 0, 0], [30.01, 4.0, 2.0, 0, 0], [31.25, 6.0, 2.0, 0, 0], [32.49, 8.0, 1.0, 0, 0], [33.11, 9.0, 1.0, 0, 0], [33.73, 10.0, 1.0, 0, 0], [34.35, 11.0, 1.0, 0, 0]], "bars": [0.0, 4.0, 8.0], "n": 12.0, "at": [27.53, 28.15, 28.77, 29.39, 30.01, 30.63, 31.25, 31.87, 32.49, 33.11, 33.73, 34.35], "full": true}}, {"t0": 36.0, "t1": 38.68, "who": "B", "text": "And quavers: two to every beat.", "cue": {"p": 53, "r": "hero"}}, {"t0": 38.68, "t1": 42.16, "who": "piano", "notes": [38.68, 38.99, 39.3, 39.61, 39.92, 40.23, 40.54, 40.85], "cue": {"p": 53, "r": "hero"}, "lens": {"k": "rhy", "beats": [[38.65, "X", "1", 0.0], [39.27, "x", "2", 1.0], [39.89, "M", "3", 2.0], [40.51, "x", "4", 3.0]], "ands": [[38.96, 0.5, "&"], [39.58, 1.5, "&"], [40.2, 2.5, "&"], [40.82, 3.5, "&"]], "notes": [[38.65, 0.0, 0.5, 0, 0], [38.96, 0.5, 0.5, 0, 0], [39.27, 1.0, 0.5, 0, 0], [39.58, 1.5, 0.5, 0, 0], [39.89, 2.0, 0.5, 0, 0], [40.2, 2.5, 0.5, 0, 0], [40.51, 3.0, 0.5, 0, 0], [40.82, 3.5, 0.5, 0, 0]], "bars": [0.0], "n": 4.0, "at": [38.65, 39.27, 39.89, 40.51], "full": true}}, {"t0": 42.16, "t1": 44.88, "who": "P", "text": "For the quavers you said \"and\" in between.", "cue": {"p": 53, "r": "sm"}}, {"t0": 44.88, "t1": 56.13, "who": "B", "text": "Yes. Say the beat’s number, then \"and\" halfway to the next beat. And here is the other half of the secret: every note has a twin rest, a silence of exactly the same length.", "cue": {"p": 53, "r": "secret"}}]}, {"t": "Head, stem, flag", "f": "audio/T2/02-head-stem-flag.mp3", "s": 38, "p": 54, "l": [{"t0": 0.57, "t1": 14.72, "who": "B", "text": "A note has a head, on a line or in a space. Every note except the semibreve has a stem. Below the middle line the stem goes up, on the right of the head; on or above the middle line it goes down, on the left.", "cue": {"p": 53, "r": "two"}}, {"t0": 14.72, "t1": 17.59, "who": "P", "text": "Does a stem going down make the note shorter?", "cue": {"p": 53, "r": "two"}}, {"t0": 17.59, "t1": 28.99, "who": "B", "text": "Never. The stem only keeps the page tidy. Flags change the length: each flag halves the note. And quavers side by side are joined by a beam instead of flags.", "cue": {"p": 53, "r": "two"}}, {"t0": 28.99, "t1": 32.31, "who": "P", "text": "So a note on the middle line has its stem going down?", "cue": {"p": 53, "r": "two"}}, {"t0": 32.31, "t1": 38.05, "who": "B", "text": "Exactly: on or above the middle line, down on the left; below it, up on the right.", "cue": {"p": 53, "r": "two"}}]}, {"t": "The semibreve rest’s special power", "f": "audio/T2/03-the-semibreve-rest-s-special-power.mp3", "s": 26, "p": 54, "l": [{"t0": 0.57, "t1": 19.91, "who": "B", "text": "Most rests last a fixed number of beats. The semibreve rest can also mean a whole bar of silence, in any time signature, and then it sits in the middle of the bar. In four-four it lasts four beats, in three-four three, in two-four two. Listen to three-four: the middle bar is silent, and the beat goes on.", "cue": {"p": 53, "r": "box"}}, {"t0": 19.91, "t1": 26.49, "who": "piano", "notes": [19.91, 20.53, 21.15, 21.77, 22.39, 23.01, 23.63, 24.25, 24.87], "cue": {"p": 53, "r": "box"}, "lens": {"k": "rhy", "beats": [[19.88, "X", "1", 0.0], [20.5, "x", "2", 1.0], [21.12, "x", "3", 2.0], [21.74, "X", "1", 3.0], [22.36, "x", "2", 4.0], [22.98, "x", "3", 5.0], [23.6, "X", "1", 6.0], [24.22, "x", "2", 7.0], [24.84, "x", "3", 8.0]], "ands": [], "notes": [[19.88, 0.0, 1.0, 0, 0], [20.5, 1.0, 1.0, 0, 0], [21.12, 2.0, 1.0, 0, 0], [21.74, 3.0, 3.0, 1, 0], [23.6, 6.0, 2.0, 0, 0], [24.84, 8.0, 1.0, 0, 0]], "bars": [0.0, 3.0, 6.0], "n": 9.0, "at": [19.88, 20.5, 21.12, 21.74, 22.36, 22.98, 23.6, 24.22, 24.84], "full": true}}]}, {"t": "Every note has a twin rest", "f": "audio/T2/04-every-note-has-a-twin-rest.mp3", "s": 22, "p": 54, "l": [{"t0": 0.57, "t1": 11.69, "who": "B", "text": "Every note has a twin rest, the same length with no sound: semibreve, minim, crotchet, quaver, and the semiquaver, a quarter of a beat, which you will meet later.", "cue": {"p": 54, "r": "svg"}}, {"t0": 11.69, "t1": 21.71, "who": "B", "text": "Two rests look alike. The semibreve rest hangs from the fourth line, heavy, like a coat on a hook. The minim rest sits on the middle line, like a hat.", "cue": {"p": 54, "r": "svg"}}]}, {"t": "Pizzas", "f": "audio/T2/05-pizzas.mp3", "s": 31, "p": 54, "l": [{"t0": 0.57, "t1": 6.66, "who": "B", "text": "Some books call the notes whole, half, quarter, eighth and sixteenth notes. Here is why.", "cue": {"p": 54, "r": "pzbox"}}, {"t0": 6.66, "t1": 19.96, "who": "B", "text": "Think of each beat as a pizza. A bar of four-four is four pizzas. The semibreve fills all four; a minim, two; a crotchet, one; a quaver, half a pizza. A rest is the same share, left empty.", "cue": {"p": 54, "r": "pzbox"}}, {"t0": 19.96, "t1": 22.68, "who": "P", "text": "So two quavers make one full pizza.", "cue": {"p": 54, "r": "pzbox"}}, {"t0": 22.68, "t1": 27.25, "who": "B", "text": "Listen: two quavers, then a crotchet. Same-sized pizza.", "cue": {"p": 54, "r": "pzbox"}}, {"t0": 27.25, "t1": 30.73, "who": "piano", "notes": [27.25, 27.56, 27.87, 28.18, 28.49, 28.8, 29.11, 29.42], "cue": {"p": 54, "r": "pzbox"}, "lens": {"k": "rhy", "beats": [[27.22, "X", "1", 0.0], [27.84, "x", "2", 1.0], [28.46, "M", "3", 2.0], [29.08, "x", "4", 3.0]], "ands": [[27.53, 0.5, "&"], [28.15, 1.5, "&"], [28.77, 2.5, "&"], [29.39, 3.5, "&"]], "notes": [[27.22, 0.0, 0.5, 0, 0], [27.53, 0.5, 0.5, 0, 0], [27.84, 1.0, 1.0, 0, 0], [28.46, 2.0, 0.5, 0, 0], [28.77, 2.5, 0.5, 0, 0], [29.08, 3.0, 1.0, 0, 0]], "bars": [0.0], "n": 4.0, "at": [27.22, 27.84, 28.46, 29.08], "full": true}}]}, {"t": "Example: each sound and each silence", "f": "audio/T2/06-example-each-sound-and-each-silence.mp3", "s": 31, "p": 54, "l": [{"t0": 0.57, "t1": 8.9, "who": "B", "text": "Two bars of four-four. Name each shape, say how many beats it lasts, and add them up, rests included. Pause and try.", "cue": {"p": 54, "r": "ex1"}}, {"t0": 8.9, "t1": 12.9, "who": "pause", "text": "Pause and try.", "cue": {"p": 54, "r": "ex1"}}, {"t0": 12.9, "t1": 17.93, "who": "P", "text": "Minim, two. Crotchet, one. Crotchet rest, one. Four beats!", "cue": {"p": 54, "r": "ex1", "reveal": true}}, {"t0": 17.93, "t1": 24.83, "who": "B", "text": "And the second bar has the same shapes in a different order. Count it with me: the rests are counted too.", "cue": {"p": 54, "r": "ex1", "reveal": true}}, {"t0": 24.83, "t1": 30.79, "who": "piano", "notes": [24.83, 25.45, 26.07, 26.69, 27.31, 27.93, 28.55, 29.17], "cue": {"p": 54, "r": "ex1", "reveal": true}, "lens": {"k": "rhy", "beats": [[24.8, "X", "1", 0.0], [25.42, "x", "2", 1.0], [26.04, "M", "3", 2.0], [26.66, "x", "4", 3.0], [27.28, "X", "1", 4.0], [27.9, "x", "2", 5.0], [28.52, "M", "3", 6.0], [29.14, "x", "4", 7.0]], "ands": [], "notes": [[24.8, 0.0, 2.0, 0, 0], [26.04, 2.0, 1.0, 0, 0], [26.66, 3.0, 1.0, 1, 0], [27.28, 4.0, 1.0, 0, 0], [27.9, 5.0, 1.0, 1, 0], [28.52, 6.0, 2.0, 0, 0]], "bars": [0.0, 4.0], "n": 8.0, "at": [24.8, 25.42, 26.04, 26.66, 27.28, 27.9, 28.52, 29.14], "full": true}}]}, {"t": "How to draw notes and rests", "f": "audio/T2/07-how-to-draw-notes-and-rests.mp3", "s": 47, "p": 54, "l": [{"t0": 0.57, "t1": 13.44, "who": "B", "text": "Now draw them yourself, Clara: it is the quickest way to remember them. A note starts with an oval head, tilted a little: filled in for a crotchet or a quaver, hollow for a minim or a semibreve.", "cue": {"p": 55, "r": "xlate"}}, {"t0": 13.44, "t1": 25.42, "who": "B", "text": "Then a stem, about three spaces tall: going up, it sits on the right of the head; going down, on the left. A quaver adds a flag at the end of the stem, always curling to the right.", "cue": {"p": 55, "r": "xlate"}}, {"t0": 25.42, "t1": 27.33, "who": "P", "text": "Oval, stem, flag.", "cue": {"p": 55, "r": "xlate"}}, {"t0": 27.33, "t1": 44.64, "who": "B", "text": "And the rests. The semibreve rest is a little block hanging under line four; the minim rest, a block sitting on line three. The crotchet rest: draw a Z, then a little c underneath. The quaver rest is a seven with a dot on top, and the semiquaver rest a seven with two.", "cue": {"p": 55, "r": "xlate"}, "hits": [[36.26, "#9", 143, 152, "xlate"]]}, {"t0": 44.64, "t1": 47.14, "who": "P", "text": "A Z and a c. I can do that!", "cue": {"p": 55, "r": "xlate"}}]}, {"t": "Example: fill the bar", "f": "audio/T2/08-example-fill-the-bar.mp3", "s": 31, "p": 54, "l": [{"t0": 0.57, "t1": 10.93, "who": "B", "text": "A bar of four-four is a train with four seats. How many seats does the minim take? And the crotchet? How many are left, and which rest fills them? Pause and think.", "cue": {"p": 55, "r": "ex2"}}, {"t0": 10.93, "t1": 14.93, "who": "pause", "text": "Pause and try.", "cue": {"p": 55, "r": "ex2"}}, {"t0": 14.93, "t1": 17.95, "who": "P", "text": "Two seats left!", "cue": {"p": 55, "r": "ex2", "oops": true}}, {"t0": 17.95, "t1": 21.22, "who": "B", "text": "Count again: the crotchet books a seat as well.", "cue": {"p": 55, "r": "ex2"}}, {"t0": 21.22, "t1": 27.25, "who": "P", "text": "The minim takes two and the crotchet one: three. One seat left: a crotchet rest!", "cue": {"p": 55, "r": "ex2", "reveal": true}}, {"t0": 27.25, "t1": 30.73, "who": "piano", "notes": [27.25, 27.87, 28.49, 29.11], "cue": {"p": 55, "r": "ex2", "reveal": true}, "lens": {"k": "rhy", "beats": [[27.22, "X", "1", 0.0], [27.84, "x", "2", 1.0], [28.46, "M", "3", 2.0], [29.08, "x", "4", 3.0]], "ands": [], "notes": [[27.22, 0.0, 2.0, 0, 0], [28.46, 2.0, 1.0, 0, 0], [29.08, 3.0, 1.0, 1, 0]], "bars": [0.0], "n": 4.0, "at": [27.22, 27.84, 28.46, 29.08], "full": true}}]}, {"t": "You know this", "f": "audio/T2/09-you-know-this.mp3", "s": 33, "p": 55, "l": [{"t0": 0.57, "t1": 6.7, "who": "B", "text": "Twinkle, Twinkle: six crotchets, then a minim at the end of the line, two beats to breathe.", "cue": {"p": 55, "r": "yk"}}, {"t0": 6.7, "t1": 12.66, "who": "piano", "notes": [6.7, 7.32, 7.94, 8.56, 9.18, 9.8, 10.42, 11.04], "cue": {"p": 55, "r": "yk"}, "lens": {"k": "rhy", "beats": [[6.67, "X", "1", 0.0], [7.29, "x", "2", 1.0], [7.91, "M", "3", 2.0], [8.53, "x", "4", 3.0], [9.15, "X", "1", 4.0], [9.77, "x", "2", 5.0], [10.39, "M", "3", 6.0], [11.01, "x", "4", 7.0]], "ands": [], "notes": [[6.67, 0.0, 1.0, 0, 0], [7.29, 1.0, 1.0, 0, 0], [7.91, 2.0, 1.0, 0, 0], [8.53, 3.0, 1.0, 0, 0], [9.15, 4.0, 1.0, 0, 0], [9.77, 5.0, 1.0, 0, 0], [10.39, 6.0, 2.0, 0, 0]], "bars": [0.0, 4.0], "n": 8.0, "at": [6.67, 7.29, 7.91, 8.53, 9.15, 9.77, 10.39, 11.01], "full": true}}, {"t0": 12.66, "t1": 18.79, "who": "B", "text": "Next lesson, draw a crotchet rest and a quaver rest for your teacher. Z, then c!", "cue": {"p": 55, "r": "yk"}}, {"t0": 18.79, "t1": 20.04, "who": "P", "text": "I will!", "cue": {"p": 55, "r": "yk"}}, {"t0": 20.04, "t1": 27.58, "who": "B", "text": "A rest is not a gap in the music; it is music you can’t hear. Keep counting through it. Until next time, Clara.", "cue": {"p": 55, "r": "yk"}}, {"t0": 27.58, "t1": 33.32, "who": "P", "text": "One, two, three, four. Goodbye!", "cue": {"p": 55, "r": "yk"}}]}]}, {"k": "T3", "part": "Part II · Time", "t": "3 · How long is a note?", "pages": [56, 57, 58], "clips": [{"t": "How long is a note?", "f": "audio/T3/01-how-long-is-a-note.mp3", "s": 35, "p": 56, "l": [{"t0": 3.6, "t1": 6.23, "who": "P", "text": "What if I need a note longer than its shape?", "cue": {"p": 56, "r": "lead"}}, {"t0": 6.23, "t1": 19.04, "who": "B", "text": "Two signs stretch it, Clara: the dot and the tie. When a crotchet is one beat, a minim lasts two. Put a dot after it, and the dot adds half of two: one more beat. Two plus one: three beats.", "cue": {"p": 56, "r": "hero"}}, {"t0": 19.04, "t1": 23.06, "who": "B", "text": "Listen: a minim, then a dotted minim. Count with me.", "cue": {"p": 56, "r": "hero"}}, {"t0": 23.06, "t1": 29.02, "who": "piano", "notes": [23.06, 23.68, 24.3, 24.92, 25.54, 26.16, 26.78, 27.4], "cue": {"p": 56, "r": "hero"}, "lens": {"k": "rhy", "beats": [[23.03, "X", "1", 0.0], [23.65, "x", "2", 1.0], [24.27, "M", "3", 2.0], [24.89, "x", "4", 3.0], [25.51, "X", "1", 4.0], [26.13, "x", "2", 5.0], [26.75, "M", "3", 6.0], [27.37, "x", "4", 7.0]], "ands": [], "notes": [[23.03, 0.0, 2.0, 0, 0], [24.27, 2.0, 2.0, 1, 0], [25.51, 4.0, 3.0, 0, 0], [27.37, 7.0, 1.0, 1, 0]], "bars": [0.0, 4.0], "n": 8.0, "at": [23.03, 23.65, 24.27, 24.89, 25.51, 26.13, 26.75, 27.37], "full": true}}, {"t0": 29.02, "t1": 34.9, "who": "B", "text": "That is the secret. A dot adds half. A tie glues two notes into one sound.", "cue": {"p": 56, "r": "secret"}}]}, {"t": "The dot", "f": "audio/T3/02-the-dot.mp3", "s": 19, "p": 57, "l": [{"t0": 0.57, "t1": 15.34, "who": "B", "text": "A dot always adds half of its own note. A dotted crotchet is one plus a half: one and a half beats. Here it is, then a quaver, then a minim. Hold the dotted crotchet through \"one and two\", and the quaver lands on the \"and\".", "cue": {"p": 56, "r": "xlate"}}, {"t0": 15.34, "t1": 18.82, "who": "piano", "notes": [15.34, 15.65, 15.96, 16.27, 16.58, 16.89, 17.2, 17.51], "cue": {"p": 56, "r": "xlate"}, "lens": {"k": "rhy", "beats": [[15.31, "X", "1", 0.0], [15.93, "x", "2", 1.0], [16.55, "M", "3", 2.0], [17.17, "x", "4", 3.0]], "ands": [[15.62, 0.5, "&"], [16.24, 1.5, "&"], [16.86, 2.5, "&"], [17.48, 3.5, "&"]], "notes": [[15.31, 0.0, 1.5, 0, 0], [16.24, 1.5, 0.5, 0, 0], [16.55, 2.0, 2.0, 0, 0]], "bars": [0.0], "n": 4.0, "at": [15.31, 15.93, 16.55, 17.17], "full": true}}]}, {"t": "The dot, in pizzas", "f": "audio/T3/03-the-dot-in-pizzas.mp3", "s": 16, "p": 57, "l": [{"t0": 0.57, "t1": 16.11, "who": "B", "text": "In pizzas: a dotted minim is two pizzas, plus one more for the dot. A dotted crotchet is one pizza plus half. A dotted quaver is half a pizza plus a quarter. The dot is always half of whatever its note is worth.", "cue": {"p": 56, "r": "xlate"}}]}, {"t": "Example: a dotted crotchet and a quaver", "f": "audio/T3/04-example-a-dotted-crotchet-and-a-quaver.mp3", "s": 20, "p": 57, "l": [{"t0": 0.57, "t1": 7.6, "who": "B", "text": "How many beats are a dotted crotchet and a quaver together? And where does the quaver fall? Pause and try.", "cue": {"p": 56, "r": "ex1"}}, {"t0": 7.6, "t1": 11.6, "who": "pause", "text": "Pause and try.", "cue": {"p": 56, "r": "ex1"}}, {"t0": 11.6, "t1": 17.35, "who": "P", "text": "One and a half, plus a half: two beats. The quaver lands on the \"and\" of two.", "cue": {"p": 56, "r": "ex1", "reveal": true}}, {"t0": 17.35, "t1": 19.59, "who": "piano", "notes": [17.35, 17.66, 17.97, 18.28], "cue": {"p": 56, "r": "ex1", "reveal": true}, "lens": {"k": "rhy", "beats": [[17.32, "X", "1", 0.0], [17.94, "x", "2", 1.0]], "ands": [[17.63, 0.5, "&"], [18.25, 1.5, "&"]], "notes": [[17.32, 0.0, 1.5, 0, 0], [18.25, 1.5, 0.5, 0, 0]], "bars": [0.0], "n": 2.0, "at": [17.32, 17.94], "full": true}}]}, {"t": "Example: Ode to Joy", "f": "audio/T3/05-example-ode-to-joy.mp3", "s": 25, "p": 57, "l": [{"t0": 0.57, "t1": 14.74, "who": "B", "text": "You already know a dotted crotchet: Beethoven’s Ode to Joy. Listen to bars three and four. The red E is dotted: hold it through \"one and two\". The quaver D falls on the \"and\", and the last D takes beats three and four.", "cue": {"p": 57, "r": "ex2"}}, {"t0": 14.74, "t1": 20.7, "who": "piano", "notes": [14.74, 15.36, 15.98, 16.6, 17.22, 17.53, 17.84, 18.15, 18.46, 19.08], "cue": {"p": 57, "r": "ex2", "reveal": true}, "lens": {"k": "rhy", "beats": [[14.71, "X", "1", 0.0], [15.33, "x", "2", 1.0], [15.95, "M", "3", 2.0], [16.57, "x", "4", 3.0], [17.19, "X", "1", 4.0], [17.81, "x", "2", 5.0], [18.43, "M", "3", 6.0], [19.05, "x", "4", 7.0]], "ands": [[17.5, 4.5, "&"], [18.12, 5.5, "&"]], "notes": [[14.71, 0.0, 1.0, 0, 0], [15.33, 1.0, 1.0, 0, 0], [15.95, 2.0, 1.0, 0, 0], [16.57, 3.0, 1.0, 0, 0], [17.19, 4.0, 1.5, 0, 0], [18.12, 5.5, 0.5, 0, 0], [18.43, 6.0, 2.0, 0, 0]], "bars": [0.0, 4.0], "n": 8.0, "at": [14.71, 15.33, 15.95, 16.57, 17.19, 17.81, 18.43, 19.05], "full": true}}, {"t0": 20.7, "t1": 25.29, "who": "P", "text": "Long, short, then long. It leans before it lands!", "cue": {"p": 57, "r": "ex2", "reveal": true}}]}, {"t": "The double dot", "f": "audio/T3/06-the-double-dot.mp3", "s": 12, "p": 57, "l": [{"t0": 0.57, "t1": 12.1, "who": "B", "text": "Going further: a second dot adds half of the first dot. A double-dotted minim lasts two, plus one, plus a half: three and a half beats. You will not need it for a while.", "cue": {"p": 57, "r": "xlate"}}]}, {"t": "The tie", "f": "audio/T3/07-the-tie.mp3", "s": 20, "p": 57, "l": [{"t0": 0.57, "t1": 12.63, "who": "B", "text": "A tie is a curve joining two notes of the same pitch. Play the first and hold through the second. Never play the second again. And a tie can cross a bar line, which a dot cannot.", "cue": {"p": 57, "r": "xlate2"}}, {"t0": 12.63, "t1": 16.11, "who": "piano", "notes": [12.63, 13.25, 13.87, 14.49], "cue": {"p": 57, "r": "xlate2"}, "lens": {"k": "rhy", "beats": [[12.6, "X", "1", 0.0], [13.22, "x", "2", 1.0], [13.84, "X", "1", 2.0], [14.46, "x", "2", 3.0]], "ands": [], "notes": [[12.6, 0.0, 1.0, 0, 0], [13.22, 1.0, 1.0, 0, 1], [13.84, 2.0, 1.0, 0, 0], [14.46, 3.0, 1.0, 0, 0]], "bars": [0.0, 2.0], "n": 4.0, "at": [12.6, 13.22, 13.84, 14.46], "full": true}}, {"t0": 16.11, "t1": 19.92, "who": "P", "text": "One sound from beat two, right over the bar line to beat one.", "cue": {"p": 57, "r": "xlate2"}}]}, {"t": "Example: dot or tie?", "f": "audio/T3/08-example-dot-or-tie.mp3", "s": 35, "p": 57, "l": [{"t0": 0.57, "t1": 7.49, "who": "B", "text": "Which is longer: the dotted minim, or the minim tied to a crotchet? Add up each one. Pause and try.", "cue": {"p": 57, "r": "ex3"}}, {"t0": 7.49, "t1": 11.49, "who": "pause", "text": "Pause and try.", "cue": {"p": 57, "r": "ex3"}}, {"t0": 11.49, "t1": 15.75, "who": "P", "text": "The tied notes are longer. There are two of them!", "cue": {"p": 57, "r": "ex3", "oops": true}}, {"t0": 15.75, "t1": 19.58, "who": "B", "text": "Two notes, but one sound. Add them up and compare.", "cue": {"p": 57, "r": "ex3"}}, {"t0": 19.58, "t1": 25.48, "who": "P", "text": "Dotted minim: two plus one, three. Tied notes: two plus one, three. The same!", "cue": {"p": 57, "r": "ex3", "reveal": true}}, {"t0": 25.48, "t1": 30.2, "who": "piano", "notes": [25.48, 26.1, 26.72, 27.34, 27.96, 28.58], "cue": {"p": 57, "r": "ex3", "reveal": true}, "lens": {"k": "rhy", "beats": [[25.45, "X", "1", 0.0], [26.07, "x", "2", 1.0], [26.69, "x", "3", 2.0], [27.31, "X", "1", 3.0], [27.93, "x", "2", 4.0], [28.55, "x", "3", 5.0]], "ands": [], "notes": [[25.45, 0.0, 3.0, 0, 0], [27.31, 3.0, 2.0, 0, 1], [28.55, 5.0, 1.0, 0, 0]], "bars": [0.0, 3.0], "n": 6.0, "at": [25.45, 26.07, 26.69, 27.31, 27.93, 28.55], "full": true}}, {"t0": 30.2, "t1": 34.84, "who": "B", "text": "Both last three beats. But only the tie could cross a bar line.", "cue": {"p": 57, "r": "ex3", "reveal": true}}]}, {"t": "Example: which is longer?", "f": "audio/T3/09-example-which-is-longer.mp3", "s": 23, "p": 57, "l": [{"t0": 0.57, "t1": 6.4, "who": "B", "text": "A dotted minim, or a minim tied to a quaver? Count the pizzas. Pause and try.", "cue": {"p": 58, "r": "ex4"}}, {"t0": 6.4, "t1": 10.4, "who": "pause", "text": "Pause and try.", "cue": {"p": 58, "r": "ex4"}}, {"t0": 10.4, "t1": 16.07, "who": "P", "text": "Three against two and a half. The dotted minim is longer, by half a beat.", "cue": {"p": 58, "r": "ex4", "reveal": true}}, {"t0": 16.07, "t1": 19.55, "who": "piano", "notes": [16.07, 16.38, 16.69, 17.0, 17.31, 17.62, 17.93, 18.24], "cue": {"p": 58, "r": "ex4", "reveal": true}, "lens": {"k": "rhy", "beats": [[16.04, "X", "1", 0.0], [16.66, "x", "2", 1.0], [17.28, "M", "3", 2.0], [17.9, "x", "4", 3.0]], "ands": [[16.35, 0.5, "&"], [16.97, 1.5, "&"], [17.59, 2.5, "&"], [18.21, 3.5, "&"]], "notes": [[16.04, 0.0, 3.0, 0, 0], [17.9, 3.0, 1. 9, "x", "2", 1.0], [18.01, "X", "1", 2.0], [18.63, "x", "2", 3.0]], "ands": [[17.08, 0.5, "&"], [17.7, 1.5, "&"], [18.32, 2.5, "&"], [18.94, 3.5, "&"]], "notes": [[16.77, 0.0, 0.5, 0, 0], [17.08, 0.5, 1.0, 0, 0], [17.7, 1.5, 0.5, 0, 0], [18.01, 2.0, 1.0, 0, 0], [18.63, 3.0, 1.0, 0, 0]], "bars": [0.0, 2.0], "n": 4.0, "at": [16.77, 17.39, 18.01, 18.63], "full": true}}, {"t0": 20.28, "t1": 28.2, "who": "B", "text": "The Entertainer, by Scott Joplin: the high C keeps landing just after the beat. That is the bounce of ragtime.", "cue": {"p": 69, "r": "xlate2"}}, {"t0": 28.2, "t1": 37.04, "who": "B", "text": "To feel it, tap a steady beat with your foot, and clap only between the taps. If your foot starts to follow your hands, slow down.", "cue": {"p": 69, "r": "howto"}}]}, {"t": "Hemiola", "f": "audio/T7/04-hemiola.mp3", "s": 19, "p": 69, "l": [{"t0": 0.57, "t1": 11.61, "who": "B", "text": "Hemiola: two bars of three-four felt as three big beats. Count as written, one two three, one two three. Now feel each minim as one big beat. How many?", "cue": {"p": 70, "r": "xlate"}}, {"t0": 11.61, "t1": 16.33, "who": "piano", "notes": [11.61, 12.23, 12.85, 13.47, 14.09, 14.71], "cue": {"p": 70, "r": "xlate"}, "lens": {"k": "rhy", "beats": [[11.58, "X", "1", 0.0], [12.2, "x", "2", 1.0], [12.82, "x", "3", 2.0], [13.44, "X", "1", 3.0], [14.06, "x", "2", 4.0], [14.68, "x", "3", 5.0]], "ands": [], "notes": [[11.58, 0.0, 2.0, 0, 0], [12.82, 2.0, 2.0, 0, 0], [14.06, 4.0, 2.0, 0, 0]], "bars": [0.0, 3.0], "n": 6.0, "at": [11.58, 12.2, 12.82, 13.44, 14.06, 14.68], "full": true}}, {"t0": 16.33, "t1": 19.35, "who": "P", "text": "Three big ones!", "cue": {"p": 70, "r": "xlate", "reveal": true}}]}, {"t": "Polyrhythm and rubato", "f": "audio/T7/05-polyrhythm-and-rubato.mp3", "s": 30, "p": 70, "l": [{"t0": 0.57, "t1": 11.67, "who": "B", "text": "Going further: polyrhythm is two rhythms at once, three against two. And rubato stretches the time, then gives it back. Whatever you borrow, you pay back  second time bars: the first time, play bar one; after the repeat, skip it and play bar two. D.C., da capo, from the head: back to the very beginning. D.S., dal segno: back to the sign. Fine: the end. And Coda, the tail: at To Coda, jump to the coda sign.", "cue": {"p": 71, "r": "ht"}, "hits": [[11.31, "#3", 152, 153, "ht"]]}, {"t0": 23.21, "t1": 31.18, "who": "B", "text": "The rule: follow the map in order. After a jump, stop at the first ⟨Fine⟩ you meet, or jump at To ⟨Coda⟩.", "cue": {"p": 71, "r": "rule"}}]}, {"t": "Example: one repeat sign", "f": "audio/T8/03-example-one-repeat-sign.mp3", "s": 16, "p": 72, "l": [{"t0": 0.57, "t1": 7.36, "who": "B", "text": "B ends with a repeat sign, and there is no start sign. In what order do you play? Pause and try.", "cue": {"p": 72, "r": "ex1"}}, {"t0": 7.36, "t1": 11.36, "who": "pause", "text": "Pause and try.", "cue": {"p": 72, "r": "ex1"}}, {"t0": 11.36, "t1": 15.71, "who": "P", "text": "Back to the very start: A, B, A, B, C.", "cue": {"p": 72, "r": "ex1", "reveal": true}}]}, {"t": "Example: first and second time", "f": "audio/T8/04-example-first-and-second-time.mp3", "s": 16, "p": 72, "l": [{"t0": 0.57, "t1": 8.0, "who": "B", "text": "First time: A, then the bar marked one. The repeat sends you back to A. Second time, which bar do you skip?", "cue": {"p": 72, "r": "ex2"}}, {"t0": 8.0, "t1": 12.0, "who": "pause", "text": "Pause and try.", "cue": {"p": 72, "r": "ex2"}}, {"t0": 12.0, "t1": 15.52, "who": "P", "text": "Skip B: A, B, A, C.", "cue": {"p": 72, "r": "ex2", "reveal": true}}]}, {"t": "Game: how many bars?", "f": "audio/T8/05-game-how-many-bars.mp3", "s": 17, "p": 72, "l": [{"t0": 0.57, "t1": 7.62, "who": "B", "text": "A quick game: each letter is one bar. Follow the signs and count every bar you play. Pause and count.", "cue": {"p": 72, "r": "game"}}, {"t0": 7.62, "t1": 13.62, "who": "pause", "text": "Pause and try.", "cue": {"p": 72, "r": "game"}}, {"t0": 13.62, "t1": 16.83, "who": "P", "text": "Four, six and five!", "cue": {"p": 72, "r": "game", "reveal": true}}]}, {"t": "Example: D.C. al Fine", "f": "audio/T8/06-example-d-c-al-fine.mp3", "s": 15, "p": 72, "l": [{"t0": 0.57, "t1": 6.06, "who": "B", "text": "Play straight through to D. D.C. sends you back to the head. Where do you stop?", "cue": {"p": 73, "r": "ex3"}}, {"t0": 6.06, "t1": 10.06, "who": "pause", "text": "Pause and try.", "cue": {"p": 73, "r": "ex3"}}, {"t0": 10.06, "t1": 14.9, "who": "P", "text": "At ⟨Fine⟩: A, B, C, D, A, B.", "cue": {"p": 73, "r": "ex3", "reveal": true}}]}, {"t": "Example: D.S. al Coda", "f": "audio/T8/07-example-d-s-al-coda.mp3", "s": 42, "p": 73, "l": [{"t0": 0.57, "t1": 10.37, "who": "B", "text": "Play through to D, ignoring To Coda the first time. D.S. sends you back to the sign. Then play on to To Coda, and jump. Pause and try.", "cue": {"p": 73, "r": "ex4"}}, {"t0": 10.37, "t1": 15.37, "who": "pause", "text": "Pause and try.", "cue": {"p": 73, "r": "ex4"}}, {"t0": 15.37, "t1": 19.74, "who": "P", "text": "A, B, C, D, then B, C, and jump to E!", "cue": {"p": 73, "r": "ex4", "reveal": true}}, {"t0": 19.74, "t1": 27.28, "who": "Q", "text": "Splendid. And on the way back after a D.C., Clara, one does not take the repeats again, unless the music says so.", "cue": {"p": 73, "r": "watch"}}, {"t0": 27.28, "t1": 34.2, "who": "B", "text": "Next lesson, follow the road signs in one of your pieces and tell your teacher the order of the bars.", "cue": {"p": 73, "r": "watch"}}, {"t0": 34.2, "t1": 35.44, "who": "P", "text": "I will!", "cue": {"p": 73, "r": "watch"}}, {"t0": 35.44, "t1": 37.76, "who": "B", "text": "Until next time, Clara.", "cue": {"p": 73, "r": "watch"}}, {"t0": 37.76, "t1": 42.41, "who": "P", "text": "Goodbye!", "cue": {"p": 73, "r": "watch"}}]}]}, {"k": "TT", "part": "Part II · Time", "t": "Tips: when the rhythm slips", "pages": [74]}, {"k": "EO", "part": "Part III · Expression", "t": "Opening map", "pages": [75]}, {"k": "E1", "part": "Part III · Expression", "t": "1 · Loud and soft", "pages": [76, 77, 78], "clips": [{"t": "Loud and soft", "f": "audio/E1/01-loud-and-soft.mp3", "s": 48, "p": 76, "l": [{"t0": 3.6, "t1": 8.26, "who": "P", "text": "At the library I have to whisper, and at the park I can shout as loud as I like.", "cue": {"p": 76, "r": "lead"}}, {"t0": 8.26, "t1": 13.05, "who": "B", "text": "Quite right, and you choose without thinking. Music asks you to choose too.", "cue": {"p": 76, "r": "lead"}}, {"t0": 13.05, "t1": 14.83, "who": "P", "text": "Can music whisper?", "cue": {"p": 76, "r": "lead"}}, {"t0": 14.83, "t1": 24.22, "who": "B", "text": "It can whisper, chat or shout, Clara. Small Italian words tell you which: the dynamics. Six steps, from very soft to very loud.", "cue": {"p": 76, "r": "hero"}}, {"t0": 24.22, "t1": 36.05, "who": "B", "text": "Pianissimo, very soft. ⟨Piano⟩, soft. Mezzo-piano, half soft. Mezzo-forte, half loud. ⟨Forte⟩, loud. Fortissimo, very loud.", "cue": {"p": 76, "r": "hero"}}, {"t0": 36.05, "t1": 40.07, "who": "piano", "notes": [36.05, 36.67, 37.29, 37.91, 38.53, 39.15], "cue": {"p": 76, "r": "hero"}}, {"t0": 40.07, "t1": 47.98, "who": "B", "text": "P is soft, f is loud, and m, mezzo, means half. And a sign lasts until the next one arrives.", "cue": {"p": 76, "r": "xlate"}}]}, {"t": "Example: mp or mf?", "f": "audio/E1/02-example-mp-or-mf.mp3", "s": 27, "p": 77, "l": [{"t0": 0.57, "t1": 4.61, "who": "B", "text": "Which is louder: mp or mf? Pause and think.", "cue": {"p": 76, "r": "ex1"}}, {"t0": 4.61, "t1": 7.61, "who": "pause", "text": "Pause and try.", "cue": {"p": 76, "r": "ex1"}}, {"t0": 7.61, "t1": 12.82, "who": "P", "text": "Mezzo-piano? Mezzo sounds big and loud.", "cue": {"p": 76, "r": "ex1", "oops": true}}, {"t0": 12.82, "t1": 18.25, "who": "B", "text": "It does sound grand, but mezzo only means half. Half of what?", "cue": {"p": 76, "r": "ex1"}}, {"t0": 18.25, "t1": 23.65, "who": "P", "text": "Mezzo-forte, half loud. It is louder than half soft.", "cue": {"p": 76, "r": "ex1", "reveal": true}}, {"t0": 23.65, "t1": 26.68, "who": "piano", "notes": [23.65, 24.27, 25.14, 25.76], "cue": {"p": 76, "r": "ex1", "reveal": true}}]}, {"t": "Growing and fading", "f": "audio/E1/03-growing-and-fading.mp3", "s": 29, "p": 77, "l": [{"t0": 0.57, "t1": 12.27, "who": "B", "text": "Music can also change little by little. Crescendo: getting louder. Diminuendo: getting softer. Written as a word, or as a hairpin that opens or closes.", "cue": {"p": 76, "r": "xlate2"}}, {"t0": 12.27, "t1": 18.77, "who": "piano", "notes": [12.27, 12.89, 13.51, 14.13, 14.75, 15.37, 15.99, 16.61, 17.23], "cue": {"p": 76, "r": "xlate2"}}, {"t0": 18.77, "t1": 29.11, "who": "B", "text": "Sforzando: one note made suddenly strong. Forte-piano: loud, then soft at once. See them as shapes: up, down, a spike, and a drop.", "cue": {"p": 77, "r": "xlate"}}]}, {"t": "Example: sfz or fp?", "f": "audio/E1/04-example-sfz-or-fp.mp3", "s": 27, "p": 77, "l": [{"t0": 0.57, "t1": 8.34, "who": "B", "text": "Two tunes. One has a sudden strong note, the other is loud then soft at once. Which is which? Pause and look.", "cue": {"p": 77, "r": "ex2"}}, {"t0": 8.34, "t1": 12.34, "who": "pause", "text": "Pause and try.", "cue": {"p": 77, "r": "ex2"}}, {"t0": 12.34, "t1": 20.35, "who": "P", "text": "A is sforzando: one strong note. B is forte-piano: loud, then soft.", "cue": {"p": 77, "r": "ex2", "reveal": true}}, {"t0": 20.35, "t1": 27.1, "who": "piano", "notes": [20.35, 20.97, 21.59, 22.21, 22.83, 24.32, 24.94, 25.56], "cue": {"p": 77, "r": "ex2", "reveal": true}}]}, {"t": "Example: the hairpins", "f": "audio/E1/05-example-the-hairpins.mp3", "s": 20, "p": 77, "l": [{"t0": 0.57, "t1": 4.5, "who": "B", "text": "Follow the hairpins. Where does it start, and what happens?", "cue": {"p": 77, "r": "ex3"}}, {"t0": 4.5, "t1": 7.5, "who": "pause", "text": "Pause and try.", "cue": {"p": 77, "r": "ex3"}}, {"t0": 7.5, "t1": 14.33, "who": "P", "text": "It starts ⟨piano⟩, grows into ⟨forte⟩, then fades.", "cue": {"p": 77, "r": "ex3", "reveal": true}}, {"t0": 14.33, "t1": 19.84, "who": "piano", "notes": [14.33, 14.95, 15.57, 16.19, 17.06, 17.68, 18.3], "cue": {"p": 77, "r": "ex3", "reveal": true}}]}, {"t": "Example: the loudest note", "f": "audio/E1/06-example-the-loudest-note.mp3", "s": 17, "p": 77, "l": [{"t0": 0.57, "t1": 6.21, "who": "B", "text": "Now find the loudest note. Start mezzo-piano and follow the hairpin.", "cue": {"p": 78, "r": "ex4"}}, {"t0": 6.21, "t1": 10.21, "who": "pause", "text": "Pause and try.", "cue": {"p": 78, "r": "ex4"}}, {"t0": 10.21, "t1": 17.08, "who": "P", "text": "The first A in bar two, at ⟨forte⟩. Then it fades all the way to ⟨piano⟩.", "cue": {"p": 78, "r": "ex4", "reveal": true}}]}, {"t": "Try it", "f": "audio/E1/07-try-it.mp3", "s": 56, "p": 78, "l": [{"t0": 0.57, "t1": 10.77, "who": "B", "text": "Try it: play Middle C six ways, from pianissimo to fortissimo. Use the weight of your arm, not by hitting harder. Then come back down.", "cue": {"p": 78, "r": "try10"}}, {"t0": 10.77, "t1": 18.14, "who": "piano", "notes": [10.77, 11.39, 12.01, 12.63, 13.25, 13.87, 14.74, 15.36, 15.98, 16.6, 17.22], "cue": {"p": 78, "r": "try10"}}, {"t0": 18.14, "t1": 30.35, "who": "B", "text": "Haydn wrote a famous joke. The tune tiptoes along softly, comes again even softer, and then the whole orchestra crashes in with one fortissimo chord. The Surprise Symphony.", "cue": {"p": 78, "r": "yk"}}, {"t0": 30.35, "t1": 36.07, "who": "piano", "notes": [30.35, 30.66, 30.97, 31.28, 31.59, 31.9, 32.21, 33.08, 33.39, 33.7, 34.01, 34.32], "cue": {"p": 78, "r": "yk"}}, {"t0": 36.07, "t1": 37.42, "who": "P", "text": "I jumped!", "cue": {"p": 78, "r": "yk"}}, {"t0": 37.42, "t1": 45.69, "who": "B", "text": "Next lesson, play one tune pianissimo and then fortissimo. Ask your teacher which they liked better.", "cue": {"p": 78, "r": "watch"}}, {"t0": 45.69, "t1": 46.94, "who": "P", "text": "I will!", "cue": {"p": 78, "r": "watch"}}, {"t0": 46.94, "t1": 51.62, "who": "B", "text": "And remember: louder is not faster. Until next time, Clara.", "cue": {"p": 78, "r": "watch"}}, {"t0": 51.62, "t1": 56.28, "who": "P", "text": "Goodbye!", "cue": {"p": 78, "r": "watch"}}]}]}, {"k": "E2", "part": "Part III · Expression", "t": "2 · Touch: smooth, short, strong", "pages": [79, 80, 81], "clips": [{"t": "Touch: smooth, short, strong", "f": "audio/E2/01-touch-smooth-short-strong.mp3", "s": 52, "p": 79, "l": [{"t0": 3.6, "t1": 8.49, "who": "P", "text": "This morning I tiptoed past my sleeping brother, then stamped all the way up the stairs.", "cue": {"p": 79, "r": "lead"}}, {"t0": 8.49, "t1": 13.62, "who": "B", "text": "Same feet, two different touches. Your fingers can do the same on the keys.", "cue": {"p": 79, "r": "lead"}}, {"t0": 13.62, "t1": 16.06, "who": "P", "text": "Can the same notes sound different?", "cue": {"p": 79, "r": "lead"}}, {"t0": 16.06, "t1": 23.78, "who": "B", "text": "Completely different, Clara. Small marks tell your fingers how to touch the keys. A curve: join them, legato.", "cue": {"p": 79, "r": "hero"}}, {"t0": 23.78, "t1": 26.87, "who": "piano", "notes": [23.78, 24.4, 25.02, 25.64], "cue": {"p": 79, "r": "hero"}}, {"t0": 26.87, "t1": 30.06, "who": "B", "text": "Dots: short and detached, staccato.", "cue": {"p": 79, "r": "hero"}}, {"t0": 30.06, "t1": 32.84, "who": "piano", "notes": [30.06, 30.68, 31.3, 31.92], "cue": {"p": 79, "r": "hero"}}, {"t0": 32.84, "t1": 39.98, "who": "B", "text": "Lines: hold the full length, leaning a little, tenuto. And arrows: a stronger start, the accent.", "cue": {"p": 79, "r": "hero"}}, {"t0": 39.98, "t1": 45.49, "who": "piano", "notes": [39.98, 40.6, 41.22, 41.84, 42.71, 43.33, 43.95, 44.57], "cue": {"p": 79, "r": "hero"}}, {"t0": 45.49, "t1": 51.53, "who": "B", "text": "The secret in four words: curve, join. Dot, short. Line, hold. Arrow, strong.", "cue": {"p": 79, "r": "secret"}}]}, {"t": "Example: line, dot or arrow?", "f": "audio/E2/02-example-line-dot-or-arrow.mp3", "s": 22, "p": 80, "l": [{"t0": 0.57, "t1": 7.34, "who": "B", "text": "Read the marks. How long are the first two Cs, the Gs, and the E with the arrow? Pause and think.", "cue": {"p": 80, "r": "ex1"}}, {"t0": 7.34, "t1": 11.34, "who": "pause", "text": "Pause and try.", "cue": {"p": 80, "r": "ex1"}}, {"t0": 11.34, "t1": 16.24, "who": "P", "text": "The Cs held their full length, the Gs short, the E strong.", "cue": {"p": 80, "r": "ex1", "reveal": true}}, {"t0": 16.24, "t1": 21.75, "who": "piano", "notes": [16.24, 16.86, 17.48, 18.1, 18.97, 20.21], "cue": {"p": 80, "r": "ex1", "reveal": true}}]}, {"t": "Slurs and phrases", "f": "audio/E2/03-slurs-and-phrases.mp3", "s": 29, "p": 80, "l": [{"t0": 0.57, "t1": 11.5, "who": "B", "text": "A curve over different notes is a slur: join them, then lift at its end, like a breath. A long slur over a whole line is a phrase: one musical sentence.", "cue": {"p": 80, "r": "xlate"}}, {"t0": 11.5, "t1": 18.85, "who": "B", "text": "Ode to Joy has two long phrases. Lift your hand only at the end of each, like a singer taking a breath.", "cue": {"p": 80, "r": "xlate"}}, {"t0": 18.85, "t1": 29.32, "who": "piano", "notes": [18.85, 19.47, 20.09, 20.71, 21.33, 21.95, 22.57, 23.19, 24.06, 24.68, 25.3, 25.92, 26.54, 27.16, 27.78], "cue": {"p": 80, "r": "xlate"}}]}, {"t": "Example: which notes are short?", "f": "audio/E2/04-example-which-notes-are-short.mp3", "s": 21, "p": 80, "l": [{"t0": 0.57, "t1": 6.19, "who": "B", "text": "Bar one has a curve. Bar two has dots, and one other mark. Which notes are short?", "cue": {"p": 80, "r": "ex2"}}, {"t0": 6.19, "t1": 10.19, "who": "pause", "text": "Pause and try.", "cue": {"p": 80, "r": "ex2"}}, {"t0": 10.19, "t1": 15.97, "who": "P", "text": "The two dotted Gs. The third G has an accent: strong, but full length.", "cue": {"p": 80, "r": "ex2", "reveal": true}}, {"t0": 15.97, "t1": 21.48, "who": "piano", "notes": [15.97, 16.59, 17.21, 17.83, 18.7, 19.32, 19.94, 20.56], "cue": {"p": 80, "r": "ex2", "reveal": true}}]}, {"t": "Two-note slurs", "f": "audio/E2/05-two-note-slurs.mp3", "s": 46, "p": 81, "l": [{"t0": 0.57, "t1": 9.35, "who": "B", "text": "A slur over just two notes is a little sigh: drop into the first, then lift off the second, lighter and shorter. Drop, lift.", "cue": {"p": 81, "r": "xlate"}}, {"t0": 9.35, "t1": 13.87, "who": "piano", "notes": [9.35, 9.97, 10.84, 11.46, 12.33, 12.95], "cue": {"p": 81, "r": "xlate"}}, {"t0": 13.87, "t1": 24.09, "who": "B", "text": "And some words describe the mood: dolce, sweetly. Cantabile, singing. Leggiero, lightly. Maestoso, majestically.", "cue": {"p": 81, "r": "xlate2"}}, {"t0": 24.09, "t1": 30.65, "who": "B", "text": "Next lesson, play the same bar legato and then staccato for your teacher.", "cue": {"p": 81, "r": "think"}}, {"t0": 30.65, "t1": 31.89, "who": "P", "text": "I will!", "cue": {"p": 81, "r": "think"}}, {"t0": 31.89, "t1": 41.34, "who": "B", "text": "Legato is walking: one foot leaves the ground as the other lands. Staccato is hopping on hot sand. Until next time, Clara.", "cue": {"p": 81, "r": "think"}}, {"t0": 41.34, "t1": 45.99, "who": "P", "text": "Goodbye!", "cue": {"p": 81, "r": "think"}}]}]}, {"k": "E3", "part": "Part III · Expression", "t": "3 · Speed words", "pages": [82, 83, 84], "clips": [{"t": "Speed words", "f": "audio/E3/01-speed-words.mp3", "s": 49, "p": 82, "l": [{"t0": 3.6, "t1": 7.15, "who": "P", "text": "When I am late for school I run, and on Sundays I stroll.", "cue": {"p": 82, "r": "lead"}}, {"t0": 7.15, "t1": 12.11, "who": "B", "text": "Then you already know about tempo, Clara: the same walk at different speeds.", "cue": {"p": 82, "r": "lead"}}, {"t0": 12.11, "t1": 14.4, "who": "P", "text": "How do I know how fast to play?", "cue": {"p": 82, "r": "lead"}}, {"t0": 14.4, "t1": 31.33, "who": "B", "text": "A word at the top of the music tells you, Clara, usually in Italian. Largo is very slow. Adagio, slow. Andante, a walking pace. Moderato, moderate. Allegro, fast and lively. Presto, very fast.", "cue": {"p": 82, "r": "hero"}, "hits": [[20.24, "#0", 69, 74, "hero"], [21.97, "#1", 89, 95, "hero"], [23.17, "#2", 103, 110, "hero"], [25.33, "#3", 128, 136, "hero"], [27.06, "#4", 148, 155, "hero"], [29.31, "#5", 174, 180, "hero"]]}, {"t0": 31.33, "t1": 36.33, "who": "piano", "notes": [31.33, 32.33, 33.33, 34.33], "cue": {"p": 82, "r": "hero"}}, {"t0": 36.33, "t1": 39.94, "who": "piano", "notes": [36.33, 36.99, 37.64, 38.29], "cue": {"p": 82, "r": "hero"}}, {"t0": 39.94, "t1": 42.68, "who": "piano", "notes": [39.94, 40.38, 40.81, 41.25], "cue": {"p": 82, "r": "hero"}}, {"t0": 42.68, "t1": 48.71, "who": "B", "text": "Adagio, Andante, Allegro. The numbers in the table are only a rough guide.", "cue": {"p": 82, "r": "xlate"}, "hits": [[42.56, "#1", 0, 6, "hero"], [43.17, "#2", 8, 15, "hero"], [43.86, "#4", 17, 24, "hero"]]}]}, {"t": "The metronome mark", "f": "audio/E3/02-the-metronome-mark.mp3", "s": 12, "p": 83, "l": [{"t0": 0.57, "t1": 11.5, "who": "B", "text": "Often there is a number too. Crotchet equals seventy-six means seventy-six beats in one minute. Set a metronome to seventy-six: each click is one beat.", "cue": {"p": 83, "r": "xlate"}}]}, {"t": "Example: crotchet equals sixty", "f": "audio/E3/03-example-crotchet-equals-sixty.mp3", "s": 27, "p": 83, "l": [{"t0": 0.57, "t1": 4.76, "who": "B", "text": "How fast is crotchet equals sixty? Pause and think.", "cue": {"p": 83, "r": "ex1"}}, {"t0": 4.76, "t1": 7.76, "who": "pause", "text": "Pause and try.", "cue": {"p": 83, "r": "ex1"}}, {"t0": 7.76, "t1": 11.74, "who": "P", "text": "Sixty beats! That must be very fast.", "cue": {"p": 83, "r": "ex1", "oops": true}}, {"t0": 11.74, "t1": 16.23, "who": "B", "text": "Sixty in a whole minute, Clara. How many seconds are there in a minute?", "cue": {"p": 83, "r": "ex1"}}, {"t0": 16.23, "t1": 22.16, "who": "P", "text": "Sixty beats in a minute, and a minute has sixty seconds. One beat every second!", "cue": {"p": 83, "r": "ex1", "reveal": true}}, {"t0": 22.16, "t1": 27.16, "who": "piano", "notes": [22.16, 23.16, 24.16, 25.16], "cue": {"p": 83, "r": "ex1", "reveal": true}}]}, {"t": "Changing speed", "f": "audio/E3/04-changing-speed.mp3", "s": 24, "p": 83, "l": [{"t0": 0.57, "t1": 17.51, "who": "B", "text": "Words inside the music change the speed. Ritardando: gradually slower, the beats further apart. Accelerando: gradually faster. A tempo: back to the speed before. And the fermata, the pause: hold longer than written.", "cue": {"p": 83, "r": "xlate2"}}, {"t0": 17.51, "t1": 24.09, "who": "piano", "notes": [17.51, 18.11, 18.74, 19.41, 20.14, 20.97, 21.94], "cue": {"p": 83, "r": "xlate2"}}]}, {"t": "Example: rall. and a tempo", "f": "audio/E3/05-example-rall-and-a-tempo.mp3", "s": 14, "p": 83, "l": [{"t0": 0.57, "t1": 3.97, "who": "B", "text": "Where does it slow down, and where does it come back?", "cue": {"p": 84, "r": "ex2"}}, {"t0": 3.97, "t1": 6.97, "who": "pause", "text": "Pause and try.", "cue": {"p": 84, "r": "ex2"}}, {"t0": 6.97, "t1": 14.24, "who": "P", "text": "Bar one slows into the two Gs. At a tempo the first speed comes straight back.", "cue": {"p": 84, "r": "ex2", "reveal": true}}]}, {"t": "Example: the fermata", "f": "audio/E3/06-example-the-fermata.mp3", "s": 44, "p": 84, "l": [{"t0": 0.57, "t1": 4.25, "who": "B", "text": "How long do you hold the minim with the fermata?", "cue": {"p": 84, "r": "ex3"}}, {"t0": 4.25, "t1": 7.25, "who": "pause", "text": "Pause and try.", "cue": {"p": 84, "r": "ex3"}}, {"t0": 7.25, "t1": 12.21, "who": "P", "text": "Longer than two beats, until it feels finished. Then go on.", "cue": {"p": 84, "r": "ex3", "reveal": true}}, {"t0": 12.21, "t1": 18.96, "who": "B", "text": "Like the deep breath before you blow out your birthday candles: everyone waits, and then the moment comes.", "cue": {"p": 84, "r": "ex3", "reveal": true}}, {"t0": 18.96, "t1": 24.37, "who": "B", "text": "At your next lesson, find the speed word at the top of your piece. What does it say?", "cue": {"p": 84, "r": "yk"}}, {"t0": 24.37, "t1": 25.62, "who": "P", "text": "I will!", "cue": {"p": 84, "r": "yk"}}, {"t0": 25.62, "t1": 39.3, "who": "B", "text": "Players often slow down into the end of Twinkle, Twinkle, then wait on the last note. A rit. is a car braking gently at the lights; a tempo is driving off again. Until next time, Clara.", "cue": {"p": 84, "r": "yk"}}, {"t0": 39.3, "t1": 43.95, "who": "P", "text": "Goodbye!", "cue": {"p": 84, "r": "yk"}}]}]}, {"k": "E4", "part": "Part III · Expression", "t": "4 · The pedals", "pages": [85, 86, 87], "clips": [{"t": "The pedals", "f": "audio/E4/01-the-pedals.mp3", "s": 47, "p": 85, "l": [{"t0": 3.6, "t1": 8.11, "who": "P", "text": "When I clap in the big school hall, the sound keeps going after my hands stop.", "cue": {"p": 85, "r": "lead"}}, {"t0": 8.11, "t1": 12.17, "who": "B", "text": "A piano can do that too, with a little help from your foot.", "cue": {"p": 85, "r": "lead"}}, {"t0": 12.17, "t1": 13.93, "who": "P", "text": "What are the pedals for?", "cue": {"p": 85, "r": "lead"}}, {"t0": 13.93, "t1": 25.35, "who": "B", "text": "Most pianos have three, Clara. The left one, the soft pedal, makes the sound gentler. The right one, the sustain pedal, keeps the notes ringing after your fingers let go.", "cue": {"p": 85, "r": "hero"}}, {"t0": 25.35, "t1": 37.71, "who": "B", "text": "Inside the piano, each string has a felt damper resting on it. Let go of a key and the damper stops the string. The sustain pedal lifts every damper at once, so the strings ring on.", "cue": {"p": 85, "r": "xlate"}}, {"t0": 37.71, "t1": 39.46, "who": "piano", "notes": [37.71], "cue": {"p": 85, "r": "xlate"}}, {"t0": 39.46, "t1": 47.37, "who": "B", "text": "The soft pedal is written u.c., una corda, and let up at t.c. The sustain pedal is written Ped.", "cue": {"p": 85, "r": "xlate2"}}]}, {"t": "Example: which pedal?", "f": "audio/E4/02-example-which-pedal.mp3", "s": 26, "p": 86, "l": [{"t0": 0.57, "t1": 6.38, "who": "B", "text": "Which pedal is Ped.? Which is u.c.? And what does t.c. ask? Pause and think.", "cue": {"p": 86, "r": "ex1"}}, {"t0": 6.38, "t1": 10.38, "who": "pause", "text": "Pause and try.", "cue": {"p": 86, "r": "ex1"}}, {"t0": 10.38, "t1": 13.73, "who": "P", "text": "Ped. is the soft pedal?", "cue": {"p": 86, "r": "ex1", "oops": true}}, {"t0": 13.73, "t1": 19.81, "who": "B", "text": "Not quite. The soft pedal is the left one, written u.c. Ped. keeps the notes ringing.", "cue": {"p": 86, "r": "ex1"}}, {"t0": 19.81, "t1": 25.95, "who": "P", "text": "Ped. is the right pedal, u.c. the left, and t.c. means let the left pedal up.", "cue": {"p": 86, "r": "ex1", "reveal": true}}]}, {"t": "Writing the sustain pedal", "f": "audio/E4/03-writing-the-sustain-pedal.mp3", "s": 12, "p": 86, "l": [{"t0": 0.57, "t1": 11.59, "who": "B", "text": "Down at Ped., up at the star. Or a bracket: the notch is a quick change, up and down again. Heel on the floor, press with the ball of your foot. Play first, then pedal.", "cue": {"p": 86, "r": "xlate"}, "hits": [[0.96, "#0", 8, 12, "xlate"]]}]}, {"t": "Example: down and up", "f": "audio/E4/04-example-down-and-up.mp3", "s": 20, "p": 86, "l": [{"t0": 0.57, "t1": 5.57, "who": "B", "text": "Where does the pedal go down, where does it change, and where does it come up?", "cue": {"p": 86, "r": "ex2"}}, {"t0": 5.57, "t1": 9.57, "who": "pause", "text": "Pause and try.", "cue": {"p": 86, "r": "ex2"}}, {"t0": 9.57, "t1": 14.37, "who": "P", "text": "Down on the first C, changed at the F, and up at the end.", "cue": {"p": 86, "r": "ex2", "reveal": true}}, {"t0": 14.37, "t1": 19.88, "who": "piano", "notes": [14.37, 14.99, 15.61, 16.23, 17.1, 17.72, 18.34, 18.96], "cue": {"p": 86, "r": "ex2", "reveal": true}}]}, {"t": "Changing the pedal", "f": "audio/E4/05-changing-the-pedal.mp3", "s": 46, "p": 87, "l": [{"t0": 0.57, "t1": 9.73, "who": "B", "text": "At every new chord, change the pedal just after you play it: up, and straight down again. Each chord rings clean, and they still join.", "cue": {"p": 87, "r": "xlate"}}, {"t0": 9.73, "t1": 15.83, "who": "piano", "notes": [9.73, 11.18, 12.63, 14.08], "cue": {"p": 87, "r": "xlate"}}, {"t0": 15.83, "t1": 24.82, "who": "B", "text": "Try it: play C, E and G together, press the right pedal and take your hands off. The chord keeps sounding. Lift the pedal: silence.", "cue": {"p": 87, "r": "try10"}}, {"t0": 24.82, "t1": 31.08, "who": "B", "text": "Next lesson, ask your teacher to show you how the dampers lift when you press the right pedal.", "cue": {"p": 87, "r": "think"}}, {"t0": 31.08, "t1": 32.33, "who": "P", "text": "I will!", "cue": {"p": 87, "r": "think"}}, {"t0": 32.33, "t1": 41.7, "who": "B", "text": "The sustain pedal holds a door open: every note that walks in stays in the room until you let the door shut. Until next time, Clara.", "cue": {"p": 87, "r": "think"}}, {"t0": 41.7, "t1": 46.36, "who": "P", "text": "Goodbye!", "cue": {"p": 87, "r": "think"}}]}]}, {"k": "E5", "part": "Part III · Expression", "t": "5 · Ornaments", "pages": [88, 89, 90], "clips": [{"t": "Ornaments", "f": "audio/E5/01-ornaments.mp3", "s": 36, "p": 88, "l": [{"t0": 3.6, "t1": 8.77, "who": "P", "text": "Grandma puts sprinkles on top of my birthday cake. The cake is the same, but it sparkles.", "cue": {"p": 88, "r": "lead"}}, {"t0": 8.77, "t1": 12.02, "who": "B", "text": "Music has sprinkles too. Look at this one.", "cue": {"p": 88, "r": "lead"}}, {"t0": 12.02, "t1": 14.78, "who": "P", "text": "What is that little tr above the note?", "cue": {"p": 88, "r": "lead"}}, {"t0": 14.78, "t1": 22.05, "who": "B", "text": "A trill, Clara. An ornament: a small sign that stands for a quick burst of notes around the main note.", "cue": {"p": 88, "r": "hero"}}, {"t0": 22.05, "t1": 24.83, "who": "piano", "notes": [22.05, 22.2, 22.36, 22.51, 22.67, 22.82, 22.98, 23.13, 23.29], "cue": {"p": 88, "r": "hero"}}, {"t0": 24.83, "t1": 33.05, "who": "B", "text": "Ornaments borrow the notes next door, one letter up or down. On D, the note above is E and the note below is C.", "cue": {"p": 88, "r": "xlate"}, "hits": [[29.25, "#2", 64, 65, "xlate"], [30.74, "#3", 85, 86, "xlate"], [32.44, "#1", 109, 110, "xlate"]]}, {"t0": 33.05, "t1": 36.45, "who": "piano", "notes": [33.05, 33.67, 34.29, 34.91, 35.53], "cue": {"p": 88, "r": "xlate", "seq": ["main", "above", "main", "below", "main"]}}]}, {"t": "Written and played", "f": "audio/E5/02-written-and-played.mp3", "s": 21, "p": 89, "l": [{"t0": 0.57, "t1": 7.85, "who": "B", "text": "A trill goes back and forth with the note above. An upper mordent is one quick flick: note, above, note.", "cue": {"p": 88, "r": "xlate2"}}, {"t0": 7.85, "t1": 10.63, "who": "piano", "notes": [7.85, 8.01, 8.16, 9.09], "cue": {"p": 88, "r": "xlate2"}}, {"t0": 10.63, "t1": 16.55, "who": "B", "text": "A lower mordent uses the note below. And a turn goes above, note, below, note.", "cue": {"p": 89, "r": "xlate"}}, {"t0": 16.55, "t1": 20.82, "who": "piano", "notes": [16.55, 16.71, 16.86, 18.04, 18.2, 18.35, 18.51, 18.66, 19.28], "cue": {"p": 89, "r": "xlate"}}]}, {"t": "Example: a lower mordent on G", "f": "audio/E5/03-example-a-lower-mordent-on-g.mp3", "s": 23, "p": 89, "l": [{"t0": 0.57, "t1": 6.15, "who": "B", "text": "A lower mordent on G. Which next-door note does it borrow? Pause and think.", "cue": {"p": 89, "r": "ex1"}}, {"t0": 6.15, "t1": 9.15, "who": "pause", "text": "Pause and try.", "cue": {"p": 89, "r": "ex1"}}, {"t0": 9.15, "t1": 12.15, "who": "P", "text": "G, A, G!", "cue": {"p": 89, "r": "ex1", "oops": true}}, {"t0": 12.15, "t1": 17.45, "who": "B", "text": "That would be an upper mordent, with the note above. A lower mordent goes down.", "cue": {"p": 89, "r": "ex1"}}, {"t0": 17.45, "t1": 21.6, "who": "P", "text": "The note below G: F. G, F, G!", "cue": {"p": 89, "r": "ex1", "reveal": true}}, {"t0": 21.6, "t1": 23.14, "who": "piano", "notes": [21.6, 21.76, 21.91], "cue": {"p": 89, "r": "ex1", "reveal": true}}]}, {"t": "Example: the trill", "f": "audio/E5/04-example-the-trill.mp3", "s": 22, "p": 89, "l": [{"t0": 0.57, "t1": 4.93, "wh         const covers = exm ? reg.l.filter(L => !vis.has(L[0])).map(L => `<div class="cov" style="left:${L[1][0] * 100 - .3}%;top:${L[1][1] * 100 - .2}%;width:${L[1][2] * 100 + .6}%;height:${L[1][3] * 100 + .4}%"></div>`).join('') + (reg.r ? `<div class="cov res" style="left:${reg.r[0] * 100}%;top:${reg.r[1] * 100}%;width:${reg.r[2] * 100}%;height:${reg.r[3] * 100}%">Answer coming…</div>` : '') : '';
        ov.innerHTML = covers + `<div class="hl${/^ex/.test(c.r) ? ' fog' : ''}" style="left:${x * 100 - .6}%;top:${y * 100 - .4}%;width:${w * 100 + 1.2}%;height:${h * 100 + .8}%"></div>` +
          marks.map(m => findLab(reg, m)).filter(Boolean).map(L => `<div class="mk" style="left:${(L[1][0] + L[1][2] / 2) * 100}%;top:${(L[1][1] + L[1][3] / 2) * 100}%;width:${Math.max(3.2, L[1][2] * 100 + 2.4)}%"></div>`).join(''); }
    }
  } else if (!c || !follow) { stage.style.transform = ''; ov.innerHTML = ''; ov.dataset.k = ''; }
  requestAnimationFrame(tick);
}
audio.onplay = () => { requestAnimationFrame(tick); drawSide(); }; audio.onpause = () => { if (playing >= 0) drawSide(); };
audio.onended = () => { const c = CH[ci]; if (chain && playing + 1 < c.clips.length) play(playing + 1); else { playing = -1; drawSide(); clearFollow(); } };
function go(i, p = 0) { audio.pause(); playing = -1; if (typeof clearFollow === 'function') clearFollow(); ci = i; pi = p; sel.value = i; showPage(); drawSide(); history.replaceState(null, '', '#' + CH[i].k); window.scrollTo(0, 0); }
sel.onchange = () => go(+sel.value);
document.getElementById('prev').onclick = () => { if (pi > 0) { pi--; showPage(); } else if (ci > 0) go(ci - 1, CH[ci - 1].pages.length - 1); };
document.getElementById('next').onclick = () => { if (pi < CH[ci].pages.length - 1) { pi++; showPage(); } else if (ci < CH.length - 1) go(ci + 1); };
document.addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight') document.getElementById('next').click(); if (e.key === 'ArrowLeft') document.getElementById('prev').click(); });
const start = CH.findIndex(c => c.k === (location.hash.slice(1) || new URLSearchParams(location.search).get('ch') || 'P1'));
go(start >= 0 ? start : 0);
