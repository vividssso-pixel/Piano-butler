d back. Rondo: A B A C A, where A keeps coming home between new ideas. And variations: one tune, dressed differently each time.", "cue": {"p": 156, "r": "hero"}, "hits": [[26.49, "#12", 8, 9, "hero"], [26.63, "#2", 10, 11, "hero"], [28.39, "#6", 34, 35, "hero"], [28.53, "#2", 36, 37, "hero"], [28.68, "#6", 38, 39, "hero"], [30.88, "#6", 68, 69, "hero"], [31.02, "#2", 70, 71, "hero"], [31.17, "#6", 72, 73, "hero"], [31.31, "#11", 74, 75, "hero"], [31.46, "#12", 76, 77, "hero"], [32.12, "#12", 85, 86, "hero"]]}]}, {"t": "The maps", "f": "audio/F5/02-the-maps.mp3", "s": 53, "p": 157, "l": [{"t0": 0.2, "t1": 17.84, "who": "B", "text": "Binary is the shape of the old dances, like the Minuet in G: two halves, each repeated. Many short Romantic pieces are ternary. And hymns and folk songs are strophic: the same music for every verse. Pop songs go verse, chorus, verse, chorus.", "cue": {"p": 156, "r": "ht"}}, {"t0": 17.84, "t1": 25.64, "who": "B", "text": "And here is Mozart’s favourite trick: theme and variations, on the tune of Twinkle. First the plain theme.", "cue": {"p": 156, "r": "lis"}}, {"t0": 25.64, "t1": 35.86, "who": "piano", "notes": [25.64, 26.26, 26.88, 27.5, 28.12, 28.74, 29.36, 30.6, 31.22, 31.84, 32.46, 33.08, 33.7, 34.32], "cue": {"p": 156, "r": "lis"}}, {"t0": 35.86, "t1": 39.5, "who": "B", "text": "Then the same tune, dressed up in quick notes.", "cue": {"p": 156, "r": "lis"}}, {"t0": 39.5, "t1": 49.97, "who": "piano", "notes": [39.5, 39.66, 39.81, 39.97, 40.12, 40.28, 40.43, 40.59, 40.74, 40.9, 41.05, 41.21, 41.36, 41.52, 41.67, 41.83, 41.98, 42.14, 42.29, 42.45, 42.6, 42.76, 42.91, 43.07, 43.22, 43.38, 43.53, 43.69, 43.84, 44.0, 44.15, 44.31, 44.71, 44.87, 45.02, 45.18, 45.33, 45.49, 45.64, 45.8, 45.95, 46.11, 46.26, 46.42, 46.57, 46.73, 46.88, 47.04, 47.19, 47.35, 47.5, 47.66, 47.81, 47.97, 48.12, 48.28, 48.43], "cue": {"p": 156, "r": "lis"}}, {"t0": 49.97, "t1": 52.94, "who": "P", "text": "It’s Twinkle in a sparkly party dress!", "cue": {"p": 156, "r": "lis"}}]}, {"t": "Examples", "f": "audio/F5/03-examples.mp3", "s": 96, "p": 157, "l": [{"t0": 0.2, "t1": 6.79, "who": "B", "text": "Which letter makes it ternary? A B alone is two sections. Ternary goes out, away, and...?", "cue": {"p": 157, "r": "ex1"}}, {"t0": 6.79, "t1": 9.79, "who": "pause", "text": "Pause and try.", "cue": {"p": 157, "r": "ex1"}}, {"t0": 9.79, "t1": 12.15, "who": "P", "text": "And back! Section A again.", "cue": {"p": 157, "r": "ex1", "reveal": true}}, {"t0": 12.15, "t1": 16.71, "who": "B", "text": "Which form is A B A C A? Which one keeps coming back?", "cue": {"p": 157, "r": "ex2"}}, {"t0": 16.71, "t1": 19.71, "who": "pause", "text": "Pause and try.", "cue": {"p": 157, "r": "ex2"}}, {"t0": 19.71, "t1": 23.16, "who": "P", "text": "A comes back between two new ideas: a rondo!", "cue": {"p": 157, "r": "ex2", "reveal": true}}, {"t0": 23.16, "t1": 32.95, "who": "B", "text": "Now map Twinkle itself. Bars one to four: A. Bars five to eight: new or the same? And the last four bars repeat bars one to four.", "cue": {"p": 157, "r": "ex3"}}, {"t0": 32.95, "t1": 63.51, "who": "piano", "notes": [32.95, 33.57, 34.19, 34.81, 35.43, 36.05, 36.67, 37.91, 38.53, 39.15, 39.77, 40.39, 41.01, 41.63, 43.12, 43.74, 44.36, 44.98, 45.6, 46.22, 46.84, 48.08, 48.7, 49.32, 49.94, 50.56, 51.18, 51.8, 53.29, 53.91, 54.53, 55.15, 55.77, 56.39, 57.01, 58.25, 58.87, 59.49, 60.11, 60.73, 61.35, 61.97], "cue": {"p": 157, "r": "ex3"}}, {"t0": 63.51, "t1": 66.51, "who": "pause", "text": "Pause and try.", "cue": {"p": 157, "r": "ex3"}}, {"t0": 66.51, "t1": 70.62, "who": "P", "text": "Bars five to eight are new: B. Then A again. A B A: ternary!", "cue": {"p": 157, "r": "ex3", "reveal": true}}, {"t0": 70.62, "t1": 74.1, "who": "B", "text": "And what comes after A, A one, A two?", "cue": {"p": 158, "r": "ex4"}}, {"t0": 74.1, "t1": 77.1, "who": "pause", "text": "Pause and try.", "cue": {"p": 158, "r": "ex4"}}, {"t0": 77.1, "t1": 79.61, "who": "P", "text": "A three! The third variation.", "cue": {"p": 158, "r": "ex4", "reveal": true}}, {"t0": 79.61, "t1": 87.82, "who": "B", "text": "Game: name each map. Two letters, A, B. Then A, B, A. Then A, B, A, C, A. And A, A one, A two, A three.", "cue": {"p": 158, "r": "game"}}, {"t0": 87.82, "t1": 92.82, "who": "pause", "text": "Pause and try.", "cue": {"p": 158, "r": "game"}}, {"t0": 92.82, "t1": 96.44, "who": "P", "text": "Binary, ternary, rondo, and theme and variations.", "cue": {"p": 158, "r": "game", "reveal": true}}]}, {"t": "You know this", "f": "audio/F5/04-you-know-this.mp3", "s": 54, "p": 158, "l": [{"t0": 0.2, "t1": 8.3, "who": "B", "text": "A clever way to learn a piece: letter the sections in pencil, and learn A first. It comes back, so it pays twice.", "cue": {"p": 158, "r": "howto"}}, {"t0": 8.3, "t1": 20.61, "who": "B", "text": "Für Elise is a rondo. The famous opening tune is section A, and it is heard three times, with two new sections in between. Raise your hand every time A returns.", "cue": {"p": 158, "r": "yk"}, "hits": [[12.44, "#0", 57, 58, "yk"], [19.39, "#0", 150, 151, "yk"]]}, {"t0": 20.61, "t1": 31.89, "who": "piano", "notes": [20.61, 20.92, 21.23, 21.54, 21.85, 22.16, 22.47, 22.78, 23.09, 23.96, 24.27, 24.58, 24.89, 25.76, 26.07, 26.38, 26.69, 27.56, 27.87, 28.18, 28.49, 28.8, 29.11, 29.42, 29.73, 30.04, 30.35], "cue": {"p": 158, "r": "yk"}}, {"t0": 31.89, "t1": 33.93, "who": "P", "text": "Hand up! There it is!", "cue": {"p": 158, "r": "yk"}}, {"t0": 33.93, "t1": 39.92, "who": "B", "text": "Your little task for next time: give each phrase of a piece a letter, and name its form.", "cue": {"p": 158, "r": "watch"}}, {"t0": 39.92, "t1": 41.37, "who": "P", "text": "I will!", "cue": {"p": 158, "r": "watch"}}, {"t0": 41.37, "t1": 52.11, "who": "B", "text": "Two traps: don’t give every phrase a new letter, same music means same letter. And section A played twice is still section A. Until next time, Clara.", "cue": {"p": 158, "r": "watch"}}, {"t0": 52.11, "t1": 53.71, "who": "P", "text": "Bye, Butler!", "cue": {"p": 158, "r": "watch"}}]}]}, {"k": "F6", "part": "Part VII · Shape and style", "t": "6 · Styles through time", "pages": [159, 160], "clips": [{"t": "Styles through time", "f": "audio/F6/01-styles-through-time.mp3", "s": 98, "p": 159, "l": [{"t0": 3.4, "t1": 11.42, "who": "B", "text": "Clara, music changes with its time, like clothes and buildings. Four big periods cover most piano music.", "cue": {"p": 159, "r": "h:Styles through time"}}, {"t0": 11.42, "t1": 14.1, "who": "P", "text": "Like a fashion show through history!", "cue": {"p": 159, "r": "lead"}}, {"t0": 14.1, "t1": 21.97, "who": "B", "text": "Exactly that. Here is the secret: listen for the texture, the ornaments and the pedal. They tell you the century.", "cue": {"p": 159, "r": "secret"}}, {"t0": 21.97, "t1": 32.31, "who": "B", "text": "Baroque, from about sixteen hundred: Bach, Handel, Scarlatti. Harpsichord and organ, two tunes woven together, lots of ornaments, a steady beat.", "cue": {"p": 159, "r": "hero"}, "hits": [[21.85, "#0", 0, 7, "hero"]]}, {"t0": 32.31, "t1": 40.05, "who": "piano", "notes": [32.31, 32.93, 33.24, 33.55, 33.86, 34.17, 34.79, 35.41, 36.03, 36.65, 36.96, 37.27, 37.58, 37.89, 38.51, 39.13], "cue": {"p": 159, "r": "hero"}}, {"t0": 40.05, "t1": 50.65, "who": "B", "text": "Classical, from about seventeen fifty: Haydn, Mozart, Beethoven. The new piano, a clear tune over an Alberti bass, tidy four-bar phrases.", "cue": {"p": 159, "r": "hero"}, "hits": [[39.93, "#1", 0, 9, "hero"]]}, {"t0": 50.65, "t1": 56.16, "who": "piano", "notes": [50.65, 51.89, 52.51, 53.38, 54.31, 54.46, 54.62], "cue": {"p": 159, "r": "hero"}}, {"t0": 56.16, "t1": 66.09, "who": "B", "text": "Romantic, from about eighteen twenty: Chopin, Schumann, Liszt. Big feelings, rich chords in the pedal, time stretched with rubato.", "cue": {"p": 159, "r": "hero"}, "hits": [[56.04, "#2", 0, 8, "hero"]]}, {"t0": 66.09, "t1": 76.98, "who": "piano", "notes": [66.09, 67.54, 68.16, 69.4, 69.71, 70.02, 70.95, 71.51, 72.96, 74.2, 75.13, 75.44], "cue": {"p": 159, "r": "hero"}}, {"t0": 76.98, "t1": 85.13, "who": "B", "text": "And Modern, from nineteen hundred to today: Debussy, Bartók, jazz and film. New scales, surprising rhythms.", "cue": {"p": 159, "r": "hero"}, "hits": [[77.15, "#3", 4, 10, "hero"]]}, {"t0": 85.13, "t1": 90.44, "who": "piano", "notes": [85.13, 85.44, 85.75, 86.06, 86.37, 86.68, 86.99, 88.69], "cue": {"p": 159, "r": "hero"}}, {"t0": 90.44, "t1": 94.89, "who": "P", "text": "The last one is the whole-tone scale from the beginning of every chapter!", "cue": {"p": 159, "r": "hero"}}, {"t0": 94.89, "t1": 97.79, "who": "B", "text": "Well spotted! Debussy loved it.", "cue": {"p": 159, "r": "hero"}}]}, {"t": "Playing in style", "f": "audio/F6/02-playing-in-style.mp3", "s": 26, "p": 160, "l": [{"t0": 0.2, "t1": 19.66, "who": "B", "text": "And each period wants to be played its own way. Baroque: little or no pedal, steady time, a clear, often detached touch. Classical: light pedal, steady, neat and singing. Romantic: rich pedal, rubato, deep legato. Modern: whatever the music asks.", "cue": {"p": 159, "r": "ht2"}, "hits": [[3.81, "#0", 48, 55, "hero"], [9.48, "#1", 121, 130, "hero"], [13.36, "#2", 171, 179, "hero"], [16.7, "#3", 214, 220, "hero"]]}, {"t0": 19.66, "t1": 26.03, "who": "Q", "text": "One does not pedal Bach like Chopin, Clara. It is like wearing a ball gown to a picnic.", "cue": {"p": 159, "r": "ht2"}}]}, {"t": "Examples: which period?", "f": "audio/F6/03-examples-which-period.mp3", "s": 65, "p": 160, "l": [{"t0": 0.2, "t1": 5.66, "who": "B", "text": "A tune over an Alberti bass, tidy four-bar phrases. Which period?", "cue": {"p": 160, "r": "ex1"}}, {"t0": 5.66, "t1": 8.66, "who": "pause", "text": "Pause and try.", "cue": {"p": 160, "r": "ex1"}}, {"t0": 8.66, "t1": 11.0, "who": "P", "text": "Classical: think Mozart.", "cue": {"p": 160, "r": "ex1", "reveal": true}}, {"t0": 11.0, "t1": 15.32, "who": "B", "text": "Two equal tunes, many trills, written for harpsichord?", "cue": {"p": 160, "r": "ex2"}}, {"t0": 15.32, "t1": 18.32, "who": "pause", "text": "Pause and try.", "cue": {"p": 160, "r": "ex2"}}, {"t0": 18.32, "t1": 20.33, "who": "P", "text": "Baroque: think Bach.", "cue": {"p": 160, "r": "ex2", "reveal": true}}, {"t0": 20.33, "t1": 25.66, "who": "B", "text": "Rubato, rich pedalled chords, huge leaps across the keyboard?", "cue": {"p": 160, "r": "ex3"}}, {"t0": 25.66, "t1": 28.66, "who": "pause", "text": "Pause and try.", "cue": {"p": 160, "r": "ex3"}}, {"t0": 28.66, "t1": 30.94, "who": "P", "text": "Romantic: think Chopin.", "cue": {"p": 160, "r": "ex3", "reveal": true}}, {"t0": 30.94, "t1": 35.58, "who": "B", "text": "Game: who belongs where? Bach, Mozart, Chopin, Debussy.", "cue": {"p": 160, "r": "game"}}, {"t0": 35.58, "t1": 39.58, "who": "pause", "text": "Pause and try.", "cue": {"p": 160, "r": "game"}}, {"t0": 39.58, "t1": 43.89, "who": "P", "text": "Baroque, Classical, Romantic, Modern. In order, like a timeline!", "cue": {"p": 160, "r": "game", "reveal": true}}, {"t0": 43.89, "t1": 50.39, "who": "B", "text": "Your little task for next time: listen to one piece from each period, and say what you notice.", "cue": {"p": 160, "r": "watch"}}, {"t0": 50.39, "t1": 51.83, "who": "P", "text": "I will!", "cue": {"p": 160, "r": "watch"}}, {"t0": 51.83, "t1": 63.14, "who": "B", "text": "Two traps: don’t pedal Bach like Chopin, and don’t use Romantic rubato in Mozart. Keep Classical time steady. Until next time, Clara.", "cue": {"p": 160, "r": "watch"}}, {"t0": 63.14, "t1": 64.73, "who": "P", "text": "Bye, Butler!", "cue": {"p": 160, "r": "watch"}}]}]}, {"k": "FT", "part": "Part VII · Shape and style", "t": "Tips: when a piece goes nowhere", "pages": [161]}, {"k": "LO", "part": "Part VIII · Playing and listening", "t": "Opening map", "pages": [162], "clips": [{"t": "Part Eight: Playing and listening", "f": "audio/LO/01-part-eight-playing-and-listening.mp3", "s": 42, "p": 162, "l": [{"t0": 3.4, "t1": 7.96, "who": "B", "text": "Welcome to Part Eight, Clara: the last part. At the piano.", "cue": {"p": 162, "r": "map"}}, {"t0": 7.96, "t1": 19.39, "who": "B", "text": "Everything before this page is knowledge. This part turns it into playing: the right fingers, practice that works, reading at sight, a trained ear, and the calm to perform.", "cue": {"p": 162, "r": "map"}}, {"t0": 19.39, "t1": 22.76, "who": "P", "text": "The last part already? I don’t want the book to end.", "cue": {"p": 162, "r": "map"}}, {"t0": 22.76, "t1": 33.06, "who": "B", "text": "A book ends, but the playing never does. Look at the two hands on the page: thumbs are one in both. Five chapters, and then you are ready for the concert hall.", "cue": {"p": 162, "r": "map"}}, {"t0": 33.06, "t1": 39.56, "who": "piano", "notes": [33.06, 33.68, 34.3, 34.92, 35.54, 36.16, 36.78, 37.4, 38.02], "cue": {"p": 162, "r": "map"}}, {"t0": 39.56, "t1": 41.71, "who": "P", "text": "Ready when you are, Butler!", "cue": {"p": 162, "r": "map"}}]}]}, {"k": "L1", "part": "Part VIII · Playing and listening", "t": "1 · Fingering", "pages": [163, 164], "clips": [{"t": "Fingering", "f": "audio/L1/01-fingering.mp3", "s": 32, "p": 163, "l": [{"t0": 3.4, "t1": 6.89, "who": "B", "text": "Clara, we begin the last part with your fingers.", "cue": {"p": 163, "r": "h:Fingering"}}, {"t0": 6.89, "t1": 9.17, "who": "P", "text": "I have ten. I counted.", "cue": {"p": 163, "r": "lead"}}, {"t0": 9.17, "t1": 23.48, "who": "B", "text": "Excellent. Each finger has a number, the same in both hands: the thumb is one, the little finger five. And here is the secret: good fingering is planned, not guessed. Choose it once, write it in, and use it every time.", "cue": {"p": 163, "r": "secret"}}, {"t0": 23.48, "t1": 31.8, "who": "B", "text": "Thumbs are one in both hands. So the right hand counts one to five going up, and the left hand counts five to one.", "cue": {"p": 163, "r": "hero"}}]}, {"t": "Five-finger position", "f": "audio/L1/02-five-finger-position.mp3", "s": 62, "p": 164, "l": [{"t0": 0.2, "t1": 10.88, "who": "B", "text": "Thumb on C, one finger on each key up to G: five notes without moving the hand. Many first pieces stay right here, like a cat curled up in its basket.", "cue": {"p": 163, "r": "two"}}, {"t0": 10.88, "t1": 17.38, "who": "piano", "notes": [10.88, 11.5, 12.12, 12.74, 13.36, 13.98, 14.6, 15.22, 15.84], "cue": {"p": 163, "r": "two"}}, {"t0": 17.38, "t1": 27.23, "who": "B", "text": "And to go further, thumb under, finger over. Up the scale: one, two, three, then the thumb tucks under to F, then one, two, three, four, five.", "cue": {"p": 163, "r": "two2"}}, {"t0": 27.23, "t1": 33.11, "who": "piano", "notes": [27.23, 27.85, 28.47, 29.09, 29.71, 30.33, 30.95, 31.57], "cue": {"p": 163, "r": "two2"}}, {"t0": 33.11, "t1": 38.93, "who": "B", "text": "Coming down: five, four, three, two, one, then finger three crosses over the thumb.", "cue": {"p": 163, "r": "two2"}}, {"t0": 38.93, "t1": 44.81, "who": "piano", "notes": [38.93, 39.55, 40.17, 40.79, 41.41, 42.03, 42.65, 43.27], "cue": {"p": 163, "r": "two2"}}, {"t0": 44.81, "t1": 47.8, "who": "P", "text": "The thumb is like a little tunnel under a bridge!", "cue": {"p": 163, "r": "two2"}}, {"t0": 47.8, "t1": 61.55, "who": "B", "text": "A smooth tunnel, please, no bumps. Two-minute drill: C D E F G with each hand, saying the finger numbers. Right one, two, three, four, five up; left five, four, three, two, one up. Then both together.", "cue": {"p": 163, "r": "drill"}}]}, {"t": "Examples", "f": "audio/L1/03-examples.mp3", "s": 70, "p": 164, "l": [{"t0": 0.2, "t1": 9.03, "who": "B", "text": "Which finger plays the F in the C major scale? C, D, E are one, two, three. Then: finger four, or the thumb tucked under?", "cue": {"p": 164, "r": "ex1"}}, {"t0": 9.03, "t1": 13.03, "who": "pause", "text": "Pause and try.", "cue": {"p": 164, "r": "ex1"}}, {"t0": 13.03, "t1": 14.67, "who": "P", "text": "Finger four!", "cue": {"p": 164, "r": "ex1", "oops": true}}, {"t0": 14.67, "t1": 21.32, "who": "B", "text": "Then you’d run out of fingers before the top C. Count: four, five, and three more notes to go.", "cue": {"p": 164, "r": "ex1"}}, {"t0": 21.32, "t1": 26.37, "who": "P", "text": "Oh! The thumb passes under to F, and then two, three, four, five reach the top C.", "cue": {"p": 164, "r": "ex1", "reveal": true}}, {"t0": 26.37, "t1": 30.52, "who": "B", "text": "And right hand, thumb on C: which finger plays G?", "cue": {"p": 164, "r": "ex2"}}, {"t0": 30.52, "t1": 33.52, "who": "pause", "text": "Pause and try.", "cue": {"p": 164, "r": "ex2"}}, {"t0": 33.52, "t1": 37.25, "who": "P", "text": "Five! C D E F G is one two three four five.", "cue": {"p": 164, "r": "ex2", "reveal": true}}, {"t0": 37.25, "t1": 41.39, "who": "B", "text": "Game: name the finger. Thumb, index, middle, little.", "cue": {"p": 164, "r": "gt2"}}, {"t0": 41.39, "t1": 45.39, "who": "pause", "text": "Pause and try.", "cue": {"p": 164, "r": "gt2"}}, {"t0": 45.39, "t1": 47.58, "who": "P", "text": "One, two, three, five.", "cue": {"p": 164, "r": "gt2", "reveal": true}}, {"t0": 47.58, "t1": 53.4, "who": "B", "text": "Your little task for next time: write the fingering into one tricky bar, and keep it.", "cue": {"p": 164, "r": "watch"}}, {"t0": 53.4, "t1": 54.84, "who": "P", "text": "I will!", "cue": {"p": 164, "r": "watch"}}, {"t0": 54.84, "t1": 66.91, "who": "B", "text": "Two traps: don’t change fingering every time you play; choose one and keep it. And let the thumb glide under, don’t land on it like a sack of potatoes. Until next time, Clara.", "cue": {"p": 164, "r": "watch"}}, {"t0": 66.91, "t1": 69.79, "who": "P", "text": "Bye, Butler! Five, four, three, two, one!", "cue": {"p": 164, "r": "watch"}}]}]}, {"k": "L2", "part": "Part VIII · Playing and listening", "t": "2 · Practising well", "pages": [165, 166], "clips": [{"t": "Practising well", "f": "audio/L2/01-practising-well.mp3", "s": 45, "p": 165, "l": [{"t0": 3.4, "t1": 8.54, "who": "P", "text": "Butler, I practise every day. I play my piece from the top, again and again and again.", "cue": {"p": 165, "r": "h:Practising well"}}, {"t0": 8.54, "t1": 20.12, "who": "B", "text": "Ah. That’s like learning to ride a bike by only riding the easy bit of the road. Practice is fixing the hard bits, slowly and correctly, then joining them back together.", "cue": {"p": 165, "r": "lead"}}, {"t0": 20.12, "t1": 30.74, "who": "B", "text": "Here is the secret: slow, small, and correct. Then a little faster. Then join the pieces. Three correct times at one speed, then one step up the ladder.", "cue": {"p": 165, "r": "secret"}}, {"t0": 30.74, "t1": 41.8, "who": "piano", "notes": [30.74, 31.74, 32.74, 33.74, 34.74, 35.57, 36.4, 37.24, 38.07, 38.75, 39.43, 40.11], "cue": {"p": 165, "r": "hero"}}, {"t0": 41.8, "t1": 45.27, "who": "P", "text": "Sixty, seventy-two, eighty-eight. Climbing the ladder.", "cue": {"p": 165, "r": "hero"}}]}, {"t": "A fifteen-minute plan", "f": "audio/L2/02-a-fifteen-minute-plan.mp3", "s": 49, "p": 166, "l": [{"t0": 0.2, "t1": 16.0, "who": "B", "text": "A fifteen-minute plan. Two minutes: warm up with a scale. Five minutes: the hardest bars, slowly, hands separately. Five minutes: join the bars, hands together, still slow. And three minutes: play the whole section, and mark what slipped.", "cue": {"p": 165, "r": "ht"}}, {"t0": 16.0, "t1": 27.26, "who": "B", "text": "Four tools. Small chunks: one or two bars, plus the first note of the next. Hands separately. Slow, then faster. And count aloud: it keeps the rhythm honest.", "cue": {"p": 165, "r": "ht2"}}, {"t0": 27.26, "t1": 36.84, "who": "B", "text": "And a trick: for a run of even quavers, play it long, short, then short, long. When you go back to even notes, the run is suddenly easier.", "cue": {"p": 165, "r": "xbox"}}, {"t0": 36.84, "t1": 46.01, "who": "piano", "notes": [36.84, 37.3, 37.46, 37.92, 38.08, 38.54, 38.7, 39.16, 39.57, 39.72, 40.19, 40.34, 40.81, 40.96, 41.43, 41.58, 42.3, 42.61, 42.92, 43.23, 43.54, 43.85, 44.16, 44.47], "cue": {"p": 165, "r": "xbox"}}, {"t0": 46.01, "t1": 49.05, "who": "P", "text": "Bumpy, then bumpy the other way, then smooth!", "cue": {"p": 165, "r": "xbox"}}]}, {"t": "Examples", "f": "audio/L2/03-examples.mp3", "s": 74, "p": 166, "l": [{"t0": 0.2, "t1": 7.51, "who": "B", "text": "Which bar first? You played it through once, and it slipped in the semiquavers of bar three. Where do you start?", "cue": {"p": 166, "r": "ex1"}}, {"t0": 7.51, "t1": 10.51, "who": "pause", "text": "Pause and try.", "cue": {"p": 166, "r": "ex1"}}, {"t0": 10.51, "t1": 14.09, "who": "P", "text": "Bar three, slowly. Then join bars two to four.", "cue": {"p": 166, "r": "ex1", "reveal": true}}, {"t0": 14.09, "t1": 18.74, "who": "B", "text": "And when do you speed up? At sixty you played it right, right, wrong.", "cue": {"p": 166, "r": "ex2"}}, {"t0": 18.74, "t1": 21.74, "who": "pause", "text": "Pause and try.", "cue": {"p": 166, "r": "ex2"}}, {"t0": 21.74, "t1": 24.21, "who": "P", "text": "Now! Two right is nearly three.", "cue": {"p": 166, "r": "ex2", "oops": true}}, {"t0": 24.21, "t1": 33.29, "who": "B", "text": "Nearly isn’t three, I’m afraid. After a mistake, start counting again: three correct in a row at sixty, then try sixty-six.", "cue": {"p": 166, "r": "ex2"}}, {"t0": 33.29, "t1": 35.72, "who": "P", "text": "Fine. Patience, patience.", "cue": {"p": 166, "r": "ex2", "reveal": true}}, {"t0": 35.72, "t1": 42.54, "who": "B", "text": "Game: good habit or not? From the top. Hardest first. Faster to fix. Slow and correct.", "cue": {"p": 166, "r": "gt2"}}, {"t0": 42.54, "t1": 46.54, "who": "pause", "text": "Pause and try.", "cue": {"p": 166, "r": "gt2"}}, {"t0": 46.54, "t1": 50.67, "who": "P", "text": "Hardest first, and slow and correct. The other two waste time.", "cue": {"p": 166, "r": "gt2", "reveal": true}}, {"t0": 50.67, "t1": 56.26, "who": "B", "text": "Your little task for next time: climb the metronome ladder on your hardest bar.", "cue": {"p": 166, "r": "think"}}, {"t0": 56.26, "t1": 57.71, "who": "P", "text": "I will!", "cue": {"p": 166, "r": "think"}}, {"t0": 57.71, "t1": 72.7, "who": "B", "text": "Keep a practice log: the date, one thing that got better and one that didn’t. Start tomorrow with the one that didn’t. Practice is like building a wall: lay each brick straight, and the wall stands on its own. Until next time, Clara.", "cue": {"p": 166, "r": "think"}}, {"t0": 72.7, "t1": 74.29, "who": "P", "text": "Bye, Butler!", "cue": {"p": 166, "r": "think"}}]}]}, {"k": "L3", "part": "Part VIII · Playing and listening", "t": "3 · Sight-reading", "pages": [167, 168], "clips": [{"t": "Sight-reading", "f": "audio/L3/01-sight-reading.mp3", "s": 45, "p": 167, "l": [{"t0": 3.4, "t1": 7.94, "who": "B", "text": "Clara, sight-reading is playing music you have never seen before.", "cue": {"p": 167, "r": "h:Sight-reading"}}, {"t0": 7.94, "t1": 11.26, "who": "P", "text": "That sounds scary. Like reading a book in the dark.", "cue": {"p": 167, "r": "lead"}}, {"t0": 11.26, "t1": 23.29, "who": "B", "text": "Not if you bring a torch. Here is the secret: look before you play, then never stop. The beat matters more than any note. A wrong note passes by; a stop is heard by everyone.", "cue": {"p": 167, "r": "secret"}}, {"t0": 23.29, "t1": 31.39, "who": "B", "text": "Thirty seconds first. One sharp, so G major. Four-four time. It starts on G and steps up in a pattern.", "cue": {"p": 167, "r": "hero"}}, {"t0": 31.39, "t1": 45.09, "who": "piano", "notes": [31.39, 32.01, 32.63, 33.25, 34.12, 34.74, 35.36, 35.98, 36.85, 37.47, 38.09, 38.71, 39.58, 40.2, 40.82, 41.44, 42.31], "cue": {"p": 167, "r": "hero"}}]}, {"t": "The thirty-second scan", "f": "audio/L3/02-the-thirty-second-scan.mp3", "s": 30, "p": 168, "l": [{"t0": 0.2, "t1": 21.14, "who": "B", "text": "The scan has six checks. One: the key, sharps or flats at the start. Two: the time signature, count a bar before you start. Three: the clefs and the first note in each hand. Four: the trickiest rhythm, tap it. Five: patterns, steps, skips, repeats, sequences. And six: the marks, dynamics, slurs, speed words.", "cue": {"p": 167, "r": "ht"}}, {"t0": 21.14, "t1": 24.36, "who": "P", "text": "Like a pilot checking the plane before take-off!", "cue": {"p": 167, "r": "ht"}}, {"t0": 24.36, "t1": 29.67, "who": "B", "text": "Exactly like a pilot. And then we take off and don’t stop in mid-air.", "cue": {"p": 167, "r": "ht"}}]}, {"t": "Examples", "f": "audio/L3/03-examples.mp3", "s": 56, "p": 168, "l": [{"t0": 0.2, "t1": 7.28, "who": "B", "text": "What do you check first? The key: how many sharps? The time? And the F in bar two: F or F sharp?", "cue": {"p": 167, "r": "ex1"}}, {"t0": 7.28, "t1": 11.28, "who": "pause", "text": "Pause and try.", "cue": {"p": 167, "r": "ex1"}}, {"t0": 11.28, "t1": 17.91, "who": "P", "text": "G major, three-four. The F in bar two is F sharp, from the key signature. Count one, two, three, and go!", "cue": {"p": 167, "r": "ex1", "reveal": true}}, {"t0": 17.91, "t1": 23.04, "who": "B", "text": "A wrong note in bar two. Now what? Stop and fix it, or keep going?", "cue": {"p": 167, "r": "ex2"}}, {"t0": 23.04, "t1": 26.04, "who": "pause", "text": "Pause and try.", "cue": {"p": 167, "r": "ex2"}}, {"t0": 26.04, "t1": 30.78, "who": "P", "text": "Keep going and catch the next beat. A stop is heard much more than a wrong note.", "cue": {"p": 167, "r": "ex2", "reveal": true}}, {"t0": 30.78, "t1": 34.5, "who": "B", "text": "Spot the pattern. Bar one has a shape. Bar two?", "cue": {"p": 168, "r": "ex3"}}, {"t0": 34.5, "t1": 37.5, "who": "pause", "text": "Pause and try.", "cue": {"p": 168, "r": "ex3"}}, {"t0": 37.5, "t1": 42.62, "who": "P", "text": "The same shape a step higher: a sequence! So I only really need to read bar one.", "cue": {"p": 168, "r": "ex3", "reveal": true}}, {"t0": 42.62, "t1": 49.06, "who": "B", "text": "Read the shape, not every note. Game: put the checks in order. Rhythm, key, time, patterns.", "cue": {"p": 168, "r": "gt2"}}, {"t0": 49.06, "t1": 53.06, "who": "pause", "text": "Pause and try.", "cue": {"p": 168, "r": "gt2"}}, {"t0": 53.06, "t1": 55.53, "who": "P", "text": "Key, time, rhythm, patterns.", "cue": {"p": 168, "r": "gt2", "reveal": true}}]}, {"t": "Read ahead", "f": "audio/L3/04-read-ahead.mp3", "s": 37, "p": 168, "l": [{"t0": 0.2, "t1": 9.8, "who": "B", "text": "And the big skill: read ahead. While you play one bar, let your eyes move to the next. Practise by covering each bar with a card as you play it.", "cue": {"p": 168, "r": "howto"}}, {"t0": 9.8, "t1": 16.98, "who": "B", "text": "Your little task for next time: scan an easy new piece for thirty seconds, then play it without stopping.", "cue": {"p": 168, "r": "think"}}, {"t0": 16.98, "t1": 18.43, "who": "P", "text": "I will!", "cue": {"p": 168, "r": "think"}}, {"t0": 18.43, "t1": 34.76, "who": "B", "text": "Sight-reading is like reading aloud: you look a few words ahead, and if you trip on one, the sentence goes on. Three traps: choose a speed you can keep, keep your eyes on the music, not your hands, and never skip the scan. Until next time, Clara.", "cue": {"p": 168, "r": "think"}}, {"t0": 34.76, "t1": 37.38, "who": "P", "text": "Bye, Butler! One new piece a day.", "cue": {"p": 168, "r": "think"}}]}]}, {"k": "L4", "part": "Part VIII · Playing and listening", "t": "4 · Listening", "pages": [169, 170], "clips": [{"t": "Listening", "f": "audio/L4/01-listening.mp3", "s": 36, "p": 169, "l": [{"t0": 3.4, "t1": 7.19, "who": "B", "text": "Clara, your ear is a musical instrument too.", "cue": {"p": 169, "r": "h:Listening"}}, {"t0": 7.19, "t1": 10.37, "who": "P", "text": "I can’t play my ear. I’ve tried wiggling it.", "cue": {"p": 169, "r": "lead"}}, {"t0": 10.37, "t1": 22.05, "who": "B", "text": "Ha! Not like that. You train it in small steps: clap a rhythm back, sing a tune back, then hear whether music goes up or down, is major or minor, and whether it has finished.", "cue": {"p": 169, "r": "lead"}}, {"t0": 22.05, "t1": 27.57, "who": "B", "text": "Here is the secret: sing it back first. If you can sing it, you can play it.", "cue": {"p": 169, "r": "secret"}}, {"t0": 27.57, "t1": 36.08, "who": "B", "text": "Questions for your ear: high or low? Loud or soft? Two or three beats in a bar? Major or minor? Finished or not?", "cue": {"p": 169, "r": "hero"}}]}, {"t": "Major or minor?", "f": "audio/L4/02-major-or-minor.mp3", "s": 19, "p": 170, "l": [{"t0": 0.2, "t1": 8.66, "who": "B", "text": "Major or minor? Only the middle note changes. Listen: C E G, then C E flat G. Bright, then darker.", "cue": {"p": 169, "r": "two"}}, {"t0": 8.66, "t1": 16.08, "who": "piano", "notes": [8.66, 10.11, 11.81, 12.43, 13.05, 13.92, 14.54, 15.16], "cue": {"p": 169, "r": "two"}}, {"t0": 16.08, "t1": 18.53, "who": "P", "text": "The sun went behind a cloud.", "cue": {"p": 169, "r": "two"}}]}, {"t": "Intervals by song", "f": "audio/L4/03-intervals-by-song.mp3", "s": 70, "p": 170, "l": [{"t0": 0.2, "t1": 6.68, "who": "B", "text": "And a clever trick: learn the size of a leap from a song you know. A major second: Frère Jacques.", "cue": {"p": 169, "r": "ht"}}, {"t0": 6.68, "t1": 9.46, "who": "piano", "notes": [6.68, 7.3, 7.92, 8.54], "cue": {"p": 169, "r": "ht"}}, {"t0": 9.46, "t1": 12.57, "who": "B", "text": "A major third: Oh When the Saints.", "cue": {"p": 169, "r": "ht"}}, {"t0": 12.57, "t1": 17.21, "who": "piano", "notes": [12.57, 13.19, 13.81, 14.43], "cue": {"p": 169, "r": "ht"}}, {"t0": 17.21, "t1": 20.41, "who": "B", "text": "A perfect fourth: Amazing Grace.", "cue": {"p": 169, "r": "ht"}}, {"t0": 20.41, "t1": 28.15, "who": "piano", "notes": [20.41, 21.03, 22.27, 22.58, 22.89, 24.13, 24.75, 25.99, 26.61], "cue": {"p": 169, "r": "ht"}}, {"t0": 28.15, "t1": 32.51, "who": "B", "text": "A perfect fifth: Twinkle, from the second note to the third.", "cue": {"p": 169, "r": "ht"}}, {"t0": 32.51, "t1": 37.77, "who": "piano", "notes": [32.51, 33.13, 33.75, 34.37, 34.99, 35.61, 36.23], "cue": {"p": 169, "r": "ht"}}, {"t0": 37.77, "t1": 41.74, "who": "B", "text": "A major sixth: My Bonnie Lies Over the Ocean.", "cue": {"p": 169, "r": "ht"}}, {"t0": 41.74, "t1": 48.24, "who": "piano", "notes": [41.74, 42.36, 42.98, 43.6, 44.22, 44.84, 45.46, 46.08, 46.7], "cue": {"p": 169, "r": "ht"}}, {"t0": 48.24, "t1": 54.06, "who": "B", "text": "And an octave: the first big leap of Somewhere Over the Rainbow. Just the two notes.", "cue": {"p": 169, "r": "ht"}}, {"t0": 54.06, "t1": 56.84, "who": "piano", "notes": [54.06, 55.3], "cue": {"p": 169, "r": "ht"}}, {"t0": 56.84, "t1": 60.12, "who": "P", "text": "Now I’ll hear songs everywhere in my intervals!", "cue": {"p": 169, "r": "ht"}}, {"t0": 60.12, "t1": 69.93, "who": "B", "text": "And to clap it back: someone claps two bars, you clap them straight back, keeping the beat. Then sing back a short tune, then find it on the keys.", "cue": {"p": 169, "r": "howto"}}]}, {"t": "Examples", "f": "audio/L4/04-examples.mp3", "s": 64, "p": 170, "l": [{"t0": 0.2, "t1": 5.42, "who": "B", "text": "Finished or not? Listen to two short bars. Which one sounds finished?", "cue": {"p": 170, "r": "ex1"}}, {"t0": 5.42, "t1": 11.77, "who": "piano", "notes": [5.42, 6.87, 8.57, 10.02], "cue": {"p": 170, "r": "ex1"}}, {"t0": 11.77, "t1": 14.77, "who": "pause", "text": "Pause and try.", "cue": {"p": 170, "r": "ex1"}}, {"t0": 14.77, "t1": 19.16, "who": "P", "text": "The first! It comes home to C. The second stops on G: a comma.", "cue": {"p": 170, "r": "ex1", "reveal": true}}, {"t0": 19.16, "t1": 23.32, "who": "B", "text": "Major or minor? Two chords. Which note changed?", "cue": {"p": 170, "r": "ex2"}}, {"t0": 23.32, "t1": 26.52, "who": "piano", "notes": [23.32, 24.77], "cue": {"p": 170, "r": "ex2"}}, {"t0": 26.52, "t1": 29.52, "who": "pause", "text": "Pause and try.", "cue": {"p": 170, "r": "ex2"}}, {"t0": 29.52, "t1": 34.36, "who": "P", "text": "First minor, then major. Only the middle note moved: B flat up to B.", "cue": {"p": 170, "r": "ex2", "reveal": true}}, {"t0": 34.36, "t1": 38.79, "who": "B", "text": "Game: which song? A fifth up, an octave up, a fourth up.", "cue": {"p": 170, "r": "gt2"}}, {"t0": 38.79, "t1": 42.79, "who": "pause", "text": "Pause and try.", "cue": {"p": 170, "r": "gt2"}}, {"t0": 42.79, "t1": 46.41, "who": "P", "text": "Twinkle, Somewhere Over the Rainbow, and Amazing Grace.", "cue": {"p": 170, "r": "gt2", "reveal": true}}, {"t0": 46.41, "t1": 53.55, "who": "B", "text": "Your little task for next time: ask someone to play major and minor chords, and say bright or dark.", "cue": {"p": 170, "r": "watch"}}, {"t0": 53.55, "t1": 55.0, "who": "P", "text": "I will!", "cue": {"p": 170, "r": "watch"}}, {"t0": 55.0, "t1": 61.73, "who": "B", "text": "And one trap: don’t guess from the hands. Close your eyes and listen. Until next time, Clara.", "cue": {"p": 170, "r": "watch"}}, {"t0": 61.73, "t1": 64.14, "who": "P", "text": "Bye, Butler! My ears are on.", "cue": {"p": 170, "r": "watch"}}]}]}, {"k": "L5", "part": "Part VIII · Playing and listening", "t": "5 · Performing", "pages": [171, 172], "clips": [{"t": "Performing", "f": "audio/L5/01-performing.mp3", "s": 48, "p": 171, "l": [{"t0": 3.4, "t1": 8.71, "who": "P", "text": "Butler, I have to play at the school concert. My tummy feels like it’s full of butterflies.", "cue": {"p": 171, "r": "h:Performing"}}, {"t0": 8.71, "t1": 22.38, "who": "B", "text": "Ah, the butterflies. Nerves are normal, Clara: they mean you care. Playing for others is a skill you can practise, like scales. A routine before you start, and a plan for slips, make the butterflies much smaller.", "cue": {"p": 171, "r": "lead"}}, {"t0": 22.38, "t1": 29.65, "who": "B", "text": "Here is the secret: breathe, feel a bar of the beat, then begin. And after a slip, catch the next beat.", "cue": {"p": 171, "r": "secret"}}, {"t0": 29.65, "t1": 39.24, "who": "B", "text": "Four steps to the first note. Breathe out, slowly. Feel one bar of the beat in your head. Begin, calm. And at the end, bow, and smile.", "cue": {"p": 171, "r": "hero"}}, {"t0": 39.24, "t1": 42.72, "who": "piano", "notes": [39.24, 39.86, 40.48, 41.1], "cue": {"p": 171, "r": "hero"}}, {"t0": 42.72, "t1": 47.98, "who": "piano", "notes": [42.72, 43.34, 43.96, 44.58, 45.2, 45.82, 46.44], "cue": {"p": 171, "r": "hero"}}]}, {"t": "Before, during, after", "f": "audio/L5/02-before-during-after.mp3", "s": 46, "p": 172, "l": [{"t0": 0.2, "t1": 21.66, "who": "B", "text": "Before: warm up your hands, practise starting, not only the whole piece, and play it to a friend or your family first. At the piano: adjust the bench, feet flat, breathe out, feel one bar of the beat. If you slip: keep the beat going and catch the next beat, or the next phrase. Never go back. And after: hands in your lap for a moment, stand, bow, smile.", "cue": {"p": 171, "r": "ht"}}, {"t0": 21.66, "t1": 28.84, "who": "B", "text": "The rule: the listener follows the beat and the mood. Keep both going, and a slip is forgotten in a second.", "cue": {"p": 171, "r": "rule"}}, {"t0": 28.84, "t1": 35.79, "who": "Q", "text": "When I give a speech and forget a word, I simply carry on. Nobody notices, because I am the Queen.", "cue": {"p": 171, "r": "rule"}}, {"t0": 35.79, "t1": 37.37, "who": "K", "text": "I notice.", "cue": {"p": 171, "r": "rule"}}, {"t0": 37.37, "t1": 46.38, "who": "B", "text": "Two-minute drill: every day this week, play your piece once from the start without stopping, whatever happens, as if someone were listening.", "cue": {"p": 171, "r": "drill"}}]}, {"t": "Examples", "f": "audio/L5/03-examples.mp3", "s": 73, "p": 172, "l": [{"t0": 0.2, "t1": 6.4, "who": "B", "text": "How do you start? You sit down, and your heart is racing. The bench, your breath, the beat?", "cue": {"p": 172, "r": "ex1"}}, {"t0": 6.4, "t1": 10.4, "who": "pause", "text": "Pause and try.", "cue": {"p": 172, "r": "ex1"}}, {"t0": 10.4, "t1": 15.6, "who": "P", "text": "Adjust the bench, breathe out, and feel one bar of the speed in my head. Then the first note.", "cue": {"p": 172, "r": "ex1", "reveal": true}}, {"t0": 15.6, "t1": 20.8, "who": "B", "text": "You slip in bar five: a wrong note, and your hand freezes. What now?", "cue": {"p": 172, "r": "ex2"}}, {"t0": 20.8, "t1": 24.8, "who": "pause", "text": "Pause and try.", "cue": {"p": 172, "r": "ex2"}}, {"t0": 24.8, "t1": 30.58, "who": "P", "text": "Keep counting, and come back in on the next beat, or at the start of the next phrase. Never go back.", "cue": {"p": 172, "r": "ex2", "reveal": true}}, {"t0": 30.58, "t1": 36.53, "who": "B", "text": "Game: help or not? Going back. Breathe first. Keep the beat. Rush to finish.", "cue": {"p": 172, "r": "gt2"}}, {"t0": 36.53, "t1": 40.53, "who": "pause", "text": "Pause and try.", "cue": {"p": 172, "r": "gt2"}}, {"t0": 40.53, "t1": 44.45, "who": "P", "text": "Breathe first, and keep the beat. Going back and rushing don’t help.", "cue": {"p": 172, "r": "gt2", "reveal": true}}, {"t0": 44.45, "t1": 52.98, "who": "B", "text": "Try a one-minute concert today: choose eight bars, walk to the piano, sit, breathe, feel a bar, play, bow. Do it for someone.", "cue": {"p": 172, "r": "gt2"}}, {"t0": 52.98, "t1": 59.46, "who": "B", "text": "Your little task for next time: give a one-minute concert for someone at home, and bow at the end.", "cue": {"p": 172, "r": "think"}}, {"t0": 59.46, "t1": 60.9, "who": "P", "text": "I will!", "cue": {"p": 172, "r": "think"}}, {"t0": 60.9, "t1": 70.31, "who": "B", "text": "And remember, Clara: the audience wants you to do well. They are on your side from the first note. And so am I. Until next time, Clara.", "cue": {"p": 172, "r": "think"}}, {"t0": 70.31, "t1": 73.08, "who": "P", "text": "Thank you, Butler. For everything. Bye!", "cue": {"p": 172, "r": "think"}}]}]}, {"k": "LT", "part": "Part VIII · Playing and listening", "t": "Tips: when practice isn’t working", "pages": [173]}, {"k": "X", "part": "At the end", "t": "Putting it together", "pages": [174, 175]}, {"k": "GL", "part": "At the end", "t": "Glossary and index", "pages
