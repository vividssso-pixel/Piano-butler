<style>
/* Layout: a reading desk. The page fills the left; the Butler's clips sit beside it (below it on a phone). */
:root{--bg:#ffffff;--panel:#ffffff;--ink:#26296b;--soft:#5a5d8f;--line:#e3e1ee;--accent:#e4572e;--accentbg:#fdece5;--paper:#ffffff;
 --display:'Playfair Display',Georgia,serif;--body:'Atkinson Hyperlegible',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14153a;--panel:#1e2050;--ink:#eceefe;--soft:#b3b5dc;--line:#33366e;--accent:#ff7a52;--accentbg:#3a2620;--paper:#f7f6f1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14153a;--panel:#1e2050;--ink:#eceefe;--soft:#b3b5dc;--line:#33366e;--accent:#ff7a52;--accentbg:#3a2620;--paper:#f7f6f1;color-scheme:dark}
html,body{margin:0} #veil{position:absolute;inset:0;pointer-events:none} #veil .vl{position:absolute;background:rgba(251,250,246,.93);border-radius:3px;display:flex;align-items:center;justify-content:center;font:italic 700 12px Georgia,serif;color:#a3a5c6;letter-spacing:.04em} .embed .top,.embed .prac{display:none!important} .embed .desk{padding-top:4px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;margin-right:auto}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
select{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;max-width:1180px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:880px){.desk{grid-template-columns:minmax(0,1fr)}}
.reader{min-width:0;width:100%;max-width:calc((100vh - 190px) / 1.414);justify-self:center} @media (max-width:880px){.reader{max-width:100%}}
.sheet{background:var(--paper);border-radius:4px;box-shadow:0 2px 10px rgba(20,22,60,.12);overflow:hidden;aspect-ratio:210/297;max-width:100%;display:flex;align-items:center;justify-content:center}
.sheet{position:relative} .stage{position:relative;width:100%;transform-origin:0 0;transition:transform .6s ease}
.sheet img{width:100%;height:auto;display:block}
.hl{position:absolute;border:3px solid var(--accent);border-radius:8px;box-shadow:0 0 0 9999px rgba(20,22,60,.18);} .hl.fog{box-shadow:0 0 0 9999px rgba(255,255,255,.94)} .cov{position:absolute;background:#fff;border-radius:3px;pointer-events:none} .cov.res{background:#fff7f3;border:1.5px dashed #e4572e;display:flex;align-items:center;justify-content:center;font:700 clamp(9px,1.4vw,14px) var(--body);color:#e4572e} .hl{transition:all .5s ease;pointer-events:none}
.sub mark,#sub mark{background:#fde3d8;color:#26296b;border-radius:3px;padding:0 2px} .mk{position:absolute;width:3.2%;aspect-ratio:1;border-radius:50%;border:3px solid var(--accent);background:rgba(228,87,46,.25);transform:translate(-50%,-50%);pointer-events:none;animation:pop .35s ease}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.sub{min-height:3.2em;margin-top:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15.5px}
.sub b{color:var(--accent);margin-right:6px} .sub:empty{display:none}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px} .ctl .btn{padding:6px 12px;font-size:14px} .ctl .sp{font-size:12.5px;padding:4px 7px;border-radius:999px} .ctl .sp.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.prac{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px} .prac .ph{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)} .prac a{display:block;font-weight:700;font-size:14.5px;color:var(--ink);text-decoration:none;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--bg)} .prac a b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)} .prac a span{display:block}.prac div.nwb{display:block;font-weight:700;font-size:14.5px;color:var(--ink);border:1.5px dashed var(--line);border-radius:9px;padding:7px 10px;background:var(--bg)}.prac div.nwb b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}.prac div.nwb span{display:block} .prac a.ndr{border-color:var(--accent)} .prac a.ndr b{color:var(--accent)} .prac a:hover{border-color:var(--accent)} .prac .nhint{margin:2px 0 0;font-size:12.5px;color:var(--soft)}
#lens:not(:empty){position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.82);z-index:3;pointer-events:none}   /* her 9 Nov: one place to look - the lens in the middle, the page faded behind */
.lens{position:relative;width:90%;background:#fff;border:4px solid var(--accent);border-radius:22px;box-shadow:0 10px 30px rgba(20,22,60,.28);padding:6px 10px 2px;animation:lz .35s ease;z-index:3;pointer-events:none} .seek{margin:8px 0 10px} .seek .sr{display:flex;align-items:center;gap:8px} .seek input{flex:1;accent-color:#e4572e} .seek #tm{font:600 12px var(--body);color:#5a5d8f;min-width:76px;text-align:right} .seek .sb{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px} .seek .sb .btn{font-size:12px;padding:4px 8px} .lens .lh{display:flex;align-items:center;gap:6px;font:700 clamp(10px,1.6vw,14px) var(--body);letter-spacing:.12em;text-transform:uppercase;color:#e4572e} .lens svg{display:block;width:100%;height:auto}
#lens .popl{width:94%;max-width:720px;padding:6px;overflow:hidden}#lens .popl img{border-radius:10px}#lens .popl{position:fixed;left:50%;top:max(10px,2vh);transform:translateX(-50%);width:min(1040px,calc(100vw - 16px));max-width:none;z-index:40;box-shadow:0 18px 60px rgba(38,41,107,.28)}@media (min-width:881px){#lens .popl img{max-height:84vh;width:auto!important;max-width:100%;margin:0 auto}}@media (max-width:880px){#lens .popl{padding:3px}} #lens .penl{pointer-events:auto;max-width:620px;max-height:96%;overflow:auto} .penw{padding:4px 2px 8px} .penw .pdraw{max-width:470px;margin:0 auto;background:#f6f6fb;border-radius:12px;padding:4px} .penw .pfront{max-width:300px} .penw .pfing{max-width:240px} .penw .pdraw svg{width:100%;height:auto;display:block} .pchips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px} .pch{font:600 12.5px var(--body);border:1.5px solid #d9d7e8;background:#fff;color:#26296b;border-radius:14px;padding:3px 9px;cursor:pointer} .pch.on{background:#26296b;color:#fff;border-color:#26296b} .pch .px{color:#e4572e} .psl{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:6px 0} .psl label{display:flex;flex-direction:column;font:700 12px var(--body);color:#26296b} .psl input{accent-color:#e4572e;width:100%} .pck{display:flex;flex-direction:column;gap:3px;font:13px/1.35 var(--body);color:#26296b} .pck>div{background:#f6f6fb;border-radius:7px;padding:4px 8px} .pck .ok b{color:#2e8a6e} .pck .no b{color:#c8361b} .pck span{color:#6d6f9c}
#lens .fold{opacity:.55;animation:fold 1.8s ease-in-out .5s forwards} #lens .meet{animation:meet .5s ease 2.3s forwards}
@keyframes fold{from{transform:scaleY(1)}to{transform:scaleY(-1)}} @keyframes meet{to{opacity:1}}
@keyframes lz{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.follow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);margin-top:8px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.pgno{font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.side{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px;align-self:start;position:sticky;top:12px}
.side h2{font-family:var(--display);font-size:22px;margin:0 0 2px;text-wrap:balance}
.kick{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.play{display:flex;align-items:center;gap:10px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:700;margin:12px 0 8px}
.play svg{flex:none}
.clips{display:grid;gap:6px}
.clip{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.clip .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.clip .s{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.clip.on{border-color:var(--accent);background:var(--accentbg)} .clip.on .n{background:var(--accent);border-color:var(--accent);color:#fff}
audio{width:100%;margin-top:10px}
.none{color:var(--soft);font-size:14.5px;margin:10px 0 0}
.who{font-size:13px;color:var(--soft);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto} .stage,.hl{transition:none}}

#ov2{position:absolute;inset:0;pointer-events:none}
.mkhi{position:absolute;border-radius:3px;background:linear-gradient(transparent 30%,rgba(255,206,84,.72) 30%,rgba(255,206,84,.72) 100%);transform-origin:left center;animation:mkpen .5s ease-out both;mix-blend-mode:multiply}
.mkhi.old{opacity:.0;transition:opacity .5s}
.mkkey{position:absolute;border-radius:1px 1px 4px 4px;background:rgba(255,206,84,.5);box-shadow:inset 0 -5px 0 rgba(255,170,0,.75);mix-blend-mode:multiply;animation:mkkey .4s ease-out both}
.mkkey.now{background:rgba(255,196,64,.78);box-shadow:inset 0 -7px 0 #f2a900,0 0 0 2px rgba(242,169,0,.55);animation:mkkey .4s ease-out both,mkpress .5s ease-out}
.mkbadge{position:absolute;transform:translate(-50%,-118%);min-width:1.9em;height:1.9em;padding:0 .35em;border-radius:99px;background:#26296b;color:#fff;font:800 clamp(10px,1.35vw,15px)/1.9em 'Atkinson Hyperlegible',Arial,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(20,22,60,.3);animation:mkbadge .35s cubic-bezier(.3,1.6,.5,1) both}
.mknote{position:absolute;border-radius:50%;background:rgba(255,206,84,.55);box-shadow:0 0 0 2px #f2a900;mix-blend-mode:multiply;animation:mkkey .35s ease-out both}
.mknote.now{background:rgba(255,196,64,.8);box-shadow:0 0 0 3px #f2a900,0 0 12px rgba(242,169,0,.7)}
.mkbadge.up{transform:translate(-50%,-112%)}
.mkbadge{display:none} .mkbadge.now{display:block}
.mkblk{position:absolute;border-radius:2px;box-shadow:0 0 0 4px #ffc440,0 0 18px rgba(255,196,64,.95);animation:mkblk 1.1s ease-in-out infinite alternate}
@keyframes mkpen{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes mkkey{from{opacity:0}to{opacity:1}} @keyframes mkpress{0%{transform:translateY(0)}35%{transform:translateY(2%)}100%{transform:none}} @keyframes mkbadge{from{transform:translate(-50%,-60%) scale(.4);opacity:0}to{transform:translate(-50%,-118%);opacity:1}}
@keyframes mkblk{from{box-shadow:0 0 0 2px #ffc440,0 0 6px rgba(255,196,64,.5)}to{box-shadow:0 0 0 4px #ffc440,0 0 20px rgba(255,196,64,1)}}
@media (prefers-reduced-motion:reduce){.mkhi,.mkkey,.mkblk{animation:none}}
.hintl .hmask{position:absolute;background:#fff}.hintl .hnew{position:absolute;border:2px solid #e4572e;border-radius:10px;background:rgba(228,87,46,.05);animation:hnew .4s ease}@keyframes hnew{from{opacity:0}to{opacity:1}}.phint{display:block;margin-top:4px;font-size:.82em;color:#8b8db3;font-weight:600}/* her 18 Nov ('전체적으로 너무 깜빡이지 않게'): calm everywhere: things fade in, nothing pulses, zooms or bounces */.lens{animation:calmin .25s ease!important}.mkblk{animation:none!important;box-shadow:0 0 0 3px #ffc440,0 0 10px rgba(255,196,64,.8)}.mkkey.now{animation:calmin .25s ease-out both!important}.mkbadge{animation:calmin .2s ease-out both!important}.mknote,.mk{animation:calmin .25s ease-out both!important}.mkhi{animation:calmin .3s ease-out both!important}@keyframes calmin{from{opacity:0}to{opacity:1}}.sheet.picmode{aspect-ratio:16/10}.sheet.picmode #stage{visibility:hidden;position:absolute;inset:0}.stagepic{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;padding:18px 14px}.stagepic img{max-width:100%;max-height:86%;width:auto;height:auto;display:block}.stagecap{margin-top:12px;font:700 14px "Atkinson Hyperlegible",sans-serif;color:#6d6f9c;letter-spacing:.04em}.sheet.picmode #stage{display:none}.sheet.picmode{background:#fff}.picnav-hide .nav{display:none!important}.titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;text-align:center;padding:30px}.titlecard b{font:700 italic 34px "Playfair Display",Georgia,serif;color:#26296b}.titlecard i{margin-top:10px;font:600 15px "Atkinson Hyperlegible",sans-serif;color:#6d6f9c;font-style:normal}
/* her 25 Nov: the picture lesson. A big stage; the controls sit under it, the clip list beside them; a "Big picture" view fills the screen */
body.pic .desk{grid-template-columns:minmax(0,1fr);max-width:1120px}

.bigbtn{position:absolute;right:10px;top:10px;z-index:5;border:1.5px solid #26296b;background:#fff;color:#26296b;border-radius:999px;padding:5px 12px;font:800 13px "Atkinson Hyperlegible",sans-serif;cursor:pointer;display:none}

.fsplay{display:none}

var PIC_ONLY_K = ['O1','P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','O2','T5','T1','T2','T3','T4','T11','T12'];   // her 25 Nov: in these chapters the Handbook page is never shown
const CH = [{"k": "W", "part": "Welcome", "t": "Welcome", "pages": [1], "clips": [{"t": "Welcome", "f": "audio/W/01-welcome.mp3?v=1795579333", "s": 51, "p": 1, "l": [{"t0": 3.4, "t1": 14.79, "who": "B", "text": "Good day, and welcome. I am the Piano Butler. I look after everything a pianist needs to read and understand music, and I explain it one chapter at a time.", "cue": {"p": 1, "r": "cover"}, "sp": [[3.4, 0, 23], [5.09, 23, 46], [6.87, 46, 155]]}, {"t0": 14.79, "t1": 20.59, "who": "P", "text": "Hello! I am Clara. I can play a few tunes, but I want to know what all the signs on the page mean.", "cue": {"p": 1, "r": "cover"}, "sp": [[14.79, 0, 7], [15.2, 7, 19], [16.38, 19, 98]]}, {"t0": 20.59, "t1": 36.77, "who": "B", "text": "Then you shall be my pupil, Miss Clara. Every chapter starts with one page that holds everything you need. The box marked Remember is the one line to keep. And the worked examples are here, in Read and listen, where we go through them together.", "cue": {"p": 1, "r": "cover"}, "sp": [[20.59, 0, 40], [22.95, 40, 107], [27.33, 107, 156], [30.89, 156, 244]]}, {"t0": 36.77, "t1": 47.75, "who": "B", "text": "You will also meet Their Majesties. The Queen of the Treble rules the high notes and the King of the Bass rules the low ones. They are rather particular about their lines.", "cue": {"p": 1, "r": "cover"}, "sp": [[36.77, 0, 36], [37.71, 36, 126], [44.76, 126, 171]]}, {"t0": 47.75, "t1": 51.4, "who": "P", "text": "A real Queen and King? I had better practise my bow.", "cue": {"p": 1, "r": "cover"}, "sp": [[47.75, 0, 23], [49.16, 23, 52]]}]}]}, {"k": "GD", "part": "Before you play", "t": "How to read this book", "pages": [17]}, {"k": "BP", "part": "Before you play", "t": "Posture and hand shape", "pages": [18, 19, 20], "clips": [{"t": "Before you play", "f": "audio/BP/01-before-you-play.mp3?v=1795579333", "s": 37, "p": 18, "l": [{"t0": 3.4, "t1": 7.19, "who": "P", "text": "Butler! I want to play something right now. Can I just start?", "cue": {"p": 18, "r": "h:Posture and hand shape"}, "sp": [[3.4, 0, 8], [3.6, 8, 44], [5.51, 44, 61]]}, {"t0": 7.19, "t1": 13.16, "who": "B", "text": "In one minute, Clara. First we set up the most important instrument in the room.", "cue": {"p": 18, "r": "h:Posture and hand shape"}, "sp": [[7.19, 0, 22], [8.88, 22, 80]]}, {"t0": 13.16, "t1": 14.74, "who": "P", "text": "The piano?", "cue": {"p": 18, "r": "lead"}}, {"t0": 14.74, "t1": 27.42, "who": "B", "text": "You. How you sit and how you hold your hands decide how easy everything else will be. Set them up before the first note, check them every time you sit down, and soon they look after themselves.", "cue": {"p": 18, "r": "lead"}, "mk": [{"k": "hi", "t": 14.96, "e": 20.43, "p": 18, "r": [[0.1556, 0.1322, 0.448, 0.0187], [0.073, 0.1543, 0.1728, 0.0187]]}, {"k": "hi", "t": 20.43, "e": 27.82, "p": 18, "r": [[0.2846, 0.1543, 0.2988, 0.0187]]}, {"k": "hi", "t": 22.42, "e": 27.82, "p": 18, "r": [[0.073, 0.1763, 0.3257, 0.0187]]}, {"k": "hi", "t": 24.82, "e": 27.82, "p": 18, "r": [[0.4922, 0.1763, 0.1362, 0.0187], [0.073, 0.1984, 0.1029, 0.0187]]}], "sp": [[14.74, 0, 5], [14.96, 5, 86], [20.43, 86, 193]]}, {"t0": 27.42, "t1": 36.55, "who": "B", "text": "Remember this: sit tall, forearms level with the keys, a round hand on the fingertips. Then let the weight of your arm do the work.", "cue": {"p": 18, "r": "secret"}, "mk": [{"k": "hi", "t": 28.47, "e": 33.62, "p": 18, "r": [[0.6814, 0.1529, 0.0588, 0.016]]}, {"k": "hi", "t": 29.21, "e": 33.62, "p": 18, "r": [[0.7504, 0.1529, 0.124, 0.016], [0.6814, 0.1703, 0.1147, 0.016]]}, {"k": "hi", "t": 31.16, "e": 33.62, "p": 18, "r": [[0.8223, 0.1703, 0.0489, 0.016], [0.6814, 0.1877, 0.1922, 0.016]]}, {"k": "hi", "t": 33.62, "e": 36.95, "p": 18, "r": [[0.7252, 0.2051, 0.173, 0.016], [0.6814, 0.2225, 0.1014, 0.016]]}], "sp": [[27.42, 0, 15], [28.47, 15, 87], [33.62, 87, 131]]}]}, {"t": "How to sit", "f": "audio/BP/02-how-to-sit.mp3?v=1795579333", "s": 37, "p": 19, "l": [{"t0": 0.2, "t1": 7.85, "who": "B", "text": "Look at the picture. One: forearms level with the keys, like a table top. The wrist neither drops nor lifts.", "cue": {"p": 18, "r": "hero", "lab": ["1"], "anim": "pen-sit:good"}, "lens": {"k": "pen-sit:good", "at": [], "full": true}, "mk": [{"k": "hi", "t": 1.93, "e": 5.13, "p": 18, "r": [[0.5917, 0.2906, 0.2445, 0.016]]}, {"k": "hi", "t": 5.13, "e": 8.25, "p": 18, "r": [[0.5917, 0.3074, 0.189, 0.0151]]}], "sp": [[0.2, 0, 21], [1.48, 21, 26], [1.93, 26, 74], [5.13, 74, 108]]}, {"t0": 7.85, "t1": 13.18, "who": "B", "text": "Two: elbows a little in front of you, not pinned to your sides like a penguin.", "cue": {"p": 18, "r": "hero", "lab": ["2"], "anim": "pen-front:good"}, "lens": {"k": "pen-front:good", "at": [], "full": true}, "mk": [{"k": "hi", "t": 8.28, "e": 13.58, "p": 18, "r": [[0.5917, 0.331, 0.2518, 0.016], [0.5917, 0.3478, 0.1805, 0.0151]]}], "sp": [[7.85, 0, 5], [8.28, 5, 78]]}, {"t0": 13.18, "t1": 16.08, "who": "P", "text": "Penguins can’t play the piano anyway.", "cue": {"p": 18, "r": "hero", "lab": ["2"], "anim": "pen-front:tight"}, "lens": {"k": "pen-front:tight", "at": [], "full": true}}, {"t0": 16.08, "t1": 28.96, "who": "B", "text": "Quite right. Three: sit on the front half of the stool, opposite Middle C. Four: feet flat on the floor, the right foot near the pedal. Five: back tall, shoulders loose, leaning a little towards the keys.", "cue": {"p": 18, "r": "hero", "lab": ["3"], "anim": "pen-sit:good"}, "lens": {"k": "pen-sit:good", "at": [], "full": true}, "mk": [{"k": "hi", "t": 17.3, "e": 20.45, "p": 18, "r": [[0.5917, 0.3715, 0.274, 0.016], [0.5917, 0.3882, 0.1372, 0.0151]]}, {"k": "hi", "t": 21.01, "e": 23.96, "p": 18, "r": [[0.5917, 0.4119, 0.1758, 0.016], [0.5917, 0.4287, 0.2095, 0.0151]]}, {"k": "hi", "t": 24.7, "e": 29.36, "p": 18, "r": [[0.5917, 0.4523, 0.0757, 0.016]]}, {"k": "hi", "t": 25.34, "e": 29.36, "p": 18, "r": [[0.6776, 0.4523, 0.1371, 0.016]]}], "sp": [[16.08, 0, 13], [16.69, 13, 20], [17.3, 20, 75], [20.45, 75, 81], [21.01, 81, 136], [23.96, 136, 142], [24.7, 142, 204]]}, {"t0": 28.96, "t1": 37.02, "who": "B", "text": "If the stool is too low, raise it, or sit on a cushion. A telephone book works too, if anyone still has one.", "cue": {"p": 18, "r": "hero", "lab": ["5"], "anim": "pen-sit:low"}, "lens": {"k": "pen-sit:low", "at": [], "full": true}, "sp": [[28.96, 0, 56], [33.0, 56, 108]]}]}, {"t": "A round hand", "f": "audio/BP/03-a-round-hand.mp3?v=1795579333", "s": 30, "p": 19, "l": [{"t0": 0.2, "t1": 13.32, "who": "B", "text": "Now the hands. Imagine a soft ball resting under your palm. That shape is your playing hand: knuckles up like a bridge, fingers curved, and the sound comes from the fingertip, just behind the nail.", "cue": {"p": 18, "r": "two", "anim": "pen-hand:good"}, "lens": {"k": "pen-hand:good", "at": [], "full": true}, "mk": [{"k": "hi", "t": 4.4, "e": 6.43, "p": 18, "r": [[0.586, 0.729, 0.1079, 0.016]]}, {"k": "hi", "t": 6.43, "e": 13.72, "p": 18, "r": [[0.0762, 0.7181, 0.1993, 0.016]]}, {"k": "hi", "t": 11.36, "e": 13.72, "p": 18, "r": [[0.4905, 0.7827, 0.1242, 0.016]]}], "sp": [[0.2, 0, 15], [1.31, 15, 60], [4.4, 60, 93], [6.43, 93, 197]]}, {"t0": 13.32, "t1": 22.51, "who": "B", "text": "The thumb plays on the side of its tip, relaxed. And the wrist stays level and loose. It never rests on the wood, however tired it is.", "cue": {"p": 18, "r": "ht", "anim": "pen-hand:low"}, "lens": {"k": "pen-hand:low", "at": [], "full": true}, "mk": [{"k": "hi", "t": 13.32, "e": 16.42, "p": 18, "r": [[0.0831, 0.8312, 0.541, 0.016]]}, {"k": "hi", "t": 16.42, "e": 18.88, "p": 18, "r": [[0.0831, 0.8555, 0.4649, 0.016]]}, {"k": "hi", "t": 18.88, "e": 22.91, "p": 18, "r": [[0.5571, 0.8555, 0.215, 0.016]]}], "sp": [[13.32, 0, 49], [16.42, 49, 86], [18.88, 86, 134]]}, {"t0": 22.51, "t1": 25.08, "who": "P", "text": "So I keep my nails short too?", "cue": {"p": 18, "r": "ht"}, "mk": [{"k": "hi", "t": 22.51, "e": 25.48, "p": 18, "r": [[0.6256, 0.7827, 0.1319, 0.016]]}]}, {"t0": 25.08, "t1": 30.45, "who": "B", "text": "Short nails, happy keys. A long nail clicks like a tap-dancing mouse.", "cue": {"p": 18, "r": "ht"}, "mk": [{"k": "hi", "t": 25.08, "e": 27.17, "p": 18, "r": [[0.671, 0.7827, 0.0865, 0.016]]}], "sp": [[25.08, 0, 25], [27.17, 25, 69]]}]}, {"t": "Finger numbers", "f": "audio/BP/04-finger-numbers.mp3?v=1795579333", "s": 79, "p": 19, "l": [{"t0": 0.2, "t1": 12.63, "who": "B", "text": "Every finger has a number, the same in both hands. The thumb is one, then two, three, four, and the little finger is five. Music often prints these numbers above or below the notes.", "cue": {"p": 19, "r": "two", "anim": "pen-fing:cycle"}, "lens": {"k": "pen-fing:cycle", "at": [], "full": true}, "mk": [{"k": "hi", "t": 0.2, "e": 3.4, "p": 19, "r": [[0.6093, 0.1309, 0.2813, 0.016], [0.5597, 0.1509, 0.0994, 0.016]]}, {"k": "hi", "t": 3.4, "e": 8.33, "p": 19, "r": [[0.7, 0.1509, 0.1886, 0.016], [0.5597, 0.171, 0.1578, 0.016]]}, {"k": "hi", "t": 8.33, "e": 13.03, "p": 19, "r": [[0.7629, 0.171, 0.1502, 0.016], [0.5597, 0.191, 0.3366, 0.016]]}], "sp": [[0.2, 0, 51], [3.4, 51, 123], [8.33, 123, 181]]}, {"t0": 12.63, "t1": 16.57, "who": "P", "text": "So my left thumb is one too, even though it’s on the other side?", "cue": {"p": 19, "r": "two", "anim": "pen-fing:cycle"}, "lens": {"k": "pen-fing:cycle", "at": [], "full": true}}, {"t0": 16.57, "t1": 22.84, "who": "B", "text": "Exactly. Thumbs are always one. Now six warm-ups before you play. Watch them move.", "cue": {"p": 19, "r": "h:Six warm-ups"}, "mk": [{"k": "hi", "t": 19.06, "e": 21.18, "p": 19, "r": [[0.073, 0.2987, 0.137, 0.0187]]}], "sp": [[16.57, 0, 9], [17.32, 9, 32], [19.06, 32, 66], [21.18, 66, 82]]}, {"t0": 22.84, "t1": 30.3, "who": "B", "text": "One, rag doll: flop forward, arms hanging heavy. Shake them loose, then float the hands up onto the keys.", "cue": {"p": 19, "r": "wu6", "anim": "warm-ragdoll"}, "lens": {"k": "warm-ragdoll", "at": [], "full": true}, "mk": [{"k": "hi", "t": 22.84, "e": 24.12, "p": 19, "r": [[0.0984, 0.4109, 0.0716, 0.016]]}, {"k": "hi", "t": 24.12, "e": 26.45, "p": 19, "r": [[0.073, 0.431, 0.25, 0.0151]]}, {"k": "hi", "t": 26.45, "e": 30.7, "p": 19, "r": [[0.073, 0.4472, 0.2569, 0.0151], [0.073, 0.4634, 0.1231, 0.0151]]}], "sp": [[22.84, 0, 15], [24.12, 15, 49], [26.45, 49, 105]]}, {"t0": 30.3, "t1": 32.94, "who": "P", "text": "I’m a rag doll! Floppy, floppy.", "cue": {"p": 19, "r": "wu6", "anim": "warm-ragdoll"}, "lens": {"k": "warm-ragdoll", "at": [], "full": true}, "mk": [{"k": "hi", "t": 30.3, "e": 31.5, "p": 19, "r": [[0.0984, 0.4109, 0.0716, 0.016]]}], "sp": [[30.3, 0, 16], [31.07, 16, 31]]}, {"t0": 32.94, "t1": 39.72, "who": "B", "text": "Two, elbow wings: elbows free, not stuck to your body. Float them out like wings, then back.", "cue": {"p": 19, "r": "wu6", "anim": "warm-wings"}, "lens": {"k": "warm-wings", "at": [], "full": true}, "mk": [{"k": "hi", "t": 32.94, "e": 34.42, "p": 19, "r": [[0.3914, 0.4109, 0.1068, 0.016]]}, {"k": "hi", "t": 34.42, "e": 36.93, "p": 19, "r": [[0.3635, 0.431, 0.2591, 0.0151]]}, {"k": "hi", "t": 36.93, "e": 40.12, "p": 19, "r": [[0.3635, 0.4472, 0.268, 0.0151]]}], "sp": [[32.94, 0, 18], [34.42, 18, 55], [36.93, 55, 92]]}, {"t0": 39.72, "t1": 49.43, "who": "B", "text": "Three, arm glide: skate the whole arm along the keys. The round hand rides to the next group of keys. The fingers ride; they don’t walk.", "cue": {"p": 19, "r": "wu6", "anim": "warm-glide"}, "lens": {"k": "warm-glide", "at": [], "full": true}, "mk": [{"k": "hi", "t": 39.72, "e": 41.13, "p": 19, "r": [[0.6823, 0.4109, 0.0845, 0.016]]}, {"k": "hi", "t": 41.13, "e": 43.61, "p": 19, "r": [[0.6541, 0.431, 0.2639, 0.0151]]}, {"k": "hi", "t": 43.61, "e": 46.63, "p": 19, "r": [[0.8851, 0.431, 0.0329, 0.0151], [0.6541, 0.4472, 0.2437, 0.0151], [0.6541, 0.4634, 0.0434, 0.0151]]}], "sp": [[39.72, 0, 18], [41.13, 18, 54], [43.61, 54, 102], [46.63, 102, 120], [47.91, 120, 136]]}, {"t0": 49.43, "t1": 58.19, "who": "B", "text": "Fo , 83, 112]]}, {"t0": 23.68, "t1": 28.74, "who": "P", "text": "C: knuckles up, curved fingers, standing on the tips. And B’s knuckle has caved in.", "cue": {"p": 19, "r": "ex1", "reveal": true, "anim": "pen-hand:cycle-ex"}, "lens": {"k": "pen-hand:cycle-ex", "at": [], "full": true}, "mk": [{"k": "hi", "t": 23.86, "e": 26.6, "p": 19, "r": [[0.2279, 0.8099, 0.1066, 0.016]]}, {"k": "hi", "t": 24.42, "e": 26.6, "p": 19, "r": [[0.2186, 0.8567, 0.1182, 0.016]]}, {"k": "hi", "t": 25.2, "e": 26.6, "p": 19, "r": [[0.3459, 0.8567, 0.1657, 0.016]]}, {"k": "hi", "t": 26.6, "e": 29.14, "p": 19, "r": [[0.5929, 0.8567, 0.1812, 0.016]]}], "sp": [[23.68, 0, 3], [23.86, 3, 54], [26.6, 54, 83]]}, {"t0": 28.74, "t1": 36.11, "who": "B", "text": "Example two. Is the stool right? Follow the forearm from the elbow to the keys. Uphill or downhill?", "cue": {"p": 20, "r": "ex2"}, "mk": [{"k": "hi", "t": 29.86, "e": 31.23, "p": 20, "r": [[0.1488, 0.1158, 0.0933, 0.016]]}, {"k": "hi", "t": 31.23, "e": 34.02, "p": 20, "r": [[0.1247, 0.3096, 0.2043, 0.016], [0.1247, 0.3277, 0.1694, 0.016]]}, {"k": "hi", "t": 34.02, "e": 36.51, "p": 20, "r": [[0.4034, 0.3096, 0.1518, 0.016]]}], "sp": [[28.74, 0, 13], [29.86, 13, 33], [31.23, 33, 80], [34.02, 80, 99]]}, {"t0": 36.11, "t1": 40.11, "who": "pause", "text": "Pause and try.", "cue": {"p": 20, "r": "ex2"}}, {"t0": 40.11, "t1": 45.87, "who": "P", "text": "B is level. In A the arm goes uphill, so the stool is too low. In C it goes downhill: too high.", "cue": {"p": 20, "r": "ex2", "reveal": true, "anim": "pen-sit:cycle"}, "lens": {"k": "pen-sit:cycle", "at": [], "full": true}, "mk": [{"k": "hi", "t": 40.11, "e": 41.31, "p": 20, "r": [[0.795, 0.3096, 0.0365, 0.016], [0.0894, 0.3745, 0.0121, 0.016]]}, {"k": "hi", "t": 40.63, "e": 43.39, "p": 20, "r": [[0.4034, 0.3096, 0.2079, 0.016], [0.4034, 0.3277, 0.1512, 0.016]]}, {"k": "hi", "t": 44.65, "e": 46.27, "p": 20, "r": [[0.5811, 0.3277, 0.0261, 0.016], [0.4034, 0.3458, 0.0353, 0.016]]}], "sp": [[40.11, 0, 12], [40.63, 12, 63], [43.39, 63, 86], [44.65, 86, 95]]}, {"t0": 45.87, "t1": 53.52, "who": "B", "text": "Now the thirty-second check, from the stool to your fingertips. Do it every time you sit down. Do it with me now.", "cue": {"p": 20, "r": "howto"}, "mk": [{"k": "hi", "t": 45.87, "e": 49.88, "p": 20, "r": [[0.2336, 0.4315, 0.2759, 0.016], [0.1196, 0.4511, 0.0464, 0.016]]}, {"k": "hi", "t": 49.88, "e": 51.86, "p": 20, "r": [[0.3502, 0.4315, 0.1593, 0.016]]}], "sp": [[45.87, 0, 64], [49.88, 64, 95], [51.86, 95, 113]]}, {"t0": 53.52, "t1": 60.43, "who": "B", "text": "One, the stool. Sit opposite Middle C. Are your forearms level with the keys, like a table top?", "cue": {"p": 18, "r": "hero", "lab": ["1", "3"], "anim": "pen-sit:good"}, "lens": {"k": "pen-sit:good", "at": [], "full": true}, "mk": [{"k": "hi", "t": 54.73, "e": 56.59, "p": 18, "r": [[0.5917, 0.3882, 0.1372, 0.0151]]}, {"k": "hi", "t": 56.59, "e": 60.83, "p": 18, "r": [[0.5917, 0.2906, 0.2445, 0.016]]}], "sp": [[53.52, 0, 16], [54.73, 16, 39], [56.59, 39, 95]]}, {"t0": 60.43, "t1": 63.43, "who": "pause", "text": "Pause and try.", "cue": {"p": 18, "r": "hero", "lab": ["1", "3"]}}, {"t0": 63.43, "t1": 68.31, "who": "B", "text": "Two, the body. Front half of the stool, both feet flat, back tall.", "cue": {"p": 18, "r": "hero", "lab": ["3", "4", "5"], "anim": "pen-sit:good"}, "lens": {"k": "pen-sit:good", "at": [], "full": true}, "mk": [{"k": "hi", "t": 64.53, "e": 68.71, "p": 18, "r": [[0.6799, 0.3715, 0.1858, 0.016]]}, {"k": "hi", "t": 66.84, "e": 68.71, "p": 18, "r": [[0.5917, 0.4523, 0.0757, 0.016]]}], "sp": [[63.43, 0, 15], [64.53, 15, 66]]}, {"t0": 68.31, "t1": 71.31, "who": "pause", "text": "Pause and try.", "cue": {"p": 18, "r": "hero", "lab": ["3", "4", "5"]}}, {"t0": 71.31, "t1": 76.13, "who": "B", "text": "Three, the shoulders. Lift them up to your ears. And let them drop.", "cue": {"p": 18, "r": "hero", "lab": ["5"]}, "sp": [[71.31, 0, 22], [72.63, 22, 49], [74.37, 49, 67]]}, {"t0": 76.13, "t1": 79.13, "who": "pause", "text": "Pause and try.", "cue": {"p": 18, "r": "hero", "lab": ["5"]}}, {"t0": 79.13, "t1": 87.89, "who": "B", "text": "Four, the hands. A soft ball under each palm, knuckles up, standing on the fingertips. Wrists level, not resting on the wood.", "cue": {"p": 18, "r": "two", "anim": "pen-hand:good"}, "lens": {"k": "pen-hand:good", "at": [], "full": true}, "mk": [{"k": "hi", "t": 85.05, "e": 88.29, "p": 18, "r": [[0.3393, 0.8555, 0.4328, 0.016]]}], "sp": [[79.13, 0, 17], [80.47, 17, 87], [85.05, 87, 125]]}, {"t0": 87.89, "t1": 90.89, "who": "pause", "text": "Pause and try.", "cue": {"p": 18, "r": "two"}}, {"t0": 90.89, "t1": 94.64, "who": "B", "text": "And five: breathe out. Now you are ready to play.", "cue": {"p": 20, "r": "howto"}, "mk": [{"k": "hi", "t": 91.47, "e": 92.67, "p": 20, "r": [[0.1196, 0.5223, 0.1036, 0.016]]}], "sp": [[90.89, 0, 10], [91.47, 10, 23], [92.51, 23, 49]]}, {"t0": 94.64, "t1": 98.71, "who": "P", "text": "Stool, body, shoulders, hands, breathe. Done in thirty seconds!", "cue": {"p": 20, "r": "howto"}, "mk": [{"k": "hi", "t": 94.64, "e": 96.75, "p": 20, "r": [[0.1196, 0.4511, 0.0464, 0.016]]}, {"k": "hi", "t": 94.99, "e": 96.75, "p": 20, "r": [[0.1196, 0.4689, 0.0439, 0.016]]}, {"k": "hi", "t": 95.29, "e": 96.75, "p": 20, "r": [[0.1196, 0.4867, 0.0889, 0.016]]}, {"k": "hi", "t": 95.82, "e": 96.82, "p": 20, "r": [[0.1196, 0.5045, 0.0553, 0.016]]}, {"k": "hi", "t": 96.21, "e": 97.21, "p": 20, "r": [[0.1196, 0.5223, 0.0688, 0.016]]}], "sp": [[94.64, 0, 40], [96.75, 40, 63]]}, {"t0": 98.71, "t1": 105.62, "who": "B", "text": "Try it: hold a small ball or an orange, then put your hand on the keys without changing its shape.", "cue": {"p": 20, "r": "try10"}, "mk": [{"k": "hi", "t": 99.2, "e": 106.02, "p": 20, "r": [[0.474, 0.6109, 0.4303, 0.016], [0.474, 0.631, 0.2964, 0.016]]}], "sp": [[98.71, 0, 8], [99.2, 8, 98]]}, {"t0": 105.62, "t1": 108.22, "who": "P", "text": "Can I eat the orange afterwards?", "cue": {"p": 20, "r": "tr  {"t0": 13.88, "t1": 20.21, "who": "B", "text": "Remember: sharp, the very next key to the right. Flat, the very next key to the left.", "cue": {"p": 33, "r": "remember"}, "mk": [{"k": "hi", "t": 14.34, "e": 17.14, "p": 33, "r": [[0.097, 0.2517, 0.2732, 0.0209]]}, {"k": "hi", "t": 17.14, "e": 20.61, "p": 33, "r": [[0.5197, 0.2517, 0.2517, 0.0209]]}], "sp": [[13.88, 0, 10], [14.34, 10, 49], [17.14, 49, 85]], "lens": {"k": "stage", "src": "pops/LP-P8-0.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}, {"t0": 20.21, "t1": 23.74, "who": "piano", "notes": [20.21, 20.83, 21.7, 22.32], "cue": {"p": 33, "r": "picture"}, "mk": [{"k": "key", "t": 20.21, "e": 23.74, "p": 33, "r": [[0.3654, 0.296, 0.0897, 0.205]], "n": "D", "snd": 1}, {"k": "key", "t": 20.83, "e": 23.74, "p": 33, "r": [[0.4292, 0.296, 0.052, 0.123]], "n": "D♯", "snd": 1}, {"k": "key", "t": 21.7, "e": 23.74, "p": 33, "r": [[0.3654, 0.296, 0.0897, 0.205]], "n": "D", "snd": 1}, {"k": "key", "t": 22.32, "e": 23.74, "p": 33, "r": [[0.3395, 0.296, 0.052, 0.123]], "n": "D♭", "snd": 1}], "lens": {"k": "stage", "src": "pops/LP-P8-0.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}, {"t0": 23.74, "t1": 30.73, "who": "B", "text": "And the natural cancels them both: back to the white key. Together these signs are called accidentals.", "cue": {"p": 33, "r": "table"}, "mk": [{"k": "hi", "t": 23.74, "e": 25.88, "p": 33, "r": [[0.1868, 0.6585, 0.064, 0.018], [0.3576, 0.6484, 0.07, 0.018]]}, {"k": "hi", "t": 25.88, "e": 27.46, "p": 33, "r": [[0.573, 0.6484, 0.1595, 0.018], [0.3576, 0.6686, 0.0305, 0.018]]}], "sp": [[23.74, 0, 35], [25.88, 35, 58], [27.46, 58, 102]], "lens": {"k": "stage", "src": "pops/LP-P8-0.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}]}, {"t": "One line, one bar", "f": "audio/P8/02-one-line-one-bar.mp3?v=1795579333", "s": 68, "p": 33, "l": [{"who": "B", "text": "Remember the semitone: the very next key, black or white. Where there is no black key between, the next key is white: E sharp is F, and C flat is B. And every black key has two names: C sharp is D flat.", "cue": {"p": 33, "r": "more"}, "t0": 0.2, "t1": 14.42, "mk": [{"k": "hi", "t": 1.61, "e": 3.96, "p": 33, "r": [[0.242, 0.7027, 0.1154, 0.018]]}, {"k": "hi", "t": 3.96, "e": 7.16, "p": 33, "r": [[0.7043, 0.7027, 0.2087, 0.018], [0.073, 0.7244, 0.2343, 0.018]]}, {"k": "hi", "t": 7.16, "e": 10.05, "p": 33, "r": [[0.8804, 0.7027, 0.0326, 0.018], [0.073, 0.7244, 0.0359, 0.018]]}, {"k": "key", "t": 7.83, "e": 12.17, "p": 33, "r": [[0.6073, 0.7967, 0.0488, 0.1035]], "n": "F"}, {"k": "key", "t": 9.22, "e": 12.17, "p": 33, "r": [[0.7683, 0.7967, 0.0488, 0.1035]], "n": "B"}, {"k": "hi", "t": 10.05, "e": 12.17, "p": 33, "r": [[0.753, 0.7244, 0.157, 0.018], [0.073, 0.7461, 0.0596, 0.018]]}, {"k": "hi", "t": 12.17, "e": 14.82, "p": 33, "r": [[0.4506, 0.6484, 0.1121, 0.018]]}], "sp": [[0.2, 0, 23], [1.61, 23, 58], [3.96, 58, 118], [7.16, 118, 149], [10.05, 149, 184], [12.17, 184, 202]], "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}, {"who": "P", "text": "So E sharp is really F wearing a disguise.", "cue": {"p": 33, "r": "more"}, "t0": 14.42, "t1": 17.67, "mk": [{"k": "key", "t": 15.62, "e": 18.07, "p": 33, "r": [[0.1877, 0.7967, 0.0488, 0.1035], [0.6073, 0.7967, 0.0488, 0.1035]], "n": "F"}], "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}, {"who": "B", "text": "A very thin disguise.", "cue": {"p": 33, "r": "more"}, "t0": 17.67, "t1": 20.24, "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}, {"t0": 20.24, "t1": 27.87, "who": "B", "text": "The rule: a sign changes only that line or space, in that octave, and only until the bar line.", "cue": {"p": 34, "r": "rule"}, "mk": [{"k": "nt", "t": 20.24, "e": 28.27, "p": 34, "r": [[0.1964, 0.3921, 0.0113, 0.0235]], "n": "F♯", "pop": "P8-2"}, {"k": "key", "t": 20.24, "e": 28.27, "p": 34, "r": [[0.7583, 0.194, 0.0313, 0.2294]], "n": "F♯", "pop": "P8-2"}, {"k": "nt", "t": 25.41, "e": 28.27, "p": 34, "r": [[0.2656, 0.3921, 0.0113, 0.0235]], "n": "F♯", "pop": "P8-2"}, {"k": "nt", "t": 25.71, "e": 28.27, "p": 34, "r": [[0.4041, 0.3921, 0.0113, 0.0235]], "n": "F♯", "pop": "P8-2"}], "sp": [[20.24, 0, 10], [21.03, 10, 94]], "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}, {"who": "B", "text": "Think of it like this. A sharp or flat written in the music is a Guest on a visitor's pass. A sharp lifts the note to the very next key on the right, a flat lowers it to the very next key on the left. Her pass covers every note on that line or space, but only for one bar.", "cue": {"p": 34, "r": "rule"}, "t0": 27.87, "t1": 45.74, "mk": [{"k": "nt", "t": 33.5, "e": 45.74, "p": 34, "r": [[0.1964, 0.3921, 0.0113, 0.0235]], "n": "F♯", "pop": "P8-2"}, {"k": "key", "t": 33.5, "e": 45.74, "p": 34, "r": [[0.7583, 0.194, 0.0313, 0.2294]], "n": "F♯", "pop": "P8-2"}, {"k": "nt", "t": 41.29, "e": 45.74, "p": 34, "r": [[0.2656, 0.3921, 0.0113, 0.0235]], "n": "F♯", "pop": "P8-2"}, {"k": "nt", "t": 41.67, "e": 45.74, "p": 34, "r": [[0.4041, 0.3921, 0.0113, 0.0235]], "n": "F♯", "pop": "P8-2"}], "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}, "sp": [[27.87, 0, 23], [29.31, 23, 92], [33.79, 92, 201], [40.41, 201, 272]]}, {"t0": 45.74, "t1": 52.8, "who": "G", "text": "Good day, darling. I am the Guest. My pass runs out at the bar line. New bar, new pass, so the sign is written again.", "cue": {"p": 34, "r": "rule"}, "mk": [{"k": "nt", "t": 49.36, "e": 52.8, "p": 34, "r": [[0.1964, 0.3921, 0.0113, 0.0235]], "n": "F♯", "pop": "P8-2"}, {"k": "nt", "t": 49.67, "e": 52.8, "p": 34, "r": [[0.2656, 0.3921, 0.0113, 0.0235]], "n": "F♯", "pop": "P8-2"}, {"k": "nt", "t": 49.97, "e": 52.8, "p": 34, "r": [[0.4041, 0.3921, 0.0113, 0.0235]], "n": "F♯", "pop": "P8-2"}], "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}, "sp": [[45.74, 0, 19], [46.6, 19, 35], [47.86, 35, 69], [49.81, 69, 117]]}, {"t0": 52.8, "t1": 55.96, "who": "P", "text": "And after the bar line, the note is plain again.", "cue": {"p": 34, "r": "trap"}, "mk": [{"k": "nt", "t": 52.8, "e": 56.36, "p": 34, "r": [[0.4806, 0.3921, 0.0113, 0.0235]], "n": "F", "pop": "P8-2"}, {"k": "key", "t": 52.8, "e": 56.36, "p": 34, "r": [[0.72, 0.194, 0.0539, 0.3825]], "n": "F", "pop": "P8-2"}], "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}, {"t0": 55.96, "t1": 68.05, "who": "B", "text": "Quite right. A key signature is different: those notes are permanent residents. Their papers are shown once, up front, and they stay the whole piece. That comes in Key signatures.", "cue": {"p": 34, "r": "body"}, "sp": [[55.96, 0, 13], [56.75, 13, 43], [58.65, 43, 80], [61.11, 80, 150], [65.47, 150, 179]], "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}]}, {"t": "Example: find F sharp and B flat", "f": "audio/P8/03-example-find-f-sharp-and-b-flat.mp3?v=1795579333", "s": 20, "p": 32, "l": [{"t0": 0.2, "t1": 7.98, "who": "B", "text": "Find F and B, then go one key right for F sharp and one key left for B flat. Pause and find them.", "cue": {"p": 33, "r": "pop1"}, "lens": {"k": "stage", "src": "pops/P8-1-q.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}, "sp": [[0.2, 0, 77], [5.93, 77, 97]]}, {"t0": 7.98, "t1": 11.98, "who": "pause", "text": "Pause and try.", "cue": {"p": 33, "r": "pop1"}, "lens": {"k": "stage", "src": "pops/P8-1-q.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}, {"t0": 11.98, "t1": 16.52, "who": "P", "text": "F sharp is the first black key of the three. B flat is the highest one.", "cue": {"p": 33, "r": "pop1"}, "lens": {"k": "stage", "src": "pops/P8-1.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}, "sp": [[11.98, 0, 45], [14.39, 45, 71]], "mk": [{"k": "key", "t": 11.98, "e": 16.92, "p": 33, "r": [[0.479, 0.1347, 0.0573, 0.2714]], "n": "F♯", "pop": "P8-1"}, {"k": "key", "t": 14.39, "e": 16.92, "p": 33, "r": [[0.6766, 0.1347, 0.0573, 0.2714]], "n": "B♭", "pop": "P8-1"}]}, {"t0": 16.52, "t1": 18.05, "who": "B", "text": "Well done.", "cue": {"p": 33, "r": "pop1"}, "lens": {"k": "stage", "src": "pops/P8-1.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}, {"t0": 18.05, "t1": 19.59, "who": "piano", "notes": [18.05, 18.67], "cue": {"p": 33, "r": "pop1"}, "lens": {"k": "stage", "src": "pops/P8-1.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}, "mk": [{"k": "key", "t": 18.05, "e": 19.51, "p": 33, "r": [[0.479, 0.1347, 0.0573, 0.2714]], "n": "F♯", "pop": "P8-1", "snd": 1}, {"k": "key", "t": 18.67, "e": 19.51, "p": 33, "r": [[0.6766, 0.1347, 0.0573, 0.2714]], "n": "B♭", "pop": "P8-1", "snd": 1}]}]}, {"t": "Example: how long does a sharp last?", "f": "audio/P8/04-example-how-long-does-a-sharp-last.mp3?v=1795579333", "s": 38, "p": 32, "l": [{"t0": 0.2, "t1": 9.82, "who": "B", "text": "The first note is F sharp. Later in the bar, an F with no sign. Then another after the bar line. Sharp or not? Pause and think.", "cue": {"p": 33, "r": "pop2"}, "lens": {"k": "stage", "src": "pops/P8-2-q.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}, "sp": [[0.2, 0, 27], [2.14, 27, 64], [4.82, 64, 97], [6.8, 97, 111], [7.98, 111, 127]]}, {"t0": 9.82, "t1": 13.82, "who": "pause", "text": "Pause and try.", "cue": {"p": 33, "r": "pop2"}, "lens": {"k": "stage", "src": "pops/P8-2-q.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}, {"who": "P", "text": "Still F sharp. The sign is right there.", "cue": {"p": 33, "r": "pop2"}, "t0": 13.82, "lens": {"k": "stage", "src": "pops/P8-2-q.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}, "t1": 16.71}, {"who": "B", "text": "Ah, that one catches everybody. Remember our Guest: her pass runs out at the bar line. Which side of the bar line is this F?", "cue": {"p": 33, "r": "pop2"}, "t0": 16.71, "lens": {"k": "stage", "src": "pops/P8-2-q.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}, "t1": 25.85, "sp": [[16.71, 0, 32], [19.05, 32, 52], [20.45, 52, 87], [22.82, 87, 124]]}, {"t0": 25.85, "t1": 29.92, "who": "P", "text": "Still F sharp until the bar line. After it, plain F again.", "cue": {"p": 33, "r": "pop2"}, "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}, "mk": [{"k": "nt", "t": 26.05, "e": 27.86, "p": 33, "r": [[0.1964, 0.3921, 0.0113, 0.0235]], "n": "F♯", "pop": "P8-2"}, {"k": "nt", "t": 28.62, "e": 30.32, "p": 33, "r": [[0.1964, 0.3921, 0.0113, 0.0235]], "n": "F", "pop": "P8-2"}, {"k": "key", "t": 28.62, "e": 30.32, "p": 33, "r": [[0.72, 0.194, 0.0539, 0.3825]], "n": "F", "pop": "P8-2"}], "sp": [[25.85, 0, 34], [27.86, 34, 58]]}, {"who": "G", "text": "No pass, no entry. New bar, new pass.", "cue": {"p": 33, "r": "pop2"}, "t0": 29.92, "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}, "t1": 32.92, "sp": [[29.92, 0, 19], [31.13, 19, 37]]}, {"t0": 32.92, "t1": 34.47, "who": "B", "text": "Spot on.", "cue": {"p": 33, "r": "pop2"}, "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and naturals"}}, {"t0": 34.47, "t1": 37.87, "who": "piano", "notes": [34.47, 35.09, 35.71, 36.33, 36.95], "cue": {"p": 33, "r": "pop2"}, "lens": {"k": "stage", "src": "pops/P8-2.webp?v=1795579333", "cap": "Part I · Pitch · 8 · Sharps, flats and na .31, "e": 16.38, "p": 40, "r": [[0.073, 0.3049, 0.3632, 0.0165]]}, {"k": "hi", "t": 16.38, "e": 20.52, "p": 40, "r": [[0.4632, 0.3049, 0.2684, 0.0165]]}], "sp": [[10.9, 0, 41], [14.31, 41, 84], [16.38, 84, 116]], "lens": {"k": "stage", "src": "pops/LR-T1-7.webp?v=1795579333", "cap": "Part II · Rhythm · 2 · Notes"}}]}, {"t": "Notes as pizzas", "f": "audio/T1/02-whole-half-and-quarter.mp3?v=1795579333", "s": 24, "p": 40, "l": [{"t0": 0.2, "t1": 13.77, "who": "B", "text": "Think of each beat as a pizza: a bar of four-four is four pizzas. The semibreve fills all four. The minim, crotchet, quaver and semiquaver are a half, a quarter, an eighth and a sixteenth of it.", "cue": {"p": 40, "r": "pop1"}, "lens": {"k": "stage", "src": "pops/T1-pizza.webp?v=1795579333", "cap": "Part II · Rhythm · 2 · Notes"}, "sp": [[0.2, 0, 31], [2.03, 31, 66], [4.55, 66, 96], [6.81, 96, 194]], "mk": [{"k": "blk", "t": 4.68, "e": 7.66, "pop": "T1-pizza", "r": [[0, 0.2649, 1, 0.0465]]}, {"k": "blk", "t": 7.66, "e": 13.77, "pop": "T1-pizza", "r": [[0, 0.4089, 1, 0.0465], [0, 0.553, 1, 0.0465], [0, 0.6924, 1, 0.0465], [0, 0.8364, 1, 0.0465]]}]}, {"t0": 13.77, "t1": 16.47, "who": "P", "text": "And two quavers share one pizza.", "cue": {"p": 40, "r": "pop1"}, "lens": {"k": "stage", "src": "pops/T1-pizza.webp?v=1795579333", "cap": "Part II · Rhythm · 2 · Notes"}, "mk": [{"k": "blk", "t": 13.77, "e": 16.47, "pop": "T1-pizza", "r": [[0, 0.6924, 1, 0.0465]]}]}, {"t0": 16.47, "t1": 23.53, "who": "B", "text": "Precisely. Draw the notes yourself, too: it is the quickest way to remember them. Until next time.", "cue": {"p": 40, "r": "pop2"}, "lens": {"k": "stage", "src": "pops/T1-2.webp?v=1795579333", "cap": "Part II · Rhythm · 2 · Notes"}, "sp": [[16.47, 0, 11], [17.45, 11, 41], [19.39, 41, 82], [21.65, 82, 98]]}]}], "nx": {"wb": [null, "pp. 31–32", "Rhythm"], "dr": [["note-values", "How many beats?", 2, "nv=semibreve,minim,crotchet,quaver,semiquaver"]]}}, {"k": "T2", "part": "Part II · Rhythm", "t": "3 · 28, "p": 41, "r": [[0.1147, 0.5979, 0.329, 0.0123]]}, {"k": "hi", "t": 13.28, "e": 17.06, "p": 41, "r": [[0.6119, 0.6158, 0.2674, 0.017], [0.073, 0.6371, 0.2584, 0.017]]}, {"k": "hi", "t": 21.35, "e": 24.08, "p": 41, "r": [[0.1419, 0.6583, 0.1221, 0.017]]}], "sp": [[10.46, 0, 44], [13.28, 44, 102], [17.06, 102, 165], [21.35, 165, 191]], "lens": {"k": "stage", "src": "pops/LR-T2-5.webp?v=1795579333", "cap": "Part II · Rhythm · 3 · Rests"}}]}, {"t": "One trap", "f": "audio/T2/01g-one-trap.mp3?v=1795579333", "s": 9, "p": 41, "l": [{"t0": 0.2, "t1": 8.71, "who": "B", "text": "One trap: do not mix up those two. Hanging below line four, the semibreve rest. Sitting on line three, the minim rest.", "cue": {"p": 41, "r": "trap"}, "mk": [{"k": "hi", "t": 0.79, "e": 2.66, "p": 41, "r": [[0.1711, 0.8128, 0.092, 0.017]]}, {"k": "hi", "t": 2.66, "e": 5.71, "p": 41, "r": [[0.3886, 0.8128, 0.2825, 0.017]]}, {"k": "hi", "t": 5.71, "e": 9.11, "p": 41, "r": [[0.6396, 0.8128, 0.1875, 0.017]]}], "sp": [[0.2, 0, 10], [0.79, 10, 35], [2.66, 35, 80], [5.71, 80, 118]], "lens": {"k": "stage", "src": "pops/LR-T2-6.webp?v=1795579333", "cap": "Part II · Rhythm · 3 · Rests"}}]}, {"t": "Example: count the silences", "f": "audio/T2/02-example-count-the-silences.mp3?v=1795579333", "s": 22, "p": 41, "l": [{"t0": 0.2, "t1": 7.0, "who": "B", "text": "A minim, a crotchet and a crotchet rest. How many beats does the bar hold? Pause and add them.", "cue": {"p": 41, "r": "pop2"}, "lens": {"k": "stage", "src": "pops/T2-2-q.webp?v=1795579333", "cap": "Part II · Rhythm · 3 · Rests"}, "sp": [[0.2, 0, 41], [2.82, 41, 75], [4.96, 75, 94]]}, {"t0": 7.0, "t1": 11.0, "who": "pause", "text": "Pause and try.", "cue": {"p": 41, "r": "pop2"}, "lens": {"k": "stage", "src": "pops/T2-2-q.webp?v=1795579333", "cap": "Part II · Rhythm · 3 · Rests"}}, {"t0": 11.0, "t1": 14.07, "who": "P", "text": "Two, one, and one for the rest: four beats!", "cue": {"p": 41, "r": "pop2"}, "lens": {"k": "stage", "src": "pops/T2-2.webp?v=1795 ", "text": "A crotchet rest. Two plus one plus one: the bar is full.", "cue": {"p": 41, "r": "pop3"}, "lens": {"k": "stage", "src": "pops/T2-3.webp?v=1795579333", "cap": "Part II · Rhythm · 3 · Rests"}, "sp": [[10.39, 0, 17], [11.15, 17, 40], [12.44, 40, 56]], "mk": [{"k": "hi", "t": 10.14, "e": 14.37, "p": 41, "r": [[0.0104, 0.893, 0.5491, 0.0721]], "pop": "T2-3"}]}, {"t0": 14.07, "t1": 15.6, "who": "B", "text": "Well done.", "cue": {"p": 41, "r": "pop3"}, "lens": {"k": "stage", "src": "pops/T2-3.webp?v=1795579333", "cap": "Part II · Rhythm · 3 · Rests"}, "mk": [{"k": "hi", "t": 14.07, "e": 15.8, "p": 41, "r": [[0.0104, 0.893, 0.5491, 0.0721]], "pop": "T2-3"}]}]}, {"t": "Try it: Twinkle", "f": "audio/T2/04-try-it-twinkle.mp3?v=1795579333", "s": 22, "p": 41, "l": [{"t0": 0.2, "t1": 8.05, "who": "B", "text": "Six crotchets, then a minim to end the line: one beat, one beat, and two to breathe. Count it aloud as you play.", "cue": {"p": 41, "r": "pop4"}, "lens": {"k": "stage", "src": "pops/T2-4.webp?v=1795579333", "cap": "Part II · Rhythm · 3 · Rests"}, "sp": [[0.2, 0, 45], [2.93, 45, 85], [5.8, 85, 112]]}, {"t0": 8.05, "t1": 14.01, "who": "piano", "notes": [8.05, 8.67, 9.29, 9.91, 10.53, 11.15, 11.77, 12.39], "cue": {"p": 41, "r": "pop4"}, "lens": {"k": "stage", "src": "pops/T2-4.webp?v=1795579333", "cap": "Part II · Rhythm · 3 · Rests"}, "mk": [{"k": "blk", "t": 8.05, "e": 8.67, "r": [[0.0864, 0.678, 0.0328, 0.1561]], "pop": "T2-4"}, {"k": "blk", "t": 8.67, "e": 9.29, "r": [[0.1401, 0.678, 0.0328, 0.1561]], "pop": "T2-4"}, {"k": "blk", "t": 9.29, "e": 9.91, "r": [[0.1929, 0.5902, 0.0328, 0.1561]], "pop": "T2-4"}, {"k": "blk", "t": 9.91, "e": 10.53, "r": [[0.2448, 0.5902, 0.0328, 0.1561]], "pop": "T2-4"}, {"k": "blk", "t": 10.53, "e": 11.15, "r": [[0.3048, 0.5561, 0.0328, 0.1561]], "pop": "T2-4"}, {"k": "blk", "t": 11.15, "e": 11.77, "r": [[0.3567, 0.5561, 0.0328, 0.1561]], "pop": "T2-4"}, {"k": "blk", "t": 11.77, "e": 12.39, "r": [[0.4095, 0.5902, 0.0328, 0.1561]], " 64, 0.0297, 0.0829]], "pop": "T12-3"}, {"k": "blk", "t": 14.48, "e": 16.02, "r": [[0.3473, 0.228, 0.0297, 0.0829]], "pop": "T12-3"}]}]}], "nx": {"wb": [null, "pp. 38–39", "Rhythm"], "dr": [["hb-offbeat", "Off the Beat", 0]]}}, {"k": "O3", "part": "Part III · Bars and time", "t": "Part opener", "pages": [47], "clips": [{"t": "Part Three: Bars and time", "f": "audio/O3/k001-part-three-bars-and-time.mp3?v=1795579333", "s": 43, "p": 47, "l": [{"t0": 3.4, "t1": 10.58, "who": "B", "text": "Welcome to Part Three, Clara: Bars and time. How the ingredients are grouped, and the map of the music.", "cue": {"p": 47, "r": "opener"}, "sp": [[3.4, 0, 30], [5.38, 30, 45], [6.86, 45, 103]]}, {"t0": 10.58, "t1": 24.4, "who": "B", "text": "Bar lines cut the music into bars; the time signature says how many beats each bar holds, and beams show where each beat begins. Then repeat signs and road signs tell you which bar comes next.", "cue": {"p": 47, "r": "opener"}, "sp": [[10.58, 0, 35], [13.1, 35, 129], [19.43, 129, 192]]}, {"t0": 24.4, "t1": 27.3, "who": "P", "text": "Like a board game: go back two squares!", "cue": {"p": 47, "r": "opener"}, "sp": [[24.4, 0, 19], [25.22, 19, 39]]}, {"t0": 27.3, "t1": 41.46, "who": "B", "text": "Eight chapters: bar lines, time signatures, compound time, irregular time, groups and beams, upbeats, repeats, and the road signs D.C., D.S., Fine and Coda. Shall we start with the bar lines?", "cue": {"p": 47, "r": "chapters"}, "mk": [{"k": "hi", "t": 29.09, "e": 36.7, "p": 47, "r": [[0.2215, 0.1107, 0.207, 0.0243]]}, {"k": "hi", "t": 30.18, "e": 36.7, "p": 47, "r": [[0.073, 0.1107, 0.208, 0.0243]]}], "sp": [[27.3, 0, 16], [28.21, 16, 132], [35.99, 132, 134], [36.7, 134, 138], [36.95, 138, 140], [37.56, 140, 157], [39.04, 157, 191]]}, {"t0": 41.46, "t1": 43.06, "who": "P", "text": "Let’s go!", "cue": {"p": 47, "r": "chapters"}}]}]}, {"k": "B1", "part": "Part III · Bars and time", "t": "1 · Bar lines", "pages": [48], "clips": [{"t": "Bars", "f": "audio/B1/s01-bars.mp3?v=1795579333", "s": 19, "p": 48, "l": [{"t0": 3.4, "t1": 12.7, "who": "B", "text": "Beats travel in groups called bars, Clara. A bar line closes each bar, and the next bar starts on beat one, the strongest beat.", "cue": {"p": 48, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 6.43, "p": 48, "r": [[0.073, 0.1722, 0.3994, 0.0243]]}, {"k": "hi", "t": 6.43, "e": 13.1, "p": 48, "r": [[0.51, 0.1722, 0.2899, 0.0243]]}, {"k": "hi", "t": 8.66, "e": 13.1, "p": 48, "r": [[0.073, 0.2009, 0.2685, 0.0243]]}, {"k": "hi", "t": 10.81, "e": 13.1, "p": 48, "r": [[0.4183, 0.2009, 0.1716, 0.0243]]}], "sp": [[3.4, 0, 43], [6.43, 43, 127]]}, {"t0": 12.7, "t1": 19.13, "who": "B", "text": "Remember: bar lines divide the music into bars; beat one comes right after each one.", "cue": {"p": 48, "r": "remember"}, "mk": [{"k": "hi", "t": 13.36, "e": 16.14, "p": 48, "r": [[0.1009, 0.2843, 0.4699, 0.0243]]}, {"k": "hi", "t": 16.14, "e": 19.53, "p": 48, "r": [[0.5865, 0.2843, 0.317, 0.0243]]}], "sp": [[12.7, 0, 10], [13.36, 10, 48], [16.14, 48, 84]]}]}, {"t": "Count every beat", "f": "audio/B1/s02-count-every-beat.mp3?v=1795579333", "s": 18, "p": 48, "l": [{"t0": 0.2, "t1": 5.66, "who": "B", "text": "Three bars of three-four. Count every beat, even inside a long note.", "cue": {"p": 48, "r": "picture"}, "mk": [{"k": "blk", "t": 0.2, "e": 5.66, "r": [[0.1, 0.385, 0.275, 0.055], [0.375, 0.385, 0.255, 0.055], [0.63, 0.385, 0.26, 0.055]], "p": 48}], "sp": [[0.2, 0, 26], [2.02, 26, 68]]}, {"t0": 5.66, "t1": 12.24, "who": "piano", "notes": [5.66, 6.28, 6.9, 7.52, 8.14, 8.76, 9.38, 10.0, 10.62], "cue": {"p": 48, "r": "picture"}, "mk": [{"k": "nt", "t": 5.66, "e": 6.28, "r": [[0.138, 0.4055, 0.018, 0.013]], "p": 48}, {"k": "nt", "t": 6.28, "e": 6.9, "r": [[0.216, 0.4055, 0.018, 0.013]], "p": 48}, {"k": "nt", "t": 6.9, "e": 7.52, "r": [[0.296, 0.4055, 0.018, 0.013]], "p": 48}, {"k": "nt", "t": 7.52, "e": 8.76, "r": [[0.391, 0.4055, 0.018, 0.013]], "p": 48}, {"k": "nt", "t": 8.76, "e": 9.38, "r": [[0.548, 0.4055, 0.018, 0.013]], "p": 48}, {"k": "nt", "t": 9.38, "e": 11.54, "r": [[0.641, 0.4055, 0.018, 0.013]], "p": 48}]}, {"t0": 12.24, "t1": 15.15, "who": "P", "text": "The long notes kept going while I counted.", "cue": {"p": 48, "r": "picture"}}, {"t0": 15.15, "t1": 18.48, "who": "B", "text": "Long notes are still on the clock, Clara.", "cue": {"p": 48, "r": "picture"}}]}, {"t": "Double and final bar lines", "f": "audio/B1/s03-double-and-final-bar-lines.mp3?v=1795579333", "s": 19, "p": 48, "l": [{"t0": 0.2, "t1": 6.68, "who": "B", "text": "A double bar line marks the end of a section, or a change of time signature or tempo.", "cue": {"p": 48, "r": "table"}, "mk": [{"k": "hi", "t": 0.2, "e": 7.08, "p": 48, "r": [[0.1886, 0.6739, 0.1611, 0.0208], [0.4106, 0.6622, 0.4547, 0.0208], [0.4106, 0.6856, 0.2614, 0.0208]]}]}, {"t0": 6.68, "t1": 9.0, "who": "P", "text": "Like the end of a chapter.", "cue": {"p": 48, "r": "table"}}, {"t0": 9.0, "t1": 13.16, "who": "B", "text": "And a thick final bar line marks the end of the piece.", "cue": {"p": 48, "r": "table"}, "mk": [{"k": "hi", "t": 9.0, "e": 13.56, "p": 48, "r": [[0.1886, 0.7251, 0.5115, 0.0208]]}]}, {"t0": 13.16, "t1": 15.88, "who": "P", "text": "Like a full stop at the end of a book.", "cue": {"p": 48, "r": "table"}}, {"t0": 15.88, "t1": 18.74, "who": "B", "text": "Precisely. Until next time.", "cue": {"p": 48, "r": "table"}, "sp": [[15.88, 0, 11], [16.81, 11, 27]]}]}], "nx": {"wb": [null, "p. 43", "Bars and time"], "dr": [["time-signatures", "Where does the bar line go?", 2]]}}, {"k": "T6", "part": "Part III · Bars and time", "t": "2 · Time signatures", "pages": [49, 50], "clips": [{"t": "Time signatures", "f": "audio/T6/01-time-signatures.mp3?v=1795579333", "s": 32, "p": 49, "l": [{"t0": 3.4, "t1": 9.65, "who": "S", "text": "Tickets, please! I am the Stationmaster. I check the time signature at the start of the line.", "cue": {"p": 49, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 4.6, "p": 49, "r": [[0.3159, 0.2499, 0.1504, 0.0278]]}, {"k": "hi", "t": 4.9, "e": 10.05, "p": 49, "r": [[0.5005, 0.2499, 0.399, 0.0278], [0.073, 0.2774, 0.1071, 0.0278]]}], "sp": [[3.4, 0, 17], [4.37, 17, 41], [4.9, 41, 93]]}, {"t0": 9.65, "t1": 22.48, "who": "B", "text": "A time signature is two numbers, Clara, like a train ticket. Each bar is a carriage. The top number says how many seats each carriage has. The bottom number says which note fills one seat.", "cue": {"p": 49, "r": "lead"}, "mk": [{"k": "hi", "t": 9.65, "e": 13.8, "p": 49, "r": [[0.073, 0.0887, 0.4888, 0.0614], [0.073, 0.1605, 0.3698, 0.0243]]}, {"k": "hi", "t": 13.8, "e": 15.58, "p": 49, "r": [[0.5719, 0.1605, 0.1933, 0.0243]]}, {"k": "hi", "t": 15.58, "e": 19.09, "p": 49, "r": [[0.8237, 0.1605, 0.0418, 0.0243], [0.073, 0.1891, 0.6731, 0.0243]]}, {"k": "hi", "t": 19.09, "e": 22.88, "p": 49, "r": [[0.8045, 0.1891, 0.0915, 0.0243], [0.073, 0.2178, 0.4501, 0.0243]]}], "sp": [[9.65, 0, 61], [13.8, 61, 85], [15.58, 85, 139], [19.09, 139, 188]], "lens": {"k": "stage", "src": "pops/D-t44-0.webp?v=1795579333", "cap": "Part III · Bars and time · 2 · Time signatures · Handbook p. 49"}}, {"t0": 22.48, "t1": 28.11, "who": "B", "text": "Look at the carriage in the picture. Four-four: four seats, and a crotchet in each.", "cue": {"p": 49, "r": "picture"}, "sp": [[22.48, 0, 37], [24.43, 37, 48], [25.29, 48, 83]], "lens": {"k": "stage", "src": "pops/D-t44-0.webp?v=1795579333", "cap": "Part III · Bars and time · 2 · Time signatures · Handbook p. 49"}}, {"t0": 28.11, "t1": 31.59, "who": "piano", "notes": [28.11, 28.73, 29.35, 29.97], "cue": {"p": 49, "r": "picture"}, "mk": [{"k": "blk", "t": 28.11, "e": 28.73, "r": [[0.3613, 0.4713, 0.1, 0.06]], "p": 49}, {"k": "blk", "t": 28.73, "e": 29.35, "r": [[0.4763, 0.4713, 0.1, 0.06]], "p": 49}, {"k": "blk", "t": 29.35, "e": 29.97, "r": [[0.5925, 0.4713, 0.1, 0.06]], "p": 49}, {"k": "blk", "t": 29.97, "e": 31.59, "r": [[0.7075, 0.4713, 0.1, 0.06]], "p": 49}], "lens": {"k": "stage", "src": "pops/D-t44.webp?v=1795579333", "cap": "Part III · Bars and time · 2 · Time signatures · Handbook p. 49"}}]}, {"t": "The two numbers", "f": "audio/T6/01b-the-two-numbers.mp3?v=1795579333", "s": 27, "p": 49, "l": [{"t0": 0.2, "t1": 9.67, "who": "B", "text": "Remember: top number, how many beats. Bottom number, which note gets one beat. A four means a crotchet, a two a minim, an eight a quaver.", "cue": {"p": 49, "r": "remember"}, "mk": [{"k": "hi", "t": 0.6, "e": 2.67, "p": 49, "r": [[0.1009, 0.3502, 0.3842, 0.0243]]}, {"k": "hi", "t": 2.67, "e": 5.4, "p": 49, "r": [[0.5007, 0.3502, 0.3453, 0.0243], [0.1009, 0.3768, 0.4172, 0.0243]]}], "sp": [[0.2, 0, 10], [0.6, 10, 38], [2.67, 38, 79], [5.4, 79, 137]]}, {"t0": 9.67, "t1": 11.86, "who": "P", "text": "A code! Like spies.", "cue": {"p": 49, "r": "remember"}, "sp": [[9.67, 0, 8], [10.15, 8, 19]]}, {"t0": 11.86, "t1": 16.1, "who": "S", "text": "Like railway codes, miss. Every station knows them.", "cue": {"p": 49, "r": "remember"}, "sp": [[11.86, 0, 26], [13.37, 26, 51]]}, {"t0": 16.1, "t1": 18.49, "who": "P", "text": "Three counts, and four counts?", "cue": {"p": 49, "r": "remember"}}, {"t0": 18.49, "t1": 27.44, "who": "B", "text": "Ah, everybody falls into that hole once. The bottom number isn’t a count, Clara. It’s the code for the note that gets one beat.", "cue": {"p": 49, "r": "remember"}, "mk": [{"k": "hi", "t": 21.24, "e": 23.86, "p": 49, "r": [[0.5007, 0.3502, 0.2035, 0.0243]]}, {"k": "hi", "t": 23.86, "e": 27.84, "p": 49, "r": [[0.2699, 0.3768, 0.2482, 0.0243]]}], "sp": [[18.49, 0, 41], [21.24, 41, 81], [23.86, 81, 127]]}]}, {"t": "Three-four", "f": "audio/T6/01c-three-four.mp3?v=1795579333", "s": 9, "p": 49, "l": [{"t0": 0.2, "t1": 3.89, "who": "P", "text": "So three-four is three crotchet seats in every carriage.", "cue": {"p": 49, "r": "picture"}, "lens": {"k": "stage", "src": "pops/D-t34-0.webp?v=1795579333", "cap": "Part III · Bars and time · 2 · Time signatures · Handbook p. 49"}}, {"t0": 3.89, "t1": 8.61, "who": "piano", "notes": [3.89, 4.51, 5.13, 5.75, 6.37, 6.99], "cue": {"p": 49, "r": "picture"}, "mk": [{"k": "blk", "t": 3.89, "e": 4.51, "r": [[0.3613, 0.4713, 0.1, 0.06]], "p": 49}, {"k": "blk", "t": 4.51, "e": 5.13, "r": [[0.4763, 0.4713, 0.1, 0.06]], "p": 49}, {"k": "blk", "t": 5.13, "e": 5.75, "r": [[0.5925, 0.4713, 0.1, 0.06]], "p": 49}, {"k": "blk", "t": 5.75, "e": 6.37, "r": [[0.3613, 0.4713, 0.1, 0.06]], "p": 49}, {"k": "blk", "t": 6.37, "e": 6.99, "r": [[0.4763, 0.4713, 0.1, 0.06]], "p": 49}, {"k": "blk", "t": 6.99, "e": 8.61, "r": [[0.5925, 0.4713, 0.1, 0.06]], "p": 49}], "lens": {"k": "stage", "src": "pops/D-t34.webp?v=1795579333", "cap": "Part III · Bars and time · 2 · Time signatures · Handbook p. 49"}}]}, {"t": "Simple time", "f": "audio/T6/01d-simple-time.mp3?v=1795579333", "s": 18, "p": 50, "l": [{"t0": 0.2, "t1": 11.42, "who": "B", "text": "In simple time each beat divides in two. Four-four is also called common time, written as a C. With a line through it, cut common time: two minim beats.", "cue": {"p": 50, "r": "h:Simple time: each beat divides in two"}, "mk": [{"k": "hi", "t": 0.2, "e": 3.2, "p": 50, "r": [[0.073, 0.1107, 0.4994, 0.0243]]}, {"k": "hi", "t": 3.2, "e": 7.04, "p": 50, "r": [[0.4859, 0.2542, 0.1743, 0.0208], [0.3082, 0.2777, 0.0484, 0.0208]]}, {"k": "hi", "t": 7.04, "e": 9.59, "p": 50, "r": [[0.5322, 0.3092, 0.1342, 0.0208], [0.3082, 0.3327, 0.0484, 0.0208]]}], "sp": [[0.2, 0, 41], [3.2, 41, 95], [7.04, 95, 136], [9.59, 136, 152]]}, {"t0": 11.42, "t1": 17.77, "who": "B", "text": "And a new time signature can appear after any bar line. It holds until the next one.", "cue": {"p": 50, "r": "h:Simple time: each beat divides in two"}, "mk": [{"k": "hi", "t": 11.42, "e": 15.19, "p": 50, "r": [[0.0945, 0.7238, 0.5361, 0.0208]]}, {"k": "hi", "t": 15.19, "e": 18.17, "p": 50, "r": [[0.663, 0.7238, 0.1987, 0.0208]]}], "sp": [[11.42, 0, 56], [15.19, 56, 84]]}]}, {"t": "Example: what does three-four mean?", "f": "audio/T6/02-example-what-does-three-four-mean.mp3?v=1795579333", "s": 16, "p": 49, "l": [{"t0": 0.2, "t1": 5.78, "who": "B", "text": "Three-four. How many counts in each bar, and which note gets one count? Pause.", "cue": {"p": 49, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T6-2-q.webp?v=1795579333"}, "sp": [[0.2, 0, 12], [0.76, 12, 72], [4.48, 72, 78]]}, {"t0": 5.78, "t1": 8.78, "who": "pause", "text": "Pause and try.", "cue": {"p": 49, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T6-2-q.webp?v=1795579333"}}, {"t0": 8.78, "t1": 14.07, "who": "P", "text": "Three counts, and a crotchet gets one. Two quavers, a crotchet and a crotchet make three.", "cue": {"p": 49, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T6-2.webp?v=1795579333"}, "sp": [[8.78, 0, 39], [10.94, 39, 89]], "mk": [{"k": "hi", "t": 8.88, "e": 14.37, "p": 49, "r": [[0.0116, 0.9007, 0.8147, 0.0762]], "pop": "T6-2"}]}, {"t0": 14.07, "t1": 16.41, "who": "B", "text": "Exactly right, Clara.", "cue": {"p": 49, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/T6-2.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 14.07, "e": 16.61, "p": 49, "r": [[0.0116, 0.9007, 0.8147, 0.0762]], "pop": "T6-2"}]}]}, {"t": "Example: which ticket?", "f": "audio/T6/03-example-which-ticket.mp3?v=1795579333", "s": 15, "p": 49, "l": [{"t0": 0.2, "t1": 5.72, "who": "B", "text": "A carriage with three seats, and a quaver in each. Write the ticket. Pause.", "cue": {"p": 49, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T6-3-q.webp?v=1795579333"}, "sp": [[0.2, 0.0, 51], [3.28, 51.0, 69], [4.39, 69.0, 75]]}, {"t0": 5.72, "t1": 8.72, "who": "pause", "text": "Pause and try.", "cue": {"p": 49, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T6-3-q.webp?v=1795579333"}}, {"t0": 8.72, "t1": 10.21, "who": "P", "text": "Three-eight!", "cue": {"p": 49, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T6-3.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 8.82, "e": 10.51, "p": 49, "r": [[0.0105, 0.8955, 0.3592, 0.0796]], "pop": "T6-3"}]}, {"who": "S", "text": "Ticket accepted. All aboard!", "cue": {"p": 49, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T6-3.webp?v=1795579333"}, "t0": 10.21, "t1": 13.39, "sp": [[10.21, 0, 17], [11.35, 17, 28]]}, {"t0": 13.39, "t1": 14.92, "who": "B", "text": "Well done.", "cue": {"p": 49, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/T6-3.webp?v=1795579333"}}]}, {"t": "Example: where does the rest go?", "f": "audio/T6/04-example-where-does-the-rest-go.mp3?v=1795579333", "s": 15, "p": 49, "l": [{"t0": 0.2, "t1": 5.76, "who": "B", "text": "Four-four, with three crotchets. Which seat is empty, and what goes there? Pause.", "cue": {"p": 49, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/T6-4-q.webp?v=1795579333"}, "sp": [[0.2, 0, 33], [1.18, 33, 75], [4.49, 75, 81]]}, {"t0": 5.76, "t1": 8.76, "who": "pause", "text": "Pause and try.", "cue": {"p": 49, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/T6-4-q.webp?v=1795579333"}}, {"t0": 8.76, "t1": 13.03, "who": "P", "text": "Seat four: a crotchet rest. One, two, three, and four in silence.", "cue": {"p": 49, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/T6-4.webp?v=1795579333"}, "sp": [[8.76, 0, 11], [9.24, 11, 28], [10.46, 28, 65]], "mk": [{"k": "hi", "t": 8.86, "e": 13.33, "p": 49, "r": [[0.0115, 0.8838, 0.5224, 0.0892]], "pop": "T6-4"}]}, {"t0": 13.03, "t1": 14.58, "who": "B", "text": "Spot on.", "cue": {"p": 49, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/T6-4.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 13.03, "e": 14.78, "p": 49, "r": [[0.0115, 0.8838, 0.5224, 0.0892]], "pop": "T6-4"}]}]}, {"t": "Try it: a Minuet", "f": "audio/T6/05-try-it-a-minuet.mp3?v=1795579333", "s": 24, "p": 49, "l": [{"t0": 0.2, "t1": 11.03, "who": "B", "text": "This minuet from the Notebook for Anna Magdalena Bach has three crotchet beats in every bar: the step of the dance. Count one, two, three aloud as it plays.", "cue": {"p": 49, "r": "pop5"}, "lens": {"k": "pop", "src": "pops/T6-5.webp?v=1795579333"}, "sp": [[0.2, 0, 93], [5.87, 93, 116], [7.56, 116, 156]]}, {"t0": 11.03, le time.", "cue": {"p": 51, "r": "more"}, "mk": [{"k": "hi", "t": 15.38, "e": 18.79, "p": 51, "r": [[0.308, 0.6376, 0.2285, 0.0208]]}, {"k": "hi", "t": 19.51, "e": 23.39, "p": 51, "r": [[0.1035, 0.6376, 0.433, 0.0208]]}], "sp": [[15.38, 0, 53], [18.79, 53, 61], [19.51, 61, 108]]}, {"t0": 22.99, "t1": 27.94, "who": "Q", "text": "Ba-na-na, ba-na-na, ba-na-na, ba-na-na.", "cue": {"p": 51, "r": "more"}}, {"t0": 27.94, "t1": 30.05, "who": "P", "text": "And the Queen is skipping!", "cue": {"p": 51, "r": "lead"}}, {"t0": 30.05, "t1": 39.15, "who": "B", "text": "Also one step on every beat. But she fits three sounds in each: ba-na-na. When a beat splits in three, that is compound time.", "cue": {"p": 51, "r": "more"}, "mk": [{"k": "hi", "t": 35.25, "e": 39.55, "p": 51, "r": [[0.579, 0.6376, 0.3388, 0.0208], [0.073, 0.6636, 0.3714, 0.0208]]}], "sp": [[30.05, 0, 29], [32.2, 29, 64], [34.33, 64, 74], [35.25, 74, 125]]}, {"t0": 39.15, "t1": 46.06, "who": "B", "text": "Count every sound of two bananas: one to six. Lean a little on one and four, where her feet land.", "cue": {"p": 51, "r": "more"}, "sp": [[39.15, 0, 34], [41.32, 34, 46], [42.58, 46, 97]]}, {"t0": 46.06, "t1": 50.78, "who": "piano", "notes": [46.06, 46.37, 46.68, 46.99, 47.3, 47.61, 47.92, 48.23, 48.54, 48.85, 49.16, 49.47], "cue": {"p": 51, "r": "more"}, "mk": [{"k": "blk", "t": 46.06, "e": 46.37, "r": [[0.6913, 0.7414, 0.045, 0.0353]], "p": 51}, {"k": "blk", "t": 46.37, "e": 46.68, "r": [[0.755, 0.7414, 0.045, 0.0353]], "p": 51}, {"k": "blk", "t": 46.68, "e": 46.99, "r": [[0.8187, 0.7414, 0.045, 0.0353]], "p": 51}, {"k": "blk", "t": 46.99, "e": 47.3, "r": [[0.6913, 0.7414, 0.045, 0.0353]], "p": 51}, {"k": "blk", "t": 47.3, "e": 47.61, "r": [[0.755, 0.7414, 0.045, 0.0353]], "p": 51}, {"k": "blk", "t": 47.61, "e": 47.92, "r": [[0.8187, 0.7414, 0.045, 0.0353]], "p": 51}, {"k": "blk", "t": 47.92, "e": 48.23, "r": [[0.6913, 0.7414, 0.045, 0.0353]], "p": 51}, {"k": "blk", "t": 48.23, "e": 48.54, "r": [[0.755, 0.7414,
