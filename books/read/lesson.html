 159], [11.4, 159, 175]]}, {"t0": 13.27, "t1": 23.49, "who": "piano", "notes": [13.27, 13.89, 14.51, 15.13, 15.75, 16.37, 16.99, 17.61, 18.23, 18.85, 19.47, 20.71, 21.33, 21.95], "cue": {"p": 117, "r": "pop6"}, "lens": {"k": "pop", "src": "pops/F3-6.webp?v=1795579333"}}]}], "nx": {"wb": [null, "pp. 117–118", "Shape and style"], "dr": [["melody", "Repetition or sequence?", 7]]}}, {"k": "F4", "part": "Part VIII · Shape and style", "t": "4 · Texture: monophonic, homophonic, polyphonic", "pages": [119, 120], "clips": [{"t": "Texture", "f": "audio/F4/01-texture.mp3?v=1795579333", "s": 45, "p": 119, "l": [{"t0": 3.4, "t1": 8.0, "who": "B", "text": "Run your fingers over your jumper, Clara. Feel the threads?", "cue": {"p": 119, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 6.23, "p": 119, "r": [[0.2197, 0.2652, 0.3533, 0.0278]]}, {"k": "hi", "t": 6.23, "e": 8.4, "p": 119, "r": [[0.5867, 0.2652, 0.173, 0.0278]]}], "sp": [[3.4, 0, 42], [6.23, 42, 59]]}, {"t0": 8.0, "t1": 15.49, "who": "B", "text": "Music has threads too. How many lines are sounding at once, and how do they fit together? That is its texture.", "cue": {"p": 119, "r": "lead"}, "mk": [{"k": "hi", "t": 9.74, "e": 13.6, "p": 119, "r": [[0.4383, 0.2045, 0.4404, 0.0243], [0.073, 0.2331, 0.2818, 0.0243]]}], "sp": [[8.0, 0, 23], [9.74, 23, 90], [13.6, 90, 110]]}, {"t0": 15.49, "t1": 21.78, "who": "B", "text": "Remember: count the lines. One alone, a tune with chords, or tunes woven together.", "cue": {"p": 119, "r": "remember"}, "mk": [{"k": "hi", "t": 15.89, "e": 17.39, "p": 119, "r": [[0.1009, 0.3358, 0.1994, 0.0243]]}, {"k": "hi", "t": 17.39, "e": 22.18, "p": 119, "r": [[0.3723, 0.3358, 0.0716, 0.0243]]}, {"k": "hi", "t": 18.31, "e": 22.18, "p": 119, "r": [[0.4838, 0.3358, 0.219, 0.0243]]}, {"k": "hi", "t": 19.66, "e": 22.18, "p": 119, "r": [[0.7536, 0.3358, 0.0728, 0.0243], [0.1009, 0.3623, 0.2023, 0.0243]]}], "sp": [[15.49, 0, 10], [15.89, 10, 27], [17.39, 27, 82]]}, {"t0": 21.78, "t1": 24.76, "who": "B", "text": "Monophonic: one line alone.", "cue": {"p": 119, "r": "table"}, "mk": [{"k": "hi", "t": 22.8, "e": 25.16, "p": 119, "r": [[0.4232, 0.7416, 0.1043, 0.0208]]}], "sp": [[21.78, 0, 12], [22.8, 12, 27]]}, {"t0": 24.76, "t1": 28.78, "who": "piano", "notes": [24.76, 25.38, 26.0, 26.62, 27.24], "cue": {"p": 119, "r": "table"}}, {"t0": 28.78, "t1": 32.31, "who": "B", "text": "Homophonic: a tune with chords underneath.", "cue": {"p": 119, "r": "table"}, "mk": [{"k": "hi", "t": 28.78, "e": 32.71, "p": 119, "r": [[0.3962, 0.7732, 0.3076, 0.0208]]}], "sp": [[28.78, 0, 12], [28.78, 12, 42]]}, {"t0": 32.31, "t1": 36.96, "who": "piano", "notes": [32.31, 32.93, 33.55], "cue": {"p": 119, "r": "table"}}, {"t0": 36.96, "t1": 40.76, "who": "B", "text": "Polyphonic: two or more tunes woven together.", "cue": {"p": 119, "r": "table"}, "mk": [{"k": "hi", "t": 37.79, "e": 41.16, "p": 119, "r": [[0.3765, 0.8399, 0.1947, 0.0208]]}], "sp": [[36.96, 0, 12], [37.79, 12, 45]]}, {"t0": 40.76, "t1": 44.78, "who": "piano", "notes": [40.76, 41.38, 42.0, 42.62, 43.24], "cue": {"p": 119, "r": "table"}}]}, {"t": "Example: which hand has the tune?", "f": "audio/F4/02-example-which-hand-has-the-tune.mp3?v=1795579333", "s": 18, "p": 119, "l": [{"t0": 0.2, "t1": 7.45, "who": "B", "text": "The right hand repeats two-note chords; the left hand moves step by step. Which should sing out? Pause.", "cue": {"p": 119, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F4-3-q.webp?v=1795579333"}, "sp": [[0.2, 0, 40], [2.54, 40, 74], [4.89, 74, 97], [6.12, 97, 103]]}, {"t0": 7.45, "t1": 11.45, "who": "pause", "text": "Pause and try.", "cue": {"p": 119, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F4-3-q.webp?v=1795579333"}}, {"t0": 11.45, "t1": 15.77, "who": "P", "text": "The left hand has the tune. Play it louder, and keep the right hand soft.", "cue": {"p": 119, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F4-3.webp?v=1795579333"}, "sp": [[11.45, 0, 28], [13.06, 28, 73]], "mk": [{"k": "hi", "t": 11.55, "e": 16.07, "p": 119, "r": [[0.0109, 0.8788, 0.7839, 0.0909]], "pop": "F4-3"}]}, {"t0": 15.77, "t1": 17.64, "who": "B", "text": "Nicely done.", "cue": {"p": 119, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F4-3.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 15.77, "e": 17.84, "p": 119, "r": [[0.0109, 0.8788, 0.7839, 0.0909]], "pop": "F4-3"}]}]}, {"t": "Try it", "f": "audio/F4/03-try-it.mp3?v=1795579333", "s": 11, "p": 119, "l": [{"t0": 0.2, "t1": 11.42, "who": "B", "text": "In Mozart’s Sonata in C the right hand sings and the left hand rocks: an Alberti bass. Play only the left hand, softly and evenly. Until next time.", "cue": {"p": 119, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/F4-4.webp?v=1795579333"}, "mk": [{"k": "nt", "t": 1.53, "e": 11.82, "p": 119, "r": [[0.0744, 0.3902, 0.0069, 0.0247]], "n": "C", "pop": "F4-4"}], "sp": [[0.2, 0, 70], [4.87, 70, 87], [6.32, 87, 131], [9.52, 131, 147]]}]}], "nx": {"wb": [null, "pp. 119–120", "Shape and style"], "dr": [["hb-texture", "Texture", 0]]}}, {"k": "F5", "part": "Part VIII · Shape and style", "t": "5 · Changing key (modulation)", "pages": [121], "clips": [{"t": "Changing key", "f": "audio/F5/01-changing-key.mp3?v=1795579333", "s": 38, "p": 121, "l": [{"t0": 3.4, "t1": 11.59, "who": "B", "text": "Music can travel to a new key, Clara, and it usually comes home before the end. The move is called a modulation.", "cue": {"p": 121, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 8.72, "p": 121, "r": [[0.073, 0.1372, 0.2745, 0.0193]]}, {"k": "hi", "t": 5.14, "e": 8.72, "p": 121, "r": [[0.073, 0.1927, 0.0544, 0.0119]]}, {"k": "hi", "t": 6.1, "e": 8.72, "p": 121, "r": [[0.4176, 0.1372, 0.3339, 0.0193]]}, {"k": "hi", "t": 8.72, "e": 11.99, "p": 121, "r": [[0.8027, 0.1372, 0.1029, 0.0193], [0.073, 0.1599, 0.2155, 0.0193]]}], "sp": [[3.4, 0, 80], [8.72, 80, 112]]}, {"t0": 11.59, "t1": 13.84, "who": "P", "text": "Does it send a postcard?", "cue": {"p": 121, "r": "lead"}, "mk": [{"k": "hi", "t": 11.59, "e": 14.24, "p": 121, "r": [[0.2098, 0.1853, 0.1343, 0.022]]}]}, {"t0": 13.84, "t1": 21.33, "who": "B", "text": "In a way. Remember: a new sharp or flat that keeps coming back, then a cadence, and you are in a new key.", "cue": {"p": 121, "r": "remember"}, "mk": [{"k": "hi", "t": 15.42, "e": 21.73, "p": 121, "r": [[0.1174, 0.2412, 0.4337, 0.0193]]}, {"k": "hi", "t": 18.02, "e": 21.73, "p": 121, "r": [[0.6357, 0.2412, 0.0857, 0.0193]]}, {"k": "hi", "t": 19.28, "e": 21.73, "p": 121, "r": [[0.8631, 0.2412, 0.0409, 0.0193], [0.0951, 0.2622, 0.0355, 0.0193]]}], "sp": [[13.84, 0, 10], [14.59, 10, 20], [15.42, 20, 105]]}, {"t0": 21.33, "t1": 31.73, "who": "B", "text": "A piece in C major usually visits its neighbours on the circle of fifths. F sharp takes it to G major; B flat takes it to F major.", "cue": {"p": 121, "r": "table"}, "mk": [{"k": "hi", "t": 21.33, "e": 26.53, "p": 121, "r": [[0.0907, 0.5193, 0.5989, 0.0165]]}, {"k": "hi", "t": 26.53, "e": 28.86, "p": 121, "r": [[0.7623, 0.5692, 0.0477, 0.0165], [0.0834, 0.5942, 0.0682, 0.0165]]}, {"k": "hi", "t": 28.86, "e": 32.13, "p": 121, "r": [[0.0834, 0.5942, 0.0682, 0.0165]]}], "sp": [[21.33, 0, 74], [26.53, 74, 103], [28.86, 103, 130]]}, {"t0": 31.73, "t1": 38.23, "who": "piano", "notes": [31.73, 32.35, 32.97, 33.59, 34.21, 34.83, 35.45, 36.07, 36.69], "cue": {"p": 121, "r": "table"}}]}, {"t": "Example: where does the key change?", "f": "audio/F5/02-example-where-does-the-key-change.mp3?v=1795579333", "s": 15, "p": 121, "l": [{"t0": 0.2, "t1": 6.79, "who": "B", "text": "B flat in bar two, again in bar three, and the phrase lands on F. Which key? Pause.", "cue": {"p": 121, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F5-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 66], [4.72, 66, 77], [5.5, 77, 83]]}, {"t0": 6.79, "t1": 9.79, "who": "pause", "text": "Pause and try.", "cue": {"p": 121, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F5-1-q.webp?v=1795579333"}}, {"t0": 9.79, "t1": 12.45, "who": "P", "text": "F major: one flat, B flat.", "cue": {"p": 121, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F5-1.webp?v=1795579333"}, "sp": [[9.79, 0, 9], [10.39, 9, 26]], "mk": [{"k": "hi", "t": 9.89, "e": 12.75, "p": 121, "r": [[0.0113, 0.8602, 0.5321, 0.1056]], "pop": "F5-1"}]}, {"t0": 12.45, "t1": 14.7, "who": "B", "text": "Bravo, Miss Clara.", "cue": {"p": 121, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F5-1.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 12.45, "e": 14.9, "p": 121, "r": [[0.0113, 0.8602, 0.5321, 0.1056]], "pop": "F5-1"}]}]}, {"t": "Example: just passing?", "f": "audio/F5/03-example-just-passing.mp3?v=1795579333", "s": 19, "p": 121, "l": [{"t0": 0.2, "t1": 6.89, "who": "B", "text": "One F sharp in a bar of C major, then plain F everywhere after. A new key? Pause.", "cue": {"p": 121, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F5-3-q.webp?v=1795579333"}, "sp": [[0.2, 0, 64], [4.62, 64, 75], [5.6, 75, 81]]}, {"t0": 6.89, "t1": 10.89, "who": "pause", "text": "Pause and try.", "cue": {"p": 121, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F5-3-q.webp?v=1795579333"}}, {"t0": 10.89, "t1": 17.2, "who": "P", "text": "No. One passing F sharp is a decoration. A modulation keeps its new note and lands with a cadence.", "cue": {"p": 121, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F5-3.webp?v=1795579333"}, "sp": [[10.89, 0, 4], [11.13, 4, 41], [13.66, 41, 98]], "mk": [{"k": "hi", "t": 10.99, "e": 17.5, "p": 121, "r": [[0.0116, 0.8364, 0.9768, 0.1227]], "pop": "F5-3"}]}, {"t0": 17.2, "t1": 18.8, "who": "B", "text": "Excellent.", "cue": {"p": 121, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F5-3.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 17.2, "e": 19.0, "p": 121, "r": [[0.0116, 0.8364, 0.9768, 0.1227]], "pop": "F5-3"}]}]}, {"t": "Try it", "f": "audio/F5/04-try-it.mp3?v=1795579333", "s": 11, "p": 121, "l": [{"t0": 0.2, "t1": 10.99, "who": "B", "text": "Play the same four bars twice: once with F natural, once with F sharp. With the F sharp, the G at the end sounds like a new home. Until next time.", "cue": {"p": 121, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/F5-4.webp?v=1795579333"}, "sp": [[0.2, 0, 31], [2.41, 31, 71], [5.5, 71, 130], [9.19, 130, 146]]}]}], "nx": {"wb": [null, "pp. 121–122", "Shape and style"], "dr": [["hb-modulation", "Changing Key", 0]]}}, {"k": "F6", "part": "Part VIII · Shape and style", "t": "6 · Musical form: binary, ternary, rondo", "pages": [122, 123], "clips": [{"t": "Musical form", "f": "audio/F6/01-musical-form.mp3?v=1795579333", "s": 37, "p": 122, "l": [{"t0": 3.4, "t1": 11.29, "who": "B", "text": "Form is the map of a whole piece, Clara: which sections come, in what order, and which come back. Letters name them.", "cue": {"p": 122, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 6.12, "p": 122, "r": [[0.073, 0.1925, 0.3593, 0.0221]]}, {"k": "hi", "t": 6.12, "e": 9.49, "p": 122, "r": [[0.5129, 0.1925, 0.1566, 0.0221]]}, {"k": "hi", "t": 7.28, "e": 9.49, "p": 122, "r": [[0.7655, 0.1925, 0.0573, 0.0221]]}, {"k": "hi", "t": 8.24, "e": 9.49, "p": 122, "r": [[0.1418, 0.2185, 0.1173, 0.0221]]}, {"k": "hi", "t": 9.49, "e": 11.69, "p": 122, "r": [[0.271, 0.2185, 0.1422, 0.0221]]}], "sp": [[3.4, 0.0, 41], [6.12, 41.0, 98], [9.49, 98.0, 116]]}, {"t0": 11.29, "t1": 15.74, "who": "B", "text": "Remember: same music, same letter. New music, next letter.", "cue": {"p": 122, "r": "remember"}, "mk": [{"k": "hi", "t": 11.8, "e": 13.61, "p": 122, "r": [[0.1725, 0.3075, 0.2224, 0.0221]]}, {"k": "hi", "t": 13.61, "e": 16.14, "p": 122, "r": [[0.3298, 0.3075, 0.2745, 0.0221]]}], "sp": [[11.29, 0.0, 10], [11.8, 10.0, 35], [13.61, 35.0, 58]]}, {"t0": 15.74, "t1": 30.52, "who": "B", "text": "Binary, A B: two halves, often each repeated, like a Baroque minuet. Ternary, A B A: out, away, and back. Rondo, A B A C A: A keeps coming home. And theme and variations: one tune in new clothes.", "cue": {"p": 122, "r": "table"}, "mk": [{"k": "hi", "t": 15.74, "e": 16.94, "p": 122, "r": [[0.0849, 0.6404, 0.2389, 0.0189]]}, {"k": "hi", "t": 16.86, "e": 20.54, "p": 122, "r": [[0.4265, 0.6297, 0.1022, 0.0189]]}, {"k": "hi", "t": 17.54, "e": 20.54, "p": 122, "r": [[0.5928, 0.6297, 0.0507, 0.0189], [0.4265, 0.651, 0.0878, 0.0189]]}, {"k": "hi", "t": 20.54, "e": 21.74, "p": 122, "r": [[0.0849, 0.6903, 0.2389, 0.0189]]}, {"k": "hi", "t": 21.56, "e": 23.29, "p": 122, "r": [[0.4265, 0.6903, 0.0315, 0.0189]]}, {"k": "hi", "t": 21.99, "e": 23.29, "p": 122, "r": [[0.4688, 0.6903, 0.0476, 0.0189]]}, {"k": "hi", "t": 22.53, "e": 23.53, "p": 122, "r": [[0.5696, 0.6903, 0.0464, 0.0189]]}, {"k": "hi", "t": 23.29, "e": 24.99, "p": 122, "r": [[0.0849, 0.7402, 0.2801, 0.0189]]}, {"k": "hi", "t": 24.99, "e": 26.61, "p": 122, "r": [[0.4467, 0.7295, 0.1367, 0.0189]]}, {"k": "hi", "t": 26.61, "e": 28.28, "p": 122, "r": [[0.0849, 0.7794, 0.1112, 0.0189], [0.0849, 0.8007, 0.1045, 0.0189]]}], "sp": [[15.74, -0.0, 13], [16.86, 13.0, 69], [20.54, 69.0, 85], [21.56, 85.0, 106], [23.29, 106.0, 124], [24.99, 124.0, 145], [26.61, 145.0, 171], [28.28, 171.0, 195]]}, {"who": "P", "text": "Like Twinkle in a sparkly party dress!", "cue": {"p": 122, "r": "table"}, "t0": 30.52, "t1": 33.47}, {"who": "B", "text": "Exactly. Same tune, new outfit every time.", "cue": {"p": 122, "r": "table"}, "t0": 33.47, "t1": 37.49, "mk": [{"k": "hi", "t": 34.31, "e": 37.89, "p": 122, "r": [[0.4689, 0.7794, 0.1318, 0.0189], [0.4265, 0.8007, 0.2015, 0.0189]]}], "sp": [[33.47, 0, 9], [34.31, 9, 42]]}]}, {"t": "Listen for it", "f": "audio/F6/02-listen-for-it.mp3?v=1795579333", "s": 20, "p": 123, "l": [{"t0": 0.2, "t1": 9.69, "who": "B", "text": "The Minuet in G is binary. Für Elise is a rondo. And Mozart wrote twelve variations on the tune we know as Twinkle.", "cue": {"p": 123, "r": "more"}, "mk": [{"k": "hi", "t": 0.2, "e": 2.44, "p": 123, "r": [[0.0943, 0.2999, 0.0968, 0.0162]]}, {"k": "hi", "t": 2.44, "e": 3.81, "p": 123, "r": [[0.3702, 0.2999, 0.0712, 0.0162], [0.3702, 0.3209, 0.0521, 0.0185]]}, {"k": "hi", "t": 3.81, "e": 10.09, "p": 123, "r": [[0.6461, 0.2785, 0.0665, 0.0185], [0.6461, 0.2999, 0.1441, 0.0162]]}], "sp": [[0.2, 0, 27], [2.44, 27, 49], [3.81, 49, 115]]}, {"t0": 9.69, "t1": 19.84, "who": "B", "text": "Going further: sonata form, in the big first movements of sonatas and symphonies, has an exposition, a development and a recapitulation.", "cue": {"p": 123, "r": "more"}, "mk": [{"k": "hi", "t": 9.69, "e": 10.89, "p": 123, "r": [[0.1901, 0.4637, 0.1741, 0.015]]}, {"k": "hi", "t": 10.85, "e": 20.24, "p": 123, "r": [[0.096, 0.4811, 0.1411, 0.0208]]}, {"k": "hi", "t": 11.98, "e": 20.24, "p": 123, "r": [[0.1429, 0.5089, 0.5157, 0.0208]]}, {"k": "hi", "t": 16.59, "e": 20.24, "p": 123, "r": [[0.4839, 0.5349, 0.1501, 0.0208]]}, {"k": "hi", "t": 18.46, "e": 20.24, "p": 123, "r": [[0.4454, 0.5609, 0.1621, 0.0208]]}], "sp": [[9.69, 0, 15], [10.85, 15, 136]]}]}, {"t": "Example: which letter makes it ternary?", "f": "audio/F6/03-example-which-letter-makes-it-ternary.mp3?v=1795579333", "s": 12, "p": 122, "l": [{"t0": 0.2, "t1": 4.8, "who": "B", "text": "A, B, and a box. Ternary goes out, away and…? Pause.", "cue": {"p": 122, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F6-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 17], [2.02, 17, 46], [3.52, 46, 52]]}, {"t0": 4.8, "t1": 7.8, "who": "pause", "text": "Pause and try.", "cue": {"p": 122, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F6-1-q.webp?v=1795579333"}}, {"t0": 7.8, "t1": 9.65, "who": "P", "text": "A! A B A.", "cue": {"p": 122, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F6-1.webp?v=1795579333"}, "sp": [[7.83, 0, 3], [8.05, 3, 9]], "mk": [{"k": "hi", "t": 7.9, "e": 9.95, "p": 122, "r": [[0.0105, 0.8709, 0.3375, 0.0991]], "pop": "F6-1"}]}, {"t0": 9.65, "t1": 11.96, "who": "B", "text": "That’s it exactly.", "cue": {"p": 122, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F6-1.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 9.65, "e": 12.16, "p": 122, "r": [[0.0105, 0.8709, 0.3375, 0.0991]], "pop": "F6-1"}]}]}, {"t": "Example: map Twinkle", "f": "audio/F6/04-example-map-twinkle.mp3?v=1795579333", "s": 16, "p": 122, "l": [{"t0": 0.2, "t1": 8.13, "who": "B", "text": "Twinkle: bars one to four are A. Bars five to eight are new. The last four repeat the first. Pause and name it.", "cue": {"p": 122, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F6-3-q.webp?v=1795579333"}, "sp": [[0.2, 0, 9], [0.62, 9, 33], [2.39, 33, 61], [4.31, 61, 93], [6.29, 93, 111]]}, {"t0": 8.13, "t1": 12.13, "who": "pause", "text": "Pause and try.", "cue": {"p": 122, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F6-3-q.webp?v=1795579333"}}, {"t0": 12.13, "t1": 14.22, "who": "P", "text": "A B A: ternary.", "cue": {"p": 122, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F6-3.webp?v=1795579333"}, "sp": [[12.13, 0, 7], [14.02, 7, 15]], "mk": [{"k": "hi", "t": 12.23, "e": 14.52, "p": 122, "r": [[0.0113, 0.8669, 0.5038, 0.0991]], "pop": "F6-3"}]}, {"t0": 14.22, "t1": 15.96, "who": "B", "text": "You’ve got it.", "cue": {"p": 122, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F6-3.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 14.22, "e": 16.16, "p": 122, "r": [[0.0113, 0.8669, 0.5038, 0.0991]], "pop": "F6-3"}]}]}, {"t": "Try it: Für Elise", "f": "audio/F6/05-try-it-f-r-elise.mp3?v=1795579333", "s": 22, "p": 122, "l": [{"t0": 0.2, "t1": 9.25, "who": "B", "text": "Für Elise’s famous opening tune is A. It comes three times, with two new sections between. Listen, and raise your hand every time A returns.", "cue": {"p": 122, "r": "pop8"}, "lens": {"k": "pop", "src": "pops/F6-8.webp?v=1795579333"}, "sp": [[0.2, 0, 38], [1.6, 38, 91], [5.16, 91, 141]]}, {"t0": 9.6, "t1": 13.62, "who": "piano", "notes": [9.6, 9.91, 10.22, 10.53, 10.84, 11.15, 11.46, 11.77, 12.08], "cue": {"p": 122, "r": "pop8"}, "lens": {"k": "pop", "src": "pops/F6-8.webp?v=1795579333"}}, {"who": "B", "text": "Your little task for next time: give each phrase of a piece you play a letter, and name its form. Until next time.", "cue": {"p": 122, "r": "pop8"}, "lens": {"k": "pop", "src": "pops/F6-8.webp?v=1795579333"}, "t0": 13.82, "t1": 21.06}]}], "nx": {"wb": [null, "pp. 123–124", "Shape and style"], "dr": [["form", "Binary or ternary?", 5]]}}, {"k": "F7", "part": "Part VIII · Shape and style", "t": "7 · Musical periods: Baroque to Modern", "pages": [124, 125], "clips": [{"t": "Musical periods", "f": "audio/F7/01-musical-periods.mp3?v=1795579333", "s": 41, "p": 124, "l": [{"t0": 3.4, "t1": 11.46, "who": "B", "text": "Music changes with its time, Clara, like clothes and buildings. Four big periods cover most piano music.", "cue": {"p": 124, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 8.02, "p": 124, "r": [[0.073, 0.2045, 0.3309, 0.0243]]}, {"k": "hi", "t": 6.07, "e": 8.02, "p": 124, "r": [[0.4169, 0.2045, 0.3015, 0.0243]]}, {"k": "hi", "t": 8.02, "e": 11.86, "p": 124, "r": [[0.7316, 0.2045, 0.0989, 0.0243], [0.073, 0.2331, 0.38, 0.0243]]}], "sp": [[3.4, 0, 64], [8.02, 64, 104]]}, {"t0": 11.46, "t1": 16.45, "who": "Q", "text": "Playing Bach like Chopin is like wearing a ball gown to a picnic.", "cue": {"p": 124, "r": "lead"}, "mk": [{"k": "hi", "t": 11.46, "e": 16.85, "p": 124, "r": [[0.2107, 0.2939, 0.6608, 0.0278]]}]}, {"t0": 16.45, "t1": 22.35, "who": "B", "text": "Remember: listen for the texture, the ornaments and the pedal. They tell you the century.", "cue": {"p": 124, "r": "remember"}, "mk": [{"k": "hi", "t": 17.07, "e": 20.27, "p": 124, "r": [[0.1009, 0.3644, 0.6738, 0.0243]]}, {"k": "hi", "t": 20.27, "e": 22.75, "p": 124, "r": [[0.8553, 0.3644, 0.0438, 0.0243], [0.1009, 0.391, 0.2038, 0.0243]]}], "sp": [[16.45, 0, 10], [17.07, 10, 63], [20.27, 63, 89]]}, {"t0": 22.35, "t1": 40.71, "who": "B", "text": "Baroque, sixteen hundred to seventeen fifty: harpsichord, tunes woven together, many ornaments. Classical, to about eighteen twenty: tidy phrases and the Alberti bass. Romantic: big feelings, rich pedal and rubato. Modern: anything goes.", "cue": {"p": 124, "r": "table"}, "mk": [{"k": "hi", "t": 25.02, "e": 28.44, "p": 124, "r": [[0.2911, 0.6927, 0.1282, 0.0208]]}, {"k": "hi", "t": 25.71, "e": 28.44, "p": 124, "r": [[0.6824, 0.6927, 0.133, 0.0208], [0.2911, 0.7162, 0.0912, 0.0208]]}, {"k": "hi", "t": 26.99, "e": 28.44, "p": 124, "r": [[0.3942, 0.7162, 0.1789, 0.0208]]}, {"k": "hi", "t": 30.74, "e": 33.31, "p": 124, "r": [[0.6719, 0.7713, 0.2102, 0.0208], [0.3331, 0.7948, 0.0846, 0.0208]]}, {"k": "hi", "t": 34.33, "e": 36.85, "p": 124, "r": [[0.2911, 0.8267, 0.4944, 0.0208]]}], "sp": [[22.35, 0, 45], [25.02, 45, 96], [28.44, 96, 133], [30.74, 133, 168], [33.31, 168, 178], [34.33, 178, 215], [36.85, 215, 223], [38.73, 223, 237]]}]}, {"t": "Playing in style", "f": "audio/F7/02-playing-in-style.mp3?v=1795579333", "s": 16, "p": 125, "l": [{"t0": 0.2, "t1": 16.29, "who": "B", "text": "Baroque: little or no pedal, steady time, a clear touch. Classical: light pedal, steady time, a neat, singing tune. Romantic: rich pedal, rubato, deep legato. Modern: whatever the music asks.", "cue": {"p": 125, "r": "h:Playing in style"}, "mk": [{"k": "hi", "t": 0.58, "e": 3.64, "p": 125, "r": [[0.274, 0.1855, 0.4764, 0.015], [0.0861, 0.2109, 0.6505, 0.0208]]}, {"k": "hi", "t": 5.91, "e": 7.81, "p": 125, "r": [[0.6839, 0.2425, 0.0473, 0.0208]]}, {"k": "hi", "t": 6.43, "e": 7.81, "p": 125, "r": [[0.8056, 0.2425, 0.0789, 0.0208], [0.6839, 0.2659, 0.0475, 0.0208]]}, {"k": "hi", "t": 9.82, "e": 12.27, "p": 125, "r": [[0.496, 0.2975, 0.0699, 0.0208]]}, {"k": "hi", "t": 9.82, "e": 12.27, "p": 125, "r": [[0.6839, 0.2975, 0.1334, 0.0208]]}, {"k": "hi", "t": 13.33, "e": 16.69, "p": 125, "r": [[0.6839, 0.329, 0.2085, 0.0208], [0.6839, 0.3524, 0.0481, 0.0208]]}], "sp": [[0.2, 0, 9], [0.58, 9, 57], [3.64, 57, 68], [4.39, 68, 116], [7.81, 116, 126], [8.66, 126, 159], [12.27, 159, 167], [13.33, 167, 191]]}]}, {"t": "Example: which period?", "f": "audio/F7/03-example-which-period.mp3?v=1795579333", "s": 14, "p": 124, "l": [{"t0": 0.2, "t1": 6.4, "who": "B", "text": "A tune over an Alberti bass, with tidy four-bar phrases. Which period? Pause.", "cue": {"p": 124, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F7-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 57], [4.09, 57, 71], [5.14, 71, 77]]}, {"t0": 6.4, "t1": 9.4, "who": "pause", "text": "Pause and try.", "cue": {"p": 124, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F7-1-q.webp?v=1795579333"}}, {"t0": 9.4, "t1": 11.72, "who": "P", "text": "Classical. Think Mozart.", "cue": {"p": 124, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/F7-1.webp?v=1795579333"}, "sp": [[9.4, 0, 11], [9.9, 11, 24]], "mk": [{"k": "hi", "t": 9.5, "e": 12.02, "p": 124, "r": [[0.0135, 0.8615, 0.3199, 0.1014]], "pop": "F7-1"}]}, {"who": "B", "text": "Beautifully worked out.", "cue": {"p": 124, "r": "pop1"}, "t0": 11.72, "lens": {"k": "pop", "src": "pops/F7-1.webp?v=1795579333"}, "t1": 13.58, "mk": [{"k": "hi", "t": 11.72, "e": 13.78, "p": 124, "r": [[0.0135, 0.8615, 0.3199, 0.1014]], "pop": "F7-1"}]}]}, {"t": "Example: and this one?", "f": "audio/F7/04-example-and-this-one.mp3?v=1795579333", "s": 13, "p": 124, "l": [{"t0": 0.2, "t1": 6.36, "who": "B", "text": "Rubato, rich pedalled chords, huge leaps across the keyboard. Pause.", "cue": {"p": 124, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F7-3-q.webp?v=1795579333"}, "sp": [[0.2, 0, 62], [4.95, 62, 68]]}, {"t0": 6.36, "t1": 9.36, "who": "pause", "text": "Pause and try.", "cue": {"p": 124, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F7-3-q.webp?v=1795579333"}}, {"t0": 9.36, "t1": 11.62, "who": "P", "text": "Romantic. Think Chopin.", "cue": {"p": 124, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F7-3.webp?v=1795579333"}, "sp": [[9.36, 0, 10], [9.95, 10, 23]], "mk": [{"k": "hi", "t": 9.46, "e": 11.92, "p": 124, "r": [[0.0143, 0.8571, 0.3178, 0.0963]], "pop": "F7-3"}]}, {"t0": 11.62, "t1": 13.34, "who": "B", "text": "Top marks.", "cue": {"p": 124, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/F7-3.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 11.62, "e": 13.54, "p": 124, "r": [[0.0143, 0.8571, 0.3178, 0.0963]], "pop": "F7-3"}]}]}, {"t": "Try it", "f": "audio/F7/05-try-it.mp3?v=1795579333", "s": 12, "p": 124, "l": [{"t0": 0.2, "t1": 11.61, "who": "B", "text": "Match each composer to a period: Bach, Mozart, Chopin, Debussy. Baroque, Classical, Romantic, Modern. And that is the end of Part Eight. Until next time.", "cue": {"p": 124, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/F7-4.webp?v=1795579333"}, "sp": [[0.2, 0, 33], [2.36, 33, 64], [5.14, 64, 102], [7.82, 102, 137], [9.77, 137, 153]]}]}], "nx": {"wb": [null, "pp. 125–126", "Shape and style"], "dr": [["styles", "Which period sounds like this?", 3]]}}, {"k": "O9", "part": "Part IX · Playing and listening", "t": "Part opener", "pages": [126], "clips": [{"t": "Part Nine: Playing and listening", "f": "audio/O9/01-part-nine-playing-and-listening.mp3?v=1795579333", "s": 46, "p": 126, "l": [{"t0": 3.4, "t1": 8.39, "who": "B", "text": "Welcome to Part Nine, Clara: Playing and listening. At the piano.", "cue": {"p": 126, "r": "opener"}, "mk": [{"k": "hi", "t": 5.4, "e": 6.81, "p": 126, "r": [[0.073, 0.2235, 0.6565, 0.0641]]}], "sp": [[3.4, 0, 29], [5.4, 29, 52], [6.81, 52, 65]]}, {"t0": 8.39, "t1": 21.69, "who": "B", "text": "Everything before this part is knowledge. This part turns it into playing: the right fingers, practice that works, reading at sight, a trained ear, calm on stage, and what to do when something goes wrong.", "cue": {"p": 126, "r": "opener"}, "mk": [{"k": "hi", "t": 10.91, "e": 12.88, "p": 126, "r": [[0.073, 0.0748, 0.076, 0.0125], [0.073, 0.2235, 0.2343, 0.0641]]}], "sp": [[8.39, 0, 42], [10.91, 42, 75], [12.88, 75, 204]]}, {"t0": 21.69, "t1": 28.19, "who": "piano", "notes": [21.69, 22.31, 22.93, 23.55, 24.17, 24.79, 25.41, 26.03, 26.65], "cue": {"p": 126, "r": "opener"}}, {"t0": 28.19, "t1": 31.16, "who": "P", "text": "Five fingers, five notes, up and back!", "cue": {"p": 126, "r": "opener"}}, {"t0": 31.16, "t1": 44.19, "who": "B", "text": "Seven chapters: fingering, how to practise, sight-reading, listening for major or minor, intervals by song, performing, and common mistakes and how to fix them. Shall we start with your fingers?", "cue": {"p": 126, "r": "chapters"}, "mk": [{"k": "hi", "t": 32.42, "e": 41.96, "p": 126, "r": [[0.3316, 0.3494, 0.0792, 0.0178]]}, {"k": "hi", "t": 32.96, "e": 41.96, "p": 126, "r": [[0.1673, 0.3708, 0.0711, 0.0178]]}, {"k": "hi", "t": 34.19, "e": 41.96, "p": 126, "r": [[0.1006, 0.3922, 0.1209, 0.0178]]}, {"k": "hi", "t": 35.06, "e": 41.96, "p": 126, "r": [[0.1014, 0.4135, 0.2226, 0.0178]]}, {"k": "hi", "t": 37.05, "e": 41.96, "p": 126, "r": [[0.213, 0.4349, 0.1484, 0.0178]]}, {"k": "hi", "t": 38.28, "e": 41.96, "p": 126, "r": [[0.1011, 0.4563, 0.0986, 0.0178]]}, {"k": "hi", "t": 39.12, "e": 41.96, "p": 126, "r": [[0.0993, 0.4776, 0.3493, 0.0178]]}], "sp": [[31.16, 0, 16], [32.42, 16, 161], [41.96, 161, 194]]}, {"t0": 44.19, "t1": 46.34, "who": "P", "text": "Ready when you are, Butler!", "cue": {"p": 126, "r": "chapters"}}]}]}, {"k": "L1", "part": "Part IX · Playing and listening", "t": "1 · Piano finger numbers and fingering", "pages": [127, 128], "clips": [{"t": "Finger numbers and fingering", "f": "audio/L1/01-finger-numbers-and-fingering.mp3?v=1795579333", "s": 32, "p": 127, "l": [{"t0": 3.4, "t1": 14.25, "who": "B", "text": "Good fingering makes hard passages easy, Clara, and keeps your hand relaxed. It is planned, not guessed, and the plan starts with a number for every finger.", "cue": {"p": 127, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 8.9, "p": 127, "r": [[0.073, 0.1895, 0.4453, 0.0215]]}, {"k": "hi", "t": 6.01, "e": 8.9, "p": 127, "r": [[0.073, 0.2514, 0.0607, 0.0133]]}, {"k": "hi", "t": 6.91, "e": 8.9, "p": 127, "r": [[0.5705, 0.1895, 0.2549, 0.0215]]}, {"k": "hi", "t": 8.9, "e": 14.65, "p": 127, "r": [[0.073, 0.2148, 0.084, 0.0215]]}, {"k": "hi", "t": 9.95, "e": 14.65, "p": 127, "r": [[0.209, 0.2148, 0.088, 0.0215]]}, {"k": "hi", "t": 11.08, "e": 14.65, "p": 127, "r": [[0.3942, 0.2148, 0.4316, 0.0215]]}], "sp": [[3.4, 0, 77], [8.9, 77, 156]]}, {"t0": 14.25, "t1": 20.61, "who": "B", "text": "Remember: thumbs are one in both hands. Choose a fingering once, write it in, and keep it.", "cue": {"p": 127, "r": "remember"}, "mk": [{"k": "hi", "t": 14.64, "e": 16.91, "p": 127, "r": [[0.0977, 0.3056, 0.3235, 0.0215]]}, {"k": "hi", "t": 16.91, "e": 21.01, "p": 127, "r": [[0.435, 0.3056, 0.2834, 0.0215]]}, {"k": "hi", "t": 18.36, "e": 21.01, "p": 127, "r": [[0.7322, 0.3056, 0.0584, 0.0215]]}, {"k": "hi", "t": 19.37, "e": 21.01, "p": 127, "r": [[0.0977, 0.3291, 0.0558, 0.0215]]}], "sp": [[14.25, 0, 10], [14.64, 10, 40], [16.91, 40, 90]]}, {"t0": 20.61, "t1": 25.87, "who": "B", "text": "Five-finger position: thumb on C, one finger on each key up to G.", "cue": {"p": 127, "r": "h:Five-finger position"}, "mk": [{"k": "hi", "t": 20.61, "e": 22.04, "p": 127, "r": [[0.073, 0.6747, 0.2283, 0.0215]]}, {"k": "hi", "t": 22.04, "e": 26.27, "p": 127, "r": [[0.073, 0.8869, 0.42, 0.0184]]}], "sp": [[20.61, 0, 22], [22.04, 22, 65]]}, {"t0": 25.87, "t1": 32.37, "who": "piano", "notes": [25.87, 26.49, 27.11, 27.73, 28.35, 28.97, 29.59, 30.21, 30.83], "cue": {"p": 127, "r": "h:Five-finger position"}}]}, {"t": "Plan your fingering", "f": "audio/L1/02-plan-your-fingering.mp3?v=1795579333", "s": 66, "p": 128, "l": [{"t0": 0.2, "t1": 9.21, "who": "B", "text": "A finger number belongs to the music, not to the key, Clara. The same C can be finger one in one bar and finger three in the next.", "cue": {"p": 128, "r": "h:Plan your fingering"}, "mk": [{"k": "hi", "t": 0.2, "e": 4.29, "p": 128, "r": [[0.0953, 0.1431, 0.3899, 0.0208]]}, {"k": "hi", "t": 2.37, "e": 4.29, "p": 128, "r": [[0.6082, 0.1431, 0.0355, 0.0208]]}, {"k": "hi", "t": 4.29, "e": 9.61, "p": 128, "r": [[0.7025, 0.1431, 0.1607, 0.0208], [0.073, 0.1691, 0.454, 0.0208]]}], "sp": [[0.2, 0.0, 61], [4.29, 61.0, 130]]}, {"t0": 9.21, "t1": 11.99, "who": "P", "text": "Then how do I know which finger to use?", "cue": {"p": 128, "r": "h:Plan your fingering"}}, {"t0": 11.99, "t1": 25.85, "who": "B", "text": "If the fingering is printed, follow it: the plan is already made for you. If not, plan it before you play. Look ahead: where must the hand be for the highest and the lowest notes? Choose fingers that get it there without twisting.", "cue": {"p": 128, "r": "h:Plan your fingering"}, "mk": [{"k": "hi", "t": 11.99, "e": 14.16, "p": 128, "r": [[0.2753, 0.2583, 0.1866, 0.0208]]}, {"k": "hi", "t": 14.16, "e": 16.28, "p": 128, "r": [[0.5769, 0.2583, 0.2235, 0.0208]]}, {"k": "hi", "t": 16.28, "e": 18.52, "p": 128, "r": [[0.3935, 0.2898, 0.2175, 0.0208]]}, {"k": "hi", "t": 18.52, "e": 19.72, "p": 128, "r": [[0.6229, 0.2898, 0.1254, 0.0208]]}, {"k": "hi", "t": 19.46, "e": 22.7, "p": 128, "r": [[0.7601, 0.2898, 0.1244, 0.0208], [0.3935, 0.3133, 0.4556, 0.0208], [0.3935, 0.3367, 0.0595, 0.0208]]}, {"k": "hi", "t": 22.7, "e": 26.25, "p": 128, "r": [[0.4726, 0.3367, 0.4235, 0.0208], [0.3935, 0.3602, 0.084, 0.0208]]}], "sp": [[11.99, -0.0, 40], [14.16, 40.0, 74], [16.28, 74.0, 107], [18.52, 107.0, 119], [19.46, 119.0, 180], [22.7, 180.0, 230]]}, {"t0": 25.85, "t1": 35.8, "who": "B", "text": "More than five notes in a row? Plan where the hand moves, at a rest or a gap. And for a leap, move the whole hand; do not stretch the fingers apart.", "cue": {"p": 128, "r": "h:Plan your fingering"}, "mk": [{"k": "hi", "t": 25.85, "e": 27.68, "p": 128, "r": [[0.0861, 0.4034, 0.2696, 0.0208], [0.0861, 0.4269, 0.0625, 0.0208]]}, {"k": "hi", "t": 27.68, "e": 31.18, "p": 128, "r": [[0.3935, 0.3917, 0.4686, 0.0208]]}, {"k": "hi", "t": 31.18, "e": 33.39, "p": 128, "r": [[0.1109, 0.4818, 0.0499, 0.0208], [0.3935, 0.4701, 0.2279, 0.0208]]}, {"k": "hi", "t": 33.39, "e": 36.2, "p": 128, "r": [[0.7092, 0.4701, 0.1973, 0.0208], [0.3935, 0.4936, 0.0565, 0.0208]]}], "sp": [[25.85, -0.0, 31], [27.68, 31.0, 78], [31.18, 78.0, 115], [33.39, 115.0, 148]]}, {"who": "B", "text": "And one extra for later: in a scale, the thumb passes under the hand to keep going.", "cue": {"p": 128, "r": "h:Plan your fingering"}, "t0": 35.8, "t1": 41.85, "mk": [{"k": "hi", "t": 37.59, "e": 42.25, "p": 128, "r": [[0.5283, 0.605, 0.3646, 0.0208], [0.096, 0.631, 0.2085, 0.0208]]}], "sp": [[35.8, 0, 25], [37.59, 25, 83]]}, {"who": "P", "text": "The thumb is like a little tunnel under a bridge!", "cue": {"p": 128, "r": "h:Plan your fingering"}, "t0": 41.85, "t1": 44.78}, {"who": "B", "text": "A smooth tunnel, please, no bumps. You will build it with the scales.", "cue": {"p": 128, "r": "h:Plan your fingering"}, "t0": 44.78, "t1": 49.67, "mk": [{"k": "hi", "t": 47.45, "e": 50.07, "p": 128, "r": [[0.2316, 0.6571, 0.2847, 0.0208]]}], "sp": [[44.78, 0, 35], [47.45, 35, 69]]}, {"t0": 49.67, "t1": 54.78, "who": "B", "text": "Then write your plan in pencil and play it the same way every time.", "cue": {"p": 128, "r": "h:Plan your fingering"}, "mk": [{"k": "hi", "t": 49.67, "e": 55.18, "p": 128, "r": [[0.073, 0.5274, 0.8436, 0.0208]]}]}, {"t0": 54.78, "t1": 66.01, "who": "B", "text": "Two traps. Mixing up the hands: both thumbs are one, so from C up the left hand plays five, four, three, two, one. And changing your fingering every time you play.", "cue": {"p": 128, "r": "trap"}, "mk": [{"k": "hi", "t": 55.72, "e": 57.09, "p": 128, "r": [[0.1145, 0.748, 0.2188, 0.0208]]}, {"k": "hi", "t": 57.09, "e": 62.9, "p": 128, "r": [[0.3452, 0.748, 0.1364, 0.0208]]}, {"k": "hi", "t": 62.02, "e": 63.02, "p": 128, "r": [[0.6301, 0.8029, 0.04, 0.0208]]}, {"k": "hi", "t": 62.9, "e": 66.41, "p": 128, "r": [[0.1145, 0.8029, 0.4195, 0.0208]]}], "sp": [[54.78, 13.87, 11], [55.72, 24.87, 32], [57.09, 45.87, 115], [62.9, 128.87, 163]]}]}, {"t": "Example: left hand or right?", "f": "audio/L1/03-example-left-hand-or-right.mp3?v=1795579333", "s": 21, "p": 127, "l": [{"t0": 0.2, "t1": 7.7, "who": "B", "text": "Put your left hand on C D E F G, little finger on C. Which finger plays the G? Pause and try.", "cue": {"p": 127, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L1-2-q.webp?v=1795579333"}, "sp": [[0.2, 0, 53], [4.2, 53, 79], [5.91, 79, 93]]}, {"t0": 7.7, "t1": 11.7, "who": "pause", "text": "Pause and try.", "cue": {"p": 127, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L1-2-q.webp?v=1795579333"}}, {"t0": 11.7, "t1": 15.55, "who": "P", "text": "The thumb! In the left hand the thumb is on the right, so G is one.", "cue": {"p": 127, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L1-2.webp?v=1795579333"}, "mk": [{"k": "key", "t": 14.07, "e": 15.95, "p": 127, "r": [[0.6339, 0.1959, 0.085, 0.4622]], "n": "G", "pop": "L1-2"}], "sp": [[11.7, 0, 11], [12.2, 11, 67]]}, {"who": "B", "text": "Well spotted, Clara.", "cue": {"p": 127, "r": "pop2"}, "t0": 15.55, "lens": {"k": "pop", "src": "pops/L1-2.webp?v=1795579333"}, "t1": 17.54}, {"t0": 17.54, "t1": 21.22, "who": "piano", "notes": [17.54, 18.16, 18.78, 19.4, 20.02], "cue": {"p": 127, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L1-2.webp?v=1795579333"}, "mk": [{"k": "key", "t": 17.54, "e": 21.22, "p": 127, "r": [[0.2938, 0.1959, 0.085, 0.4622]], "n": "C", "snd": 1, "pop": "L1-2"}, {"k": "key", "t": 18.16, "e": 21.22, "p": 127, "r": [[0.3788, 0.1959, 0.085, 0.4622]], "n": "D", "snd": 1, "pop": "L1-2"}, {"k": "key", "t": 18.78, "e": 21.22, "p": 127, "r": [[0.4638, 0.1959, 0.085, 0.4622]], "n": "E", "snd": 1, "pop": "L1-2"}, {"k": "key", "t": 19.4, "e": 21.22, "p": 127, "r": [[0.5489, 0.1959, 0.085, 0.4622]], "n": "F", "snd": 1, "pop": "L1-2"}, {"k": "key", "t": 20.02, "e": 21.22, "p": 127, "r": [[0.6339, 0.1959, 0.085, 0.4622]], "n": "G", "snd": 1, "pop": "L1-2"}]}]}, {"t": "Try it", "f": "audio/L1/04-try-it.mp3?v=1795579333", "s": 19, "p": 127, "l": [{"t0": 0.2, "t1": 9.9, "who": "B", "text": "Right hand on C D E F G. Play up and down, saying the finger numbers aloud. Then the left hand: five, four, three, two, one from C up.", "cue": {"p": 127, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/L1-4.webp?v=1795579333"}, "mk": [{"k": "nt", "t": 8.96, "e": 9.9, "p": 127, "r": [[0.5866, 0.2975, 0.0058, 0.0151]], "n": "C", "pop": "L1-4"}], "sp": [[0.2, 0, 25], [2.47, 25, 76], [5.73, 76, 96], [6.87, 96, 135]]}, {"who": "B", "text": "Your little task for next time: write the fingering into one tricky bar of a piece you are learning, and keep it. Until next time.", "cue": {"p": 127, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/L1-4.webp?v=1795579333"}, "t0": 10.45, "t1": 18.43}]}], "nx": {"wb": [null, "pp. 130–131", "Part IX · Playing and listening"], "dr": [["hand-positions", "Which finger? C position", 1]]}}, {"k": "L2", "part": "Part IX · Playing and listening", "t": "2 · How to practise piano", "pages": [129, 130], "clips": [{"t": "How to practise", "f": "audio/L2/01-how-to-practise.mp3?v=1795579333", "s": 29, "p": 129, "l": [{"t0": 3.4, "t1": 13.32, "who": "B", "text": "Practice is not playing a piece again and again from the top, Clara. It is fixing the hard bits, slowly and correctly, then joining them back together.", "cue": {"p": 129, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 7.55, "p": 129, "r": [[0.073, 0.1736, 0.7104, 0.0243]]}, {"k": "hi", "t": 7.55, "e": 13.72, "p": 129, "r": [[0.851, 0.1736, 0.0654, 0.0243], [0.073, 0.2022, 0.1506, 0.0243]]}, {"k": "hi", "t": 9.31, "e": 13.72, "p": 129, "r": [[0.2367, 0.2022, 0.2311, 0.0243]]}, {"k": "hi", "t": 10.99, "e": 13.72, "p": 129, "r": [[0.541, 0.2022, 0.3208, 0.0243]]}], "sp": [[3.4, 0, 69], [7.55, 69, 151]]}, {"t0": 13.32, "t1": 19.05, "who": "B", "text": "Remember: slow, small and correct; then a little faster; then join the pieces.", "cue": {"p": 129, "r": "remember"}, "mk": [{"k": "hi", "t": 13.68, "e": 15.66, "p": 129, "r": [[0.1009, 0.3203, 0.3149, 0.0243]]}, {"k": "hi", "t": 15.66, "e": 17.02, "p": 129, "r": [[0.5226, 0.3203, 0.1486, 0.0243]]}, {"k": "hi", "t": 17.02, "e": 19.45, "p": 129, "r": [[0.7536, 0.3203, 0.0988, 0.0243], [0.1009, 0.3469, 0.0862, 0.0243]]}], "sp": [[13.32, 0, 10], [13.68, 10, 35], [15.66, 35, 57], [17.02, 57, 78]]}, {"t0": 19.05, "t1": 28.96, "who": "B", "text": "A fifteen-minute plan: two minutes of warm-up, five on the hardest bars, slowly, five joining them up, and three playing the whole piece, for joy.", "cue": {"p": 129, "r": "table"}, "sp": [[19.05, 0, 23], [20.61, 23, 146]]}]}, {"t": "Four tools", "f": "audio/L2/02-four-tools.mp3?v=1795579333", "s": 21, "p": 130, "l": [{"t0": 0.2, "t1": 13.02, "who": "B", "text": "Small chunks: one bar, plus the first note of the next. Hands separately until each is easy. Slow, then faster: three correct times, then one notch up the metronome. And count aloud.", "cue": {"p": 130, "r": "h:Four tools"}, "mk": [{"k": "hi", "t": 0.2, "e": 1.4, "p": 130, "r": [[0.0861, 0.2126, 0.1537, 0.0208]]}, {"k": "hi", "t": 1.19, "e": 3.81, "p": 130, "r": [[0.3891, 0.2126, 0.3151, 0.0208]]}, {"k": "hi", "t": 3.81, "e": 6.31, "p": 130, "r": [[0.0861, 0.2441, 0.4876, 0.0208]]}, {"k": "hi", "t": 6.31, "e": 7.82, "p": 130, "r": [[0.0861, 0.2874, 0.193, 0.0208]]}, {"k": "hi", "t": 7.82, "e": 11.19, "p": 130, "r": [[0.3835, 0.2756, 0.5231, 0.0208], [0.3423, 0.2991, 0.0943, 0.0208]]}, {"k": "hi", "t": 11.19, "e": 13.42, "p": 130, "r": [[0.0861, 0.3306, 0.1361, 0.0208]]}], "sp": [[0.2, 0, 14], [1.19, 14, 56], [3.81, 56, 93], [6.31, 93, 112], [7.82, 112, 166], [11.19, 166, 182]]}, {"t0": 13.02, "t1": 16.08, "who": "P", "text": "I played it right twice. That’s nearly three.", "cue": {"p": 130, "r": "h:Four tools"}, "sp": [[13.02, 0, 25], [14.37, 25, 45]]}, {"t0": 16.08, "t1": 21.26, "who": "B", "text": "Three right in a row, then faster. Nearly right doesn’t count, I’m afraid.", "cue": {"p": 130, "r": "h:Four tools"}, "mk": [{"k": "hi", "t": 16.08, "e": 18.43, "p": 130, "r": [[0.2116, 0.2874, 0.0675, 0.0208], [0.3423, 0.2756, 0.3081, 0.0208]]}], "sp": [[16.08, 0, 35], [18.43, 35, 74]]}]}, {"t": "Example: which bar first?", "f": "audio/L2/03-example-which-bar-first.mp3?v=1795579333", "s": 16, "p": 129, "l": [{"t0": 0.2, "t1": 6.83, "who": "B", "text": "You play the piece through, and it slips at the semiquavers in bar three. Where do you start? Pause.", "cue": {"p": 129, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L2-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 74], [4.39, 74, 94], [5.47, 94, 100]]}, {"t0": 6.83, "t1": 9.83, "who": "pause", "text": "Pause and try.", "cue": {"p": 129, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L2-1-q.webp?v=1795579333"}}, {"t0": 9.83, "t1": 14.52, "who": "P", "text": "Bar three, slowly. The hardest bar first, then join bars two to four.", "cue": {"p": 129, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L2-1.webp?v=1795579333"}, "sp": [[9.83, 0, 19], [11.17, 19, 69]], "mk": [{"k": "hi", "t": 9.93, "e": 14.82, "p": 129, "r": [[0.0113, 0.866, 0.8113, 0.1028]], "pop": "L2-1"}]}, {"t0": 14.52, "t1": 16.16, "who": "B", "text": "Marvellous.", "cue": {"p": 129, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L2-1.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 14.52, "e": 16.36, "p": 129, "r": [[0.0113, 0.866, 0.8113, 0.1028]], "pop": "L2-1"}]}]}, {"t": "Example: when do you speed up?", "f": "audio/L2/04-example-when-do-you-speed-up.mp3?v=1795579333", "s": 21, "p": 129, "l": [{"t0": 0.2, "t1": 4.18, "who": "B", "text": "At sixty: right, right, wrong. Do you speed up? Pause.", "cue": {"p": 129, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L2-2-q.webp?v=1795579333"}, "sp": [[0.2, 0, 10], [0.88, 10, 31], [1.93, 31, 48], [2.91, 48, 54]]}, {"t0": 4.18, "t1": 7.18, "who": "pause", "text": "Pause and try.", "cue": {"p": 129, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L2-2-q.webp?v=1795579333"}}, {"who": "P", "text": "Now! Two right is nearly three.", "cue": {"p": 129, "r": "pop2"}, "t0": 7.18, "lens": {"k": "pop", "src": "pops/L2-2-q.webp?v=1795579333"}, "t1": 9.65}, {"who": "B", "text": "Nearly isn’t three, I’m afraid. After a mistake, start counting again: three correct in a row at sixty, then try sixty-six.", "cue": {"p": 129, "r": "pop2"}, "t0": 9.65, "lens": {"k": "pop", "src": "pops/L2-2-q.webp?v=1795579333"}, "t1": 18.73}, {"who": "P", "text": "Fine. Patience, patience.", "cue": {"p": 129, "r": "pop2"}, "t0": 18.73, "lens": {"k": "pop", "src": "pops/L2-2.webp?v=1795579333"}, "t1": 21.16, "mk": [{"k": "hi", "t": 18.83, "e": 21.46, "p": 129, "r": [[0.0123, 0.8365, 0.5365, 0.1255]], "pop": "L2-2"}]}]}, {"t": "Try it", "f": "audio/L2/05-try-it.mp3?v=1795579333", "s": 9, "p": 129, "l": [{"t0": 0.2, "t1": 9.2, "who": "B", "text": "Pick one hard bar. Play it three times correctly, slowly, then one notch faster. Stop when it slips twice. Until next time.", "cue": {"p": 129, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/L2-3.webp?v=1795579333"}, "sp": [[0.2, 0, 19], [1.58, 19, 81], [5.52, 81, 107], [7.35, 107, 123]]}]}], "nx": {"wb": [null, "pp. 132–133", "Playing and listening"], "dr": [["hb-practice", "Practising Well", 0]]}}, {"k": "L3", "part": "Part IX · Playing and listening", "t": "3 · Sight-reading", "pages": [131], "clips": [{"t": "Sight-reading", "f": "audio/L3/01-sight-reading.mp3?v=1795579333", "s": 42, "p": 131, "l": [{"t0": 3.4, "t1": 12.76, "who": "B", "text": "Sight-reading is playing music you have never seen, Clara. The secret is a short look first, then keeping the beat going whatever happens.", "cue": {"p": 131, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 7.16, "p": 131, "r": [[0.073, 0.1354, 0.4681, 0.0187]]}, {"k": "hi", "t": 7.16, "e": 13.16, "p": 131, "r": [[0.5909, 0.1354, 0.2828, 0.0187], [0.073, 0.1574, 0.3823, 0.0187]]}], "sp": [[3.4, 0.0, 59], [7.16, 59.0, 138]]}, {"who": "P", "text": "That sounds scary. Like reading a book in the dark.", "cue": {"p": 131, "r": "lead"}, "t0": 12.76, "t1": 16.03, "sp": [[12.76, 0, 19], [13.92, 19, 51]]}, {"who": "B", "text": "Not if you bring a torch.", "cue": {"p": 131, "r": "lead"}, "t0": 16.03, "t1": 18.3}, {"t0": 18.3, "t1": 21.52, "who": "P", "text": "Like a pilot checking the plane before take-off!", "cue": {"p": 131, "r": "lead"}, "mk": [{"k": "hi", "t": 18.3, "e": 21.92, "p": 131, "r": [[0.1423, 0.1821, 0.3704, 0.0214]]}]}, {"t0": 21.52, "t1": 27.27, "who": "B", "text": "Remember: look before you play, then never stop. The beat matters more than any note.", "cue": {"p": 131, "r": "remember"}, "mk": [{"k": "hi", "t": 22.05, "e": 24.6, "p": 131, "r": [[0.0945, 0.2364, 0.3815, 0.0187]]}, {"k": "hi", "t": 24.6, "e": 27.67, "p": 131, "r": [[0.5272, 0.2364, 0.333, 0.0187]]}], "sp": [[21.52, 5.54, 10], [22.05, 15.54, 49], [24.6, 54.54, 85]]}, {"t0": 27.27, "t1": 37.32, "who": "B", "text": "The thirty-second scan: the key, the time signature, the first notes, the trickiest rhythm, the patterns, and the marks. Then count a bar, and go.", "cue": {"p": 131, "r": "table"}, "mk": [{"k": "hi", "t": 27.27, "e": 28.96, "p": 131, "r": [[0.1173, 0.4533, 0.1876, 0.0187]]}, {"k": "hi", "t": 28.96, "e": 34.93, "p": 131, "r": [[0.0976, 0.4996, 0.0304, 0.016]]}, {"k": "hi", "t": 29.62, "e": 34.93, "p": 131, "r": [[0.371, 0.5238, 0.1204, 0.016]]}, {"k": "hi", "t": 31.88, "e": 34.93, "p": 131, "r": [[0.371, 0.5724, 0.1294, 0.016]]}, {"k": "hi", "t": 32.91, "e": 34.93, "p": 131, "r": [[0.1007, 0.5966, 0.0747, 0.016]]}, {"k": "hi", "t": 33.85, "e": 34.93, "p": 131, "r": [[0.1011, 0.6209, 0.055, 0.016]]}, {"k": "hi", "t": 34.93, "e": 37.72, "p": 131, "r": [[0.5005, 0.5238, 0.0938, 0.016]]}], "sp": [[27.27, 5.54, 24], [28.96, 29.54, 121], [34.93, 126.54, 146]]}, {"t0": 37.32, "t1": 42.35, "who": "B", "text": "And read ahead: while you play one bar, let your eyes move to the next.", "cue": {"p": 131, "r": "more"}, "mk": [{"k": "hi", "t": 37.32, "e": 38.52, "p": 131, "r": [[0.073, 0.6728, 0.1043, 0.016]]}, {"k": "hi", "t": 38.37, "e": 42.75, "p": 131, "r": [[0.0982, 0.6924, 0.4561, 0.016]]}], "sp": [[37.32, 5.54, 16], [38.37, 21.54, 71]]}]}, {"t": "Example: what do you check first?", "f": "audio/L3/02-example-what-do-you-check-first.mp3?v=1795579333", "s": 15, "p": 131, "l": [{"t0": 0.2, "t1": 5.44, "who": "B", "text": "One sharp, three-four, and an F in bar two. What do you play? Pause.", "cue": {"p": 131, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L3-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 44], [3.16, 44, 62], [4.15, 62, 68]]}, {"t0": 5.44, "t1": 8.44, "who": "pause", "text": "Pause and try.", "cue": {"p": 131, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L3-1-q.webp?v=1795579333"}}, {"t0": 8.44, "t1": 13.2, "who": "P", "text": "G major, three beats, and the F is F sharp. Count one, two, three, and go.", "cue": {"p": 131, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L3-1.webp?v=1795579333"}, "sp": [[8.44, 0, 44], [11.05, 44, 74]], "mk": [{"k": "hi", "t": 8.54, "e": 13.5, "p": 131, "r": [[0.0118, 0.8634, 0.8208, 0.1025]], "pop": "L3-1"}]}, {"t0": 13.2, "t1": 14.81, "who": "B", "text": "Splendid.", "cue": {"p": 131, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L3-1.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 13.2, "e": 15.01, "p": 131, "r": [[0.0118, 0.8634, 0.8208, 0.1025]], "pop": "L3-1"}]}]}, {"t": "Example: a wrong note", "f": "audio/L3/03-example-a-wrong-note.mp3?v=1795579333", "s": 14, "p": 131, "l": [{"t0": 0.2, "t1": 5.25, "who": "B", "text": "A wrong note in bar two. Stop and fix it, or keep going? Pause.", "cue": {"p": 131, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L3-2-q.webp?v=1795579333"}, "sp": [[0.2, 0, 25], [1.97, 25, 57], [3.83, 57, 63]]}, {"t0": 5.25, "t1": 8.25, "who": "pause", "text": "Pause and try.", "cue": {"p": 131, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L3-2-q.webp?v=1795579333"}}, {"t0": 8.25, "t1": 12.94, "who": "P", "text": "Keep going, and catch the next beat. A stop is heard far more than a wrong note.", "cue": {"p": 131, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L3-2.webp?v=1795579333"}, "sp": [[8.25, 0, 37], [10.26, 37, 80]], "mk": [{"k": "hi", "t": 8.35, "e": 13.24, "p": 131, "r": [[0.0143, 0.8525, 0.9727, 0.1148]], "pop": "L3-2"}]}, {"who": "B", "text": "Perfect.", "cue": {"p": 131, "r": "pop2"}, "t0": 12.94, "lens": {"k": "pop", "src": "pops/L3-2.webp?v=1795579333"}, "t1": 14.16, "mk": [{"k": "hi", "t": 12.94, "e": 14.36, "p": 131, "r": [[0.01 ]]}, {"t0": 13.05, "t1": 15.25, "who": "B", "text": "Very good, Clara.", "cue": {"p": 132, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L4-2.webp?v=1795579333"}}, {"t0": 15.25, "t1": 18.45, "who": "piano", "notes": [15.25, 16.7], "cue": {"p": 132, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/L4-2.webp?v=1795579333"}}]}, {"t": "Try it", "f": "audio/L4/03-try-it.mp3?v=1795579333", "s": 10, "p": 132, "l": [{"t0": 0.2, "t1": 9.86, "who": "B", "text": "Ask someone to clap two bars; clap them straight back, keeping the beat. Then sing back a short tune and find it on the keys. Until next time.", "cue": {"p": 132, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/L4-3.webp?v=1795579333"}, "sp": [[0.2, 0, 30], [2.09, 30, 73], [4.75, 73, 126], [8.02, 126, 142]]}]}], "nx": {"wb": [null, "pp. 136–137", "Playing and listening"], "dr": [["chords", "Listen: major or minor?", 5]]}}, {"k": "L5", "part": "Part IX · Playing and listening", "t": "5 · Ear training: intervals by song", "pages": [133], "clips": [{"t": "Intervals by song", "f": "audio/L5/01-intervals-by-song.mp3?v=1795579333", "s": 46, "p": 133, "l": [{"t0": 3.4, "t1": 12.1, "who": "B", "text": "Every interval has a song that starts with it, Clara. Learn the first leap of a few tunes and you can name an interval by ear.", "cue": {"p": 133, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 6.99, "p": 133, "r": [[0.1439, 0.2183, 0.3513, 0.0243]]}, {"k": "hi", "t": 6.99, "e": 12.5, "p": 133, "r": [[0.5883, 0.2183, 0.3195, 0.0243], [0.073, 0.247, 0.5692, 0.0243]]}], "sp": [[3.4, 0, 54], [6.99, 54, 126]]}, {"t0": 12.1, "t1": 17.73, "who": "B", "text": "Remember: hear an interval, find the song that starts with it, and you have its name.", "cue": {"p": 133, "r": "remember"}, "mk": [{"k": "hi", "t": 12.56, "e": 18.13, "p": 133, "r": [[0.1009, 0.3256, 0.2105, 0.0243]]}, {"k": "hi", "t": 13.8, "e": 18.13, "p": 133, "r": [[0.3271, 0.3256, 0.3217, 0.0243]]}, {"k": "hi", "t": 15.99, "e": 18.13, "p": 133, "r": [[0.1009, 0.3522, 0.18 , 0.0208]]}], "sp": [[41.04, 0, 10], [41.93, 10, 57]]}]}, {"t": "Try it", "f": "audio/L5/02-try-it.mp3?v=1795579333", "s": 7, "p": 133, "l": [{"t0": 0.2, "t1": 7.3, "who": "B", "text": "Ask someone to play an interval. Sing it, find the song, and name it. Ten in a row? Until next time.", "cue": {"p": 133, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/L5-1.webp?v=1795579333"}, "sp": [[0.2, 0, 33], [1.89, 33, 70], [4.2, 70, 84], [5.41, 84, 100]]}]}], "nx": {"wb": [null, "p. 138", "Playing and listening"], "dr": [["intervals", "Listen: 2nd, 3rd, 5th or octave?", 7]]}}, {"k": "L6", "part": "Part IX · Playing and listening", "t": "6 · Performing and stage nerves", "pages": [134, 135], "clips": [{"t": "Performing", "f": "audio/L6/01-performing.mp3?v=1795579333", "s": 30, "p": 134, "l": [{"t0": 3.4, "t1": 10.67, "who": "B", "text": "Playing for others is a skill you can practise, Clara, like scales. Nerves are normal: they mean you care.", "cue": {"p": 134, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 7.67, "p": 134, "r": [[0.073, 0.2058, 0.5122, 0.0243]]}, {"k": "hi", "t": 6.29, "e": 7.67, "p": 134, "r": [[0.5983, 0.2058, 0.1226, 0.0243]]}, {"k": "hi", "t": 7.67, "e": 8.96, "p": 134, "r": [[0.734, 0.2058, 0.1278, 0.0243], [0.073, 0.2345, 0.0819, 0.0243]]}, {"k": "hi", "t": 8.96, "e": 11.07, "p": 134, "r": [[0.225, 0.2345, 0.1736, 0.0243]]}], "sp": [[3.4, 0.0, 68], [7.67, 68.0, 87], [8.96, 87.0, 106]]}, {"t0": 10.67, "t1": 14.16, "who": "Q", "text": "When I forget a word, I simply carry on.", "cue": {"p": 134, "r": "lead"}, "mk": [{"k": "hi", "t": 10.67, "e": 14.56, "p": 134, "r": [[0.2107, 0.2953, 0.3984, 0.0278]]}]}, {"who": "K", "text": "I notice.", "cue": {"p": 134, "r": "lead"}, "t0": 14.16, "t1": 15.74}, {"t0": 15.74, "t1": 22.03, "who": "B", "text": "Remember: breathe, feel a bar of the beat, then begin. After a slip, catch the next beat.", "cue": {"p": 134, "r": "remember"}, "mk": [{"k": "hi", "t": 16.18, "e": 19.4, "p": 134, "r": [[0.1009, 0.3658, 0.1013, 0.0243]]}, {"k": "hi", "t": 16.89, "e": 19.4, "p": 134, "r": [[0.2178, 0.3658, 0.2786, 0.0243]]}, {"k": "hi", "t": 18.17, "e": 19.4, "p": 134, "r": [[0.5789, 0.3658, 0.0737, 0.0243]]}, {"k": "hi", "t": 19.4, "e": 22.43, "p": 134, "r": [[0.6682, 0.3658, 0.2343, 0.0243], [0.1009, 0.3923, 0.1749, 0.0243]]}], "sp": [[15.74, 1.58, 10], [16.18, 11.58, 55], [19.4, 56.58, 89]]}, {"t0": 22.03, "t1": 30.48, "who": "B", "text": "Before: warm up, and practise starting. At the piano: adjust the bench, breathe out slowly, and hear the speed in your head.", "cue": {"p": 134, "r": "table"}, "mk": [{"k": "hi", "t": 22.37, "e": 24.61, "p": 134, "r": [[0.274, 0.7113, 0.4044, 0.0208]]}, {"k": "hi", "t": 25.73, "e": 30.88, "p": 134, "r": [[0.274, 0.7663, 0.4107, 0.0208]]}], "sp": [[22.03, 1.58, 8], [22.37, 9.58, 40], [24.61, 41.58, 54], [25.73, 55.58, 124]]}]}, {"t": "Playing from memory", "f": "audio/L6/02-playing-from-memory.mp3?v=1795579333", "s": 15, "p": 135, "l": [{"t0": 0.2, "t1": 14.62, "who": "B", "text": "Memory works best four ways at once: the sound, the feel in your fingers, the look of the page, and knowing the chords and the form. Practise starting from three different places, and play it through once a day without stopping.", "cue": {"p": 135, "r": "more"}, "mk": [{"k": "hi", "t": 0.2, "e": 2.74, "p": 135, "r": [[0.6207, 0.302, 0.2717, 0.0208], [0.096, 0.328, 0.2566, 0.0208]]}, {"k": "hi", "t": 2.74, "e": 8.79, "p": 135, "r": [[0.4058, 0.328, 0.0653, 0.0208]]}, {"k": "hi", "t": 3.59, "e": 8.79, "p": 135, "r": [[0.5242, 0.328, 0.2004, 0.0208]]}, {"k": "hi", "t": 4.97, "e": 8.79, "p": 135, "r": [[0.7777, 0.328, 0.1143, 0.0208], [0.096, 0.3541, 0.0538, 0.0208]]}, {"k": "hi", "t": 6.48, "e": 8.79, "p": 135, "r": [[0.2085, 0.3541, 0.3538, 0.0208]]}, {"k": "hi", "t": 8.79, "e": 15.02, "p": 135, "r": [[0.6424, 0.5053, 0.2334, 0.0208], [0.1058, 0.5262, 0.0519, 0.0208], [0.1058, 0.5493, 0.4917, 0.0208]]}], "sp": [[0.2, 0, 37], [2.74, 37, 133], [8.79, 133, 228]]}]}, {"t": "Example: you slip in bar five", "f": "audio/L6/03-example-you-slip-in-bar-five.mp3?v=1795579333", "s": 15, "p": 134, "l": [{"t0": 0.2, "t1": 5.57, "who": "B", "text": "A wrong note in bar five, and your hand freezes. What now? Pause.", "cue": {"p": 134, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/L6-3-q.webp?v=1795579333"}, "sp": [[0.2, 0, 49], [3.5, 49, 59], [4.06, 59, 65]]}, {"t0": 5.57, "t1": 8.57, "who": "pause", "text": "Pause and try.", "cue": {"p": 134, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/L6-3-q.webp?v=1795579333"}}, {"t0": 8.57, "t1": 13.58, "who": "P", "text": "Keep counting and come back in on the next beat, or at the next phrase. Never go back.", "cue": {"p": 134, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/L6-3.webp?v=1795579333"}, "sp": [[8.57, 0, 72], [12.02, 72, 86]], "mk": [{"k": "hi", "t": 8.67, "e": 13.88, "p": 134, "r": [[0.0117, 0.7903, 0.9775, 0.1763]], "pop": "L6-3"}]}, {"t0": 13.58, "t1": 15.33, "who": "B", "text": "Precisely.", "cue": {"p": 134, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/L6-3.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 13.58, "e": 15.53, "p": 134, "r": [[0.0117, 0.7903, 0.9775, 0.1763]], "pop": "L6-3"}]}]}, {"t": "Try it: a one-minute concert", "f": "audio/L6/04-try-it-a-one-minute-concert.mp3?v=1795579333", "s": 12, "p": 134, "l": [{"t0": 0.2, "t1": 12.14, "who": "B", "text": "Choose eight bars. Walk to the piano, sit, breathe, feel a bar, play, and bow. Do it for someone today. The audience is on your side from the first note. Until next time.", "cue": {"p": 134, "r": "pop4"}, "lens": {"k": "pop", "src": "pops/L6-4.webp?v=1795579333"}, "sp": [[0.2, 0, 19], [1.54, 19, 79], [5.61, 79, 104], [7.39, 104, 154], [10.28, 154, 170]]}]}], "nx": {"wb": [null, "pp. 139–140", "Playing and listening"], "dr": [["hb-performing", "Performing", 0]]}}, {"k": "L7", "part": "Part IX · Playing and listening", "t": "7 · Common piano mistakes and how to fix them", "pages": [136, 137], "clips": [{"t": "Common mistakes", "f": "audio/L7/01-common-mistakes.mp3?v=1795579333", "s": 45, "p": 136, "l": [{"t0": 3.4, "t1": 12.7, "who": "B", "text": "Most wrong notes come from a few common slips, Clara. Find what you notice, check that one thing, and turn to the chapter that explains it.", "cue": {"p": 136, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 6.95, "p": 136, "r": [[0.073, 0.1745, 0.4524, 0.0187]]}, {"k": "hi", "t": 6.95, "e": 13.1, "p": 136, "r": [[0.5355, 0.1745, 0.1882, 0.0187]]}, {"k": "hi", "t": 8.4, "e": 13.1, "p": 136, "r": [[0.7338, 0.1745, 0.1869, 0.0187]]}, {"k": "hi", "t": 9.89, "e": 13.1, "p": 136, "r": [[0.1126, 0.1966, 0.2932, 0.0187]]}], "sp": [[3.4, 0, 54], [6.95, 54, 139]]}, {"t0": 12.7, "t1": 19.28, "who": "B", "text": "Remember: name the slip, then fix only that spot. Playing from the top again rarely finds it.", "cue": {"p": 136, "r": "remember"}, "mk": [{"k": "hi", "t": 13.23, "e": 16.35, "p": 136, "r": [[0.0945, 0.2499, 0.3781, 0.0187]]}, {"k": "hi", "t": 16.35, "e": 19.68, "p": 136, "r": [[0.4846, 0.2499, 0.3924, 0.0187]]}], "sp": [[12.7, 0, 10], [13.23, 10, 50], [16.35, 50, 93]]}, {"t0": 19.28, "t1": 34.94, "who": "B", "text": "If the left hand reads like the right, check the clef. If a rest gets skipped, count it like a note. If the sound is muddy, change the pedal on each new chord. If the end does not feel finished, look at the last two chords: five, then one.", "cue": {"p": 136, "r": "table"}, "mk": [{"k": "hi", "t": 19.28, "e": 22.45, "p": 136, "r": [[0.1192, 0.3497, 0.2338, 0.016], [0.4076, 0.3407, 0.0617, 0.016]]}, {"k": "hi", "t": 22.45, "e": 25.52, "p": 136, "r": [[0.1002, 0.6101, 0.4615, 0.016]]}, {"k": "hi", "t": 25.52, "e": 29.3, "p": 136, "r": [[0.1192, 0.8344, 0.1305, 0.016], [0.4076, 0.8253, 0.2527, 0.016], [0.4076, 0.8434, 0.0471, 0.016]]}], "sp": [[19.28, 0, 55], [22.45, 55, 101], [25.52, 101, 160], [29.3, 160, 224], [32.99, 224, 239]]}, {"t0": 34.94, "t1": 37.98, "who": "P", "text": "And if it is fine slowly but wrong at speed?", "cue": {"p": 137, "r": "table"}, "mk": [{"k": "hi", "t": 34.94, "e": 38.38, "p": 137, "r": [[0.0849, 0.7085, 0.2672, 0.0189]]}]}, {"t0": 37.98, "t1": 45.0, "who": "B", "text": "Three right in a row, then one notch faster. And that is the end of Part Nine. Until next time.", "cue": {"p": 137, "r": "table"}, "mk": [{"k": "hi", "t": 37.98, "e": 40.95, "p": 137, "r": [[0.4094, 0.6979, 0.2826, 0.0189], [0.4094, 0.7192, 0.1163, 0.0189]]}], "sp": [[37.98, 0, 45], [40.95, 45, 79], [43.12, 79, 95]]}]}], "nx": {"wb": [null, "p. 141", "Playing and listening"], "dr": [["hb-practice", "Practising Well", 0]]}}, {"k": "O10", "part": "Part X · Going further", "t": "Part opener", "pages": [138], "clips": [{"t": "Part Ten: Going further", "f": "audio/O10/01-part-ten-going-further.mp3?v=1795579333", "s": 35, "p": 138, "l": [{"t0": 3.4, "t1": 8.11, "who": "B", "text": "Welcome to Part Ten, Clara: Going further. Beyond the levels.", "cue": {"p": 138, "r": "opener"}, "mk": [{"k": "hi", "t": 5.27, "e": 6.47, "p": 138, "r": [[0.073, 0.2235, 0.4325, 0.0641]]}, {"k": "hi", "t": 6.46, "e": 8.51, "p": 138, "r": [[0.073, 0.2898, 0.1835, 0.0214]]}], "sp": [[3.4, 0, 28], [5.27, 28, 43], [6.46, 43, 61]]}, {"t0": 8.11, "t1": 16.66, "who": "B", "text": "This part is for later, when your pieces ask for it: the notes that step outside the chord to decorate a tune, and then come home.", "cue": {"p": 138, "r": "opener"}, "mk": [{"k": "hi", "t": 8.11, "e": 11.49, "p": 138, "r": [[0.7179, 0.2898, 0.1815, 0.0214], [0.073, 0.3151, 0.0356, 0.0214]]}], "sp": [[8.11, 0, 53], [11.49, 53, 130]]}, {"t0": 16.66, "t1": 20.68, "who": "piano", "notes": [16.66, 17.28, 17.9, 18.52, 19.14], "cue": {"p": 138, "r": "opener"}}, {"t0": 20.68, "t1": 23.02, "who": "P", "text": "A little step out, and back!", "cue": {"p": 138, "r": "opener"}}, {"t0": 23.02, "t1": 33.86, "who": "B", "text": "One chapter: non-chord notes, the passing note, the auxiliary note, the appoggiatura, the suspension and the anticipation. Read it whenever you are ready.", "cue": {"p": 138, "r": "chapters"}, "mk": [{"k": "hi", "t": 24.0, "e": 31.34, "p": 138, "r": [[0.0972, 0.3494, 0.148, 0.0178]]}, {"k": "hi", "t": 27.6, "e": 31.34, "p": 138, "r": [[0.4161, 0.3494, 0.1178, 0.0178]]}, {"k": "hi", "t": 27.78, "e": 31.34, "p": 138, "r": [[0.5436, 0.3494, 0.2155, 0.0178]]}], "sp": [[23.02, 0, 13], [24.0, 13, 123], [31.34, 123, 154]]}, {"t0": 33.86, "t1": 35.31, "who": "P", "text": "I will!", "cue": {"p": 138, "r": "chapters"}}]}]}, {"k": "G1", "part": "Part X · Going further", "t": "1 · Non-chord notes: passing, auxiliary, appoggiatura, suspension, anticipation", "pages": [139, 140], "clips": [{"t": "Non-chord notes", "f": "audio/G1/01-non-chord-notes.mp3?v=1795579333", "s": 42, "p": 139, "l": [{"t0": 3.4, "t1": 13.42, "who": "B", "text": "Under a tune, Clara, the chord holds the main notes. The other notes are non-chord notes: they lean on the chord for a moment, then step back into it.", "cue": {"p": 139, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 7.1, "p": 139, "r": [[0.073, 0.2429, 0.143, 0.0226]]}, {"k": "hi", "t": 4.81, "e": 7.1, "p": 139, "r": [[0.2704, 0.2429, 0.3014, 0.0226]]}, {"k": "hi", "t": 7.1, "e": 9.46, "p": 139, "r": [[0.632, 0.2429, 0.2945, 0.0226], [0.073, 0.2696, 0.1923, 0.0226]]}, {"k": "hi", "t": 9.46, "e": 13.82, "p": 139, "r": [[0.3304, 0.2696, 0.5727, 0.0226]]}], "sp": [[3.4, 0, 53], [7.1, 53, 90], [9.46, 90, 150]]}, {"t0": 13.42, "t1": 19.77, "who": "B", "text": "Remember: a note outside the chord moves by step: into the chord, out of it, or both.", "cue": {"p": 139, "r": "remember"}, "mk": [{"k": "hi", "t": 14.01, "e": 16.83, "p": 139, "r": [[0.1251, 0.3608, 0.4641, 0.0226]]}, {"k": "hi", "t": 16.83, "e": 20.17, "p": 139, "r": [[0.6038, 0.3608, 0.1713, 0.0226]]}, {"k": "hi", "t": 17.76, "e": 20.17, "p": 139, "r": [[0.7897, 0.3608, 0.0395, 0.0226]]}, {"k": "hi", "t": 18.57, "e": 20.17, "p": 139, "r": [[0.1317, 0.3855, 0.0549, 0.0226]]}], "sp": [[13.42, 0, 10], [14.01, 10, 50], [16.83, 50, 85]]}, {"t0": 19.77   fp.onclick=()=>{ const a=document.getElementById('all'); if(a) a.click(); };
})();
