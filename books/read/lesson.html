 53}, {"k": "nt", "t": 5.7, "e": 6.01, "r": [[0.541, 0.428, 0.03, 0.024]], "p": 53}, {"k": "nt", "t": 6.01, "e": 6.32, "r": [[0.606, 0.428, 0.03, 0.024]], "p": 53}, {"k": "nt", "t": 6.32, "e": 6.63, "r": [[0.672, 0.428, 0.03, 0.024]], "p": 53}, {"k": "nt", "t": 6.63, "e": 6.94, "r": [[0.266, 0.428, 0.03, 0.024]], "p": 53}, {"k": "nt", "t": 6.94, "e": 7.25, "r": [[0.332, 0.428, 0.03, 0.024]], "p": 53}, {"k": "nt", "t": 7.25, "e": 7.56, "r": [[0.403, 0.428, 0.03, 0.024]], "p": 53}, {"k": "nt", "t": 7.56, "e": 7.87, "r": [[0.469, 0.428, 0.03, 0.024]], "p": 53}, {"k": "nt", "t": 7.87, "e": 8.18, "r": [[0.541, 0.428, 0.03, 0.024]], "p": 53}, {"k": "nt", "t": 8.18, "e": 8.49, "r": [[0.606, 0.428, 0.03, 0.024]], "p": 53}, {"k": "nt", "t": 8.49, "e": 9.1, "r": [[0.672, 0.428, 0.03, 0.024]], "p": 53}]}, {"t0": 9.8, "t1": 11.99, "who": "P", "text": "That one trips at the end.", "cue": {"p": 53, "r": "picture"}}, {"t0": 11.99, "t1": 14.66, "who": "B", "text": "Every time, and on purpose.", "cue": {"p": 53, "r": "picture"}}]}, {"t": "Remember", "f": "audio/T8/s04-remember.mp3?v=1795579333", "s": 10, "p": 53, "l": [{"t0": 0.2, "t1": 6.68, "who": "B", "text": "Remember: five or seven counts, felt in uneven groups. Three and two, or two, two and three.", "cue": {"p": 53, "r": "remember"}, "mk": [{"k": "hi", "t": 0.62, "e": 3.91, "p": 53, "r": [[0.1009, 0.254, 0.566, 0.0243]]}], "sp": [[0.2, 0, 10], [0.62, 10, 55], [3.91, 55, 92]]}, {"t0": 6.68, "t1": 9.98, "who": "B", "text": "You will meet five-four from Grade 5.", "cue": {"p": 53, "r": "table"}}]}, {"t": "Example: uneven groups in four-four", "f": "audio/T8/02-example-uneven-groups-in-four-four.mp3?v=1795579333", "s": 25, "p": 53, "l": [{"t0": 0.2, "t1": 7.88, "who": "B", "text": "Eight quavers in a bar of four-four, grouped three, three, two. Keep your foot on the beat. How many foot taps? Pause.", "cue": {"p": 53, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T8-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 64], [3.74, 64, 92], [5.29, 92, 112], [6.6, 112, 118]]}, {"t0": 7.88, "t1": 11.88, "who": "pause", "text": "Pause and try.", "cue": {"p": 53, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T8-1-q.webp?v=1795579333"}}, {"t0": 11.88, "t1": 16.61, "who": "P", "text": "Accents on one, four and seven, but still four taps. It is still four-four.", "cue": {"p": 53, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T8-1.webp?v=1795579333"}, "sp": [[11.88, 0, 53], [14.85, 53, 75]]}, {"t0": 16.61, "t1": 19.74, "who": "B", "text": "Correct. Listen for the three accents.", "cue": {"p": 53, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T8-1.webp?v=1795579333"}, "sp": [[16.61, 0, 9], [17.18, 9, 38]]}, {"t0": 19.74, "t1": 25.0, "who": "piano", "notes": [19.74, 20.05, 20.36, 20.67, 20.98, 21.29, 21.6, 21.91], "cue": {"p": 53, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T8-1.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 19.74, "e": 20.05, "r": [[0.2659, 0.4806, 0.0327, 0.0818]], "pop": "T8-1"}, {"k": "blk", "t": 20.05, "e": 20.36, "r": [[0.3167, 0.4806, 0.0327, 0.0818]], "pop": "T8-1"}, {"k": "blk", "t": 20.36, "e": 20.67, "r": [[0.3666, 0.4806, 0.0327, 0.0818]], "pop": "T8-1"}, {"k": "blk", "t": 20.67, "e": 20.98, "r": [[0.4165, 0.4806, 0.0327, 0.0818]], "pop": "T8-1"}, {"k": "blk", "t": 20.98, "e": 21.29, "r": [[0.4664, 0.4806, 0.0327, 0.0818]], "pop": "T8-1"}, {"k": "blk", "t": 21.29, "e": 21.6, "r": [[0.5172, 0.4806, 0.0327, 0.0818]], "pop": "T8-1"}, {"k": "blk", "t": 21.6, "e": 21.91, "r": [[0.5672, 0.4806, 0.0327, 0.0818]], "pop": "T8-1"}, {"k": "blk", "t": 21.91, "e": 25.0, "r": [[0.6171, 0.4806, 0.0327, 0.0818]], "pop": "T8-1"}]}]}, {"t": "Try it", "f": "audio/T8/03-try-it.mp3?v=1795579333", "s": 7, "p": 53, "l": [{"t0": 0.2, "t1": 6.79, "who": "B", "text": "Count five, clapping on one and four. Then swap: clap on one and three. Until next time.", "cue": {"p": 53, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T8-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 38], [2.58, 38, 49], [3.51, 49, 72], [4.93, 72, 88]]}]}], "nx": {"wb": [null, "p. 48", "Bars and time"], "dr": [["time-signatures", "Simple, compound or irregular?", 10]]}}, {"k": "T9", "part": "Part III · Bars and time", "t": "5 · Groups and beams", "pages": [54], "clips": [{"t": "Groups and beams", "f": "audio/T9/s01-groups-and-beams.mp3?v=1795579333", "s": 16, "p": 54, "l": [{"t0": 3.4, "t1": 7.11, "who": "P", "text": "Butler, why are some quavers joined together? Are they friends?", "cue": {"p": 54, "r": "lead"}, "sp": [[3.4, 0, 46], [5.52, 46, 63]]}, {"t0": 7.11, "t1": 9.83, "who": "B", "text": "Best friends, holding hands.", "cue": {"p": 54, "r": "lead"}}, {"t0": 9.83, "t1": 16.1, "who": "B", "text": "Beams join the notes of one beat, Clara, so you can see where each beat begins at a glance.", "cue": {"p": 54, "r": "lead"}, "mk": [{"k": "hi", "t": 9.83, "e": 16.5, "p": 54, "r": [[0.073, 0.1517, 0.3845, 0.0237]]}, {"k": "hi", "t": 12.64, "e": 16.5, "p": 54, "r": [[0.5521, 0.1517, 0.3737, 0.0237], [0.073, 0.1797, 0.1276, 0.0237]]}]}]}, {"t": "Beams show the beats", "f": "audio/T9/s02-beams-show-the-beats.mp3?v=1795579333", "s": 12, "p": 54, "l": [{"t0": 0.2, "t1": 5.55, "who": "B", "text": "Eight quavers in four-four, beamed in pairs. Each pair is one beat.", "cue": {"p": 54, "r": "picture"}, "mk": [{"k": "blk", "t": 0.2, "e": 5.55, "r": [[0.23500000000000001, 0.325, 0.143, 0.12], [0.4, 0.325, 0.143, 0.12], [0.567, 0.325, 0.143, 0.12], [0.733, 0.325, 0.143, 0.12]], "p": 54}], "sp": [[0.2, 0, 45], [3.35, 45, 67]]}, {"t0": 5.55, "t1": 9.03, "who": "piano", "notes": [5.55, 5.86, 6.17, 6.48, 6.79, 7.1, 7.41, 7.72], "cue": {"p": 54, "r": "picture"}, "mk": [{"k": "nt", "t": 5.55, "e": 5.86, "r": [[0.256, 0.3755, 0.018, 0.013]], "p": 54}, {"k": "nt", "t": 5.86, "e": 6.17, "r": [[0.339, 0.3755, 0.018, 0.013]], "p": 54}, {"k": "nt", "t": 6.17, "e": 6.48, "r": [[0.421, 0.3755, 0.018, 0.013]], "p": 54}, {"k": "nt", "t": 6.48, "e": 6.79, "r": [[0.504, 0.3755, 0.018, 0.013]], "p": 54}, {"k": "nt", "t": 6.79, "e": 7.1, "r": [[0.588, 0.3755, 0.018, 0.013]], "p": 54}, {"k": "nt", "t": 7.1, "e": 7.41, "r": [[0.671, 0.3755, 0.018, 0.013]], "p": 54}, {"k": "nt", "t": 7.41, "e": 7.72, "r": [[0.754, 0.3755, 0.018, 0.013]], "p": 54}, {"k": "nt", "t": 7.72, "e": 8.33, "r": [[0.837, 0.3755, 0.018, 0.013]], "p": 54}]}, {"t0": 9.03, "t1": 12.14, "who": "P", "text": "Four pairs, four beats. I can see them now.", "cue": {"p": 54, "r": "picture"}, "mk": [{"k": "blk", "t": 9.03, "e": 12.14, "r": [[0.23500000000000001, 0.325, 0.143, 0.12], [0.4, 0.325, 0.143, 0.12], [0.567, 0.325, 0.143, 0.12], [0.733, 0.325, 0.143, 0.12]], "p": 54}], "sp": [[9.03, 0, 24], [10.36, 24, 43]]}]}, {"t": "Never across the middle", "f": "audio/T9/s03-never-across-the-middle.mp3?v=1795579333", "s": 20, "p": 54, "l": [{"t0": 0.2, "t1": 8.79, "who": "B", "text": "A beam may cover beats one and two, or three and four. But it never crosses the middle of the bar, or the eye loses beat three.", "cue": {"p": 54, "r": "h:Grouping with beams"}, "mk": [{"k": "hi", "t": 0.2, "e": 3.93, "p": 54, "r": [[0.7989, 0.5863, 0.1092, 0.0204], [0.073, 0.6117, 0.1219, 0.0204]]}], "sp": [[0.2, 0, 55], [3.93, 55, 127]]}, {"t0": 8.79, "t1": 11.33, "who": "P", "text": "So the middle of the bar is a wall.", "cue": {"p": 54, "r": "h:Grouping with beams"}, "mk": [{"k": "hi", "t": 8.79, "e": 11.73, "p": 54, "r": [[0.5305, 0.6117, 0.1814, 0.0204]]}]}, {"t0": 11.33, "t1": 14.61, "who": "B", "text": "A polite wall. Beams do not climb it.", "cue": {"p": 54, "r": "h:Grouping with beams"}, "sp": [[11.33, 0, 15], [12.48, 15, 37]]}, {"t0": 14.61, "t1": 20.36, "who": "B", "text": "Remember: beams show the beats. Never beam across the middle of a four-four bar.", "cue": {"p": 54, "r": "remember"}, "mk": [{"k": "hi", "t": 15.25, "e": 16.91, "p": 54, "r": [[0.1002, 0.2475, 0.2902, 0.0237]]}, {"k": "hi", "t": 16.91, "e": 20.76, "p": 54, "r": [[0.4056, 0.2475, 0.4504, 0.0237], [0.1002, 0.2734, 0.0962, 0.0237]]}], "sp": [[14.61, 0, 10], [15.25, 10, 32], [16.91, 32, 80]]}]}, {"t": "Rests keep the middle too", "f": "audio/T9/s04-rests-keep-the-middle-too.mp3?v=1795579333", "s": 30, "p": 54, "l": [{"t0": 0.2, "t1": 6.19, "who": "B", "text": "Rests follow the same rule. In four-four, beat three must always be easy to see.", "cue": {"p": 54, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/T9-rests.webp?v=1795579333"}, "sp": [[0.2, 0, 28], [2.14, 28, 80]]}, {"t0": 6.19, "t1": 14.89, "who": "B", "text": "So after a crotchet on beat one, two beats of silence are written as two crotchet rests: one on beat two, one on beat three.", "cue": {"p": 54, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/T9-rests.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 6.19, "e": 14.89, "r": [[0, 0.1338, 1, 0.2563]], "pop": "T9-rests"}], "sp": [[6.19, 0, 89], [11.55, 89, 124]]}, {"t0": 14.89, "t1": 18.37, "who": "piano", "notes": [14.89, 15.51, 16.13, 16.75], "cue": {"p": 54, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/T9-rests.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 14.89, "e": 18.37, "r": [[0, 0.1338, 1, 0.2563]], "pop": "T9-rests"}]}, {"t0": 18.37, "t1": 23.29, "who": "B", "text": "Not as one minim rest across the middle. That hides beat three.", "cue": {"p": 54, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/T9-rests.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 18.37, "e": 23.29, "r": [[0, 0.4096, 1, 0.2563]], "pop": "T9-rests"}], "sp": [[18.37, 0, 41], [21.08, 41, 63]]}, {"t0": 23.29, "t1": 25.95, "who": "P", "text": "But they sound exactly the same!", "cue": {"p": 54, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/T9-rests.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 23.29, "e": 25.95, "r": [[0, 0.1338, 1, 0.2563], [0, 0.4096, 1, 0.2563]], "pop": "T9-rests"}]}, {"t0": 25.95, "t1": 29.73, "who": "B", "text": "They do. The rule is for the eyes, not the ears.", "cue": {"p": 54, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/T9-rests.webp?v=1795579333"}, "sp": [[25.95, 0, 9], [26.54, 9, 48]]}]}, {"t": "In printed music", "f": "audio/T9/s05-in-printed-music.mp3?v=1795579333", "s": 25, "p": 54, "l": [{"t0": 0.2, "t1": 5.38, "who": "B", "text": "Printed music keeps these rules too, and rests almost never break them.", "cue": {"p": 54, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/T9-rests.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 0.2, "e": 5.38, "r": [[0, 0.1338, 1, 0.2563], [0, 0.4096, 1, 0.2563]], "pop": "T9-rests"}]}, {"t0": 5.38, "t1": 13.65, "who": "B", "text": "Notes have one common exception: crotchet, minim, crotchet. The minim on beat two may cross the middle without a tie.", "cue": {"p": 54, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/T9-rests.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 5.38, "e": 13.65, "r": [[0, 0.6853, 1, 0.2952]], "pop": "T9-rests"}], "sp": [[5.38, 0, 33], [8.26, 33, 60], [8.26, 60, 117]]}, {"t0": 13.65, "t1": 17.13, "who": "piano", "notes": [13.65, 14.27, 14.89, 15.51], "cue": {"p": 54, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/T9-rests.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 13.65, "e": 17.13, "r": [[0, 0.6853, 1, 0.2952]], "pop": "T9-rests"}]}, {"t0": 17.13, "t1": 20.56, "who": "P", "text": "So notes get a little freedom, and rests get none.", "cue": {"p": 54, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/T9-rests.webp?v=1795579333"}}, {"t0": 20.56, "t1": 24.55, "who": "B", "text": "Rests have always been the stricter side of the family.", "cue": {"p": 54, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/T9-rests.webp?v=1795579333"}}]}, {"t": "In compound time", "f": "audio/T9/s06-in-compound-time.mp3?v=1795579333", "s": 14, "p": 54, "l": [{"t0": 0.2, "t1": 6.25, "who": "B", "text": "In compound time, quavers are beamed in threes: one group for each dotted beat.", "cue": {"p": 54, "r": "h:Grouping with beams"}, "mk": [{"k": "hi", "t": 0.2, "e": 3.65, "p": 54, "r": [[0.5183, 0.6372, 0.3921, 0.0204], [0.073, 0.6626, 0.0927, 0.0204]]}], "sp": [[0.2, 0, 48], [3.65, 48, 79]]}, {"t0": 6.25, "t1": 9.11, "who": "piano", "notes": [6.25, 6.56, 6.87, 7.18, 7.49, 7.8], "cue": {"p": 54, "r": "h:Grouping with beams"}, "mk": [{"k": "blk", "t": 6.25, "e": 6.56, "r": [[0.49, 0.633, 0.43, 0.03]], "p": 54}, {"k": "blk", "t": 6.56, "e": 6.87, "r": [[0.49, 0.633, 0.43, 0.03]], "p": 54}, {"k": "blk", "t": 6.87, "e": 7.18, "r": [[0.49, 0.633, 0.43, 0.03]], "p": 54}, {"k": "blk", "t": 7.18, "e": 7.49, "r": [[0.49, 0.633, 0.43, 0.03]], "p": 54}, {"k": "blk", "t": 7.49, "e": 7.8, "r": [[0.49, 0.633, 0.43, 0.03]], "p": 54}, {"k": "blk", "t": 7.8, "e": 9.11, "r": [[0.49, 0.633, 0.43, 0.03]], "p": 54}]}, {"t0": 9.11, "t1": 10.97, "who": "P", "text": "Bananas again.", "cue": {"p": 54, "r": "h:Grouping with beams"}}, {"t0": 10.97, "t1": 14.14, "who": "B", "text": "We never really left the orchard, Clara.", "cue": {"p": 54, "r": "h:Grouping with beams"}}]}, {"t": "Example: six quavers in three-four", "f": "audio/T9/02-example-six-quavers-in-three-four.mp3?v=1795579333", "s": 17, "p": 54, "l": [{"t0": 0.2, "t1": 6.51, "who": "B", "text": "Six quavers in three-four are beamed in twos. Why? Pause and think about the beats.", "cue": {"p": 54, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T9-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 46], [3.26, 46, 51], [3.92, 51, 83]]}, {"t0": 6.51, "t1": 10.51, "who": "pause", "text": "Pause and try.", "cue": {"p": 54, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T9-1-q.webp?v=1795579333"}}, {"t0": 10.51, "t1": 15.56, "who": "P", "text": "Three crotchet beats, two quavers each. Beamed in threes, they would look like six-eight.", "cue": {"p": 54, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T9-1.webp?v=1795579333"}, "sp": [[10.51, 0, 40], [12.69, 40, 89]], "mk": [{"k": "hi", "t": 10.61, "e": 15.86, "p": 54, "r": [[0.0107, 0.8859, 0.9302, 0.087]], "pop": "T9-1"}]}, {"who": "B", "text": "Bravo, Miss Clara.", "cue": {"p": 54, "r": "pop1"}, "t0": 15.56, "lens": {"k": "pop", "src": "pops/T9-1.webp?v=1795579333"}, "t1": 17.44, "mk": [{"k": "hi", "t": 15.56, "e": 17.64, "p": 54, "r": [[0.0107, 0.8859, 0.9302, 0.087]], "pop": "T9-1"}]}]}, {"t": "Try it", "f": "audio/T9/03-try-it.mp3?v=1795579333", "s": 7, "p": 54, "l": [{"t0": 0.2, "t1": 7.04, "who": "B", "text": "Open a piece you are playing and touch the start of every beam: each one is a beat. Until next time.", "cue": {"p": 54, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T9-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 64], [3.69, 64, 84], [5.17, 84, 100]]}]}], "nx": {"wb": [null, "p. 49", "Bars and time"], "dr": [["rhythm", "Beamed right?", 1]]}}, {"k": "T10", "part": "Part III · Bars and time", "t": "6 · Upbeats (anacrusis)", "pages": [55], "clips": [{"t": "Upbeats", "f": "audio/T10/s01-upbeats.mp3?v=1795579333", "s": 20, "p": 55, "l": [{"t0": 3.4, "t1": 12.59, "who": "B", "text": "Some tunes start before the first strong beat, Clara, like a breath before you speak. Those first notes are the upbeat, or anacrusis.", "cue": {"p": 55, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 8.82, "p": 55, "r": [[0.073, 0.173, 0.5286, 0.0243]]}, {"k": "hi", "t": 6.7, "e": 8.82, "p": 55, "r": [[0.6147, 0.173, 0.2794, 0.0243], [0.073, 0.2016, 0.07, 0.0243]]}, {"k": "hi", "t": 8.82, "e": 12.99, "p": 55, "r": [[0.2354, 0.2016, 0.4728, 0.0243]]}], "sp": [[3.4, 0, 86], [8.82, 86, 133]]}, {"t0": 12.59, "t1": 15.59, "who": "P", "text": "Anacrusis? That sounds like a dinosaur.", "cue": {"p": 55, "r": "lead"}, "sp": [[12.59, 0, 11], [12.59, 11, 39]]}, {"t0": 15.59, "t1": 19.68, "who": "B", "text": "A very small, polite dinosaur that arrives early.", "cue": {"p": 55, "r": "lead"}}]}, {"t": "Count, then play", "f": "audio/T10/s02-count-then-play.mp3?v=1795579333", "s": 21, "p": 55, "l": [{"t0": 0.2, "t1": 6.34, "who": "B", "text": "Three-four. The tune starts on beat three: this first note, before the first bar line.", "cue": {"p": 55, "r": "picture"}, "mk": [{"k": "blk", "t": 0.2, "e": 6.34, "r": [[0.14, 0.45, 0.07, 0.085]], "p": 55}], "sp": [[0.2, 0, 12], [1.01, 12, 43], [3.07, 43, 86]]}, {"t0": 6.34, "t1": 10.13, "who": "B", "text": "Count one, two silently, then play on three.", "cue": {"p": 55, "r": "picture"}, "mk": [{"k": "blk", "t": 6.34, "e": 10.13, "r": [[0.14, 0.45, 0.07, 0.085]], "p": 55}]}, {"t0": 10.13, "t1": 16.09, "who": "piano", "notes": [10.13, 10.75, 11.37, 11.99, 12.61, 13.23, 13.85, 14.47], "cue": {"p": 55, "r": "picture"}, "mk": [{"k": "nt", "t": 11.37, "e": 11.99, "r": [[0.159, 0.4811, 0.018, 0.013]], "p": 55}, {"k": "nt", "t": 11.99, "e": 12.61, "r": [[0.289, 0.4811, 0.018, 0.013]], "p": 55}, {"k": "nt", "t": 12.61, "e": 13.23, "r": [[0.401, 0.4811, 0.018, 0.013]], "p": 55}, {"k": "nt", "t": 13.23, "e": 13.85, "r": [[0.514, 0.4811, 0.018, 0.013]], "p": 55}, {"k": "nt", "t": 13.85, "e": 15.39, "r": [[0.641, 0.4811, 0.018, 0.013]], "p": 55}]}, {"t0": 16.09, "t1": 21.1, "who": "B", "text": "An upbeat is a passenger who hops on just before the train leaves.", "cue": {"p": 55, "r": "lead"}, "mk": [{"k": "hi", "t": 16.09, "e": 21.5, "p": 55, "r": [[0.2571, 0.2338, 0.6595, 0.0278]]}]}]}, {"t": "The short last bar", "f": "audio/T10/s03-the-short-last-bar.mp3?v=1795579333", "s": 22, "p": 55, "l": [{"t0": 0.2, "t1": 6.02, "who": "B", "text": "And the last carriage keeps the seat. Look at the last bar: it has only two beats.", "cue": {"p": 55, "r": "picture"}, "mk": [{"k": "blk", "t": 0.2, "e": 6.02, "r": [[0.625, 0.45, 0.26, 0.085]], "p": 55}], "sp": [[0.2, 0, 38], [2.38, 38, 60], [3.83, 60, 82]]}, {"t0": 6.02, "t1": 12.39, "who": "B", "text": "The upbeat took one beat, and the last bar has two. Together they make one full bar of three.", "cue": {"p": 55, "r": "picture"}, "mk": [{"k": "blk", "t": 6.02, "e": 12.39, "r": [[0.14, 0.45, 0.07, 0.085], [0.625, 0.45, 0.26, 0.085]], "p": 55}], "sp": [[6.02, 0, 52], [9.45, 52, 93]]}, {"t0": 12.39, "t1": 14.54, "who": "P", "text": "So nothing goes missing.", "cue": {"p": 55, "r": "picture"}}, {"t0": 14.54, "t1": 21.6, "who": "B", "text": "Not a single beat. Remember: an upbeat borrows from the last bar; together they make one full bar.", "cue": {"p": 55, "r": "remember"}, "mk": [{"k": "hi", "t": 16.76, "e": 19.1, "p": 55, "r": [[0.1449, 0.3466, 0.4351, 0.0243]]}, {"k": "hi", "t": 19.1, "e": 22.0, "p": 55, "r": [[0.5377, 0.3466, 0.3139, 0.0243], [0.1009, 0.3732, 0.0999, 0.0243]]}], "sp": [[14.54, 0, 19], [15.94, 19, 29], [16.76, 29, 66], [19.1, 66, 98]]}]}, {"t": "Try it: Happy Birthday", "f": "audio/T10/02-try-it-happy-birthday.mp3?v=1795579333", "s": 15, "p": 55, "l": [{"t0": 0.2, "t1": 10.74, "who": "B", "text": "Happy comes before the first strong beat: an upbeat. The strong beat lands on birth. Sing it and clap only on birth, day and you. Until next time.", "cue": {"p": 55, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T10-1.webp?v=1795579333"}, "sp": [[0.2, 0, 42], [2.58, 42, 53], [3.66, 53, 85], [5.68, 85, 130], [8.79, 130, 146]]}, {"t0": 10.74, "t1": 14.76, "who": "piano", "notes": [10.74, 11.21, 11.36, 11.98, 12.6, 13.22], "cue": {"p": 55, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/T10-1.webp?v=1795579333"}, "mk": [{"k": "nt", "t": 10.74, "e": 14.56, "p": 55, "r": [[0.0699, 0.7269, 0.0082, 0.0101]], "pop": "T10-1"}, {"k": "nt", "t": 11.21, "e": 14.56, "p": 55, "r": [[0.1334, 0.7269, 0.0082, 0.0101]], "pop": "T10-1"}, {"k": "nt", "t": 11.36, "e": 14.56, "p": 55, "r": [[0.1733, 0.7219, 0.0082, 0.0101]], "pop": "T10-1"}, {"k": "nt", "t": 11.98, "e": 14.56, "p": 55, "r": [[0.2495, 0.7269, 0.0082, 0.0101]], "pop": "T10-1"}, {"k": "nt", "t": 12.6, "e": 14.56, "p": 55, "r": [[0.3258, 0.7118, 0.0082, 0.0101]], "pop": "T10-1"}, {"k": "nt", "t": 13.22, "e": 14.56, "p": 55, "r": [[0.4093, 0.7168, 0.0082, 0.0101]], "pop": "T10-1"}]}]}], "nx": {"wb": [null, "p. 50", "Bars and time"], "dr": [["rhythm", "Before beat 1", 5]]}}, {"k": "B2", "part": "Part III · Bars and time", "t": "7 · Repeats", "pages": [56], "clips": [{"t": "Repeats", "f": "audio/B2/s01-repeats.mp3?v=1795579333", "s": 16, "p": 56, "l": [{"t0": 3.4, "t1": 10.84, "who": "B", "text": "When music says play that again, Clara, it uses repeat signs instead of writing the same bars twice.", "cue": {"p": 56, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 11.24, "p": 56, "r": [[0.073, 0.1663, 0.3976, 0.0243]]}, {"k": "hi", "t": 5.99, "e": 11.24, "p": 56, "r": [[0.5183, 0.1663, 0.3352, 0.0243], [0.073, 0.1949, 0.3255, 0.0243]]}]}, {"t0": 10.84, "t1": 13.27, "who": "P", "text": "So the composer saves ink.", "cue": {"p": 56, "r": "lead"}}, {"t0": 13.27, "t1": 15.99, "who": "B", "text": "And the copyist saves his wrist.", "cue": {"p": 56, "r": "lead"}}]}, {"t": "Two dots facing back", "f": "audio/B2/s02-two-dots-facing-back.mp3?v=1795579333", "s": 32, "p": 56, "l": [{"t0": 0.2, "t1": 8.0, "who": "B", "text": "Look at the picture: two dots facing back, after B. Play A and B, go back, play them again, then go on to C.", "cue": {"p": 56, "r": "picture"}, "mk": [{"k": "blk", "t": 0.2, "e": 8.0, "r": [[0.44, 0.382, 0.116, 0.062]], "p": 56}], "sp": [[0.2, 0, 21], [1.23, 21, 52], [3.57, 52, 108]]}, {"t0": 8.0, "t1": 20.7, "who": "piano", "notes": [8.0, 8.62, 9.24, 9.86, 10.48, 11.1, 11.72, 12.96, 13.58, 14.2, 14.82, 15.44, 16.06, 16.68, 17.92, 18.54, 19.16], "cue": {"p": 56, "r": "picture"}, "mk": [{"k": "blk", "t": 8.0, "e": 10.48, "r": [[0.32, 0.382, 0.12, 0.062]], "p": 56}, {"k": "blk", "t": 10.48, "e": 12.96, "r": [[0.44, 0.382, 0.116, 0.062]], "p": 56}, {"k": "blk", "t": 12.96, "e": 15.44, "r": [[0.32, 0.382, 0.12, 0.062]], "p": 56}, {"k": "blk", "t": 15.44, "e": 17.92, "r": [[0.44, 0.382, 0.116, 0.062]], "p": 56}, {"k": "blk", "t": 17.92, "e": 20.7, "r": [[0.556, 0.382, 0.129, 0.062]], "p": 56}]}, {"t0": 20.7, "t1": 24.56, "who": "P", "text": "Same two bars twice, and I only had to read them once.", "cue": {"p": 56, "r": "picture"}}, {"t0": 24.56, "t1": 32.49, "who": "B", "text": "Remember: two dots facing back mean go back and play it again. With no start sign, go back to the very beginning.", "cue": {"p": 56, "r": "remember"}, "mk": [{"k": "hi", "t": 25.1, "e": 28.56, "p": 56, "r": [[0.1009, 0.2724, 0.7111, 0.0243]]}, {"k": "hi", "t": 28.56, "e": 32.89, "p": 56, "r": [[0.4778, 0.2724, 0.3342, 0.0243], [0.0861, 0.542, 0.0496, 0.015]]}], "sp": [[24.56, 0, 10], [25.1, 10, 63], [28.56, 63, 113]]}]}, {"t": "First and second time bars", "f": "audio/B2/s03-first-and-second-time-bars.mp3?v=1795579333", "s": 26, "p": 56, "l": [{"t0": 0.2, "t1": 5.72, "who": "B", "text": "First and second time bars. The first time through, play the bar marked one.", "cue": {"p": 56, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/B2-volta.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 0.2, "e": 5.72, "r": [[0.3267, 0.4795, 0.2178, 0.2612]], "pop": "B2-volta"}], "sp": [[0.2, 0, 28], [2.25, 28, 76]]}, {"t0": 5.72, "t1": 10.37, "who": "B", "text": "After the repeat, skip it, and play the bar marked two instead.", "cue": {"p": 56, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/B2-volta.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 5.72, "e": 10.37, "r": [[0.5535, 0.4795, 0.2541, 0.2612]], "pop": "B2-volta"}]}, {"t0": 10.37, "t1": 20.59, "who": "piano", "notes": [10.37, 10.99, 11.61, 12.23, 12.85, 13.47, 14.09, 15.33, 15.95, 16.57, 17.19, 17.81, 18.43, 19.05], "cue": {"p": 56, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/B2-volta.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 10.37, "e": 12.85, "r": [[0.1089, 0.4795, 0.2178, 0.2612]], "pop": "B2-volta"}, {"k": "blk", "t": 12.85, "e": 15.33, "r": [[0.3267, 0.4795, 0.2178, 0.2612]], "pop": "B2-volta"}, {"k": "blk", "t": 15.33, "e": 17.81, "r": [[0.1089, 0.4795, 0.2178, 0.2612]], "pop": "B2-volta"}, {"k": "blk", "t": 17.81, "e": 20.59, "r": [[0.5535, 0.4795, 0.2541, 0.2612]], "pop": "B2-volta"}]}, {"t0": 20.59, "t1": 23.7, "who": "P", "text": "The first-time bar only gets one turn.", "cue": {"p": 56, "r": "pop9"}, "lens": {"k": "pop", "src": "pops/B2-volta.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 20.59, "e": 23.7, "r": [[0.3267, 0.4795, 0.2178, 0.2612]], "pop": "B2-volta"}]}, {"t0": 23.7, "t1": 25.93, "who": "B", "text": "It is very good abou 33, 0.2271, 0.0208]]}, {"k": "hi", "t": 4.5, "e": 12.0, "p": 57, "r": [[0.5977, 0.4893, 0.2822, 0.0208], [0.385, 0.5127, 0.1652, 0.0208]]}], "sp": [[0.2, 0, 2], [0.48, 2, 4], [1.57, 4, 38], [3.33, 38, 60], [4.5, 60, 118]]}, {"t0": 11.6, "t1": 14.22, "who": "P", "text": "A head and a tail? Like a dog!", "cue": {"p": 57, "r": "table"}, "sp": [[11.6, 0, 19], [12.66, 19, 30]]}, {"t0": 14.22, "t1": 18.1, "who": "B", "text": "A very well-behaved dog. Coda means tail.", "cue": {"p": 57, "r": "table"}, "mk": [{"k": "hi", "t": 16.15, "e": 18.5, "p": 57, "r": [[0.1801, 0.501, 0.0551, 0.0208], [0.3947, 0.4893, 0.0336, 0.0208]]}], "sp": [[14.22, 0, 25], [16.15, 25, 41]]}]}, {"t": "The rule", "f": "audio/B3/s04-the-rule.mp3?v=1795579333", "s": 9, "p": 57, "l": [{"t0": 0.2, "t1": 9.48, "who": "B", "text": "The rule: follow the map in order. At a jump, go back. Then the first time you meet Fine, stop; or at To Coda, jump to the coda.", "cue": {"p": 57, "r": "rule"}, "mk": [{"k": "hi", "t": 0.68, "e": 2.44, "p": 57, "r": [[0.1009, 0.5792, 0.3126, 0.0243]]}, {"k": "hi", "t": 2.44, "e": 4.19, "p": 57, "r": [[0.4909, 0.5792, 0.3232, 0.0243]]}, {"k": "hi", "t": 4.19, "e": 6.62, "p": 57, "r": [[0.1518, 0.6058, 0.3914, 0.0243]]}, {"k": "hi", "t": 6.62, "e": 9.88, "p": 57, "r": [[0.7504, 0.6058, 0.1506, 0.0243], [0.1009, 0.6323, 0.0624, 0.0243]]}], "sp": [[0.2, 0, 10], [0.68, 10, 35], [2.44, 35, 55], [4.19, 55, 96], [6.62, 96, 128]]}]}, {"t": "Two traps", "f": "audio/B3/s05-two-traps.mp3?v=1795579333", "s": 19, "p": 57, "l": [{"t0": 0.2, "t1": 7.13, "who": "B", "text": "Two traps. On the way back after a D.C., skip the repeats, unless the music says otherwise.", "cue": {"p": 57, "r": "trap"}, "mk": [{"k": "hi", "t": 1.08, "e": 3.35, "p": 57, "r": [[0.3766, 0.7191, 0.3041, 0.0208]]}, {"k": "hi", "t": 3.35, "e": 7.53, "p": 57, "r": [[0.6925, 0.7191, 0.1736, 0.0208], [0.1218, 0.7442, 0.3469, 0.0208]]}], "sp": [[0.2, 0, 11], [1.08, 11, 37], [2.38, 37, 39], [3.35, 39, 91]]}, {"t0": 7.13, "t1": 13.31, "who": "B", "text": "And To Coda only counts after the jump. The first time through, play straight past it.", "cue": {"p": 57, "r": "trap"}, "mk": [{"k": "hi", "t": 7.13, "e": 9.89, "p": 57, "r": [[0.2848, 0.7741, 0.505, 0.0208]]}, {"k": "hi", "t": 9.89, "e": 13.71, "p": 57, "r": [[0.3991, 0.7741, 0.1881, 0.0208]]}], "sp": [[7.13, 0, 40], [9.89, 40, 86]]}, {"t0": 13.31, "t1": 16.63, "who": "P", "text": "Like a shortcut that only opens on the way home.", "cue": {"p": 57, "r": "trap"}}, {"t0": 16.63, "t1": 18.55, "who": "B", "text": "Exactly so.", "cue": {"p": 57, "r": "trap"}}]}, {"t": "Example: D.C. al Fine", "f": "audio/B3/02-example-d-c-al-fine.mp3?v=1795579333", "s": 16, "p": 57, "l": [{"t0": 0.2, "t1": 7.0, "who": "B", "text": "Bars A, B with Fine, C, and D with D.C. al Fine. Pause and follow the map.", "cue": {"p": 57, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/B3-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 37], [2.62, 37, 40], [3.53, 40, 49], [4.52, 49, 74]]}, {"t0": 7.0, "t1": 11.0, "who": "pause", "text": "Pause and try.", "cue": {"p": 57, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/B3-1-q.webp?v=1795579333"}}, {"t0": 11.0, "t1": 15.3, "who": "P", "text": "A B C D, then back to the start: A B, and stop at Fine.", "cue": {"p": 57, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/B3-1.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 11.1, "e": 15.3, "p": 57, "r": [[0.0105, 0.9103, 0.5129, 0.062]], "pop": "B3-1"}], "sp": [[11.0, 0, 33], [13.22, 33, 55]]}, {"who": "B", "text": "Excellent.", "cue": {"p": 57, "r": "pop1"}, "t0": 15.3, "lens": {"k": "pop", "src": "pops/B3-1.webp?v=1795579333"}, "t1": 16.54, "mk": [{"k": "hi", "t": 15.3, "e": 16.74, "p": 57, "r": [[0.0105, 0.9103, 0.5129, 0.062]], "pop": "B3-1"}]}]}, {"t": "Example: D.S. al Coda", "f": "audio/B3/03-example-d-s-al-coda.mp3?v=1795579333", "s": 19, "p": 57, "l": [{"t0": 0.2, "t1": 7.32, "who": "B", "text": "A, then B with the sign, C with To Coda, D with D.S. al Coda, and the coda E. Pause and follow.", "cue": {"p": 57, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/B3-2-q.webp?v=1795579333"}, "sp": [[0.2, 0, 50], [3.12, 50, 53], [3.83, 53, 78], [5.56, 78, 95]]}, {"t0": 7.32, "t1": 12.32, "who": "pause", "text": "Pause and try.", "cue": {"p": 57, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/B3-2-q.webp?v=1795579333"}}, {"t0": 12.32, "t1": 16.95, "who": "P", "text": "A B C D, back to the sign: B C, then jump to the coda: E.", "cue": {"p": 57, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/B3-2.webp?v=1795579333"}, "sp": [[12.32, 0, 27], [14.24, 27, 55], [15.95, 55, 57]], "mk": [{"k": "hi", "t": 12.42, "e": 17.25, "p": 57, "r": [[0.0109, 0.906, 0.6779, 0.0705]], "pop": "B3-2"}]}, {"t0": 16.95, "t1": 19.27, "who": "B", "text": "That’s it exactly.", "cue": {"p": 57, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/B3-2.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 16.95, "e": 19.47, "p": 57, "r": [[0.0109, 0.906, 0.6779, 0.0705]], "pop": "B3-2"}]}]}, {"t": "Game: how many bars?", "f": "audio/B3/04-game-how-many-bars.mp3?v=1795579333", "s": 32, "p": 57, "l": [{"t0": 0.2, "t1": 12.14, "who": "B", "text": "Each letter is one bar. Count every bar you play. First: repeat A B. Second: A, repeat B C, then D. Third: A, B with Fine, C, D.C. Pause and count.", "cue": {"p": 57, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/B3-3.webp?v=1795579333"}, "sp": [[0.2, 0, 24], [1.87, 24, 50], [3.33, 50, 57], [3.95, 57, 69], [5.08, 69, 77], [5.73, 77, 100], [7.64, 100, 107], [8.33, 107, 128], [9.85, 128, 131], [10.24, 131, 147]]}, {"t0": 12.14, "t1": 18.14, "who": "pause", "text": "Pause and try.", "cue": {"p": 57, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/B3-3.webp?v=1795579333"}}, {"t0": 18.14, "t1": 20.23, "who": "P", "text": "Four, six and five!", "cue": {"p": 57, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/B3-3.webp?v=1795579333"}}, {"t0": 20.23, "t1": 22.89, "who": "B", "text": "Splendid. That is the end of Part Three.", "cue": {"p": 57, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/B3-3.webp?v=1795579333"}, "sp": [[20.23, 0, 10], [20.83, 10, 40]]}, {"who": "B", "text": "Your little task for next time: follow the road signs in a piece, and say the order of the bars before you play. Until next time.", "cue": {"p": 57, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/B3-3.webp?v=1795579333"}, "t0": 23.44, "t1": 31.85, "sp": [[23.44, 0, 32], [25.39, 32, 113], [30.51, 113, 129]]}]}], "nx": {"wb": [null, "p. 53", "Bars and time"], "dr": [["signs", "D.C. al Fine: the order", 4]]}}, {"k": "O4", "part": "Part IV · Expression", "t": "Part opener", "pages": [58], "clips": [{"t": "Part Four: Expression", "f": "audio/O4/01-part-four-expression.mp3?v=1795579333", "s": 50, "p": 58, "l": [{"t0": 3.4, "t1": 8.11, "who": "B", "text": "Welcome to Part Four, Clara: Expression. How it should sound.", "cue": {"p": 58, "r": "opener"}, "sp": [[3.4, 0, 29], [5.34, 29, 41], [6.38, 41, 61]]}, {"t0": 8.11, "t1": 20.05, "who": "B", "text": "The notes say what to play. Expression says how: loud or soft, smooth or short, faster or slower, ringing or dry. Listen to one little phrase told like a story.", "cue": {"p": 58, "r": "opener"}, "mk": [{"k": "hi", "t": 8.11, "e": 9.73, "p": 58, "r": [[0.1528, 0.2898, 0.1469, 0.0214]]}, {"k": "hi", "t": 11.29, "e": 16.74, "p": 58, "r": [[0.3113, 0.2898, 0.1372, 0.0214]]}, {"k": "hi", "t": 12.56, "e": 16.74, "p": 58, "r": [[0.1629, 0.3668, 0.1209, 0.0178]]}], "sp": [[8.11, 0, 28], [9.73, 28, 49], [11.29, 49, 114], [16.74, 114, 160]]}, {"t0": 20.05, "t1": 29.96, "who": "piano", "notes": [20.05, 20.67, 21.29, 21.91, 22.53, 23.15, 23.77, 24.39, 25.01, 25.16, 25.32, 25.48, 25.63, 26.56, 27.18], "cue": {"p": 58, "r": "opener"}}, {"t0": 29.96, "t1": 32.75, "who": "P", "text": "It sounded like a whole little story!", "cue": {"p": 58, "r": "opener"}}, {"t0": 32.75, "t1": 48.42, "who": "B", "text": "Ten chapters: loud and soft, crescendo and accents, touch, slurs and phrases, speed words, slowing down and speeding up, mood words, the pedals, ornaments, and grace notes. Shall we start with loud and soft?", "cue": {"p": 58, "r": "chapters"}, "mk": [{"k": "hi", "t": 33.76, "e": 45.83, "p": 58, "r": [[0.0972, 0.324, 0.1215, 0.0178]]}, {"k": "hi", "t": 35.45, "e": 45.83, "p": 58, "r": [[0.1001, 0.3454, 0.2071, 0.0178]]}, {"k": "hi", "t": 37.46, "e": 45.83, "p": 58, "r": [[0.1006, 0.3668, 0.0525, 0.0178]]}, {"k": "hi", "t": 38.1, "e": 45.83, "p": 58, "r": [[0.1014, 0.3881, 0.1574, 0.0178]]}, {"k": "hi", "t": 39.49, "e": 45.83, "p": 58, "r": [[0.1008, 0.4095, 0.1142, 0.0178]]}, {"k": "hi", "t": 40.49, "e": 45.83, "p": 58, "r": [[0.1011, 0.4309, 0.2745, 0.0178]]}, {"k": "hi", "t": 42.02, "e": 45.83, "p": 58, "r": [[0.0993, 0.4523, 0.1078, 0.0178]]}, {"k": "hi", "t": 42.96, "e": 45.83, "p": 58, "r": [[0.14, 0.4736, 0.0586, 0.0178]]}, {"k": "hi", "t": 43.61, "e": 45.83, "p": 58, "r": [[0.1011, 0.495, 0.0975, 0.0178]]}, {"k": "hi", "t": 44.46, "e": 45.83, "p": 58, "r": [[0.1101, 0.5164, 0.1068, 0.0178]]}, {"k": "hi", "t": 45.83, "e": 48.82, "p": 58, "r": [[0.0972, 0.324, 0.1215, 0.0178]]}], "sp": [[32.75, 0, 14], [33.76, 14, 173], [45.83, 173, 207]]}, {"t0": 48.42, "t1": 50.14, "who": "P", "text": "Yes, please!", "cue": {"p": 58, "r": "chapters"}}]}]}, {"k": "E1", "part": "Part IV · Expression", "t": "1 · Loud and soft", "pages": [59, 141], "clips": [{"t": "Loud and soft", "f": "audio/E1/s01-loud-and-soft.mp3?v=1795579333", "s": 32, "p": 59, "l": [{"t0": 3.4, "t1": 12.1, "who": "B", "text": "A voice can whisper, chat or shout, Clara. Music does the same, and small Italian words tell you which: the dynamics.", "cue": {"p": 59, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 6.67, "p": 59, "r": [[0.0958, 0.1481, 0.1971, 0.0226]]}, {"k": "hi", "t": 4.67, "e": 6.67, "p": 59, "r": [[0.305, 0.1481, 0.145, 0.0226]]}, {"k": "hi", "t": 6.67, "e": 10.53, "p": 59, "r": [[0.4622, 0.1481, 0.4307, 0.0226], [0.073, 0.1747, 0.1057, 0.0226]]}], "sp": [[3.4, 0, 43], [6.67, 43, 104], [10.53, 104, 117]]}, {"t0": 12.1, "t1": 15.15, "who": "P", "text": "Italian words? Like on a pizza menu?", "cue": {"p": 59, "r": "lead"}, "mk": [{"k": "hi", "t": 12.1, "e": 13.3, "p": 59, "r": [[0.8223, 0.1481, 0.0706, 0.0226], [0.073, 0.1747, 0.0649, 0.0226]]}], "sp": [[12.1, 0, 15], [13.13, 15, 36]]}, {"t0": 15.15, "t1": 21.78, "who": "B", "text": "Funny you should say that. Allow me to introduce the chef of this house. Chef Pepe, Miss Clara.", "cue": {"p": 59, "r": "lead"}, "lens": {"k": "pop", "src": "pops/E1-k0.webp?v=1795579333"}, "sp": [[15.15, 0, 27], [16.7, 27, 73], [19.47, 73, 95]]}, {"t0": 21.78, "t1": 26.81, "who": "H", "text": "Buongiorno! In my kitchen nothing goes in by guesswork. Everything is weighed.", "cue": {"p": 59, "r": "lead"}, "lens": {"k": "pop", "src": "pops/E1-k0.webp?v=1795579333"}, "sp": [[21.82, 0, 12], [21.82, 12, 56], [24.73, 56, 78]]}, {"t0": 26.81, "t1": 29.51, "who": "B", "text": "He washes the salt. Twice.", "cue": {"p": 59, "r": "lead"}, "lens": {"k": "pop", "src": "pops/E1-k0.webp?v=1795579333"}, "sp": [[26.81, 0, 20], [28.15, 20, 26]]}, {"t0": 29.51, "t1": 32.0, "who": "H", "text": "Clean salt, clean sound.", "cue": {"p": 59, "r": "lead"}, "lens": {"k": "pop", "src": "pops/E1-k0.webp?v=1795579333"}}]}, {"t": "Weight makes sound", "f": "audio/E1/s01-weight-makes-sound.mp3?v=1795579333", "s": 34, "p": 59, "l": [{"t0": 0.2, "t1": 7.68, "who": "H", "text": "On the piano, loud and soft is weight: the weight of your arm on the keys. Più peso, più suono. More weight, more sound.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k0.webp?v=1795579333"}, "sp": [[0.2, 0, 39], [2.14, 39, 75], [4.12, 75, 96], [4.99, 96, 120]]}, {"t0": 7.68, "t1": 8.49, "who": "fx", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k1.webp?v=1795579333"}}, {"t0": 8.49, "t1": 13.13, "who": "H", "text": "Pianissimo: a pinch of salt. Two grams. Very soft.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k1.webp?v=1795579333"}, "sp": [[8.49, 0, 12], [8.49, 12, 29], [10.11, 29, 40], [11.31, 40, 50]]}, {"t0": 13.13, "t1": 15.91, "who": "piano", "notes": [13.13, 13.75, 14.37, 14.99], "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k1.webp?v=1795579333"}}, {"t0": 15.91, "t1": 18.12, "who": "P", "text": "Two grams? That’s nothing.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k1.webp?v=1795579333"}, "sp": [[15.91, 0, 11], [16.48, 11, 26]]}, {"t0": 18.12, "t1": 20.97, "who": "H", "text": "Two grams. Precisely. Not three.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k1.webp?v=1795579333"}, "sp": [[18.12, 0, 11], [18.71, 11, 22], [19.34, 22, 32]]}, {"t0": 20.97, "t1": 21.61, "who": "fx", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k2.webp?v=1795579333"}}, {"t0": 21.61, "t1": 24.96, "who": "H", "text": "Piano: a sugar cube. Five grams. Soft.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k2.webp?v=1795579333"}, "sp": [[21.61, 0, 7], [22.06, 7, 21], [22.75, 21, 33], [23.49, 33, 38]]}, {"t0": 24.96, "t1": 27.74, "who": "piano", "notes": [24.96, 25.58, 26.2, 26.82], "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k2.webp?v=1795579333"}}, {"t0": 27.74, "t1": 34.33, "who": "B", "text": "The piano is named after this, Clara. Its full name is pianoforte: soft and loud.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k2.webp?v=1795579333"}, "sp": [[27.74, 0, 38], [30.28, 38, 67], [31.47, 67, 81]]}]}, {"t": "mp and mf", "f": "audio/E1/s02-mp-and-mf.mp3?v=1795579333", "s": 25, "p": 59, "l": [{"t0": 0.2, "t1": 4.66, "who": "H", "text": "Now the middle two. M is mezzo: half.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k2.webp?v=1795579333"}, "sp": [[0.2, 0, 20], [1.03, 20, 32], [3.4, 32, 37]]}, {"t0": 4.66, "t1": 5.33, "who": "fx", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k3.webp?v=1795579333"}}, {"t0": 5.33, "t1": 8.76, "who": "H", "text": "Mezzo-piano: an egg. Half soft.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k3.webp?v=1795579333"}, "sp": [[5.33, 0, 13], [6.81, 13, 21], [7.2, 21, 31]]}, {"t0": 8.76, "t1": 11.55, "who": "piano", "notes": [8.76, 9.38, 10.0, 10.62], "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k3.webp?v=1795579333"}}, {"t0": 11.55, "t1": 12.28, "who": "fx", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k4.webp?v=1795579333"}}, {"t0": 12.28, "t1": 16.36, "who": "H", "text": "Mezzo-forte: a tomato. Half loud.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k4.webp?v=1795579333"}, "sp": [[12.28, 0, 13], [13.83, 13, 23], [14.53, 23, 33]]}, {"t0": 16.36, "t1": 19.14, "who": "piano", "notes": [16.36, 16.98, 17.6, 18.22], "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k4.webp?v=1795579333"}}, {"t0": 19.14, "t1": 21.14, "who": "P", "text": "My chatting voice.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k4.webp?v=1795579333"}}, {"t0": 21.14, "t1": 25.26, "who": "B", "text": "Your indoor voice, Clara. The one I keep asking for.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k4.webp?v=1795579333"}, "sp": [[21.14, 0, 26], [23.01, 26, 52]]}]}, {"t": "f and ff", "f": "audio/E1/s03-f-and-ff.mp3?v=1795579333", "s": 35, "p": 59, "l": [{"t0": 0.2, "t1": 1.01, "who": "fx", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k5.webp?v=1795579333"}}, {"t0": 1.01, "t1": 3.99, "who": "H", "text": "Forte: a whole wheel of cheese. Loud.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k5.webp?v=1795579333"}, "sp": [[1.01, 0, 7], [1.39, 7, 32], [2.47, 32, 37]]}, {"t0": 3.99, "t1": 6.77, "who": "piano", "notes": [3.99, 4.61, 5.23, 5.85], "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k5.webp?v=1795579333"}}, {"t0": 6.77, "t1": 9.64, "who": "H", "text": "And fortissimo…", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k5.webp?v=1795579333"}}, {"t0": 9.64, "t1": 10.71, "who": "fx", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k6.webp?v=1795579333"}}, {"t0": 10.71, "t1": 13.72, "who": "H", "text": "The whole sack of flour! Very loud.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k6.webp?v=1795579333"}, "sp": [[10.71, 0, 25], [11.88, 25, 35]]}, {"t0": 13.72, "t1": 16.5, "who": "piano", "notes": [13.72, 14.34, 14.96, 15.58], "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k6.webp?v=1795579333"}}, {"t0": 16.5, "t1": 18.65, "who": "P", "text": "There’s flour everywhere.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k6.webp?v=1795579333"}}, {"t0": 18.65, "t1": 20.37, "who": "H", "text": "I will wash it.", "cue": {"p": 59, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E1-k6.webp?v=1795579333"}}, {"t0": 20.37, "t1": 34.9, "who": "B", "text": "Remember: six steps, from a whisper to a shout. Pianissimo, piano, mezzo-piano, mezzo-forte, forte, fortissimo. Mezzo means half.", "cue": {"p": 59, "r": "remember"}, "lens": {"k": "pop", "src": "pops/E1-kall.webp?v=1795579333"}, "sp": [[20.37, 0, 10], [20.96, 10, 48], [23.82, 48, 112], [31.93, 112, 129]]}]}, {"t": "A sign lasts", "f": "audio/E1/s07-a-sign-lasts.mp3?v=1795579333", "s": 26, "p": 59, "l": [{"t0": 0.2, "t1": 7.32, "who": "B", "text": "The rule: a sign lasts until the next one. Look: piano at the start, and forte in the third bar.", "cue": {"p": 59, "r": "rule"}, "lens": {"k": "pop", "src": "pops/E1-rule.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 0.2, "e": 7.32, "r": [[0.1238, 0.7624, 0.0272, 0.0841], [0.7029, 0.7624, 0.0319, 0.1301]], "pop": "E1-rule"}], "sp": [[0.2, 0, 10], [0.79, 10, 43], [3.24, 43, 49], [3.78, 49, 96]]}, {"t0": 7.32, "t1": 12.22, "who": "B", "text": "Every note stays soft, bar after bar, until forte arrives.", "cue": {"p": 59, "r": "rule"}, "lens": {"k": "pop", "src": "pops/E1-rule.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 7.32, "e": 12.22, "r": [[0.1238, 0.7624, 0.0272, 0.0841]], "pop": "E1-rule"}]}, {"t0": 12.22, "t1": 19.96, "who": "piano", "notes": [12.22, 12.84, 13.46, 14.08, 14.7, 15.32, 15.94, 16.56, 17.18, 17.8, 18.42, 19.04], "cue": {"p": 59, "r": "rule"}, "lens": {"k": "pop", "src": "pops/E1-rule.webp?v=1795579333"}, "mk": [{"k": "nt", "t": 12.22, "e": 12.84, "r": [[0.127, 0.5533, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "nt", "t": 12.84, "e": 13.46, "r": [[0.1951, 0.5044, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "nt", "t": 13.46, "e": 14.08, "r": [[0.2633, 0.4555, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "nt", "t": 14.08, "e": 14.7, "r": [[0.3314, 0.5044, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "nt", "t": 14.7, "e": 15.32, "r": [[0.4186, 0.5533, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "nt", "t": 15.32, "e": 15.94, "r": [[0.4868, 0.5044, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "nt", "t": 15.94, "e": 16.56, "r": [[0.5549, 0.4555, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "nt", "t": 16.56, "e": 17.18, "r": [[0.623, 0.5044, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "nt", "t": 17.18, "e": 17.8, "r": [[0.7102, 0.5533, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "nt", "t": 17.8, "e": 18.42, "r": [[0.7784, 0.5044, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "nt", "t": 18.42, "e": 19.04, "r": [[0.8465, 0.4555, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "nt", "t": 19.04, "e": 19.96, "r": [[0.9147, 0.5044, 0.0223, 0.1972]], "pop": "E1-rule"}, {"k": "blk", "t": 12.22, "e": 17.18, "r": [[0.1238, 0.7624, 0.0272, 0.0841]], "pop": "E1-rule"}, {"k": "blk", "t": 17.18, "e": 19.96, "r": [[0.7029, 0.7624, 0.0319, 0.1301]], "pop": "E1-rule"}]}, {"t0": 19.96, "t1": 22.5, "who": "P", "text": "It doesn’t fade away on its own?", "cue": {"p": 59, "r": "rule"}, "lens": {"k": "pop", "src": "pops/E1-rule.webp?v=1795579333"}}, {"t0": 22.5, "t1": 25.56, "who": "B", "text": "No. It waits politely for the next sign.", "cue": {"p": 59, "r": "rule"}, "lens": {"k": "pop", "src": "pops/E1-rule.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 22.5, "e": 25.56, "r": [[0.7029, 0.7624, 0.0319, 0.1301]], "pop": "E1-rule"}], "sp": [[22.5, 0, 4], [22.93, 4, 40]]}]}, {"t": "More words", "f": "audio/E1/s09-more-words.mp3?v=1795579333", "s": 20, "p": 59, "l": [{"t0": 0.2, "t1": 8.17, "who": "B", "text": "More words for loud and soft are in the Glossary, on page one hundred and forty-one. Chef Pepe, two to taste?", "cue": {"p": 59, "r": "more"}, "mk": [{"k": "hi", "t": 0.2, "e": 5.54, "p": 59, "r": [[0.4855, 0.6749, 0.3487, 0.0226], [0.099, 0.6996, 0.084, 0.0226], [0.073, 0.7448, 0.1928, 0.0172]]}], "sp": [[0.2, 0, 85], [5.54, 85, 109]]}, {"t0": 8.17, "t1": 13.63, "who": "H", "text": "Subito: suddenly! And sotto voce: under your breath, like a secret.", "cue": {"p": 59, "r": "more"}, "sp": [[8.17, 0, 8], [8.17, 8, 18], [8.53, 18, 34], [9.5, 34, 67]]}, {"t0": 13.63, "t1": 16.03, "who": "P", "text": "Like the secret ingredient?", "cue": {"p": 59, "r": "more"}}, {"t0": 16.03, "t1": 19.89, "who": "H", "text": "There is no secret ingredient. There is only weighing.", "cue": {"p": 59, "r": "more"}, "sp": [[16.03, 0, 31], [17.72, 31, 54]]}]}, {"t": "Example: mp or mf?", "f": "audio/E1/02-example-mp-or-mf.mp3?v=1795579333", "s": 24, "p": 59, "l": [{"t0": 0.2, "t1": 9.29, "who": "B", "text": "Which is louder: mezzo-piano or mezzo-forte? Mezzo means half. Pause.", "cue": {"p": 59, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E1-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 17], [1.79, 17, 45], [5.66, 45, 63], [7.82, 63, 69]]}, {"t0": 9.29, "t1": 12.29, "who": "pause", "text": "Pause and try.", "cue": {"p": 59, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E1-1-q.webp?v=1795579333"}}, {"t0": 12.29, "t1": 19.33, "who": "P", "text": "Mezzo-forte, half loud, is louder than mezzo-piano, half soft.", "cue": {"p": 59, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E1-1.webp?v=1795579333"}}, {"t0": 19.33, "t1": 21.11, "who": "B", "text": "You’ve got it.", "cue": {"p": 59, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E1-1.webp?v=1795579333"}}, {"t0": 21.11, "t1": 23.89, "who": "piano", "notes": [21.11, 22.35], "cue": {"p": 59, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E1-1.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 21.11, "e": 22.35, "r": [[0.3554, 0.264, 0.1168, 0.264]], "pop": "E1-1"}, {"k": "blk", "t": 22.35, "e": 23.89, "r": [[0.4849, 0.264, 0.1168, 0.264]], "pop": "E1-1"}]}]}, {"t": "Try it: the Surprise", "f": "audio/E1/03-try-it-the-surprise.mp3?v=1795579333", "s": 47, "p": 59, "l": [{"t0": 0.2, "t1": 10.42, "who": "B", "text": "Play Middle C six ways, from pianissimo to fortissimo, using the weight of your arm, then come back down.", "cue": {"p": 59, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E1-2.webp?v=1795579333"}}, {"t0": 10.42, "t1": 24.06, "who": "B", "text": "Haydn knew all about this. In his Surprise Symphony the tune tiptoes along softly, comes again even softer, and then the whole orchestra crashes in with one almighty fortissimo bang.", "cue": {"p": 59, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E1-3.webp?v=1795579333"}, "sp": [[10.42, 0, 27], [12.45, 27, 182]]}, {"t0": 24.06, "t1": 35.11, "who": "piano", "notes": [24.06, 24.68, 25.3, 25.92, 26.54, 27.16, 27.78, 29.02, 29.64, 30.26, 30.88, 31.5, 32.12, 32.74, 33.36], "cue": {"p": 59, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E1-3.webp?v=1795579333"}, "mk": [{"k": "blk", "t": 24.06, "e": 24.68, "r": [[0.0951, 0.557, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 24.68, "e": 25.3, "r": [[0.1197, 0.557, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 25.3, "e": 25.92, "r": [[0.1444, 0.5309, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 25.92, "e": 26.54, "r": [[0.1691, 0.5309, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 26.54, "e": 27.16, "r": [[0.2029, 0.5016, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 27.16, "e": 27.78, "r": [[0.2276, 0.5016, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 27.78, "e": 29.02, "r": [[0.2523, 0.5309, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 29.02, "e": 29.64, "r": [[0.298, 0.5147, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 29.64, "e": 30.26, "r": [[0.3227, 0.5147, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 30.26, "e": 30.88, "r": [[0.3473, 0.544, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 30.88, "e": 31.5, "r": [[0.372, 0.544, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 31.5, "e": 32.12, "r": [[0.4059, 0.57, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 32.12, "e": 32.74, "r": [[0.4305, 0.57, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 32.74, "e": 33.36, "r": [[0.4552, 0.5993, 0.0238, 0.0912]], "pop": "E1-3"}, {"k": "blk", "t": 33.36, "e": 35.11, "r": [[0.4552, 0.5993, 0.0238, 0.0912]], "pop": "E1-3"}]}, {"t0": 35.11, "t1": 36.66, "who": "P", "text": "I jumped!", "cue": {"p": 59, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E1-3.webp?v=1795579333"}}, {"t0": 36.66, "t1": 38.09, "who": "B", "text": "So did the audience.", "cue": {"p": 59, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E1-3.webp?v=1795579333"}}, {"who": "B", "text": "Your little task for next time: play one tune pianissimo, and then fortissimo. Which did you like better? Until next time.", "cue": {"p": 59, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E1-3.webp?v=1795579333"}, "t0": 38.64, "t1": 46.75}]}], "nx": {"wb": [null, "p. 57", "Part IV · Expression"], "dr": [["dynamics", "pp p mf f: what does it mean?", 1]]}}, {"k": "E2", "part": "Part IV · Expression", "t": "2 · Crescendo and accents", "pages": [60], "clips": [{"t": "Crescendo and accents", "f": "audio/E2/k101-crescendo-and-accents.mp3?v=1795579333", "s": 17, "p": 60, "l": [{"t0": 3.4, "t1": 12.29, "who": "B", "text": "Music rarely stays at one level, Clara. It can grow louder or fade little by little, or make a single note suddenly strong.", "cue": {"p": 60, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 6.3, "p": 60, "r": [[0.073, 0.1372, 0.2818, 0.0193]]}, {"k": "hi", "t": 6.3, "e": 12.69, "p": 60, "r": [[0.3864, 0.1372, 0.5093, 0.0193], [0.073, 0.1599, 0.1967, 0.0193]]}], "sp": [[3.4, 0, 40], [6.3, 40, 123]]}, {"t0": 12.29, "t1": 17.11, "who": "H", "text": "In my kitchen too. Things rise, things sink, and now and then a lid goes bang.", "cue": {"p": 60, "r": "lead"}, "lens": {"k": "pop", "src": "pops/E2-c-0.webp?v=1795579333"}, "sp": [[12.29, 0, 19], [13.3, 19, 78]]}]}, {"t": "Crescendo", "f": "audio/E2/k102-crescendo.mp3?v=1795579333", "s": 22, "p": 60, "l": [{"t0": 0.2, "t1": 8.73, "who": "B", "text": "Crescendo: getting louder, little by little. It is written as a hairpin that opens, or as the word cresc.", "cue": {"p": 60, "r": "table"}, "lens": {"k": "pop", "src": "pops/E2-c-0.webp?v=1795579333"}, "sp": [[0.2, 0, 11], [1.46, 11, 45], [3.74, 45, 105]]}, {"t0": 8.73, "t1": 13.8, "who": "H", "text": "Like dough in a warm kitchen. It rises little by little. You cannot hurry it.", "cue": {"p": 60, "r": "table"}, "lens": {"k": "pop", "src": "pops/E2-c-0.webp?v=1795579333"}, "sp": [[8.73, 0, 30], [10.33, 30, 57], [11.81, 57, 77]]}, {"t0": 13.8, "t1": 16.58, "who": "piano", "notes": [13.8, 14.42, 15.04, 15.66], "cue": {"p": 60, "r": "table"}, "lens": {"k": "pop", "src": "pops/E2-c.webp?v=1795579333"}}, {"t0": 16.58, "t1": 18.88, "who": "P", "text": "Like a dragon waking up.", "cue": {"p": 60, "r": "table"}, "lens": {"k": "pop", "src": "pops/E2-c.webp?v=1795579333"}}, {"t0": 18.88, "t1": 22.06, "who": "B", "text": "Slowly. Dragons dislike mornings.", "cue": {"p": 60, "r": "table"}, "lens": {"k": "pop", "src": "pops/E2-c.webp?v=1795579333"}, "sp": [[18.88, 0, 8], [19.58, 8, 33]]}]}, {"t": "Diminuendo", "f": "audio/E2/k103-diminuendo.mp3?v=1795579333", "s": 23, "p": 60, "l": [{"t0": 0.2, "t1": 8.59, "who": "B", "text": "Diminuendo, or decrescendo: g 1, "r": [[0.1128, 0.1354, 0.4152, 0.0187]]}, {"k": "hi", "t": 6.67, "e": 8.91, "p": 61, "r": [[0.5381, 0.1354, 0.1447, 0.0187]]}, {"k": "hi", "t": 8.91, "e": 13.82, "p": 61, "r": [[0.6929, 0.1354, 0.1967, 0.0187], [0.073, 0.1574, 0.4947, 0.0187]]}], "sp": [[3.4, 0, 73], [8.91, 73, 151], [13.82, 151, 172]]}, {"t0": 15.92, "t1": 20.05, "who": "H", "text": "Three ways to touch, Miss Clara: hold on, spring off, or crack.", "cue": {"p": 61, "r": "lead"}, "lens": {"k": "pop", "src": "pops/E3-l-0.webp?v=1795579333"}, "sp": [[15.92, 0, 33], [17.39, 33, 63]]}]}, {"t": "Legato", "f": "audio/E3/k102-legato.mp3?v=1795579333", "s": 20, "p": 61, "l": [{"t0": 0.2, "t1": 7.19, "who": "B", "text": "First, legato. A curve over the notes: join them, with no gap between.", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-l-0.webp?v=1795579333"}, "sp": [[0.2, 0, 15], [2.46, 15, 39], [4.17, 39, 70]]}, {"t0": 7.19, "t1": 13.37, "who": "B", "text": "Like the monkey bars, Clara. Never let go of one bar until you have hold of the next.", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-l-0.webp?v=1795579333"}, "sp": [[7.19, 0, 29], [9.43, 29, 85]]}, {"t0": 13.37, "t1": 16.15, "who": "piano", "notes": [13.37, 13.99, 14.61, 15.23], "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-l.webp?v=1795579333"}}, {"t0": 16.15, "t1": 18.16, "who": "P", "text": "And no falling off.", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-l.webp?v=1795579333"}}, {"t0": 18.16, "t1": 20.16, "who": "B", "text": "Not on my watch.", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-l.webp?v=1795579333"}}]}, {"t": "Staccato", "f": "audio/E3/k001-staccato.mp3?v=1795579333", "s": 23, "p": 61, "l": [{"t0": 0.2, "t1": 8.89, "who": "B", "text": "Staccato. A dot over or under a note: short and detached. Let go early, and the note stops before the next one.", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-s-0.webp?v=1795579333"}, "sp": [[0.2, 0, 10], [1.41, 10, 38], [3.39, 38, 58], [5.18, 58, 111]]}, {"t0": 8.89, "t1": 13.35, "who": "H", "text": "Like a drop of water on a hot pan. Tss! It springs straight off.", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-s-0.webp?v=1795579333"}, "sp": [[8.89, 0, 35], [10.65, 35, 40], [10.65, 40, 64]]}, {"t0": 13.35, "t1": 16.13, "who": "piano", "notes": [13.35, 13.97, 14.59, 15.21], "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-s.webp?v=1795579333"}}, {"t0": 16.13, "t1": 19.3, "who": "P", "text": "Tss! Tss! Tss! Tss!", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-s.webp?v=1795579333"}, "sp": [[16.28, 0, 5], [17.13, 5, 10], [17.98, 10, 15], [18.84, 15, 19]]}, {"t0": 19.3, "t1": 22.8, "who": "B", "text": "Short and detached. The pan does the rest.", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-s.webp?v=1795579333"}, "sp": [[19.3, 0, 20], [20.72, 20, 42]]}]}, {"t": "Tenuto", "f": "audio/E3/s04-tenuto.mp3?v=1795579333", "s": 15, "p": 61, "l": [{"t0": 0.2, "t1": 7.02, "who": "B", "text": "Tenuto. A short line over the note: hold it for its full length, leaning on it a little.", "cue": {"p": 61, "r": "picture"}, "mk": [{"k": "blk", "t": 0.2, "e": 7.02, "r": [[0.2, 0.3543, 0.6, 0.04], [0.073, 0.6258, 0.855, 0.0329]], "p": 61}], "sp": [[0.21, 0, 8], [0.21, 8, 36], [3.39, 36, 88]]}, {"t0": 7.02, "t1": 9.82, "who": "piano", "notes": [7.02, 7.64, 8.26, 8.88], "cue": {"p": 61, "r": "picture"}, "mk": [{"k": "blk", "t": 7.02, "e": 7.64, "r": [[0.4415, 0.3678, 0.068, 0.013]], "p": 61}, {"k": "blk", "t": 7.64, "e": 8.26, "r": [[0.5228, 0.3678, 0.069, 0.013]], "p": 61}, {"k": "blk", "t": 8.26, "e": 8.88, "r": [[0.605, 0.3678, 0.0671, 0.013]], "p": 61}, {"k": "blk", "t": 8.88, "e": 9.81, "r": [[0.6872, 0.3678, 0.0671, 0.013]], "p": 61}]}, {"t0": 9.82, "t1": 12.46, "who": "P", "text": "Like pressing a doorbell properly.", "cue": {"p": 61, "r": "picture"}}, {"t0": 12.46, "t1": 14.76, "who": "B", "text": "Without being rude about it.", "cue": {"p": 61, "r": "picture"}}]}, {"t": "Accent", "f": "audio/E3/k001-accent.mp3?v=1795579333", "s": 19, "p": 61, "l": [{"t0": 0.2, "t1": 5.87, "who": "B", "text": "Accent. An arrow lying on its side: give the start of the note extra strength.", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-a-0.webp?v=1795579333"}, "sp": [[0.2, 0, 8], [0.85, 8, 36], [2.82, 36, 78]]}, {"t0": 5.87, "t1": 10.79, "who": "H", "text": "Like my little mallet on a walnut. Crack! A firm strike, and the note rings on.", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-a-0.webp?v=1795579333"}, "sp": [[5.87, 0, 35], [7.45, 35, 42], [7.88, 42, 79]]}, {"t0": 10.79, "t1": 13.57, "who": "piano", "notes": [10.79, 11.41, 12.03, 12.65], "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-a.webp?v=1795579333"}}, {"t0": 13.57, "t1": 16.21, "who": "P", "text": "Each one starts with a little shout.", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-a.webp?v=1795579333"}}, {"t0": 16.21, "t1": 18.62, "who": "B", "text": "And then behaves itself.", "cue": {"p": 61, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E3-a.webp?v=1795579333"}}]}, {"t": "Same notes, four touches", "f": "audio/E3/s06-same-notes-four-touches.mp3?v=1795579333", "s": 20, "p": 61, "l": [{"t0": 0.2, "t1": 5.0, "who": "B", "text": "Now all four, one after another. The same notes, four touches.", "cue": {"p": 61, "r": "picture"}, "mk": [{"k": "blk", "t": 0.2, "e": 5.0, "r": [[0.2, 0.285, 0.6, 0.14]], "p": 61}], "sp": [[0.2, 0, 33], [2.44, 33, 62]]}, {"t0": 5.0, "t1": 15.23, "who": "piano", "notes": [5.0, 5.62, 6.24, 6.86, 7.73, 8.35, 8.97, 9.59, 10.46, 11.08, 11.7, 12.32, 13.2, 13.82, 14.44, 15.06], "cue": {"p": 61, "r": "picture"}, "mk": [{"k": "blk", "t": 5.0, "e": 7.48, "r": [[0.2, 0.2854, 0.6, 0.04]], "p": 61}, {"k": "blk", "t": 7.48, "e": 9.96, "r": [[0.2, 0.3197, 0.6, 0.04]], "p": 61}, {"k": "blk", "t": 9.96, "e": 12.45, "r": [[0.2, 0.3543, 0.6, 0.04]], "p": 61}, {"k": "blk", "t": 12.45, "e": 15.23, "r": [[0.2, 0.3882, 0.6, 0.04]], "p": 61}]}, {"t0": 15.23, "t1": 20.17, "who": "B", "text": "Remember: curve, join. Dot, short. Line, hold. Arrow, strong.", "cue": {"p": 61, "r": "remember"}, "mk": [{"k": "hi", "t": 15.63, "e": 16.83, "p": 61, "r": [[0.0945, 0.2364, 0.1071, 0.0187]]}, {"k": "hi", "t": 16.53, "e": 17.73, "p": 61, "r": [[0.2137, 0.2364, 0.0993, 0.0187]]}, {"k": "hi", "t": 17.56, "e": 18.76, "p": 61, "r": [[0.325, 0.2364, 0.0979, 0.0187]]}, {"k": "hi", "t": 18.52, "e": 20.57, "p": 61, "r": [[0.435, 0.2364, 0.1353, 0.0187]]}], "sp": [[15.23, 0, 10], [15.63, 10, 23], [16.53, 23, 35], [17.56, 35, 47], [18.52, 47, 61]]}]}, {"t": "Three kinds of short", "f": "audio/E3/s07-three-kinds-of-short.mp3?v=1795579333", "s": 40, "p": 61, "l": [{"t0": 0.2, "t1": 6.46, "who": "B", "text": "Short comes in three sizes. A dot is staccato: short.", "cue": {"p": 61, "r": "more"}, "mk": [{"k": "blk", "t": 0.2, "e": 6.46, "r": [[0.073, 0.5175, 0.855, 0.0354]], "p": 61}], "sp": [[0.2, 0, 28], [2.26, 28, 47], [5.0, 47, 53]]}, {"t0": 6.46, "t1": 9.24, "who": "piano", "notes": [6.46, 7.08, 7.7, 8.32], "cue": {"p": 61, "r": "more"}, "mk": [{"k": "blk", "t": 6.46, "e": 9.24, "r": [[0.073, 0.5175, 0.855, 0.0354]], "p": 61}]}, {"t0": 9.24, "t1": 21.64, "who": "B", "text": "Dots under a slur are mezzo-staccato: a little detached, gently. Halfway between legato and staccato.", "cue": {"p": 61, "r": "more"}, "mk": [{"k": "blk", "t": 9.24, "e": 21.64, "r": [[0.073, 0.5529, 0.855, 0.0376]], "p": 61}], "sp": [[9.24, 0, 38], [13.81, 38, 65], [15.84, 65, 101]]}, {"t0": 21.64, "t1": 24.42, "who": "piano", "notes": [21.64, 22.26, 22.88, 23.5], "cue": {"p": 61, "r": "more"}, "mk": [{"k": "blk", "t": 21.64, "e": 24.42, "r": [[0.073, 0.5529, 0.855, 0.0376]], "p": 61}]}, {"t0": 24.42, "t1": 30.71, "who": "B", "text": "A wedge is staccatissimo: very short, shorter than a dot.", "cue": {"p": 61, "r": "more"}, "mk": [{"k": "blk", "t": 24.42, "e": 30.71, "r": [[0.073, 0.5905, 0.855, 0.0353]], "p": 61}], "sp": [[24.42, 0, 26], [25.99, 26, 57]]}, {"t0": 30.71, "t1": 33.49, "who": "piano", "notes": [30.71, 31.33, 31.95, 32.57], "cue": {"p": 61, "r": "more"}, "mk": [{"k": "blk", "t": 30.71, "e": 33.49, "r": [[0.073, 0.5905, 0.855, 0.0353]], "p": 61}]}, {"t0": 33.49, "t1": 35.87, "who": "P", "text": "Short, shorter, shortest.", "cue": {"p": 61, "r": "more"}, "mk": [{"k": "hi", "t": 33.49, "e": 36.27, "p": 61, "r": [[0.4759, 0.528, 0.0423, 0.016]]}, {"k": "hi", "t": 33.81, "e": 36.27, "p": 61, "r": [[0.6445, 0.6033, 0.0589, 0.016]]}]}, {"t0": 35.87, "t1": 39.79, "who": "B", "text": "The wedge is barely there at all. A flea’s hop.", "cue": {"p": 61, "r": "more"}, "sp": [[35.87, 0, 34], [38.37, 34, 47]]}]}, {"t": "Three kinds of strong", "f": "audio/E3/s08-three-kinds-of-strong.mp3?v=1795579333", "s": 31, "p": 61, "l": [{"t0": 0.2, "t1": 5.1, "who": "B", "text": "Strong comes in three kinds too. An accent: a stronger start.", "cue": {"p": 61, "r": "more"}, "mk": [{"k": "blk", "t": 0.2, "e": 5.1, "r": [[0.073, 0.6587, 0.855, 0.0329]], "p": 61}], "sp": [[0.2, 0, 33], [2.32, 33, 44], [3.27, 44, 61]]}, {"t0": 5.1, "t1": 7.88, "who": "piano", "notes": [5.1, 5.72, 6.34, 6.96], "cue": {"p": 61, "r": "more"}, "mk": [{"k": "blk", "t": 5.1, "e": 7.88, "r": [[0.073, 0.6587, 0.855, 0.0329]], "p": 61}]}, {"t0": 7.88, "t1": 13.39, "who": "B", "text": "Marcato, the little roof: stronger still, and a little detached.", "cue": {"p": 61, "r": "more"}, "mk": [{"k": "blk", "t": 7.88, "e": 13.39, "r": [[0.073, 0.6916, 0.855, 0.033]], "p": 61}], "sp": [[7.88, 0, 26], [10.16, 26, 64]]}, {"t0": 13.39, "t1": 16.17, "who": "piano", "notes": [13.39, 14.01, 14.63, 15.25], "cue": {"p": 61, "r": "more"}, "mk": [{"k": "blk", "t": 13.39, "e": 16.17, "r": [[0.073, 0.6916, 0.855, 0.033]], "p": 61}]}, {"t0": 16.17, "t1": 23.81, "who": "B", "text": [[0.073, 0.7599, 0.855, 0.0528]], "p": 61}, {"k": "blk", "t": 28.12, "e": 30.9, "r": [[0.073, 0.5175, 0.855, 0.0354]], "p": 61}]}, {"t0": 30.9, "t1": 33.71, "who": "P", "text": "Each note gets its own little space.", "cue": {"p": 61, "r": "more"}, "mk": [{"k": "hi", "t": 30.9, "e": 34.11, "p": 61, "r": [[0.7334, 0.7021, 0.1189, 0.016], [0.0831, 0.7342, 0.4657, 0.0169]]}]}, {"t0": 33.71, "t1": 37.1, "who": "B", "text": "Bach liked his notes to have elbow room.", "cue": {"p": 61, "r": "more"}}]}, {"t": "One trap", "f": "audio/E3/s10-one-trap.mp3?v=1795579333", "s": 18, "p": 61, "l": [{"t0": 0.2, "t1": 7.05, "who": "B", "text": "One trap: staccato is short, not loud. Listen: soft, and still short.", "cue": {"p": 61, "r": "trap"}, "mk": [{"k": "hi", "t": 1.57, "e": 4.28, "p": 61, "r": [[0.1708, 0.8398, 0.1628, 0.016]]}], "sp": [[0.2, 0, 10], [1.57, 10, 39], [4.28, 39, 47], [4.82, 47, 69]]}, {"t0": 7.05, "t1": 9.83, "who": "piano", "notes": [7.05, 7.67, 8.29, 8.91], "cue": {"p": 61, "r": "trap"}, "mk": [{"k": "blk", "t": 7.05, "e": 7.67, "r": [[0.4405, 0.3332, 0.0255, 0.013]], "p": 61}, {"k": "blk", "t": 7.67, "e": 8.29, "r": [[0.5218, 0.3332, 0.0255, 0.013]], "p": 61}, {"k": "blk", "t": 8.29, "e": 8.91, "r": [[0.604, 0.3332, 0.0255, 0.013]], "p": 61}, {"k": "blk", "t": 8.91, "e": 9.83, "r": [[0.6853, 0.3332, 0.0255, 0.013]], "p": 61}]}, {"t0": 9.83, "t1": 13.23, "who": "B", "text": "Strong is a different mark: the accent.", "cue": {"p": 61, "r": "trap"}, "mk": [{"k": "blk", "t": 9.83, "e": 13.23, "r": [[0.073, 0.6587, 0.855, 0.0329]], "p": 61}], "sp": [[9.83, 0, 28], [11.68, 28, 39]]}, {"t0": 13.23, "t1": 15.58, "who": "P", "text": "So popcorn can be quiet.", "cue": {"p": 61, "r": "trap"}}, {"t0": 15.58, "t1": 17.94, "who": "B", "text": "In a very polite cinema.", "cue": {"p": 61, "r": "trap"}}]}, {"t": "Example: line, dot or arrow?", "f": "audio/E3/02-example-line-dot-or-arrow.mp3?v=1795579333", "s": 18, "p": 61, "l": [{"t0": 0.2, "t1": 8.07, "who": "B", "text": "The first two Cs have lines, the Gs have dots, and the E in bar two has an arrow. How do you play each? Pause.", "cue": {"p": 61, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E3-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 82], [5.47, 82, 104], [6.81, 104, 110]]}, {"t0": 8.07, "t1": 12.07, "who": "pause", "text": "Pause and try.", "cue": {"p": 61, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E3-1-q.webp?v=1795579333"}}, {"t0": 12.07, "t1": 15.99, "who": "P", "text": "The Cs held their full length, the Gs short, and the E strong.", "cue": {"p": 61, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E3-1.webp?v=1795579333"}}, {"who": "B", "text": "Well spotted, Clara.", "cue": {"p": 61, "r": "pop1"}, "t0": 15.99, "lens": {"k": "pop", "src": "pops/E3-1.webp?v=1795579333"}, "t1": 17.98}]}, {"t": "Try it", "f": "audio/E3/03-try-it.mp3?v=1795579333", "s": 12, "p": 61, "l": [{"t0": 0.2, "t1": 12.01, "who": "B", "text": "Play one bar of a piece three ways: all legato, all staccato, then as written. Can someone else hear which was which? Until next time.", "cue": {"p": 61, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E3-2.webp?v=1795579333"}, "sp": [[0.2, 0, 36], [2.36, 36, 79], [7.82, 79, 118], [10.06, 118, 134]]}]}], "nx": {"wb": [null, "pp. 59–60", "Expression"], "dr": [["dynamics", "Legato or staccato?", 4]]}}, {"k": "E4", "part": "Part IV · Expression", "t": "4 · Slurs and phrases", "pages": [62, 63], "clips": [{"t": "Slurs and phrases", "f": "audio/E4/k001-slurs-and-phrases.mp3?v=1795579333", "s": 53, "p": 62, "l": [{"t0": 3.4, "t1": 15.64, "who": "B", "text": "A curve over different notes is a slur, Clara: join them, then lift at its end, like a breath. A long slur over a whole line of tune is a phrase: one musical sentence.", "cue": {"p": 62, "r": "lead"}, "lens": {"k": "pop", "src": "pops/E4-p-0.webp?v=1795579333"}, "sp": [[3.4, 0, 47], [6.33, 47, 95], [9.92, 95, 146], [13.48, 146, 167]]}, {"t0": 15.64, "t1": 20.22, "who": "B", "text": "You wouldn’t stop in the middle op1"}, "lens": {"k": "pop", "src": "pops/E5-1.webp?v=1795579333"}, "t0": 10.9, "t1": 18.26}]}], "nx": {"wb": [null, "p. 62", "Expression"], "dr": [["terms", "Speed words: what they mean", 1]]}}, {"k": "E6", "part": "Part IV · Expression", "t": "6 · Slowing down and speeding up", "pages": [65, 66, 141], "clips": [{"t": "Slowing down and speeding up", "f": "audio/E6/s01-slowing-down-and-speeding-up.mp3?v=1795579333", "s": 18, "p": 65, "l": [{"t0": 3.4, "t1": 11.22, "who": "B", "text": "Words inside the music ask you to slow down, speed up, or wait, Clara, and then to come back to the first speed.", "cue": {"p": 65, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 11.62, "p": 65, "r": [[0.073, 0.2317, 0.5348, 0.0243]]}, {"k": "hi", "t": 6.16, "e": 11.62, "p": 65, "r": [[0.6209, 0.2317, 0.1098, 0.0243]]}, {"k": "hi", "t": 7.16, "e": 11.62, "p": 65, "r": [[0.7754, 0.2317, 0.0482, 0.0243]]}, {"k": "hi", "t": 8.52, "e": 11.62, "p": 65, "r": [[0.1644, 0.2603, 0.3398, 0.0243]]}]}, {"t0": 11.22, "t1": 18.32, "who": "B", "text": "Remember: rit. brakes gently; a tempo drives off again at the first speed.", "cue": {"p": 65, "r": "remember"}, "mk": [{"k": "hi", "t": 11.81, "e": 13.88, "p": 65, "r": [[0.1466, 0.3522, 0.1793, 0.0243]]}, {"k": "hi", "t": 13.88, "e": 18.72, "p": 65, "r": [[0.3658, 0.3522, 0.4493, 0.0243], [0.1009, 0.3788, 0.0796, 0.0243]]}], "sp": [[11.22, 0, 10], [11.81, 10, 15], [11.81, 15, 30], [13.88, 30, 74]]}]}, {"t": "Slowing down", "f": "audio/E6/k001-slowing-down.mp3?v=1795579333", "s": 28, "p": 65, "l": [{"t0": 0.2, "t1": 9.71, "who": "B", "text": "Ritardando, or rallentando, written rit. or rall.: gradually slower. The beats move further apart.", "cue": {"p": 65, "r": "table"}, "lens": {"k": "pop", "src": "pops/E6-rit-0.webp?v=1795579333"}, "sp": [[0.2, 0, 41], [0.91, 41, 51], [2.54, 51, 69], [3.2, 69, 98]]}, {"t0": 9.71, "t1": 13.82, "who": "B", "text": "Here it is in a tune: slow down into the end.", "cue": {"p": 66, "r": "picture"}, "lens": {"k": "pop",
