17]]}], "lens": {"k": "pop", "src": "pops/E6-more.webp?v=1795579333"}}, {"t0": 12.25, "t1": 20.91, "who": "B", "text": "Tempo primo: back to the first speed. And l’istesso tempo: the same speed, even when the time signature changes.", "cue": {"p": 141, "r": "body"}, "sp": [[12.25, 0, 13], [13.22, 13, 38], [15.04, 38, 59], [15.87, 59, 112]], "mk": [{"k": "hi", "t": 12.25, "e": 15.5, "pop": "E6-more", "r": [[0.0145, 0.383, 0.971, 0.1193]]}, {"k": "hi", "t": 15.5, "e": 20.91, "pop": "E6-more", "r": [[0.0145, 0.5046, 0.971, 0.1193]]}], "lens": {"k": "pop", "src": "pops/E6-more.webp?v=1795579333"}}, {"t0": 20.91, "t1": 29.71, "who": "B", "text": "And the little words: assai, very. Sempre, always. Non troppo, not too much. Quasi, almost. Come prima, as at first.", "cue": {"p": 141, "r": "body"}, "sp": [[20.91, 0, 22], [22.08, 22, 35], [23.43, 35, 51], [24.35, 51, 77], [26.18, 77, 92], [27.34, 92, 116]], "mk": [{"k": "hi", "t": 22.58, "e": 23.57, "pop": "E6-more", "r": [[0.0145, 0.6261, 0.971, 0.0665]]}, {"k": "hi", "t": 23.57, "e": 24.78, "pop": "E6-more", "r": [[0.0145, 0.695, 0.971, 0.0665]]}, {"k": "hi", "t": 24.78, "e": 26.75, "pop": "E6-more", "r": [[0.0145, 0.7638, 0.971, 0.0665]]}, {"k": "hi", "t": 26.75, "e": 27.89, "pop": "E6-more", "r": [[0.0145, 0.8326, 0.971, 0.0665]]}, {"k": "hi", "t": 27.89, "e": 29.71, "pop": "E6-more", "r": [[0.0145, 0.9014, 0.971, 0.0665]]}], "lens": {"k": "pop", "src": "pops/E6-more.webp?v=1795579333"}}, {"t0": 29.71, "t1": 34.19, "who": "P", "text": "Allegro, ma non troppo. Quick, but not too quick.", "cue": {"p": 141, "r": "body"}, "sp": [[29.71, 0, 24], [31.4, 24, 49]], "mk": [{"k": "hi", "t": 30.53, "e": 34.19, "pop": "E6-more", "r": [[0.0145, 0.7638, 0.971, 0.0665]]}], "lens": {"k": "pop", "src": "pops/E6-more.webp?v=1795579333"}}, {"t0": 34.19, "t1": 36.55, "who": "B", "text": "You are fluent already.", "cue": {"p": 141, "r": "body"}, "lens": {"k": "pop", "src": "pops/E6-more.webp?v=1795579333"}}]}, {"t": "Example: where does it slow down?", "f": "audio/E6/02-example-where-does-it-slow-down.mp3?v=1795579333", "s": 22, "p": 65, "l": [{"t0": 0.2, "t1": 8.32, "who": "B", "text": "Find rall., and then a tempo. Which notes slow down, and when does the speed come back? Pause.", "cue": {"p": 65, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E6-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 10], [1.21, 10, 30], [3.57, 30, 88], [6.96, 88, 94]]}, {"t0": 8.32, "t1": 12.32, "who": "pause", "text": "Pause and try.", "cue": {"p": 65, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E6-1-q.webp?v=1795579333"}}, {"t0": 12.32, "t1": 20.04, "who": "P", "text": "Bar one slows into the two Gs; at a tempo, in bar three, the first speed comes straight back.", "cue": {"p": 65, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E6-1.webp?v=1795579333"}, "sp": [[12.32, 0, 31], [13.61, 31, 93]], "mk": [{"k": "hi", "t": 12.42, "e": 20.34, "p": 65, "r": [[0.0114, 0.8717, 0.84, 0.0962]], "pop": "E6-1"}]}, {"t0": 20.04, "t1": 21.63, "who": "B", "text": "Perfect.", "cue": {"p": 65, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E6-1.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 20.04, "e": 21.83, "p": 65, "r": [[0.0114, 0.8717, 0.84, 0.0962]], "pop": "E6-1"}]}]}, {"t": "Example: the fermata", "f": "audio/E6/03-example-the-fermata.mp3?v=1795579333", "s": 17, "p": 65, "l": [{"t0": 0.2, "t1": 6.34, "who": "B", "text": "A minim with a fermata. How long do you hold it? Pause.", "cue": {"p": 65, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E6-2-q.webp?v=1795579333"}, "sp": [[0.2, 0, 24], [3.38, 24, 49], [4.91, 49, 55]]}, {"t0": 6.34, "t1": 9.34, "who": "pause", "text": "Pause and try.", "cue": {"p": 65, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E6-2-q.webp?v=1795579333"}}, {"t0": 9.34, "t1": 14.46, "who": "P", "text": "Longer than two beats: until it feels finished, often half as long again, then go on.", "cue": {"p": 65, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E6-2.webp?v=1795579333"}, "sp": [[9.34, 0, 23], [10.71, 23, 85]], "mk": [{"k": "hi", "t": 9.44, "e": 14.76, "p": 65, "r": [[0.0116, 0.8784, 0.9603, 0.0919]], "pop": "E6-2"}]}, {"t0": 14.46, "t1": 16.64, "who": "B", "text": "Very good, Clara.", "cue": {"p": 65, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E6-2.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 14.46, "e": 16.84, "p": 65, "r": [[0.0116, 0.8784, 0.9603, 0.0919]], "pop": "E6-2"}]}]}, {"t": "Try it: Twinkle", "f": "audio/E6/04-try-it-twinkle.mp3?v=1795579333", "s": 24, "p": 65, "l": [{"t0": 0.2, "t1": 11.36, "who": "B", "text": "Sing the last line of Twinkle twice: once in time, once slowing into the last note, with a fermata on the final C. Until next time.", "cue": {"p": 65, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E6-3.webp?v=1795579333"}, "sp": [[0.2, 0, 37], [2.56, 37, 115], [9.4, 115, 131]]}, {"t0": 11.36, "t1": 23.94, "who": "piano", "notes": [11.36, 11.98, 12.6, 13.22, 13.84, 14.46, 15.08, 16.32, 16.94, 17.56, 18.3, 19.11, 20.04, 21.16], "cue": {"p": 65, "r": "pop3"}, "lens": {"k": "pop", "src": "pops/E6-3.webp?v=1795579333"}, "mk": [{"k": "nt", "t": 11.36, "e": 23.74, "p": 65, "r": [[0.0739, 0.5678, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 11.98, "e": 23.74, "p": 65, "r": [[0.134, 0.5678, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 12.6, "e": 23.74, "p": 65, "r": [[0.1941, 0.5847, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 13.22, "e": 23.74, "p": 65, "r": [[0.2532, 0.5847, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 13.84, "e": 23.74, "p": 65, "r": [[0.3216, 0.6017, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 14.46, "e": 23.74, "p": 65, "r": [[0.3808, 0.6017, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 15.08, "e": 23.74, "p": 65, "r": [[0.4409, 0.6186, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 16.32, "e": 23.74, "p": 65, "r": [[0.0739, 0.5678, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 16.94, "e": 23.74, "p": 65, "r": [[0.134, 0.5678, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 17.56, "e": 23.74, "p": 65, "r": [[0.1941, 0.5847, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 18.3, "e": 23.74, "p": 65, "r": [[0.2532, 0.5847, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 19.11, "e": 23.74, "p": 65, "r": [[0.3216, 0.6017, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 20.04, "e": 23.74, "p": 65, "r": [[0.3808, 0.6017, 0.0092, 0.0339]], "pop": "E6-3"}, {"k": "nt", "t": 21.16, "e": 23.74, "p": 65, "r": [[0.4409, 0.6186, 0.0092, 0.0339]], "pop": "E6-3"}]}]}], "nx": {"wb": [null, "p. 63", "Expression"], "dr": [["terms", "Changing speed", 3]]}}, {"k": "E7", "part": "Part IV · Expression", "t": "7 · Mood words", "pages": [67, 141], "clips": [{"t": "Mood words", "f": "audio/E7/k001-mood-words.mp3?v=1795579333", "s": 17, "p": 67, "l": [{"t0": 3.4, "t1": 8.9, "who": "B", "text": "Some words describe the mood, Clara, not the speed: how the music should feel.", "cue": {"p": 67, "r": "lead"}, "lens": {"k": "pop", "src": "pops/E7-all.webp?v=1795579333"}, "sp": [[3.4, 0, 52], [6.83, 52, 78]]}, {"t0": 8.9, "t1": 12.18, "who": "H", "text": "My menu! Not how fast, but how it tastes.", "cue": {"p": 67, "r": "lead"}, "lens": {"k": "pop", "src": "pops/E7-all.webp?v=1795579333"}, "sp": [[8.9, 0, 9], [9.46, 9, 41]]}, {"t0": 12.18, "t1": 17.17, "who": "B", "text": "Remember: speed words say how fast; mood words say how it feels.", "cue": {"p": 67, "r": "remember"}, "mk": [{"k": "hi", "t": 12.69, "e": 14.71, "p": 67, "r": [[0.1009, 0.2766, 0.3422, 0.0243]]}, {"k": "hi", "t": 14.71, "e": 17.57, "p": 67, "r": [[0.4588, 0.2766, 0.3758, 0.0243]]}], "sp": [[12.18, 0, 10], [12.69, 10, 36], [14.71, 36, 64]]}]}, {"t": "Sweet and singing", "f": "audio/E7/k002-sweet-and-singing.mp3?v=1795579333", "s": 16, "p": 67, "l": [{"t0": 0.2, "t1": 8.86, "who": "B", "text": "Dolce: sweetly. Cantabile: in a singing style. Legato: smoothly.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-0.webp?v=1795579333"}, "sp": [[0.2, 0, 7], [1.32, 7, 16], [2.73, 16, 27], [2.73, 27, 47], [5.95, 47, 55], [7.19, 55, 64]]}, {"t0": 8.86, "t1": 12.1, "who": "P", "text": "Dolce sounds like pudding.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-0.webp?v=1795579333"}}, {"t0": 12.1, "t1": 15.76, "who": "B", "text": "It is Italian for sweet, so you are not far wrong.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-0.webp?v=1795579333"}}]}, {"t": "Calm and simple", "f": "audio/E7/k003-calm-and-simple.mp3?v=1795579333", "s": 14, "p": 67, "l": [{"t0": 0.2, "t1": 8.79, "who": "B", "text": "Tranquillo: calmly. Semplice: simply, with no fuss. Sostenuto: sustained, holding the sound.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-1.webp?v=1795579333"}, "sp": [[0.2, 0, 12], [0.2, 12, 20], [0.53, 20, 30], [0.53, 30, 52], [2.46, 52, 63], [2.46, 63, 92]]}, {"t0": 8.79, "t1": 11.31, "who": "P", "text": "Semplice is my kind of word.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-1.webp?v=1795579333"}}, {"t0": 11.31, "t1": 13.65, "who": "H", "text": "A cup of tea. No fuss.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-1.webp?v=1795579333"}, "sp": [[11.31, 0, 14], [12.01, 14, 22]]}]}, {"t": "Light and playful", "f": "audio/E7/k004-light-and-playful.mp3?v=1795579333", "s": 17, "p": 67, "l": [{"t0": 0.2, "t1": 11.23, "who": "B", "text": "Leggiero: lightly. Grazioso: gracefully. Giocoso: playfully. Scherzando: jokingly. A scherzo is a musical joke.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-2.webp?v=1795579333"}, "sp": [[0.2, 0, 10], [0.2, 10, 19], [1.66, 19, 29], [1.66, 29, 41], [2.8, 41, 50], [2.8, 50, 61], [4.17, 61, 73], [4.17, 73, 83], [5.06, 83, 111]]}, {"t0": 11.23, "t1": 13.74, "who": "P", "text": "So the music is allowed to laugh.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-2.webp?v=1795579333"}}, {"t0": 13.74, "t1": 16.83, "who": "B", "text": "Quietly, Clara. It is still music.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-2.webp?v=1795579333"}, "sp": [[13.74, 0, 16], [14.96, 16, 34]]}]}, {"t": "Strong and moving", "f": "audio/E7/k005-strong-and-moving.mp3?v=1795579333", "s": 25, "p": 67, "l": [{"t0": 0.2, "t1": 10.78, "who": "B", "text": "Maestoso: majestically, like a king walking in. Espressivo: with feeling. Con moto: with movement.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-3.webp?v=1795579333"}, "sp": [[0.2, 0, 10], [0.2, 10, 48], [4.72, 48, 60], [4.72, 60, 74], [6.67, 74, 84], [8.92, 84, 98]]}, {"t0": 10.78, "t1": 15.68, "who": "K", "text": "Maestoso. At last, a word that understands me.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-3.webp?v=1795579333"}, "sp": [[10.78, 0, 10], [10.78, 10, 46]]}, {"t0": 15.68, "t1": 22.31, "who": "B", "text": "Animato: lively. Con brio: with spirit. Agitato: agitated and restless.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-3.webp?v=1795579333"}, "sp": [[15.68, 0, 9], [15.68, 9, 17], [17.3, 17, 27], [18.07, 27, 40], [19.2, 40, 49], [19.2, 49, 71]]}, {"t0": 22.31, "t1": 25.47, "who": "H", "text": "Agitato: my pot when the guests are late.", "cue": {"p": 67, "r": "table"}, "lens": {"k": "pop", "src": "pops/E7-3.webp?v=1795579333"}, "sp": [[22.31, 0, 9], [22.31, 9, 41]]}]}, {"t": "Many more", "f": "audio/E7/s06-many-more.mp3?v=1795579333", "s": 10, "p": 67, "l": [{"t0": 0.2, "t1": 9.99, "who": "B", "text": "Many more appear in real pieces. In an exam you may be asked about any word in your own pieces, so look up each new one as you meet it.", "cue": {"p": 67, "r": "table"}, "mk": [{"k": "hi", "t": 0.2, "e": 2.69, "p": 67, "r": [null]}], "sp": [[0.2, 0, 33], [2.69, 33, 135]]}]}, {"t": "Still more mood words", "f": "audio/E7/m01-still-more-mood-words.mp3?v=1795579333", "s": 40, "p": 67, "l": [{"t0": 0.2, "t1": 5.74, "who": "B", "text": "Still more mood words, all in the Glossary from page one hundred and forty-one.", "cue": {"p": 67, "r": "table"}}, {"t0": 5.74, "t1": 17.39, "who": "B", "text": "Heavy and strong: pesante, heavily. Risoluto, boldly. Deciso, firmly. Energico, with energy. Con fuoco, with fire. Alla marcia, like a march.", "cue": {"p": 141, "r": "body"}, "sp": [[5.74, 0, 18], [6.84, 18, 36], [7.65, 36, 54], [8.49, 54, 70], [8.76, 70, 93], [10.25, 93, 115], [12.2, 115, 141]], "mk": [{"k": "hi", "t": 7.23, "e": 8.71, "pop": "E7-more", "r": [[0.0145, 0.0575, 0.971, 0.0521]]}, {"k": "hi", "t": 8.71, "e": 10.2, "pop": "E7-more", "r": [[0.0145, 0.1113, 0.971, 0.0521]]}, {"k": "hi", "t": 10.2, "e": 11.52, "pop": "E7-more", "r": [[0.0145, 0.1652, 0.971, 0.0521]]}, {"k": "hi", "t": 11.52, "e": 13.42, "pop": "E7-more", "r": [[0.0145, 0.219, 0.971, 0.0521]]}, {"k": "hi", "t": 13.42, "e": 15.24, "pop": "E7-more", "r": [[0.0145, 0.2729, 0.971, 0.0521]]}, {"k": "hi", "t": 15.24, "e": 17.39, "pop": "E7-more", "r": [[0.0145, 0.3268, 0.971, 0.0539]]}], "lens": {"k": "pop", "src": "pops/E7-more.webp?v=1795579333"}}, {"t0": 17.39, "t1": 20.1, "who": "K", "text": "Con fuoco. I approve.", "cue": {"p": 141, "r": "body"}, "sp": [[17.39, 0, 11], [18.57, 11, 21]], "mk": [{"k": "hi", "t": 17.39, "e": 20.1, "pop": "E7-more", "r": [[0.0145, 0.2729, 0.971, 0.0521]]}], "lens": {"k": "pop", "src": "pops/E7-more.webp?v=1795579333"}}, {"t0": 20.1, "t1": 25.51, "who": "B", "text": "Sad: mesto, sadly. Lamentoso, mournfully. Dolente, sorrowfully.", "cue": {"p": 141, "r": "body"}, "sp": [[20.25, 0, 5], [20.7, 5, 19], [21.75, 19, 42], [23.49, 42, 63]], "mk": [{"k": "hi", "t": 20.53, "e": 21.73, "pop": "E7-more", "r": [[0.0145, 0.3824, 0.971, 0.0521]]}, {"k": "hi", "t": 21.73, "e": 23.71, "pop": "E7-more", "r": [[0.0145, 0.4363, 0.971, 0.0521]]}, {"k": "hi", "t": 23.71, "e": 25.51, "pop": "E7-more", "r": [[0.0145, 0.4901, 0.971, 0.0521]]}], "lens": {"k": "pop", "src": "pops/E7-more.webp?v=1795579333"}}, {"t0": 25.51, "t1": 37.03, "who": "B", "text": "Warm and tender: affettuoso, te "s": 28, "p": 67, "l": [{"t0": 0.2, "t1": 4.7, "who": "B", "text": "Here is one little tune, played dolce.", "cue": {"p": 67, "r": "table"}}, {"t0": 4.7, "t1": 8.72, "who": "piano", "notes": [4.7, 5.32, 5.94, 6.56, 7.18], "cue": {"p": 67, "r": "table"}, "mk": [{"k": "blk", "t": 4.7, "e": 8.72, "p": 67, "r": [[0.073, 0.3722, 0.855, 0.0328]]}]}, {"t0": 8.72, "t1": 11.86, "who": "B", "text": "And now maestoso.", "cue": {"p": 67, "r": "table"}}, {"t0": 11.86, "t1": 15.88, "who": "piano", "notes": [11.86, 12.48, 13.1, 13.72, 14.34], "cue": {"p": 67, "r": "table"}, "mk": [{"k": "blk", "t": 11.86, "e": 15.88, "p": 67, "r": [[0.073, 0.4668, 0.855, 0.0328]]}]}, {"t0": 15.88, "t1": 27.75, "who": "B", "text": "Play a tune of your own three ways: dolce, maestoso and cantabile. Can someone guess which is which? Until next time.", "cue": {"p": 67, "r": "table"}, "sp": [[15.88, 0, 36], [18.95, 36, 67], [20.27, 67, 101], [23.83, 101, 117]]}]}], "nx": {"wb": [null, "p. 64", "Expression"], "dr": [["terms", "Touch and character", 6]]}}, {"k": "E8", "part": "Part IV · Expression", "t": "8 · The pedals", "pages": [68, 69], "clips": [{"t": "The pedals", "f": "audio/E8/s01-the-pedals.mp3?v=1795579333", "s": 14, "p": 68, "l": [{"t0": 3.4, "t1": 6.36, "who": "P", "text": "I thought the pedals were for driving the piano.", "cue": {"p": 68, "r": "lead"}}, {"t0": 6.36, "t1": 8.98, "who": "B", "text": "Sadly, it doesn’t go anywhere.", "cue": {"p": 68, "r": "lead"}}, {"t0": 8.98, "t1": 13.73, "who": "B", "text": "Most pianos have three pedals, Clara: left, middle and right.", "cue": {"p": 68, "r": "picture"}, "mk": [{"k": "blk", "t": 8.98, "e": 13.73, "r": [[0.2821, 0.285, 0.4333, 0.1246]], "p": 68}], "sp": [[8.98, 0, 38], [11.53, 38, 61]]}]}, {"t": "The sustain pedal", "f": "audio/E8/k001-the-sustain-pedal.mp3?v=1795579333", "s": 38, "p": 68, "l": [{"t0": 0.2, "t1": 9.48, "who": "B", "text": "The right one is the sustain pedal. Every string has a felt damper resting on it. Let go of a key, and its damper stops the string.", "cue": {"p": 68, "r": "h:What the sustain pedal does"}, "lens": {"k": "pop", "src": "pops/E8-off-0.webp?v=1795579333"}, "sp": [[0.2, 0, 36], [2.56, 36, 82], [5.57, 82, 131]]}, {"t0": 9.48, "t1": 12.26, "who": "piano", "notes": [9.48, 10.1, 10.72, 11.34], "cue": {"p": 68, "r": "h:What the sustain pedal does"}, "lens": {"k": "pop", "src": "pops/E8-off.webp?v=1795579333"}}, {"t0": 12.26, "t1": 17.31, "who": "H", "text": "In my kitchen the right pedal is a lid. Lid on, and the sound stays in the pot.", "cue": {"p": 68, "r": "h:What the sustain pedal does"}, "lens": {"k": "pop", "src": "pops/E8-on-0.webp?v=1795579333"}, "sp": [[12.26, 0, 40], [14.34, 40, 79]]}, {"t0": 17.31, "t1": 24.81, "who": "B", "text": "Press the sustain pedal, and every damper lifts at once. The strings ring on after your fingers let go.", "cue": {"p": 68, "r": "h:What the sustain pedal does"}, "lens": {"k": "pop", "src": "pops/E8-on-0.webp?v=1795579333"}, "sp": [[17.31, 0, 57], [21.2, 57, 103]]}, {"t0": 24.81, "t1": 31.65, "who": "piano", "notes": [24.81, 25.43, 26.05, 26.67, 27.29, 27.91, 29.77], "cue": {"p": 68, "r": "h:What the sustain pedal does"}, "lens": {"k": "pop", "src": "pops/E8-on.webp?v=1795579333"}}, {"t0": 31.65, "t1": 36.17, "who": "P", "text": "The sound keeps going after my hands stop. Like a ghost clapping back.", "cue": {"p": 68, "r": "h:What the sustain pedal does"}, "lens": {"k": "pop", "src": "pops/E8-on.webp?v=1795579333"}, "sp": [[31.65, 0, 43], [34.1, 43, 70]]}, {"t0": 36.17, "t1": 38.43, "who": "B", "text": "A very musical ghost.", "cue": {"p": 68, "r": "h:What the sustain pedal does"}, "lens": {"k": "pop", "src": "pops/E8-on.webp?v=1795579333"}}]}, {"t": "The soft pedal", "f": "audio/E8/k002-the-soft-pedal.mp3?v=1795579333", "s": 29, "p": 68, "l": [{"t0": 0.2, "t1": 13.49, "who": "B", "text": "The left one is the soft pedal: una corda, written u.c. It makes the sound softer and gentler. To let it up, the music says tre corde, or t.c.", "cue": {"p": 68, "r": "table"}, "lens": {"k": "pop", "src": "pops/E8-uc-0.webp?v=1795579333"}, "sp": [[0.2, 0, 32], [2.76, 32, 53], [4.61, 53, 56], [5.36, 56, 95], [7.9, 95, 140], [12.01, 140, 142]]}, {"t0": 13.49, "t1": 17.76, "who": "H", "text": "And the left pedal is a tea towel over the pot. Softer. Gentler.", "cue": {"p": 68, "r": "table"}, "lens": {"k": "pop", "src": "pops/E8-uc-0.webp?v=1795579333"}, "sp": [[13.5, 0, 48], [15.66, 48, 56], [16.14, 56, 64]]}, {"t0": 17.76, "t1": 23.02, "who": "piano", "notes": [17.76, 18.38, 19.0, 19.62, 20.49, 21.11, 21.73, 22.35], "cue": {"p": 68, "r": "table"}, "lens": {"k": "pop", "src": "pops/E8-uc.webp?v=1795579333"}}, {"t0": 23.02, "t1": 29.09, "who": "B", "text": "The middle pedal, on grand pianos, holds only some notes. That one comes later.", "cue": {"p": 68, "r": "table"}, "mk": [{"k": "hi", "t": 23.02, "e": 27.14, "p": 68, "r": [[0.0831, 0.7429, 0.248, 0.016], [0.5442, 0.7338, 0.1663, 0.016]]}], "sp": [[23.02, 0, 58], [27.14, 58, 79]]}]}, {"t": "Changing the pedal", "f": "audio/E8/s04-changing-the-pedal.mp3?v=1795579333", "s": 31, "p": 68, "l": [{"t0": 0.2, "t1": 11.35, "who": "B", "text": "Heel on the floor, press with the ball of your foot. Now the important part: play the new notes first, then change the pedal straight away. Up, and straight down again.", "cue": {"p": 68, "r": "rule"}, "mk": [{"k": "hi", "t": 0.2, "e": 3.4, "p": 68, "r": [[0.0945, 0.8849, 0.495, 0.0187]]}, {"k": "hi", "t": 5.04, "e": 8.98, "p": 68, "r": [[0.6016, 0.8849, 0.2639, 0.0187], [0.0945, 0.9054, 0.3957, 0.0187]]}, {"k": "hi", "t": 8.98, "e": 11.75, "p": 68, "r": [[0.2139, 0.9054, 0.2763, 0.0187]]}], "sp": [[0.2, 0, 53], [3.4, 53, 77], [5.04, 77, 140], [8.98, 140, 168]]}, {"t0": 11.35, "t1": 16.02, "who": "B", "text": "Each notch on the pedal line comes just after the new chord.", "cue": {"p": 69, "r": "h:Changing the pedal"}, "mk": [{"k": "blk", "t": 11.35, "e": 16.02, "r": [[0.1889, 0.1514, 0.7179, 0.1157]], "p": 69}]}, {"t0": 16.02, "t1": .32, "lens": {"k": "pop", "src": "pops/E8-1-q.webp?v=1795579333"}, "t1": 11.54}, {"who": "B", "text": "Not quite, Clara. The soft pedal is the left one, written u.c. Ped. is the right one, and it keeps the notes ringing.", "cue": {"p": 68, "r": "pop1"}, "t0": 11.54, "lens": {"k": "pop", "src": "pops/E8-1-q.webp?v=1795579333"}, "t1": 19.62}, {"t0": 19.62, "t1": 25.05, "who": "P", "text": "Ped. is the right pedal. U.c. is the left one. And t.c. means let the left pedal up.", "cue": {"p": 68, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E8-1.webp?v=1795579333"}, "sp": [[19.79, 0, 5], [19.79, 5, 25], [21.12, 25, 27], [21.29, 27, 30], [21.7, 30, 47], [22.35, 47, 53], [22.71, 53, 56], [23.0, 56, 84]], "mk": [{"k": "hi", "t": 19.72, "e": 25.35, "p": 68, "r": [[0.0122, 0.8919, 0.7721, 0.0835]], "pop": "E8-1"}]}, {"t0": 25.05, "t1": 26.77, "who": "B", "text": "Precisely.", "cue": {"p": 68, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/E8-1.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 25.05, "e": 26.97, "p": 68, "r": [[0.0122, 0.8919, 0.7721, 0.0835]], "pop": "E8-1"}]}]}, {"t": "Example: down and up", "f": "audio/E8/04-example-down-and-up.mp3?v=1795579333", "s": 18, "p": 68, "l": [{"t0": 0.2, "t1": 6.1, "who": "B", "text": "Find Ped. under the first C, then a star with Ped., then the last star. Pause.", "cue": {"p": 68, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E8-2-q.webp?v=1795579333"}, "sp": [[0.2, 0, 10], [1.12, 10, 50], [2.71, 50, 72], [4.79, 72, 78]]}, {"t0": 6.1, "t1": 10.1, "who": "pause", "text": "Pause and try.", "cue": {"p": 68, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E8-2-q.webp?v=1795579333"}}, {"t0": 10.1, "t1": 16.54, "who": "P", "text": "Down on the first C, changed at the F, up and straight down, and up at the end. Each bar rings as one sound.", "cue": {"p": 68, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/E8-2.webp?v=1795579333"}, "sp": [[10.1, 0, 80], [14.21, 80, 108]], "mk": [{"k": "hi", "t": 10.2, "e": 16.84, "p": 68, "r": [[0.0104, E and the note below is C.", "cue": {"p": 70, "r": "lead"}, "mk": [{"k": "hi", "t": 11.03, "e": 14.68, "p": 70, "r": [[0.2281, 0.1599, 0.5289, 0.0193]]}, {"k": "hi", "t": 14.68, "e": 19.39, "p": 70, "r": [[0.7969, 0.1599, 0.1024, 0.0193], [0.073, 0.1826, 0.3235, 0.0193]]}, {"k": "key", "t": 14.86, "e": 19.39, "p": 70, "r": [[0.4599, 0.7365, 0.0803, 0.1419]], "n": "D"}, {"k": "key", "t": 16.37, "e": 19.39, "p": 70, "r": [[0.5401, 0.7365, 0.0803, 0.1419]], "n": "E"}, {"k": "key", "t": 17.78, "e": 19.39, "p": 70, "r": [[0.3796, 0.7365, 0.0803, 0.1419]], "n": "C"}], "sp": [[11.03, 0, 56], [14.68, 56, 106]]}, {"t0": 18.99, "t1": 27.32, "who": "B", "text": "Remember: an ornament is a necklace on the note. It borrows the next-door notes, and the main note still lands on time.", "cue": {"p": 70, "r": "remember"}, "mk": [{"k": "hi", "t": 19.58, "e": 22.17, "p": 70, "r": [[0.13, 0.2375, 0.3687, 0.0193]]}, {"k": "hi", "t": 22.17, "e": 27.72, "p": 70, "r": [[0.5334, 0.2375, 0.3448, 0.0193], [0.0951, 0.2586, 0.3432, 0.0193]]}], "sp": [[18.99, 0, 10], [19.58, 10, 49], [22.17, 49, 119]]}, {"t0": 27.32, "t1": 36.23, "who": "B", "text": "And wear it lightly. Jewellery should make the person shine, not take over. Play the ornament lightly, so the main note stays the star.", "cue": {"p": 70, "r": "remember"}, "mk": [{"k": "hi", "t": 31.96, "e": 36.63, "p": 70, "r": [[0.13, 0.2375, 0.7482, 0.0193], [0.0951, 0.2586, 0.0916, 0.0193]]}], "sp": [[27.32, 0, 21], [28.68, 21, 76], [31.96, 76, 135]]}, {"t0": 36.23, "t1": 38.66, "who": "P", "text": "So no clanking bracelets.", "cue": {"p": 70, "r": "remember"}}, {"t0": 38.66, "t1": 42.28, "who": "B", "text": "Precisely. Nobody remembers the bracelets.", "cue": {"p": 70, "r": "remember"}, "sp": [[38.66, 0, 11], [39.66, 11, 42]]}]}, {"t": "Trill", "f": "audio/E9/k001-trill.mp3?v=1795579333", "s": 16, "p": 71, "l": [{"t0": 0.2, "t1": 5.76, "who": "B", "text": "A trill: the note and the one above, back and forth, as quickly as it will go.", "cue": .52, "p": 70, "r": [[0.0951, 0.4779, 0.0103, 0.0331]], "pop": "E9-4"}, {"k": "nt", "t": 15.01, "e": 16.52, "p": 70, "r": [[0.1603, 0.5441, 0.0103, 0.0331]], "pop": "E9-4"}, {"k": "nt", "t": 15.32, "e": 16.52, "p": 70, "r": [[0.2022, 0.5294, 0.0103, 0.0331]], "pop": "E9-4"}, {"k": "nt", "t": 15.63, "e": 16.52, "p": 70, "r": [[0.2451, 0.511, 0.0103, 0.0331]], "pop": "E9-4"}, {"k": "nt", "t": 15.94, "e": 16.52, "p": 70, "r": [[0.288, 0.4926, 0.0103, 0.0331]], "pop": "E9-4"}]}]}], "nx": {"wb": [null, "pp. 67–68", "Expression"], "dr": [["hb-ornaments", "Ornaments", 0]]}}, {"k": "E10", "part": "Part IV · Expression", "t": "10 · Grace notes", "pages": [73], "clips": [{"t": "Grace notes", "f": "audio/E10/s01-grace-notes.mp3?v=1795579333", "s": 19, "p": 73, "l": [{"t0": 3.4, "t1": 12.18, "who": "B", "text": "Some notes come with a tiny note just before them, Clara. It borrows a moment from the main note, and a slash tells you how much.", "cue": {"p": 73, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 7.27, "p": 73, "r": [[0.073, 0.1726, 0.5368, 0.0243]]}, {"k": "hi", "t": 7.27, "e": 12.58, "p": 73, "r": [[0.7176, 0.1726, 0.1156, 0.0243], [0.073, 0.2013, 0.7126, 0.0243]]}], "sp": [[3.4, 0, 58], [7.27, 58, 129]]}, {"t0": 12.18, "t1": 19.43, "who": "B", "text": "Remember: slash, crushed in, as fast as you can. No slash, it leans, taking about half the time.", "cue": {"p": 73, "r": "remember"}, "mk": [{"k": "hi", "t": 12.6, "e": 15.73, "p": 73, "r": [[0.1009, 0.2851, 0.0728, 0.0243]]}, {"k": "hi", "t": 13.37, "e": 15.73, "p": 73, "r": [[0.1893, 0.2851, 0.1036, 0.0243]]}, {"k": "hi", "t": 14.04, "e": 15.73, "p": 73, "r": [[0.3813, 0.2851, 0.1991, 0.0243]]}, {"k": "hi", "t": 15.73, "e": 19.83, "p": 73, "r": [[0.1009, 0.2851, 0.0728, 0.0243]]}, {"k": "hi", "t": 16.45, "e": 19.83, "p": 73, "r": [[0.7547, 0.2851, 0.0707, 0.0243]]}, {"k": "hi", "t": 17.22, "e": 19.83, "p": 73, "r": [[0.1009, 0.3117, 0.3444, 0.0243]]}], "sp": [[12.18, 0, 10], [12.6, 10, 49], [15.73, 49, 96]]}]}, {"t": "Acciaccatura", "f": "audio/E10/k001-acciaccatura.mp3?v=1795579333", "s": 24, "p": 73, "l": [{"t0": 0.2, "t1": 6.88, "who": "B", "text": "With a slash it is an acciaccatura: crushed in, just before the beat.", "cue": {"p": 73, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E10-acc-0.webp?v=1795579333"}, "sp": [[0.2, 0, 36], [2.28, 36, 69]]}, {"t0": 6.88, "t1": 9.66, "who": "piano", "notes": [6.88, 7.5, 8.04, 8.12, 8.74], "cue": {"p": 73, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E10-acc.webp?v=1795579333"}}, {"t0": 9.66, "t1": 19.55, "who": "B", "text": "Think of a queue. The tiny note tries to push in front, and the main note flicks it straight out of the way. It keeps its own place, right on the beat.", "cue": {"p": 73, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E10-acc.webp?v=1795579333"}, "sp": [[9.66, 0, 18], [10.86, 18, 109], [16.18, 109, 151]]}, {"t0": 19.55, "t1": 21.64, "who": "P", "text": "Not today, thank you!", "cue": {"p": 73, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E10-acc.webp?v=1795579333"}}, {"t0": 21.64, "t1": 24.3, "who": "H", "text": "No pushing in at my counter!", "cue": {"p": 73, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E10-acc.webp?v=1795579333"}}]}, {"t": "Appoggiatura", "f": "audio/E10/k002-appoggiatura.mp3?v=1795579333", "s": 24, "p": 73, "l": [{"t0": 0.2, "t1": 7.36, "who": "B", "text": "Without a slash it is an appoggiatura: it falls on the beat and leans.", "cue": {"p": 73, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E10-app-0.webp?v=1795579333"}, "sp": [[0.2, 0, 39], [2.91, 39, 70]]}, {"t0": 7.36, "t1": 10.14, "who": "piano", "notes": [7.36, 7.98, 8.6, 8.91, 9.22], "cue": {"p": 73, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E10-app.webp?v=1795579333"}}, {"t0": 10.14, "t1": 19.33, "who": "B", "text": "This time the one pushing in wins. It takes the main note’s place on the beat, and half its time as well. The main note has to wait.", "cue": {"p": 73, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E10-app.webp?v=1795579333"}, "sp": [[10.14, 0, 35], [12.47, 35, 106], [16.98, 106, 132]]}, {"t0": 19.33, "t1": 20.95, "who": "P", "text": "How rude.", "cue": {"p": 73, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E10-app.webp?v=1795579333"}}, {"t0": 20.95, "t1": 23.61, "who": "B", "text": "Very. But it does sound lovely.", "cue": {"p": 73, "r": "picture"}, "lens": {"k": "pop", "src": "pops/E10-app.webp?v=1795579333"}, "sp": [[20.95, 0, 6], [21.42, 6, 31]]}]}, {"t": "One trap", "f": "audio/E10/s04-one-trap.mp3?v=1795579333", "s": 15, "p": 73, "l": [{"t0": 0.2, "t1": 7.89, "who": "B", "text": "One trap: an acciaccatura is never slow. It is crushed in, almost at once.", "cue": {"p": 73, "r": "trap"}, "mk": [{"k": "hi", "t": 2.77, "e": 8.29, "p": 73, "r": [[0.4985, 0.7082, 0.2837, 0.0208]]}], "sp": [[0.2, 0, 10], [1.06, 10, 41], [2.77, 41, 74]]}, {"t0": 7.89, "t1": 10.38, "who": "P", "text": "Those words are longer than the notes!", "cue": {"p": 73, "r": "trap"}}, {"t0": 10.38, "t1": 14.58, "who": "B", "text": "And that is the end of Part Four. Until next time.", "cue": {"p": 73, "r": "trap"}, "sp": [[10.38, 0, 34], [12.67, 34, 50]]}]}], "nx": {"wb": [null, "p. 69", "Expression"], "dr": [["hb-ornaments", "Ornaments", 0]]}}, {"k": "O5", "part": "Part V · Scales and keys", "t": "Part opener", "pages": [74], "clips": [{"t": "Part Five: Scales and keys", "f": "audio/O5/01-part-five-scales-and-keys.mp3?v=1795579333", "s": 47, "p": 74, "l": [{"t0": 3.4, "t1": 8.86, "who": "B", "text": "Welcome to Part Five, Clara: Scales and keys. Notes in families.", "cue": {"p": 74, "r": "opener"}, "mk": [{"k": "hi", "t": 5.39, "e": 6.95, "p": 74, "r": [[0.073, 0.2235, 0.481, 0.0641]]}], "sp": [[3.4, 0, 29], [5.39, 29, 46], [6.95, 46, 64]]}, {"t0": 8.86, "t1": 21.78, "who": "B", "text": "Notes travel in families, like ducklings behind their mother. We build the scales that pieces are made from, then learn to read the key a piece lives in. Here is G major, with its one sharp.", "cue": {"p": 74, "r": "opener"}, "sp": [[8.86, 0, 62], [12.72, 62, 154], [18.4, 154, 190]]}, {"t0": 21.78, "t1": 32.0, "who": "piano", "notes": [21.78, 22.4, 23.02, 23.64, 24.26, 24.88, 25.5, 26.12, 26.74, 27.36, 27.98, 28.6, 29.22, 29.84, 30.46], "cue": {"p": 74, "r": "opener"}}, {"t0": 32.0, "t1": 34.43, "who": "P", "text": "Up the stairs and down again!", "cue": {"p": 74, "r": "opener"}}, {"t0": 34.43, "t1": 45.84, "who": "B", "text": "Six chapters: major scales, minor scales, key signatures, the relative minor, finding the key, and the circle of fifths. Shall we begin with the major scale?", "cue": {"p": 74, "r": "chapters"}, "mk": [{"k": "hi", "t": 35.61, "e": 43.32, "p": 74, "r": [[0.0972, 0.324, 0.1112, 0.0178]]}, {"k": "hi", "t": 36.79, "e": 43.32, "p": 74, "r": [[0.1001, 0.3454, 0.1119, 0.0178]]}, {"k": "hi", "t": 37.81, "e": 43.32, "p": 74, "r": [[0.1006, 0.3668, 0.1303, 0.0178]]}, {"k": "hi", "t": 39.09, "e": 43.32, "p": 74, "r": [[0.1014, 0.3881, 0.1276, 0.0178]]}, {"k": "hi", "t": 40.33, "e": 43.32, "p": 74, "r": [[0.1008, 0.4095, 0.135, 0.0178]]}, {"k": "hi", "t": 41.68, "e": 43.32, "p": 74, "r": [[0.1396, 0.4309, 0.1222, 0.0178]]}], "sp": [[34.43, 0, 14], [35.61, 14, 121], [43.32, 121, 157]]}, {"t0": 45.84, "t1": 47.43, "who": "P", "text": "Let’s go!", "cue": {"p": 74, "r": "chapters"}}]}]}, {"k": "S1", "part": "Part V · Scales and keys", "t": "1 · Major scales", "pages": [75], "clips": [{"t": "Major scales", "f": "audio/S1/01-major-scales.mp3?v=1795579333", "s": 59, "p": 75, "l": [{"t0": 3.4, "t1": 11.31, "who": "B", "text": "A scale climbs from a home note, the key note, to the next note with the same name, using every letter once, Clara.", "cue": {"p": 75, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 11.71, "p": 75, "r": [[0.0924, 0.1372, 0.2942, 0.0193]]}, {"k": "hi", "t": 5.46, "e": 11.71, "p": 75, "r": [[0.4328, 0.1372, 0.086, 0.0193]]}, {"k": "hi", "t": 6.53, "e": 11.71, "p": 75, "r": [[0.5898, 0.1372, 0.2829, 0.0193]]}, {"k": t1": 9.38, "who": "B", "text": "Every key signature names a major key, Clara, and two quick rules find it.", "cue": {"p": 79, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 9.78, "p": 79, "r": [[0.1324, 0.1408, 0.3253, 0.0204]]}, {"k": "hi", "t": 7.06, "e": 9.78, "p": 79, "r": [[0.5118, 0.1408, 0.194, 0.0204]]}]}, {"t0": 9.38, "t1": 18.62, "who": "D", "text": "With sharps, the last one in holds the door for the key, just one key below it. With flats, the second-last one in is the key itself. Good manners.", "cue": {"p": 79, "r": "lead"}, "mk": [{"k": "hi", "t": 9.38, "e": 13.67, "p": 79, "r": [[0.297, 0.1677, 0.0606, 0.0233]]}, {"k": "hi", "t": 10.0, "e": 13.67, "p": 79, "r": [[0.4047, 0.1677, 0.3288, 0.0233]]}, {"k": "hi", "t": 11.98, "e": 13.67, "p": 79, "r": [[0.7814, 0.1677, 0.0815, 0.0233]]}, {"k": "hi", "t": 13.67, "e": 16.97, "p": 79, "r": [[0.7814, 0.1677, 0.1016, 0.0233], [0.073, 0.1908, 0.2412, 0.0233]]}], "sp": [[9.38, 0, 80], [13.67, 80, 134], [16.97, 134, 147]]}, {"t0": 18.62, "t1": 24.5, "who": "B", "text": "Remember: last sharp, then the next key up. Second-last flat: that is the key.", "cue": {"p": 79, "r": "remember"}, "mk": [{"k": "hi", "t": 19.05, "e": 21.36, "p": 79, "r": [[0.0964, 0.2499, 0.355, 0.0204]]}, {"k": "hi", "t": 21.36, "e": 22.77, "p": 79, "r": [[0.4646, 0.2499, 0.1766, 0.0204]]}], "sp": [[18.62, 0, 10], [19.05, 10, 44], [21.36, 44, 62], [22.77, 62, 78]]}, {"t0": 24.5, "t1": 36.31, "who": "B", "text": "Three sharps: the last is G sharp, the next key up is A. A major. Three flats: the second-last is E flat. E flat major. One flat alone is F major.", "cue": {"p": 79, "r": "picture"}, "mk": [{"k": "hi", "t": 24.5, "e": 25.7, "p": 79, "r": [[0.4212, 0.6827, 0.1505, 0.0311]]}, {"k": "hi", "t": 25.4, "e": 28.32, "p": 79, "r": [[0.7757, 0.2499, 0.0376, 0.0204], [0.3868, 0.4624, 0.0964, 0.0243]]}, {"k": "key", "t": 27.7, "e": 30.31, "p": 79, "r": [[0.5434, 0.5138, 0.0869, 0.1631]], "n": "A"}, {"k": "hi", "t": 33.68, "e": 36.71, "p": 79, "r": [[0.4663, 0.8011, 0.1736, 0.0175]]}, {"k": "key", "t": 34.85, "e": 36.71, "p": 79, "r": [[0.3697, 0.5138, 0.0869, 0.1631]], "n": "F"}], "sp": [[24.5, 0, 14], [25.4, 14, 57], [28.32, 57, 66], [29.2, 66, 79], [30.31, 79, 106], [32.39, 106, 120], [33.68, 120, 146]]}]}, {"t": "Example: sharps", "f": "audio/S5/03-example-sharps.mp3?v=1795579333", "s": 12, "p": 79, "l": [{"t0": 0.2, "t1": 4.48, "who": "B", "text": "The last sharp is C sharp. Which major key? Pause.", "cue": {"p": 79, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S5-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 27], [1.99, 27, 44], [3.19, 44, 50]]}, {"t0": 4.48, "t1": 7.48, "who": "pause", "text": "Pause and try.", "cue": {"p": 79, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S5-1-q.webp?v=1795579333"}}, {"t0": 7.48, "t1": 10.23, "who": "P", "text": "The next key up is D: D major.", "cue": {"p": 79, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S5-1.webp?v=1795579333"}, "sp": [[7.48, 0, 22], [8.64, 22, 30]], "mk": [{"k": "hi", "t": 7.58, "e": 10.53, "p": 79, "r": [[0.0107, 0.8824, 0.5263, 0.0909]], "pop": "S5-1"}]}, {"who": "B", "text": "Very good, Clara.", "cue": {"p": 79, "r": "pop1"}, "t0": 10.23, "lens": {"k": "pop", "src": "pops/S5-1.webp?v=1795579333"}, "t1": 12.07, "mk": [{"k": "hi", "t": 10.23, "e": 12.27, "p": 79, "r": [[0.0107, 0.8824, 0.5263, 0.0909]], "pop": "S5-1"}]}]}, {"t": "Example: flats", "f": "audio/S5/04-example-flats.mp3?v=1795579333", "s": 20, "p": 79, "l": [{"t0": 0.2, "t1": 5.46, "who": "B", "text": "B flat and E flat. The second-last flat names the key. Pause.", "cue": {"p": 79, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S5-2-q.webp?v=1795579333"}, "sp": [[0.2, 0, 19], [1.85, 19, 55], [4.13, 55, 61]]}, {"t0": 5.46, "t1": 8.46, "who": "pause", "text": "Pause and try.", "cue": {"p": 79, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S5-2-q.webp?v=1795579333"}}, {"who": "P", "text": "The last one, E flat. So E flat major!", "cue": {"p": 79, "r": "pop2"}, "t0": 8.46, "lens": {"k": "pop", "src": "pops/S5-2-q.webp?v=1795579333"}, "t1": 11.7}, {"who": "B", "text": "Careful, detective. For flats it’s the second-last, not the last.", "cue": {"p": 79, "r": "pop2"}, "t0": 11.7, "lens": {"k": "pop", "src": "pops/S5-2-q.webp?v=1795579333"}, "t1": 16.6}, {"t0": 16.6, "t1": 18.54, "who": "P", "text": "B flat major.", "cue": {"p": 79, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S5-2.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 16.7, "e": 18.84, "p": 79, "r": [[0.0106, 0.871, 0.3977, 0.0997]], "pop": "S5-2"}]}, {"t0": 18.54, "t1": 20.29, "who": "B", "text": "Precisely.", "cue": {"p": 79, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/S5-2.webp?v=1795579333"}, "mk": [{"k": "hi", "t": 18.54, "e": 20.49, "p": 79, "r": [[0.0106, 0.871, 0.3977, 0.0997]], "pop": "S5-2"}]}]}], "nx": {"wb": [null, "p. 76", "Scales and keys"], "dr": [["key-signatures", "Major key from sharps: name the key", 13], ["key-signatures", "Major key from flats: name the key", 14]]}}, {"k": "S4", "part": "Part V · Scales and keys", "t": "5 · Relative minor", "pages": [80, 81], "clips": [{"t": "Relative minor", "f": "audio/S4/01-relative-minor.mp3?v=1795579333", "s": 40, "p": 80, "l": [{"t0": 3.4, "t1": 13.02, "who": "B", "text": "Every key signature belongs to two keys, Clara: a major and a minor that share all its notes. The minor is the relative minor.", "cue": {"p": 80, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 6.86, "p": 80, "r": [[0.1292, 0.1377, 0.3159, 0.0193]]}, {"k": "hi", "t": 6.86, "e": 10.2, "p": 80, "r": [[0.4728, 0.1377, 0.3872, 0.0193]]}, {"k": "hi", "t": 10.2, "e": 13.42, "p": 80, "r": [[0.073, 0.0858, 0.352, 0.0486]]}], "sp": [[3.4, 0, 48], [6.86, 48, 94], [10.2, 94, 126]]}, {"t0": 13.02, "t1": 16.79, "who": "P", "text": "Same notes, different home. Like cousins sharing a house.", "cue": {"p": 80, "r": "lead"}, "mk": [{"k": "hi", "t": 13.02, "e": 14.62, "p": 80, "r": [[0.1444, 0.1859, 0.2277, 0.022]]}, {"k": "hi", "t": 14.62, "e": 17.19, "p": 80, "r": [[0.3829, 0.1859, 0.2382, 0.022]]}], "sp": [[13.02, 0, 28], [14.62, 28, 57]]}, {"t0": 16.79, "t1": 23.31, "who": "B", "text": "Remember: from the major key note, go down a minor third. Two keys between, then land.", "cue": {"p": 80, "r": "remember"}, "mk": [{"k": "hi", "t": 17.35, "e": 20.57, "p": 80, "r": [[0.1949, 0.2417, 0.3391, 0.0193]]}, {"k": "hi", "t": 20.57, "e": 23.71, "p": 80, "r": [[0.5882, 0.2417, 0.2969, 0.0193]]}], "sp": [[16.79, 0, 10], [17.35, 10, 58], [20.57, 58, 86]]}, {"t0": 23.31, "t1": 30.13, "who": "B", "text": "From A: G sharp, G, and land on F sharp. Three sharps: A major, or F sharp minor.", "cue": {"p": 80, "r": "picture"}, "mk": [{"k": "key", "t": 23.46, "e": 24.26, "p": 80, "r": [[0.4423, 0.3066, 0.0577, 0.1274]], "n": "A"}, {"k": "hi", "t": 23.66, "e": 26.32, "p": 80, "r": [[0.4333, 0.4549, 0.1473, 0.0293]]}, {"k": "key", "t": 24.34, "e": 27.43, "p": 80, "r": [[0.3847, 0.3066, 0.0577, 0.1274]], "n": "G"}, {"k": "hi", "t": 26.32, "e": 27.52, "p": 80, "r": [[0.6685, 0.4549, 0.1477, 0.0293]]}, {"k": "hi", "t": 27.43, "e": 30.53, "p": 80, "r": [[0.5036, 0.4813, 0.0631, 0.0293], [0.073, 0.5306, 0.0573, 0.0193]]}], "sp": [[23.31, 0, 8], [23.66, 8, 41], [26.32, 41, 55], [27.43, 55, 81]]}, {"t0": 30.13, "t1": 31.67, "who": "piano", "notes": [30.13, 30.75], "cue": {"p": 80, "r": "picture"}, "mk": [{"k": "key", "t": 30.13, "e": 30.75, "r": [[0.4423, 0.3066, 0.0577, 0.1274]], "p": 80}, {"k": "key", "t": 30.75, "e": 31.67, "r": [[0.4243, 0.3066, 0.036, 0.079]], "p": 80}]}, {"t0": 31.67, "t1": 40.24, "who": "B", "text": "C major and A minor. G major and E minor. F major and D minor. Every key signature has its pair.", "cue": {"p": 80, "r": "table"}, "mk": [{"k": "hi", "t": 31.67, "e": 33.69, "p": 80, "r": [[0.3823, 0.7457, 0.3325, 0.0165]]}, {"k": "key", "t": 31.67, "e": 33.69, "p": 80, "r": [[0.5577, 0.3066, 0.0577, 0.1274]], "n": "C"}, {"k": "key", "t": 32.71, "e": 33.69, "p": 80, "r": [[0.4423, 0.3066, 0.0577, 0.1274]], "n": "A"}, {"k": "hi", "t": 33.69, "e": 35.64, "p": 80, "r": [[0.3567, 0.6207, 0.3563, 0.0165]]}, {"k": "hi", "t": 35.64, "e": 37.55, "p": 80, "r": [[0.3567, 0.6957, 0.3584, 0.0165]]}, {"k": "key", "t": 35.64, "e": 40.64, "p": 80, "r": [[0.327, 0.3066, 0.0577, 0.1274]], "n": "F"}, {"k": "key", "t": 36.57, "e": 40.64, "p": 80, "r": [[0.6153, 0.3066, 0.0577, 0.1274]], "n": "D"}, {"k": "hi", "t": 37.55, "e": 40.64, "p": 80, "r": [[0.6936, 0.5306, 0.2035, 0.0193], [0.073, 0.5499, 0.0405, 0.0193]]}], "sp": [[31.67, 0, 21], [33.69, 21, 42], [35.64, 42, 63], [37.55, 63, 96]]}]}, {"t": "Major or minor? The clue note", "f": "audio/S5/02-major-or-minor-the-clue-note.mp3?v=1795579333", "s": 29, "p": 81, "l": [{"t0": 0.2, "t1": 12.53, "who": "B", "text": "A minor key raises its seventh, so a sharp or natural that is not in the key signature is a clue. In A minor, G sharp. In E minor, D sharp. In D minor, C sharp.", "cue": {"p": 81, "r": "h:Major or minor? The clue note"}, "mk": [{"k": "hi", "t": 0.2, "e": 6.46, "p": 81, "r": [[0.348, 0.1107, 0.1218, 0.0243], [0.073, 0.1522, 0.8405, 0.0208]]}, {"k": "hi", "t": 6.46, "e": 8.43, "p": 81, "r": [[0.0861, 0.4, 0.0868, 0.0208]]}, {"k": "hi", "t": 8.43, "e": 10.21, "p": 81, "r": [[0.0861, 0.2738, 0.0833, 0.0208]]}, {"k": "hi", "t": 10.21, "e": 12.93, "p": 81, "r": [[0.0861, 0.3685, 0.086, 0.0208]]}], "sp": [[0.2, 0, 98], [6.46, 98, 119], [8.43, 119, 140], [10.21, 140, 160]]}, {"t0": 12.53, "t1": 23.89, "who": "B", "text": "So: name the major from the signature, find its relative minor, look for the clue notes, and check the last bass note. Pieces nearly always end on the key note.", "cue": {"p": 81, "r": "h:Major or minor? The clue note"}, "mk": [{"k": "hi", "t": 12.82, "e": 20.47, "p": 81, "r": [[0.204, 0.5976, 0.6638, 0.0208], [0.1058, 0.6184, 0.1059, 0.0208], [0.1058, 0.6416, 0.2292, 0.0208]]}, {"k": "hi", "t": 20.47, "e": 24.29, "p": 81, "r": [[0.2707, 0.6647, 0.4481, 0.0208]]}], "sp": [[12.53, 0, 4], [12.82, 4, 119], [20.47, 119, 160]]}, {"who": "P", "text": "So the clue note gives it away.", "cue": {"p": 81, "r": "h:Major or minor? The clue note"}, "t0": 23.89, "t1": 26.25, "mk": [{"k": "hi", "t": 23.89, "e": 26.65, "p": 81, "r": [[0.348, 0.1107, 0.1218, 0.0243]]}]}, {"who": "B", "text": "Elementary, my dear Clara.", "cue": {"p": 81, "r": "h:Major or minor? The clue note"}, "t0": 26.25, "t1": 29.01}]}, {"t": "Example: C major", "f": "audio/S4/02-example-c-major.mp3?v=1795579333", "s": 15, "p": 80, "l": [{"t0": 0.2, "t1": 6.13, "who": "B", "text": "Start on C and count two keys between, going down. Where do you land? Pause.", "cue": {"p": 80, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S4-1-q.webp?v=1795579333"}, "sp": [[0.2, 0, 51], [3.72, 51, 70], [4.8, 70, 76]]}, {"t0": 6.13, "t1": 9.13, "who": "pause", "text": "Pause and try.", "cue": {"p": 80, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S4-1-q.webp?v=1795579333"}}, {"t0": 9.13, "t1": 12.17, "who": "P", "text": "B, B flat, and land on A: A minor.", "cue": {"p": 80, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S4-1.webp?v=1795579333"}, "mk": [{"k": "key", "t": 9.13, "e": 12.57, "p": 80, "r": [[0.4465, 0.1691, 0.0764, 0.3866]], "n": "B", "pop": "S4-1"}, {"k": "key", "t": 10.36, "e": 12.57, "p": 80, "r": [[0.3702, 0.1691, 0.0764, 0.3866]], "n": "A", "pop": "S4-1"}, {"k": "key", "t": 9.28, "e": 12.57, "p": 80, "r": [[0.4244, 0.1691, 0.0442, 0.232]], "n": "B♭", "pop": "S4-1"}], "sp": [[9.13, 0, 26], [10.82, 26, 34]]}, {"t0": 12.17, "t1": 13.79, "who": "B", "text": "Splendid.", "cue": {"p": 80, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S4-1.webp?v=1795579333"}}, {"t0": 13.79, "t1": 15.33, "who": "piano", "notes": [13.79, 14.41], "cue": {"p": 80, "r": "pop1"}, "lens": {"k": "pop", "src": "pops/S4-1.webp?v=1795579333"}, "mk": [{"k": "key", "t": 13.79, "e": 15.25, "p": 80, "r": [[0.5229, 0.1691, 0.0764, 0.3866]], "n": "C", "snd": 1, "pop": "S4-1"}, {"k": "key", "t": 14.41, "e": 15.25, "p": 80, "r": [[0.3702, 0.1691, 0.0764, 0.3866]], "n": "A", "snd": 1, "pop": pops/S5-7.webp?v=1795579333"}, "sp": [[0.2, 0, 83], [5.84, 83, 92], [6.84, 92, 145]]}, {"t0": 10.92, "t1": 13.7, "who": "piano", "notes": [10.92, 11.54, 12.16], "cue": {"p": 81, "r": "pop7"}, "lens": {"k": "pop", "src": "pops/S5-7.webp?v=1795579333"}}, {"who": "B", "text": "Your little task for next time: be a detective. Pick a piece, and find its key from the signature, the clue notes and the last note. Until next time.", "cue": {"p": 81, "r": "pop7"}, "lens": {"k": "pop", "src": "pops/S5-7.webp?v=1795579333"}, "t0": 13.9, "t1": 23.58}]}], "nx": {"wb": [null, "p. 77", "Scales and keys"], "dr": [["key-signatures", "Relative minor: name the minor key", 16], ["key-signatures", "The last note: which key is the piece in?", 17]]}}, {"k": "S6", "part": "Part V · Scales and keys", "t": "6 · The circle of fifths", "pages": [82, 83], "clips": [{"t": "The circle of fifths", "f": "audio/S6/01-the-circle-of-fifths.mp3?v=1795579333", "s": 23, "p": 82, "l": [{"t0": 3.4, "t1": 7.34, "who": "P", "text": "What is that giant clock on the page? Is it time for lunch?", "cue": {"p": 82, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 5.52, "p": 82, "r": [[0.3129, 0.2256, 0.2442, 0.0278]]}, {"k": "hi", "t": 5.52, "e": 7.74, "p": 82, "r": [[0.6311, 0.2256, 0.1492, 0.0278]]}], "sp": [[3.4, 0, 38], [5.52, 38, 59]]}, {"t0": 7.34, "t1": 17.96, "who": "B", "text": "Not quite, Clara. Twelve major keys sit around one clock face, with C at twelve o’clock. Read this clock and you can name any key signature in seconds.", "cue": {"p": 82, "r": "lead"}, "mk": [{"k": "hi", "t": 8.61, "e": 13.67, "p": 82, "r": [[0.1612, 0.1649, 0.7222, 0.0243]]}, {"k": "hi", "t": 13.67, "e": 18.36, "p": 82, "r": [[0.073, 0.1935, 0.7538, 0.0243]]}], "sp": [[7.34, 0, 18], [8.61, 18, 89], [13.67, 89, 151]]}, {"t0": 17.96, "t1": 22.5, "who": "B", "text": "Remember: go right, one more sharp. Go left, one more flat.", "cue": {"p": 82, "r": "remember"}, "mk": [{"k": "hi", "t": 18.38, "e": 20.3, "p": 82, "r": [[0.1009, 0.3029, ues", "f": "audio/M7/01-the-twelve-bar-blues.mp3?v=1795579333", "s": 58, "p": 113, "l": [{"t0": 3.4, "t1": 10.76, "who": "B", "text": "Blues, boogie-woogie and early rock ’n’ roll all ride on one pattern of chords, Clara, twelve bars long.", "cue": {"p": 113, "r": "lead"}, "mk": [{"k": "hi", "t": 3.4, "e": 11.16, "p": 113, "r": [[0.5443, 0.0887, 0.1611, 0.0614]]}, {"k": "hi", "t": 3.84, "e": 11.16, "p": 113, "r": [[0.1511, 0.1867, 0.7317, 0.0243], [0.073, 0.2153, 0.08, 0.0243]]}, {"k": "hi", "t": 8.84, "e": 11.16, "p": 113, "r": [[0.1662, 0.2153, 0.1916, 0.0243]]}]}, {"t0": 10.76, "t1": 18.11, "who": "B", "text": "Remember: twelve bars, three chords. Four of one, two of four, two of one, then five, four, one, five.", "cue": {"p": 113, "r": "remember"}, "mk": [{"k": "hi", "t": 11.15, "e": 13.12, "p": 113, "r": [[0.1009, 0.3132, 0.3389, 0.0243]]}, {"k": "hi", "t": 13.12, "e": 18.51, "p": 113, "r": [[0.4554, 0.3132, 0.0518, 0.0243]]}, {"k": "hi", "t": 14.45, "e": 18.51, "p": 113, "r": [[0.5796, 0.3132, 0.047, 0.0243]]}, {"k": "hi", "t": 16.1, "e": 18.51, "p": 113, "r": [[0.4554, 0.3132, 0.0518, 0.0243]]}, {"k": "hi", "t": 16.46, "e": 18.51, "p": 113, "r": [[0.7149, 0.1867, 0.044, 0.0243]]}], "sp": [[10.76, 0.0, 10], [11.15, 10.0, 37], [13.12, 37.0, 102]]}, {"t0": 18.11, "t1": 35.81, "who": "piano", "notes": [18.11, 19.56, 21.01, 22.46, 23.91, 25.36, 26.81, 28.26, 29.71, 31.16, 32.61, 34.06], "cue": {"p": 113, "r": "picture"}}, {"t0": 35.81, "t1": 39.56, "who": "B", "text": "Make it bluesy: turn every chord into a seventh.", "cue": {"p": 113, "r": "picture"}, "mk": [{"k": "hi", "t": 35.81, "e": 37.01, "p": 113, "r": [[0.4808, 0.5633, 0.1496, 0.0208]]}, {"k": "hi", "t": 36.92, "e": 39.96, "p": 113, "r": [[0.6419, 0.5633, 0.2347, 0.0208], [0.4808, 0.5885, 0.0806, 0.0208]]}], "sp": [[35.81, 0.0, 16], [36.92, 16.0, 48]]}, {"who": "P", "text": "I feel like I should be wearing sunglasses and a cool hat.", "cue": {"p": 113, "r": "picture"}, "t0": 39.56, "t1": 43.24}, {"who": "K", "text": "I played the blues once. The Queen asked me to stop.", "cue": {"p": 113, "r": "picture"}, "t0": 43.24, "t1": 47.4, "sp": [[43.24, 0, 25], [45.02, 25, 52]]}, {"t0": 47.4, "t1": 53.5, "who": "piano", "notes": [47.4, 48.85, 50.3, 51.75], "cue": {"p": 113, "r": "picture"}}, {"t0": 53.5, "t1": 58.1, "who": "B", "text": "And that is the end of Part Seven, Clara. Until next time.", "cue": {"p": 113, "r": "picture"}, "sp": [[53.5, 7.84, 42], [56.25, 49.84, 58]]}]}], "nx": {"wb": [null, "p. 109", "Chords and harmony"], "dr": [["styles", "The 12-bar blues", 5]]}}, {"k": "O8", "part": "Part VIII · Shape and style", "t": "Part opener", "pages": [114], "clips": [{"t": "Part Eight: Shape and style", "f": "audio/O8/01-part-eight-shape-and-style.mp3?v=1795579333", "s": 61, "p": 114, "l": [{"t0": 3.4, "t1": 8.52, "who": "B", "text": "Welcome to Part Eight, Clara: Shape and style. How music is built.", "cue": {"p": 114, "r": "opener"}, "mk": [{"k": "hi", "t": 5.34, "e": 6.69, "p": 114, "r": [[0.073, 0.2235, 0.4838, 0.0641]]}, {"k": "hi", "t": 6.69, "e": 8.92, "p": 114, "r": [[0.1251, 0.2898, 0.1407, 0.0214]]}], "sp": [[3.4, 0, 30], [5.34, 30, 47], [6.69, 47, 66]]}, {"t0": 8.52, "t1": 22.55, "who": "B", "text": "Step back from the notes and see the building: small ideas, repeated and moved, in sections that come and go. Listen: an idea, the same idea again, something new, and the first idea once more.", "cue": {"p": 114, "r": "opener"}, "sp": [[8.52, 0, 47], [10.93, 47, 110], [16.06, 110, 118], [16.83, 118, 192]]}, {"t0": 22.55, "t1": 43.31, "who": "piano", "notes": [22.55, 23.17, 23.79, 24.41, 25.03, 25.65, 26.27, 27.51, 28.13, 28.75, 29.37, 29.99, 30.61, 31.23, 32.47, 33.09, 33.71, 34.33, 34.95, 35.57, 36.19, 36.81, 38.05, 38.67, 39.29, 39.91, 40.53, 41.15, 41.77], "cue": {"p": 114, "r": "opener"}}, {"t0": 43.31, "t1": 45.39, "who": "P", "text": "It came home at the end!", "cue": {"p": 114, "r": "opener"}}, {"t0": 45.39, "t1": 59.79, "who": "B", "text": "Seven chapters: ]}], "sp": [[17.62, 0, 12], [18.57, 12, 33]]}, {"t0": 20.77, "t1": 26.03, "who": "piano", "notes": [20.77, 21.39, 22.01, 22.63, 23.25, 23.87, 24.49, 25.11], "cue": {"p": 117, "r": "table"}}, {"t0": 26.03, "t1": 30.06, "who": "B", "text": "Sequence: the same shape, starting higher or lower.", "cue": {"p": 117, "r": "table"}, "mk": [{"k": "hi", "t": 26.6, "e": 30.46, "p": 117, "r": [[0.3835, 0.7609, 0.3931, 0.0208]]}], "sp": [[26.03, 0, 10], [26.6, 10, 51]]}, {"t0": 30.06, "t1": 37.8, "who": "piano", "notes": [30.06, 30.68, 31.3, 31.92, 32.54, 33.16, 33.78, 34.4, 35.02, 35.64, 36.26, 36.88], "cue": {"p": 117, "r": "table"}}, {"t0": 37.8, "t1": 43.06, "who": "B", "text": "Imitation: another hand copies it. And contrast: something new.", "cue": {"p": 117, "r": "table"}, "mk": [{"k": "hi", "t": 38.69, "e": 40.34, "p": 117, "r": [[0.3423, 0.7924, 0.3132, 0.0208]]}, {"k": "hi", "t": 41.37, "e": 43.46, "p": 117, "r": [[0.3423, 0.824, 0.1631, 0.0208]]}], "sp": [[37.8, 0, 11], [38.69, 11, 35], [40.34, 35, 49], [41.37, 49, 63]]}, {"t0": 43.06, "t1": 48.32, "who": "piano", "notes": [43.06, 43.68, 44.3, 44.92], "cue": {"p": 117, "r": "table"}}]}, {"t": "Example: repetition or sequence?", "f": "audio/F3/02-example-repetition-or-sequence.mp3?v=1795579333", "s": 16, "p": 117, "l": [{"t0": 0.2, "t1": 6.38, "who": "B", "text": "Bar one, bar two, bar three: the same notes, or the same shape on new notes? Pause.", "cue": {"p": 117, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/F3-2-q.webp?v=1795579333"}, "sp": [[0.2, 0, 29], [2.24, 29, 77], [5.12, 77, 83]]}, {"t0": 6.38, "t1": 10.38, "who": "pause", "text": "Pause and try.", "cue": {"p": 117, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/F3-2-q.webp?v=1795579333"}}, {"t0": 10.38, "t1": 13.96, "who": "P", "text": "The same shape, a step higher each bar: a sequence.", "cue": {"p": 117, "r": "pop2"}, "lens": {"k": "pop", "src": "pops/F3-2.webp?v=1795579333"}, "sp": [[10.38, 0, 40], [12.54, 40, 51]], "mk": [{"k": "hi", "t": 10.48, "e":
