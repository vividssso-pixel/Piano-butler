<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light only">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 6 L16 16 L3 26 Z' fill='none' stroke='%2326296b' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M29 6 L16 16 L29 26 Z' fill='none' stroke='%2326296b' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23e4572e'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Piano Butler — Join</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#faf6ec; --surface:#fffefa; --border:#e9e2d2; --text:#26296b; --muted:#6d6f9c;
      --accent:#26296b; --coral:#e4572e; --good:#2e8a6e; --bad:#c8361b; --navy:#26296b; --navy-line:rgba(38,41,107,0.14);
    }
    *, *::before, *::after { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
    h1 { font-family: 'Playfair Display', Georgia, serif; letter-spacing: -0.005em; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 400px; background: var(--surface); border-radius: 16px;
      border: 1.5px solid var(--navy-line); box-shadow: 0 4px 18px rgba(38,41,107,0.05); overflow: hidden;
    }
    .header { padding: 30px 32px 0; text-align: center; }
    .header svg { display: block; margin: 0 auto 8px; }
    .header h1 { margin: 0; font-size: 28px; font-weight: 900; color: var(--navy); line-height: 1.15; }
    .header p { margin: 6px 0 0; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .staff { height: 20px; margin: 22px 0 0; background-image: repeating-linear-gradient(to bottom, transparent 0 3px, var(--navy) 3px 4.2px); background-size: 100% 20px; background-repeat: no-repeat; opacity: 0.9; }
    .body { padding: 24px 32px 30px; }
    label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; font-size: 15px; font-weight: 500; border-radius: 12px;
      border: 1.5px solid var(--navy-line); outline: none; color: var(--text); background: #fff; margin-bottom: 16px; transition: border 0.15s;
    }
    input:focus { border-color: var(--navy); }
    input::placeholder { color: #a9aac8; }
    .pw-wrap { position: relative; margin-bottom: 16px; }
    .pw-wrap input { margin-bottom: 0; padding-right: 64px; }
    .pw-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700;
      background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px 6px;
    }
    .error-box { font-size: 13px; font-weight: 600; color: var(--bad); background: #fbe3da; border: 1.5px solid #f3c2b2; border-radius: 10px; padding: 9px 12px; margin-bottom: 16px; }
    .ok-box { font-size: 13px; font-weight: 600; color: var(--good); background: #e5f3ee; border: 1.5px solid #bfe0d3; border-radius: 10px; padding: 9px 12px; margin-bottom: 16px; }
    .submit-btn {
      width: 100%; padding: 13px 0; font-size: 15px; font-weight: 700; font-family: inherit; border-radius: 12px; border: none;
      background: var(--navy); color: #fff; cursor: pointer; transition: background 0.15s;
    }
    .submit-btn:hover { background: #1b1d52; }
    .submit-btn:disabled { background: #a9aac8; cursor: not-allowed; }
    .link-btn {
      width: 100%; margin-top: 12px; padding: 11px 0; font-size: 13px; font-weight: 600; font-family: inherit;
      border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); color: #4a4d86; cursor: pointer; transition: all 0.15s;
    }
    .link-btn:hover { border-color: var(--navy); color: var(--navy); }
    .link-btn:disabled { color: #a9aac8; cursor: not-allowed; }
    .footer-note { margin: 20px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
  </style>
  <style>
    .choice { display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:10px; border-radius:14px; border:1.5px solid var(--navy-line); background:#fff; cursor:pointer; font-family:inherit; color:var(--navy); }
    .choice b { display:block; font-size:16px; }
    .choice span { display:block; font-size:13px; color:var(--muted); margin-top:3px; line-height:1.4; }
    .choice.on { border-color:var(--navy); box-shadow:0 0 0 2px var(--navy) inset; }
    .gift { font-size:13px; color:var(--muted); line-height:1.5; margin:0 0 16px; }
    .gift b { color:var(--good); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <svg width="56" height="34" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 6 L16 16 L3 26 Z" fill="none" stroke="#26296b" stroke-width="2.4" stroke-linejoin="round"/><path d="M29 6 L16 16 L29 26 Z" fill="none" stroke="#26296b" stroke-width="2.4" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.6" fill="#e4572e"/></svg>
      <h1>Piano Butler</h1>
      <p>Join for free</p>
    </div>
    <div class="staff"></div>
    <div class="body">
      <div id="step1">
        <button class="choice" id="c-teacher" type="button"><b>I have a piano teacher</b><span>Your teacher sends you your own link. Open it and everything is ready.</span></button>
        <button class="choice" id="c-own" type="button"><b>I'm learning on my own</b><span>Your butler plans each week, keeps your practice record and shows you what comes next.</span></button>
        <div id="teacher-note" class="ok-box" style="display:none">Ask your teacher for your student link. Nothing else to do here.</div>
      </div>
      <form id="own" style="display:none" autocomplete="on">
        <p class="gift">Free with an account: <b>Level 0 and Level ½, every room</b>, your practice record and your cards.</p>
        <label for="name">Your first name</label>
        <input id="name" name="given-name" autocomplete="given-name" placeholder="e.g. Clara" required>
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        <div id="err" class="error-box" style="display:none"></div>
        <div id="ok" class="ok-box" style="display:none"></div>
        <button class="submit-btn" id="go" type="submit">Email me a sign-in link</button>
        <p class="footer-note">No password. The link signs you in on this device.</p>
      </form>
      <div id="already" class="ok-box" style="display:none"></div>
    </div>
  </div>
  <script>
    const SUPABASE_URL  = "https://icefqxaccclwasnfzgnp.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljZWZxeGFjY2Nsd2FzbmZ6Z25wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNjgzMTgsImV4cCI6MjA5MjY0NDMxOH0.lZ8BO_L8iOtET8RtUuk9trkf9bQbLqR8K6rKEfPtmtQ";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    const $ = (id) => document.getElementById(id);
    const drills = window.location.origin + window.location.pathname.replace(/[^/]*$/, "") + "drills.html?teacher=0&view=today";
    _supabase.auth.getSession().then(({ data }) => {
      const u = data && data.session && data.session.user;
      if (u && u.user_metadata && u.user_metadata.role === "learner") { $("already").style.display = "block"; $("already").innerHTML = 'You are signed in. <a href="' + drills + '">Go to your practice ›</a>'; $("step1").style.display = "none"; }
    });
    $("c-teacher").onclick = () => { $("c-teacher").classList.add("on"); $("c-own").classList.remove("on"); $("teacher-note").style.display = "block"; $("own").style.display = "none"; };
    $("c-own").onclick = () => { $("c-own").classList.add("on"); $("c-teacher").classList.remove("on"); $("teacher-note").style.display = "none"; $("own").style.display = "block"; $("name").focus(); };
    $("own").onsubmit = async (e) => {
      e.preventDefault(); $("err").style.display = "none"; $("ok").style.display = "none";
      const email = $("email").value.trim(), name = $("name").value.trim().slice(0, 40);
      if (!email || !name) return;
      $("go").disabled = true; $("go").textContent = "Sending…";
      const { error } = await _supabase.auth.signInWithOtp({ email, options: { shouldCreateUser: true, data: { role: "learner", name }, emailRedirectTo: drills } });
      $("go").disabled = false; $("go").textContent = "Email me a sign-in link";
      if (error) { $("err").textContent = "Couldn't send the link: " + error.message; $("err").style.display = "block"; return; }
      $("ok").textContent = "Check your email for the link, then open it on this device."; $("ok").style.display = "block";
    };
  </script>
</body>
</html>
